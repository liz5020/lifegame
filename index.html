// 轉進帳號(帳號有空格時，玩家手動)：不發啟程禮，這段人生剩下的行動點併入錢包
async function acctTransferCurrentLife(){
  const s = state;
  if(!acct || !s || s.phase!=="playing" || walletActive(s)) return false;
  const lives = collectDeviceLives().filter(it=>it.st===s);
  if(!lives.length) return false;
  const r = await acctFetch("account/lives", { op:"attach", lives: lives.map(it=>({ lid:it.lid, pool:it.pool })) });
  if(!r.ok){ showWriterToast(r.data && r.data.error==="account_full" ? "撰稿人提醒你：帳號已滿 2 段人生。" : "撰稿人提醒你：這次沒能轉進帳號，請稍後再試。"); return false; }
  acctSetAccount(r.data.account);
  const applied = acctApplyAttach(lives, r.data.result);
  acctApplyEvents(r.data.events);
  if(!applied.accepted.length){ showWriterToast("撰稿人提醒你：帳號已滿 2 段人生。"); return false; }
  saveGame(); render();
  acctCloudSaveAccepted(applied.accepted);
  return true;
}
// 帳號人生的雲端位置：一律存在帳號的復原金鑰底下(換裝置登入後從「拿回存到雲端的進度」看得到)。格子從這把金鑰的雲端3格裡挑：
// 已經存過這段人生(meta.lid相同)就沿用，否則挑第一個空格；不會蓋掉留在這把金鑰上的其他人生
async function acctPickCloudSlot(key, lid){
  try{
    const res = await fetch(WORKER_URL+"slots?key="+encodeURIComponent(key));
    const data = await res.json();
    if(!(data && data.success && Array.isArray(data.slots))) return -1;
    const same = data.slots.findIndex(x=>x && x.meta && x.meta.lid===lid);
    if(same>=0) return same;
    return data.slots.findIndex(x=>!x || !x.meta);
  }catch(e){ return -1; }
}
async function acctCloudSaveAccepted(accepted){
  // 綁定／併入是玩家主動做的事，等同按了一次「存到雲端」(10.8.1)：每段收進帳號的人生上傳一次；失敗不打擾(玩家隨時可以自己按)
  // 十、10.2.3.1 B2(2026-10-02定案)：示範模式的內容不是AI寫的，綁定／登入併入時不上傳，示範存檔不進伺服器與管理端名冊(比照10.13.3⑤)
  if(USE_MOCK) return;
  for(const it of accepted){
    try{
      const st = it.st;
      if(!st.cloudHome || st.cloudHome.key!==acct.recovery_key){
        const slot = await acctPickCloudSlot(acct.recovery_key, st.acct.lid);
        if(slot<0) continue;
        st.cloudHome = { key: acct.recovery_key, slot };
      }
      const up = await cloudUploadState(st, st.cloudHome, { name:st.name, age:st.age, stage:stageLabel(st.age), updatedAt:Date.now(), lid: st.acct.lid });
      if(up.ok){ st.lastManualCloudSaveAt = Date.now(); if(st!==state){ try{ localStorage.setItem(STORAGE_KEY+":"+it.slot, JSON.stringify(st)); }catch(e){} } else saveLocalOnly(); }
    }catch(e){ console.warn("綁定後存到雲端失敗", e); }
  }
}

function applyLifestyleChange(draft){
  const s = state;
  const from = {}, to = {};
  LIFESTYLE_SETTINGS.forEach(x=>{
    const v = draft[x.key];
    if(!v || v===s[x.key]) return;
    const opt = x.options(s).find(o=>o.value===v);
    if(!opt || opt.locked) return; // 防呆：鎖住的選項不能選
    from[x.key] = s[x.key]; to[x.key] = v; s[x.key] = v;
  });
  if(!Object.keys(to).length) return;
  if(to.mealArrangement==="自己打理") s.cookingInterestSeed = true; // 5.5／3.4.10興趣系統伏筆(原本只寫在解鎖視窗)
  // 下一回合payload通知AI一次(同一回合改好幾次，保留最早的from)
  const prev = s.lifestyleChangeLog;
  s.lifestyleChangeLog = { from: Object.assign({}, from, prev ? prev.from : {}), to: Object.assign({}, prev ? prev.to : {}, to) };
  Object.keys(s.lifestyleChangeLog.to).forEach(k=>{ if(s.lifestyleChangeLog.from[k]===s.lifestyleChangeLog.to[k]){ delete s.lifestyleChangeLog.from[k]; delete s.lifestyleChangeLog.to[k]; } });
  if(!Object.keys(s.lifestyleChangeLog.to).length) s.lifestyleChangeLog = null;
  saveGame(); render();
}

// 9.5.1 轉系結果判定：抽出成純函式方便測試，不依賴DOM。mainChoice: "stay"/"apply"/"wait"；targetKey僅在apply時需要
// 十一、11.4（2026-09-23新增）：收錄為明牌檢定節點，回傳{success,roll,probPct,majorLabel}供UI揭曉骰值細節，取代原本直接Math.random()判定不現骰值的做法
function resolveTransferOffer(s, mainChoice, targetKey){
  s.transferCooldown = TRANSFER_COOLDOWN_TURNS;
  s.examBelowExpectationStreak = 0;
  if(mainChoice==="apply" && targetKey){
    const cat = findMajorCategory(targetKey);
    if(!cat) return null;
    // 十六、16.2.2/16.2.3：申請轉系算冒險＋偏離常規；考試失利後申請轉系算「轉向」、留在原系算「重來」
    logPlayStyleRisk(s, 1); logPlayStyleDeviation(s); logPlayStyleSetbackResponse(s, "pivot", ["exam_fail"]);
    // 9.5.1【定案】結果判定複用2.4考試成績算法（2026-09-27使用者同意Claude建議）：rollFinalExamCheck(才識, 本學期讀書次數)，
    // 最終分數≥60(EXAM_CHECK_PASS_THRESHOLD)算轉系成功，取代原本另設的0.3＋才識×0.5＋自律修正公式
    const examCheck = rollFinalExamCheck(s.stats.knowledge, s.studyCountThisTerm||0);
    const success = examCheck.passed;
    const roll = examCheck.roll, probPct = null;
    if(success){
      const isFive = cat.isFiveYearEligible && isTransferFeasible(s.age,5,s.collegeDelayYearsUsed);
      const gradeBefore = s.timeState.yearInStage || 1;
      assignStudentMajor(s, targetKey, isFive);
      s.timeState.yearInStage = 1; // 9.5.1【定案】不做學分抵免判斷，一律從大一重新起算
      // 十六、16.8（2026-09-28定案）：保留原學生證，原系別旁加蓋「○年級轉入○○系」章；轉系只選到學群，系別由程式從9.2清單代選
      const dept = pick((MAJOR_DEPARTMENTS[targetKey]||[]).filter(d=>isFive ? FIVE_YEAR_DEPARTMENTS.includes(d) : !FIVE_YEAR_DEPARTMENTS.includes(d))) || pick(MAJOR_DEPARTMENTS[targetKey]||[cat.label]);
      s.studentDepartment = dept;
      addStudentCardStamp(s, `${GRADE_WORDS[gradeBefore-1]||gradeBefore}年級轉入${deptWithXi(dept)}`, "transfer");
      s.universityEventLog = { type:"transfer_success", major: cat.label, department: dept };
    } else {
      s.universityEventLog = { type:"transfer_failed", major: cat.label };
    }
    return { success, roll, probPct, majorLabel: cat.label, examCheck };
  } else if(mainChoice==="stay"){
    logPlayStyleRisk(s, -1); logPlayStyleSetbackResponse(s, "retry", ["exam_fail"]);
    s.universityEventLog = { type:"transfer_declined" };
  }
  return null;
}

function resolveWithdrawalOffer(s, choice){
  // 9.8.1（2026-09-22修正）：休學可用條件改為兩項都要成立，不再只看delay_years上限（防呆，UI也會先擋，這裡是程式層再把關一次）
  if(choice==="leave" && !isAnotherLeaveFeasible(s)) return;
  // 十六、16.2.2/16.2.3：休學、肄業算偏離常規；挫折後休學算「休息」、肄業算「轉向」、撐下去算「重來」
  if(choice==="leave" || choice==="withdraw") logPlayStyleDeviation(s);
  logPlayStyleSetbackResponse(s, choice==="leave" ? "rest" : choice==="withdraw" ? "pivot" : "retry", null);
  if(choice==="leave"){
    // 9.8：delay_years最小粒度0.5年對應休一學期，記一次0.5年代價（只作帳本用途，不再加進畢業門檻，見9.8.1）
    s.collegeDelayYearsUsed = clamp((s.collegeDelayYearsUsed||0)+0.5, 0, COLLEGE_DELAY_CAP);
    // 9.5.3（9/16補充）：記錄休學當下正在哪個學期（上學期0~6段 or 下學期7~13段），供復學時重置回該學期開頭，該學期視為未完成不計入進度
    s.leaveSemesterHalfIndex = (s.timeState.segmentIndex||0) < SEMESTER_PHASES.length ? 0 : SEMESTER_PHASES.length;
    s.leaveStatus = "onLeave";
    s.leaveResumeCountdown = LEAVE_OF_ABSENCE_TURNS;
    s.lowHealthStreak = 0; s.lowCashStreak = 0; // 復學視為重新開始，不然同樣的低點會立刻再次觸發候選
    s.universityEventLog = { type:"leave_of_absence" };
  } else if(choice==="withdraw"){
    s.studentStatus = "withdrawn"; // 九、9.5.3（2026-09-22定案）：肄業後不可重新入學，本函式與其他任何地方都不會把studentStatus從withdrawn改回enrolled
    s.timeState.stageMode = "career";
    applyHalfYearCarryOnCareerEntry(s); // 9.8.1：帶著halfYearCarry=1肄業時，當年度回合預算設為一半
    s.universityEventLog = { type:"withdrawn" };
  } else {
    // 2026-09-27修正：選「撐下去」後原本下一回合會立刻再跳。冷卻回合數沿用觸發門檻WITHDRAWAL_STREAK_TRIGGER，
    // 不動lowHealthStreak（過勞訊號與轉職候選共用），冷卻期滿後若仍持續低值才再提
    s.withdrawalOfferCooldown = WITHDRAWAL_STREAK_TRIGGER;
  }
}

function renderBusinessLaunchModal(pending){
  const s = state;
  const capital = computeStartupCapitalRequired();
  const div = document.createElement("div");
  div.id = "business-launch-modal";
  div.className = "modal-backdrop";
  // 12.9（2026-09-27）：合夥選項依團隊值機率出現；2026-09-27另補上現金足夠時也能選「先不創業」(原本只有一顆啟動按鈕)
  const partner = findBusinessPartnerCandidate(s);
  const offerPartner = partner && Math.random() < partnerOptionProb(s);
  const partnerCapital = Math.round(capital*PARTNER_CAPITAL_SHARE);
  const affordable = s.cash >= capital;
  const partnerAffordable = offerPartner && s.cash >= partnerCapital;
  div.innerHTML = `
    <div class="modal">
      <h3>要開始創業嗎？</h3>
      <p style="font-size:13px;">啟動門檻：現金需≥${capital}（目前現金：${Math.round(s.cash)}）</p>
      ${affordable ? `<button class="primary-btn" id="btn-business-launch-solo" style="margin:10px 6px 0 0;">自己來，啟動創業</button>` : `<p style="font-size:14px;margin-top:6px;">現金還不夠自己一個人開始。</p>`}
      ${offerPartner ? `<button class="ghost-btn" id="btn-business-launch-partner" ${partnerAffordable?"":"disabled"} style="display:block;margin:8px 0;${partnerAffordable?"":"opacity:0.4;"}">找${escapeHtml(partner.name)}合夥（啟動資金減半為${partnerCapital}，之後收入分三成給對方）</button>` : ""}
      <button class="ghost-btn" id="btn-business-launch-decline" style="margin-top:10px;">先不創業</button>
    </div>`;
  document.body.appendChild(div);
  const finish = (launched)=>{
    // 十二、12.11.1（2026-09-22新增）：若這次創業候選來自職涯伏筆的創業線，結算候選狀態(接受/拒絕)
    if(pending && pending.foreshadowLine) closeForeshadowCandidate(s, pending.foreshadowLine, launched);
    div.remove(); saveGame(); render();
  };
  const solo = document.getElementById("btn-business-launch-solo");
  if(solo) solo.onclick = ()=> finish(launchBusiness(s));
  const withPartner = document.getElementById("btn-business-launch-partner");
  if(withPartner && partnerAffordable) withPartner.onclick = ()=> finish(launchBusiness(s, { partnerName: partner.name }));
  document.getElementById("btn-business-launch-decline").onclick = ()=> finish(false);
}

const ENDING_RADAR_STATS = [["health","健康"],["knowledge","才識"],["expression","表達力"],["appearance","外表"],["network","人脈"]];
function endingStatValue(s, k){ return Math.round(k==="appearance" ? (s.appearance||0) : ((s.stats||{})[k]||0)); }
function renderEndingRadar(s){
  const cx=110, cy=104, R=78;
  const pt = (i, r)=>{ const ang = -Math.PI/2 + i*2*Math.PI/5; return [cx + r*Math.cos(ang), cy + r*Math.sin(ang)]; };
  const ring = (f)=>ENDING_RADAR_STATS.map((_,i)=>pt(i, R*f).map(v=>v.toFixed(1)).join(",")).join(" ");
  const vals = ENDING_RADAR_STATS.map(([k])=>clamp(endingStatValue(s,k),0,100));
  const poly = vals.map((v,i)=>pt(i, R*v/100).map(x=>x.toFixed(1)).join(",")).join(" ");
  const labels = ENDING_RADAR_STATS.map(([k,l],i)=>{ const [x,y] = pt(i, R+18); return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle">${l} ${vals[i]}</text>`; }).join("");
  return `<svg class="end-radar" viewBox="0 0 220 210" role="img" aria-label="五項能力：${ENDING_RADAR_STATS.map(([k,l],i)=>l+vals[i]).join("、")}">
    ${[1,0.66,0.33].map(f=>`<polygon points="${ring(f)}" class="rg"/>`).join("")}
    ${ENDING_RADAR_STATS.map((_,i)=>{ const [x,y]=pt(i,R); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="rg"/>`; }).join("")}
    <polygon points="${poly}" class="rv"/>${labels}</svg>`;
}

  const text = await res.text();

  if(isDailyCapResponse(res, data)){ noteDailyCapBlocked(); const err = new Error("今天的故事額度已用完"); err.dailyCap = true; throw err; }
  if(data && data.lifegame && data.lifegame.ap) syncServerAP(s, data.lifegame.ap);
  if(data && data.lifegame && data.lifegame.wallet) syncWallet(data.lifegame.wallet); // 十、10.9.2：伺服器成功後才扣5點，回傳最新錢包
  if(data && data.lifegame && data.lifegame.usage) addDevUsage(s, Object.assign({}, data.lifegame.usage, { sys_chars:data.lifegame.sys_chars||0 }), { kind:"review", inChars:{ stats:JSON.stringify(m).length }, outChars:outputBlockChars(data) });

const SHARE_URL = "https://draftmylife.com/"; // 2026-10-04起分享連結用正式網域(舊網址lifegame-6an.pages.dev仍可玩)
function wrapCanvasText(ctx, text, maxWidth){
  const lines = []; let line = "";
  for(const ch of Array.from(String(text||""))){
    if(ctx.measureText(line+ch).width > maxWidth && line){ lines.push(line); line = ch; } else line += ch;
  }
  if(line) lines.push(line);
  return lines;
}
function drawEndingShareCard(s){
  const canvas = document.createElement("canvas");
  canvas.width = 1080; canvas.height = 1350;
  const ctx = canvas.getContext && canvas.getContext("2d");
  if(!ctx) return null;
  const W = canvas.width, serif = '"Noto Serif TC","Songti TC",serif', sans = '"PingFang TC","Noto Sans TC",sans-serif';
  ctx.fillStyle = "#F7F0E3"; ctx.fillRect(0,0,W,canvas.height);
  [[180,260,340,"rgba(232,96,76,.28)"],[900,1100,380,"rgba(240,160,75,.28)"],[960,120,280,"rgba(185,211,234,.4)"]].forEach(([x,y,r,c])=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); });
  ctx.textAlign = "center"; ctx.fillStyle = "#8A6F5E"; ctx.font = `34px ${sans}`;
  ctx.fillText(`人生草稿・第${(s.reincarnations||0)+1}世`, W/2, 150);
  ctx.fillStyle = "#4A2E1F"; ctx.font = `bold 76px ${serif}`; ctx.fillText(s.name||"", W/2, 250);
  // 享年N歲・定稿印章
  ctx.save(); ctx.translate(W/2, 400); ctx.rotate(-8*Math.PI/180);
  ctx.strokeStyle = "#C8553D"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0,0,92,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle = "#C8553D"; ctx.font = `bold 64px ${serif}`; ctx.fillText(String(s.age), 0, 10); ctx.font = `28px ${sans}`; ctx.fillText("歲・定稿", 0, 52);
  ctx.restore();
  let y = 580;
  const e = s.ending||{};
  if(e.overview){
    ctx.fillStyle = "#4A2E1F"; ctx.font = `38px ${serif}`; ctx.textAlign = "left";
    wrapCanvasText(ctx, e.overview, W-200).slice(0,9).forEach(l=>{ ctx.fillText(l, 100, y); y += 60; });
    y += 30;
  }
  if(e.epitaph){
    ctx.fillStyle = "#C8553D"; ctx.font = `40px ${serif}`; ctx.textAlign = "center";
    wrapCanvasText(ctx, e.epitaph, W-240).slice(0,4).forEach(l=>{ ctx.fillText(l, W/2, y); y += 62; });
  }
  ctx.textAlign = "center"; ctx.fillStyle = "rgba(74,46,31,.45)"; ctx.font = `30px ${serif}`;
  ctx.fillText("人生草稿", W/2, canvas.height-110); ctx.font = `24px ${sans}`; ctx.fillText(SHARE_URL.replace(/^https:\/\//,"").replace(/\/$/,""), W/2, canvas.height-66);
  return canvas;
}
async function shareThisLife(){
  const s = state;
  const msg = document.getElementById("end-share-msg");
  const canvas = drawEndingShareCard(s);
  if(!canvas){ if(msg) msg.textContent = "這個瀏覽器不能產生圖片，可以截圖這一頁。"; return; }
  const fileName = `${s.name||"人生"}的人生草稿.png`;
  const blob = await new Promise(r=>{ try{ canvas.toBlob ? canvas.toBlob(b=>r(b), "image/png") : r(null); }catch(e){ r(null); } });
  try{
    if(blob && typeof File!=="undefined" && navigator.canShare && navigator.share){
      const file = new File([blob], fileName, { type:"image/png" });
      if(navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:"人生草稿", url: SHARE_URL }); return; }
    }
  }catch(e){ if(e && e.name==="AbortError") return; }
  // 不支援分享面板：下載圖片並複製網址
  try{
    const a = document.createElement("a");
    a.href = blob ? URL.createObjectURL(blob) : canvas.toDataURL("image/png"); a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){}
  let copied = false;
  try{ await navigator.clipboard.writeText(SHARE_URL); copied = true; }catch(e){}
  if(msg) msg.textContent = copied ? "已存下分享卡，網址也複製好了。" : "已存下分享卡。";
}

function addDevUsage(s, u, meta){
  if(!s || !u) return;
  try{ recordCallLog(s, u, meta); }catch(e){ console.warn("逐筆呼叫紀錄失敗", e); } // 十、10.9.4：紀錄失敗不影響遊戲
  const d = s.devUsage || (s.devUsage = { calls:0, input:0, cache_write:0, cache_read:0, output:0, cost_usd:0 });
  d.calls += 1;
  ["input","cache_write","cache_read","output"].forEach(k=>{ d[k] += Number(u[k])||0; });

}
// ===== 十、10.9.4 成本量測：每次呼叫逐筆記錄（2026-09-30）=====
// 存在玩家本機(localStorage，不碰KV、不進存檔本體所以不增加雲端存檔大小)，保留最近500筆，測試選單可匯出CSV。
// 字數只當比例參考、不換算token；送出內容依payload欄位分成六區塊，AI輸出分旁白正文與其他欄位
const CALL_LOG_KEY = "life_sim_call_log";
const CALL_LOG_MAX = 500;
const CALL_KIND_LABELS = { turn:"一般回合", opening:"開場", idle:"放置摘要", chapter:"人生之書章節", ending:"結局", retry:"失敗重試／重新生成", review:"回顧這一生" };
const PAYLOAD_NPC_KEYS = new Set(["character_roster","active_characters","all_character_names","renamed_characters","relationship_event_now","relationship_scene_now","relationship_facts","social_feed_now","friend_news_now","friend_opportunity_now","relationship_investment_event_now","romance_flags"]);
const PAYLOAD_RECAP_KEYS = new Set(["chronicle_recent","life_summary_material","previous_generation_events"]);
const PAYLOAD_RECENT_KEYS = new Set(["recent_turns_full","recent_turns_summary"]);
function payloadBlockChars(jsonStr){
  const out = { stats:0, npc:0, recap:0, recent:0, input:0 };
  let p; try{ p = JSON.parse(jsonStr); }catch(e){ out.stats = String(jsonStr||"").length; return out; }
  Object.keys(p||{}).forEach(k=>{
    if(p[k]===undefined) return;
    const n = JSON.stringify(p[k]).length + k.length + 3;
    if(PAYLOAD_NPC_KEYS.has(k)) out.npc += n;
    else if(PAYLOAD_RECAP_KEYS.has(k)) out.recap += n;
    else if(PAYLOAD_RECENT_KEYS.has(k)) out.recent += n;
    else if(k==="player_action") out.input += n;
    else out.stats += n;
  });
  return out;
}
function outputBlockChars(data){
  const blk = (data && data.content || []).find(b=>b.type==="tool_use");
  const inp = blk && blk.input;
  if(!inp) return { narr:0, other:0 };
  const narr = ["narrative","action_result","text","body"].reduce((n,k)=>n + (typeof inp[k]==="string" ? inp[k].length : Array.isArray(inp[k]) ? inp[k].reduce((m,x)=>m+(typeof x==="string" ? x.length : 0), 0) : 0), 0); // 10.14.8（2026-10-05）：正文是段落清單，原本只算字串→後期一律0
  return { narr, other: Math.max(0, JSON.stringify(inp).length - narr) };
}
const callNonceCount = new Map(); // 同一個turn_nonce第二次以後的呼叫算「失敗重試／重新生成」
function callKindFor(s, kind, nonce, forceEnding){
  if(kind!=="turn") return kind;
  if(nonce){
    const n = (callNonceCount.get(nonce)||0) + 1;
    callNonceCount.set(nonce, n);
    if(callNonceCount.size > 200) callNonceCount.delete(callNonceCount.keys().next().value);
    if(n > 1) return "retry";
  }
  if(forceEnding) return "ending";
  if(!(s.log||[]).length) return "opening";
  return "turn";
}
function readCallLog(){ try{ const a = JSON.parse(localStorage.getItem(CALL_LOG_KEY)||"[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
function recordCallLog(s, u, meta){
  if(!meta) return;
  const rec = {
    t: Date.now(), turn: s.turnCount||0, kind: meta.kind || "turn",
    in: u.input||0, cw: u.cache_write||0, cr: u.cache_read||0, out: u.output||0, usd: Number(u.cost_usd)||0,
    rules: u.sys_chars||0, stats:0, npc:0, recap:0, recent:0, input:0, narr:0, other:0
  };
  Object.assign(rec, meta.inChars||{}, meta.outChars||{});
  const arr = readCallLog(); arr.push(rec);
  if(arr.length > CALL_LOG_MAX) arr.splice(0, arr.length - CALL_LOG_MAX);
  try{ localStorage.setItem(CALL_LOG_KEY, JSON.stringify(arr)); }catch(e){ console.warn("逐筆呼叫紀錄寫入失敗", e); }
}
function callLogCSV(){
  const cols = ["time","turn","kind","input_tokens","cache_write_tokens","cache_read_tokens","output_tokens","cost_usd","chars_rules","chars_stats","chars_npc","chars_recap","chars_recent","chars_input","chars_out_narrative","chars_out_other"];
  const rows = readCallLog().map(r=>[ new Date(r.t).toISOString(), r.turn, CALL_KIND_LABELS[r.kind]||r.kind, r.in, r.cw, r.cr, r.out, r.usd, r.rules, r.stats, r.npc, r.recap, r.recent, r.input, r.narr, r.other ]);
  return "\ufeff" + [cols].concat(rows).map(r=>r.join(",")).join("\n");
}
function downloadCallLogCSV(){
  const d = new Date(), pad = n=>String(n).padStart(2,"0");
  try{
    const blob = new Blob([callLogCSV()], { type:"text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = `呼叫成本紀錄_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(e){} }, 1000);
  }catch(e){ console.warn("匯出CSV失敗", e); }
}

// 下載故事：這一世全部日記組成Markdown(時期標籤｜副標、→選擇、行動結果、---、新場景、數值變化、關係變化、結算)
function storyExportParagraphs(text){
  return narrativeParagraphs(String(text||"").replace(/\{\{[^|{}]+\|([^{}]*)\}\}/g, "「$1」"));
}
function buildStoryExport(s){
  const out = [`# ${s.name||""}・第${(s.reincarnations||0)+1}世`, "",
    `- 目前年齡：${s.age}歲`, `- 回合數：${s.turnCount||0}`, `- 模式：${USE_MOCK ? "模擬" : "真實API"}`, `- 下載時間：${new Date().toLocaleString("zh-TW")}`, ""];
  (s.log||[]).forEach((e,i)=>{
    if(e.error) return;
    out.push(`## ${i+1}. ${e.timeLabel || (e.age+"歲・"+stageLabel(e.age))}${e.subtitle ? "｜"+e.subtitle : ""}`, "");
    if(e.action) out.push(`→ ${e.action}${e.focusLabel ? `（重心：${e.focusLabel}）` : ""}`, "");
    const { resultText, sceneText } = splitEntryText(e);
    const res = storyExportParagraphs(resultText), scene = storyExportParagraphs(sceneText);
    if(res.length){ out.push(res.join("\n\n"), "", "---", ""); }
    if(scene.length) out.push(scene.join("\n\n"), "");
    const caps = Object.keys(VISIBLE_STAT_LABELS).filter(k=>e.statChanges && e.statChanges[k]).map(k=>`${VISIBLE_STAT_LABELS[k]} ${e.statChanges[k]>0?"+":""}${e.statChanges[k]}`);
    if(caps.length) out.push(`數值變化：${caps.join("、")}`, "");
    (e.relationshipHints||[]).forEach(h=>out.push(`關係：${h}`, ""));
    if(e.purchaseNote) out.push(`購物：${e.purchaseNote}`, "");
    if(e.examNote) out.push(`考試：${e.examNote}`, "");
    if(e.sideBusinessNote) out.push(`副業：${e.sideBusinessNote}`, "");
    if(e.levelNotes && e.levelNotes.length) out.push(e.levelNotes.join("；"), "");
    if(e.focusNote) out.push(e.focusNote, "");
    if(e.settlement) out.push(`結算：${settlementText(e.settlement, s.cash)}`, "");
    // 這回合給的選項，標出下一回合選了哪個(下一則日記的action)；自己打字的另外列出
    if(e.options && e.options.length){
      const next = (s.log||[]).slice(i+1).find(x=>!x.error);
      const picked = next && next.action;
      out.push("這回合的選項：");
      e.options.forEach((o,k)=>out.push(`${k+1}. ${o}${picked===o ? "　✔ 選了這個" : ""}`));
      if(picked && !e.options.includes(picked)) out.push(`（沒選現成的，自己寫：${picked}）`);
      out.push("");
    }
  });
  if((s.devAiLog||[]).length){
    out.push("## 附錄：旁白回傳的完整資料（最近10回合，不含正文）", "");
    s.devAiLog.forEach(x=>out.push(`### 第${x.turn}回合｜${x.label}`, "", "```json", JSON.stringify(x.data, null, 2), "```", ""));
  }
  if(s.ending){
    out.push("## 結局", "");
    if(s.ending.overview) out.push(s.ending.overview, "");
    if(s.ending.epitaph) out.push(`墓誌銘：${s.ending.epitaph}`, "");
  }
  return out.join("\n");
}
function downloadStoryExport(s){
  if(!s || !Array.isArray(s.log)) return;
  const d = new Date(), pad = n=>String(n).padStart(2,"0");
  const name = `${s.name||"人生"}第${(s.reincarnations||0)+1}世_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.md`;
  try{
    const blob = new Blob([buildStoryExport(s)], { type:"text/markdown;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); }catch(e){} }, 1000);
  }catch(e){ console.warn("下載故事失敗", e); }
}

      </label>
      <label style="display:flex;align-items:center;gap:6px;color:#ccc;margin-bottom:8px;">
        <input type="checkbox" id="toggle-network-idle-decay" ${ENABLE_NETWORK_IDLE_DECAY?"checked":""}> 人脈閒置衰退
      </label>
      <div style="color:#e0a15c;margin:8px 0 4px;">A4 敏感度分析倍率</div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">
        <label style="flex:1;color:#ccc;">薪資倍率(SALARY_SCALE)</label>
        <input type="number" step="0.1" id="input-salary-scale" value="${SALARY_SCALE}" style="width:70px;background:#333;color:#fff;border:1px solid #555;padding:3px 5px;font-family:'Courier New',monospace;">
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <label style="flex:1;color:#ccc;">生活費倍率(LIVING_COST_MULTIPLIER)</label>
        <input type="number" step="0.1" id="input-living-cost-mult" value="${LIVING_COST_MULTIPLIER}" style="width:70px;background:#333;color:#fff;border:1px solid #555;padding:3px 5px;font-family:'Courier New',monospace;">
      </div>
    </div>`;
  // 一、1.2.9.11.4（2026-09-24新增）：場景日期違規/台詞截斷的待確認清單，最新的在上面
  const flags = (state.reviewFlags||[]).slice(-30).reverse();
  const reviewHtml = `
    <div style="margin-bottom:12px;border-bottom:1px solid #444;padding-bottom:10px;">
      <div style="color:#e0a15c;margin-bottom:4px;">待確認清單（${(state.reviewFlags||[]).length}筆，顯示最近30筆）</div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <label style="flex:1;color:#ccc;">模擬章節生成失敗機率(人生之書)</label>
        <input type="number" step="0.1" id="input-mock-chapter-fail" value="${MOCK_CHAPTER_FAIL_RATE}" style="width:70px;background:#333;color:#fff;border:1px solid #555;padding:3px 5px;">
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <label style="flex:1;color:#ccc;">模擬AI延遲毫秒(測等待畫面)</label>
        <input type="number" step="500" id="input-mock-delay" value="${MOCK_AI_DELAY_MS}" style="width:70px;background:#333;color:#fff;border:1px solid #555;padding:3px 5px;">
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <label style="flex:1;color:#ccc;">模擬AI場景日期違規機率</label>
        <input type="number" step="0.05" id="input-mock-date-violation" value="${MOCK_SCENE_DATE_VIOLATION_RATE}" style="width:70px;background:#333;color:#fff;border:1px solid #555;padding:3px 5px;">
      </div>
      ${flags.length ? flags.map(f=>`<div style="color:#bbb;font-size:11px;margin-bottom:3px;">第${f.turn}回合［${escapeHtml(f.kind)}］${escapeHtml(f.detail)}</div>`).join("") : `<div style="color:#777;font-size:11px;">目前沒有</div>`}
    </div>`;
  const groups = debugFieldGroups();
  const body = groups.map(g=>`
    <div style="margin-bottom:12px;">
      <div style="color:#e0a15c;margin-bottom:4px;">${g.title}</div>
      ${g.fields.map(([label,path,val])=>`
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">
          <label style="flex:1;color:#ccc;">${label}</label>
          <input type="number" step="any" data-path="${path}" value="${val}"
            style="width:70px;background:#333;color:#fff;border:1px solid #555;padding:3px 5px;font-family:'Courier New',monospace;">
        </div>`).join("")}
    </div>`).join("");
  return header + `
    <div style="max-height:56vh;overflow-y:auto;padding-right:4px;">${toggles}${reviewHtml}${body}</div>
    <button id="debug-apply" style="width:100%;margin-top:8px;padding:9px;background:var(--teal,#3e6b5c);color:#fff;border:none;cursor:pointer;font-family:inherit;">套用變更並刷新畫面</button>
    <button id="debug-dump" style="width:100%;margin-top:6px;padding:7px;background:#444;color:#fff;border:none;cursor:pointer;font-family:inherit;">印出完整 state 到 Console</button>
    <p style="color:#888;font-size:10.5px;margin-top:12px;line-height:1.6;">＊此面板只在 USE_MOCK=true 時出現，正式模式（USE_MOCK=false）完全不會建立這個按鈕。<br>＊四、4.3事件狀態（available/active/completed/skipped/locked）追蹤機制本身早已實作(見state.milestones)，但這個面板還沒有專屬UI可以直接勾選觸發特定里程碑或查詢完成紀錄，想確認的話用上面「印出完整state到Console」按鈕查state.milestones即可。<br>＊數值故意不做範圍限制，方便測試極端角色（例如全部設100或全部設0）。</p>
  `;
}
function bindDebugPanelContent(){
  const marginalToggle = document.getElementById("toggle-marginal-diminish");
  if(marginalToggle) marginalToggle.onchange = ()=>{ ENABLE_MARGINAL_DIMINISH = marginalToggle.checked; };
  const idleToggle = document.getElementById("toggle-network-idle-decay");
  if(idleToggle) idleToggle.onchange = ()=>{ ENABLE_NETWORK_IDLE_DECAY = idleToggle.checked; };
  const salaryScaleInput = document.getElementById("input-salary-scale");
  if(salaryScaleInput) salaryScaleInput.onchange = ()=>{ const v=Number(salaryScaleInput.value); if(!Number.isNaN(v)) SALARY_SCALE = v; };
  const mockViolationInput = document.getElementById("input-mock-date-violation");
  if(mockViolationInput) mockViolationInput.onchange = ()=>{ const v=Number(mockViolationInput.value); if(!Number.isNaN(v)) MOCK_SCENE_DATE_VIOLATION_RATE = clamp(v,0,1); };
  const mockChapterFailInput = document.getElementById("input-mock-chapter-fail");
  if(mockChapterFailInput) mockChapterFailInput.onchange = ()=>{ const v=Number(mockChapterFailInput.value); if(!Number.isNaN(v)) MOCK_CHAPTER_FAIL_RATE = clamp(v,0,1); };
  const mockDelayInput = document.getElementById("input-mock-delay");
  if(mockDelayInput) mockDelayInput.onchange = ()=>{ const v=Number(mockDelayInput.value); if(!Number.isNaN(v)) MOCK_AI_DELAY_MS = Math.max(0, v); };
  const livingCostMultInput = document.getElementById("input-living-cost-mult");
  if(livingCostMultInput) livingCostMultInput.onchange = ()=>{ const v=Number(livingCostMultInput.value); if(!Number.isNaN(v)) LIVING_COST_MULTIPLIER = v; };
  const applyBtn = document.getElementById("debug-apply");
  if(applyBtn) applyBtn.onclick = ()=>{
    document.querySelectorAll("#debug-panel input[data-path]").forEach(inp=>{
      const path = inp.dataset.path.split(".");
      let obj = state;
      for(let i=0;i<path.length-1;i++) obj = obj[path[i]];
      const num = Number(inp.value);
      if(!Number.isNaN(num)) obj[path[path.length-1]] = num;
    });
    saveGame();
    render();
  };
  const dumpBtn = document.getElementById("debug-dump");
  if(dumpBtn) dumpBtn.onclick = ()=>{
    console.log(JSON.parse(JSON.stringify(state)));
    alert("已印到瀏覽器主控台（F12 → Console 分頁）");
  };
}

initApp();
</script>
</body>
</html>
