<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人生草稿</title>
<style>
  :root{
    --paper:#EDE7D9;
    --paper-card:#F6F1E4;
    --paper-dark:#E1D8C3;
    --ink:#262220;
    --ink-soft:#6b6156;
    --line:#c3b79c;
    --stamp:#9c3b2e;
    --teal:#3e6b5c;
    --gold:#93752f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
  }
  .cover{
    padding:22px 20px 14px;
    border-bottom:3px double var(--ink);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .cover h1{
    font-size:22px;
    margin:0;
    letter-spacing:2px;
    font-weight:700;
  }
  .cover .sub{
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:3px;
    margin-top:2px;
  }
  .stamp{
    border:2px solid var(--stamp);
    color:var(--stamp);
    border-radius:50%;
    width:56px;height:56px;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    transform:rotate(-8deg);
    font-size:10px;
    line-height:1.1;
    text-align:center;
    flex-shrink:0;
    opacity:.85;
  }
  .stamp b{font-size:16px;display:block;font-family:serif;}

  .progress-strip{
    padding:8px 20px;
    border-bottom:1px solid var(--line);
    background:var(--paper-card);
  }
  .progress-strip .prow{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;
  }
  .progress-strip .prow b{color:var(--ink);font-weight:700;}
  .progress-track{height:4px;background:var(--paper-dark);}
  .progress-fill{height:100%;background:var(--teal);}

  .ledger{
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    background:var(--paper-card);
  }
  .ledger-row{
    display:flex;align-items:baseline;gap:8px;
    font-size:14px;
    padding:3px 0;
  }
  .ledger-row .lbl{white-space:nowrap;color:var(--ink-soft);font-size:12.5px;letter-spacing:1px;}
  .ledger-row .dots{
    flex:1;border-bottom:1px dotted var(--line);
    height:10px;
  }
  .ledger-row .val{
    font-variant-numeric:tabular-nums;
    font-family:"Courier New",monospace;
    font-size:13.5px;
    min-width:28px;text-align:right;
  }
  .pips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
  .pip{width:9px;height:9px;border-radius:50%;border:1px solid var(--gold);}
  .pip.on{background:var(--gold);}

  .journal{
    flex:1;
    padding:16px 20px 8px;
  }
  .entry{margin-bottom:18px;}
  .entry .age-tag{
    font-size:11px;color:var(--stamp);letter-spacing:2px;
    border-bottom:1px solid var(--stamp);
    display:inline-block;padding-bottom:2px;margin-bottom:6px;
  }
  .entry p{margin:0 0 10px;font-size:15.5px;line-height:1.7;}
  .entry p:last-child{margin-bottom:0;}
  .entry.chronicle{
    font-family:"Noto Sans TC",sans-serif;
    font-size:12px;color:var(--ink-soft);
    border-left:2px solid var(--line);
    padding-left:10px;margin:10px 0;
  }

  .choices{padding:6px 20px 4px;}
  .choice-btn{
    display:block;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--line);
    padding:10px 4px 10px 22px;position:relative;
    font-family:"Noto Serif TC",serif;font-size:15px;color:var(--ink);
    cursor:pointer;
  }
  .choice-btn:before{
    content:"○";position:absolute;left:0;top:10px;color:var(--teal);
  }
  .choice-btn:active{background:var(--paper-dark);}
  .choice-btn:disabled{opacity:.4;}

  .custom-row{
    display:flex;gap:8px;padding:14px 20px 18px;
    border-bottom:1px solid var(--line);
  }
  .custom-row input{
    flex:1;border:none;border-bottom:1px solid var(--ink-soft);
    background:transparent;font-family:"Noto Serif TC",serif;
    font-size:14.5px;padding:6px 2px;color:var(--ink);
  }
  .custom-row input:focus{outline:none;border-bottom:1px solid var(--stamp);}
  .custom-row button{
    border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    font-family:"Noto Serif TC",serif;font-size:13px;
    padding:6px 14px;cursor:pointer;
  }
  .custom-row button:disabled{opacity:.4;}
  .hint{font-size:11px;color:var(--ink-soft);padding:0 20px 14px;}
  .input-error{font-size:11px;color:var(--stamp);padding:0 20px 8px;display:none;}

  .roster{
    padding:14px 20px 20px;
    border-top:1px solid var(--line);
  }
  .roster-title{font-size:12px;letter-spacing:2px;color:var(--ink-soft);margin-bottom:8px;}
  .roster-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
  .rcard{
    flex:0 0 auto;width:118px;cursor:pointer;
    background:var(--paper-card);border:1px solid var(--line);
    padding:8px 10px;font-size:11.5px;
  }
  .rcard.bg{opacity:.45;}
  .rcard .name{font-size:13px;font-weight:700;margin-bottom:2px;}
  .rcard .rel{color:var(--ink-soft);margin-bottom:2px;}
  .rcard .status-text{color:var(--stamp);font-size:11px;}

  .footer-actions{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 20px 18px;font-size:11px;color:var(--ink-soft);
  }
  .footer-actions a{color:var(--ink-soft);text-decoration:underline;cursor:pointer;}

  .center-screen{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:30px 24px;text-align:center;
  }
  .center-screen h2{font-size:20px;margin-bottom:14px;letter-spacing:1px;}
  .roll-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0;
    text-align:left;
  }
  .roll-item{border:1px solid var(--line);padding:10px 12px;background:var(--paper-card);}
  .roll-item .k{font-size:11px;color:var(--ink-soft);letter-spacing:1px;}
  .roll-item .v{font-size:20px;font-family:"Courier New",monospace;}
  .primary-btn{
    background:var(--ink);color:var(--paper);border:none;
    padding:12px 28px;font-size:15px;letter-spacing:2px;
    font-family:"Noto Serif TC",serif;cursor:pointer;margin-top:10px;
  }
  .ghost-btn{
    background:none;border:1px solid var(--ink-soft);color:var(--ink);
    padding:10px 22px;font-size:13px;letter-spacing:1px;
    font-family:"Noto Serif TC",serif;cursor:pointer;margin-top:10px;
  }
  .loading{
    padding:20px;text-align:center;color:var(--ink-soft);font-size:13px;
    letter-spacing:1px;
  }
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(38,34,32,.55);
    display:flex;align-items:center;justify-content:center;z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--paper-card);max-width:340px;width:100%;
    padding:24px 22px;border:2px double var(--ink);
  }
  .modal h3{margin-top:0;font-size:17px;}
  .modal p{font-size:13.5px;color:var(--ink-soft);}
  .modal .demo-note{font-size:11px;color:var(--stamp);margin-top:10px;}
  .end-title{font-size:24px;margin:6px 0 4px;color:var(--stamp);}
</style>
</head>
<body>
<div id="app"><div class="loading">開卷中…</div></div>

<!-- 人生草稿 測試第一版（Test v1）基準點，2026-09-14。範圍：A2核心數值邊際遞減/人脈閒置衰退、3.4.8基本生活開銷擴大、3.4.9資產模型(現金/房產/房貸)、7.1.4結局計分制。B7結局重新設計仍為測試草案，未併入此版。 -->
<!-- 人生草稿 測試第二版（Test v2）基準點，2026-09-16。範圍（v1之後新增/改版)：4.3事件狀態機制(10個里程碑)、7.5.3買房頭期款門檻檢查、每回合可見數值變化顯示、學生財富系統改版(遊戲內單位制)+4個bug修正、3.2.2才識成長公式修正(event_type標籤+程式查表，取代AI自由給delta)、3.7.2自律的興趣來源成長(連續3/6次持續投入)、八、興趣系統v1(新章節，候選成立/投入度/自律加成/副業契機)、2.2/2.2.1學期節奏改版(14段/年，取代9/15版本的12段/年)+2.5整體人生階段回合預算(22歲以後加速曲線，取代「30歲以後AI自行判斷」的舊架構)。未併入此版：七、7.1.5死亡機制改版(文件明確要求機率公式定案前不動代碼，仍是舊版19歲門檻+雙因子機率)。⚠️已知未解問題：實測發現全人生總回合數約2000~2100回合，跟設計文件2.5.1「1-2小時一輪」的節奏目標矛盾，記錄在QA手冊34.6 A10，待內容組確認。 -->
<script>
const STORAGE_KEY = "life_sim_save_v1";
// 十、10.1（9/19新增）：封測階段純金鑰模式——復原金鑰對應「一個玩家」，終身不變，底下最多累積3段人生
const RECOVERY_KEY_STORAGE_NAME = "life_sim_recovery_key"; // 復原金鑰快取在本機，方便同一台裝置不用每次重輸入
const ACTIVE_SLOT_STORAGE_NAME = "life_sim_active_slot"; // 記住這台裝置上次玩的是第幾段人生(0~2)
const MAX_LIFE_SLOTS = 3; // 【定案,十、10.1】
function generateRecoveryKey(){
  // 用瀏覽器內建crypto產生10 bytes(80 bits)隨機性，格式化成5組4碼英數字方便玩家抄寫核對，例如 A1B2-C3D4-E5F6-7890-1234
  const bytes = new Uint8Array(10);
  (window.crypto || crypto).getRandomValues(bytes);
  const hex = Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("");
  return hex.match(/.{1,4}/g).join("-").toUpperCase();
}
const MODEL = "claude-sonnet-5"; // 2026-09-18：舊版claude-sonnet-4-6疑似帳號無此模型存取權限（403，非404 not_found，見CHANGELOG排查記錄），改用目前最新且更便宜的Sonnet版本
const CUSTOM_INPUT_MAX_CHARS = 300; // 呼應設計文件1.1.3：至少100字，理想200-300字，取上限值

const STAGE_LABELS = [
  [0,14,"孩提"],[15,17,"高中"],[18,22,"大學／技職"],
  [23,29,"初入社會"],[30,45,"職涯發展"],[46,60,"中年"],[61,200,"老年"]
];
function stageLabel(age){
  for(const [a,b,label] of STAGE_LABELS){ if(age>=a && age<=b) return label; }
  return "人生";
}
const VISIBLE_STAT_LABELS = { health:"健康", knowledge:"才識", network:"人脈", expression:"表達力", appearance:"外表" };

// 四、4.3 事件狀態機制（9/15新增）：五種狀態 available/active/completed/skipped/locked
// auto:true 表示客戶端能從既有結構化資料直接判斷完成，不假手AI；auto:false 才需要AI透過milestone_updates回報
const MILESTONE_DEFS = [
  { id:"first_credit_card", label:"第一張信用卡", auto:false, lockedUntil: s=>s.age>=18 },
  { id:"first_part_time_job", label:"第一次打工", auto:false, lockedUntil: null },
  { id:"first_romance", label:"第一次戀愛", auto:true, lockedUntil: null }, // 四、4.4（9/16改版）：改由戀愛狀態機在首次進入「交往中」時自動判定，取代AI自由回報
  { id:"graduation_highschool", label:"高中畢業", auto:true, lockedUntil: null },
  { id:"graduation_college", label:"大學畢業", auto:true, lockedUntil: null },
  { id:"first_full_time_job", label:"第一次正職工作", auto:true, lockedUntil: null },
  { id:"first_startup", label:"第一次創業", auto:false, lockedUntil: null },
  { id:"moved_out", label:"搬出家裡", auto:true, lockedUntil: null },
  { id:"home_purchase", label:"買房", auto:true, lockedUntil: null },
  { id:"marriage_decision", label:"結婚/不婚決定", auto:false, lockedUntil: s=>s.age>=18 },
  // 四、4.2.2（9/19新增）：4.3.1原文明講清單非封閉，這裡補上履歷判準討論時發現4.2例子有列但4.3.1沒收的三項
  { id:"first_job_change", label:"第一次轉職", auto:true, lockedUntil: null }, // 有既有job_change結構化訊號，非首次job_change視為轉職
  { id:"first_child", label:"生育或領養", auto:true, lockedUntil: null }, // 有既有new_characters的is_child結構化訊號
  { id:"parent_retirement", label:"父母退休", auto:false, lockedUntil: null } // 無結構化訊號，AI回報
];
function initMilestones(){
  const m = {};
  MILESTONE_DEFS.forEach(def=>{ m[def.id] = def.lockedUntil ? "locked" : "available"; });
  return m;
}
function refreshMilestoneLocks(s){
  // 每回合檢查locked狀態的里程碑，門檻達成就翻成available（客戶端結構化判斷，不假手AI）
  MILESTONE_DEFS.forEach(def=>{
    if(def.lockedUntil && s.milestones[def.id]==="locked" && def.lockedUntil(s)){
      s.milestones[def.id] = "available";
    }
  });
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[rnd(0,arr.length-1)]; }

// 3.5.3 核心數值的邊際遞減與人脈閒置衰退（9/14整併QA 60局測試後定案，係數皆為【測試參數】未定案）
// 可切換開關，方便回歸比較（呼應開發參數規格「十五、開發完成標準」）
let ENABLE_MARGINAL_DIMINISH = true;
let ENABLE_NETWORK_IDLE_DECAY = true;
const NETWORK_IDLE_THRESHOLD = 6; // 連續N回合沒有人脈經營行為才開始衰退（測試參數）
const NETWORK_IDLE_DECAY_INTERVAL = 3; // 門檻觸發後，每隔幾回合衰退一次（測試參數）
function applyMarginalDiminish(rawDelta, currentValue){
  if(!ENABLE_MARGINAL_DIMINISH || rawDelta<=0) return rawDelta; // 只對正向成長量做邊際遞減，扣分不受影響
  const factor = Math.max(0, 100-currentValue)/100;
  return rawDelta*factor;
}


// ========== 三、3.8 幸福感系統（9/20新增，取代原七、7.1.4裡的幸福感角色定義）==========
// 幸福感是系統裡唯一量「過得好不好」而非「做到了什麼」的軸，不產生任何判決。
// 三層：基準線（長期水準，由五條來源管道決定）＋事件即時波動（AI只給emotional_tone，程式查表）＋朝基準線回歸。
// 以下數字全部是【測試參數,待驗證】，由模擬校準，不得由代碼自行升格為定案（3.8.3、3.8.4）
const HAPPINESS_TONE_DELTA = { uplifting:[6,12], warm:[2,5], unsettling:[-5,-2], heavy:[-12,-6] };
const HAPPINESS_TONE_ENUM = Object.keys(HAPPINESS_TONE_DELTA);
const HAPPINESS_REGRESSION_INTERVAL = 5;        // 每N回合朝基準線回歸一次
const HAPPINESS_REGRESSION_RATIO = 0.25;        // 每次移動的比例
const HAPPINESS_CHANNEL_TOP_WEIGHTS = [1.0, 0.7, 0.4]; // 3.8.2【定案】取前三高加權，第四第五條不計入
const HAPPINESS_CHANNEL_DIMINISH_SCALE = 55;    // 管道邊際遞減的尺度參數
const HAPPINESS_LOW_THRESHOLD = 35;             // 4.5 longest_low_streak 的低谷閾值（設計文件標【待補充】，這裡先給第一輪測試值）
const AUTONOMY_NEUTRAL_DEFAULT = 50;            // 還沒遇到任何可跳過里程碑時的中性值
// 3.8.4「可跳過的里程碑」在v1的實作範圍：只收「玩家自己這一生要不要走這條路」的選擇。
// parent_retirement（父母退休）不是玩家的選擇、graduation_*等auto里程碑目前代碼裡不存在skipped路徑，兩者皆不列入。
// ⚠️落差：first_child(生育/領養)、home_purchase(買房)、moved_out(搬出家裡)在語意上是可跳過的傳統路線，
// 但現行代碼只有「達成時自動completed」沒有「明確決定不做」的skipped入口，暫時無法計入自主感，已記入QA手冊34.2
const AUTONOMY_MILESTONES = ["marriage_decision","first_startup","first_credit_card","first_part_time_job"];
const INTIMATE_RELATION_RE = /配偶|伴侶|先生|太太|老公|老婆|兒子|女兒|父親|母親|爸|媽|哥|姊|姐|弟|妹/;

function happinessChannelDiminish(raw){
  // 3.8.2【定案】每條管道各自套用3.5.3的邊際遞減。3.5.3的成長式 Δ=原始Δ×(100−x)/100 連續化後
  // 封閉解為 x(t)=100(1−e^(−t/scale))，這裡直接拿它當「原始投入→管道分數」的靜態轉換：
  // 高位投入換來的分數越來越少，且永遠逼近但不撞滿100。
  if(!(raw>0)) return 0;
  return clamp(100*(1-Math.exp(-raw/HAPPINESS_CHANNEL_DIMINISH_SCALE)), 0, 100);
}
function avgAffinity(list){
  if(!list || !list.length) return 0;
  return list.reduce((a,c)=>a+(c.affinity||0),0)/list.length;
}
function computeAutonomyRaw(s){
  // 3.8.4【定案】chosen佔「已遇到的可跳過里程碑」的比例。
  // not_offered（未觸發）與unavailable（條件未達成）都不進分母——設計文件明講「一直沒遇到對象的角色則不加分」，
  // 不加分不等於扣分，若讓它們稀釋比例就變成扣分，會直接違反六、6.4中立性。
  const m = s.milestones||{};
  let chosen=0, encountered=0;
  AUTONOMY_MILESTONES.forEach(id=>{
    const st = m[id];
    if(st==="skipped"){ chosen++; encountered++; }
    else if(st==="completed" || st==="active"){ encountered++; }
  });
  if(!encountered) return AUTONOMY_NEUTRAL_DEFAULT;
  return (chosen/encountered)*100;
}
function milestoneSkipReasonFor(s, id){
  // 3.8.4【定案】skip_reason三選一。completed/active代表這條路實際走了，不屬於「跳過」，回null不記錄。
  const st = (s.milestones||{})[id];
  if(st==="skipped") return "chosen";
  if(st==="locked") return "unavailable";
  if(st==="available") return "not_offered";
  return null;
}
function refreshMilestoneSkipReasons(s){
  s.milestoneSkipReason = s.milestoneSkipReason || {};
  MILESTONE_DEFS.forEach(def=>{
    const reason = milestoneSkipReasonFor(s, def.id);
    if(reason) s.milestoneSkipReason[def.id] = reason;
    else delete s.milestoneSkipReason[def.id];
  });
}
function computeHappinessChannels(s){
  // 3.8.2【定案】五條來源管道，各自0-100、各自套用邊際遞減。
  // ⚠️落差：「社團參與」與「職涯認同」目前沒有對應的結構化欄位，v1先由人脈／才識承擔，已記入QA手冊34.2
  const chars = s.characters||[];
  const intimate = chars.filter(c=>INTIMATE_RELATION_RE.test(c.relation||""));
  const others = chars.filter(c=>!INTIMATE_RELATION_RE.test(c.relation||""));
  const interests = s.interestCandidates||[];
  const topInterest = interests.length ? Math.max.apply(null, interests.map(c=>c.investment||0)) : 0;
  const finHealth = computeFinancialHealthForState(s);
  const raw = {
    intimacy: avgAffinity(intimate),
    belonging: (s.stats.network||0)*0.6 + avgAffinity(others)*0.4,
    selfActualization: (s.stats.knowledge||0)*0.5 + clamp(topInterest,0,100)*0.5,
    stability: (s.stats.health||0)*0.5 + finHealth*0.5,
    autonomy: computeAutonomyRaw(s)
  };
  const out = {};
  Object.keys(raw).forEach(k=>{ out[k] = happinessChannelDiminish(raw[k]); });
  return out;
}
function computeHappinessBaseline(s){
  // 3.8.2【定案】取前三高加權，正規化0-100。第四、第五條不計入——
  // 這是六、6.4中立性的機制保證：管道數量不足本身不扣分，三條撐得夠高就跟走傳統路線的人一樣能到滿值。
  const ch = computeHappinessChannels(s);
  const sorted = Object.keys(ch).map(k=>ch[k]).sort((a,b)=>b-a).slice(0,3);
  let num=0, den=0;
  sorted.forEach((v,i)=>{ num += v*HAPPINESS_CHANNEL_TOP_WEIGHTS[i]; den += HAPPINESS_CHANNEL_TOP_WEIGHTS[i]; });
  return den ? clamp(num/den, 0, 100) : 50;
}
function happinessToneDelta(tone){
  // 3.8.3【定案】AI回傳enum以外的值，一律視為中性（增減量0），不崩潰也不憑猜測賦值
  const range = HAPPINESS_TONE_DELTA[tone];
  if(!range) return 0;
  return rnd(range[0], range[1]);
}
function applyHappiness(s, tone){
  // 3.8.4【定案,程式層禁令】這裡的輸入只有「事件結果(tone)」與「來源管道的投入回饋(baseline)」兩種，
  // 不得以「某里程碑是否達成／某狀態是否成立」作為加減條件。QA可直接靜態檢查本函式。
  s.happiness = clamp(s.happiness + happinessToneDelta(tone), 0, 100);
  s.happinessBaseline = computeHappinessBaseline(s);
  s.happinessRegressionCounter = (s.happinessRegressionCounter||0) + 1;
  if(s.happinessRegressionCounter >= HAPPINESS_REGRESSION_INTERVAL){
    s.happinessRegressionCounter = 0;
    s.happiness = clamp(s.happiness + (s.happinessBaseline - s.happiness)*HAPPINESS_REGRESSION_RATIO, 0, 100);
  }
}

// ========== 四、4.5 人生軌跡紀錄 life_trajectory（9/20新增）==========
// 【定案】每個人生階段結束時由客戶端結算一次並凍結，不可回頭修改，AI不參與結算。
// 階段切法沿用4.2.3既有定義（chronicleLifeStageKey：學生時期＋2.5七個年齡帶，共8段）
const TRAJECTORY_KEY_NPC_COUNT = 3; // 4.5【定案】關係值最高的2至3位，取上限3
function spectrumSnapshot(s){
  // 依附兩軸（5.2.3/12.1.4）＋同儕位置（5.2.4）＋做事態度五條（3.7），共8個值
  const c = s.conscientiousness||{};
  return {
    anxiety: Math.round(s.anxiety||0), avoidance: Math.round(s.avoidance||0),
    peerPosition: Math.round(s.peerPosition||0),
    selfDiscipline: Math.round(c.selfDiscipline||0), prudence: Math.round(c.prudence||0),
    achievement: Math.round(c.achievement||0), responsibility: Math.round(c.responsibility||0),
    teamSolo: Math.round(c.teamSolo||0)
  };
}
function newStageAccum(s){
  return { stage: chronicleLifeStageKey(s), ageFrom: s.age, turns:0,
    happinessSum:0, peak:s.happiness, low:s.happiness,
    lowStreak:0, longestLowStreak:0, channelSums:{},
    chronicleStart:(s.chronicle||[]).length, breakthroughEvents:[] };
}
function freezeStageTrajectory(s){
  const a = s.stageAccum;
  if(!a || !a.turns) return;
  const chars = (s.characters||[]).slice().sort((x,y)=>(y.affinity||0)-(x.affinity||0));
  let dominant=null, best=-1;
  Object.keys(a.channelSums).forEach(k=>{ if(a.channelSums[k]>best){ best=a.channelSums[k]; dominant=k; } });
  s.lifeTrajectory.push({
    stage: a.stage, age_from: a.ageFrom, age_to: s.age, turns: a.turns,
    happiness_avg: +(a.happinessSum/a.turns).toFixed(1),
    happiness_peak: Math.round(a.peak), happiness_low: Math.round(a.low),
    dominant_channel: dominant,
    longest_low_streak: a.longestLowStreak,
    spectrum_snapshot: spectrumSnapshot(s),
    resume_entries: (s.chronicle||[]).slice(a.chronicleStart),
    key_npcs: chars.slice(0,TRAJECTORY_KEY_NPC_COUNT).map(c=>({ name:c.name, relation:c.relation||"", affinity:Math.round(c.affinity||0) })),
    // ⚠️落差：六、6.2破格里程碑目前只存在於system prompt的敘事指示，沒有結構化觸發訊號可供客戶端記錄，
    // 這個欄位先保留空陣列，等6.2實作出可判定的光譜位移觸發點再填（已記入QA手冊34.2）
    breakthrough_events: a.breakthroughEvents.slice()
  });
}
function ensureStageTransition(s){
  // 四、4.5：段落邊界偵測+把上一段凍結進life_trajectory，抽出來給一般回合累計(updateLifeTrajectory)
  // 與結局前置凍結(freezeFinalLifeStageForEnding)共用，兩邊都需要「先確認目前是不是進了新階段」這一步
  s.lifeTrajectory = s.lifeTrajectory || [];
  if(!s.stageAccum) s.stageAccum = newStageAccum(s);
  const nowStage = chronicleLifeStageKey(s);
  if(nowStage !== s.stageAccum.stage){ freezeStageTrajectory(s); s.stageAccum = newStageAccum(s); }
}
function updateLifeTrajectory(s){
  // 四、4.5：一般回合(非結局)的累計，只在applyResult()裡forceEnding為false時呼叫——
  // forceEnding時的最後一段凍結改由takeTurn()呼叫AI之前的freezeFinalLifeStageForEnding()處理，
  // applyResult()不再重複凍結，避免同一段被凍結兩次
  ensureStageTransition(s);
  const a = s.stageAccum;
  a.turns++;
  a.happinessSum += s.happiness;
  if(s.happiness > a.peak) a.peak = s.happiness;
  if(s.happiness < a.low) a.low = s.happiness;
  if(s.happiness < HAPPINESS_LOW_THRESHOLD){
    a.lowStreak++;
    if(a.lowStreak > a.longestLowStreak) a.longestLowStreak = a.lowStreak;
  } else a.lowStreak = 0;
  const ch = computeHappinessChannels(s);
  Object.keys(ch).forEach(k=>{ a.channelSums[k] = (a.channelSums[k]||0) + ch[k]; });
}
function freezeFinalLifeStageForEnding(s){
  // 四、4.5（2026-09-20 b版修正）：forceEnding時，最後一段的邊界必須在AI被呼叫之前就確定並放進
  // s.lifeTrajectory，否則buildLifeSummaryMaterial()送給AI的payload只會看到前面已完結的幾段，
  // AI永遠沒機會寫到「角色死亡的那一段」，導致結局畫面最後一段永遠是空白——這是2026-09-20跑
  // 400+回合端到端測試時發現的bug，不是邊界情況，每一局都會發生。
  // 代價：這一回合本身的數值(這回合AI才要回傳的health/happiness等delta)不算進這一段的統計，
  // 只包含到上一回合為止的累積——對敘事語氣用途的人生總結而言可以接受。
  ensureStageTransition(s);
  freezeStageTrajectory(s);
  s.stageAccum = null;
}

// ========== 七、7.1.4 死亡結局的人生總結（9/20整節改版，取代ENDING_DEFINITIONS標籤計分制）==========
// 【定案】不輸出任何標籤、分數、排名。素材的挑選與排序全由客戶端從life_trajectory完成，AI只負責寫成回顧的語氣。
const SUMMARY_TONE_BANDS = [ // 7.1.4.2【定案】敘事溫度四級由happiness_avg決定；分界數字為【測試參數】
  { min:65, tone:"釋然" }, { min:45, tone:"平穩" }, { min:25, tone:"惋惜" }, { min:0, tone:"沉重" }
];
const SUMMARY_RESUME_PER_STAGE = 3;  // 7.1.4.2【待補充】每階段挑幾則履歷條目——第一輪測試值
const SUMMARY_NPC_PER_STAGE = 2;     // 7.1.4.2【待補充】每階段挑幾位角色卡——第一輪測試值
const SPECTRUM_SHIFT_THRESHOLD = 15; // 7.1.4.2【待補充】L2變化句的位移閾值——第一輪測試值
const SPECTRUM_LABELS = { anxiety:"焦慮軸", avoidance:"迴避軸", peerPosition:"同儕位置",
  selfDiscipline:"自律", prudence:"審慎", achievement:"成就傾向", responsibility:"責任感", teamSolo:"團隊vs單打獨鬥" };
const HAPPINESS_CHANNEL_LABELS = { intimacy:"親密與家庭", belonging:"友情與歸屬",
  selfActualization:"自我實現", stability:"身心安穩", autonomy:"自主感" };
function lifeStageLabel(key){
  if(key==="student") return "學生時期";
  if(key==="career_other") return "晚年";
  return key + "歲";
}
function summaryToneFor(avg){
  for(let i=0;i<SUMMARY_TONE_BANDS.length;i++){ if(avg>=SUMMARY_TONE_BANDS[i].min) return SUMMARY_TONE_BANDS[i].tone; }
  return SUMMARY_TONE_BANDS[SUMMARY_TONE_BANDS.length-1].tone;
}
function buildLifeSummaryMaterial(s){
  const traj = s.lifeTrajectory || [];
  const segments = traj.map(t=>({
    stage: t.stage, stage_label: lifeStageLabel(t.stage),
    age_from: t.age_from, age_to: t.age_to,
    tone: summaryToneFor(t.happiness_avg),
    dominant_channel: t.dominant_channel,
    dominant_channel_label: HAPPINESS_CHANNEL_LABELS[t.dominant_channel] || null,
    longest_low_streak: t.longest_low_streak,
    resume_entries: (t.resume_entries||[]).slice(0, SUMMARY_RESUME_PER_STAGE),
    key_npcs: (t.key_npcs||[]).slice(0, SUMMARY_NPC_PER_STAGE),
    breakthrough_events: t.breakthrough_events || []
  }));
  const transitions = [];
  for(let i=1;i<traj.length;i++){
    const a = traj[i-1].spectrum_snapshot || {}, b = traj[i].spectrum_snapshot || {};
    let axis=null, delta=0;
    Object.keys(SPECTRUM_LABELS).forEach(k=>{
      const d = (b[k]||0) - (a[k]||0);
      if(Math.abs(d) > Math.abs(delta)){ delta = d; axis = k; }
    });
    if(axis && Math.abs(delta) >= SPECTRUM_SHIFT_THRESHOLD){
      transitions.push({ after_stage: traj[i-1].stage,
        from_stage_label: lifeStageLabel(traj[i-1].stage), to_stage_label: lifeStageLabel(traj[i].stage),
        axis, axis_label: SPECTRUM_LABELS[axis], from: a[axis]||0, to: b[axis]||0,
        direction: delta>0 ? "up" : "down" });
    }
  }
  return { segments, transitions };
}
function assembleEnding(s, r){
  // 客戶端先挑好素材，再把AI寫的文字貼回對應的段落；AI沒寫到的段落留空字串，不補猜測內容
  const material = buildLifeSummaryMaterial(s);
  const ls = r.life_summary || {};
  const byStage = {}, byTrans = {};
  (ls.segments||[]).forEach(x=>{ if(x && x.stage) byStage[x.stage] = x.text || ""; });
  (ls.transitions||[]).forEach(x=>{ if(x && x.after_stage) byTrans[x.after_stage] = x.text || ""; });
  return {
    segments: material.segments.map(m=>({ stage:m.stage, label:m.stage_label, age_from:m.age_from, age_to:m.age_to,
      tone:m.tone, resume_entries:m.resume_entries, key_npcs:m.key_npcs, text: byStage[m.stage] || "" })),
    transitions: material.transitions.map(t=>({ after_stage:t.after_stage, text: byTrans[t.after_stage] || "" })),
    epitaph: ls.epitaph || "",
    successionAvailable: !!r.succession_available
  };
}

// 三、3.2.2（9/16修正）才識成長：AI只給event_type標籤，程式查表決定「事件原始學習值」，取代原本AI直接給的knowledge delta
// 區間數字為【測試參數,待驗證】，milestone上限1~2次取上限值2（同一人生階段=timeState.stageMode）
const KNOWLEDGE_EVENT_VALUES = { ordinary:[3,5], intensive:[5,8], milestone:[10,15] };
const KNOWLEDGE_MILESTONE_CAP_PER_STAGE = 2;
// 四、4.2.2（9/19新增）：「重大失敗/成就」這類敘事判斷型履歷條目沒有結構化完成狀態可判斷，
// 呼應3.2.2 milestone精神——不由AI自行判斷次數，程式依人生階段計數擋下超額觸發
const MAJOR_EVENT_JUDGED_CAP_PER_STAGE = 2;
// 四、4.2.3（9/19新增）：L3履歷的「人生階段」切法對齊二、2.5的年齡帶定義（學生時期＋七個年齡帶，共8段），
// 不沿用timeState.stageMode（該欄位只有highschool/college/career三值，career涵蓋22-100+整段不夠細，
// 會讓「每階段上限2則」在出社會後的六七十年裡只算一次，違背分階段配額的本意）。
// 學生時期判斷依據呼應3.4.6/9.8改版，統一以studentStatus是否已轉為graduated/withdrawn為準，不看年齡
function chronicleLifeStageKey(s){
  if(s.studentStatus!=="graduated" && s.studentStatus!=="withdrawn") return "student";
  const bucket = LIFE_STAGE_ROUND_BUDGET.find(b=>s.age>=b.minAge && s.age<=b.maxAge);
  return bucket ? `${bucket.minAge}-${bucket.maxAge}` : "career_other";
}
function shouldRecordJudgedMajorEvent(s, majorEventType){
  if(majorEventType!=="achievement" && majorEventType!=="setback") return true; // 非敘事判斷型（例如既有里程碑類），不受此上限管
  const stage = chronicleLifeStageKey(s);
  s.majorEventJudgedCountByStage = s.majorEventJudgedCountByStage||{};
  s.majorEventJudgedCountByStage[stage] = s.majorEventJudgedCountByStage[stage]||0;
  if(s.majorEventJudgedCountByStage[stage] >= MAJOR_EVENT_JUDGED_CAP_PER_STAGE) return false;
  s.majorEventJudgedCountByStage[stage]++;
  return true;
}
function rollKnowledgeRawValue(eventType, eventId, s){
  if(eventType==="ordinary" || eventType==="intensive"){
    const [lo,hi] = KNOWLEDGE_EVENT_VALUES[eventType];
    return rnd(lo,hi);
  }
  if(eventType==="milestone"){
    const stage = s.timeState.stageMode;
    s.knowledgeMilestoneCountByStage[stage] = s.knowledgeMilestoneCountByStage[stage]||0;
    const alreadyUsed = eventId && s.knowledgeMilestoneUsedIds.includes(eventId);
    if(alreadyUsed || s.knowledgeMilestoneCountByStage[stage] >= KNOWLEDGE_MILESTONE_CAP_PER_STAGE){
      return 0; // 程式擋下：同一event_id重複，或本階段milestone次數已達上限
    }
    s.knowledgeMilestoneCountByStage[stage]++;
    if(eventId) s.knowledgeMilestoneUsedIds.push(eventId);
    const [lo,hi] = KNOWLEDGE_EVENT_VALUES.milestone;
    return rnd(lo,hi);
  }
  return 0; // 沒有event_type代表這回合沒有才識相關事件
}

// 八、興趣系統v1（9/16新增）——AI只分類(category/reaction)，候選成立/投入度/降階/下游出口一律由程式計算
// 以下數字皆為【測試參數,待驗證】，文件本身也明講候選淡出時間、轉正門檻等尚未定案，這裡先給一組內部一致的測試值
const INTEREST_CATEGORIES = ["藝術創作","手作工藝","知識研究","體能競技","科技邏輯","社交表演","商業交易"];
const INTEREST_CANDIDATE_TO_ACTIVE_STREAK = 3; // 候選連續正向N次轉正為正式興趣卡【測試參數】
const INTEREST_CANDIDATE_FADE_TURNS = 6; // 候選興趣連續N回合沒有任何互動就自然淡出消失【測試參數】
const INTEREST_ACTIVE_DORMANT_TURNS = 10; // 正式興趣卡連續N回合沒有投入就降階為背景興趣【測試參數】
const INTEREST_SIDE_BUSINESS_THRESHOLD = 40; // 【定案】投入度達40觸發副業契機事件
const SELF_DISCIPLINE_INTEREST_STREAK_1 = 3; // 【定案,3.7.2】連續3次持續投入
const SELF_DISCIPLINE_INTEREST_STREAK_2 = 6; // 【定案,3.7.2】連續6次持續投入

function findInterestCard(s, category){
  return (s.interestCandidates||[]).find(c=>c.category===category);
}
function computeInterestCareerWeightBonus(investment){
  // 8.7【測試值,非正式定案】基礎權重×(1+投入度×0.5%)，純工具函式：目前代碼沒有對應的「職涯分支選擇點」可以接，先備妥公式供未來整合
  return 1 + investment*0.005;
}
// 8.1-8.2 反應三分類：正向累積朝正式興趣卡邁進／中性維持原狀／明確負向暫停或降低(不刪除)
// 8.7 下游出口：自律(僅持續投入計入)、副業契機(投入度40，三選一，見renderSideBusinessModal)
// 8.2（9/16-v2.1補充）候選興趣進度(candidateProgress)與自律連續投入計數(positiveStreak)是兩個獨立欄位：
//   candidateProgress只管candidate→active轉正，positive=+1/neutral=0/negative=-1(下限0)，單次negative不會讓進度整個消失
//   positiveStreak仍是嚴格「連續」計數，供3.7.2自律判定使用，中斷(negative)一樣重新起算，這條規則v2.1未變動
function applyInterestEvent(s, interestEvent){
  if(!interestEvent || !interestEvent.category || !INTEREST_CATEGORIES.includes(interestEvent.category)) return;
  if(!s.interestCandidates) s.interestCandidates = [];
  const category = interestEvent.category;
  const reaction = interestEvent.reaction; // "positive" | "neutral" | "negative"
  let card = findInterestCard(s, category);
  if(!card){
    card = {
      id: category+"_"+s.turnCount, category, status:"candidate", investment:0, positiveStreak:0, candidateProgress:0,
      lastTouchTurn: s.turnCount, sideBusinessOffered:false, sideBusinessStatus:null,
      selfDisciplineAwarded3:false, selfDisciplineAwarded6:false
    };
    s.interestCandidates.push(card);
  }
  card.lastTouchTurn = s.turnCount; // 任何反應都算「有互動」，重置淡出/降階的閒置計時
  if(reaction==="positive"){
    const raw = rnd(4,9); // 8.3【測試參數】原始投入值，量級比照其他成長型數值
    const grown = applyMarginalDiminish(raw, card.investment); // 8.3：與才識/人脈共用同一套邊際遞減
    card.investment = clamp(card.investment+grown, 0, 100);
    card.positiveStreak++;
    card.candidateProgress = (card.candidateProgress||0) + 1; // 8.2：候選進度+1，不設上限
    if(card.status==="candidate" && card.candidateProgress>=INTEREST_CANDIDATE_TO_ACTIVE_STREAK) card.status="active";
    if(card.status==="dormant") card.status="active"; // 8.6：久未投入後重新投入，視為喚醒
    // 3.7.2（9/16新增）自律成長：僅「持續投入」計入，由程式計數連續正向次數，非AI給值
    if(!card.selfDisciplineAwarded3 && card.positiveStreak>=SELF_DISCIPLINE_INTEREST_STREAK_1){
      s.conscientiousness.selfDiscipline = clamp(s.conscientiousness.selfDiscipline+1,0,100);
      card.selfDisciplineAwarded3 = true;
    }
    if(!card.selfDisciplineAwarded6 && card.positiveStreak>=SELF_DISCIPLINE_INTEREST_STREAK_2){
      s.conscientiousness.selfDiscipline = clamp(s.conscientiousness.selfDiscipline+1,0,100);
      card.selfDisciplineAwarded6 = true;
    }
    if(card.status==="active" && !card.sideBusinessOffered && card.investment>=INTEREST_SIDE_BUSINESS_THRESHOLD){
      card.sideBusinessOffered = true;
      s.pendingSideBusinessCardId = card.id; // 8.7：觸發一次副業契機事件，每張卡最多首次觸發一次
    }
  } else if(reaction==="negative"){
    card.positiveStreak = 0; // 連續投入中斷，自律的連續次數獎勵重新起算(3.7.2「連續」語意不變)
    card.selfDisciplineAwarded3 = false; card.selfDisciplineAwarded6 = false;
    card.candidateProgress = Math.max(0, (card.candidateProgress||0) - 1); // 8.2（9/16-v2.1）：候選進度-1，下限0，不整個歸零
    card.investment = clamp(card.investment - rnd(3,8), 0, 100); // 暫停或降低，不整個刪除
  }
  // reaction==="neutral"：不增加也不歸零，維持原狀（investment/positiveStreak/candidateProgress皆不變）
}
// 8.1/8.6：候選興趣久未互動自然淡出消失；正式興趣卡久未投入降階為背景興趣
function sweepInterestDecay(s){
  if(!s.interestCandidates) return;
  s.interestCandidates = s.interestCandidates.filter(card=>{
    const idleTurns = s.turnCount - card.lastTouchTurn;
    if(card.status==="candidate" && idleTurns>=INTEREST_CANDIDATE_FADE_TURNS) return false;
    if(card.status==="active" && idleTurns>=INTEREST_ACTIVE_DORMANT_TURNS) card.status="dormant";
    return true;
  });
}

let state = null;

// 十、10.1（9/19新增）：封測階段純金鑰模式的啟動流程，取代原本單純讀localStorage的loadGame()
// 流程：本機沒有金鑰→顯示「開始新旅程／我有復原金鑰」選擇；本機有金鑰→嘗試自動接續上次玩的slot，
// 失敗（沒記住slot、或該slot讀取失敗）才顯示選擇要繼續哪一段人生的畫面
async function initApp(){
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  if(!key){
    state = { phase:"keyChoice" };
    render();
    return;
  }
  const activeSlotRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
  const activeSlot = activeSlotRaw!==null ? Number(activeSlotRaw) : null;
  if(activeSlot!==null){
    const loaded = await tryLoadSlot(key, activeSlot, true);
    if(loaded) return;
  }
  await showSlotPicker(key);
}
// 讀取指定slot：先試Worker(跨裝置的最新資料)，失敗且allowLocalFallback時退回本機快取（離線容錯，不會直接卡死玩家）
async function tryLoadSlot(key, slot, allowLocalFallback){
  try{
    const res = await fetch(WORKER_URL+"load?key="+encodeURIComponent(key)+"&slot="+slot);
    const data = await res.json();
    if(data && data.success){
      state = data.state;
      try{ localStorage.setItem(STORAGE_KEY+":"+slot, JSON.stringify(state)); }catch(e){}
      render();
      return true;
    }
  }catch(e){ console.warn("從雲端讀取存檔失敗，嘗試本機快取", e); }
  if(allowLocalFallback){
    try{
      const raw = localStorage.getItem(STORAGE_KEY+":"+slot);
      if(raw){ state = JSON.parse(raw); render(); return true; }
    }catch(e){}
  }
  return false;
}
async function showSlotPicker(key){
  let slots = [null,null,null];
  try{
    const res = await fetch(WORKER_URL+"slots?key="+encodeURIComponent(key));
    const data = await res.json();
    if(data && data.success && Array.isArray(data.slots)) slots = data.slots;
  }catch(e){ console.warn("讀取存檔清單失敗", e); }
  state = { phase:"slotPicker", slots };
  render();
}
async function saveGame(){
  const slotRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
  const slot = slotRaw!==null ? Number(slotRaw) : null;
  try{ localStorage.setItem(STORAGE_KEY+(slot!==null?":"+slot:""), JSON.stringify(state)); }
  catch(e){ console.warn("save failed", e); }
  // 十、10.1（9/19新增）：本機存完之後，同步存一份到Worker的KV，達成跨裝置存檔。
  // 只在真正進入遊戲(playing/ending)且有金鑰+slot時才同步，避免setup過程中還沒真的開始的角色也去打API；
  // 失敗只console.warn，不影響當下遊玩（本機那份已經存好了）
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  if(key && slot!==null && state && (state.phase==="playing" || state.phase==="ending")){
    try{
      await fetch(WORKER_URL+"save", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          key, slot,
          meta: { name:state.name, age:state.age, stage:stageLabel(state.age), updatedAt:Date.now() },
          state
        })
      });
    }catch(e){ console.warn("雲端存檔失敗", e); }
  }
}

function rollAttachmentBaseline(styleLabel){
  let anxiety = rnd(30,70), avoidance = rnd(30,70);
  switch(styleLabel){
    case "威權高壓": anxiety+=rnd(0,15); avoidance+=rnd(0,10); break;
    case "情感疏忽": anxiety+=rnd(5,20); avoidance+=rnd(5,15); break;
    case "放任不管": avoidance+=rnd(5,15); break;
    case "民主開放": anxiety-=rnd(5,15); avoidance-=rnd(5,15); break;
    case "隔代教養": avoidance+=rnd(0,10); break;
    case "服刑家長": anxiety+=rnd(5,15); avoidance+=rnd(5,15); break;
  }
  return { anxiety: clamp(anxiety,0,100), avoidance: clamp(avoidance,0,100) };

function rollKeyEvent(familyRuptureApplied){
  if(Math.random()>=0.30) return null;
  const pool = ["反覆遷徙","社交創傷","早熟的責任","意外的高光時刻"];
  if(!familyRuptureApplied) pool.push("家庭斷裂");
  return pick(pool);
}
function applyKeyEvent(type, obj){
  switch(type){
    case "家庭斷裂":
      obj.anxiety = clamp(obj.anxiety+rnd(10,20),0,100);
      obj.avoidance = clamp(obj.avoidance+rnd(10,20),0,100);
      break;
    case "反覆遷徙":
      obj.peerPosition = clamp(obj.peerPosition-rnd(15,25),0,100);
      break;
    case "社交創傷":
      if(Math.random()<0.5) obj.avoidance = clamp(obj.avoidance+rnd(10,20),0,100);
      else obj.anxiety = clamp(obj.anxiety+rnd(10,20),0,100);
      break;
    case "早熟的責任":
      obj.peerPositionSpecial = "照顧者型";
      obj.avoidance = clamp(obj.avoidance+rnd(5,12),0,100);

// 9/19改版：斷點常數÷1000換算自原NT$數字，同步3.4.1家庭月收入/存款的遊戲幣單位改版，避免量級對不上恆算出接近0分（見3.4.6補充定案）
function computeFinancialHealth(savings, monthlyIncome){
  const savingsScore = savings<100 ? (savings/100)*40 : savings<3000 ? 40+((savings-100)/2900)*35 : 75+Math.min(25,(savings-3000)/200);
  const incomeScore = monthlyIncome<40 ? (monthlyIncome/40)*40 : monthlyIncome<100 ? 40+((monthlyIncome-40)/60)*35 : 75+Math.min(25,(monthlyIncome-100)/20);
  return clamp(Math.round(savingsScore*0.5+incomeScore*0.5),0,100);
}

// （零用錢是3.4.1定案的遊戲內單位、故意不對應真實幣值，直接餵進computeFinancialHealth()量級對不上，會恆算出接近0分）
// 9/19改版：切換依據對齊九、9.8，統一用studentStatus判斷（取代原本is_student/occupationCategory是否已賦值），

function computeFinancialHealthForState(s){
  if(s.studentStatus!=="graduated" && s.studentStatus!=="withdrawn"){
    return computeFinancialHealth(s.familySavings||0, s.familyMonthlyIncome||0);
  }
  return computeFinancialHealth(s.cash, s.monthlyIncome);
}

// 3.4.8 基本生活開銷（9/14擴大為所有人生階段適用，依居住狀態決定，不再依occupationCategory開關）
// A4 3×3敏感度分析（9/14內容組指示）：LIVING_COST_MULTIPLIER(1.0/1.5/2.0×) × SALARY_SCALE(0.6/0.8/1.0×)
// LIVING_COST_BASE 是1.0×基準表，金額本身尚未定案（【待驗證】），9/19隨3.4整章遊戲幣單位改版同步÷1000，
// 避免正職薪資(已改為個位數~三位數的遊戲幣)對上仍是NT$量級的基本開銷，導致入不敷出
const LIVING_COST_BASE = { 低:4, 中:8, 高:14 };
let LIVING_COST_MULTIPLIER = 1.0;
let SALARY_SCALE = 1.0;
function livingCostTierForState(s){
  if(!s.housing || s.housing.type==="parents") return "低";
  if(s.housing.type==="rent") return "中";
  if(s.housing.type==="own") return "中";
  return "低";
}
function computeBaseLivingCost(s){
  // 9/14改版：學生時期(尚無正職)改用5.5生活方式選擇的公式，遊戲內單位，不對應NT$；出社會後維持既有housing分級公式
  if(!s.occupationCategory){
    const habitPct = SPENDING_HABITS[s.spendingHabit] ?? SPENDING_HABITS["普通花費"];
    const mealMult = MEAL_EXPENSE_MULT[s.mealArrangement] ?? MEAL_EXPENSE_MULT["自己打理"];
    return Math.round(s.monthlyIncome * habitPct * mealMult);
  }
  const tier = livingCostTierForState(s);
  let amount = LIVING_COST_BASE[tier] * LIVING_COST_MULTIPLIER;
  const hasCohabitingPartner = s.characters.some(c=>c.active && /配偶|伴侶|先生|太太|老公|老婆/.test(c.relation||""));
  if(hasCohabitingPartner) amount = Math.round(amount*0.75); // 與伴侶共同生活分攤，依家庭結構調整（暫定折減比例，待模擬後校準）
  return Math.round(amount);
}

  const sibRoll = rnd(1,100);

  for(let i=0;i<sibCount;i++){

// 二、2.2學期內部節奏切分（9/16改版）：期中/期末各自有完整準備期（取代原本「期中後~期末前」單一段落混合準備+收尾的不對稱結構）
// 一學年14段，每段有回合預算(budget)，期中考/期末考是budget=1的里程碑段，觸發時算考試成績

];
const YEAR_SEGMENTS = [

  ...SEMESTER_PHASES.map(p=>({ ...p, half:"下學期" }))
]; // 14段：上學期7段+下學期7段（假期段落分別代表寒假/暑假），一學期預算上限27回合、一學年54回合

// 二、2.5（9/16新增，9/16-v2.1下修數字+年齡帶改左閉右開）：22歲以後加速曲線，取代原本「30歲以後交給AI自行判斷age_advance」的舊架構
// 邊界採10年一段、左閉右開（以生日為界，22-29歲＝22歲起滿30歲生日前），取代v2.1之前22-30/31-40等不對稱分段
const LIFE_STAGE_ROUND_BUDGET = [
  { minAge:22, maxAge:29, roundsPerYear:32 }, // 找方向期
  { minAge:30, maxAge:39, roundsPerYear:28 },
  { minAge:40, maxAge:49, roundsPerYear:15 },
  { minAge:50, maxAge:59, roundsPerYear:12 },
  { minAge:60, maxAge:69, roundsPerYear:10 },
  { minAge:70, maxAge:79, roundsPerYear:7 },
  { minAge:80, maxAge:9999, roundsPerYear:5 } // 【待驗證】預設值，實際存活年數依死亡判定結果而定
];
function roundsPerYearForAge(age){
  const bucket = LIFE_STAGE_ROUND_BUDGET.find(b=>age>=b.minAge && age<=b.maxAge);
  return bucket ? bucket.roundsPerYear : 10;
}
// 九、9.4（9/16新增，大學科系系統實作前的鋪墊）：修業年限改為依角色查表，取代原本寫死的「大學4年」
// s.collegeYearsRequired：科系基礎修業年限，尚未實作科系選擇機制前預設4年（一般科系），未來9.2/9.4科系選擇會把醫/牙/獸科系寫入5
// s.collegeDelayYearsUsed：已使用的延畢年數，封頂COLLEGE_DELAY_CAP，尚未實作延畢觸發機制前預設0
const COLLEGE_DELAY_CAP = 2; // 【定案,9.4】延畢封頂兩年
// 9.5.2（9/16 ChatGPT開發審閱+Claude Code判斷,可覆寫）：雙主修zero-cost，不計入delay_years，
// 所以雙主修相關代碼（尚未實作）完成後也不該呼叫任何地方去增加collegeDelayYearsUsed
function collegeTotalYearsRequired(s){
  const base = s.collegeYearsRequired || 4;
  const delay = clamp(s.collegeDelayYearsUsed||0, 0, COLLEGE_DELAY_CAP);
  return base + delay;
}
const COLLEGE_GRAD_AGE_CAP = { 4:24, 5:25 }; // 【定案,9.4】其餘科系最晚24歲、醫牙獸最晚25歲畢業
// 9.4「轉系最後可行年齡」：轉系當下年齡+目標科系修業年限+目前已用延畢年數，不得超過目標科系的畢業年齡上限
// （已用延畢年數要算進去，因為它代表「已消耗掉多少延畢緩衝額度」，轉系不會重置這個額度，見9.4【待驗證】備註）
function isTransferFeasible(currentAge, targetYearsRequired, delayYearsUsed){
  const cap = COLLEGE_GRAD_AGE_CAP[targetYearsRequired] || COLLEGE_GRAD_AGE_CAP[4];
  const usedDelay = clamp(delayYearsUsed||0, 0, COLLEGE_DELAY_CAP);
  return (currentAge + targetYearsRequired + usedDelay) <= cap;
}
function collegeYearLabel(s){
  const base = s.collegeYearsRequired || 4;
  const yearInStage = s.timeState.yearInStage;
  if(yearInStage<=base){
    const ordinals = ["大一","大二","大三","大四","大五"];
    return ordinals[clamp(yearInStage,1,ordinals.length)-1];
  }
  return `延畢第${yearInStage-base}年`; // 超過基礎修業年限的部分，用延畢年數標示，不再套用「大X」序數
}

];

// 9.3 下游伏筆權重表（高/中/低相對排序，9/16 ChatGPT開發審閱建議改用「共同基準機率×類別倍率」，
// 具體絕對機率仍是【待補充,測試組】，這裡的BASE/MULTIPLIER都是實作階段自訂的【測試參數】，非正式定案數字）
const FORESHADOW_LINES = ["創業線","自由接案","海外線","演藝圈線","接手家業"];
const FORESHADOW_BASE_RATE = 0.08; // 【定案,9/16補充,標記測試參數】封測用第一組數字：共同基準機率8%（乘上類別倍率後才是實際機率）
const FORESHADOW_WEIGHT_MULTIPLIER = { 高:2.0, 中:1.0, 低:0.4 }; // 【定案,9/16補充,標記測試參數】
const MAJOR_FORESHADOW_WEIGHT_TABLE = {
  "理工資訊":       { 創業線:"中", 自由接案:"高", 海外線:"中", 演藝圈線:"低", 接手家業:"低" },
  "商管財經":       { 創業線:"高", 自由接案:"中", 海外線:"中", 演藝圈線:"低", 接手家業:"中" },
  "人文語言傳播":   { 創業線:"低", 自由接案:"高", 海外線:"高", 演藝圈線:"中", 接手家業:"低" },
  "醫藥護理":       { 創業線:"低", 自由接案:"低", 海外線:"中", 演藝圈線:"低", 接手家業:"低" },
  "教育":           { 創業線:"低", 自由接案:"中", 海外線:"低", 演藝圈線:"低", 接手家業:"低" },
  "藝術設計表演":   { 創業線:"中", 自由接案:"高", 海外線:"中", 演藝圈線:"高", 接手家業:"低" },
  "法律政治":       { 創業線:"低", 自由接案:"低", 海外線:"中", 演藝圈線:"低", 接手家業:"低" },
  "服務社工餐旅":   { 創業線:"中", 自由接案:"中", 海外線:"低", 演藝圈線:"低", 接手家業:"高" }
};
// 任何科系都能觸發任何一條伏筆線（9.3【定案】不做獨佔鎖死），這裡只回傳「這回合這條線的觸發機率」讓呼叫端自行擲骰
function foreshadowTriggerProbability(majorGroup, line){
  const weight = (MAJOR_FORESHADOW_WEIGHT_TABLE[majorGroup]||{})[line] || "低";
  return FORESHADOW_BASE_RATE * (FORESHADOW_WEIGHT_MULTIPLIER[weight]||1);
}

// 9.8 學生主狀態欄位規格：判斷是否已出社會一律用studentStatus，不是單純看年齡（9.8【定案】）
function assignStudentMajor(s, majorKey, isFiveYear){
  const cat = findMajorCategory(majorKey);
  if(!cat) return;
  s.studentMajorGroup = majorKey;
  s.studentIsFiveYearTrack = !!(cat.isFiveYearEligible && isFiveYear);
  s.collegeYearsRequired = s.studentIsFiveYearTrack ? 5 : 4;
}
function computeExpectedGraduationAge(s){
  // 預計畢業年齡：以目前年齡推算，若尚未進大學則用最新collegeYearsRequired/collegeDelayYearsUsed純推算，不受轉系影響殘留
  const remainingYears = collegeTotalYearsRequired(s) - (s.timeState?.yearInStage||1) + 1;
  return s.age + Math.max(0, remainingYears);
}
// 9.5.1 轉系候選觸發：連續兩次段考成績低於預期區間【測試參數，9.7測試項目2待校準】
// 「預期區間」用跟2.4考試成績算法同精神、但採client端可重算的proxy（知識值+讀書次數×3），
// 不依賴AI自由回報的敘事分數，確保這條線完全不受AI輸出內容影響（9.9 AI/程式責任邊界的要求）
const TRANSFER_EXAM_EXPECTATION_THRESHOLD = 55; // 【測試參數】低於此proxy分數視為「低於預期」
const TRANSFER_EXAM_STREAK_TRIGGER = 2; // 【定案】連續兩次
const TRANSFER_COOLDOWN_TURNS = 8; // 【測試參數,9.5.1新增待補】轉系候選冷卻回合數
function updateTransferCandidateOnExam(s, studyCountAtExam){
  const proxy = clamp(Math.round(s.stats.knowledge + (studyCountAtExam||0)*3), 0, 100);
  const belowExpectation = proxy < TRANSFER_EXAM_EXPECTATION_THRESHOLD;
  s.examBelowExpectationStreak = belowExpectation ? (s.examBelowExpectationStreak||0)+1 : 0;
  s.lastExamPerformanceLog = { expected: TRANSFER_EXAM_EXPECTATION_THRESHOLD, actual: proxy, streak: s.examBelowExpectationStreak };
  if(s.studentStatus==="enrolled" && !s.transferCooldown && s.examBelowExpectationStreak>=TRANSFER_EXAM_STREAK_TRIGGER){
    s.pendingTransferOffer = true;
  }
}

// 十一、11.4明牌檢定機制（9/19新增，首版白名單僅「期末考成績公布」一項）：
// 定案文字只規定呈現格式要有「骰值＋屬性加成換算依據＋門檻對比＋成敗結果」，沒有給具體骰值範圍/及格門檻數字，
// 以下數字皆為實作階段選定的【測試參數，待驗證】——60分及格門檻沿用台灣常見及格線慣例、骰值範圍呼應
// system prompt既有「hint±10分左右合理，保留少量機率更意外」的敘事指示，改寫成client端可明牌呈現的擲骰版本
const EXAM_CHECK_PASS_THRESHOLD = 60; // 【測試參數，待驗證】
function rollFinalExamCheck(wisdom, studyCount){
  const base = clamp(Math.round(wisdom + (studyCount||0)*3), 0, 100); // 沿用既有2.4.1大方向層公式
  const roll = rnd(1,100); // 骰值，明牌呈現給玩家
  let swing;
  if(roll<=90){
    swing = rnd(-10,10); // 一般範圍
  } else {
    // 保留少量意外機率，正負對半，不偏向負面（呼應六、6.1正向配額精神）
    swing = (roll%2===0) ? rnd(11,25) : rnd(-25,-11);
  }
  const finalScore = clamp(base+swing, 0, 100);
  return { wisdom:Math.round(wisdom), studyCount:(studyCount||0), base, roll, swing, finalScore, passThreshold: EXAM_CHECK_PASS_THRESHOLD, passed: finalScore>=EXAM_CHECK_PASS_THRESHOLD };
}
// 9.5.2 雙主修候選觸發：才識數值達門檻【測試參數，9.7測試項目3待校準】，或特定科系伏筆權重被觸發
const DUAL_MAJOR_KNOWLEDGE_THRESHOLD = 70; // 【測試參數】
function checkDualMajorCandidate(s){
  if(s.studentStatus!=="enrolled" || s.dualMajorStatus) return; // 已經是candidate/active/abandoned/completed就不重複判定
  if(s.stats.knowledge>=DUAL_MAJOR_KNOWLEDGE_THRESHOLD){
    s.dualMajorStatus = "candidate"; s.pendingDualMajorOffer = true; return;
  }
  // 「特定科系伏筆權重被觸發」：用商管財經線的創業權重當作雙主修傾向的簡化代表（實作階段自訂映射，非文件明文規定）
  if(s.studentMajorGroup && Math.random() < foreshadowTriggerProbability(s.studentMajorGroup, "創業線")){
    s.dualMajorStatus = "candidate"; s.pendingDualMajorOffer = true;
  }
}
// 9.5.2（9/16補充）雙主修中途放棄候選：dual_major_status=active期間，自律或財務健康度連續3回合低於40分成立候選，冷卻4回合
const DUAL_MAJOR_ABANDON_STRESS_THRESHOLD = 40; // 【定案,9/16補充】自律或財務健康度低於此分視為壓力訊號（呼應3.7.3的50分中性基準，取中性偏下）
const DUAL_MAJOR_ABANDON_STREAK_TRIGGER = 3; // 【定案,9/16補充】連續3回合
const DUAL_MAJOR_ABANDON_COOLDOWN_TURNS = 4; // 【定案,9/16補充】冷卻4回合，避免連續跳出同一提案
function checkDualMajorAbandonCandidate(s){
  if(s.dualMajorStatus!=="active" || s.pendingDualMajorAbandonOffer) return;
  if((s.dualMajorAbandonCooldown||0)>0) return;
  const financialHealth = computeFinancialHealthForState(s); // 9/16修正：雙主修進行中一定是學生，改用家庭財務數字
  const underStress = s.conscientiousness.selfDiscipline<DUAL_MAJOR_ABANDON_STRESS_THRESHOLD || financialHealth<DUAL_MAJOR_ABANDON_STRESS_THRESHOLD;
  s.dualMajorAbandonStreak = underStress ? (s.dualMajorAbandonStreak||0)+1 : 0;
  if(s.dualMajorAbandonStreak>=DUAL_MAJOR_ABANDON_STREAK_TRIGGER){
    s.pendingDualMajorAbandonOffer = true;
  }
}
// 9.5.3 休學/肄業候選觸發：持續低值（連續N回合），不是單次瞬間跌破（9/16 ChatGPT開發審閱補強）
// 健康面沿用既有s.lowHealthStreak（health<30才累加，早於本次開發就存在），財務面新增s.lowCashStreak（呼應3.4.10學生現金floor在0的既有保護機制）
const WITHDRAWAL_STREAK_TRIGGER = 4; // 【測試參數，9.7測試項目4待校準】
function checkWithdrawalCandidate(s){
  if(s.studentStatus!=="enrolled" || s.leaveStatus!=="normal" || s.pendingLeaveOffer) return;
  if((s.lowHealthStreak||0)>=WITHDRAWAL_STREAK_TRIGGER){ s.pendingLeaveOffer = "health"; return; }
  if((s.lowCashStreak||0)>=WITHDRAWAL_STREAK_TRIGGER){ s.pendingLeaveOffer = "financial"; }
}
// 9.8 leave_status復學（9/16補充,取代原本「不真的暫停回合引擎」的簡化說明）：休學期間改用獨立的「休學學期」段落，
// 回合數比照2.3假期段落份量（6-8回合，測試參數），不套用SEMESTER_PHASES/YEAR_SEGMENTS正常學期結構（見advanceStructuredTime的onLeave分支）；
// 復學時該學期視為未完成，segmentIndex重置回休學當下那個學期（上/下學期）的開頭重新跑一次，不從中斷點續接
const LEAVE_OF_ABSENCE_TURNS = 7; // 【測試參數,9/16補充】6-8回合區間，比照2.3假期段落份量
// 每回合college狀態下都要跑的維護：冷卻倒數、財務floor連續低值streak、休學復學倒數、雙主修/休學候選檢查
function sweepUniversityState(s){
  if(s.timeState?.stageMode!=="college" || s.studentStatus!=="enrolled") return;
  if(s.transferCooldown>0) s.transferCooldown--;
  if(s.dualMajorAbandonCooldown>0) s.dualMajorAbandonCooldown--; // 9.5.2（9/16補充）雙主修中途放棄候選冷卻
  s.lowCashStreak = s.cash<=0 ? (s.lowCashStreak||0)+1 : 0;
  if(s.leaveStatus==="onLeave"){
    s.leaveResumeCountdown = (s.leaveResumeCountdown||LEAVE_OF_ABSENCE_TURNS)-1;
    if(s.leaveResumeCountdown<=0){
      // 9.5.3（9/16補充）復學：leave_status轉正常，segmentIndex重置回休學前那個學期的開頭（不是中斷點），
      // turnsInSegment/study_count_this_term一併歸零，program_year（yearInStage）維持不變（不前進）
      s.leaveStatus = "normal"; s.leaveResumeCountdown = 0;
      s.timeState.segmentIndex = s.leaveSemesterHalfIndex||0;
      s.timeState.turnsInSegment = 0;
      s.studyCountThisTerm = 0;
      s.universityEventLog = { type:"leave_resumed" };
    }
    return; // 休學期間不再檢查新的雙主修/休學候選
  }
  checkDualMajorCandidate(s);
  checkDualMajorAbandonCandidate(s); // 9.5.2（9/16補充）雙主修中途放棄候選
  checkWithdrawalCandidate(s);
}
function segmentLabel(seg, isFirstHalf){
  if(seg.key==="假期") return isFirstHalf ? "寒假" : "暑假";
  return seg.half+"・"+seg.key;
}
function computeTimeLabel(s){
  const mode = s.timeState.stageMode;
  if(mode==="college" && s.leaveStatus==="onLeave"){
    return collegeYearLabel(s)+"・休學中"; // 9.5.3（9/16補充）：學期引擎凍結期間不顯示段落標籤，避免看起來仍在正常推進
  }
  if(mode==="highschool" || mode==="college"){
    const idx = s.timeState.segmentIndex % YEAR_SEGMENTS.length;
    const seg = YEAR_SEGMENTS[idx];
    const yr = mode==="highschool"
      ? ["高一","高二","高三"][clamp(s.timeState.yearInStage,1,3)-1]
      : collegeYearLabel(s);
    let label = yr+"・"+segmentLabel(seg, idx<SEMESTER_PHASES.length);
    if(mode==="college" && s.timeState.yearInStage>=collegeTotalYearsRequired(s) && idx>=SEMESTER_PHASES.length) label += "（畢業倒數）";
    return label;
  }
  if(mode==="career"){
    if(s.age<=29) return `入職第${s.age-21}年`; // 22歲入職算第1年
    return `${s.age}歲`; // 呼應一、1.1.2：30歲以後改用年齡本身當時間戳，不再細分上下半年
  }
  return `${s.age}歲`;
}
// 介面：現階段進度指示（9/16新增）——依目前所在模式，回傳「這個小段落」還剩多少回合的進度資訊，供UI畫進度條
// 三種模式各自的「一個段落」定義不同：學生時期是目前學期段落(開學初/準備期/考試/假期等)；休學中是休學倒數；出社會是本年度
function computeStageProgress(s){
  const mode = s.timeState.stageMode;
  if(mode==="college" && s.leaveStatus==="onLeave"){
    const total = LEAVE_OF_ABSENCE_TURNS;
    const current = clamp(total - (s.leaveResumeCountdown ?? total), 0, total);
    return { label:"休學進度", current, total };
  }
  if(mode==="highschool" || mode==="college"){
    const idx = s.timeState.segmentIndex % YEAR_SEGMENTS.length;
    const seg = YEAR_SEGMENTS[idx];
    return { label:segmentLabel(seg, idx<SEMESTER_PHASES.length)+"進度", current:Math.min(s.timeState.turnsInSegment||0, seg.budget), total:seg.budget };
  }
  if(mode==="career"){
    const total = roundsPerYearForAge(s.age);
    return { label:"本年度進度", current:Math.min(s.timeState.adultTurnsInYear||0, total), total };
  }
  return null;
}
function detectTimeSkipIntent(actionText){
  return /跳過|直接|快轉|之後|畢業後|下學期|寒假|暑假|一段時間後|過了/.test(actionText||"");
}
function detectStudyIntent(actionText){
  return /讀|念|書|學|考|研究|課/.test(actionText||"");
}
// 依經過的segment範圍[fromIdx+1, toIdx]（含跳過中間夾帶的），偵測是否跨過期中/期末考，回傳最後一個遇到的考試型別
function detectExamCrossed(fromIdx, toIdx){
  let examType = null;
  for(let i=fromIdx+1;i<=toIdx;i++){
    const seg = YEAR_SEGMENTS[i%YEAR_SEGMENTS.length];
    if(seg.isExam) examType = seg.examType;
  }
  return examType;
}
function advanceStructuredTime(actionText){
  const s = state;
  const mode = s.timeState.stageMode;
  const skip = detectTimeSkipIntent(actionText);
  // 九、9.5.3（9/16補充）：休學期間學期引擎完全凍結，不套用SEMESTER_PHASES/YEAR_SEGMENTS，
  // segmentIndex/turnsInSegment/考試判定一律不動；回合預算另外由sweepUniversityState()的leaveResumeCountdown計數
  if(mode==="college" && s.leaveStatus==="onLeave"){
    const label = computeTimeLabel(s);
    return { bigJump:false, fromLabel:label, toLabel:label, monthsCrossed:1, examTriggered:false, examType:null };
  }
  if(detectStudyIntent(actionText)) s.studyCountThisTerm = (s.studyCountThisTerm||0)+1;
  if(mode==="highschool" || mode==="college"){
    const fromLabel = computeTimeLabel(s);
    const fromGlobalIdx = (s.timeState.yearInStage-1)*YEAR_SEGMENTS.length + s.timeState.segmentIndex;
    let examType = null;
    let monthsCrossed;
    if(skip){
      // 跳過語意：直接跳過整個段落（甚至更多），不逐回合累積turnsInSegment
      const jumpSegs = rnd(2,4);
      const toGlobalIdx = fromGlobalIdx + jumpSegs;
      examType = detectExamCrossed(fromGlobalIdx, toGlobalIdx);
      s.timeState.segmentIndex = toGlobalIdx % YEAR_SEGMENTS.length;
      s.timeState.turnsInSegment = 0;
      const yearsToAdd = Math.floor(toGlobalIdx/YEAR_SEGMENTS.length) - Math.floor(fromGlobalIdx/YEAR_SEGMENTS.length);
      monthsCrossed = Math.round(jumpSegs*1.5);
      if(yearsToAdd>0) advanceStageYear(s, mode, yearsToAdd);
    } else {
      // 一般行動：這個段落的turnsInSegment+1，滿了budget才進下一段
      s.timeState.turnsInSegment = (s.timeState.turnsInSegment||0)+1;
      const currentSeg = YEAR_SEGMENTS[s.timeState.segmentIndex%YEAR_SEGMENTS.length];
      monthsCrossed = 1.5; // 每回合粗估1.5個月，budget結束時的整段時間感由多回合累積出來
      if(s.timeState.turnsInSegment >= currentSeg.budget){
        if(currentSeg.isExam) examType = currentSeg.examType;
        s.timeState.turnsInSegment = 0;
        const toGlobalIdx = fromGlobalIdx + 1;
        s.timeState.segmentIndex = toGlobalIdx % YEAR_SEGMENTS.length;
        const yearsToAdd = Math.floor(toGlobalIdx/YEAR_SEGMENTS.length) - Math.floor(fromGlobalIdx/YEAR_SEGMENTS.length);
        if(yearsToAdd>0) advanceStageYear(s, mode, yearsToAdd);
      }
    }
    const result = { bigJump: skip, fromLabel, toLabel: computeTimeLabel(s), monthsCrossed, examTriggered: !!examType, examType };
    if(examType) s.studyCountThisTerm = 0; // 考試結算後歸零，重新累積下一次備考的讀書次數
    return result;
  }
  if(mode==="career"){
    // 二、2.5（9/16新增）：22歲以後改用「每年回合預算」取代原本半年制，budget依年齡查LIFE_STAGE_ROUND_BUDGET
    const fromLabel = computeTimeLabel(s);
    const budget = roundsPerYearForAge(s.age);
    let yearsToAdd = 0;
    let monthsCrossed;
    if(skip){
      // 跳過語意：直接跳完當年剩餘回合，進入下一年（實作假設：比照學生時期"跳過至少跨一段"的精神，此處對應"至少跨完當年"）
      s.timeState.adultTurnsInYear = 0;
      yearsToAdd = 1;
      monthsCrossed = 12;
    } else {
      s.timeState.adultTurnsInYear = (s.timeState.adultTurnsInYear||0) + 1;
      monthsCrossed = +(12/budget).toFixed(2); // 每回合粗估幾個月，隨年齡區間的budget不同而不同
      if(s.timeState.adultTurnsInYear >= budget){
        s.timeState.adultTurnsInYear = 0;
        yearsToAdd = 1;
      }
    }
    let deathCheck = { justForeshadowed:false, deathTriggered:false };
    if(yearsToAdd>0){
      s.age += yearsToAdd;
      deathCheck = rollAnnualDeathCheck(s); // 七、7.1.5：每滿一年才判定一次，不是每回合都判定
    }
    return { bigJump: skip, fromLabel, toLabel: computeTimeLabel(s), monthsCrossed, examTriggered:false, examType:null, deathForeshadowNow: deathCheck.justForeshadowed, deathTriggered: deathCheck.deathTriggered };
  }
  return { bigJump:false, fromLabel:null, toLabel:null, monthsCrossed:0, examTriggered:false, examType:null };
}
function advanceStageYear(s, mode, yearsToAdd){
  s.age += yearsToAdd;
  s.timeState.yearInStage += yearsToAdd;
  if(mode==="highschool" && s.timeState.yearInStage>3){
    s.timeState.stageMode="college"; s.timeState.yearInStage=1;
    s.milestones.graduation_highschool = "completed"; // 4.3事件狀態機制：客戶端結構化判斷，不假手AI
    s.studentStatus = "enrolled"; s.pendingMajorSelection = true; // 九、9.1：進大學觸發選科系流程
  } else if(mode==="college" && s.timeState.yearInStage>collegeTotalYearsRequired(s)){
    s.timeState.stageMode="career"; s.timeState.adultTurnsInYear=0;
    s.milestones.graduation_college = "completed";
    s.studentStatus = "graduated"; // 九、9.8：畢業後用studentStatus判斷已出社會，不是只看年齡
    // 9.5.2：畢業時若雙主修仍在active狀態，直接結算為completed（本輪未實作中途主動放棄的獨立UI，見CHANGELOG）
    if(s.dualMajorStatus==="active") s.dualMajorStatus = "completed";
  }
}

function activeCharacters(){
  return state.characters.filter(c=>c.active);
}
function demoteStaleCharacters(){
  const THRESHOLD=12;
  state.characters.forEach(c=>{
    if(c.active && (state.turnCount - c.lastTurn) > THRESHOLD){
      c.active=false;
      // 四、4.4戀愛系統：曖昧中/交往中的對象長期沒互動，沿用既有12回合降級機制視為自然淡出分手（呼應4.4「分手不另建專屬機制」定案）
      if(c.romanceStatus==="ambiguous" || c.romanceStatus==="dating") c.romanceStatus = "breakup";
    }
  });
}

// ========== 四、4.1.1顯示規則 + 4.4戀愛系統（簡單版，9/16新增） ==========
// AI只分類romantic_signal（positive/negative），狀態機轉換完全由客戶端判斷，呼應4.3「AI自由判斷會不一致，一律交由客戶端結構化計算」精神
const ROMANCE_AMBIGUOUS_PROGRESS = 3; // 【測試參數,待驗證】累積正向次數達此值，從null進入「曖昧中」
const ROMANCE_DATING_PROGRESS = 9; // 【測試參數,待驗證】累積正向次數達此值(=3+6)，從「曖昧中」進入「交往中」
const ROMANCE_STABLE_STREAK = 6; // 【測試參數,待驗證】「交往中」時連續正向次數達此值，進入「穩定交往」
const ROMANCE_BREAKUP_STREAK = 3; // 【測試參數,待驗證】「交往中」或「穩定交往」時連續負向次數達此值，判定「分手」
// 四、4.1（9/19補充,修正既有定案未落實問題）：「重要共同記憶」欄位機制性上限2則,FIFO捨棄最舊一則,
// 由程式機械判定不交由AI決定——原本是無上限字串累加,違反4.1「1-2句話等級」的既有定案文字
function appendNpcSharedMemory(c, addition){
  if(!addition) return;
  // 相容既有存檔：舊資料只有c.summary字串(可能已經是很長的無上限累加結果)時，整段視為單一則，不嘗試用「；」拆解
  // （拆解會被內容本身若剛好含「；」字元誤判斷句，不夠穩健，讓它自然在後續幾次更新中被FIFO擠出去即可）
  c.summaryEntries = c.summaryEntries || (c.summary ? [c.summary] : []);
  c.summaryEntries.push(addition);
  while(c.summaryEntries.length>2) c.summaryEntries.shift();
  c.summary = c.summaryEntries.join("；");
}
function relationCategoryLabel(c){
  // 4.4：關係類別新增「戀愛對象／曖昧對象」，由狀態機決定，不由AI自行填寫
  if(c.romanceStatus==="ambiguous") return "曖昧對象";
  if(c.romanceStatus==="dating" || c.romanceStatus==="stable") return "戀愛對象";
  return c.relation||"";
}
function relationshipStatusLabel(c){
  // 4.1.1「目前關係狀態」文字化呈現。非戀愛關係的級距文字為【測試參數,待驗證】的實作判斷，非文件明文規定的精確級距
  if(c.romanceStatus==="ambiguous") return "曖昧中";
  if(c.romanceStatus==="dating") return "交往中";
  if(c.romanceStatus==="stable") return "穩定交往中";
  if(c.romanceStatus==="breakup") return "貌合神離";
  if(!c.active) return "漸行漸遠";
  if(c.affinity>=80) return "多年好友";
  if(c.affinity>=60) return "熟悉的朋友";
  if(c.affinity>=40) return "普通朋友";
  if(c.affinity>=20) return "認識不深";
  return "關係生疏";
}
function applyRomanceSignal(s, c, signal){
  if(!signal || !c) return;
  c.romanceProgress = c.romanceProgress||0;
  c.romanceStableStreak = c.romanceStableStreak||0;
  c.romanceNegativeStreak = c.romanceNegativeStreak||0;
  const prevStatus = c.romanceStatus||null;
  if(signal==="positive"){
    c.romanceProgress += 1;
    c.romanceNegativeStreak = 0;
    if(!c.romanceStatus && c.romanceProgress>=ROMANCE_AMBIGUOUS_PROGRESS){
      c.romanceStatus = "ambiguous";
    } else if(c.romanceStatus==="ambiguous" && c.romanceProgress>=ROMANCE_DATING_PROGRESS){
      c.romanceStatus = "dating";
    } else if(c.romanceStatus==="dating"){
      c.romanceStableStreak += 1;
      if(c.romanceStableStreak>=ROMANCE_STABLE_STREAK) c.romanceStatus = "stable";
    }
  } else if(signal==="negative"){
    c.romanceProgress = Math.max(0, c.romanceProgress-1);
    c.romanceStableStreak = 0;
    if(c.romanceStatus==="dating" || c.romanceStatus==="stable"){
      c.romanceNegativeStreak += 1;
      if(c.romanceNegativeStreak>=ROMANCE_BREAKUP_STREAK) c.romanceStatus = "breakup";
    }
  }
  // 4.4定案：first_romance里程碑改由客戶端在第一次進入「交往中」時自動判定，取代AI自由回報（9/16使用者確認）
  if(prevStatus!=="dating" && c.romanceStatus==="dating" &&
     s.milestones.first_romance!=="completed" && s.milestones.first_romance!=="skipped"){
    s.milestones.first_romance = "completed";
  }
}

function buildSystemPrompt(){
  return `你是「人生草稿」的敘事引擎。這是一款寫實的現代人生模擬文字遊戲，玩家在台灣現代社會中從15歲的高中生一路活到老年。

- 【誰在場原則】：父母的互動應該低頻但情感權重高，不要每回合都出現；日常高頻互動應該交給同儕、老師、老闆、同事這些人負責，父母只在真正合適的時機才登場。
- 【避免AI感的寫作提醒】：(1) 不要濫用「不是A，是B」這種對比句型，那是講解機制方便理解用的，直接寫進敘事會讓內心話變得像在做心理測驗解說；(2) 不是每一段內心獨白都要收在一個「頓悟」或「發現」上，真實的人常常想到一半就被打斷、或根本沒有結論；(3) 避免把不同情境寫成同一種「畫面→動作→內心一句話」的固定結構，節奏要雜亂不對稱；(4) 適度加入一些「不重要的細節」——真實的內心話會岔題、講廢話、想到不相干的事，不必每一句都在為劇情或性格服務。
- 數值：健康、才識、表達力、人脈、外表（0-100，可見），存款/月收入/月支出（遊戲幣單位金額，可見），以及隱藏的智慧、邏輯能力、幸福感、人格魅力風格、做事態度光譜（自律/審慎/成就傾向/責任感/團隊vs單打獨鬥，各0-100，開局都是50中性值，純靠選擇累積）。
- 【財富改遊戲幣具體金額制，9/19改版取代原本真實台幣金額制】：不要用0-100分數描述財富，一律使用 payload 裡的 savings（存款）、monthly_income（月收入）、monthly_expenses（月支出項目列表）、financial_health（財務健康度0-100，內部換算好給你參考機率用，不用讓玩家看到這個數字）。**全人生階段(不分學生或出社會)的savings/monthly_income/one_time_transaction等金額欄位，一律是遊戲幣單位，不是新台幣，敘事裡不要講「NT$」「元」這種真實幣值字眼，只講「錢」「存款」這種抽象講法即可，例如「你數了數口袋裡的錢」而不是「你數了數口袋裡的300元」**。日常小額開銷不用你計算，系統會在回合之間自動結算月收支（滿一個月份邊界才結算，你完全不用管這個算術）。你只需要在下列情況回傳對應欄位：
  - job_change：玩家獲得/更換正職工作時填寫 {occupation_category:八大類其中之一, monthly_salary:數字}，薪資請落在該類別的合理範圍內（遊戲幣單位，9/19改版：自營業者25-80+；白領上班族32-100+；勞力/服務業29.5-45；待業中0-25；長期不在身邊35-70；自由接案0-150+，波動大；軍公教警消32-70；政治人物50-100+）；沒有變動則整個欄位設為 null
  - expense_change：房租/貸款這類「會持續每月扣的支出」有變動時，回傳陣列 [{label:"房租"/"學貸"/"房貸"等, monthly_amount:數字, action:"start"或"end"}]；沒有變動則回傳空陣列 []
  - one_time_transaction：醫療費、大筆消費、意外之財等「一次性」收支，回傳陣列 [{label:"", amount:數字（收入為正、支出為負）}]；沒有則回傳空陣列 []
  - 【學費，9/16改版】學生時期學費（含一般學雜費、雙主修學分費）統一由家長支付，不從玩家個人現金扣款——你不需要也不可以透過one_time_transaction/expense_change回報任何學費相關金額，助學貸款/公私立分流也不用處理。如果要在敘事裡帶到繳學費的情境，純粹當背景細節描寫（例如「這學期學費爸媽已經匯過去了」），不影響任何數值
  - 醫療/意外/不孕症治療等費用，先在 payload 的 can_afford_medical 裡看低/中/高三級玩家財務健康度能不能負擔（20/50/75門檻），能負擔就直接在 one_time_transaction 扣款，不能負擔就在敘事裡走向借款/分期/放棄/尋求補助等分支，不要讓玩家默默揹債卻沒有劇情反映
  - 【學生存款下限0，不能變負值】：is_student 為 true 時，玩家提出的消費行為，如果金額會超過目前 savings，這筆消費「不會發生」，系統會自動擋下不真的扣款——你在敘事上要配合寫成「猶豫之後還是沒買」「算了算口袋裡的錢，還是算了」這種打消念頭的語氣，不要寫成「買了但錢變成負的」或忽略這個限制硬寫買成功
  - 【三餐解決方式 meal_arrangement：家裡包辦/自己打理/外食為主】：payload 會告訴你目前的三餐安排，影響敘事情境的自然選擇——「自己打理」適合帶出下廚、超商微波、宿舍小廚房這類畫面；「外食為主」適合帶出小吃店、便當店、跟同學一起吃飯這類畫面；「家裡包辦」則餐食本身很少入鏡，重點在家人準備飯菜的互動細節。payload 的 meal_event_multipliers 會給你社交偶遇類事件、健康加分命中、打工社團類里程碑這三項的機率倍率參考（只在自己打理/外食為主之間有差異），大方向機率請依這個倍率調整，不要每次都一樣
- 【才識成長，三、3.2.2，9/16修正】：不要在stat_deltas裡給knowledge數值（這個欄位已經移除），改成透過event_type標籤告訴系統這回合的學習份量：這回合沒有任何值得累積才識的事件就整個不填(null)；一般程度的學習/嘗試填"ordinary"；份量明顯更重的（熬夜衝刺、投入大量心力鑽研）填"intensive"；真正重大的突破/成就（不能自己隨口認定，只有情節上真的是重大轉折時才用）填"milestone"，且milestone必須額外提供event_id（幫這個具體事件取一個簡短英文/拼音代稱，之後如果同一件事被你在敘事裡重複提起，要用同一個event_id，讓系統知道這是同一件事不是新的一次）。實際會轉換成多少才識成長、milestone一個人生階段最多能算幾次，都由系統計算，不用你操心精確公式或去記錄次數。
- 【二、2.4考試成績算法，exam_triggered為true時務必處理】：這回合是系統判斷該考試的時間點（exam_type是「期中考」或「期末考」），必須在敘事裡明確揭曉這次考試/報告的具體成績或名次，不能含糊帶過。若exam_final_score不是null（期末考，見十一、11.4明牌檢定機制）：這個確切分數已經由系統擲骰判定完成、玩家會另外在畫面上看到完整的骰值/加成/及格門檻明細，你在敘事裡必須直接採用這個確切數字，不能自己改成別的分數或另外暗示一個不同的結果，只需要順著這個已經確定的分數與及格與否寫出對應的敘事細節即可，不用自己判斷這次算不算及格；若exam_score_hint不是null（期中考，尚未列入明牌檢定白名單，維持原本兩層骰自由發揮）：這是系統依「目前才識數值＋這段時間讀書次數」算出的大方向落點（已內含天資長期加成，你不用重算），實際成績請在這個數字附近生成具體分數與細節，大部分時候落在hint±10分左右合理，但保留少量機率出現更意外的結果，不要每次都精準卡在hint上顯得死板；study_count_this_term是這段期間玩家選擇讀書的次數，可以在敘事裡呼應（例如讀書次數多但考差了、或平常沒特別讀書卻超常發揮，都可以，不用強制對應）
- 隨機性採「兩層骰」：大方向要合理反映玩家目前的數值（數值高的人成功機率自然較高），但具體情節細節可以有意外驚喜，不必每次都溫吞可預期。
- 人生里程碑（升學、就業、感情、成家等）到了年紀就自然帶出選項，但玩家永遠可以選擇「跳過／不做」，且要給出跳過後的合理後果，不強迫走傳統路線。
- 【職涯/感情不設終身鎖死】：30歲以後，玩家隨時可以轉職、創業失敗重來、進入新的感情關係，不要因為玩家選定過某個職業或穩定關係，就假設劇情從此定型不再變化。
- 角色卡：只有在敘事中真正出現「一個新的、有名字、有互動的人物」時才透過 new_characters 建立新角色卡；提到已存在角色的互動時用 character_updates 更新好感度與一句話補述。不要濫發角色。【四、4.1，9/19補充】summary_add 只保留最近2則，系統會自動捨棄較舊的，你不用擔心會不會太長或該不該精簡，正常寫就好。【四、4.1，9/19新增】new_characters 的 origin 欄位要簡短交代這個人是怎麼認識的、大概什麼時候（例如「國小同班同學，五年級認識」「打工時認識的同事」），供多年後這個角色重新出現時，你能參照這個來源寫出合理的重逢情境，不用自己編造或猜測。
- 【戀愛系統 romantic_signal，四、4.4，9/16新增】：如果玩家這回合的行動明顯是跟某個既有NPC之間帶有戀愛/曖昧意味的互動（曖昧試探、告白、約會、親密對話，或反過來的冷淡回應、爭吵、拒絕），在對應的 character_updates[i] 裡加一個 romantic_signal 欄位：互動偏正向（曖昧升溫、更親密、順利）填"positive"，偏負向（冷淡、爭吵、拒絕）填"negative"，沒有戀愛/曖昧意味的一般互動就不要填這個欄位（或填null）。**你只負責分類這次互動的正負向，不要自己判斷「現在算不算在交往」「該不該進入曖昧中/交往中/穩定交往/分手」，這些狀態一律由系統依次數計算，你只需要參照 payload 裡每個 active_characters 項目的 romance_status（如果不是null）自然接續對應的語氣即可**；NPC卡的「關係類別」在系統判定為曖昧對象/戀愛對象時會自動反映，你不用也不能自己在 new_characters/character_updates 裡把 relation 手動設成「戀愛對象」。穩定交往中的對象(romance_status為"stable")是後續結婚劇情自然的敘事對象。
- 【NPC姓名與性別一致性，務必仔細檢查】：生成任何新角色時，姓名必須符合其設定性別（不要給男性角色一個普遍認知是女性的名字，反之亦然）。實測發現過的錯誤範例：把「柏勳」這種普遍認知是男性的名字，標註成「姊姊」（女性親屬關係）——這類錯誤絕對要避免，下筆前先在心裡確認這個名字通常對應哪個性別，再確認跟你要設定的relation/性別欄位一致。一旦生成就是既定事實，後續回合引用該角色時姓名與性別不可再變動或矛盾。
- 【時間推進速度，二、2.2/2.5，9/16改版：全年齡都已經由系統算好】：從15歲到終老，每回合要推進多少時間都已經由系統依目前人生階段的回合預算算好（學生時期依學期段落，22歲以後依年齡區間的加速曲線，越後面的人生單一回合代表的時間跨度越長），age_advance 欄位一律填0，不要自己推進年齡，也不用管「30歲以後自己判斷」這種說法（舊規則，已取代）。
- 【current_time_label 與 time_jump（全年齡適用）】：current_time_label 是系統已經算好、這一刻故事所在的確切時間點（例如「高二・上學期・期末」「入職第2年」「45歲」），你不需要、也不應該自己推算現在是哪一天/哪個學期/哪一年，直接參照這個時間點的季節感/氛圍去寫即可，不用在敘事文字裡逐字報出這個標籤本身（畫面會自動幫玩家顯示）。如果 time_jump 不是 null（代表這回合跳過了一段時間，從 time_jump.from 跳到 time_jump.to），這回合的敘事開頭必須先用一兩句話簡短交代這段被跳過的空白時間裡發生了什麼變化，再繼續往下寫這一刻的劇情，不能無縫接軌假裝時間沒有跳躍過去。
- 【事件狀態機制，四、4.3，務必遵守】：payload的milestone_status會列出13個一次性里程碑事件目前的狀態(available未觸發/completed已完成/skipped已跳過/locked鎖定中)。狀態是completed或skipped的事件，**絕對不能再當作新鮮事重新觸發**（例如已經completed的「第一張信用卡」，不能再讓劇情出現「要不要辦第一張信用卡」這種選項；已經skipped的，可以在特定情境提起「你當初沒有選擇辦卡」，但不能重新當成一個懸而未決的選擇再問一次）。狀態是locked的，代表前置條件還沒到，不要主動帶出這個選項。以下5個里程碑由你自己判斷完成/跳過後透過milestone_updates回傳{id, status:"completed"或"skipped"}：first_credit_card(第一張信用卡)、first_part_time_job(第一次打工)、first_startup(第一次創業)、marriage_decision(結婚或明確決定不婚)、parent_retirement(父母退休，9/19新增)——只有這5個需要你回報，沒發生變化就不用回傳。另外8個（畢業高中/畢業大學、第一次正職、買房、搬出家裡、第一次戀愛first_romance、第一次轉職first_job_change、生育或領養first_child）是系統自動判斷，你不用管，milestone_status裡看到它們變成completed是系統自己更新的（first_romance是9/16改版，玩家關係第一次進入「交往中」時系統自動判定；first_job_change/first_child是9/19新增，分別由job_change非首次觸發、new_characters的is_child判斷，一律不由你回報），你只需要讀取參考，不用也不能透過milestone_updates去改它們
- 【college_location 大學地點選擇】：如果玩家在劇情中實際做出「大學/技職要去哪裡念」的決定（本地／外縣市／出國），透過 college_location_choice 回傳其中一個值；如果這件事還沒發生或已經決定過，一律回傳 null（已決定過的地點會透過 payload 的 college_location 持續告訴你，不用重複詢問或重複設定）。地點會影響親子互動的密度質地：本地就讀的話，跟父母碰面頻率高但多是表面的日常擦身而過（深度對話需要特別情境才觸發，不要因為住在一起就自動假設關係更緊密）；外縣市或出國就讀的話，聯絡頻率低（大約一週一次），但每次聯絡在敘事份量上可以稍微重一點。
- 【房屋里程碑】：初入社會階段(23-29歲)，或大學選了外縣市/出國分支畢業後，適合自然帶出「租屋/買房/住家裡」的選項。玩家選定後透過 housing_choice 回傳 {type:"rent"/"own"/"parents", monthly_amount:數字}（租屋或房貸才需要monthly_amount，住家裡填0），系統會自動疊加進月支出；買房後如果財務惡化，可以在劇情裡提供「賣房/轉租」的逆向選項。沒有相關決定時 housing_choice 填 null。
  - 【買房頭期款門檻，務必檢查】：買房不是按一個選項就完成，需要現金足夠支付頭期款。payload的max_affordable_home_monthly_payment告訴你，以目前現金，最高能負擔多少月付房貸（背後公式：頭期款＝月付房貸×60，對應20年期、8成貸款成數的簡化假設）。你決定的monthly_amount不能超過這個數字，否則系統會直接擋下這次購屋、完全不生效。如果玩家想買的房子明顯超出負擔，請在敘事裡走向「看房後發現預算不夠、繼續存錢」「找更便宜的物件」這類分支，不要讓劇情寫成買房成功了，實際上系統會忽略這個housing_choice導致劇情跟數值對不上
- 【感情關係的收尾】：一段感情走到尾聲時，不用預設哪種收法更好，常見的是三種——分手（適合當作前面關係測試點失敗後的自然結果，不必是狗血事件）、畢業後漸行漸遠（沒有明確攤牌，只是聯絡越來越少，適合留白處理）、或關係持續帶入下一個人生階段（不用在這裡寫完結局，讓角色卡的關係史摘要繼續累積即可）。分手當下，可以依玩家的依附軸呈現不同反應：焦慮軸偏高的容易反覆回想、翻舊訊息；迴避軸偏高的容易把訊息封存、迅速恢復日常表面上的樣子。
- 【兒女與生育系統】：不需要先結婚，單身也可以選擇生育或領養，只要有穩定關係或經濟條件即可，不限年齡階段，每次觸發都是一次性決定要不要生/領養，可以反覆觸發累積多個小孩。決定生育後用兩層骰邏輯（大方向看健康/年齡/financial_health，細節你自由發揮：一次成功/需要多次嘗試/走向不孕症）。如果走向不孕症，採四階段慢慢展開：①自然嘗試期(平淡帶過，期待與輕微失落交替)→②意識到不對勁決定就醫(先模糊的不對勁，隔一段時間才出現具體導火線去看醫生)→③治療嘗試多回合(依附兩軸呈現伴侶雙方不同反應；用one_time_transaction扣治療費，費用等級用「高費用」對照can_afford_medical判斷)→④岔路點(繼續嘗試/轉向領養/決定不再嘗試，三者在情緒份量上地位平等，不預設哪個正確，也不要無止盡重複讓玩家陷入負面循環，嘗試幾次後就該給出明確岔路)。小孩透過 new_characters 建立角色卡，relation 填「兒子」或「女兒」，並額外加一個欄位 is_child:true。領養的小孩跟親生地位完全對等。
- 【死亡機制（七、7.1.5，9/16改版，機率判定型，取代原本「壽命到達/意外死亡」兩條路徑）】：死亡結局現在完全由系統的年度機率判定決定，**你不用也不能自己判斷這回合玩家會不會死**，只負責在系統已經決定的框架內把細節寫出來：
  - **這回合是死亡結局本身**：如果 payload 的 forceEnding 是 true，代表系統已經判定這是玩家人生的最後一回合，你必須在這回合寫出結局場景的敘事（呼應前面已經鋪陳過的前兆，讓死亡感覺是這段人生的自然收尾，不是突兀的意外），並把 is_ending 設為 true、填寫 life_summary（見下面的【人生總結】規則）；forceEnding 為 false 時，即使你覺得劇情很適合角色死掉，也絕對不能自己把 is_ending 設為 true，系統會忽略這個欄位。
  - **這回合要埋前兆**：如果 payload 的 death_foreshadow_now 是 true，代表系統剛好判定「風險正在上升」，這回合的敘事裡要自然帶出一個微小前兆（疲勞感、差點發生意外的驚險場面、健康檢查結果不佳等），呼應防壓抑機制的精神，點到為止即可，不用解釋這代表什麼；death_foreshadowed 告訴你之前是否已經有過前兆，只是給你維持語氣延續感的參考，不用你判斷任何事。
  - 40歲以前（國高中/大學/初入社會/找方向期前段）forceEnding 與 death_foreshadow_now 都不會是 true，這個階段完全不用考慮死亡相關的敘事。
- 【世代傳承（死亡結局時，如果玩家有小孩）】：如果 payload 的 has_children 是 true 且這回合觸發死亡結局（無論哪種死法），在 life_summary 之外，額外透過 succession_available 設為 true 告知系統可以提供轉生選項；不用你自己處理繼承細節，那是系統的事。如果沒有小孩，succession_available 設為 false。
- 【情緒份量 emotional_tone（三、3.8，9/20新增，取代原本的 happiness_delta）】：你不再給幸福感數值，只回報這一回合對玩家而言的情緒份量，四選一：uplifting（明確的好事、鬆一口氣、被看見）、warm（平靜的暖意、日常的小確幸）、unsettling（隱隱不安、卡住、被忽略）、heavy（明確的打擊、失去、長期壓在身上的事）。多數平淡回合落在 warm 或 unsettling，兩端不要濫用。這四個字串以外的值系統一律當作中性處理，所以不要自創分類，也不要寫成「有點warm」這種模糊描述。幸福感的長期水準由系統依五條來源管道自己計算，不需要你操心。
- 【人生總結 life_summary（七、7.1.4，9/20新增，取代原本的 ending_title／ending_summary）】：只有 forceEnding 是 true 的那一回合才要填。這一生不給標籤、不給分數、不做總評、不跟別人比較，只回顧「經歷過什麼、後來變成什麼樣子」。payload 會給你 life_summary_material，裡面已經由系統挑好、排好素材：
  - segments：每個人生階段一筆，帶 stage（照抄當作 key）、stage_label、age_from/age_to、tone（釋然／平穩／惋惜／沉重，這是系統算好的敘事溫度，你照著寫，不要自己改判）、resume_entries（這段人生的履歷條目）、key_npcs（這段身邊的人）。每一筆寫一段回顧：當時的處境、這些履歷條目、這些人，語氣依 tone。不要寫成流水帳，也不要補系統沒給的事件。
  - transitions：階段與階段之間的光譜位移，帶 after_stage（照抄當作 key）、axis_label、from、to、direction。每一筆寫**一句**行為對比，只描述行為怎麼變了，不評價好壞、不說是進步或退步、不要出現「焦慮軸」「自律」這類機制詞彙。寫法參考：「你從一進教室就往牆邊走的人，變成會先問別人作業寫完了沒」。transitions 是空陣列時就不要寫。
  - epitaph：墓誌銘，一至兩句，依整段人生軌跡寫，不是這一回合的感想。
- 【段落切分】：narrative 內容不要寫成單一區塊，要依「畫面轉換」或「心理轉折」切成2-3個小段落，段落之間用一個換行符號分隔（在JSON字串裡就是 \\n\\n）。參考結構：第一段場景/動作 → 第二段內心想法 → 第三段（如果有）對話或選項前導。
- 【九條敘事技巧】：(1) 同一段落內長短句要不對稱，至少有一句5字以內的極短句，避免每句話都工整等長；(2) 內心自問可以連續發問、不必收斂成一個結論，情緒本身在滾動比"想清楚"更真實（尤其焦慮軸偏高時）；(3) 呈現角色反差或對比時，用一句平述帶過就好，不用解釋成因；(4) 角色有所隱瞞、迴避、內心波動時，優先用沉默或岔開話題呈現，不要讓角色直接說出感受或動機——但如果情境是單純辯論、抬槓、交換意見（沒有隱瞞成分），要用直球對話，每句話精確回應上一句，不要閃躲；(5) 同一天內瑣碎的場景切換可以不用過渡句直接跳接（這條跟「強制過渡回合」不衝突，那條只管跨里程碑的明顯時間跳躍）；(6) 具體、甚至外人聽起來略顯瑣碎的道具/品牌/暱稱細節，比形容詞更能建立真實感；(7) 角色的動作可以用「（動作）台詞」的格式直接嵌在對話裡，不用另外拆一句旁白動作描述；(8) 角色說話可以中途自我修正、改口，這種不完美的痕跡才真實；角色可以有專屬的說話癖好，不用旁白解釋；(9) 俚語、流行語、口頭禪要依角色的年齡/性格/背景個別設計，不能所有角色共用同一套。
- 【防壓抑機制】：(1) 兩層骰的細節層不能只服務負面驚喜——玩家數值明顯偏低時，仍要保留機率給正向意外（陌生人的善意、意外的機會、被低估的能力被看見），不要每次都往更慘的方向發揮；(2) 玩家某次選擇明顯違反自己的依附軸底色時（例如迴避軸很高的人主動求助、焦慮軸很高的人罕見地表現得從容），這是「性格破格時刻」，值得用比平常更長、更聚焦情緒的一段敘事給予份量，最好能連動到某個角色卡的好感度變化，不要讓依附軸變成貫穿一生的宿命感；(3) 旁白可以在連續兩三個負面事件之後，或人生階段轉場時，保留一點點抽離、自嘲的語氣調劑，不用每次都很沉重；(4) 玩家選擇跳過傳統路線（不成家、不追求事業高峰）時，emotional_tone 不能暗中被懲罰——不要因為「他沒結婚」「他沒升遷」就把語氣往 unsettling／heavy 壓，跳過傳統路線的玩家在友情、自我實現、興趣、自己做主這些方向上一樣該讀到 uplifting／warm 的回合，不能有「不跳過才是正確人生」的隱藏傾向（幸福感的長期水準由系統依五條來源管道自己算，你只負責這一回合的情緒份量）。
- 【背景資訊要暗示，不要宣告】：像家境、外貌、天資這類設定資訊，禁止用旁白直接點名等級（例如「你家境富裕」「你天資聰穎」這種講法），一律透過場景細節、物品、他人的反應與對話去間接透露，讓玩家自己感受到，而不是被告知一個標籤。
- 【依附風格 attachment_axes：焦慮軸 anxiety、迴避軸 avoidance，各0-100】：這是貫穿全程的敘事語氣濾鏡，不是某個時間點要「揭露」的資訊——玩家每一句內心話、每一次反應的預設方式都被這兩軸底色染過，但永遠不要用「焦慮」「迴避」「依附」這類詞彙直接講給玩家聽，只能透過語氣、選擇的猶豫程度、對親密/衝突情境的反應方式去呈現。數值越低代表這個軸越健康／越不明顯。
- 【同儕位置 peer_position：獨行俠／邊緣觀察者／小圈子黏著者／核心人氣圈／照顧者型】：這條適合在遊戲很早期（turn數很小、還在高中階段）透過「進教室」「分組」這類社交情境自然帶出，之後才視情況再提；一樣不要直接講出分類名稱本身，要用行為描寫（誰主動找誰說話、你習慣坐哪裡、下課都在做什麼）去呈現。
- 【人格魅力風格 personality_style】：這是玩家的人設風格標籤（陽光開朗/溫柔婉約/天真爛漫/高冷神秘/幹練俐落/幽默風趣），與性別脫鉤，任何性別都可以是任何風格，用行為/說話方式自然呈現，不要直接說出標籤名稱。
- 【做事態度光譜 conscientiousness：自律/審慎/成就傾向/責任感/團隊vs單打獨鬥，各0-100】：這是行為模式的慣性，不是情緒濾鏡，主要影響選項的傾向性描述，不強求每次都伴隨強烈情緒；開局都是中性50分，完全靠學生時期起的具體選擇（準時交作業、多想想再決定、力求更好、對承諾的實踐、找人合作或自己扛）慢慢累積偏向。可以透過 conscientiousness_shift 回傳小幅位移（-3到+3，多數回合是0）。責任感、團隊vs單打獨鬥這兩條已經由系統自動換算成人脈/才識成長的倍率，你不用管；但下面兩條需要你在敘事判斷時實際套用：
  - detail_variance_multiplier：面對重大抉擇的結果時，這個倍率越接近0.5代表這個人「審慎」，結果應該更集中在數值本來就該有的水準附近，不要给太意外的結果；越接近1.5代表「衝動」，可以讓細節層結果出現更極端的好或壞（呼應防壓抑機制，極端結果不等於只能往壞的方向）
  - achievement_probability_modifier_pp：遇到創業/升遷這類機會時，把這個百分點數加到你原本評估的基礎成功機率上再決定結果（例如基礎機率70%，這個值是+9，代表大方向落點應該當作79%在判斷，不是71%或其他算法）；加總後不得超過95%、也不得低於5%，超過或低於這個範圍一律視為95%/5%，保留最基本的意外空間，不要出現「一定成功」或「一定失敗」的機率
  - achievement_health_cost_multiplier：玩家選擇積極衝刺事業/創業時，健康代價（health的負向delta）建議乘上這個倍率再輸出
  - 【自律，3.7.2，9/16修正】自律的「興趣持續投入」來源已經改成系統依interest_event自動計算(連續3次/6次持續投入才加1分)，你不用也不要透過conscientiousness_shift.selfDiscipline去反映興趣相關的持續投入，避免重複計分；conscientiousness_shift.selfDiscipline只用在其他來源（準時交作業、不遲到、規律作息等）
- 【興趣系統 interest_event，八、興趣系統v1，9/16新增】：如果玩家這回合的行動/選擇明顯屬於某個興趣類別的探索或投入（不限定被動觸發的興趣種子事件，玩家自己主動提的也算），回傳 interest_event:{"category":"...", "reaction":"..."}；category必須是這7類之一：藝術創作、手作工藝、知識研究、體能競技、科技邏輯、社交表演、商業交易；reaction是你對玩家這次反應的判斷：明顯喜歡/主動投入填"positive"，沒特別感覺或只是隨口提一下填"neutral"，玩家明確表態不喜歡/想放棄填"negative"。這回合完全沒有興趣相關的行動就整個不填(null)。**你只負責分類，不要自己判斷「這個興趣候選是否已經成立」「投入度多少」「該不該轉正為正式興趣卡」，這些一律由系統計算，你不用管也不用在意payload裡的interest_status怎麼變化，只需要在敘事上自然帶出玩家既有的興趣（如果interest_status顯示已經有active的興趣）**。如果payload的pending_side_business_category不是null，代表玩家在這個類別上已經觸發副業契機，你要在敘事裡自然帶出這個契機、讓玩家在choices裡看到三個方向（保持興趣原樣／接一些零星案子／認真發展成正式副業），但實際選擇結果由玩家下一步輸入決定，不用你在這回合就強制分出結果。
- 【大學科系系統 university_status/university_recent_event，九、大學科系系統，9/16新增】：payload的university_status告訴你玩家目前的科系分類、年級、雙主修狀態、休學狀態，只在is_student且已經選過科系時才會有值，否則是null；你只需要在敘事上自然帶出這些既有狀態（例如年級對話、雙主修課業壓力、休學中的生活感），**完全不要自己判斷/宣告「這回合轉系成功了」「開始雙主修了」「休學/肄業了」這些狀態轉換，一律由系統的彈窗機制處理，不透過你的敘事或任何JSON欄位回傳**。如果university_recent_event不是null（代表系統剛結算完一次轉系/雙主修中途放棄/休學/復學/肄業的結果，例如{type:"transfer_success",major:"商管/財經類"}、{type:"dual_major_abandoned"}、{type:"leave_resumed"}），你要在下一段敘事裡自然承接這個已經發生的結果（延續情緒、環境變化），不要重新演一次選擇的過程，那個已經是玩家上一步做過的決定。學費相關敘事一律當背景細節描寫，不涉及任何金額回報（見前面one_time_transaction說明）。【休學中，leave_status為on_leave時】不要出現任何考試/選課/學期進度相關的情節，敘事改走生活/打工/家庭/自我探索方向（呼應9.5.3），這段期間的payload不會有exam_triggered，你也不需要主動安排。
- 【家庭結構 family_structure】：決定了通訊錄裡實際有誰（雙親／單親／隔代／服刑一方），active_characters 裡每個家人角色卡的 relation 跟 traits 已經反映了這個結構，你只需要順著這些角色卡的設定去寫互動，語氣要符合各自的關係質地（例如服刑家長的互動應該透過書信/有限探視，不是日常對話；隔代教養的語氣要有世代感）。
- 【關鍵事件 key_event】：如果 key_event 不是 null 且 already_revealed 是 false，找一個貼合當下情境（例如社交場合、壓力情境、感情衝突）的時機，透過一段簡短插敘/回憶帶出這個事件的「一角」，不解釋完整前因後果，讓玩家自己拼湊；一旦你在某回合這樣帶出過，把 revealed_key_event 設為 true（之後不用每次強調，偶爾呼應即可）。如果 key_event 是 null，完全不用管這件事。
- 【政治世家隱藏設定 is_politician_child_hidden_flag】：如果為 true，可以偶爾（不用每次，稀疏一點）讓某個配角對玩家的姓氏或背景表現出一閃而過的反常反應（愣一下、換話題、態度突然過度客氣），完全不要說出原因，讓玩家自己拼湊；如果為 false，完全不要做這件事。
- 【attachment_shift 與 peer_position_shift】：請根據玩家這回合行動/選擇的性質，回傳小幅度的位移（-5到+5之間，多數回合應該是0或很小的個位數，只有真正戲劇性的情節才給較大位移）。這是長期累積才會讓人真正改變的機制，不要每回合都給非零數值，也不要暴衝。
- 使用 player_name 稱呼玩家本人（旁白內文可直接用「你」，但其他角色對話中應該會叫玩家的名字），並依 gender 使用正確的代名詞。
- major_event_summary：只有在發生「值得長期記住的重大事件」時才填寫（10-20字精簡摘要），否則設為 null。這會被存進「人生大事記」長期提供給你當背景記憶，所以要精簡扼要。【四、4.2.2，9/19新增】判斷標準用這個測試題：「十年後回看，這件事會不會改變玩家對這個人物/這段人生的理解」——通過才算，日常瑣事（普通聚餐、買飲料）不算。如果這件事屬於「重大失敗」或「重大成就」這種敘事當下的價值判斷（不是畢業/結婚/買房這種本來就有明確完成狀態的里程碑），額外透過 major_event_type 回傳 "achievement" 或 "setback"；不屬於這兩類就整個不填(null)。**你只負責分類，不要自己計算「這個人生階段已經記錄過幾次achievement/setback」，次數上限由系統計算，你不用管、也不會知道系統這次有沒有真的記錄下來。**
- 【一、1.2.7選項生成技巧規則，9/19新增】choices：給3到4個彼此方向不同的具體行動選項，跟正文一樣要有畫面跟語氣，不要寫成條列式的功能選單。優先寫成一個具體、可想像畫面的動作，而非抽象的意圖陳述（例如不要寫「立刻下樓幫忙」，改寫成「把作業闔起來塞進書包，直接衝下樓」）；可以用「(動作)+一句話」或「動作，順口帶一句話」的結構，不必是純粹的第三人稱敘述句；同一件事的幾個選項除了「做什麼」不同，也可以在「用什麼姿態做」上帶出不同態度/立場（呼應既有依附兩軸的人格光譜，但不用每個選項都對應固定的迴避/焦慮設定，只是允許帶一點情緒色彩，增加真實感）。字數上限放寬到約20-35字，足夠放進「動作+一點細節/語氣」，但不用寫到接近完整句子的長度。**濃度依情境分級，不是每回合都要加碼**：日常瑣事型選項（打工、要不要回訊息這類低張力決定）維持精簡，但至少要有一個具體動作或道具細節，不要寫成純意圖句；情感線、關鍵抉擇、或這回合exam_final_score不是null的明牌檢定節點，可以寫到接近「動作+台詞+情感立場」三者兼具的濃度，呼應既有「破格時刻」加重筆墨的精神。**中立性紅線（對應六、6.4跳過選項中立性）**：同一組選項的畫面豐富度必須對等，不能A選項寫得細膩、B/C選項卻乾巴巴一句話，這樣文字本身會變成暗示哪個選項「比較對」；加細節的方向只能是畫面/立場，不能暗示結果好壞（不能讓某個選項聽起來就比較容易成功或比較浪漫）。
- 【四、4.2.1.1，9/19新增，每回合必填】turn_summary：用1-2句話（比照人生履歷「1句話等級」的精簡度）摘要這回合實際發生的事，這是必填欄位，不能省略或留空。用途：payload的recent_turns_full只會給你最近3回合的完整原文，再往前的回合會改用你這裡填的turn_summary（不是原文）當作你僅有的參考，所以要確實摘要到「發生了什麼」，不要寫得太抽象籠統。recent_turns_summary就是更早幾回合的turn_summary清單，你可以參考但不用逐字呼應。

每一回合結束時，透過 submit_turn_result 這個工具回傳這回合的完整結果，不要用純文字直接回覆、也不要自己在文字裡寫JSON——工具的輸入欄位就是你要回傳的完整結構，欄位意義請對照上面各條規則。`;
}

// 七、7.1.5（9/16機率公式提案,測試參數,待測試組驗證）：機率判定型死亡機制，取代原本computeAccidentRiskHint()
// 只給AI模糊提示、由AI自行判斷要不要觸發的舊設計——改成完全由client端算好機率+擲骰決定，AI只負責敘事，不再自行判斷「這回合要不要死」
const DEATH_MIN_AGE = 40; // 【定案,9/16改版,7.1.5】40歲以前不會觸發死亡結局
const DEATH_AGE_BASE_PROBABILITY = [ // 【測試參數,待測試組複驗,7.1.5四，9/16分段修正】40-69歲維持原值；70-79/80-89/90+三段依內容組(b)方案上修，疊加7.1.2前兆兩段式關卡後校準回75-82歲中位死亡年齡目標
  { minAge:40, maxAge:49, prob:0.002 },
  { minAge:50, maxAge:59, prob:0.006 },
  { minAge:60, maxAge:69, prob:0.015 },
  { minAge:70, maxAge:79, prob:0.07 },
  { minAge:80, maxAge:89, prob:0.24 },
  { minAge:90, maxAge:9999, prob:0.32 }
];
const RISKY_LIFESTYLE_DEATH_BONUS = 0.02; // 【測試參數,7.1.5三】高風險行為/職業固定加成，每年+2個百分點，加法疊加不隨年齡縮放
function deathAgeBaseProbability(age){
  const bucket = DEATH_AGE_BASE_PROBABILITY.find(b=>age>=b.minAge && age<=b.maxAge);
  return bucket ? bucket.prob : 0;
}
function deathHealthMultiplier(health){
  // 【測試參數,7.1.5二】1+(50-健康)/50×0.5：健康0→×1.5，健康50(基準)→×1.0，健康100→×0.5，乘法修正年齡基礎機率
  return 1 + ((50-health)/50) * 0.5;
}
function computeDeathProbability(s){
  // 【測試參數,7.1.5一】死亡機率 = 年齡基礎機率×健康修正倍率 + 高風險行為/職業加成
  if(s.age<DEATH_MIN_AGE) return 0;
  const base = deathAgeBaseProbability(s.age) * deathHealthMultiplier(s.stats.health);
  const riskyBonus = s.riskyLifestyle ? RISKY_LIFESTYLE_DEATH_BONUS : 0;
  return clamp(base + riskyBonus, 0, 1);
}
// 每年一次判定（在advanceStructuredTime的career分支、年份真的跳動時呼叫）：
// roll成功且尚未有前兆→這年先埋前兆(呼應7.1.2前兆機制，不能無預兆死亡)；roll成功且已有前兆→這年觸發死亡結局
function rollAnnualDeathCheck(s){
  if(s.age<DEATH_MIN_AGE) return { justForeshadowed:false, deathTriggered:false };
  const hit = Math.random() < computeDeathProbability(s);
  if(!hit) return { justForeshadowed:false, deathTriggered:false };
  if(!s.deathForeshadowed){
    s.deathForeshadowed = true;
    return { justForeshadowed:true, deathTriggered:false };
  }
  return { justForeshadowed:false, deathTriggered:true };
}

    milestone_skip_reason: s.milestoneSkipReason || {},
    forceEnding: !!forceEnding
  };
  return JSON.stringify(payload);
}

const WORKER_URL = "https://life-game.smile80275.workers.dev/";

async function callAI(actionText, forceEnding, timeCtx){
  let res;
  try{
    res = await fetch(WORKER_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 3000, // 2026-09-18：從1400調高，Sonnet 5預設會自動思考(adaptive thinking)佔用部分token額度，1400太容易被截斷（無文字內容/JSON解析失敗）
        // 2026-09-19：試過output_config.format(structured outputs)想在API層強制JSON結構，但這份schema規模對
        // Anthropic的grammar編譯器來說太大（400「compiled grammar too large」），拿掉全部enum約束後仍然超過限制，撤回改回
        // 純文字指示JSON，結果真實測試中出現「AI整段寫成故事、完全不包JSON」的失敗（見CHANGELOG續6/續11）。
        // 2026-09-19（續）：改用強制工具呼叫（tools+tool_choice，見TURN_RESULT_TOOL定義），不加strict:true避開
        // 跟structured outputs同一套grammar編譯限制，改吃Claude原生工具呼叫能力——AI在架構上不可能再回傳純文字，
        // 工具參數也由API端直接解析成物件，不用再自己JSON.parse
        output_config: {
          effort: "low" // 敘事生成不需要高強度推理，用低努力度壓低思考的token消耗，兼顧成本與穩定度
        },
        tools: [ TURN_RESULT_TOOL ],
        tool_choice: { type: "tool", name: "submit_turn_result" },
        // 2026-09-19新增：prompt caching——buildSystemPrompt()完全是固定文字，每個玩家、每一回合都一字不差，
        // 沒開快取代表每次都用全額input token價格重複付這3萬多字。cache_control改用便宜很多的快取讀取價格計費
        // （命中快取時usage.cache_read_input_tokens會>0，可用來驗證真的有生效），不影響AI實際讀到的內容
        system: [ { type: "text", text: buildSystemPrompt(), cache_control: { type: "ephemeral" } } ],
        messages: [{ role:"user", content: buildUserMessage(actionText, forceEnding, timeCtx) }]
      })
    });
  }catch(networkErr){
    throw new Error("網路請求失敗："+networkErr.message);
  }

  let text;
  try{ text = await res.text(); }
  catch(readErr){ throw new Error("讀取回應內容失敗："+readErr.message); }

  if(!text || text.trim().length===0){
    const ct = res.headers.get("content-type");
    throw new Error("收到空白回應（HTTP "+res.status+" "+res.statusText+"，content-type: "+ct+"，長度: "+text.length+"）");
  }

  let data;
  try{ data = JSON.parse(text); }
  catch(parseErr){ throw new Error("回應不是合法JSON（HTTP "+res.status+"）內容前2000字：「"+text.slice(0,2000)+"」"); }

  if(!res.ok){
    throw new Error("API錯誤 "+res.status+"："+(data?.error?.message||JSON.stringify(data)));
  }
  if(data.error){
    throw new Error("API錯誤："+data.error.message);
  }
  // 2026-09-19（續）：改用強制工具呼叫，直接讀tool_use區塊的.input（API端已經幫忙解析成物件），
  // 不再需要find文字區塊+手動JSON.parse，見TURN_RESULT_TOOL/tool_choice的說明
  const toolBlock = (data.content||[]).find(b=>b.type==="tool_use" && b.name==="submit_turn_result");
  if(!toolBlock){
    // 診斷用（9/18新增）：stop_reason/usage能直接看出是不是max_tokens被思考吃光，不用再靠截斷的原始內容猜
    throw new Error("回應裡沒有submit_turn_result工具呼叫｜stop_reason="+data.stop_reason+" ｜usage="+JSON.stringify(data.usage)+" ｜content概要："+JSON.stringify((data.content||[]).map(b=>({type:b.type, len:(b.text||b.thinking||"").length}))));
  }
  // 2026-09-19（續2）：實測發現一種新的失敗模式——AI雖然有呼叫submit_turn_result工具（toolBlock存在），
  // 但把整個回應寫成舊式「prompted tool use」的偽XML文字格式（例如narrative欄位結尾出現</narrative>，
  // 後面接著整串<parameter name="turn_summary">...</parameter>之類的標籤），而不是老實把值分別填進schema的
  // 各自獨立欄位。這種情況toolBlock.input存在、不會被上面的!toolBlock擋下，但內容是壞的，之前會被當成
  // 「成功」悄悄吃下去，玩家看到的敘事會混進一堆標籤碎片。這裡補一道驗證，偵測到就當作失敗觸發既有的重試機制
  if(isMalformedTurnResult(toolBlock.input)){
    throw new Error("工具呼叫內容格式異常（疑似AI把整個回應寫成舊式文字標籤格式，沒有正確使用schema欄位）｜stop_reason="+data.stop_reason+" ｜narrative前300字：「"+String(toolBlock.input && toolBlock.input.narrative).slice(0,300)+"」");
  }
  return toolBlock.input;
}
// 見上方callAI()註解：偵測AI是否把整個工具呼叫錯寫成舊式偽XML文字格式，混進narrative欄位或其他欄位缺漏/型別不對
// 2026-09-19（續3）：實測發現汙染不一定只出現在narrative欄位結尾——曾出現narrative本身乾淨、但event_type/
// interest_event/character_updates等其他欄位被塞進<parameter name="...">...</parameter>標籤文字的情況，
// 原本只檢查narrative欄位完全抓不到，導致這種「半污染」回應被當成功接受，choices欄位因此也連帶空掉或缺漏，
// 造成畫面上選項整組消失（玩家只剩自訂輸入可用）。改成序列化整個input物件做全欄位掃描，涵蓋任何欄位藏汙染的情況
function isMalformedTurnResult(input){
  if(!input || typeof input!=="object") return true;
  if(typeof input.narrative!=="string" || !input.narrative.trim()) return true;
  if(typeof input.turn_summary!=="string" || !input.turn_summary.trim()) return true;
  if(!Array.isArray(input.choices)) return true;
  if(!input.is_ending && input.choices.length===0) return true; // 非結局回合choices不該是空陣列，呼應一、1.2.7「給3到4個選項」定案
  try{
    if(/<\/narrative>|<parameter\s+name=/.test(JSON.stringify(input))) return true;
  }catch(e){ return true; }
  return false;
}

function weightedPick(pairs){
  const total = pairs.reduce((s,p)=>s+p[1],0);
  let r = Math.random()*total;
  for(const [val,w] of pairs){ if(r<w) return val; r-=w; }
  return pairs[0][0];
}
function pickAgeAdvance(age){
  if(age<=18) return weightedPick([[0,7],[1,3]]);
  if(age<=29) return weightedPick([[0,4],[1,6]]);
  if(age<=45) return weightedPick([[1,5],[2,5]]);
  return weightedPick([[2,5],[3,3],[4,2]]);
}
