// 9.2既有的科系→職業八大類主要對應，供12.4「科系對應+10個百分點」判斷使用（技術判斷：僅列每個科系的主要對應類別，
// 9.2文件裡「或」/「創業走向」等次要對應不計入，避免同一科系同時匹配過多類別讓+10%規則失去鑑別度）
const MAJOR_OCCUPATION_MATCH = {
  理工資訊: ["受雇專業/白領類"], 商管財經: ["受雇專業/白領類","自營/家庭事業類"],
  人文語言傳播: ["受雇專業/白領類"], 醫藥護理: ["受雇專業/白領類"],
  教育: ["軍公教/警消類","受雇專業/白領類"], 藝術設計表演: ["自由/創作類"],
  法律政治: ["受雇專業/白領類","軍公教/警消類"],
  // 9.2（2026-09-27修改）：社工→受雇專業/白領類；餐旅、觀光、運動休閒→勞力/服務類（創業開店、教練接案為次要對應，依上面原則不計入）。
  // 程式只記到學群(studentMajorGroup)、沒有記到系別，所以整個學群兩類都算對應
  服務社工餐旅: ["受雇專業/白領類","勞力/服務類"]
};
// 12.3【定案,測試參數】落點百分位＝clamp(才識÷100×0.5＋職級加成＋年資加成,0,1)；職級加成新人0/熟手0.12/資深0.24/管理職0.36；年資加成＝min(同職級年資年數×0.02,0.08)
function computeSalaryPercentile(s){
  const levelBonus = [0,0.12,0.24,0.36][clamp(s.jobLevel||0,0,3)];
  const tenureBonus = Math.min(((s.tenureMonths||0)/12)*0.02, 0.08);
  return clamp((s.stats.knowledge/100)*0.5 + levelBonus + tenureBonus, 0, 1);
}
function computeCareerSalary(s, category){
  const cat = findOccupationCategory(category);
  if(!cat) return 0;
  return +(cat.salaryRange[0] + (cat.salaryRange[1]-cat.salaryRange[0])*computeSalaryPercentile(s)).toFixed(1);
}

// 12.4【定案,測試參數】錄取機率＝基礎35%＋各項修正，下限5%、上限90%
const JOB_SEARCH_BASE_PROB_PP = 35;
const JOB_SEARCH_STREAK_FALLBACK = 3; // 【定案】連續3次失敗後，第4次必定出現保底offer
// 十一、11.2【定案】明牌呈現詳細版要列出「屬性加成換算依據」（2026-09-27補上）：錄取機率改由逐項明細加總，
// computeHireProbability()只取總和，彈窗用同一份明細顯示，確保顯示與實際判定一致
function hireProbabilityBreakdown(s, targetCategory, opts){
  opts = opts||{};
  const items = [];
  const add = (label, pp)=>{ if(pp) items.push({ label, pp }); };
  add("基礎", JOB_SEARCH_BASE_PROB_PP);
  add(`才識${Math.round(s.stats.knowledge)}`, (s.stats.knowledge-50)*0.4);
  add(`人脈${Math.round(s.stats.network)}`, (s.stats.network-50)*0.2);
  add(`成就傾向${Math.round(s.conscientiousness.achievement)}`, (s.conscientiousness.achievement-50)*0.3); // 沿用3.7.3既有公式
  const majorMatch = s.studentMajorGroup && (MAJOR_OCCUPATION_MATCH[s.studentMajorGroup]||[]).includes(targetCategory);
  if(majorMatch) add("科系對口", 10);
  add("相關興趣投入", computeInterestHireBonusPp(s, targetCategory)); // 八、8.9/十二、12.4（2026-09-27）
  if(opts.crossCategoryTransfer) add("跨類別轉職", -10);
  if(s.studentStatus==="withdrawn") add("肄業", -10);
  if((s.collegeDelayYearsUsed||0) > 0) add("延畢", -5);
  if(s.age>=55) add("55歲以上", -20); else if(s.age>=50) add("50歲以上", -10);
  // 十二、12.11.1（2026-09-22新增）：自由接案/演藝圈職涯伏筆成為候選時，「自由/創作類」錄取機率加成，比照科系對口加成的作法
  if(opts.creativeBonusPct && targetCategory==="自由/創作類") add("職涯伏筆", opts.creativeBonusPct);
  { const fr = ensureFocusRatio(s); add("找工作的投入", focusRatioPp("hire", fr.search.hit, fr.search.n)); } // 二、2.6.7.4（2026-10-04）：只加不減，算在5～90%範圍內
  const raw = items.reduce((a,x)=>a+x.pp,0);
  return { items, raw, total: clamp(raw,5,90), min:5, max:90 };
}
function computeHireProbability(s, targetCategory, opts){
  return hireProbabilityBreakdown(s, targetCategory, opts).total;
}
// 11.2：把明細列成一行「基礎35 ＋ 才識62(+4.8) …＝X%」，超出上下限時註明
function breakdownHtml(bd){
  const parts = bd.items.map((x,i)=>{
    const v = Math.round(x.pp*10)/10;
    if(i===0) return `${x.label}${v}`;
    return `${x.label}(${v>=0?"+":""}${v})`;
  });
  const clampNote = Math.round(bd.raw)!==Math.round(bd.total) ? `，超出範圍取${bd.total<=bd.min?"下限":"上限"}` : "";
  return `<p style="font-size:13px;">屬性加成：${parts.join(" ＋ ")} ＝ ${Math.round(bd.raw)}%${clampNote}</p>`;
}
function buildJobSearchOffers(s, extraOpts){
  const isTransfer = s.careerStatus===CAREER_STATUS.EMPLOYED;
  return OCCUPATION_CATEGORIES.map(cat=>({
    category: cat.key,
    probPct: Math.round(computeHireProbability(s, cat.key, Object.assign({ crossCategoryTransfer: isTransfer && s.occupationCategory!==cat.key }, extraOpts)))
  }));
}
// 12.4/12.6【定案,務必遵守12.13】求職/轉職成敗判定完全由客戶端擲骰決定；十一、11.4/12.14明牌檢定：roll+probPct完整回傳供UI詳細呈現
function resolveJobApplication(s, category, isTransfer, opts){
  opts = opts||{};
  const isFallbackForced = (s.jobSearchStreak||0) >= JOB_SEARCH_STREAK_FALLBACK;
  let finalCategory = category;
  let roll, probPct, hired, breakdown = null;
  if(isFallbackForced){
    // 12.4【定案】保底規則：第4次必定出現一個「不穩定/待業類」或「勞力/服務類」的保底offer
    finalCategory = ["不穩定/待業類","勞力/服務類"].includes(category) ? category : pick(["不穩定/待業類","勞力/服務類"]);
    roll = 1; probPct = 100; hired = true;
  } else {
    const hireOpts = { crossCategoryTransfer: isTransfer && s.occupationCategory!==category, creativeBonusPct: opts.creativeBonusPct };
    breakdown = hireProbabilityBreakdown(s, category, hireOpts); // 11.2顯示用明細；判定值仍經computeHireProbability()（兩者同一份計算）
    probPct = Math.round(computeHireProbability(s, category, hireOpts));
    roll = rnd(1,100);
    hired = roll <= probPct;
  }
  // 12.4【定案】流程第③步「要不要接受offer」、保底offer玩家仍可拒絕（2026-09-27補上）：彈窗傳deferAccept，錄取後先不上任，
  // 等玩家在彈窗選接受(acceptJobOffer)或拒絕(declineJobOffer)；沒傳deferAccept的呼叫維持原本錄取即上任
  const deferred = hired && opts.deferAccept;
  if(hired && !deferred){
    applyJobHire(s, finalCategory, isTransfer, opts);
  } else if(!hired){
    if(isTransfer) s.levelNegativeEvent = true; // 12.5：申請轉職被拒算這個職級期間的負面職涯事件
    s.jobSearchStreak = (s.jobSearchStreak||0)+1;
    if(s.careerStatus!==CAREER_STATUS.EMPLOYED) s.careerStatus = CAREER_STATUS.JOB_SEARCHING;
  }
  s.pendingJobSearch = null;
  s.pendingJobOffer = deferred ? { category:finalCategory, isTransfer:!!isTransfer, opts } : null;
  // 十二、12.11.1（2026-09-22新增）：若這次求職候選來自職涯伏筆(自由接案/演藝圈線/海外線)，結算候選狀態——
  // 「已接受」定義為確實錄取且落在該線對應的目標路徑(自由接案/演藝圈線需命中自由/創作類；海外線只要錄取即算，因為重點是離開原職而非特定類別)
  if(opts.foreshadowLine && !deferred){
    const landedIntendedPath = opts.isOverseas ? hired : (hired && finalCategory==="自由/創作類");
    closeForeshadowCandidate(s, opts.foreshadowLine, landedIntendedPath);
  }
  s.careerEventLog = { type:"job_search", category:finalCategory, roll, probPct, hired, isTransfer:!!isTransfer, wasFallback:isFallbackForced };
  logJobApplicationPlayStyle(s, category, isTransfer, isFallbackForced, probPct);
  return { category:finalCategory, roll, probPct, hired, breakdown };
}
function acceptJobOffer(s){
  const offer = s.pendingJobOffer;
  if(!offer) return;
  s.pendingJobOffer = null;
  applyJobHire(s, offer.category, offer.isTransfer, offer.opts||{});
  if(offer.opts && offer.opts.foreshadowLine){
    closeForeshadowCandidate(s, offer.opts.foreshadowLine, offer.opts.isOverseas ? true : offer.category==="自由/創作類");
  }
  if(s.careerEventLog) s.careerEventLog.accepted = true;
}
function declineJobOffer(s){
  const offer = s.pendingJobOffer;
  if(!offer) return;
  s.pendingJobOffer = null;
  // 拒絕不算求職失敗，jobSearchStreak不變（保底狀態下次仍是保底）；失業中則維持求職狀態，下一回合會再出現求職彈窗
  if(s.careerStatus!==CAREER_STATUS.EMPLOYED) s.careerStatus = CAREER_STATUS.JOB_SEARCHING;
  else s.careerTransferCooldown = CAREER_TRANSFER_COOLDOWN_TURNS; // 在職拒絕轉職offer：套用轉職冷卻，避免被動候選下一回合又跳
  if(offer.opts && offer.opts.foreshadowLine) closeForeshadowCandidate(s, offer.opts.foreshadowLine, false);
  if(s.careerEventLog) s.careerEventLog.accepted = false;
}
function applyJobHire(s, finalCategory, isTransfer, opts){
  opts = opts||{};
  const wasFirstJob = !s.occupationCategory;
  const sameCategory = isTransfer && s.occupationCategory===finalCategory;
  s.jobSearchStreak = 0;
  ensureFocusRatio(s).search = { n:0, hit:0 }; // 2.6.7.4：找到工作，這段求職期結束
  // 十二、12.6.1【定案】海外型轉職一律視為跨類別轉職的子情境(留學/外派/移居)，即使選了同一類別也套用降級/歸零，不比照一般同類別轉職保留
  if(isTransfer && (!sameCategory || opts.isOverseas)){
    // 12.6【定案】跨類別轉職：job_level降一級(不低於新人)，tenure_months歸零（2026-09-27修正：原本直接歸零）
    s.jobLevel = Math.max(0, (s.jobLevel||0)-1); s.tenureMonths = 0;
  }
  // 同類別轉職：job_level/tenure_months保留，只重骰薪資落點（12.6【定案】）
  s.occupationCategory = finalCategory;
  const catDef = findOccupationCategory(finalCategory);
  // 12.3：is_high_risk旗標接上7.1.1死亡機率加成（2026-09-27改為錄取時擲工種，見rollJobRiskSubtype）
  s.jobRiskSubtype = rollJobRiskSubtype(finalCategory);
  s.riskyLifestyle = !!s.jobRiskSubtype;
  s.careerStatus = CAREER_STATUS.EMPLOYED;
  s.retirementStatus = s.retirementStatus || "在職";
  resetLevelPeriod(s); // 12.5：新工作重新起算職級期間
  s.monthlyIncome = Math.round(computeCareerSalary(s, finalCategory) * SALARY_SCALE);
  if(wasFirstJob && !s.mealFullyUnlocked){ s.mealFullyUnlocked = true; s.mealJustUnlocked = true; }
  if(wasFirstJob) s.milestones.first_full_time_job = "completed";
  else if(isTransfer && s.milestones.first_job_change!=="completed") s.milestones.first_job_change = "completed";
  // 12.6（2026-09-27使用者同意Claude建議）：第二次以後的轉職也寫進履歷（第一次由里程碑自動記，見recordMilestoneChronicle）
  else if(isTransfer) s.chronicle.push(`（${s.age}歲）${opts.isOverseas?"到海外工作，":""}轉職到${finalCategory.replace(/類$/,"")}`);
  // 12.6.1【定案】海外型轉職成功後cohabiting依4.1.2在搬離時解除（2026-09-27補上）：只解除原生家庭(父母/隔代/手足)，
  // 配偶與未成年子女是否一起出國文件沒規定，維持同住
  if(opts.isOverseas){
    (s.characters||[]).filter(c=>c.cohabiting && /^(父母|隔代教養|手足)，從出生起$/.test(c.origin||"")).forEach(releaseCohabiting);
  }
  s.careerTransferCooldown = CAREER_TRANSFER_COOLDOWN_TURNS;
  s.promotionDeclineStreak = 0;
  rollCareerForeshadow(s); // 12.11：畢業後首次求職／轉職／失業後再就業，三個觸發點都會經過這裡的「錄取成功」分支
}
function logJobApplicationPlayStyle(s, category, isTransfer, isFallbackForced, probPct){
  // 十六、16.2.2：投遞的錄取機率代表冒險程度(保底offer沒有選擇空間，不計)；轉職本身算一次偏離常規；
  // 失業後的求職：投回原本的職業類別算「重來」，換類別算「轉向」
  if(!isFallbackForced){
    if(probPct < PLAYSTYLE_JOB_RISKY_PCT) logPlayStyleRisk(s, 1);
    else if(probPct >= PLAYSTYLE_JOB_SAFE_PCT) logPlayStyleRisk(s, -1);
  }
  if(isTransfer) logPlayStyleDeviation(s);
  else {
    const sb = ensurePlayStyle(s).pendingSetback;
    if(sb && sb.type==="job_loss") logPlayStyleSetbackResponse(s, category===sb.prevCategory ? "retry" : "pivot", ["job_loss"]);
  }
}
// 觸發時機三種（12.4）：畢業/肄業後下一回合、失業後、玩家選擇轉職後；用career_status+studentStatus判斷，不看年齡
function checkJobSearchTrigger(s){
  if(s.pendingJobSearch) return;
  const graduatedNotWorking = (s.studentStatus==="graduated" || s.studentStatus==="withdrawn") &&
    !s.occupationCategory && s.careerStatus!==CAREER_STATUS.BUSINESS && s.careerStatus!==CAREER_STATUS.RETIRED && s.careerStatus!==CAREER_STATUS.SEMI_RETIRED;
  const searching = s.careerStatus===CAREER_STATUS.JOB_SEARCHING || s.careerStatus===CAREER_STATUS.UNEMPLOYED || graduatedNotWorking;
  if(!searching){ s.jobSearchPhase = null; return; }
  // 12.10交棒與9.3接手家業在下一世銜接（2026-09-27）：上一代把事業交給這一世的主角，出社會找工作時先問一次要不要回來接
  if(s.familyBusinessFromPrevLife && !s.pendingFamilyBusinessOffer){
    s.familyBusinessFromPrevLife = false;
    s.pendingFamilyBusinessOffer = { foreshadowLine:null, parentName:null, fromPrevLife:true };
    return;
  }
  // 十二、12.2【定案】求職期是段落型判定，佔3至5回合，畢業後第一次求職放寬至5至6回合，內部穿插家人詢問、同儕比較、打工過渡、
  // 面試前準備（2026-09-27補上，使用者授權Claude全權判斷）：原本每回合都直接跳投遞彈窗。改成開一段求職期，
  // 期間由AI依job_search_phase寫混合內容，最後一回合結束才跳投遞彈窗；沒錄取(或婉拒)就再開下一段求職期。
  // 在職中的轉職(checkTransferCandidate)與職涯伏筆帶來的求職候選不走這段，照舊當回合處理
  if(!s.jobSearchPhase){
    const first = !s.occupationCategory && !s.everSearchedJob;
    s.jobSearchPhase = { total: first ? rnd(5,6) : rnd(3,5), turn: 0, first };
    s.everSearchedJob = true;
  }
  s.jobSearchPhase.turn++;
  if(s.jobSearchPhase.turn >= s.jobSearchPhase.total){
    s.jobSearchPhase = null;
    s.pendingJobSearch = { offers: buildJobSearchOffers(s), isTransfer:false, isFallback:(s.jobSearchStreak||0)>=JOB_SEARCH_STREAK_FALLBACK };
  }
}
const CAREER_TRANSFER_COOLDOWN_TURNS = 8; // 【測試參數,待驗證,12.6】比照9.5.1轉系冷卻
const CAREER_TRANSFER_STREAK_TRIGGER = 2; // 【測試參數,待驗證,12.6】升遷候選連續兩次未成立、或健康連續下降達門檻
function detectOverseasIntent(actionText){
  return /出國工作|去國外|到國外|外派|移居|移民|出國留學|去留學/.test(actionText||"");
}
// 12.6.1【定案】海外型轉職：在職時才成立（屬於轉職的子情境），現金門檻沿用海外線伏筆的FORESHADOW_OVERSEAS_CASH_MONTHS，不足時客戶端直接擋下
function checkOverseasTransferCandidate(s){
  if(s.careerStatus!==CAREER_STATUS.EMPLOYED || s.pendingJobSearch || (s.careerTransferCooldown||0)>0) return;
  if(s.cash < computeBasicLivingCost(s)*FORESHADOW_OVERSEAS_CASH_MONTHS){
    s.careerEventLog = { type:"overseas_blocked", reason:"cash" }; // 讓AI知道這次因為手頭不夠沒走成
    return;
  }
  s.pendingJobSearch = { offers: buildJobSearchOffers(s), isTransfer:true, isFallback:false, isOverseas:true };
}
function detectStartupIntent(actionText){

}
function detectJobChangeIntent(actionText){
  return /轉職|換工作|換份工作|辭職|離職|想換跑道|不想做這份工作/.test(actionText||"");
}
// 12.6【定案】被動候選訊號一律採可結構化觀察的數值，不使用幸福感(隱藏數值，依3.8.1不進入判決迴路)
function checkTransferCandidate(s, activeIntent){
  if(s.careerStatus!==CAREER_STATUS.EMPLOYED || s.pendingJobSearch || (s.careerTransferCooldown||0)>0) return;
  const passiveTrigger = (s.promotionDeclineStreak||0)>=CAREER_TRANSFER_STREAK_TRIGGER || (s.lowHealthStreak||0)>=CAREER_TRANSFER_STREAK_TRIGGER;
  if(activeIntent || passiveTrigger){
    s.pendingJobSearch = { offers: buildJobSearchOffers(s), isTransfer:true, isFallback:false, passive:!activeIntent };
  }
}

// 12.5【定案,測試參數】升遷年資門檻：新人→熟手2年/熟手→資深4年/資深→管理職6年；自律與責任感門檻50分；持續達標而非單次跌破
const PROMOTION_TENURE_MONTHS = [24,48,72];
const PROMOTION_COOLDOWN_TURNS = 6; // 【測試參數,待驗證,12.5】
// 12.5【定案】三條訊號（2026-09-27使用者同意Claude建議的定義）：
// 「持續達標」＝這個職級期間自律、責任感的最低值都≥50；「期間無重大負面職涯事件」＝這個職級期間沒有申請轉職被拒、
// 沒有連續兩次升遷失敗。職級期間從上任/升遷/轉職那一刻起算（resetLevelPeriod）
function resetLevelPeriod(s){
  ensureFocusRatio(s).level = { n:0, push:0 }; // 2.6.7.4：本業拚一點的比例也從這個職級起算
  s.levelMinDiscipline = s.conscientiousness.selfDiscipline;
  s.levelMinResponsibility = s.conscientiousness.responsibility;
  s.levelNegativeEvent = false;
}
function trackLevelPeriod(s){
  if(s.levelMinDiscipline==null) resetLevelPeriod(s); // 舊存檔：從現在起算
  s.levelMinDiscipline = Math.min(s.levelMinDiscipline, s.conscientiousness.selfDiscipline);
  s.levelMinResponsibility = Math.min(s.levelMinResponsibility, s.conscientiousness.responsibility);

}
function checkPromotionCandidate(s){
  if(s.careerStatus!==CAREER_STATUS.EMPLOYED || s.occupationCategory==="自營/家庭事業類") return; // 自營類看12.8經營規模，不套用升遷
  trackLevelPeriod(s);
  if(s.pendingPromotionOffer || s.pendingJobSearch || (s.promotionCooldown||0)>0) return;
  const level = s.jobLevel||0;
  if(level>=3){ checkCareerForkAtLevelCap(s); return; }
  const tenureThreshold = PROMOTION_TENURE_MONTHS[level];
  const eligible = (s.tenureMonths||0) >= tenureThreshold &&
    s.levelMinDiscipline>=50 && s.levelMinResponsibility>=50 && !s.levelNegativeEvent;

// 12.5【定案】職級封頂後不再出現升遷候選，改為每隔一段時間出現「維持現狀/轉職/創業」的岔路點
function checkCareerForkAtLevelCap(s){
  if(s.pendingCareerForkOffer || (s.promotionCooldown||0)>0) return;

}
function resolveCareerForkOffer(s, choice){ // choice: "stay"/"transfer"/"startup"
  s.promotionCooldown = PROMOTION_COOLDOWN_TURNS;
  s.pendingCareerForkOffer = null;

  else if(choice==="startup") s.pendingBusinessLaunch = {};

  if(choice==="stay") logPlayStyleRisk(s, -1);

// 12.5【定案,測試參數】升遷成功機率＝基礎40%＋(成就傾向−50)×0.3個百分點，沿用3.7.3既有公式
function promotionProbabilityBreakdown(s){
  const items = [{ label:"基礎", pp:40 }, { label:`成就傾向${Math.round(s.conscientiousness.achievement)}`, pp:(s.conscientiousness.achievement-50)*0.3 }];
  // 二、2.6.7.4（2026-10-04）：這個職級期間「本業拚一點」的比例加分，只加不減，算在原本5～95%範圍內
  { const fr = ensureFocusRatio(s); const pp = focusRatioPp("promotion", fr.level.push, fr.level.n); if(pp) items.push({ label:"本業拚一點", pp }); }
  const raw = items.reduce((a,x)=>a+x.pp,0);

}
function resolvePromotionOffer(s, accept){
  s.promotionCooldown = PROMOTION_COOLDOWN_TURNS;
  s.pendingPromotionOffer = null;
  if(!accept){
    // 12.5【定案】玩家可拒絕升遷，記為skip_reason:chosen，推高自主感管道；拒絕不扣幸福感也不影響後續升遷資格
    s.promotionOffersDeclined = (s.promotionOffersDeclined||0)+1;

    s.careerEventLog = { type:"promotion", accepted:false };

  }
  logPlayStyleRisk(s, 1);
  const breakdown = promotionProbabilityBreakdown(s);
  const probPct = breakdown.total;
  const roll = rnd(1,100);
  const success = roll<=probPct;
  if(success){
    s.jobLevel = clamp((s.jobLevel||0)+1, 0, 3);
    s.tenureMonths = 0;
    resetLevelPeriod(s); // 12.5：新職級重新起算
    s.monthlyIncome = Math.round(computeCareerSalary(s, s.occupationCategory) * SALARY_SCALE);
    // 3.7.3既有的成就傾向健康扣分倍率，不另設代價
    const healthCostMult = clamp(1+(s.conscientiousness.achievement-50)*0.01, 0.5, 1.5);
    s.stats.health = clamp(s.stats.health - Math.round(3*healthCostMult), 0, 100);

    // 12.6【定案】被動轉職候選「升遷候選連續兩次未成立」：只計擲骰失敗，玩家主動拒絕不算（12.5拒絕不影響後續資格）
    s.promotionDeclineStreak = (s.promotionDeclineStreak||0)+1;
  }
  s.careerEventLog = { type:"promotion", accepted:true, success, probPct, roll };
  s.lastPromotionBreakdown = breakdown; // 11.2：只給彈窗顯示用，不送AI
}

// 12.7【定案,測試參數】年度裁員機率依職業類別分流，再乘年資修正(每滿3年×0.9，累乘下限0.5倍)；自由/創作類與自營/家庭事業類不適用
const LAYOFF_ANNUAL_PROBABILITY = {
  "軍公教/警消類": 0.005, "受雇專業/白領類": 0.02, "長期不在身邊類": 0.03,
  "政治人物子女(自身從政)": 0.03, "勞力/服務類": 0.04, "不穩定/待業類": 0.12,
  "自由/創作類": null, "自營/家庭事業類": null
};
const LAYOFF_TENURE_DISCOUNT_INTERVAL_YEARS = 3;
function rollAnnualLayoffCheck(s){
  if(s.careerStatus!==CAREER_STATUS.EMPLOYED) return { justForeshadowed:false, layoffTriggered:false };
  const baseProb = LAYOFF_ANNUAL_PROBABILITY[s.occupationCategory];
  if(baseProb==null) return { justForeshadowed:false, layoffTriggered:false };
  const tenureYears = (s.tenureMonths||0)/12;
  const discount = Math.max(0.5, Math.pow(0.9, Math.floor(tenureYears/LAYOFF_TENURE_DISCOUNT_INTERVAL_YEARS)));
  const hit = Math.random() < (baseProb*discount);
  // 16.7.2.5：沒被裁算成功，成功機率＝1−這一年的裁員機率；前兆那一年還沒被裁，也算成功
  const layoffNow = hit && !!s.layoffForeshadowed;
  recordFateRoll(s, "layoff", `${s.occupationCategory||"工作"}的年度裁員`, 1-(baseProb*discount), !layoffNow, layoffNow ? "被裁員了" : "這一年沒有被裁員", false);
  if(!hit) return { justForeshadowed:false, layoffTriggered:false };
  // 12.7【定案】裁員前需有前兆，比照7.1.2前兆機制的兩段式關卡設計精神
  if(!s.layoffForeshadowed){ s.layoffForeshadowed = true; return { justForeshadowed:true, layoffTriggered:false }; }
  s.layoffForeshadowed = false;
  s.careerStatus = CAREER_STATUS.UNEMPLOYED;
  s.riskyLifestyle = false; s.jobRiskSubtype = null; // 12.3（2026-09-27）：高風險旗標只來自在職的職業類別，離開該職業(失業/創業/收攤/退休)就清掉
  s.justLostJob = true; // 【定案,2026-09-23】七、7.6.2婚姻危機失業觸發改讀這個旗標，回合結束時清除
  markPlayStyleSetback(s, "job_loss", s.occupationCategory); // 十六、16.2.3
  s.monthlyIncome = 0;
  s.jobSearchStreak = 0;
  return { justForeshadowed:false, layoffTriggered:true };
}

// 12.8 創業
// 12.8.1【定案,9/20取代原雙條件草案】啟動門檻改為單一條件：現金≥啟動資金，比照7.5.3買房頭期款的既定做法
function computeStartupCapitalRequired(){
  const cat = findOccupationCategory("自營/家庭事業類");
  return Math.round((cat.salaryRange[0]+cat.salaryRange[1])/2 * 12);
}
// ========== 十二、12.9 創業合夥（2026-09-27補上，使用者授權Claude全權判斷，【測試參數】） ==========
// 【定案】團隊值偏單打獨鬥的角色，合夥類選項出現權重降低但不鎖死。創業彈窗依PARTNER_OPTION_PROB(teamSolo)決定這次有沒有「找人合夥」選項：
// 夥伴從關係值≥50的同事/合作對象/朋友裡挑關係值最高的一位（沒有就不出現）。合夥：啟動資金×0.5、之後事業收入分三成給對方(×0.7)、
// 年度營運成功率+5個百分點(多一個人扛)
const PARTNER_CAPITAL_SHARE = 0.5, PARTNER_INCOME_SHARE = 0.7, PARTNER_SUCCESS_BONUS_PP = 5;
function partnerOptionProb(s){ return clamp(0.3 + (s.conscientiousness.teamSolo/100)*0.6, 0.2, 0.9); } // teamSolo越高越偏團隊
function findBusinessPartnerCandidate(s){
  const pool = (s.characters||[]).filter(c=>!c.deceased && !c.lost && !c.isChild && !c.romanceStatus && (c.affinity||0)>=50 &&
    !/^(父親|母親|爸|媽|哥哥|弟弟|姊姊|姐姐|妹妹|爺爺|奶奶|阿公|阿嬤)/.test(c.relation||""));

function businessIncomeFactor(s){ return s.businessPartner ? PARTNER_INCOME_SHARE : 1; }

// 十二、12.11.1（2026-09-22新增,Claude Code依使用者直接詢問後建議判斷,可覆寫）：接手家業已有既有客源/品牌/營運模式，
// 起跑點比從零開始的新創更穩，年度營運成功率額外+10個百分點，量級比照下方才識/人脈修正(各自約±10)與興趣投入度修正上限(+5)同一數量級
const INHERITED_BUSINESS_SUCCESS_BONUS_PP = 10; // 【測試參數】

function rollAnnualBusinessCheck(s){
  if(s.businessStatus!=="經營中") return null;
  // 12.8.2（2026-09-27補充）：「相關興趣」＝8.9對應到自營/家庭事業類的正式興趣卡，原本取所有卡(含候選)的最高投入度、沒判斷相關性
  const topInvestment = topMatchedActiveInterestInvestment(s, "自營/家庭事業類");

  const probPct = clamp(45 + (s.conscientiousness.achievement-50)*0.3 + (s.stats.knowledge-50)*0.1 + (s.stats.network-50)*0.1 + interestMod + inheritedMod + partnerMod + focusMod, 5, 95);
  const roll = rnd(1,100);

  let outcome;
  if(roll<=probPct){
    outcome = "growth";

    s.monthlyIncome = Math.round(computeCareerSalary(s, "自營/家庭事業類") * SALARY_SCALE * businessIncomeFactor(s));
    s.consecutiveLossYears = 0;
    // 12.8.2（2026-09-27使用者同意Claude建議，【測試參數】）：營運成長的一年套3.7.3成就傾向健康扣分倍率，與升遷同一個公式（基礎3分）
    const healthCostMult = clamp(1+(s.conscientiousness.achievement-50)*0.01, 0.5, 1.5);

    { const before = s.cash; s.cash = Math.max(0, s.cash - Math.round((s.businessCapital||0)*(0.1 + (s.jobLevel||0)*0.05))); noteCashEntry(s, "事業虧損", s.cash-before, before); }

  recordFateRoll(s, "business", "年度營運", Math.min(probPct+20,100)/100, outcome!=="loss",
    outcome==="growth" ? "這一年生意成長" : outcome==="flat" ? "這一年生意持平" : "這一年虧損", false);

function resolveBusinessContinuation(s, choice){ // "close"/"persist"/"inject"
  s.businessContinuationCooldown = 4; // 12.8.2【定案】冷卻4回合
  s.pendingBusinessContinuation = null;
  logPlayStyleRisk(s, choice==="close" ? -1 : 1); // 十六、16.2.2：連續虧損時收攤算保守、硬撐/增資算冒險
  if(choice==="close"){
    markPlayStyleSetback(s, "job_loss", "自營/家庭事業類"); // 十六、16.2.3：收攤視同一次失業
    s.businessStatus = "收攤";

    s.riskyLifestyle = false; s.jobRiskSubtype = null; // 12.3（2026-09-27）：高風險旗標只來自在職的職業類別，離開該職業(失業/創業/收攤/退休)就清掉
    s.justLostJob = true; // 【定案,2026-09-23】收攤視同一次失業寫入點，同樣要設旗標
    s.occupationCategory = null;
    s.monthlyIncome = 0;

    // 現金不足：增資不成立，客戶端直接擋下，維持原狀
  }

// 12.10 退休與職涯結束（9/20整併，吸收十三、13.4草案）
const RETIREMENT_CANDIDATE_MIN_AGE = 60; // 【測試參數,待驗證,12.10】

// 12.10【定案】自營/家庭事業類退休可觸發「交棒」分支，接七、7.4世代傳承，並與9.3接手家業伏筆線在下一世銜接
// （2026-09-27補上，使用者授權Claude全權判斷）：經營中的自營事業、有成年(≥20歲)在世子女時多一個「交棒給孩子」選項，
// 交給關係值最高的一位。交棒＝退休(退休金照替代率)＋事業標記已交棒＋那位子女記為家業繼承人；
// 世代傳承選到這位子女時，下一世出社會找工作時會先出現一次「回來接家業」的候選(沿用12.11.1接手家業流程)
function handoverHeirCandidate(s){
  return (s.characters||[]).filter(c=>c.isChild && !c.deceased && (c.age||0)>=20).sort((a,b)=>(b.affinity||0)-(a.affinity||0))[0] || null;
}
function canHandOverBusiness(s){
  return s.occupationCategory==="自營/家庭事業類" && s.businessStatus==="經營中" && !!handoverHeirCandidate(s);
}
// 12.10【定案】退休金依年資微調（2026-09-27補上，【測試參數】）：替代率＋(累積工作年資−20)×0.3個百分點，加減最多6個百分點
function retirementTenureAdjustment(s){
  return clamp(((s.careerYearsWorked||0)-20)*0.003, -0.06, 0.06);
}
function resolveRetirementOffer(s, choice, customText){
  s.pendingRetirementOffer = null;
  // 2026-09-27修正：原本70歲以後只在UI把按鈕反灰，彈窗預設值仍是delay，直接按確定可無限延後；程式層在這裡把關
  if(choice==="delay" && s.age>=RETIREMENT_DELAY_MAX_AGE) choice = "on_time";
  // 12.10【定案】第6個選項「自訂輸入」（2026-09-27補上）：視同繼續工作，玩家寫的內容交給AI寫進敘事
  if(choice==="custom"){
    s.careerEventLog = { type:"retirement", choice:"custom", text: String(customText||"").slice(0, CUSTOM_INPUT_MAX_CHARS) };
    return;
  }
  if(choice==="handover" && !canHandOverBusiness(s)) return;
  if(!choice || choice==="delay" || choice==="no_retire"){
    s.careerEventLog = { type:"retirement", choice: choice||"no_retire" };
    return; // 繼續工作，不做任何狀態變動（呼應6.4永遠可以跳過）
  }
  if(choice==="early" && !canRetireEarly(s)) return; // 防呆：未達提早退休年齡或財務健康度門檻
  if(choice==="rest") choice = "on_time"; // 被迫退休的「專心療養」＝完全退休
  const rate = (RETIREMENT_REPLACEMENT_RATE[s.occupationCategory] || 0.45) + retirementTenureAdjustment(s);
  const preRetireSalary = s.monthlyIncome;
  s.retirementStatus = "已退休";
  completeMilestone(s, "retirement"); // 4.3.1（2026-09-27）
  s.careerStatus = choice==="semi" ? CAREER_STATUS.SEMI_RETIRED : CAREER_STATUS.RETIRED;
  s.riskyLifestyle = false; s.jobRiskSubtype = null; // 12.3（2026-09-27）：高風險旗標只來自在職的職業類別，離開該職業(失業/創業/收攤/退休)就清掉
  // 3.4.7既有「下一個完整月份才計入」規則：這裡直接覆寫monthlyIncome，因為退休決定發生在彈窗(回合之間)，
  // 自然只會影響下一次月結算，不會回溯這一回合已經算過的舊薪水，效果上等同「下一個完整月份起才變動」
  s.monthlyIncome = Math.round(preRetireSalary * rate * (choice==="semi" ? 0.5 : 1));
  s.careerEventLog = { type:"retirement", choice };
  // 2026-09-27：自營事業的老闆退休後，年度營運判定原本會繼續跑、改寫月收入；退休(非交棒)時把事業收起來
  if(choice!=="handover" && s.businessStatus==="經營中") s.businessStatus = "已收起";
  if(choice==="handover"){
    const heir = handoverHeirCandidate(s);
    s.businessStatus = "已交棒";
    heir.familyBusinessHeir = true;
    s.chronicle.push(`（${s.age}歲）把一手經營的事業交給了${heir.name}`);
    s.careerEventLog = { type:"retirement", choice, heir: heir.name };
  }
  // 12.10【定案】退休不扣幸福感，代碼中不出現「若已退休則幸福感-x」的寫法（呼應3.8.4程式層禁令，本函式完全不觸碰幸福感相關欄位）
}

// 12.11 職涯伏筆觸發點：掛在5個既有職涯狀態轉換節點，不新增判定回合(呼應9.1)
// 12.11.1（2026-09-22新增，取代原本「只寫入不讀取」的缺口）：命中後不再是單純的旗標陣列，而是{line,hitAge,hitTurn,status}
// 記錄，status依序鋪陳中(brewing)→已成為候選(candidate)→已接受(accepted)/已拒絕(declined)；判定順序每次隨機打亂，
// 不再固定創業線優先；每條線只要曾經有記錄（不論哪個狀態）就不會再命中第二次
function shuffledForeshadowLines(){
  const arr = FORESHADOW_LINES.slice();
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
function rollCareerForeshadow(s){
  if(!s.studentMajorGroup) return null;
  s.careerForeshadowLines = s.careerForeshadowLines || [];
  let hit = null;
  shuffledForeshadowLines().forEach(line=>{
    if(hit) return;
    if(s.careerForeshadowLines.some(e=>e.line===line)) return; // 每條線每一世最多命中一次
    if(Math.random() < foreshadowTriggerProbability(s.studentMajorGroup, line)){
      hit = line;
      s.careerForeshadowLines.push({ line, hitAge:s.age, hitTurn:s.turnCount, status:"brewing" });
    }
  });
  return hit;
}
const FORESHADOW_CANDIDATE_DELAY_TURNS = 6; // 【測試參數】命中後延遲幾回合才排入候選，鋪陳期間讓AI先自然帶出相關人事物
const FORESHADOW_CREATIVE_OFFER_BONUS_PP = 10; // 【測試參數】自由接案/演藝圈線候選時，「自由/創作類」錄取機率加成
const FORESHADOW_OVERSEAS_CASH_MONTHS = 6; // 【測試參數】海外線候選現金門檻＝N個月基本生活開銷（12.6.1原本待補的具體金額）
// 五、5.2.5／十二、12.11.1：接手家業前置條件——有一位父母角色卡職業為自營業者、仍在世、且這個機會還沒被任一觸發來源用掉過
// （2026-09-22補充：接手家業有兩個觸發來源——本函式供伏筆線與家長退休共用同一個判斷與同一個familyBusinessOfferUsed防重複旗標）
function findFamilyBusinessParent(s){
  return (s.characters||[]).find(c=>c.origin==="父母，從出生起" && c.occupation==="自營業者" && c.active!==false && !c.deceased && !c.lost && !c.familyBusinessOfferUsed) || null;
}
function closeForeshadowCandidate(s, line, accepted){
  const entry = (s.careerForeshadowLines||[]).find(e=>e.line===line && e.status==="candidate");
  if(entry) entry.status = accepted ? "accepted" : "declined";
}
// 每回合都要跑的掃描：鋪陳期滿的職涯伏筆線接回既有機制成為候選。各線候選欄位若被其他事件占用，這次先跳過，下回合再試
function sweepCareerForeshadowCandidates(s){
  (s.careerForeshadowLines||[]).forEach(entry=>{
    if(entry.status!=="brewing") return;
    if((s.turnCount - (entry.hitTurn||0)) < FORESHADOW_CANDIDATE_DELAY_TURNS) return;
    if(entry.line==="創業線"){
      if(s.businessStatus==="經營中"){ entry.status = "declined"; return; } // 已在創業中，直接記為已使用
      if(s.pendingBusinessLaunch) return;
      s.pendingBusinessLaunch = { foreshadowLine: entry.line };
      entry.status = "candidate";
    } else if(entry.line==="自由接案" || entry.line==="演藝圈線"){
      if(s.pendingJobSearch) return;
      s.pendingJobSearch = { offers: buildJobSearchOffers(s, { creativeBonusPct: FORESHADOW_CREATIVE_OFFER_BONUS_PP }), isTransfer: s.careerStatus===CAREER_STATUS.EMPLOYED, isFallback:false, foreshadowLine: entry.line, creativeBonusPct: FORESHADOW_CREATIVE_OFFER_BONUS_PP };
      entry.status = "candidate";
    } else if(entry.line==="海外線"){
      if(s.pendingJobSearch) return;
      if(s.cash < computeBasicLivingCost(s)*FORESHADOW_OVERSEAS_CASH_MONTHS){ entry.status = "declined"; return; } // 現金不足，候選不成立，不扣款
      s.pendingJobSearch = { offers: buildJobSearchOffers(s), isTransfer:true, isFallback:false, foreshadowLine: entry.line, isOverseas:true };
      entry.status = "candidate";
    } else if(entry.line==="接手家業"){
      const parent = findFamilyBusinessParent(s);
      if(!parent){ entry.status = "declined"; return; } // 前置條件不成立，只保留敘事，不產生候選
      if(s.pendingFamilyBusinessOffer) return;
      s.pendingFamilyBusinessOffer = { foreshadowLine: entry.line, parentName: parent.name };
      entry.status = "candidate";
    }
  });
}
// 十二、12.11.1（2026-09-22補充）：接手家業的第二個觸發來源——家長退休（parent_retirement里程碑由AI回報completed）時，
// 若還有一位自營業者家長沒被問過，也排入同一個「回家接手」候選；跟伏筆線觸發共用findFamilyBusinessParent()同一份判斷，
// 兩個來源合計每位家長只會被詢問一次，差別只在觸發來源不同（呼應9.3/12.11.1【定案】兩者共用同一個交棒動作）
function checkFamilyBusinessOnParentRetirement(s){
  if(s.pendingFamilyBusinessOffer) return;
  const parent = findFamilyBusinessParent(s);
  if(!parent) return;
  s.pendingFamilyBusinessOffer = { foreshadowLine: null, parentName: parent.name };
}
// 接受「接手家業」：玩家比照既有轉職流程結束原職業，occupation_category轉為自營/家庭事業類、business_status經營中，
// 免啟動資金，不計入first_startup里程碑（12.11.1【定案】，區別於12.8.1一般創業路徑）
function acceptFamilyBusinessOffer(s){
  s.occupationCategory = "自營/家庭事業類";
  s.businessStatus = "經營中";
  s.businessOrigin = "inherited"; // 供rollAnnualBusinessCheck()判斷是否套用接手家業的成功率加成
  s.businessPartner = null;
  s.careerStatus = CAREER_STATUS.BUSINESS;
  s.riskyLifestyle = false; s.jobRiskSubtype = null; // 12.3（2026-09-27）：高風險旗標只來自在職的職業類別，離開該職業(失業/創業/收攤/退休)就清掉
  s.consecutiveLossYears = 0;
  s.monthlyIncome = Math.round(computeCareerSalary(s, "自營/家庭事業類") * SALARY_SCALE * businessIncomeFactor(s));
  s.careerEventLog = { type:"family_business_takeover", success:true };
}
// pending: { foreshadowLine, parentName }；choice: "accept"/"decline"——不論接受或拒絕，該家長都標記familyBusinessOfferUsed，
// 兩個觸發來源合計只會問這位家長一次；只有實際接受才額外標記handedOver（12.11.1【定案】「該家長職業標記為已交棒」）
function resolveFamilyBusinessOffer(s, pending, choice){
  const parent = s.characters.find(c=>c.name===pending.parentName);
  if(parent){
    parent.familyBusinessOfferUsed = true;
    if(choice==="accept") parent.handedOver = true;
  }
  if(choice==="accept") acceptFamilyBusinessOffer(s);
  if(pending.foreshadowLine) closeForeshadowCandidate(s, pending.foreshadowLine, choice==="accept");
}

// 12.12：職涯主狀態欄位初始化輔助——所有欄位皆用||預設值處理，比照9.4/9.8既有做法，不需要改newRoll()/succeedAsChild()，對舊存檔相容
function ensureCareerDefaults(s){
  if(!s.careerStatus) s.careerStatus = s.occupationCategory ? CAREER_STATUS.EMPLOYED : CAREER_STATUS.NOT_EMPLOYED;
  if(!s.retirementStatus) s.retirementStatus = "在職";
  if(typeof s.jobLevel!=="number") s.jobLevel = 0;
  if(typeof s.tenureMonths!=="number") s.tenureMonths = 0;
}
// 每年判定一次的職涯檢查集合：裁員/創業年度營運/退休候選，比照7.1.5rollAnnualDeathCheck()「每滿一年才判定一次」的既有做法，與回合預算解耦
function rollAnnualCareerChecks(s){
  ensureCareerDefaults(s);
  // 12.10（2026-09-27）：累積工作年資(在職或經營事業的年數)，供退休金依年資微調
  if(s.careerStatus===CAREER_STATUS.EMPLOYED || s.careerStatus===CAREER_STATUS.BUSINESS) s.careerYearsWorked = (s.careerYearsWorked||0)+1;
  const layoff = rollAnnualLayoffCheck(s);
  const business = rollAnnualBusinessCheck(s);
  checkRetirementCandidate(s);
  // 12.7/12.8.2/12.13（2026-09-27修正）：年度判定結果原本被丟掉，AI拿不到裁員前兆與營運結果。
  // 年度判定在呼叫AI之前跑，寫進careerEventLog就會隨本回合career_event_now送出；若同回合已有彈窗事件，掛在annual底下不覆蓋
  let annualEvent = null;
  if(layoff.justForeshadowed) annualEvent = { type:"layoff_foreshadow" };
  else if(layoff.layoffTriggered) annualEvent = { type:"layoff" };
  else if(business) annualEvent = { type:"business_annual", outcome: business.outcome };
  if(annualEvent){
    s.careerEventLog = s.careerEventLog ? Object.assign({}, s.careerEventLog, { annual: annualEvent }) : annualEvent;
  }
  return { layoff, business };
}
// 每回合都要跑的職涯檢查集合：求職觸發/升遷候選/轉職候選(段落型判定，不與回合預算解耦)
const SIDE_BUSINESS_UPGRADE_TURNS = 24; // 【測試參數,12.8.1，2026-09-27】
// 八、8.7【定案】副業三選一「非二元開關」、正式副業要真正產生成本/時間壓力差異（2026-09-27補上，使用者授權Claude全權判斷，【測試參數】）：
// 保持興趣＝無變化；接零星案＝每月小額副業收入；正式副業＝每月較多副業收入，時間成本依8.7【測試值】現階段用敘事呈現(prompt)，

// 收入改由事業本身計算，不重複給
// 八、8.11（2026-09-29 A4定案）：取代上面「接零星案每月3、正式副業每月6」的週期性副業收入——副業改成「接單→交件」，
// 金額由程式決定、交件時一次入帳，AI只回報完成了什麼(side_gig_delivery)。computeSideBusinessIncome保留給既有呼叫點，一律回傳0
function computeSideBusinessIncome(s){ return 0; }
const SIDE_BUSINESS_LABELS = { gig:"偶爾接案", formal:"正式經營" };
// 八、8.13（2026-09-30）副業訂單簿：取代8.11「程式排定機會→AI回報交件大小(side_gig_delivery)→程式算份數入帳」。
// 旁白只登記新訂單(order_new)與指名訂單(order_target／order_work)，編號、交期、報酬、推進、交件、逾期全由程式判定。
// 訂單存在副業卡的card.gigOrders(進行中＋最近幾筆已結束)，card.gigSeq編號、card.gigIncome累計收入；舊存檔的gigOpenOrders／gigNextOfferTurn一律丟棄(訂單簿從空白開始)
const SIDE_GIG_SIZE_LABELS = { small:"小單", medium:"中單", large:"大單" };
const ORDER_SPEC = { small:{ need:1, due:3, base:35 }, medium:{ need:2, due:5, base:70 }, large:{ need:4, due:8, base:140 } }; // 【定案8.13.3】
const ORDER_LATE_MULT = 0.7;          // 延遲交件報酬×0.7
const ORDER_CANCEL_AFTER = 2;         // 超過交期2回合仍未完成→取消
const ORDER_CANCEL_AFFINITY = -2;     // 取消時介紹人好感
const ORDER_INQUIRY_PROB = { formal:0.3, gig:0.15 }; // 【測試參數】新詢問擲骰
const ORDER_KEEP_FINISHED = 12;       // 存檔精簡：已結束的訂單只留最近幾筆
const PART_TIME_SHARES = 2;             // 【A4，測試參數】打工每次固定2份
// 「1份」＝學生時期每回合的平均零用錢；有工作收入後＝每回合的平均薪資收入(月收入×12÷每年回合數)
function incomeShareUnit(s){
  const perYear = isStudentPhase(s) ? YEAR_SEGMENTS.reduce((a,x)=>a+x.budget,0) : roundsPerYearForAge(s.age);
  return Math.max(0, s.monthlyIncome||0) * 12 / perYear;
}
function sideGigCards(s){ return (s.interestCandidates||[]).filter(c=>c.status==="active" && SIDE_BUSINESS_LABELS[c.sideBusinessStatus]); }
// 接單上限與報酬乘數：偶爾接案1單；正式經營看興趣等級——精通3單×1.4、熟練2單×1.0、投入分數降到40以下1單×0.8
// 【實作判斷】「40以下」取小於40(與8.12.3熟練從40起算一致)；偶爾接案報酬乘數用1.0(文件沒寫)
function orderTier(card){
  if(card.sideBusinessStatus!=="formal") return { cap:1, mult:1.0 };
  const v = card.investment||0;
  if(v>=70) return { cap:3, mult:1.4 };

}
function orderIncomeCat(card){ return card.sideBusinessStatus==="formal" ? "副業收入" : "接案收入"; }
function orderList(card){ return card.gigOrders || (card.gigOrders = []); }
function activeOrders(card){ return orderList(card).filter(o=>o.status==="進行中"); }
function nearestDueOrder(card, s){ return activeOrders(card).filter(o=>o.reg < s.turnCount).sort((a,b)=>a.due-b.due||a.no-b.no)[0] || null; }
function orderReward(card, o, late){ return Math.round(ORDER_SPEC[o.size].base * orderTier(card).mult * (late ? ORDER_LATE_MULT : 1)); }
function findOrderByNo(s, no){
  if(no==null) return null;
  const key = String(no).trim().replace(/^#/,"");
  for(const c of sideGigCards(s)){
    const o = activeOrders(c).find(x=>String(x.no)===key || x.id===key);
    if(o) return { card:c, order:o };
  }

// 呼叫AI之前：處理逾期(延遲／取消)、整理提示用的通知、擲新詢問。focus是學生時期的重心(出社會後為null)
// 【實作判斷】出社會後沒有重心，新詢問擲骰改成每回合擲一次(機率同：正式30%／偶爾15%)，否則出社會後副業就不會有新訂單
function prepareOrderTurn(s, focus){
  s.sideGigIncomeNow = null;
  const notice = { delivered_last_turn: null, late: [], cancelled: [], inquiry: [] };
  if(s.orderDeliveredLast && s.orderDeliveredLast.length){ notice.delivered_last_turn = s.orderDeliveredLast; s.orderDeliveredLast = null; }
  sideGigCards(s).forEach(c=>{
    delete c.gigOpenOrders; delete c.gigNextOfferTurn; // 舊制欄位
    const list = orderList(c);
    list.filter(o=>o.status==="進行中").forEach(o=>{
      if(s.turnCount > o.due + ORDER_CANCEL_AFTER){
        o.status = "已取消"; o.endTurn = s.turnCount;
        const via = o.via && (s.characters||[]).find(x=>x.name===o.via && !x.deceased && !x.lost);
        if(via) via.affinity = clamp((via.affinity||0) + ORDER_CANCEL_AFFINITY, 0, 100);
        notice.cancelled.push({ client:o.client, item:o.item, via:o.via||null });
      } else if(s.turnCount > o.due && !o.lateNoted){
        o.lateNoted = true;
        notice.late.push({ client:o.client, item:o.item, via:o.via||null });
      }
    });
    const fin = list.filter(o=>o.status!=="進行中");
    if(fin.length > ORDER_KEEP_FINISHED) c.gigOrders = list.filter(o=>o.status==="進行中").concat(fin.slice(-ORDER_KEEP_FINISHED));
    const rollHere = focus ? !!focusGigItem(focus, c.id) : !focusModeActive(s);
    if(rollHere && activeOrders(c).length < orderTier(c).cap && Math.random() < ORDER_INQUIRY_PROB[c.sideBusinessStatus]) notice.inquiry.push({ category:c.category });
  });
  s.orderNotice = notice;
  return notice;
}
function orderNoticesPayload(n){
  if(!n) return null;
  const out = {};
  if(n.delivered_last_turn) out.delivered_last_turn = n.delivered_last_turn;

function advanceOrder(s, card, o, step){
  if(!o || o.status!=="進行中" || o.reg >= s.turnCount) return null;
  o.done = Math.min(o.need, Math.round((o.done + (step==null ? 1 : step))*100)/100);
  if(o.done < o.need - 1e-9) return null;
  o.done = o.need;
  const late = s.turnCount > o.due;
  const reward = orderReward(card, o, late);
  o.status = late ? "延遲交件" : "已交件"; o.endTurn = s.turnCount; o.reward = reward;
  o.endAbs = s.timeState && s.timeState.cal ? s.timeState.cal.lastRoundEnd : null; // 交件紀錄顯示月份用
  s.cash += reward; card.gigIncome = (card.gigIncome||0) + reward;

  s.orderDeliveredLast = (s.orderDeliveredLast||[]).concat([{ client:o.client, item:o.item, late }]);

function newPlayStyle(){
  return {

    deviation:0,                   // 規則與自由度：每走一次偏離常規的路線+1

// ===== 十、10.7雲端存檔瘦身（2026-09-29 claude.ai網頁版定案）=====
// ①反悔快照只存本機，雲端只上傳這段人生的現況；②上傳前一律gzip壓縮(瀏覽器原生CompressionStream，不需套件)，大小上限以壓縮後計算；
// ③已結束的人生階段(bookStageOf的劃分)把日記與人生之書打包成獨立封存包，只在封存當下上傳一次，確認成功後才從雲端主存檔移出；
// ④同步失敗不中斷遊戲，提示只跳一次，每回合結束與重新開啟時自動重試
const CLOUD_ENCODING = "gzip-b64";
function cloudCompressionSupported(){
  return typeof CompressionStream!=="undefined" && typeof DecompressionStream!=="undefined" && typeof TextEncoder!=="undefined" && typeof TextDecoder!=="undefined";
}
async function pipeBytesThrough(bytes, stream){
  const w = stream.writable.getWriter();
  const writing = w.write(bytes).then(()=>w.close());
  const r = stream.readable.getReader();
  const chunks = []; let len = 0;
  for(;;){ const { value, done } = await r.read(); if(done) break; chunks.push(value); len += value.length; }
  await writing;
  const out = new Uint8Array(len); let o = 0;
  chunks.forEach(c=>{ out.set(c, o); o += c.length; });
  return out;
}
function bytesToBase64(bytes){ let s = ""; for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(s); }
function base64ToBytes(b64){ const s = atob(b64); const out = new Uint8Array(s.length); for(let i=0;i<s.length;i++) out[i] = s.charCodeAt(i); return out; }
// 瀏覽器太舊不支援CompressionStream時退回不壓縮(enc:"json")，Worker同樣以實際上傳的大小檢查上限
async function packForCloud(obj){
  const json = JSON.stringify(obj);
  if(!cloudCompressionSupported()) return { enc:"json", z: json };
  return { enc: CLOUD_ENCODING, z: bytesToBase64(await pipeBytesThrough(new TextEncoder().encode(json), new CompressionStream("gzip"))) };
}
async function unpackFromCloud(enc, z){
  if(enc===CLOUD_ENCODING) return JSON.parse(new TextDecoder().decode(await pipeBytesThrough(base64ToBytes(z), new DecompressionStream("gzip"))));
  if(enc==="json") return JSON.parse(z);
  return null;
}
// --- 人生階段封存包 ---
// 日記每則的人生階段：學生時期看時期標籤(高一～高三／大一～大五)，出社會後依年齡，劃分同bookStageOf()；錯誤訊息那則跟著前一則
function stageKeyOfEntry(e){
  const t = String(e.timeLabel||"");
  if(/^高/.test(t)) return "highschool";
  if(/^大[一二三四五]/.test(t)) return "college";
  const a = e.age||0;
  if(!t && a<18) return "highschool";
  if(a<30) return "adult-early";
  if(a<=45) return "adult-career";
  if(a<=60) return "adult-middle";
  return "adult-old";
}
// 已結束的階段加進封存清單(stagePacks)。封存包依序涵蓋日記開頭的連續幾段；s.logOffset＝這台裝置上日記前面缺了幾則(從雲端載入、還沒下載封存包)
function planStagePacks(s){
  s.stagePacks = s.stagePacks || [];
  const offset = s.logOffset||0;
  const packedEnd = s.stagePacks.reduce((a,p)=>Math.max(a, p.from+p.count), 0);
  const log = s.log||[];
  let i = packedEnd - offset;
  if(i<0) return s.stagePacks;
  const runs = [];
  while(i<log.length){
    let k = null, j = i;
    for(; j<log.length; j++){ const ek = log[j].error ? null : stageKeyOfEntry(log[j]); if(k===null) k = ek; else if(ek!==null && ek!==k) break; }
    runs.push({ k: k||"highschool", from:i, to:j });
    i = j;
  }
  runs.slice(0,-1).forEach(r=>{
    const n = s.stagePacks.length;
    s.stagePacks.push({ id: `${String(s.lifeId||"life").replace(/[^a-z0-9]/g,"").slice(0,20)}p${n+1}`, key:r.k, from:r.from+offset, count:r.to-r.from, uploaded:false });
  });
  return s.stagePacks;
}
// 這一段的人生之書章節都寫完(或重試3次仍失敗)才封存，封存包之後不會再變動
function stagePackReady(s, p){
  const book = s.book;
  if(!book) return true;
  if(book.draft && book.draft.key===p.key) return false;
  return (book.chapters||[]).filter(c=>c.key===p.key && !c.packed).every(c=>c.status==="done" || (c.status==="failed" && (c.attempts||0)>=3));
}
function buildStagePackContent(s, p){
  const offset = s.logOffset||0;
  const chapters = s.book ? s.book.chapters.filter(c=>c.key===p.key && !c.packed) : [];
  return { v:1, id:p.id, key:p.key, lifeId:s.lifeId||null, from:p.from, count:p.count, log:(s.log||[]).slice(p.from-offset, p.from-offset+p.count), chapters };
}
// 雲端版本：不含反悔快照；已上傳封存包的日記與章節內文移出(章節留目錄資料)
function uploadedPackPrefix(s){
  let end = 0; const chapterIds = new Set();
  for(const p of (s.stagePacks||[])){ if(!p.uploaded) break; end = p.from+p.count; (p.chapterIds||[]).forEach(id=>chapterIds.add(id)); }
  return { end, chapterIds };
}
function buildCloudState(s){
  const { end, chapterIds } = uploadedPackPrefix(s);
  const offset = s.logOffset||0;
  const out = Object.assign({}, s, { snapshot:null, log:(s.log||[]).slice(Math.max(0, end-offset)), logOffset: Math.max(offset, end) });
  delete out.undoUnavailableHere;
  if(s.book) out.book = Object.assign({}, s.book, { chapters: s.book.chapters.map(c=>chapterIds.has(c.id)
    ? { id:c.id, index:c.index, key:c.key, label:c.label, part:c.part, ageFrom:c.ageFrom, ageTo:c.ageTo, status:c.status, title:c.title, packed:true } : c) });
  return out;
}
let stagePackUploading = false;
async function uploadReadyStagePacks(key, slot){
  if(stagePackUploading) return;
  stagePackUploading = true;
  try{
    const s = state;
    planStagePacks(s);
    for(const p of s.stagePacks){
      if(p.uploaded) continue;
      if(!stagePackReady(s, p) || p.from < (s.logOffset||0)) break; // 依序上傳：前一包沒上傳成功，後面的先不動
      const content = buildStagePackContent(s, p);
      const body = Object.assign({ key, slot, id:p.id }, await packForCloud(content));
      const res = await fetch(WORKER_URL+"stage-pack", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
      let data = null; try{ data = await res.json(); }catch(e){}
      if(!res.ok || !data || data.success!==true) throw new Error("封存包上傳失敗："+res.status);
      if(state!==s) return;
      p.uploaded = true; p.chapterIds = content.chapters.map(c=>c.id);
    }
  } finally { stagePackUploading = false; }
}
// 新裝置第一次打開已封存的內容(回憶錄、下載故事、人生之書、人生封存)時才下載封存包，補回這台裝置的存檔後就不會再下載
const stagePackFetchLog = []; // 測試用：記錄實際下載了哪些封存包
async function fetchStagePack(key, id){
  stagePackFetchLog.push(id);
  const res = await fetch(WORKER_URL+"stage-pack?key="+encodeURIComponent(key)+"&id="+encodeURIComponent(id));
  const data = await res.json();
  if(!res.ok || !data || data.success!==true) return null;
  return await unpackFromCloud(data.enc, data.z);
}
function hasArchivedContentMissing(s){ return !!s && ((s.logOffset||0)>0 || !!(s.book && (s.book.chapters||[]).some(c=>c.packed))); }
async function ensureArchivedContent(s){
  if(!hasArchivedContentMissing(s)) return true;
  const home = !CLOUD_SAVE_ENABLED && s.cloudHome && s.cloudHome.key ? s.cloudHome : null; // 十、10.13.3：封存包存在這段人生的雲端位置
  const key = home ? home.key : localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  if(!key || (!CLOUD_SAVE_ENABLED && !home)) return false;
  const need = (s.stagePacks||[]).filter(p=>p.uploaded && (p.from < (s.logOffset||0) || (p.chapterIds||[]).some(id=>s.book && s.book.chapters.some(c=>c.id===id && c.packed))))
    .sort((a,b)=>a.from-b.from);
  const packs = [];
  try{ for(const p of need){ const pk = await fetchStagePack(key, p.id); if(!pk) return false; packs.push(pk); } }
  catch(e){ console.warn("下載封存包失敗", e); return false; }
  const offset = s.logOffset||0;
  const missing = packs.filter(pk=>pk.from < offset).flatMap(pk=>pk.log||[]);
  if(offset>0 && missing.length===offset){ s.log = missing.concat(s.log||[]); s.logOffset = 0; }
  if(s.book) packs.forEach(pk=>(pk.chapters||[]).forEach(ch=>{ const i = s.book.chapters.findIndex(c=>c.id===ch.id); if(i>=0 && s.book.chapters[i].packed) s.book.chapters[i] = ch; }));
  saveLocalOnly();
  return !hasArchivedContentMissing(s);
}

// 讀檔：雲端與本機是同一段人生時，本機一樣新或比較新就用本機(有反悔快照與完整日記)；雲端比較新(換了裝置玩過)就用雲端，
// 前面封存掉的日記如果本機有，直接補回來，不用下載
function mergeCloudWithLocal(cloud, local){
  if(!cloud) return local;
  if(!local || !local.lifeId || local.lifeId!==cloud.lifeId){
    if(!cloud.snapshot) cloud.undoUnavailableHere = true;
    return cloud;
  }
  // 十、10.2（2026-09-30）：以「最後一次存檔」為準——兩邊都有存檔時間就比時間(兩台裝置玩同一段人生，回合數不一定誰比較大)，舊存檔沒有時間才退回比回合數
  if((local.savedAt && cloud.savedAt) ? local.savedAt >= cloud.savedAt : (local.turnCount||0) >= (cloud.turnCount||0)) return local;
  const off = cloud.logOffset||0;
  if(off>0 && !(local.logOffset>0) && (local.log||[]).length >= off){ cloud.log = local.log.slice(0, off).concat(cloud.log||[]); cloud.logOffset = 0; }
  if(cloud.book && local.book) cloud.book.chapters = cloud.book.chapters.map(c=>{ if(!c.packed) return c; const lc = local.book.chapters.find(x=>x.id===c.id && !x.packed); return lc || c; });
  cloud.snapshot = null; cloud.undoUnavailableHere = true; // 本機的快照是更早回合的，不能拿來反悔
  return cloud;
}

async function cloudSyncOnce(){
  const slotRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
  const slot = slotRaw!==null ? Number(slotRaw) : null;
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  if(key && slot!==null && state && (state.phase==="playing" || state.phase==="ending")){
    try{
      // 十、10.7（2026-09-29）：先上傳已經可以封存的階段，再上傳壓縮過、不含反悔快照的現況
      const s0 = state;
      // 封存包上傳失敗：那一段照舊留在主存檔裡一起上傳，下次同步再試(10.7.3)，不算同步失敗
      try{ await uploadReadyStagePacks(key, slot); }catch(pe){ console.warn("封存包上傳失敗，下次同步再試", pe); }
      if(state!==s0) return;
      try{ localStorage.setItem(STORAGE_KEY+":"+slot, JSON.stringify(state)); }catch(e){} // 封存包上傳成功的標記也存回本機
      const packed = await packForCloud(buildCloudState(state));
      const res = await fetch(WORKER_URL+"save", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(Object.assign({
          key, slot,
          meta: { name:state.name, age:state.age, stage:stageLabel(state.age), updatedAt:Date.now() }
        }, packed))
      });
      // 十、10.1補充（2026-09-22修正）：原本只看fetch有沒有拋出網路例外，Worker回傳403/429/500等HTTP錯誤狀態
      // 時fetch本身不會拋例外，會被誤判成同步成功——改成明確檢查res.ok(HTTP狀態碼)+回傳body的success欄位
      let data = null;
      try{ data = await res.json(); }catch(e){}
      if(!res.ok || !data || data.success!==true) throw new Error("Worker回傳失敗狀態："+res.status);
      cloudSyncStatus = { success:true, time:Date.now() };
      syncFailNotified = false; setSyncPending(slot, false);
    }catch(e){
      console.warn("雲端存檔失敗", e);
      cloudSyncStatus = { success:false };
      setSyncPending(slot, true);
      // 10.7.4：同一段失敗期間提示只跳一次，遊戲照常進行(本機已經存好)；每回合結束、重新開啟時自動重試
      if(!syncFailNotified){ syncFailNotified = true; showSyncFailToast(); }
    }
    updateCloudSyncStatusUI();
  }
}

function computeFinancialHealth(savings, monthlyIncome){
  const savingsScore = savings<100 ? (savings/100)*40 : savings<3000 ? 40+((savings-100)/2900)*35 : 75+Math.min(25,(savings-3000)/200);
  const incomeScore = monthlyIncome<40 ? (monthlyIncome/40)*40 : monthlyIncome<100 ? 40+((monthlyIncome-40)/60)*35 : 75+Math.min(25,(monthlyIncome-100)/20);
  return clamp(Math.round(savingsScore*0.5+incomeScore*0.5),0,100);
}

function livingBasicNeed(s){
  if(isStudentPhase(s)) return STUDENT_BASIC_NEED;

  const householdStatus = computeHouseholdStatus(s);
  if(householdStatus==="已婚雙薪" || householdStatus==="已婚單薪"){

  } else if(householdStatus==="同居"){

// 基本生活開銷＝基本需求×三餐倍率＋子女扶養費＋慢性病費用；不含可支配花費。

function computeBasicLivingCost(s){
  const meal = MEAL_EXPENSE_MULT[s.mealArrangement] ?? MEAL_EXPENSE_MULT["自己打理"];
  // 十三、13.3.3（2026-09-20新增）：慢性病每項每月低費用等級固定支出，掛在這裡與子女扶養費同一套週期性結算路徑
  return Math.round(livingBasicNeed(s) * meal) + computeChildSupportCost(s) + (s.chronicConditions||[]).length*CHRONIC_CONDITION_MONTHLY_COST;
}
// 每月生活開銷(結算用)＝基本生活開銷＋可支配的錢×花錢習慣比例。
// 可支配的錢＝每月收入(含配偶、副業)−基本需求−固定支出(房租房貸等monthlyExpenses、扶養費、慢性病)，不足時為0；
// 學生期收入＝零用錢(打工收入是一次性入帳，不算在這裡)
function computeBaseLivingCost(s){
  const meal = MEAL_EXPENSE_MULT[s.mealArrangement] ?? MEAL_EXPENSE_MULT["自己打理"];
  const income = s.monthlyIncome + (s.spouseIncome||0) + computeSideBusinessIncome(s);
  const fixed = s.monthlyExpenses.reduce((sum,e)=>sum+e.amount,0) + computeChildSupportCost(s) + (s.chronicConditions||[]).length*CHRONIC_CONDITION_MONTHLY_COST;
  const disposable = Math.max(0, income - livingBasicNeed(s) - fixed);
  const habit = SPENDING_HABITS[s.spendingHabit] ?? SPENDING_HABITS["普通花費"];
  // 加總後才四捨五入一次，避免兩段各自進位多算1
  return Math.round(livingBasicNeed(s) * meal + disposable * habit) + computeChildSupportCost(s) + (s.chronicConditions||[]).length*CHRONIC_CONDITION_MONTHLY_COST;
}

// 農曆節日用現成套件lunar-javascript(lunar.min.js)算，沒載入時退回瀏覽器內建農曆(Intl chinese，少數年份差一天)，都不行才用約略日期。

const CAL_FIRST_YEAR = 2026;
const CAL_EPOCH_MS = Date.UTC(2026,7,30);

const CAL_WEEKDAY_NAMES = "日一二三四五六";
function calAbsToDate(abs){ const t = new Date(CAL_EPOCH_MS + abs*CAL_DAY_MS); return { y:t.getUTCFullYear(), m:t.getUTCMonth()+1, d:t.getUTCDate(), dow:t.getUTCDay() }; }
function calDateToAbs(y,m,d){ return Math.round((Date.UTC(y,m-1,d) - CAL_EPOCH_MS)/CAL_DAY_MS); }
function calAbsToMd(abs){ const t = calAbsToDate(abs); return { m:t.m, d:t.d }; }
function calFormat(abs){ const t = calAbsToDate(abs); return `${t.m}/${t.d}`; }
function calFormatFull(abs){ const t = calAbsToDate(abs); return `${t.y}/${t.m}/${t.d}（${CAL_WEEKDAY_NAMES[t.dow]}）`; }
function calFormatMdw(abs){ const t = calAbsToDate(abs); return `${t.m}/${t.d}（${CAL_WEEKDAY_NAMES[t.dow]}）`; }
// 生日只記月/日(開局隨機，365天平均，不會抽到2/29)
const CAL_DAYS_IN_MONTH = [31,28,31,30,31,30,31,31,30,31,30,31];

  let m=0; doy=((doy%365)+365)%365;
  while(doy>=CAL_DAYS_IN_MONTH[m]){ doy-=CAL_DAYS_IN_MONTH[m]; m++; }
  return { m:m+1, d:doy+1 };
}
function rollBirthday(){ const doy = rnd(0,364); return calDoyToMd(doy); }
const LEAVE_OF_ABSENCE_DAYS = 182; // 休學的備用天數(舊存檔沒有leaveTarget時用)；新的休學期間算到下一個真實學期開學前

// --- 農曆節日：春節(初一)、端午、中秋、清明(節氣) ---

  calLunarCache[y] = r;

function calLunarDatesIntl(y){

// 放假的國定假日(考試避開用)：元旦、和平紀念日、兒童節、清明、勞動節、端午、中秋、國慶、除夕～初五
const calHolidaySetCache = {};
function calIsNationalHoliday(abs){

// --- 學期行事曆(仿台灣教育部慣例，每年計算) ---
function calNearestWeekday(abs, dow){ const cur = calAbsToDate(abs).dow; let diff = (dow-cur+7)%7; if(diff>3) diff -= 7; return abs+diff; }

// 寒假(y＝寒假所在的西元年)：1/20前後最近的週三開始，至少21天且包含除夕到初五；結束日取「開始日＋21天」與「初五＋3天」較晚者，

function calWinterBreak(y){

function calExamHitsHoliday(tue){ return [0,1,2].some(i=>calIsNationalHoliday(tue+i)); }

const calSemCache = {};
function calSemesterInfo(n){
  if(calSemCache[n]) return calSemCache[n];

  const y = CAL_FIRST_YEAR + Math.floor((n+1)/2);
  let start, end, next;
  if(fall){ start = calFallStart(y); const wb = calWinterBreak(y+1); end = wb.start-1; next = wb.springStart; }
  else { start = calWinterBreak(y).springStart; end = calDateToAbs(y,6,30); next = calFallStart(y); } // 下學期到6/30，暑假7/1起
  // 期中考：學期第9週的週二～週四；與國定假日重疊時順延一週
  let mid = start + 8*7 + 1;
  for(let k=0;k<3 && calExamHitsHoliday(mid);k++) mid += 7;

  let fin = calMondayOf(end) - 7 + 1;
  if(calExamHitsHoliday(fin)) fin = (fin+7+2<=end && !calExamHitsHoliday(fin+7)) ? fin+7 : fin-7;
  // 7個段落起始日：開學初(3週)／期中準備期／期中考(週二～週日)／期中後放鬆(2週)／期末準備期／期末考(考完到學期最後一天)／假期
  const segs = [start, Math.min(start+21, mid-7), mid, mid+6, Math.min(mid+6+14, fin-7), fin, end+1];

// 一學年＝第semIdx學期＋下一學期，15個日期(14段起始日＋下一學年開學日)，順序對應YEAR_SEGMENTS
function calSchoolYearSched(semIdx){ const a = calSemesterInfo(semIdx), b = calSemesterInfo(semIdx+1); return a.segs.concat(b.segs, [b.next]); }
function calFirstSemesterOnOrAfter(abs){

}
// 這一天以後第一個「開局日」(上學期開學前一天)所在的西元年：轉世從這一年開局
function calNextOpeningYear(abs){ let y = calAbsToDate(abs).y; if(calFallStart(y)-1 <= abs) y++; return Math.max(CAL_FIRST_YEAR, y); }
function isStudentCalendarMode(s){ const m=s.timeState.stageMode; return m==="highschool"||m==="college"; }
// 學生時期：第idx段第t回合的起始絕對日(段落內平均分配天數)
function schoolAnchor(cal, idx, t){

  return cal.sched[idx] + Math.floor(t*(cal.sched[idx+1]-cal.sched[idx])/seg.budget);
}
function careerAnchor(cal, t, budget){ return cal.careerYearBase + Math.floor(t*365/budget); }
function calAdvanceSchoolYear(cal, years){ cal.semIdx += 2*years; cal.sched = calSchoolYearSched(cal.semIdx); }
// 休學復學、非休學型延畢重跑：從fromAbs以後第一個真實學期接著上課；目前在下學期段落的話，這一學年的上半段對齊前一個學期。

// --- 年齡依生日(B1，2026-09-29)：跨過生日那天年齡＋1；家人、子女卡的年齡同一天一起推進 ---
function calBirthYearForAge(birthday, refAbs, ageAtRef){

function syncBirthdayAge(s, uptoAbs){

// 行事曆欄位(timeState.cal，跟著timeState進反悔快照，反悔時日期與年齡一併還原)。
// 舊存檔(v2以前是沒有西元年的固定月/日行事曆)：依目前所在學年/段落換算到真實日曆，年齡依生日重算(B1回溯檢查)
function ensureCalendar(s){

// 給定錨點區間[anchorStart,anchorEnd]，算出本回合範圍：起始日至少是上一回合場景的隔天(1.2.9.11.1第2項)，跨度至少一天
function buildRoundWindow(cal, anchorStart, anchorEnd){

function calSpanText(days){

// 本回合範圍內的固定事件：開學日/段考/寒暑假開始(學生時期)、節日、玩家生日；日期附星期
function collectFixedEvents(s, win){
  const events = [];

  const cal = s.timeState.cal;
  const maxDays = Math.min(win.end-win.start, 400);
  const holidays = {};
  for(let abs=win.start; abs<=win.start+maxDays; abs++){
    const t = calAbsToDate(abs);
    const date = calFormatMdw(abs);
    if(student && cal && cal.sched){
      const idx = cal.sched.indexOf(abs);
      if(idx>=0 && idx<YEAR_SEGMENTS.length){
        const seg = YEAR_SEGMENTS[idx];
        if(seg.key==="開學初") events.push({ date, name: seg.half+"開學日" });

// 二、2.7考試倒數：距離下一次考試還有幾天。考前7天以內才可以寫具體天數(依新場景日期)，超過7天只能寫「段考越來越近」這類模糊說法
function buildExamCountdown(s, win){
  if(!win || !isStudentCalendarMode(s) || s.leaveStatus==="onLeave" || s.timeState.prologue) return null;
  const cal = s.timeState.cal;
  if(!cal || !cal.sched) return null;
  const next = YEAR_SEGMENTS.map((seg,i)=>({ seg, abs:cal.sched[i] })).find(x=>x.seg.isExam && x.abs+2 >= win.start);
  if(!next) return null;
  const exact = [];
  for(let o=0;o<=win.end-win.start;o++){ const left = next.abs-(win.start+o); if(left>=1 && left<=7) exact.push({ scene_day_offset:o, days_left:left }); }
  return { exam: next.seg.half+next.seg.examType, exam_dates: `${calFormatMdw(next.abs)}～${calFormatMdw(next.abs+2)}`,
    days_from_round_start: Math.max(0, next.abs-win.start), exact_countdown_allowed: exact };
}
// AI回傳的新場景日期檢查(1.2.9.11.4)：scene_day_offset是相對本回合起始日的天數，須落在本回合範圍內
// 十、10.14.3（2026-10-04）：開場回合的offset本來就是0，而【回傳資料精簡】要AI把0的欄位省略，AI照做就會被判「沒回傳整數」而固定多重生成一次

function validateSceneDate(r, win, prologue){
  if(!win) return { ok:true };
  const off = r && r.scene_day_offset;
  if(prologue && (off===undefined || off===null)) return { ok:true };
  const maxOff = win.end - win.start;

// 二、2.5（9/16新增，9/16-v2.1下修數字+年齡帶改左閉右開）：22歲以後加速曲線，取代原本「30歲以後交給AI自行判斷age_advance」的舊架構

// 九、9.8.1（2026-09-22修正）：延畢的時間延長改由「該學期重跑」自然產生，yearInStage正常情況下不會超過base，

// 九、9.4【定案】延畢觸發原因接既有機制(3.2.4課業興趣連動、財務壓力)；9.8.1【定案】非休學型延畢沿用同一套機制：
// 該學期不計入、重跑，delay_years+0.5（2026-09-27補上，使用者授權Claude全權判斷，門檻為【測試參數】）：
// 大學期末考沒過，且這段準備期選興趣≥DELAY_INTEREST_COUNT_TRIGGER次(興趣拖累)、或財務健康度連續偏低(lowCashStreak達休學候選門檻)，
// 延畢額度與畢業年齡上限還夠時(isAnotherLeaveFeasible)，考完直接回到這學期開頭重跑(那個假期沒得放)；時間照休學復學的做法記半年
const DELAY_INTEREST_COUNT_TRIGGER = 3;
function checkNonLeaveGraduationDelay(s, examCheck, interestCount){
  if(examCheck.passed || s.timeState.stageMode!=="college" || s.studentStatus!=="enrolled") return false;
  const byInterest = (interestCount||0) >= DELAY_INTEREST_COUNT_TRIGGER;
  const byFinance = (s.lowCashStreak||0) >= WITHDRAWAL_STREAK_TRIGGER;
  if(!byInterest && !byFinance) return false;
  if(!isAnotherLeaveFeasible(s)) return false;
  const cal = s.timeState.cal;
  const halfStart = (s.timeState.segmentIndex % YEAR_SEGMENTS.length) < SEMESTER_PHASES.length ? 0 : SEMESTER_PHASES.length;
  s.timeState.segmentIndex = halfStart;
  s.timeState.turnsInSegment = 0;
  s.studyCountThisTerm = 0; s.interestCountThisTerm = 0;
  // 二、2.7（2026-09-29）：從考完之後第一個真實學期重新開始這學期(寒暑假的日子照樣過去，只是沒有回合)；halfYearCarry依學期是否錯開半年設定，
  // 年齡改依生日(B1)，不再由「滿兩個半年」加一歲
  if(cal && cal.v===2 && cal.lastRoundEnd!=null) calRealignSchool(s, cal, cal.lastRoundEnd+1);
  else s.halfYearCarry = ((s.halfYearCarry||0)+1)%2;
  s.collegeDelayYearsUsed = clamp((s.collegeDelayYearsUsed||0)+0.5, 0, COLLEGE_DELAY_CAP);
  s.universityEventLog = { type:"graduation_delayed", reason: byInterest ? "interest" : "finance" };
  return true;
}
function isAnotherLeaveFeasible(s){
  const usedDelay = clamp(s.collegeDelayYearsUsed||0, 0, COLLEGE_DELAY_CAP);
  if(usedDelay >= COLLEGE_DELAY_CAP) return false;
  const base = s.collegeYearsRequired || 4;
  const cap = COLLEGE_GRAD_AGE_CAP[base] || COLLEGE_GRAD_AGE_CAP[4];
  const projectedGradAge = computeExpectedGraduationAge(s) + 0.5;
  return projectedGradAge <= cap;
}

function computeExpectedGraduationAge(s){
  const base = s.collegeYearsRequired || 4;
  const remainingYears = base - (s.timeState?.yearInStage||1) + 1;
  return s.age + Math.max(0, remainingYears) + (s.halfYearCarry||0)*0.5;
}
// 9.5.1 轉系候選觸發：連續兩次段考成績低於預期區間【測試參數，9.7測試項目2待校準】
// 「預期區間」用跟2.4考試成績算法同精神、但採client端可重算的proxy（知識值+讀書次數×3），
// 不依賴AI自由回報的敘事分數，確保這條線完全不受AI輸出內容影響（9.9 AI/程式責任邊界的要求）
const TRANSFER_EXAM_EXPECTATION_THRESHOLD = 55; // 【測試參數】低於此proxy分數視為「低於預期」
const TRANSFER_EXAM_STREAK_TRIGGER = 2; // 【定案】連續兩次
const TRANSFER_COOLDOWN_TURNS = 8; // 【測試參數,9.5.1新增待補】轉系候選冷卻回合數
function updateTransferCandidateOnExam(s, studyCountAtExam){
  const proxy = clamp(Math.round(s.stats.knowledge + (studyCountAtExam||0)*3), 0, 100);
  const belowExpectation = proxy < TRANSFER_EXAM_EXPECTATION_THRESHOLD;
  s.examBelowExpectationStreak = belowExpectation ? (s.examBelowExpectationStreak||0)+1 : 0;
  // 9.5.1【定案】轉系須先通過9.4「轉系最後可行年齡」才成立候選（2026-09-27修正：原本不檢查，超過20歲仍跳出全部反灰的彈窗）。
  // 4年制是所有目標裡門檻最寬的，連4年制都不可行就沒有任何可轉的科系
  const anyTargetFeasible = isTransferFeasible(s.age, 4, s.collegeDelayYearsUsed);
  const signal = s.studentStatus==="enrolled" && !s.transferCooldown && s.examBelowExpectationStreak>=TRANSFER_EXAM_STREAK_TRIGGER && anyTargetFeasible;
  // 9.5.1【定案】候選成立機率由才識與自律決定（2026-09-27使用者同意Claude建議，【測試參數】）：
  // 50%＋(才識−50)×0.5＋(自律−50)×0.3，夾在5%～95%；沒成立時streak保留，下一次仍低於預期會再判定一次
  const candidateProbPct = clamp(50 + (s.stats.knowledge-50)*0.5 + (s.conscientiousness.selfDiscipline-50)*0.3, 5, 95);
  const candidate = signal && rnd(1,100) <= candidateProbPct;
  // 9.5.1：log須同時輸出預期區間、實際成績、連續計數、候選判定結果
  s.lastExamPerformanceLog = { expected: TRANSFER_EXAM_EXPECTATION_THRESHOLD, actual: proxy, streak: s.examBelowExpectationStreak, candidate, ageFeasible: anyTargetFeasible, candidateProbPct: signal ? Math.round(candidateProbPct) : null };
  if(candidate){
    s.pendingTransferOffer = true;
  }
}

  return { examType, isFinal: examType==="期末考", expected, swing, prep, studyCount:(studyCount||0), prepTurns:(prepTurns||0),

function segmentLabel(seg, isFirstHalf, halfYearCarry){

function computeTimeLabel(s){

      : collegeYearLabel(s);

function detectTimeSkipIntent(actionText){

  const t = actionText||"";

  if(/寒假/.test(t)) return { key:"假期", half:"上學期" };
  if(/暑假/.test(t)) return { key:"假期", half:"下學期" };

  // segmentIndex/turnsInSegment/考試判定一律不動；回合預算另外由sweepUniversityState()的leaveResumeCountdown計數
  if(mode==="college" && s.leaveStatus==="onLeave"){
    const label = computeTimeLabel(s);
    // 1.2.9.11：休學半年(LEAVE_OF_ABSENCE_DAYS)平均分攤到休學回合，取代原本固定LEAVE_MONTHS_PER_ROUND
    // 二、2.7（2026-09-29）：休學期間算到之後第一個真實學期開學前(至少約4個月)，平均分攤到休學回合
    if(cal.leaveBase==null){ cal.leaveBase = cal.lastRoundEnd+1; cal.leaveRound = 0; cal.leaveTarget = calSemesterInfo(calFirstSemesterOnOrAfter(cal.leaveBase+LEAVE_MIN_DAYS)).start; }
    const leaveDays = cal.leaveTarget!=null ? cal.leaveTarget-cal.leaveBase : LEAVE_OF_ABSENCE_DAYS;
    const k = cal.leaveRound++;
    const win = buildRoundWindow(cal,
      cal.leaveBase + Math.floor(k*leaveDays/LEAVE_OF_ABSENCE_TURNS),
      cal.leaveBase + Math.floor((k+1)*leaveDays/LEAVE_OF_ABSENCE_TURNS) - 1);
    syncBirthdayAge(s, win.start);
    return { bigJump:false, fromLabel:label, toLabel:label, currentLabel:label, monthsCrossed:+(win.daysAdvanced/DAYS_PER_MONTH).toFixed(2), examTriggered:false, examType:null, window:win, holiday:true };
  }

  if(cal.leaveBase!=null && isStudentCalendarMode(s)){
    calRealignSchool(s, cal, cal.leaveTarget!=null ? cal.leaveTarget : cal.leaveBase + LEAVE_OF_ABSENCE_DAYS);

  }
  // 三、3.2.4（2026-09-27修正）：讀書/興趣路徑次數只算「考前準備期」（原本開學初、放鬆期、假期也會算進去）
  s.inPrepPhaseThisTurn = (mode==="highschool" || mode==="college") && s.leaveStatus!=="onLeave" &&
    /準備期/.test(YEAR_SEGMENTS[s.timeState.segmentIndex % YEAR_SEGMENTS.length].key);
  // 二、2.6.4（2026-09-28）：讀書次數＝準備期內選「讀書」重心的回合數、興趣次數＝選「興趣」重心的回合數(取代偵測文字關鍵字)；
  // 跳過指令的回合不結算重心(2.6.1)
  const skippingNow = detectTimeSkipIntent(actionText);

  if(s.inPrepPhaseThisTurn && focusKey==="interest" && !skippingNow) s.interestCountThisTerm = (s.interestCountThisTerm||0)+1;
  if(mode==="highschool" || mode==="college"){

    const currentSeg = YEAR_SEGMENTS[fromGlobalIdx % YEAR_SEGMENTS.length];
    // 二、2.2（2026-09-23修正,標籤慢一拍bug）：本回合的時間標籤與考試判定都以「這回合所在的段落」為準
    // (即fromLabel，換段是這回合結束後才生效、供下一回合用)，取代原本把換段後的toLabel當成本回合標籤的舊寫法
    const fromLabel = computeTimeLabel(s);

    if(skip){

      // 有指定目標(跳到+寒假/暑假/下學期/期中/期末)時找下一次出現該段落的位置

      const toIdx = toGlobalIdx % YEAR_SEGMENTS.length;

      // 取代原本每回合固定STUDENT_MONTHS_PER_ROUND(寒假回合天數少、期末準備期回合天數多，一整年加總仍是365天)
      const t = s.timeState.turnsInSegment||0;

    // 十八、18.2／18.3（2026-09-28）：場景挑選要知道這回合所在段落(假期比例、開學典禮)
    const result = { bigJump: skip, fromLabel, toLabel, currentLabel, monthsCrossed, examTriggered: !!examType, examType, window: win,

    if(examType){ s.studyCountThisTerm = 0; s.interestCountThisTerm = 0; s.prepTurnsThisTerm = 0; } // 考試結算後歸零，重新累積下一次備考的讀書次數/興趣路徑次數

    // 12.6.1（2026-09-27補上）：自由輸入想出國/外派/移居，走海外型轉職（跨類別規則＋現金門檻），不是一般轉職
    if(detectOverseasIntent(actionText)) checkOverseasTransferCandidate(s);
    else if(detectJobChangeIntent(actionText)) checkTransferCandidate(s, true);
    // 12.8.1【定案】創業來源三條之「玩家自由輸入」（2026-09-27補上）：比照detectJobChangeIntent，偵測到創業意圖就排入創業彈窗
    // (現金門檻仍在彈窗/launchBusiness把關)；已經在經營事業、或已有排隊中的創業彈窗時不重複
    if(detectStartupIntent(actionText) && s.businessStatus!=="經營中" && !s.pendingBusinessLaunch) s.pendingBusinessLaunch = { source:"free_input" };

    // 2026-09-23：改用收窄後的detectTimeSkipIntent，避免「之後」「直接」等一般用語誤觸發整年跳過
    const skip = detectTimeSkipIntent(actionText);
    const fromLabel = computeTimeLabel(s);
    // 二、2.7（2026-09-29）：年齡改依生日，年中可能跨進下一個年齡帶；這一年的回合預算在年初定好，年中不變
    const budget = s.timeState.careerYearBudget || roundsPerYearForAge(s.age);
    s.timeState.careerYearBudget = budget;
    let yearsToAdd = 0;
    let monthsCrossed;
    // 1.2.9.11（2026-09-24）：出社會後每回合天數＝365÷該年齡帶每年回合預算，第一次進入career模式時從上一回合結束日接續
    if(cal.careerYearBase==null) cal.careerYearBase = cal.lastRoundEnd + 1 - Math.floor((s.timeState.adultTurnsInYear||0)*365/budget);
    let win;
    if(skip){
      logPlayStyleSkip(s); logPlayStyleSetbackResponse(s, "rest", null); // 十六、16.2.2/16.2.3
      // 跳過語意：直接跳完當年剩餘回合，進入下一年（實作假設：比照學生時期"跳過至少跨一段"的精神，此處對應"至少跨完當年"）
      s.timeState.adultTurnsInYear = 0;
      yearsToAdd = 1;
      cal.careerYearBase += 365;
      const nextBudget = roundsPerYearForAge(s.age+1);

    } else {
      const t = s.timeState.adultTurnsInYear||0;
      win = buildRoundWindow(cal, careerAnchor(cal, t, budget), careerAnchor(cal, t+1, budget)-1);
      s.timeState.adultTurnsInYear = t + 1;
      if(s.timeState.adultTurnsInYear >= budget){
        s.timeState.adultTurnsInYear = 0;
        s.timeState.careerYearBudget = null;
        yearsToAdd = 1;
        cal.careerYearBase += 365;
      }
    }
    monthsCrossed = +(win.daysAdvanced/DAYS_PER_MONTH).toFixed(2); // 1.2.9.11.5：結算月數依實際推進天數
    syncBirthdayAge(s, win.start); // B1（2026-09-29）：年齡依生日增加，取代「每跑完一年的回合預算＋1歲」；年度判定照舊每滿一年一次
    let deathCheck = { justForeshadowed:false, deathTriggered:false };
    if(yearsToAdd>0){
      deathCheck = rollAnnualDeathCheck(s); // 七、7.1.5：每滿一年才判定一次，不是每回合都判定
      rollAnnualCareerChecks(s); // 十二、12.2/12.7/12.8/12.10：裁員/創業年度營運/退休候選，同樣每滿一年才判定一次
      settleFocusYear(s); // 二、2.6.7.5（2026-10-04）：這一年拚工作的比例→年度健康扣分；放在營運判定之後(營運要用這一年的顧事業比例)
      rollAnnualHealthChecks(s); // 十三、13.2/13.3/13.5：健康cap收斂/疾病判定/父母健康狀態機推進，同樣每滿一年才判定一次
    }
    const toLabel = computeTimeLabel(s);
    // 二、2.2.2（2026-09-27比照學生期修正）：這回合的日期還在滿年前，標籤用這回合所在的年度(fromLabel)；
    // 原本一律用toLabel，每年最後一回合會提前顯示新年齡/新的「入職第X年」。跳過指令本身就是「跳到了X」，維持toLabel
    const currentLabel = skip ? toLabel : fromLabel;
    return { bigJump: skip, fromLabel, toLabel, currentLabel, monthsCrossed, examTriggered:false, examType:null, deathForeshadowNow: deathCheck.justForeshadowed, deathTriggered: deathCheck.deathTriggered, window: win };
  }
  return { bigJump:false, fromLabel:null, toLabel:null, currentLabel:null, monthsCrossed:0, examTriggered:false, examType:null };
}
// 七、7.3.5／十三、13.5前置需求（2026-09-20新增）：子女/父母角色卡的年齡追蹤，供成長節點(7.3.5.2)、

// 九、9.8.1（2026-09-22新增）：帶著halfYearCarry=1進入22歲以後職涯曲線時，當年度回合預算設為一半

// B1（2026-09-29）：年齡改在跨過生日那天＋1(syncBirthdayAge)，家人、子女卡的年齡也在那天一起推進；這裡只推進學年

// 四、4.1.3【定案】NPC角色卡性別欄位gender（2026-09-28，取代9/27版的「AI沒給就留null」）：值為「男」或「女」，建卡時寫入後鎖定，

// QA 34.15 #5（2026-09-30）：關係提示的用詞——第一次認識寫「認識了○○」；級距改變要分升級與降級，不再用「好像不一樣了」
const relLabelRanks = ()=>[["關係生疏","認識不深","普通朋友","熟悉的朋友","多年好友"], FAMILY_RELATION_LABELS, ["漸行漸遠","貌合神離","平穩","恩愛"]]; // 用函式包起來，避免載入時FAMILY_RELATION_LABELS還沒定義
function relLabelRank(from, to){
  for(const list of relLabelRanks()){ const a = list.indexOf(from), b = list.indexOf(to); if(a>=0 && b>=0) return b>a ? 1 : b<a ? -1 : 0; }

function labelChangeHint(name, from, to){

        c.affinity = clamp(c.affinity - COHABITING_DECAY_AMOUNT, COHABITING_AFFINITY_FLOOR, 100);
        const afterLabel = relationshipStatusLabel(c);
        if(hintCandidates && afterLabel!==beforeLabel){
          hintCandidates.push({ tier:2, text: labelChangeHint(c.name, beforeLabel, afterLabel) });
        }
      }
      return;
    }
    if(c.active && (state.turnCount - c.lastTurn) > THRESHOLD){
      c.active=false;
      shelvePlotLinesForFadedCharacter(state, c.name); // 十八、18.6：以他為主要角色的劇情線一起擱置(不計擱置次數)

      if(c.romanceStatus==="ambiguous" || c.romanceStatus==="dating"){ c.romanceStatus = "breakup"; c.breakupSinceTurn = state.turnCount; }
    }
  });
}

// 這裡把職場相關的說法歸到這四類顯示；prompt也要求AI建職場角色時直接用這四種寫法
function workplaceRelationCategory(relation){
  const r = String(relation||"");
  if(/主管|上司|老闆|經理|組長|店長/.test(r)) return "主管";
  if(/下屬|部屬|屬下|學弟妹.*公司|新人/.test(r)) return "下屬";
  if(/客戶|合作|廠商|夥伴|業主/.test(r)) return "客戶或合作對象";
  if(/同事|同仁|前同事/.test(r)) return "同事";
  return null;
}
function relationCategoryLabel(c){

  if(c.romanceStatus==="dating" || c.romanceStatus==="stable") return "戀愛對象";

const FAMILY_RELATION_LABELS = ["疏遠","有距離","普通","親近","很親"]; // 由低到高(4.1.5，A12)

  if(c.romanceStatus==="married"){

  if(c.romanceStatus==="breakup") return "貌合神離"; // 關係冷了但還沒結束，不算結束一段關係

  if(isFamilyCharacter(c)) return FAMILY_RELATION_LABELS[relationshipTierIndex(c)];

// ========== 四、4.6 關係面板與角色狀態（2026-09-29）==========
// 四種狀態：一般／漸行漸遠(12回合沒互動，非家人)／已故／失聯。狀態一律由程式改，AI只回報事件(contact_lost)
// 漸行漸遠、失聯期間好感不變動(4.6.3)，所以「疏遠前／失聯前的關係等級」直接用現在的好感度算
function characterState(c){
  if(!c) return "normal";
  if(c.deceased) return "deceased";
  if(c.lost) return "lost";
  if(!c.active && !isFamilyCharacter(c)) return "fading"; // 家人不進漸行漸遠(4.1.5／4.6.2)
  return "normal";
}
const CHARACTER_STATE_LABELS = { fading:"漸行漸遠", deceased:"已故", lost:"失聯" };
// 4.6.1：一般與漸行漸遠混合依好感排序(同分最近互動在前)，已故、失聯固定排最後(已故在前)，組內依好感
function sortedRosterCharacters(s){
  const rank = c=>({ deceased:1, lost:2 }[characterState(c)] || 0);
  return (s.characters||[]).slice().sort((a,b)=>rank(a)-rank(b) || (b.affinity||0)-(a.affinity||0) || (b.lastTurn||0)-(a.lastTurn||0));
}
// 4.6.6：找回失聯者的成功率。家人一律50%；朋友依失聯前等級：普通朋友以下50%／熟悉的朋友65%／多年好友80%
function lostContactFindProb(c){
  if(isFamilyCharacter(c)) return 0.5;
  const tier = relationshipTierIndex(c);
  return tier>=4 ? 0.8 : tier===3 ? 0.65 : 0.5;
}
// 4.6.4：重逢的敘事氣氛依疏遠前的關係等級(熟悉的朋友以上一見如故，以下寫出時間的距離感)
function reunionTone(c){ return relationshipTierIndex(c)>=3 ? "一見如故" : "生疏"; }
// 角色重新有互動(找到、出場、角色更新)：漸行漸遠→一般，記下重逢給下一次提示用；已故、失聯不經過這裡
function markCharacterInteracted(s, c){
  if(!c || c.deceased || c.lost) return false;
  const wasFading = characterState(c)==="fading";
  c.active = true; c.lastTurn = s.turnCount;
  return wasFading;
}
// 4.6.6：旁白回報劇情明確斷聯。名字要在名冊上、不能是已故
function applyContactLost(s, names){
  const out = [];
  (Array.isArray(names) ? names : []).forEach(n=>{
    const c = (s.characters||[]).find(x=>x.name===String(n||"").trim());
    if(!c || c.deceased || c.lost || c.isChild) return;
    c.lost = true; c.active = false; c.lostTurn = s.turnCount;
    shelvePlotLinesForFadedCharacter(s, c.name);
    // 比照4.4：曖昧中／交往中的對象斷了聯絡，視為分手(已婚對象不在這裡處理，婚姻狀態由七、7.6離婚流程決定)
    if(c.romanceStatus==="ambiguous" || c.romanceStatus==="dating" || c.romanceStatus==="stable"){ c.romanceStatus = "breakup"; c.breakupSinceTurn = s.turnCount; }
    if(s.seekTarget===c.name) s.seekTarget = null;
    out.push(c.name);
  });
  return out;
}
// 4.6.8 滑到動態：每10回合最多1位(不在本回合場景、已有近況、一般或漸行漸遠)，優先好感最高；用了不算互動
const SOCIAL_FEED_INTERVAL = 10;
function pickSocialFeed(s, excludeNames){
  if(s.lastFeedTurn!=null && s.turnCount - s.lastFeedTurn < SOCIAL_FEED_INTERVAL) return null;
  const ex = new Set((excludeNames||[]).filter(Boolean));
  // 四、4.7.4：有已得知或尚未得知的背景事件也算「已有近況」；被選為動態素材時，未得知的事件在此揭曉
  const c = (s.characters||[]).filter(c=>(c.recentStatus || (c.events||[]).length) && !ex.has(c.name) && !c.isChild && ["normal","fading"].includes(characterState(c)) && !c.cohabiting)
    .sort((a,b)=>(b.affinity||0)-(a.affinity||0))[0];
  if(!c) return null;
  s.lastFeedTurn = s.turnCount;
  const fresh = unknownEventNames(c); revealCharacterEvents(c);
  const latest = (c.events||[]).filter(e=>e.known).slice(-1)[0];
  return { name: c.name, recent_status: c.recentStatus || undefined, event: fresh.length ? fresh[fresh.length-1] : (latest ? latest.name : undefined) };
}

// 依建卡順序排(不依好感)，內容只在建卡、狀態或近況改變時才變，讓Worker可以放在提示快取的位置
function rosterLine(s, c){
  const st = characterState(c);
  const rel = relationCategoryLabel(c) || c.relation || "";
  const intro = [npcAffiliation(s, c), (c.links||[]).map(l=>`${l.name}的${l.relation}`).join("、"), String(c.traits||"").split(/[；;，,。]/)[0]]
    .filter(Boolean).join("、").slice(0, 30);
  let status = st==="normal" ? "一般" : CHARACTER_STATE_LABELS[st];
  if(st==="fading") status += `（重逢時：${reunionTone(c)}）`;
  if(c.left_circle) status += "（已離開主角的日常生活圈）"; // 四、4.7.3【距】
  return [c.name, c.gender||"未記錄", rel, intro || "—", status].join("｜");
}
const ROSTER_MAX = 80;
function buildCharacterRoster(s){
  return (s.characters||[]).map(c=>rosterLine(s, c)).slice(0, ROSTER_MAX);
}
