const BG_LEVEL_TABLE = { // [日常, 轉折, 重大] 累積機率(其餘無事)
  studentYoung:[0.25,0.08,0.02], studentAdult:[0.175,0.075,0.025], adult:[0.35,0.15,0.05]
};
function bgDeathProb(age, student){
  const p = age>=81 ? 0.06 : age>=71 ? 0.03 : age>=61 ? 0.01 : 0;
  return student ? p/2 : p;
}
function bgTags(c){ return c.bgTags = c.bgTags || {}; }
function bgNeedOk(c, need){
  const t = c.bgTags||{}; const partner = !!(t.partnered||t.married);
  switch(need){
    case "": return true;
    case "noPartner": return !partner;
    case "hasPartner": return partner;
    case "dating": return !!t.partnered && !t.married; // 「分手」：未婚且有交往對象
    case "unmarried": return !t.married;
    case "noPartnerUnmarried": return !partner && !t.married;
    case "married": return !!t.married;
    case "hasChild": return !!t.hasChild;
    case "notRetired": return !t.retired;
  }
  return true;
}
function bgApplyFx(c, fx, name){
  const t = bgTags(c);
  if(name==="結婚") t.partnered = true;
  (fx.match(/[+-][a-zA-Z]+/g)||[]).forEach(f=>{ t[f.slice(1)] = f[0]==="+"; if(f[0]==="-") delete t[f.slice(1)]; });
}
function bgCharacterText(c){ return [c.relation, c.affiliation, c.traits].filter(Boolean).join(" "); }
function bgRelMult(c, e){
  if(!e.rel.length) return 1;
  const text = bgCharacterText(c);
  return e.rel.some(k=>(BG_REL_SYNONYMS[k]||[k]).some(w=>text.includes(w))) ? 1.5 : 1;
}
// 與主角有伴侶／同住關係的人(配偶、前配偶、同住者)不擲事件：事件表描述的是「一般朋友同學」的生活，配偶的狀態由婚姻系統管
function bgRollable(c){
  if(c.deceased || isFamilyCharacter(c) || c.isChild || c.cohabiting) return false;
  if(["married","divorced","widowed"].includes(c.romanceStatus)) return false;
  const age = typeof c.age==="number" ? c.age : null;
  return (age==null ? true : age>=13);
}
function bgEventPool(s, c, band, lv, excludeFeel){
  return BG_EVENTS.filter(e=>e.band===band && e.lv===lv && bgNeedOk(c, e.need) && !(excludeFeel && e.tags.includes("感")));
}
function rollBackgroundEventForCharacter(s, c, mode, label){
  const age = typeof c.age==="number" ? c.age : s.age;
  const student = mode==="student";
  // 過世另外擲骰(不走等級表)；擲中後狀態改為已故，不再擲事件
  if(Math.random() < bgDeathProb(age, student)){
    c.deceased = true; c.active = false; c.bgDied = true;
    pushBgEvent(c, { name:"過世", lv:"重大", label, turn:s.turnCount });
    return "過世";
  }
  const probs = student ? (age<=22 ? BG_LEVEL_TABLE.studentYoung : BG_LEVEL_TABLE.studentAdult) : BG_LEVEL_TABLE.adult;
  const r = Math.random();
  const lv = r<probs[0] ? "日常" : r<probs[0]+probs[1] ? "轉折" : r<probs[0]+probs[1]+probs[2] ? "重大" : null;
  if(!lv) return null;
  const band = (BG_EVENT_BANDS.find(b=>age>=b.min && age<=b.max)||{}).key;
  if(!band) return null;
  const inRelationship = ["ambiguous","dating","stable"].includes(c.romanceStatus); // 主角正在交往的對象不抽感情類
  const pool = bgEventPool(s, c, band, lv, inRelationship);
  if(!pool.length) return null;
  const weights = pool.map(e=>e.w*bgRelMult(c, e));
  let x = Math.random()*weights.reduce((a,b)=>a+b,0), pick = pool[pool.length-1];
  for(let i=0;i<pool.length;i++){ x -= weights[i]; if(x<=0){ pick = pool[i]; break; } }
  bgApplyFx(c, pick.fx, pick.name);
  if(pick.tags.includes("距")) c.left_circle = true; // 旁白不可讓他出現在主角的日常場景，主角主動去找時除外
  pushBgEvent(c, { name:pick.name, lv:pick.lv, label, turn:s.turnCount });
  return pick.name;
}
const BG_EVENTS_KEEP = 30;
function pushBgEvent(c, ev){
  c.events = c.events || [];
  c.events.push({ name:ev.name, lv:ev.lv, label:ev.label, turn:ev.turn, known:false });
  while(c.events.length>BG_EVENTS_KEEP){ const i = c.events.findIndex(e=>e.known); c.events.splice(i>=0?i:0, 1); }
}
const BG_INVITE_TEXT = { 結婚:n=>`去參加${n}的婚禮`, 作品入選展覽或競賽得獎:n=>`去看${n}的作品展出`, 開店:n=>`去${n}新開的店捧場`, 辦同學會:n=>`去${n}辦的同學會`, 父母過世:n=>`去${n}父母的告別式，陪陪${n}` };
function bgLabelNow(s){
  const mode = s.timeState.stageMode;
  if(mode==="highschool" || mode==="college"){
    const idx = s.timeState.segmentIndex % YEAR_SEGMENTS.length;
    const yr = mode==="highschool" ? ["高一","高二","高三"][clamp(s.timeState.yearInStage,1,3)-1] : collegeYearLabel(s);
    return yr + (idx<SEMESTER_PHASES.length ? "寒假" : "暑假");
  }
  return `${s.age}歲`;
}
// takeTurn呼叫：判斷這回合該不該擲。回傳是否有擲
function maybeRollBackgroundEvents(s, adv){
  if(s.idleMode || s.timeState.prologue) return false;
  let mode = null;
  if(isStudentPhase(s)){ // 2026-10-04：重心延續到出社會後，這裡仍只看學生時期(學期背景事件)
    if(adv && adv.holiday && (s.turnCount - (s.bgLastRollTurn ?? -99)) >= 12) mode = "student"; // 一個假期最長8回合，兩個假期相隔至少19回合
  } else if(adv && adv.window){
    const y = calAbsToDate(adv.window.start).y;
    if(s.bgYear==null) s.bgYear = y;
    else if(y > s.bgYear){ s.bgYear = y; mode = "adult"; }
  }
  if(!mode) return false;
  s.bgLastRollTurn = s.turnCount;
  runBackgroundEvents(s, mode);
  return true;
}
function runBackgroundEvents(s, mode){
  const label = bgLabelNow(s);
  s.newsQueue = s.newsQueue || []; s.pendingInvites = s.pendingInvites || [];
  const done = [];
  (s.characters||[]).slice().forEach(c=>{
    if(!bgRollable(c)) return;
    const name = rollBackgroundEventForCharacter(s, c, mode, label);
    if(!name) return;
    done.push({ who:c.name, name });
    const ev = c.events[c.events.length-1];
    const close = (c.affinity||0)>=60 && !c.lost; // 熟悉的朋友以上(4.1.1)
    if(ev.lv!=="日常" && close) s.newsQueue.push({ who:c.name, name });
    const def = BG_EVENT_BY_NAME[name];
    if(def && def.tags.includes("邀") && !c.lost && !c.deceased) s.pendingInvites.push({ who:c.name, name });
    if(name==="過世" && !close) { /* 已故者在通訊錄立刻顯示，事件等被提起時揭曉 */ }
  });
  s.newsQueue = s.newsQueue.slice(-12); s.pendingInvites = s.pendingInvites.slice(-6);
  return done;
}
function revealCharacterEvents(c){
  const out = [];
  (c.events||[]).forEach(e=>{ if(!e.known){ e.known = true; out.push(e.name); } });
  return out;
}
function unknownEventNames(c){ return (c.events||[]).filter(e=>!e.known).map(e=>e.name); }
// 一回合最多帶一件熟悉朋友的消息，其餘依序排到後面的回合
function takeFriendNews(s){
  while((s.newsQueue||[]).length){
    const n = s.newsQueue.shift();
    const c = (s.characters||[]).find(x=>x.name===n.who);
    if(!c || c.lost) continue;
    const ev = (c.events||[]).find(e=>!e.known && e.name===n.name);
    if(!ev) continue;
    ev.known = true;
    return { name:c.name, event:ev.name, when:ev.label };
  }
  return null;
}
// 【邀】類事件：下一回合的選項中加入一個相關選項(只出現這一回合)，選項出現時即標為已得知
function takeInviteChoice(s){
  while((s.pendingInvites||[]).length){
    const inv = s.pendingInvites.shift();
    const c = (s.characters||[]).find(x=>x.name===inv.who);
    if(!c || c.lost) continue;
    const ev = (c.events||[]).find(e=>e.name===inv.name);
    if(ev) ev.known = true;
    const f = BG_INVITE_TEXT[inv.name];
    return f ? f(c.name) : `去找${c.name}聊聊近況`;
  }
  return null;
}

// ========== 一、1.2.11 敘事尺度(親密關係)／四、4.1.4 年齡欄位（2026-09-28定案）==========
const ROMANCE_MIN_AGE = 12;          // 1.2.11.3.2：兩人皆須滿12歲才能進入戀愛狀態
const MINOR_ROMANCE_MAX_AGE_GAP = 2; // 1.2.11.3.2：兩人皆未成年時年齡差不得超過2歲
const ROMANCE_ACTIVE_STATUSES = ["ambiguous","dating","stable","married"]; // 1.2.11.4「曖昧中以上」(同居是stable＋cohabiting)
// 4.1.4：程式能推算的年齡由程式給值——同學＝主角同齡、學長姐＋1～2、學弟妹−1～2；其餘由AI建卡時回報整數年齡，寫入後固定
function inferNpcAgeFromRelation(s, relation){
  const r = String(relation||"");
  if(/學長|學姊|學姐/.test(r)) return s.age + rnd(1,2);
  if(/學弟|學妹/.test(r)) return Math.max(0, s.age - rnd(1,2));
  if(/同學|同班/.test(r)) return s.age;
  return null;
}
function resolveNewCharacterAge(s, nc){
  const inferred = inferNpcAgeFromRelation(s, nc.relation);
  if(inferred!==null) return inferred;
  const n = Math.round(Number(nc.age));
  return Number.isFinite(n) && n>=0 && n<=120 ? n : null; // AI沒給或不合法：先空著，下次登場由age_fill補(補之前不能進入戀愛狀態)
}
// 1.2.11.7：依角色年齡算三個旗標；沒有年齡回傳null。生日跨線延續中(began_as_minors且一方已成年)視為any_minor、不算age_gap_cross
function romanceAgeFlags(s, c){
  if(!c || typeof c.age!=="number" || typeof s.age!=="number") return null;
  const pAdult = s.age>=18, nAdult = c.age>=18;
  const both_adult = pAdult && nAdult;
  let any_minor = !both_adult, age_gap_cross = pAdult!==nAdult;
  const continuing = !!c.beganAsMinors && age_gap_cross;
  if(continuing){ any_minor = true; age_gap_cross = false; }
  return { both_adult, any_minor, age_gap_cross, began_as_minors: !!c.beganAsMinors, continuing };
}
// 1.2.11.7 romantic_signal驗證：不符合條件的訊號一律不處理，關係階段不變(npc_id＝character_updates這一筆的角色姓名)
function romanceSignalAllowed(s, c){
  const f = romanceAgeFlags(s, c);
  if(!f) return false;                                     // 沒有年齡資料
  if(f.age_gap_cross) return false;                        // 一方成年一方未成年(且不是未成年時開始、延續中的關係)
  if(s.age < ROMANCE_MIN_AGE || c.age < ROMANCE_MIN_AGE) return false;
  if(s.age<18 && c.age<18 && Math.abs(s.age-c.age) > MINOR_ROMANCE_MAX_AGE_GAP) return false;
  return true;
}
// 1.2.11.3.2：同居與結婚須兩人皆滿18歲(含生日跨線延續期間也不行)
function romanceBothAdult(s, c){ const f = romanceAgeFlags(s, c); return !!(f && f.both_adult); }
// 1.2.11.7：每回合送給AI——所有曖昧以上的NPC各自的旗標
function buildRomanceFlags(s){
  return (s.characters||[]).filter(c=>!c.deceased && ROMANCE_ACTIVE_STATUSES.includes(c.romanceStatus)).map(c=>{
    const f = romanceAgeFlags(s, c);
    return f ? { npc_id:c.name, both_adult:f.both_adult, any_minor:f.any_minor, age_gap_cross:f.age_gap_cross, began_as_minors:f.began_as_minors }
             : { npc_id:c.name, both_adult:false, any_minor:true, age_gap_cross:false, began_as_minors:false, age_unknown:true };
  });
}
// 1.2.11.7既有存檔：能從紀錄推算出關係開始時兩人皆未成年(現在兩人都還未成年)就補true，推算不出來一律false
function ensureRomanceAgeMarks(s){
  (s.characters||[]).forEach(c=>{
    if(c.beganAsMinors!==undefined || !ROMANCE_ACTIVE_STATUSES.includes(c.romanceStatus)) return;
    c.beganAsMinors = typeof c.age==="number" && s.age<18 && c.age<18;
  });
}
function applyRomanceSignal(s, c, signal){
  if(!signal || !c) return;
  if(!romanceSignalAllowed(s, c)) return; // 一、1.2.11.7（2026-09-28）
  c.romanceProgress = c.romanceProgress||0;
  c.romanceStableStreak = c.romanceStableStreak||0;
  c.romanceNegativeStreak = c.romanceNegativeStreak||0;
  const prevStatus = c.romanceStatus||null;
  if(signal==="positive"){
    c.romanceProgress += 1;
    c.romanceNegativeStreak = 0;
    if(!c.romanceStatus && c.romanceProgress>=ROMANCE_AMBIGUOUS_PROGRESS){
      c.romanceStatus = "ambiguous";
      c.beganAsMinors = s.age<18 && c.age<18; // 1.2.11.7：進入曖昧的那一刻寫入，之後不再變動
    } else if(c.romanceStatus==="ambiguous"){
      // 四、4.8（2026-09-30，取代「累積正向次數達門檻直接進入交往中」）：交往必須有告白場面＋玩家點頭，由confession_from_npc／confession_from_player走startDating()，訊號只累積不成立
    } else if(c.romanceStatus==="dating"){
      c.romanceStableStreak += 1;
      if(c.romanceStableStreak>=ROMANCE_STABLE_STREAK){
        c.romanceStatus = "stable";
        c.stableSinceTurn = s.turnCount; // 七、7.6.1.1（2026-09-22新增）：記錄進入穩定交往的回合數，供同居觸發入口判斷「持續≥8回合」
      }
    }
  } else if(signal==="negative"){
    c.romanceProgress = Math.max(0, c.romanceProgress-1);
    c.romanceStableStreak = 0;
    if(c.romanceStatus==="ambiguous"){
      c.romanceNegativeStreak += 1; // 四、4.8：進入曖昧中之後累積2次負面感情訊號則解除
      if(c.romanceNegativeStreak>=ROMANCE_AMBIGUOUS_UNDO_NEGATIVE){ c.romanceStatus = null; c.romanceProgress = 0; c.romanceNegativeStreak = 0; }
    } else if(c.romanceStatus==="dating" || c.romanceStatus==="stable"){
      c.romanceNegativeStreak += 1;
      // 四、4.8（取代「連續負向次數達門檻直接判分手」）：NPC主動提分手的前提二選一——好感低於交往門檻、或人物卡有「裂痕」標記；成立時排入下一回合的分手場面，狀態在場面那一回合結束才改
      if(c.romanceNegativeStreak>=ROMANCE_BREAKUP_STREAK && ((c.affinity||0) < ROMANCE_BREAKUP_AFFINITY || c.rift) && !s.pendingBreakup){
        s.pendingBreakup = { name:c.name, by:"npc" };
        c.romanceNegativeStreak = 0;
      }
    }
  }
  // 4.4定案：first_romance里程碑改由客戶端在第一次進入「交往中」時自動判定，取代AI自由回報（9/16使用者確認）
  if(prevStatus!=="dating" && c.romanceStatus==="dating" &&
     s.milestones.first_romance!=="completed" && s.milestones.first_romance!=="skipped"){
    s.milestones.first_romance = "completed";
  }
}
// ===== 四、4.8（2026-09-30）關係里程碑：場面＋玩家點頭 =====
function characterByName(s, name){ return (s.characters||[]).find(c=>c.name===String(name||"").trim()) || null; }
function currentMonthMid(s){
  const cal = s.timeState && s.timeState.cal;
  if(!cal || cal.lastRoundEnd==null) return null;
  const a = cal.lastWinStart!=null ? cal.lastWinStart : cal.lastRoundEnd;
  return Math.floor((a + cal.lastRoundEnd)/2);
}
// 成立交往：記錄開始的月份(每回合提示「你們從○月開始交往」，防止重演)、第一次戀愛里程碑
function startDating(s, c){
  if(c.beganAsMinors===undefined) c.beganAsMinors = s.age<18 && (typeof c.age==="number" ? c.age<18 : false);
  c.romanceStatus = "dating"; c.romanceStableStreak = 0; c.romanceNegativeStreak = 0;
  c.romanceProgress = Math.max(c.romanceProgress||0, ROMANCE_DATING_PROGRESS);
  c.datingSinceAbs = currentMonthMid(s); c.datingSinceTurn = s.turnCount;
  c.rift = false;
  if(s.milestones.first_romance!=="completed" && s.milestones.first_romance!=="skipped") s.milestones.first_romance = "completed";
}
const CONFESSION_RE = {
  accept: /答應|願意(和|跟)|我們在一起|交往吧|做你的(男|女)朋友|當你的(男|女)朋友/,
  no: /不答應|不願意|拒絕|不確定|不要|對不起|只當朋友|不行/
};
// 回應對方告白：點選項比對三個回應選項的原文；自由輸入用關鍵字判斷(不確定、拒絕優先於答應)
function classifyConfessionResponse(text, pend){
  const t = String(text||"");
  const ch = pend.choices || {};
  if(ch.accept && t===ch.accept) return "accept";
  if(ch.unsure && t===ch.unsure) return "unsure";
  if(ch.reject && t===ch.reject) return "reject";
  if(/還不確定|不確定|讓我想想|需要時間/.test(t)) return "unsure";
  if(/拒絕|不答應|不願意|對不起|只當朋友|不行/.test(t)) return "reject";
  if(CONFESSION_RE.accept.test(t)) return "accept";
  return "other";
}
// 呼叫AI之前：結算上一回合的告白(回應／擲骰結果)、玩家提分手、排定的分手場面，回傳這回合要寫的「關係場面」
function prepareRelationScene(s, actionText){
  let scene = null;
  const pend = s.pendingConfession;
  if(pend){
    s.pendingConfession = null;
    const c = characterByName(s, pend.name);
    if(c && !c.deceased && !c.lost){
      const kind = classifyConfessionResponse(actionText, pend);
      if(kind==="accept"){ startDating(s, c); scene = { mode:"started_dating", name:c.name, by:"對方告白，玩家答應" }; }
      else if(kind==="reject"){ c.romanceStatus = null; c.romanceProgress = 0; c.romanceStableStreak = 0; c.romanceNegativeStreak = 0; scene = { mode:"confession_rejected", name:c.name }; }
      else scene = { mode:"confession_unsure", name:c.name };
    }
  } else if(s.confessionResultNext){
    const res = s.confessionResultNext; s.confessionResultNext = null;
    const c = characterByName(s, res.name);
    if(c && !c.deceased && !c.lost){
      if(res.success){ startDating(s, c); scene = { mode:"started_dating", name:c.name, by:"玩家告白，對方答應" }; }
      else scene = { mode:"player_confession_declined", name:c.name };
    }
  }
  if(!scene && !s.pendingBreakup && /分手/.test(actionText||"")){ // 玩家自己提分手：這一回合就寫分手場面
    const partners = (s.characters||[]).filter(c=>!c.deceased && !c.lost && (c.romanceStatus==="dating" || c.romanceStatus==="stable"));
    const named = partners.filter(c=>String(actionText).includes(c.name));
    const target = named.length===1 ? named[0] : (partners.length===1 ? partners[0] : null);
    if(target) s.pendingBreakup = { name:target.name, by:"player" };
  }
  // 貌合神離(淡出、失聯造成)維持一段時間還沒挽回：程式排一個「正式收掉」的分手場面，狀態不會因為一直失聯就默默改成分手
  if(!scene && !s.pendingBreakup){
    const cooled = (s.characters||[]).find(c=>c.romanceStatus==="breakup" && !c.deceased && (c.breakupSinceTurn==null ? (c.breakupSinceTurn = s.turnCount, false) : s.turnCount - c.breakupSinceTurn >= BREAKUP_SCENE_AFTER_TURNS));
    if(cooled) s.pendingBreakup = { name:cooled.name, by:"fade", lost: !!cooled.lost };
  }
  if(!scene && s.pendingBreakup){
    const c = characterByName(s, s.pendingBreakup.name);
    if(c && (c.romanceStatus==="dating" || c.romanceStatus==="stable" || c.romanceStatus==="breakup")){
      const by = s.pendingBreakup.by;
      scene = { mode:"breakup", name:c.name, by: by==="player" ? "玩家提出" : by==="fade" ? "兩人的關係早就冷掉了，這次把它正式收掉，要有明確的場面（例如一通電話、一則訊息、當面說開），不能只是不了了之" : "對方提出" };

function unknownNameCharacters(s){ return (s.characters||[]).filter(c=>c.nameKnown===false && !c.deceased); }
function sanitizeChoiceNames(s, choices){
  const unk = unknownNameCharacters(s);
  if(!unk.length) return choices;
  return (choices||[]).map(t=>{

    unk.forEach(c=>{

        out = out.split(c.name).join(c.gender==="男" ? "那個男生" : c.gender==="女" ? "那個女生" : "那個人");

function enforceConfessionChoices(s, choices){
  const pend = s.pendingConfession;
  if(!pend || pend.turn!==s.turnCount) return choices;
  const n = pend.name;
  const defs = [
    ["accept", /答應|願意|我也喜歡|在一起/, `答應${n}，和${n}在一起`],
    ["unsure", /還不確定|不確定|想想|需要時間/, `告訴${n}自己還不確定`],
    ["reject", /拒絕|對不起|只當朋友|不能答應/, `拒絕${n}的心意`]
  ];
  let list = (choices||[]).slice(0,4);
  const chosen = {};
  const used = new Set();
  defs.forEach(([k, re])=>{ const i = list.findIndex((t,idx)=>!used.has(idx) && re.test(t)); if(i>=0){ chosen[k] = list[i]; used.add(i); } });
  const missing = defs.filter(([k])=>!chosen[k]);
  const keep = list.filter((t,idx)=>used.has(idx));
  const others = list.filter((t,idx)=>!used.has(idx)).slice(0, Math.max(0, 4 - keep.length - missing.length));
  missing.forEach(([k,,txt])=>{ chosen[k] = txt; });
  pend.choices = chosen;
  return keep.concat(missing.map(([k])=>chosen[k])).concat(others);
}

const COHABITATION_STABLE_TURNS = 8; // 【測試參數,待驗證】穩定交往持續回合數門檻

function detectCohabitationIntent(actionText){
  return /同居|搬去一起住|一起租房|搬過去一起住|住在一起/.test(actionText||"");
}
// 被動觸發條件全部成立：與某NPC穩定交往≥8回合、已搬出原生家庭且住租屋/自有房、沒有配偶、沒有其他同居對象；
// 主動觸發：偵測到同居意圖關鍵字時，條件符合就立即排入彈窗，比照detectJobChangeIntent()既有模式
function checkCohabitationOffer(s, actionText){
  if(s.pendingCohabitationOffer || s.turnCount < (s.cohabitationOfferCooldownUntilTurn||0)) return;
  if(s.characters.some(c=>c.romanceStatus==="married")) return; // 已有配偶
  if(s.characters.some(c=>c.cohabiting && c.romanceStatus==="stable")) return; // 已有其他同居對象
  if(s.milestones.moved_out!=="completed") return; // 還住在原生家庭，不出現這個彈窗
  if(!s.housing || (s.housing.type!=="rent" && s.housing.type!=="own")) return;
  const partner = s.characters.find(c=>c.romanceStatus==="stable" && !c.cohabiting && romanceBothAdult(s, c)); // 1.2.11.3.2：同居須兩人皆滿18歲
  if(!partner) return;
  const durationOk = (s.turnCount - (partner.stableSinceTurn ?? s.turnCount)) >= COHABITATION_STABLE_TURNS;
  if(detectCohabitationIntent(actionText) || durationOk){
    s.pendingCohabitationOffer = { partnerName: partner.name };
  }
}
// choice: "move_in"/"stay_separate"；此彈窗是玩家選擇，不涉及機率判定，不列入十一、11.4明牌檢定白名單
function resolveCohabitationOffer(s, partnerName, choice){
  if(choice==="move_in"){
    const partner = s.characters.find(c=>c.name===partnerName);

}

// ========== 十三、健康衰退、疾病與老年階段（2026-09-20新增） ==========
// 13.2【定案,測試參數】健康年齡上限：健康現值不因年齡直接扣分，而是受這個天花板限制
const HEALTH_CAP_TABLE = [
  { maxAge:49, cap:100 }, { maxAge:59, cap:95 }, { maxAge:69, cap:88 },
  { maxAge:79, cap:78 }, { maxAge:89, cap:65 }, { maxAge:9999, cap:50 }

function baseHealthCapForAge(age){

}
const HEALTH_CAP_BONUS_STREAK_TRIGGER = 8; // 【測試參數,待驗證,13.2】長期健康經營行為連續N年，供cap上修+5用，年數本身非文件明文規定
// 【測試參數,待驗證,13.2，2026-09-27使用者指示先用測試參數】一年中「健康經營回合」佔該年回合數的比例達此值，才算一個健康經營年。
// 健康經營回合＝AI回報的健康增量>0（沿用3.5.1加分來源的訊號，與13.3.3慢性病控制良好同一個判斷）；用比例而非固定次數，因各年齡帶每年回合數不同(32→5)
const HEALTH_CAP_BONUS_YEAR_RATIO = 0.25;
// 每滿一年呼叫一次：結算這一年是否算健康經營年，連續達HEALTH_CAP_BONUS_STREAK_TRIGGER年即永久取得cap+5
function settleHealthyYear(s){
  const turns = s.turnsThisYearForHealth||0;
  const healthy = s.healthyTurnsThisYear||0;
  s.healthyYearStreak = (turns>0 && healthy/turns>=HEALTH_CAP_BONUS_YEAR_RATIO) ? (s.healthyYearStreak||0)+1 : 0;
  if(s.healthyYearStreak>=HEALTH_CAP_BONUS_STREAK_TRIGGER) s.healthCapBonusEarned = true;
  s.turnsThisYearForHealth = 0; s.healthyTurnsThisYear = 0;
}
function computeHealthCap(s){
  // 13.2【定案】玩家能動性：長期健康經營行為可讓cap上修+5；慢性病每項cap-5；重大疾病康復後cap永久-5
  let cap = baseHealthCapForAge(s.age);

}
// 13.2【定案】收斂方式：健康現值高於cap時，每滿一歲收斂一次，收斂量為(現值−cap)×0.5，與回合預算解耦(比照7.1.5同一設計精神)

  if(s.stats.health > cap){
    s.stats.health = clamp(s.stats.health - (s.stats.health-cap)*HEALTH_CAP_CONVERGENCE_RATE, 0, 100);

function riskyHobbyActive(s){ return (s.riskyHobbyScore||0) >= RISKY_HOBBY_ACTIVE_SCORE; }
function riskyAnnualBonus(s){

function deathAgeBaseProbability(age){

}
// 十三、13.2.2（2026-09-20拍板）：原公式的50其實是health_cap÷2(當時health_cap恆為100)，把隱含假設攤開後推廣為查表值，
// cap=100時與原公式完全等價，不是行為改變。7.1.5已結案的年齡基礎機率表與校準結果不需要重新做N=200,000網格搜尋

// 每年一次判定（在advanceStructuredTime的career分支、年份真的跳動時呼叫）：
// roll成功且尚未有前兆→這年先埋前兆(呼應7.1.2前兆機制，不能無預兆死亡)；roll成功且已有前兆→這年觸發死亡結局
function rollAnnualDeathCheck(s){
  if(s.age<DEATH_MIN_AGE) return { justForeshadowed:false, deathTriggered:false };
  if(s.idleMode) return { justForeshadowed:false, deathTriggered:false }; // 10.6.7【定案】放置期間不判定死亡
  const hit = Math.random() < computeDeathProbability(s);
  if(!hit) return { justForeshadowed:false, deathTriggered:false };
  if(!s.deathForeshadowed){
    s.deathForeshadowed = true;
    return { justForeshadowed:true, deathTriggered:false };

      parent.affinity = clamp(parent.affinity + rnd(3,6), 0, 100);

      completeMilestone(s, "became_caregiver"); // 4.3.1（2026-09-27）
      startCaregiving(s, parentName); // 13.5.2（2026-09-27）：工時與照顧負荷連動；10.6.9放置時「顧家」也讀這個狀態
    } else if(choice==="split"){

      const sibling = s.characters.find(c=>c.origin==="手足，從出生起" && !c.deceased) || s.characters.find(c=>/^哥哥$|^弟弟$|^姊姊$|^妹妹$/.test(c.relation||""));

  }
  s.pendingEldercareDecision = null;

  while(s.eldercareQueue && s.eldercareQueue.length && !s.pendingEldercareDecision){

  s.eldercareEventLog = { parentName, choice, stage: parent ? parent.healthStage : null, sibling_tone: siblingTone,
    custom_text: choice==="custom" ? String(customText||"").slice(0, CUSTOM_INPUT_MAX_CHARS) : undefined };
}

function queueEldercareDecision(s, c){

const FAMILY_HOME_OWN_PROB = { 清寒:0.2, 小康:0.6, 富裕:0.95 };
const FAMILY_HOME_VALUE_MONTHS = 120;
function ensureFamilyHome(s){
  if(s.familyHomeValue!==undefined) return;
  const owns = Math.random() < (FAMILY_HOME_OWN_PROB[s.family] ?? 0.6);

function settleFamilyHomeInheritance(s){
  ensureFamilyHome(s);
  if(!s.familyHomeValue || s.familyHomeInherited) return 0;
  const livingParents = (s.characters||[]).filter(c=>(c.origin==="父母，從出生起" || c.origin==="隔代教養，從出生起") && !c.deceased && !/不同住/.test(c.relation||""));
  if(livingParents.length) return 0;

  s.chronicle.push(`（${s.age}歲）${parent.relation}過世了`);

  // 由AI寫成敘事，不另外改數值
  const siblings = s.characters.filter(c=>c.origin==="手足，從出生起" && !c.deceased)

  // （不超過失能長照），進入需要協助/失能時照常跳照顧決策彈窗

  const otherParent = s.characters.find(c=>c.name!==parentName && (c.origin==="父母，從出生起" || c.origin==="隔代教養，從出生起") && !c.deceased && !c.lost && !/不同住/.test(c.relation||""));

function rollSpouseAnnualDeath(s){
  if(s.idleMode) return null; // 10.6.7【定案】放置期間家人過世比照死亡排除
  const spouse = (s.characters||[]).find(c=>c.romanceStatus==="married" && !c.deceased);

  if(typeof spouse.age!=="number") spouse.age = s.age;
  if(spouse.age < DEATH_MIN_AGE) return null;
  if(Math.random() >= deathAgeBaseProbability(spouse.age)) return null;
  spouse.deceased = true; spouse.active = false; spouse.romanceStatus = "widowed";
  releaseCohabiting(spouse);
  s.spouseIncome = 0; s.spouseOccupationCategory = null;

  s.spouseDeathEventLog = { spouseName: spouse.name };
  s.pendingRelationshipHints = (s.pendingRelationshipHints||[]).concat([{ tier:1, text:`${spouse.name}走了` }]);

function rollAnnualHealthChecks(s){

  settleHealthyYear(s); // 13.2（2026-09-27）：先結算上一年的健康經營，再做cap收斂

  if(illness) s.illnessEventLog = illness;

// 2026-09-24：①tension為low時取該級距下限(1.2.8.4.3定案)；②字數含行動結果＋新場景兩部分，行動結果約占1/4-1/3(1.2.9.11.3)
const RESPONSE_WORDS_MIN = 200, RESPONSE_WORDS_MAX = 350; // 十八、18.10.2【測試參數，暫定，待使用者確認】
function narrativeLengthTier(monthsCrossed, tension, focusExtra){

  else g = { tier:"long", min:500, max:700, structure:"新場景用完整三段結構：核心場景＋次要片段0-2個(各1-3句)＋轉場句1-2句" };

  const base = tension==="low" ? g.min : Math.round((g.min+g.max)/2);

// ===== 一、1.2.9.13（2026-09-24新增）角色卡同名衝突 =====
// 家人稱謂正規化：只看relation開頭(例如「父親（服刑中）」→父親、「前配偶」→配偶)，避免「同學的哥哥」這類非家人被誤判
const FAMILY_ROLE_PATTERNS = [
  ["父親",/^(父親|爸爸)/], ["母親",/^(母親|媽媽)/], ["繼父",/^繼父/], ["繼母",/^繼母/],
  ["哥哥",/^哥哥/], ["弟弟",/^弟弟/], ["姊姊",/^(姊姊|姐姐)/], ["妹妹",/^妹妹/],
  ["祖父",/^(爺爺|阿公|外公|祖父)/], ["祖母",/^(奶奶|阿嬤|外婆|祖母)/],
  ["兒子",/^兒子/], ["女兒",/^女兒/], ["配偶",/^(前)?(配偶|丈夫|妻子|老公|老婆)/]
];
const FAMILY_ROLE_GENDER = { 父親:"男", 繼父:"男", 哥哥:"男", 弟弟:"男", 祖父:"男", 兒子:"男", 母親:"女", 繼母:"女", 姊姊:"女", 妹妹:"女", 祖母:"女", 女兒:"女" };
function familyRoleOf(relation){
  const r = String(relation||"").trim();
  const hit = FAMILY_ROLE_PATTERNS.find(([,re])=>re.test(r));
  return hit ? hit[0] : null;
}
// 衝突判斷(1.2.9.13定案)：家人稱謂不同，或一方是家人、一方不是家人，才算衝突；非家人稱謂的差異視為同一人
function isCharacterNameConflict(existingRelation, newRelation){
  const a = familyRoleOf(existingRelation), b = familyRoleOf(newRelation);
  if(!a && !b) return false;
  return a!==b;
}
const RENAME_GIVEN_NAMES_MALE = ["冠宇","承翰","宥辰","子豪","柏宇","品睿","俊傑","宇軒","哲瑋","文彬"];
const RENAME_GIVEN_NAMES_FEMALE = ["品妍","宜蓁","思妤","芷晴","欣怡","語彤","佳穎","郁婷","宛瑜","筱涵"];
const RENAME_SURNAMES = ["陳","林","黃","張","李","王","吳","劉","蔡","楊","許","鄭","謝","郭","洪"];
function allUsedNames(s){
  const set = new Set((s.characters||[]).map(c=>c.name));
  if(s.name) set.add(s.name);
  return set;
}
// 改名方式(1.2.9.13定案)：新卡是家人→改名字、不加姓氏；新卡不是家人→加姓氏區分(原本已帶姓氏就換一個姓)
function renameForConflict(s, name, newRelation){
  const used = allUsedNames(s);
  const role = familyRoleOf(newRelation);
  if(role){
    const g = FAMILY_ROLE_GENDER[role];
    const pool = g==="男" ? RENAME_GIVEN_NAMES_MALE : g==="女" ? RENAME_GIVEN_NAMES_FEMALE : RENAME_GIVEN_NAMES_MALE.concat(RENAME_GIVEN_NAMES_FEMALE);
    const free = pool.filter(n=>!used.has(n));
    if(free.length) return pick(free);
    return name+"二"; // 防呆：名單用盡時的最後手段
  }
  const base = (name.length>=3 && RENAME_SURNAMES.includes(name[0])) ? name.slice(1) : name;
  const free = RENAME_SURNAMES.map(sn=>sn+base).filter(n=>n!==name && !used.has(n));
  return free.length ? pick(free) : base+"（二）";
}

// ===== 一、1.2.8.4.2（2026-09-24實作）NPC台詞長度上限 dialogue_style =====
const DIALOGUE_STYLE_LIMITS = { terse:2, normal:4, talkative:8 };

// AI以{{名字|台詞}}標記NPC台詞；程式依該角色dialogue_style截斷，顯示時換成「台詞」。

function truncateDialogueLine(line, limit){

  while((m = re.exec(line))){ ends.push({ idx:m.index+m[0].length, strong:/[。？！?!]/.test(m[0]) }); }
  // 最後一句沒有結尾標點時也算一句

function buildFocusItem(s, key, actionText){
  const adult = !isStudentPhase(s);
  if(key==="family" && !focusFamilyAvailable(s)) key = FOCUS_DEFAULT;
  if(key==="work" && adult && !adultWorkOptions(s).length) key = FOCUS_DEFAULT;
  const it = { key, label: key==="study" ? focusStudyLabel(s) : FOCUS_LABELS[key] };
  if(adult) it.adult = true;
  if(key==="interest"){
    const card = currentInterestChoice(s);
    it.interestCardId = card ? card.id : null;
    it.interestCategory = card ? card.category : null; // null＝嘗試新的，類別由AI判斷(8.10)
  }
  if(key==="family"){
    it.familyTargets = focusFamilyTargets(s, actionText).map(c=>c.name);
    const care = adult ? focusCareTarget(s) : null;
    if(care && it.familyTargets.length===1 && it.familyTargets[0]===care.name) it.careTitle = careTitle(care);
  }
  if(key==="work"){
    if(adult){
      const w = currentAdultWork(s);
      it.workKind = w.kind; it.workLabel = w.label;
      if(w.kind==="gig"){ it.gigCardId = w.card.id; it.gigCategory = w.card.category; }
    } else {
      const gig = currentWorkChoice(s);
      if(gig){ it.workKind = "gig"; it.gigCardId = gig.id; it.gigCategory = gig.category; }
      else it.workKind = "part";
    }
  }
  return it;
}
function resolveTurnFocus(s, actionText){
  if(!focusModeActive(s)) return null;
  syncFocusState(s);
  if(focusRankMode(s)){
    const items = s.focusRank.map((k,i)=>{
      const it = buildFocusItem(s, k, actionText);
      it.rank = i+1;
      // 收入類(打工、兼職)與副業不擲骰，依名次比例；其餘第1名一定發生、第2名60%、第3名30%
      if(it.key==="work" && (it.workKind==="part" || it.workKind==="gig")){
        it.occurred = true;
        it.ratio = (it.workKind==="gig" ? FOCUS_RANK_GIG : FOCUS_RANK_INCOME)[i];
      } else it.occurred = i===0 || Math.random() < FOCUS_RANK_OCCUR[i];
      return it;
    });
    return Object.assign({}, items[0], { ranked:true, items });
  }

}

  const wk = first && first.key==="work" ? first.workKind : null;
  if(s.careerStatus===CAREER_STATUS.EMPLOYED){ fr.level.n++; if(wk==="push") fr.level.push++; }
  if([CAREER_STATUS.JOB_SEARCHING, CAREER_STATUS.UNEMPLOYED, CAREER_STATUS.NOT_EMPLOYED].includes(s.careerStatus)){ fr.search.n++; if(wk==="search") fr.search.hit++; }

// 2.6.7.5：每年的年度結算扣一次健康(本業拚一點＋顧事業合併算比例)，結算時寫一行原因
function settleFocusYear(s){
  if(isStudentPhase(s)) return null;
  const fr = ensureFocusRatio(s);
  const t = focusRatioTier(fr.year.push + fr.year.biz, fr.year.n);
  fr.year = { n:0, push:0, biz:0 };
  if(t<0) return null;
  const cost = FOCUS_HUSTLE_HEALTH[t];
  s.stats.health = clamp(s.stats.health - cost, 0, 100);
  s.focusYearNote = t===0 ? `這一年工作拚得比較兇，身體有點吃不消（健康−${cost}）` : `這一年工作偶爾多扛了一些，身體有點累（健康−${cost}）`;
  return cost;
}

// 累計社交回合數，每滿3次擲一次「朋友帶來的機會」(20%＋人脈每10點+5%，上限60%)，擲中後下一回合提示指示旁白安排
const SOCIAL_TURN_AFFINITY = 2, FRIEND_OPP_EVERY = 3, FRIEND_OPP_BASE = 0.2, FRIEND_OPP_PER_10 = 0.05, FRIEND_OPP_MAX = 0.6; // 【測試參數】
function friendOpportunityProb(s){ return Math.min(FRIEND_OPP_MAX, FRIEND_OPP_BASE + Math.floor((s.stats.network||0)/10)*FRIEND_OPP_PER_10); }
function applySocialTurnExtras(s, r, out){
  const names = (r && Array.isArray(r.scene_characters)) ? r.scene_characters.map(String) : [];
  const pool = names.map(n=>s.characters.find(c=>c.name===n)).filter(c=>c && !c.deceased && !c.lost && !isFamilyCharacter(c));
  if(pool.length){
    const c = pool[Math.floor(Math.random()*pool.length)];
    c.affinity = clamp(c.affinity + SOCIAL_TURN_AFFINITY, 0, 100);
    out.socialFriend = c.name;
  }
  s.socialTurns = (s.socialTurns||0) + 1;
  if(s.socialTurns >= FRIEND_OPP_EVERY){
    s.socialTurns = 0;
    if(Math.random() < friendOpportunityProb(s)) s.friendOpportunityPending = true;
  }
}
// 下一回合開始前：挑來源角色(優先有已得知【機】類背景事件的，否則熟悉的朋友以上隨機一位)；沒有可挑的角色時不成立(留待下次滿3次再擲)
function takeFriendOpportunity(s){
  if(!s.friendOpportunityPending) return null;
  s.friendOpportunityPending = false;
  const ok = c=>!c.deceased && !c.lost && !c.isChild && !isFamilyCharacter(c) && characterState(c)==="normal";
  const withEvent = (s.characters||[]).filter(c=>ok(c) && (c.events||[]).some(e=>e.known && (BG_EVENT_BY_NAME[e.name]||{}).tags?.includes("機")));
  const familiar = (s.characters||[]).filter(c=>ok(c) && relationshipTierIndex(c)>=3);
  const pool = withEvent.length ? withEvent : familiar;
  if(!pool.length) return null;
  const c = pool[Math.floor(Math.random()*pool.length)];
  const ev = withEvent.length ? c.events.filter(e=>e.known && (BG_EVENT_BY_NAME[e.name]||{}).tags?.includes("機")).slice(-1)[0] : null;
  return { source: c.name, based_on_event: ev ? ev.name : null, kind: "介紹訂單、推薦打工、告知消息等" };
}
function applyFocusSettlement(s, focus, r){
  const out = {};
  if(!focus) return out;
  recordFocusRatio(s, focus); // 2.6.7.4：升遷、求職、營運與年度健康用的比例
  focusItems(focus).forEach(it=>applyFocusItemSettlement(s, it, r, out));

}
function applyFocusItemSettlement(s, it, r, out){
  if(it.key==="rest"){
    // 2.6.7.2：健康＋2，不超過13.2健康年齡上限(學生時期上限是100)；原本就高於上限的不往下拉
    const before = s.stats.health;

    out.health = (out.health||0) + s.stats.health - before;

    out.network = (out.network||0) + s.stats.network - before;
    applySocialTurnExtras(s, r, out); // 三、3.5.5：2026-10-04起出社會後也算(60歲起有發生才算)
  } else if(it.key==="family"){

    // 2.6.7.7補充定案：60歲起再乘名次比例

    const pool = (s.characters||[]).filter(c=>!c.deceased && !c.lost && ["主管","同事"].includes(workplaceRelationCategory(c.relation)));
    if(pool.length){
      const c = pool[Math.floor(Math.random()*pool.length)];

  } else if(it.key==="interest" && it.interestCategory){
    // 八、8.12.1（2026-09-29，取代8.10「一律算喜歡」）：投入直接記到指定的興趣卡，AI回報的category一律忽略，只讀reaction；沒回報時視為positive
    const rx = r && r.interest_event && ["positive","neutral","negative"].includes(r.interest_event.reaction) ? r.interest_event.reaction : "positive";
    const ev = { category: it.interestCategory, reaction: rx };

// 畫面上的橘色標記：數值依四捨五入後的實際變化；存款、家人、興趣用文字(關係與投入度不裸露數字，4.1.1／3.2.4)
function buildFocusMarks(s, focus, changes){
  const marks = {};
  // 存檔精簡(日記會存一輩子)：只存有變化的項目，stats/extra沒有就不寫
  const stats = {}, extra = [];
  ["knowledge","network","health"].forEach(k=>{ const v = Math.round(changes[k]||0); if(v) stats[k] = v; });
  if(focusPartTimeRatio(focus) && s.partTimeEventLog && s.partTimeEventLog.earning) extra.push(`存款 +${s.partTimeEventLog.earning}`);
  if(changes.coworker) extra.push(`${changes.coworker}：更熟了一些`);
  if(changes.family && changes.family.length) extra.push(`${changes.family.length===1 ? changes.family[0] : "家人"}：更親近了一些`);
  if(changes.interest) extra.push(`${changes.interest}：又投入了一些`);
  if(Object.keys(stats).length) marks.stats = stats;
  if(extra.length) marks.extra = extra;
  return marks;
}
// 2.6.5 回應的評價：AI貼四級，程式查表。點選項最高只到「不錯」；開場回合沒有回應
function normalizeResponseRating(rating, fromChoice){
  if(!rating || !RESPONSE_GRADES[rating.grade]) return null;
  const grade = (fromChoice && rating.grade==="excellent") ? "good" : rating.grade;
  const ability = (rating.ability==="expression" || rating.ability==="network") ? rating.ability : null;
  // 十八、18.16.3（2026-09-30）：靠近／推遠／中性；接人際衝突線在十八、18.16實作，這裡先正規化
  const approach = ["approach","away","neutral"].includes(rating.approach) ? rating.approach : null;
  return { grade, ability, target: rating.target ? String(rating.target) : null, approach, approach_type: approach && rating.approach_type ? String(rating.approach_type).slice(0,20) : null };
}

const SCENE_CATEGORIES = ["學校","住處","外面","別人那裡"];

// 一、1.2.17（2026-09-30）：玩家選擇一定先執行，偶爾偏離——每回合擲15%【測試參數】，擲中就在提示中要求「本回合讓事情偏離預期」

const CHOICE_DEVIATION_PROB = 0.15;
function rollChoiceDeviation(s, ctx){
  if(ctx.prologue || !ctx.fromChoice) return false; // 自由輸入的回合不擲
  if(s.lastDeviated) return false;
  if(s.pendingConfession) return false;
  if(ctx.whitelist) return false;

}
function programEventNow(s){
  const logs = { parentHealthEventLog:"家人健康", parentDeathEventLog:"家人過世", illnessEventLog:"生病", majorIllnessEventLog:"重大疾病",
    universityEventLog:"學業狀態", fertilityEventLog:"生育", careerEventLog:"職涯", breakthroughEventLog:"破格時刻", divorceEventLog:"離婚",
    marriageCrisisEventLog:"婚姻危機", spouseDeathEventLog:"配偶過世", graduationEventLog:"畢業" };
  const hit = Object.keys(logs).find(k=>s[k]);

const PLAYER_PLACE_RE = /(去|到|回|約在|跑去|走去)[^，。,.!?！？\s]{0,8}(家|店|館|公園|宿舍|學校|教室|公司|餐廳|咖啡|操場|社辦|夜市|車站|海邊|山上|醫院|補習班|頂樓)/;
function pickSceneCategory(weights, exclude){

  return weightedPick(pairs);
}
// 呼叫AI之前：程式事前給條件(18.2補充定案)——這回合是「跟重心相關」還是「換到別處」、抽到的類別、不可使用的類別
function buildScenePlan(s, ctx){
  if(!ctx.focus || ctx.prologue || ctx.skip) return null;
  if(!isStudentPhase(s)) return null; // 十八、18.1（2026-10-04）：重心延續到出社會後，但18.2～18.4場景擲骰刻意不延伸
  const streak = s.sceneStreak || { cat:null, n:0 };
  const playerNamed = !!ctx.seek || PLAYER_PLACE_RE.test(ctx.actionText||"");
  let override = null;
  if(ctx.examTriggered) override = { reason:"fixed", note:`${ctx.examType||"考試"}，在學校` };
  else if(s.graduationEventLog) override = { reason:"fixed", note:"畢業典禮" };
  else if(ctx.segKey==="開學初" && ctx.segTurn===0 && ctx.half==="上學期") override = { reason:"fixed", note:"開學典禮，在學校" };
  else if(programEventNow(s)) override = { reason:"program_event", note: programEventNow(s)+"事件，地點依事件本身決定" };
  else if(playerNamed) override = { reason:"player_named", note: ctx.seek ? `玩家想找${ctx.seek}` : "玩家文字指名了去處" };
  if(override){
    return { mode:"override", reason: override.reason, note: override.note,
      player_destination_blocked: override.reason!=="player_named" && playerNamed }; // 18.3：去處被擋下時在新場景第一段順口帶過
  }
  const period = ctx.holiday ? "holiday" : (s.timeState.stageMode==="college" ? "college" : "highschool");
  const weights = SCENE_WEIGHTS[period];
  if(streak.cat && streak.n>=SCENE_STREAK_MAX){ // 18.3補充定案：已連續3回合，不擲「相關／換到別處」，直接換到別處並排除該類
    return { mode:"away", category: pickSceneCategory(weights, streak.cat), banned_category: streak.cat, period };
  }
  if(Math.random() < SCENE_RELATED_PROB) return { mode:"related", related_to: (ctx.focus.key==="work" && ctx.focus.gigCategory) ? "處理副業訂單的地方（工作室、店面、家裡的工作角落等）" : FOCUS_SCENE_RELATED[ctx.focus.key], period };
  return { mode:"away", category: pickSceneCategory(weights, null), period };
}

const PLACE_MAX = 40; // 存檔精簡：名單超過時，丟掉最久沒去、次數最少的(家與學校保留)
function ensurePlaces(s){
  if(!Array.isArray(s.places) || !s.places.length){
    s.places = [
      { name:"家", category:"住處", feature:"", owner:null, status:"營業中", visits:0, lastTurn:0, lastAbs:null, who:{} },
      { name:"學校", category:"學校", feature:"", owner:null, status:"營業中", visits:0, lastTurn:0, lastAbs:null, who:{} }
    ];
  }
  return s.places;
}
function findPlace(s, name){ const n = String(name||"").trim(); return n ? ensurePlaces(s).find(p=>p.name===n) || null : null; }
// 每回合附給旁白：最近造訪過的10個地點
function recentPlacesPayload(s){
  const list = ensurePlaces(s).filter(p=>p.visits>0 && p.status!=="已關閉").sort((a,b)=>b.lastTurn-a.lastTurn).slice(0,10);
  const seed = list.length ? list : ensurePlaces(s).slice(0,2);
  return seed.map(p=>({ name:p.name, category:p.category, feature:p.feature||undefined, owner:p.owner||undefined }));
}
// applyResult內：登記／更新地點、記造訪與在場角色，回傳這回合場景的類別(給18.3連續次數用)
function applyPlacesResult(s, r, ctx){
  const places = ensurePlaces(s);
  const turn = s.turnCount;
  let place = findPlace(s, r.location);
  const ln = r.location_new || {};
  const plan = ctx && ctx.plan;
  if(r.location && !place){
    const name = String(r.location).trim().slice(0,12);
    let cat = SCENE_CATEGORIES.includes(ln.category) ? ln.category : null;
    if(!cat){ cat = (plan && plan.mode==="away" && plan.category) || "外面"; addReviewFlag(s, "location_no_category", `新地點「${name}」沒附合法類別，暫記為${cat}`); }
    place = { name, category:cat, feature: ln.feature ? String(ln.feature).slice(0,40) : "", owner: ln.owner ? String(ln.owner).slice(0,12) : null, status:"營業中", visits:0, lastTurn:0, lastAbs:null, who:{} };
    places.push(place);
  } else if(place && ln.category && SCENE_CATEGORIES.includes(ln.category) && ln.category!==place.category){
    addReviewFlag(s, "location_category_mismatch", `地點「${place.name}」名單類別是${place.category}，旁白報${ln.category}，以名單為準`);
  }
  if(place && plan && plan.mode==="away" && plan.category && plan.category!==place.category) addReviewFlag(s, "location_plan_mismatch", `指定類別${plan.category}，旁白寫的「${place.name}」是${place.category}`);
  // place_updates：特徵或狀態有變化(例：文具行頂讓後改為已關閉)
  (Array.isArray(r.place_updates) ? r.place_updates : []).slice(0,3).forEach(u=>{
    const p = u && findPlace(s, u.name); if(!p) return;
    if(u.feature) p.feature = String(u.feature).slice(0,40);
    if(u.status==="已關閉" || u.status==="營業中") p.status = u.status;
  });
  s.placeCatNow = place ? place.category : null;
  if(!place) return null;
  place.visits++; place.lastTurn = turn;
  place.lastAbs = s.timeState && s.timeState.cal ? s.timeState.cal.lastSceneDay : null;
  s.currentPlace = place.name;
  (ctx && ctx.names || []).forEach(n=>{ place.who[n] = (place.who[n]||0)+1; });
  const wk = Object.entries(place.who).sort((a,b)=>b[1]-a[1]); if(wk.length>8) place.who = Object.fromEntries(wk.slice(0,8)); // 只留次數最多的8位
  if(ctx && ctx.gigCardId){ // 副業據點：做副業那幾回合去得最多的地方
    const card = (s.interestCandidates||[]).find(c=>c.id===ctx.gigCardId);
    if(card){ card.gigPlaces = card.gigPlaces||{}; card.gigPlaces[place.name] = (card.gigPlaces[place.name]||0)+1; }
  }
  if(places.length>PLACE_MAX){
    const drop = places.filter(p=>p.name!=="家" && p.name!=="學校").sort((a,b)=>(a.visits-b.visits)||(a.lastTurn-b.lastTurn))[0];
    if(drop) s.places = places.filter(p=>p!==drop);
  }
  return place.category;
}
// AI事後回報場景類別(只算分隔線下方的新場景)，程式以回報結果計算連續次數
function recordSceneCategory(s, cat){
  if(!SCENE_CATEGORIES.includes(cat)) return;
  const st = s.sceneStreak || { cat:null, n:0 };
  s.sceneStreak = st.cat===cat ? { cat, n: st.n+1 } : { cat, n:1 };
}

const C_SUMMARY_MAX = 40;
function addPlotClue(s, l, text){
  const t = String(text||"").trim().slice(0,C_SUMMARY_MAX); // 10.14.8.3：C類摘要欄位40字
  if(!t) return;

// 呼叫AI之前：沒有推進滿8回合→有追查過就要求下一次碰到時發生推進事件；都在迴避就暫停5回合
function sweepPlotStagnation(s){
  const turn = s.turnCount;
  ensurePlotLines(s).forEach(l=>{
    if(l.status!=="active") return;
    if(l.pausedUntil!=null){
      if(turn < l.pausedUntil) return;
      l.pausedUntil = null; l.lastProgressTurn = turn; l.lastTouchTurn = Math.max(l.lastTouchTurn||0, turn-1); // 暫停結束，重新計算
      return;
    }
    if(l.mustAdvance || turn - (l.lastProgressTurn ?? l.bornTurn ?? turn) < PLOT_STAGNANT_TURNS) return;
    if(l.investigatedSinceProgress) l.mustAdvance = true;
    // 【實作判斷】18.5.3的變形指定、推到眼前還在等著用時，交給那兩個機制處理，不另外暫停
    else if(!l.pendingMorph && !l.pushToFront) l.pausedUntil = turn + PLOT_AVOID_PAUSE_TURNS;
  });
}

// 劇情交代過(affiliation)就以劇情為準、不再擲；已故的不再變。只影響顯示與傳給AI的內容
function updateFamilyPath(c){
  if(!hasFamilyPath(c) || c.deceased || c.affiliation || typeof c.age!=="number" || c.age<18) return;
  if(!c.path){
    c.path = (c.age<22 && Math.random()<FAMILY_COLLEGE_RATE) ? { stage:"college" } : { stage:"work", category: rollFamilyWorkCategory() };
  } else if(c.path.stage==="college" && c.age>=22){

  }

function schoolStageForAge(age){

function isClassmateRelation(relation){

function parentOccupationText(c){ // 4.9.3

// 回傳null＝未知。forAI：傳給AI時，同在讀高中的兄弟姊妹補一句不同校(B8：弟弟妹妹不會出現在主角的高中)
function npcOccupationText(s, c, forAI){
  if(c.affiliation) return c.affiliation;
  const mode = isStudentPhase(s) && s.timeState ? s.timeState.stageMode : null;
  if(hasFamilyPath(c)){
    if(typeof c.age!=="number") return null;
    const st = schoolStageForAge(c.age);
    if(st) return (forAI && st==="讀高中" && mode==="highschool") ? "讀高中（跟你不同校，除非劇情已經交代過同校）" : st;
    if(!c.path) return null;
    return c.path.stage==="college" ? "讀大學" : occupationDisplayName(c.path.category);
  }
  if(c.occupation) return parentOccupationText(c);
  if(c.romanceStatus==="married" && s.spouseOccupationCategory) return occupationDisplayName(s.spouseOccupationCategory);
  const r = String(c.relation||"");
  if(isClassmateRelation(r)){
    const level = /高中|國中|國小/.test(r) ? "highschool" : (/大學/.test(r) ? "college" : null);
    if(!mode || (level && level!==mode)) return null; // 主角已不是這個階段的學生，推不出同學現在在做什麼
    return mode==="highschool" ? "讀高中（跟你同校）" : "讀大學（跟你同校）";
  }
  if(["同事","主管","下屬"].includes(workplaceRelationCategory(r))) return "跟你同公司";
  const teacher = r.match(/[^\s，,、的（(]*(老師|教授|導師|班導)/);
  if(teacher) return teacher[0];
  return null;
}
function npcOccupationLabel(s, c){ return npcOccupationText(s, c, false) || "未知"; } // 4.9.1：人物詳細頁
function npcAffiliation(s, c){ return npcOccupationText(s, c, true); } // 4.9.7：傳給AI，未知時不傳
// 重要物品清單：角色之間贈送、借出、交付的物品，以及目前在誰手上；最多10項，超過時移除最久沒被提及的一項
const KEY_ITEMS_MAX = 10;
function applyItemMoves(s, moves, turnText){
  s.keyItems = s.keyItems || [];
  (Array.isArray(moves) ? moves : (moves ? [moves] : [])).forEach(m=>{
    if(!m || !m.item) return;
    const name = String(m.item).slice(0,20);
    let it = s.keyItems.find(x=>x.name===name);
    if(!it){ it = { name, from: String(m.from||"").slice(0,12), holder:"", kind:"", lastTurn:s.turnCount }; s.keyItems.push(it); }
    if(m.to) it.holder = String(m.to).slice(0,12);
    if(m.kind) it.kind = String(m.kind).slice(0,6);
    it.lastTurn = s.turnCount;
  });
  const text = String(turnText||"");
  s.keyItems.forEach(it=>{ if(text.includes(it.name)) it.lastTurn = s.turnCount; });
  while(s.keyItems.length>KEY_ITEMS_MAX){ s.keyItems.sort((a,b)=>a.lastTurn-b.lastTurn); s.keyItems.shift(); }
}
// 避用句型：最近5回合正文裡在2回合以上重複出現的片段(6～10字，去掉角色名字)，最多10條；「耳朵紅」「耳根紅」「臉紅」固定追蹤
const AVOID_PHRASES_FIXED = ["耳朵紅","耳根紅","臉紅"];
const AVOID_PHRASES_MAX = 10;
function buildAvoidPhrases(s){
  const names = Array.from(allUsedNames(s)).filter(Boolean).sort((a,b)=>b.length-a.length);
  const texts = (s.log||[]).filter(e=>!e.error).slice(-5).map(e=>{
    let t = String(e.text||"").replace(/\{\{[^|{}]+\|/g, "「").replace(/[{}]/g, "");
    names.forEach(n=>{ t = t.split(n).join("｜"); });
    return t;
  });
  const out = AVOID_PHRASES_FIXED.filter(p=>texts.some(t=>t.includes(p)));
  const count = new Map();
  texts.forEach(t=>{
    const seen = new Set();
    t.split(/[。！？!?\n「」『』，,、；;：:（）()…—～\s｜〔〕]+/).forEach(clause=>{
      for(let n=10;n>=6;n--) for(let i=0;i+n<=clause.length;i++) seen.add(clause.slice(i,i+n));
    });
    seen.forEach(g=>count.set(g, (count.get(g)||0)+1));
  });
  // 重複越多次越優先，同次數取長的；錯開一兩個字的同一段句子(滑動視窗的重疊片段)只留一條
  const cands = Array.from(count.entries()).filter(([g,c])=>c>=2).sort((a,b)=>b[1]-a[1] || b[0].length-a[0].length).map(([g])=>g);
  const overlaps = (a,b)=>a.includes(b.slice(0,5)) || a.includes(b.slice(-5)) || b.includes(a.slice(0,5)) || b.includes(a.slice(-5));
  const picked = [];
  cands.forEach(g=>{ if(!picked.some(p=>overlaps(p,g)) && !out.some(p=>g.includes(p) || p.includes(g))) picked.push(g); });
  return out.concat(picked).slice(0, AVOID_PHRASES_MAX);
}
// ===== 十八、18.13約定追蹤（2026-09-29 A10）=====
const PROMISES_PER_CHARACTER_MAX = 3; // 【A10】每位角色同時最多3筆未兌現約定，超過時最舊的一筆在該角色下次出場時帶過再移除
const PROMISE_DEFAULT_DAYS = 7;       // 【實作判斷】AI沒給看得懂的約定日期時，當作一週後
const PROMISE_MISS_LIMIT = 3;         // 【實作判斷】到期後AI連續3回合都沒交代結果，記入待確認清單後移除
function calParseDate(str, refAbs){
  const t = String(str||"");
  let m = t.match(/(\d{4})\s*[\/年.-]\s*(\d{1,2})\s*[\/月.-]\s*(\d{1,2})/);
  if(m) return calDateToAbs(+m[1], +m[2], +m[3]);
  m = t.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})/);
  if(!m) return null;
  const y = calAbsToDate(refAbs).y;
  let a = calDateToAbs(y, +m[1], +m[2]);
  if(a < refAbs-1) a = calDateToAbs(y+1, +m[1], +m[2]);
  return a;
}
function addPromises(s, list, sceneAbs){
  s.promises = s.promises || [];
  (Array.isArray(list) ? list : []).slice(0,3).forEach(p=>{
    if(!p || !p.character || !p.content) return;
    const character = String(p.character).slice(0,12);
    const due = calParseDate(p.due_date, sceneAbs);
    s.promiseSeq = (s.promiseSeq||0)+1;
    s.promises.push({ id:"a"+s.promiseSeq, character, content:String(p.content).slice(0,50), dueAbs: due!=null ? due : sceneAbs+PROMISE_DEFAULT_DAYS,
      dueText: p.due_date ? String(p.due_date).slice(0,20) : null, createdTurn:s.turnCount, status:"open", misses:0 });
    const mine = s.promises.filter(x=>x.character===character && x.status==="open");
    if(mine.length > PROMISES_PER_CHARACTER_MAX) mine[0].status = "fading";
  });
}
function promisesPayload(s, win){
  const list = s.promises||[];
  const show = p=>({ id:p.id, character:p.character, content:p.content, date: calFormatMdw(p.dueAbs) });
  return {
    promises_due_now: win ? list.filter(p=>p.status==="open" && p.dueAbs <= win.end).map(show) : [],
    open_promises: list.filter(p=>p.status==="open").map(show),
    promises_fading: list.filter(p=>p.status==="fading").map(p=>({ id:p.id, character:p.character, content:p.content }))
  };
}
function applyPromiseResults(s, r, win, appearedNames){
  s.promises = s.promises || [];
  (Array.isArray(r.promise_results) ? r.promise_results : []).forEach(x=>{
    const p = x && s.promises.find(v=>v.id===x.id);
    if(!p) return;
    if(x.outcome==="postponed"){
      const due = calParseDate(x.new_due_date, win ? win.end : p.dueAbs);
      p.dueAbs = due!=null && due>p.dueAbs ? due : (win ? win.end : p.dueAbs) + PROMISE_DEFAULT_DAYS;
      p.misses = 0; p.status = "open";
    } else if(["kept","cancelled","faded"].includes(x.outcome)) p.status = "done";
  });
  // 到期卻沒交代：計次，連續3回合還是沒交代就記入待確認清單後移除
  if(win) s.promises.forEach(p=>{
    if(p.status==="open" && p.dueAbs <= win.end && !(r.promise_results||[]).some(x=>x && x.id===p.id)){
      p.misses = (p.misses||0)+1;
      if(p.misses>=PROMISE_MISS_LIMIT){ p.status = "done"; addReviewFlag(s, "promise_unresolved", `約定「${p.character}：${p.content}」到期後連續${PROMISE_MISS_LIMIT}回合沒有交代`); }
    }
  });
  // 淡出中的約定：該角色這回合出場了，就當作已經帶過
  s.promises.forEach(p=>{ if(p.status==="fading" && appearedNames && appearedNames.has(p.character)) p.status = "done"; });
  s.promises = s.promises.filter(p=>p.status!=="done");
  addPromises(s, r.promise_new, win ? (s.timeState.cal.lastSceneDay ?? win.start) : 0);
}
function pickDailyTheme(s){
  const used = new Set((s.dailyThemeLog||[]).filter(e=>e.turn > s.turnCount-APPEARANCE_WINDOW).map(e=>e.theme));
  const pool = DAILY_SCENE_THEMES.filter(t=>!used.has(t));
  return pick(pool.length ? pool : DAILY_SCENE_THEMES);
}
function plotLinesBy(s, status){ return ensurePlotLines(s).filter(l=>l.status===status); }
function plotMainCharacter(s, l){ return l.main ? (s.characters||[]).find(c=>c.name===l.main) : null; }
// 18.5.3／18.5.4：變形方式由程式抽；伏筆(或已沒有角色能反應的線)平均抽，其餘依主要角色的相處風格；不連續兩次同一種
function drawPlotMorph(s, l){
  const kind = l.morphAsForeshadow ? "伏筆" : l.kind;
  const options = PLOT_MORPHS[kind] || PLOT_MORPHS.伏筆;
  const style = kind==="伏筆" ? null : ((plotMainCharacter(s, l)||{}).style||null);
  const fav = style && PLOT_STYLE_FAVORITES[style] ? (PLOT_STYLE_FAVORITES[style][kind]||[]) : [];
  const others = options.filter(o=>!fav.includes(o));
  let pairs = fav.length
    ? options.map(o=>[o, fav.includes(o) ? 35 : 30/Math.max(1, others.length)])
    : options.map(o=>[o, 1]);
  const withoutLast = pairs.filter(p=>p[0]!==l.lastMorph);
  if(withoutLast.length) pairs = withoutLast; // 「不連續兩次抽到同一種」優先於機率，其餘依原比例
  return weightedPick(pairs);
}
function shelvePlotLine(s, l, reason){
  if(reason==="dodge"){
    l.shelveCount = (l.shelveCount||0)+1;
    if(l.shelveCount>=PLOT_SHELVE_TO_DROP){ l.status = "dropped"; l.closedTurn = s.turnCount; l.pendingMorph = null; return; }
  }
  l.status = "shelved"; l.shelveReason = reason; l.shelvedTurn = s.turnCount; l.pendingMorph = null; l.pushToFront = false;
}
// 18.5.3：玩家對上一回合碰到的線的反應；上一回合只是輕碰的線，玩家沒接只能記帶過(補充定案之二)
function applyPlotReaction(s, l, reaction){
  if(l.lastTouchMode!=="ask" && reaction==="dodge") reaction = "gloss";
  if(reaction==="gloss"){
    l.glossStreak = (l.glossStreak||0)+1;
    if(l.glossStreak>=PLOT_GLOSS_TO_PUSH) l.pushToFront = true;
    return reaction;
  }
  l.glossStreak = 0;
  if(reaction==="dodge"){
    l.dodges = (l.dodges||0)+1;
    if(l.dodges>=PLOT_DODGE_TO_MORPH){
      l.dodges = 0;
      if((l.morphs||0)>=PLOT_MORPH_TO_SHELVE) shelvePlotLine(s, l, "dodge");
      else { l.morphs = (l.morphs||0)+1; l.pendingMorph = drawPlotMorph(s, l); l.lastMorph = l.pendingMorph; }
    }
  }
  return reaction;
}
// resetCounters：因閃開擱置後回來、放下後重新打開時，閃開與變形次數一起歸零(「上次變形方式」保留)；超額、角色淡出回來的維持原狀
function reactivatePlotLine(s, l, style, resetCounters){
  l.status = "active"; l.returnedTurn = s.turnCount; l.returnStyle = style||null;
  if(resetCounters){ l.dodges = 0; l.morphs = 0; l.glossStreak = 0; }
  l.shelveReason = null; l.shelvedTurn = null;
}
// 呼叫AI之前：劇情線的回歸、浮現、角色過世收尾、角色輪替、新角色登場，依18.9順序整理成這回合的要求
function prepareNarrativeRhythm(s, ctx){
  const lines = ensurePlotLines(s);
  const turn = s.turnCount;
  const chars = s.characters||[];
  const byName = n=>chars.find(c=>c.name===n);
  // 18.6補充定案：相關角色過世——唯一相關角色過世→這回合收尾、轉放下(不計擱置次數)；還有在世的→改以在世角色為主要角色
  const closures = [];
  lines.filter(l=>l.status==="active"||l.status==="returning"||l.status==="shelved").forEach(l=>{
    if(!l.chars.length || l.kind==="伏筆" || l.morphAsForeshadow) return;
    const living = l.chars.filter(n=>{ const c = byName(n); return c && !c.deceased; });
    const main = plotMainCharacter(s, l);
    if(!living.length && l.chars.some(n=>{ const c = byName(n); return c && c.deceased; })){
      closures.push({ id:l.id, text:l.text, character:l.main||l.chars[0] });
      l.status = "dropped"; l.closedTurn = turn; l.pendingMorph = null; l.deathDropped = true; l.shelveReason = null;
    } else if(main && main.deceased && living.length){ l.main = living[0]; }
  });
  // 18.6：角色淡出而擱置的線，角色再登場(active)那一回合直接恢復進行中，不經待回歸、不佔浮現額度
  lines.filter(l=>l.status==="shelved" && l.shelveReason==="fade").forEach(l=>{
    const c = plotMainCharacter(s, l);
    if(c && c.active && !c.deceased) reactivatePlotLine(s, l, null, false);
  });
  // 18.6：因閃開擱置→16回合後待回歸；因超額擱置→進行中少於6條時待回歸
  lines.filter(l=>l.status==="shelved").forEach(l=>{
    if(l.shelveReason==="dodge" && turn - (l.shelvedTurn||0) >= PLOT_SHELVE_RETURN_AFTER) l.status = "returning";
  });
  if(plotLinesBy(s,"active").length < PLOT_MAX_ACTIVE){
    lines.filter(l=>l.status==="shelved" && l.shelveReason==="overflow").forEach(l=>{ l.status = "returning"; });
  }
  sweepPlotStagnation(s); // 18.11（A6）
  // 18.9①：程式觸發的事件回合暫停浮現與新角色登場(固定事件不暫停)；③職涯伏筆剛浮現的回合，劇情線不浮現
  const programEvent = !!programEventNow(s);
  const careerSurfacing = (s.careerForeshadowLines||[]).some(e=>e.status==="brewing" && e.hitTurn===turn);
  // 18.7 角色輪替：可選的焦點角色
  const log = (s.focusLog||[]).filter(e=>e.turn<turn).slice(-5);
  const last2 = log.slice(-2).map(e=>e.name);
  const streakName = (last2.length===2 && last2[0] && last2[0]===last2[1]) ? last2[0] : null;
  const exemptNames = new Set([ctx.seek].filter(Boolean));
  chars.forEach(c=>{ if(ctx.actionText && ctx.actionText.includes(c.name)) exemptNames.add(c.name); });
  const pool = chars.filter(c=>!c.deceased && !c.lost && (!c.left_circle || exemptNames.has(c.name)) && (c.active || exemptNames.has(c.name))); // 4.6：已故、失聯的不當焦點；4.7.3【距】離開生活圈的人，主角主動去找時才出現
  // 18.12（A7）：非家人角色最近10回合出場滿6次，這回合不主動安排(玩家指名、想找的照常)
  const appear = recentAppearanceCounts(s);
  const capped = pool.filter(c=>!isFamilyCharacter(c) && (appear.get(c.name)||0) >= APPEARANCE_CAP && !exemptNames.has(c.name)).map(c=>c.name);
  let candidates = pool.filter(c=>(c.name!==streakName || exemptNames.has(c.name)) && !capped.includes(c.name)).map(c=>c.name);
  const seen5 = new Set(log.map(e=>e.name).filter(Boolean));
  const mustBeNew = log.length>=5 && seen5.size<3; // 18.7：滾動6回合至少3位不同焦點角色，快到第6回合仍未達標
  if(mustBeNew && !exemptNames.size){
    const fresh = candidates.filter(n=>!seen5.has(n));
    candidates = fresh; // 可能是空的：代表該換一位沒當過焦點的人(也可以是新角色)
  }
  // 18.6浮現名單：該浮現(8回合沒碰的進行中)＋待回歸，挑最久沒碰的一條；每回合最多1條
  let surface = null;
  if(!programEvent && !careerSurfacing){
    const due = lines.filter(l=>(l.status==="active" && !plotPaused(s, l) && turn - l.lastTouchTurn >= PLOT_SURFACE_AFTER) || l.status==="returning")
      .sort((a,b)=>a.lastTouchTurn-b.lastTouchTurn);
    if(due.length){
      const l = due[0];
      let how = "light";
      if(l.status==="returning"){ const byDodge = l.shelveReason==="dodge"; reactivatePlotLine(s, l, byDodge ? "event" : null, byDodge); how = byDodge ? "return_event" : "return"; }
      surface = { id:l.id, text:l.text, how };
      // 18.9④：相關角色這回合不能當焦點時，改以訊息、別人提起等方式輕碰
      if(l.main && !candidates.includes(l.main)) surface.main_not_available = true;
    }
  }
  // 18.7：活躍角色(不含家人、不含背景角色)少於4位→滾動6回合至少1位新角色；18.9②浮現與新角色不排同一回合
  const activeNonFamily = chars.filter(c=>c.active && !c.deceased && !isFamilyCharacter(c)).length;
  const recentNew = (s.newCharTurns||[]).some(t=>t > turn-6 && t < turn);
  const newCharacterNow = !programEvent && !surface && activeNonFamily<4 && !recentNew && log.length>=5;
  // 18.9⑤：需要本人在場的變形，延到該角色可以當焦點的回合(程式保留變形指定)
  const activeLines = lines.filter(l=>l.status==="active" && !plotPaused(s, l)).map(l=>{
    const o = { id:l.id, text:l.text, kind:l.morphAsForeshadow ? "伏筆" : l.kind, characters:l.chars, main_character:l.main||null };
    // 18.11（A6）：已揭露線索、併進摘要的舊線索、角色說過還沒被揭穿的謊；追查3次沒新資訊→must_reveal_clue；原地踏步8回合且玩家有追查→must_advance
    if(l.cf){
      o.conflict = { event:l.cf.event, unspoken_need:l.cf.need, resolve_condition:l.cf.resolve, stage:l.cfStage||"徵兆", touches:l.cfTouches||0,
        approach_so_far:{ toward:l.cfToward||0, away:l.cfAway||0 }, last_response: l.cfLastApproach==="approach" ? "靠近" : l.cfLastApproach==="away" ? "推遠" : null };
      if((l.cfTouches||0) >= CONFLICT_TOUCH_CAP) o.conflict.directive = l.cfEscalated ? "已經升級過冷戰，本回合必須以任一outcome收尾" : "本回合收尾，或升級為冷戰(conflict_stage照填，加escalate_cold:true)";
    }
    if(l.summaryExtra) o.summary = l.summaryExtra;
    if((l.clues||[]).length) o.clues = l.clues.slice();
    const lies = (l.lies||[]).filter(x=>!x.exposed);
    if(lies.length) o.lies = lies.map(x=>({ character:x.character, content:x.content }));
    if(l.mustRevealClue) o.must_reveal_clue = true;
    if(l.mustAdvance) o.must_advance = true;
    if(l.pendingMorph){
      const needsPresence = PLOT_MORPH_NEEDS_PRESENCE.has(l.pendingMorph);
      if(needsPresence && l.main && !candidates.includes(l.main)) o.morph_on_hold = true;
      else o.morph = l.pendingMorph;
    }
    if(l.pushToFront) o.push_to_front = true;
    if(l.returnStyle==="event" && l.returnedTurn===turn) o.return_by_event = true;
    return o;
  });
  const touchedLast = lines.filter(l=>l.lastTouchTurn===turn-1 && l.status==="active").map(l=>({ id:l.id, mode:l.lastTouchMode||"light" }));
  const dropped = lines.filter(l=>l.status==="dropped" && !closures.some(c=>c.id===l.id))
    .sort((a,b)=>(b.closedTurn||0)-(a.closedTurn||0)).slice(0, PLOT_DROPPED_SHOWN).map(l=>({ id:l.id, text:l.text }));
  // 18.12（A7）：很久沒出場的角色(適合回來串場)；主角日常場景(滾動10回合不足3個獨處場景→這回合指定日常場景，從題材池抽)
  const longUnseen = chars.filter(c=>c.active && !c.deceased && !c.isChild && turn - (c.lastTurn||0) >= LONG_UNSEEN_TURNS)
    .sort((a,b)=>(a.lastTurn||0)-(b.lastTurn||0)).slice(0, LONG_UNSEEN_MAX).map(c=>({ name:c.name, relation:c.relation, turns_since: turn-(c.lastTurn||0) }));
  const win10 = (s.focusLog||[]).filter(e=>e.turn<turn).slice(-APPEARANCE_WINDOW);
  const soloCount = win10.filter(e=>!e.name).length;
  let dailyScene = null;
  if(!ctx.prologue && !programEvent && !exemptNames.size && !ctx.fixedEvent && win10.length>=APPEARANCE_WINDOW && soloCount < SOLO_SCENE_MIN){
    const theme = pickDailyTheme(s);
    s.dailyThemeLog = (s.dailyThemeLog||[]).filter(e=>e.turn > turn-APPEARANCE_WINDOW).concat([{ turn, theme }]);
    dailyScene = { theme };
  }
  return {
    daily_scene_now: dailyScene,
    appearance_capped: capped,
    long_unseen_characters: longUnseen,
    plot_lines: activeLines,
    plot_touched_last_turn: ctx.prologue ? [] : touchedLast,
    plot_surface_now: surface,
    plot_closure_now: closures.length ? closures : null,
    conflict_closed: closedConflictsPayload(s), // 18.16.4：已收尾不得重演
    dropped_plot_lines: dropped,
    focus_candidates: candidates.slice(0, 12),
    focus_streak_blocked: streakName && !exemptNames.has(streakName) ? streakName : null,
    focus_must_be_new: mustBeNew && !exemptNames.size,
    new_character_now: newCharacterNow && !dailyScene,
    seek_character: ctx.seek || null
  };
}
// AI回來之後：記錄劇情線、焦點角色、新角色登場回合
// 18.16.4 收尾：outcome由旁白回報，程式套用好感與人物卡；缺outcome或不合法時記錄並當作「各退一步」
function applyConflictOutcome(s, l, outcome){
  let key = CONFLICT_OUTCOMES[outcome] ? outcome : null;
  if(!key){ key = "各退一步"; addReviewFlag(s, "conflict_outcome_missing", `人際衝突線${l.id}收尾沒有合法outcome(「${outcome||"沒填"}」)，當作各退一步`); }
  const eff = CONFLICT_OUTCOMES[key];
  const c = characterByName(s, l.main);
  if(c){
    c.affinity = clamp((c.affinity||0) + eff.affinity, 0, 100);
    if(eff.caresLine){ c.cares = (c.cares||[]).concat([String(l.cf.need).slice(0,60)]).slice(-3); } // 「他在意的，其實是○○」
    if(eff.rift) c.rift = true;
  }
  l.cfOutcome = key;
}
// 每回合提示：已收尾的人際衝突線「此事已落幕」，旁白不得再寫同一件事的攤牌
function closedConflictsPayload(s){
  const list = (s.plotLines||[]).filter(l=>l.cf && l.status==="resolved").sort((a,b)=>(b.closedTurn||0)-(a.closedTurn||0)).slice(0,CONFLICT_CLOSED_SHOWN);
  return list.length ? list.map(l=>({ id:l.id, text:l.text, character:l.main, outcome:l.cfOutcome||null, note:"此事已落幕，可以寫一點餘韻，不得再寫同一件事的攤牌" })) : null;
}
// 回應為靠近→衝突往收尾推進；推遠→升溫(累計給旁白判斷收尾的outcome)。只看上一回合碰到的人際衝突線，互動對象要對得上
function applyConflictApproach(s, rating){
  if(!rating || !rating.approach || rating.approach==="neutral") return;
  const turn = s.turnCount;
  (s.plotLines||[]).filter(l=>l.cf && l.status==="active" && l.lastTouchTurn===turn-1).forEach(l=>{
    if(rating.target && l.main && rating.target!==l.main && !(l.chars||[]).includes(rating.target)) return;
    if(rating.approach==="approach") l.cfToward = (l.cfToward||0)+1; else l.cfAway = (l.cfAway||0)+1;
    l.cfLastApproach = rating.approach;
  });
}
function applyNarrativeRhythmResult(s, r, ctx){
  const lines = ensurePlotLines(s);
  const turn = s.turnCount;
  const byId = id=>lines.find(l=>l.id===id);
  const known = n=>(s.characters||[]).some(c=>c.name===n);
  // 這回合payload裡已經給AI看過的變形指定／推到眼前：這回合碰到才算完成；本回合才因反應新產生的，要留到下一回合
  const shownToAI = new Map(lines.map(l=>[l.id, { morph:l.pendingMorph, push:!!l.pushToFront }]));
  // 上回合玩家反應(只認上一回合碰到、還在進行中的線)
  if(!ctx.prologue) (Array.isArray(r.plot_reactions) ? r.plot_reactions : []).forEach(x=>{
    const l = x && byId(x.id);
    if(!l || l.status!=="active" || l.lastTouchTurn!==turn-1) return;
    if(!["dodge","gloss","catch","advance"].includes(x.reaction)) return;
    applyPlotReaction(s, l, x.reaction);
    if(x.reaction==="advance") markPlotProgress(s, l); // 18.11（A6）：玩家推進也算推進
  });
  (Array.isArray(r.plot_resolved) ? r.plot_resolved : []).forEach(item=>{
    const id = item && typeof item==="object" ? item.id : item;
    const l = byId(id);
    if(l && l.status==="active"){
      if(l.cf) applyConflictOutcome(s, l, item && typeof item==="object" ? item.outcome : null);
      l.status = "resolved"; l.closedTurn = turn; l.pendingMorph = null;
    }
  });
  // 放下的線被玩家主動提起→重新打開；角色過世後重開的改用伏筆的變形方式
  (Array.isArray(r.plot_reopened) ? r.plot_reopened : []).forEach(id=>{
    const l = byId(id); if(!l || l.status!=="dropped") return;
    if(l.deathDropped) l.morphAsForeshadow = true;
    reactivatePlotLine(s, l, null, true); l.shelveCount = 0; l.lastTouchTurn = turn; l.lastTouchMode = "light";
  });
  // 本回合碰到：輕碰(light)／丟給玩家回應(ask)／先埋徵兆(omen，變形指定保留到下一回合)
  (Array.isArray(r.plot_touched) ? r.plot_touched : []).forEach(x=>{
    const l = x && byId(x.id);
    if(!l || l.status!=="active") return;
    const mode = ["light","ask","omen"].includes(x.mode) ? x.mode : "light";
    l.lastTouchTurn = turn; l.lastTouchMode = mode==="omen" ? "light" : mode; l.touches = (l.touches||0)+1;
    if(l.cf){ // 18.16：人際衝突線——回報階段(只能前進或停留)、累計碰觸次數、升級為冷戰重新計數
      const from = CONFLICT_STAGES.indexOf(l.cfStage||"徵兆"), to = CONFLICT_STAGES.indexOf(x.conflict_stage);
      if(to>=0 && to>=from) l.cfStage = x.conflict_stage;
      else if(to>=0 && to<from) addReviewFlag(s, "conflict_stage_backward", `人際衝突線${l.id}階段從${l.cfStage}倒退成${x.conflict_stage}，忽略`);
      l.cfTouches = (l.cfTouches||0)+1;
      if(x.escalate_cold && !l.cfEscalated && (l.cfTouches-1)>=CONFLICT_TOUCH_CAP){ l.cfEscalated = 1; l.cfTouches = 1; l.cfStage = "攤牌"; }
    }
    const shown = shownToAI.get(l.id) || {};
    if(mode!=="omen"){
      if(shown.morph && l.pendingMorph===shown.morph) l.pendingMorph = null;
      if(shown.push) l.pushToFront = false;
    }
    // 18.11（A6）：玩家主動追查(investigated)、揭露的新線索(new_clue)、角色說的謊(lie)、被揭穿的謊(lie_exposed)
    const hadMustAdvance = l.mustAdvance;
    if(x.new_clue) addPlotClue(s, l, x.new_clue);
    else if(x.investigated){
      l.investigatedSinceProgress = true;
      l.investigateNoClue = (l.investigateNoClue||0)+1;
      if(l.investigateNoClue >= PLOT_INVESTIGATE_TO_REVEAL) l.mustRevealClue = true;
    }
    if(hadMustAdvance && mode!=="omen") markPlotProgress(s, l); // 被要求推進的線這回合碰到了，視為已推進
    if(x.lie && x.lie.content){
      l.lies = (l.lies||[]).concat([{ character: String(x.lie.character||"").slice(0,12), content: String(x.lie.content).slice(0,C_SUMMARY_MAX), turn, exposed:false }]);
      while(l.lies.length>PLOT_LIES_MAX){ const i = l.lies.findIndex(v=>v.exposed); l.lies.splice(i>=0 ? i : 0, 1); }
    }
    if(x.lie_exposed){ const lie = (l.lies||[]).find(v=>!v.exposed && (v.content===x.lie_exposed || String(x.lie_exposed).includes(v.content) || v.content.includes(String(x.lie_exposed)))); if(lie) lie.exposed = true; }
  });
  // 新劇情線：編號由程式配發，照常登記(不因已滿6條而不登記)
  const born = [];
  (Array.isArray(r.plot_new) ? r.plot_new : []).slice(0,3).forEach(p=>{
    if(!p || !p.text) return;
    const chars = (Array.isArray(p.characters) ? p.characters : []).map(String).filter(known).slice(0,4);
    const main = chars.includes(p.main_character) ? p.main_character : (chars[0]||null);
    s.plotSeq = (s.plotSeq||0)+1;
    let kind = PLOT_KINDS.includes(p.kind) ? p.kind : "伏筆";
    let cf = null;
    if(kind==="人際衝突"){
      // 18.16.1：登記時必填三欄(conflict_event／unspoken_need／resolve_condition)＋主要角色，存檔後鎖定；缺欄位就降為一般「衝突」線並寫入錯誤紀錄
      const f = k=>p[k] ? String(p[k]).slice(0,80) : "";
      if(f("conflict_event") && f("unspoken_need") && f("resolve_condition") && main) cf = { event:f("conflict_event"), need:f("unspoken_need"), resolve:f("resolve_condition") };
      else { kind = "衝突"; addReviewFlag(s, "conflict_line_incomplete", `人際衝突線「${String(p.text).slice(0,20)}」沒有填齊三欄或主要角色，降為一般衝突線`); }
    }
    const l = newPlotLine(s, { id:"p"+s.plotSeq, text:String(p.text).slice(0,C_SUMMARY_MAX), kind, chars, main, lastTouchMode:"light" });
    if(cf){ l.cf = cf; l.cfStage = "徵兆"; l.cfTouches = 0; l.cfEscalated = 0; l.cfToward = 0; l.cfAway = 0; }
    lines.push(l); born.push(l);
  });
  // 18.5.2：超過6條→最久沒碰的轉擱置(不計擱置次數)；當回合新寫出的、剛回到進行中的不會被擠掉
  let active = lines.filter(l=>l.status==="active");
  while(active.length>PLOT_MAX_ACTIVE){
    const victim = active.filter(l=>!born.includes(l) && l.returnedTurn!==turn).sort((a,b)=>a.lastTouchTurn-b.lastTouchTurn)[0];
    if(!victim) break;
    shelvePlotLine(s, victim, "overflow");
    active = lines.filter(l=>l.status==="active");
  }
  // 焦點角色
  const focusName = r.focus_character && known(r.focus_character) ? String(r.focus_character) : null;
  s.focusLog = (s.focusLog||[]).concat([{ turn, name: focusName }]).slice(-12);
  // 18.12（A7）：這回合新場景出場的角色(AI回報scene_characters；沒回報就用焦點角色＋有互動更新的角色)，記最近10回合
  const appeared = new Set((Array.isArray(r.scene_characters) ? r.scene_characters : []).map(String).filter(known));
  if(focusName) appeared.add(focusName);
  if(!Array.isArray(r.scene_characters) || !r.scene_characters.length) (r.character_updates||[]).forEach(cu=>{ if(cu && known(cu.name)) appeared.add(String(cu.name)); });
  s.appearLog = (s.appearLog||[]).filter(e=>e.turn > turn-APPEARANCE_WINDOW).concat([{ turn, names: Array.from(appeared) }]);
  applyPlacesResult(s, r, { plan: ctx.plan, gigCardId: ctx.gigCardId, names: Array.from(appeared) }); // 十八、18.15：地點名單
  pruneClosedPlotLines(s);
}
// 存檔精簡：已解開的線不再被引用，只留最近5條；放下的線只有最近10條會給AI比對(18.6)，更早的刪掉(被提起時當新線登記)；
// 擱置中的線超過PLOT_MAX_SHELVED條時，最久沒碰的轉為放下(實作判斷，文件沒有規定擱置上限，避免同時開太多線時無限累積)
const PLOT_MAX_SHELVED = 12; // 【測試參數，實作判斷】
function pruneClosedPlotLines(s){
  const lines = s.plotLines||[];
  const shelved = lines.filter(l=>l.status==="shelved" || l.status==="returning").sort((a,b)=>a.lastTouchTurn-b.lastTouchTurn);
  shelved.slice(0, Math.max(0, shelved.length-PLOT_MAX_SHELVED)).forEach(l=>{ l.status = "dropped"; l.closedTurn = s.turnCount; l.pendingMorph = null; });
  const byClosed = (a,b)=>(a.closedTurn||0)-(b.closedTurn||0);
  const done = lines.filter(l=>l.status==="resolved").sort(byClosed);
  const drop = lines.filter(l=>l.status==="dropped").sort(byClosed);
  const removeSet = new Set([].concat(done.slice(0, Math.max(0, done.length-5)), drop.slice(0, Math.max(0, drop.length-PLOT_DROPPED_SHOWN))));
  if(removeSet.size) s.plotLines = lines.filter(l=>!removeSet.has(l));
}
// 18.6：相關角色淡出為背景角色時，以他為主要角色的線一起擱置(不計擱置次數)
function shelvePlotLinesForFadedCharacter(s, name){
  ensurePlotLines(s).forEach(l=>{ if(l.status==="active" && l.main===name) shelvePlotLine(s, l, "fade"); });
}

// ===== 一、1.2.8.2（2026-09-24實作）語氣軌tone_track／張力tension由程式指定 =====
// 依1.2.8.2.5對照表，只用「呼叫AI之前就已經確定」的程式訊號判斷；優先序：強制克制軌＞回望軌＞一般克制軌＞碎念軌，tension任一high即high
const MUTTER_STREAK_LIMIT = 3; // 1.2.8.2.3
function detectRelationshipTurningIntent(actionText){ return /告白|表白|求婚|分手|提分手/.test(actionText||""); }
function computeToneTrack(s, timeCtx, actionText, forceEnding){
  const hits = []; // {track, forced, tension, category}
  const add = (track, tension, category, forced)=>hits.push({ track, tension, category, forced:!!forced });
  if(forceEnding) add("restrained","high","死亡相關(本人)",true);
  if(timeCtx && timeCtx.deathForeshadowNow) add("restrained","high","死亡相關(前兆)",true);
  if(s.divorceEventLog || s.parentDeathEventLog || s.spouseDeathEventLog) add("restrained","high","家庭成員重大變故",true); // 2026-09-28補上喪偶
  // 1.2.8.7（2026-09-28使用者同意Claude建議）：生育/領養改由程式判定後可事先指定語氣軌——
  // 出生、領養成功＝人生階段轉換級的回望軌高張力；嘗試沒懷上＝克制軌低張力；領養沒辦成＝克制軌低張力
  const fe = s.fertilityEventLog;
  if(fe){
    if(fe.type==="birth" || (fe.type==="adoption" && fe.success)) add("retrospect","high","生育或領養(新成員加入)",false);
    else if(!fe.success) add("restrained","low", fe.type==="adoption" ? "領養沒辦成" : "嘗試生育沒懷上", false);
    else add("restrained","low","得知懷孕",false);
  }
  if(timeCtx && timeCtx.prologue) add("restrained","low","開局家庭背景描述",false);
  if(timeCtx && timeCtx.examCheck && timeCtx.examCheck.isFinal) add("restrained","high","高張力明牌檢定(期末考成績公布)",false);
  else if(timeCtx && timeCtx.examTriggered) add("restrained","low","期中考/期末考(考試當下)",false);
  if(s.pendingSideBusinessCardId) add("restrained","high","副業觸發抉擇",false);
  if(detectRelationshipTurningIntent(actionText) || s.marriageCrisisEventLog) add("restrained","high","告白/表態、分手/關係破裂、結婚",false);
  if(s.marriageCrisisArc) add("restrained", s.marriageCrisisArc.stage==="confrontation" ? "high" : "low", "婚姻危機（"+(s.marriageCrisisArc.stage==="surfacing"?"浮現":"攤牌")+"）", false); // 7.6.2（2026-09-27）
  if(s.careerEventLog){
    if(s.careerEventLog.type==="retirement") add("retrospect","high","人生階段轉換(退休)",false);
    else add("restrained","high","求職面試、轉職、升遷、創業啟動",false);
  }
  if(s.graduationEventLog) add("retrospect","high","人生階段轉換(畢業)",false);
  if(s.interestFormedEventLog) add("retrospect","low","興趣卡由候選正式成形",false);
  const mode = s.timeState.stageMode;
  if((mode==="highschool"||mode==="college") && !(timeCtx && timeCtx.prologue) && !(timeCtx && timeCtx.examTriggered)){
    const seg = YEAR_SEGMENTS[s.timeState.segmentIndex % YEAR_SEGMENTS.length];
    add("mutter","low", /準備期/.test(seg.key) ? "期中/期末準備期" : "學期日常", false);
  } else if(mode==="career" && s.careerStatus===CAREER_STATUS.EMPLOYED){
    add("mutter","low","工作日常",false);
  }
  // 1.2.8.7（2026-09-24拍板）：戀愛日常——目前有交往對象，且本回合沒有其他重大事件(沒有強制克制軌/回望軌/高張力類別)時，指定碎念軌低張力
  const hasPartner = (s.characters||[]).some(c=>c.active!==false && !c.deceased && ["dating","stable","married"].includes(c.romanceStatus));
  if(hasPartner && !hits.some(h=>h.forced || h.track==="retrospect" || h.tension==="high")) add("mutter","low","戀愛、友情日常互動",false);
  const rank = h => h.forced ? 0 : h.track==="retrospect" ? 1 : h.track==="restrained" ? 2 : 3;
  let chosen = hits.slice().sort((a,b)=>rank(a)-rank(b))[0] || { track:"restrained", tension:"low", category:"其他未歸類" };
  let tension = hits.some(h=>h.tension==="high") ? "high" : "low";
  let track = chosen.track, category = chosen.category;
  // 1.2.8.2.3：碎念軌最多連續3回合，第4回合改克制軌(低張力)，出現非碎念軌回合後重新計數
  if(track==="mutter" && (s.mutterStreak||0)>=MUTTER_STREAK_LIMIT){
    track = "restrained"; tension = "low"; category += "(碎念軌連續上限，改克制軌)";
  }
  return { tone_track:track, tension, category };
}
// 1.2.8.7（2026-09-24拍板）：關鍵事件揭露、告白/分手(關鍵字沒偵測到時的備援)，允許AI在事件發生時自行切換語氣軌，
// 透過tone_switch回報，程式依事件換算成實際語氣軌並記錄；其他值一律忽略
const TONE_SWITCH_EVENTS = {
  key_event_reveal: { tone_track:"restrained", tension:"high", category:"關鍵事件池(AI揭露時自行切換)" },
  relationship_turning: { tone_track:"restrained", tension:"high", category:"告白/表態、分手/關係破裂、結婚(AI回報)" }
};
function resolveEffectiveTone(planned, r){
  const sw = r && r.tone_switch && TONE_SWITCH_EVENTS[r.tone_switch];
  if(!sw) return { ...planned, switched:false };
  return { ...sw, switched:true, planned_tone_track: planned.tone_track };
}
function commitToneTrack(s, tone){ s.mutterStreak = tone.tone_track==="mutter" ? (s.mutterStreak||0)+1 : 0; }

// 二、2.8.1：「○月上旬～○月中旬」，上旬1~10日、中旬11~20日、下旬21日以後
function monthRangeText(a, b){
  const f = abs=>{ const t = calAbsToDate(abs); return `${t.m}月${t.d<=10?"上旬":t.d<=20?"中旬":"下旬"}`; };
  const x = f(a), y = f(b);
  return x===y ? x : `${x}～${y}`;
}
// ===== 一、1.2.9.11.2（2026-09-24新增）每回合送給AI的時間資訊 =====
function buildTimeContextPayload(s, timeCtx){
  const win = timeCtx && timeCtx.window;
  if(!win) return null;
  const cal = ensureCalendar(s);
  const prologue = !!timeCtx.prologue;

  const days = [];
  for(let a=win.start; a<=win.end && days.length<60; a++) days.push(calFormatMdw(a));
  return {
    is_prologue: prologue,
    year: calAbsToDate(win.start).y,
    previous_scene: prologue ? null : { date: calFormatMdw(cal.lastSceneDay), summary: cal.lastSceneSummary || "（沒有紀錄）" },
    round_start_date: calFormatMdw(win.start),

    round_days: win.end - win.start + 1,

    dates_by_offset: days, // scene_day_offset＝0,1,2…對應的日期與星期
    span_text: calSpanText(win.end - win.start + 1),

    fixed_events: collectFixedEvents(s, win),
    exam_countdown: buildExamCountdown(s, win),
    retry_note: timeCtx.retryNote || null
  };
}

    prev_life: c.prevLifeProfile && !c.deceased ? c.prevLifeProfile : undefined, // 七、7.4.3.3.1：這位家長是上一世的主角，說話方式與生活狀態要跟上一世一致

  if(isMalformedTurnResult(toolBlock.input)){

function isMalformedTurnResult(input){
  if(!input || typeof input!=="object") return true;

  if(!narrativeParagraphs(input.narrative).length) return true;
  if(Array.isArray(input.narrative) && input.narrative.some(p=>typeof p!=="string")) return true;
  if(typeof input.turn_summary!=="string" || !input.turn_summary.trim()) return true;
  if(!Array.isArray(input.choices)) return true;
  if(!input.is_ending && input.choices.length===0) return true; // 非結局回合choices不該是空陣列，呼應一、1.2.7「給3到4個選項」定案
  try{
    if(/<\/narrative>|<parameter\s+name=/.test(JSON.stringify(input))) return true;
  }catch(e){ return true; }
  return false;
}

function weightedPick(pairs){
  const total = pairs.reduce((s,p)=>s+p[1],0);
  let r = Math.random()*total;
  for(const [val,w] of pairs){ if(r<w) return val; r-=w; }
  return pairs[0][0];
}
