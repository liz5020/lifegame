  // 財富真實金額制：先用「跨過的月份數」結算舊的月收支，再套用這回合新的職業/支出/一次性交易
  const monthsCrossed = structured ? (timeCtx.monthsCrossed||0) : Math.round((r.age_advance||0)*12);
  if(monthsCrossed>0){
    // 十二、12.12（2026-09-20新增）：tenure_months隨月份邊界累加，供12.5升遷年資門檻／12.3薪資年資加成使用
    if(s.careerStatus===CAREER_STATUS.EMPLOYED) s.tenureMonths = (s.tenureMonths||0) + monthsCrossed;
    const totalExpenses = s.monthlyExpenses.reduce((sum,e)=>sum+e.amount,0);
    // 3.4.8 基本生活開銷：所有人生階段皆適用，依居住狀態決定，不再以occupationCategory為開關
    const livingCost = computeBaseLivingCost(s); // 3.4.11：已內含household共同生活分攤係數與子女扶養費
    // 三、3.4.11（2026-09-20新增）：household合併收入＝玩家個人月收入＋配偶月收入(若已婚)。配偶收入獨立追蹤(s.spouseIncome)，
    // 不直接併進s.monthlyIncome，避免玩家轉職時job_change覆寫monthlyIncome連帶把配偶收入也洗掉
    const householdMonthlyIncome = s.monthlyIncome + (s.spouseIncome||0);
    let net = Math.round((householdMonthlyIncome - totalExpenses - livingCost) * monthsCrossed);
    // 5.5存款下限保護（9/14新增）：學生時期(尚無正職)存款不能變成負值，修正原本會出現NT$-35,950這種不合理負債的bug
    if(!s.occupationCategory && s.cash + net < 0) net = -s.cash;
    s.cash += net;
    s.lastSettlement = { months: monthsCrossed, net, income:householdMonthlyIncome, expenses:totalExpenses+livingCost };
    // 資產模型（9/14新增）：房貸每月攤還本金（不含利息，簡化模型），還清時自動移除房貸支出項
    if(s.mortgageBalance>0){
      const mortgagePayment = s.monthlyExpenses.find(e=>e.label==="房貸")?.amount || 0;
      s.mortgageBalance = Math.max(0, s.mortgageBalance - mortgagePayment*monthsCrossed);
      if(s.mortgageBalance===0){
        s.monthlyExpenses = s.monthlyExpenses.filter(e=>e.label!=="房貸");
      }
    }
  } else {
    s.lastSettlement = null;
  }

  // 十二、職涯系統（2026-09-20新增，取代原本job_change由AI自由回報occupation_category/monthly_salary的舊機制）：
  // 求職/轉職/升遷/裁員/創業/退休全部改由結構化彈窗處理，觸發檢查見checkCareerTriggers(s)，AI不再回報薪資或職業類別
  checkCareerTriggers(s);
  (r.expense_change||[]).forEach(ec=>{
    if(!ec.label) return;
    if(ec.action==="end"){
      s.monthlyExpenses = s.monthlyExpenses.filter(e=>e.label!==ec.label);
    } else {
      const existing = s.monthlyExpenses.find(e=>e.label===ec.label);
      if(existing) existing.amount = ec.monthly_amount ?? existing.amount;
      else s.monthlyExpenses.push({ label:ec.label, amount: ec.monthly_amount||0 });
    }
  });
  // 三、3.9.1（2026-09-25）：單回合一次性收入合計不超過max_windfall_this_turn，超過的部分不入帳(支出不受影響)
  const windfallCap = computeMaxWindfall(s);
  const cappedTx = capWindfallTransactions(r.one_time_transaction, windfallCap);
  if(cappedTx.blocked>0) addReviewFlag(s, "windfall_capped", `一次性收入超過本回合上限${windfallCap}，${Math.round(cappedTx.blocked)}未入帳`);
  cappedTx.txs.forEach(tx=>{
    if(!tx || typeof tx.amount !== "number") return;
    // 5.5存款下限保護（9/14新增）：學生時期消費若超過目前存款，這筆消費「不會發生」，不是扣成負值
    if(!s.occupationCategory && tx.amount<0 && Math.abs(tx.amount) > s.cash) return;
    s.cash += tx.amount;
  });
  if(r.housing_choice && r.housing_choice.type && r.housing_choice.type!==(s.housing?.type)){
    const wasOwn = s.housing?.type==="own";
    const nowOwn = r.housing_choice.type==="own";
    // 七、7.5.3買房頭期款門檻檢查（9/15新增，取代原本無客戶端強制檢查的P2缺口）：
    // 現金不夠付頭期款，這次買房「不會成立」，整個housing_choice都不處理，狀態維持原樣，不會扣款也不會產生房產/房貸
    let purchaseBlocked = false;
    if(nowOwn && !wasOwn){
      const prospectiveMonthlyPayment = r.housing_choice.monthly_amount||0;
      const prospectiveMortgage = prospectiveMonthlyPayment*240;
      const prospectivePropertyValue = Math.round(prospectiveMortgage/0.8);
      const prospectiveDownPayment = prospectivePropertyValue - prospectiveMortgage;
      if(s.cash < prospectiveDownPayment) purchaseBlocked = true;
    }
    if(!purchaseBlocked){
      // 4.3事件狀態機制：客戶端結構化判斷「搬出家裡」「買房」，不假手AI
      if((r.housing_choice.type==="rent" || r.housing_choice.type==="own") && s.milestones.moved_out!=="completed"){
        s.milestones.moved_out = "completed";
        // 四、4.1.2（2026-09-20新增）：搬出家裡是解除原生家庭cohabiting標記的時機之一
        s.characters.filter(c=>/^父母|^手足|^隔代教養/.test(c.origin||"")).forEach(releaseCohabiting);
      }
      if(nowOwn && s.milestones.home_purchase!=="completed") s.milestones.home_purchase = "completed";
      // 資產模型（9/14新增）：賣房/轉租時，房產淨值扣掉剩餘房貸後變現為現金；買房時，估算房貸本金與房產市值，頭期款從現金扣除
      if(wasOwn && !nowOwn){
        s.cash += (s.propertyValue - s.mortgageBalance); // 賣房變現：市值減掉剩餘房貸，差額入帳
        s.propertyValue = 0;
        s.mortgageBalance = 0;
      }
      s.housing = { type:r.housing_choice.type, monthlyCost:r.housing_choice.monthly_amount||0 };
      s.monthlyExpenses = s.monthlyExpenses.filter(e=>e.label!=="房租" && e.label!=="房貸");
      if(r.housing_choice.monthly_amount>0){
        s.monthlyExpenses.push({ label: nowOwn ? "房貸" : "房租", amount:r.housing_choice.monthly_amount });
      }
      if(nowOwn && !wasOwn){
        // 簡化假設（測試參數，非設計文件定案）：20年期房貸、不含利息、貸款成數80%(LTV)
        const monthlyPayment = r.housing_choice.monthly_amount||0;
        s.mortgageBalance = monthlyPayment*240;
        s.propertyValue = Math.round(s.mortgageBalance/0.8);
        const downPayment = s.propertyValue - s.mortgageBalance;
        s.cash -= downPayment; // 頭期款從現金扣除
      }
    }
  }

  (r.new_characters||[]).forEach(nc=>{
    if(!nc.name) return;
    let name = String(nc.name).trim();
    const exists = s.characters.find(c=>c.name===name);
    if(exists){
      // 一、1.2.9.13（2026-09-24定案）：同名但家人稱謂不同(或一方是家人一方不是)才算衝突→自動改名另建新卡，下一回合告知AI；
      // 其餘(非家人稱謂的差異，例如「同學」對「高中同學」)視為同一人，沿用原本行為
      if(!isCharacterNameConflict(exists.relation, nc.relation)){ exists.active=true; exists.lastTurn=s.turnCount; return; }
      const renamed = renameForConflict(s, name, nc.relation);
      s.renameNotices = s.renameNotices || [];
      s.renameNotices.push({ original:name, renamed_to:renamed, relation:nc.relation||"", reason:`已經有一位叫「${name}」的角色（${exists.relation}）` });
      console.warn(`[角色同名] ${name}（${nc.relation}）與既有角色（${exists.relation}）衝突，改名為${renamed}`);
      name = renamed;
    }
    s.characters.push({
      name, relation:nc.relation||"", traits:nc.traits||"",
      dialogueStyle: DIALOGUE_STYLE_LIMITS[nc.dialogue_style] ? nc.dialogue_style : "normal", // 一、1.2.8.4.2：建卡時設定一次，之後固定不變
      affinity: clamp(nc.initial_affinity ?? 50,0,100),
      summary:"", lastTurn:s.turnCount, active:true, isChild:!!nc.is_child,
      origin: nc.origin||"", // 四、4.1（9/19新增）：認識時間／來源，AI建立新角色卡時提供
      // 七、7.3.5前置需求（2026-09-20新增）：子女出生/領養當下年齡為0，供成長節點與3.4.11扶養費三級判斷共用；
      // 四、4.1.2（2026-09-20新增）：子女預設同住(cohabiting)，直到7.3.5.2「成年離家」節點解除
      age: nc.is_child ? 0 : undefined,
      cohabiting: !!nc.is_child,
      parentingLog: nc.is_child ? [] : undefined
    });
    // 四、4.2.2（9/19新增）：is_child是既有結構化訊號，生育/領養自動判定完成
    if(nc.is_child && s.milestones.first_child!=="completed") s.milestones.first_child = "completed";
  });
  // 4.1.1顯示規則（2026-09-22改版，取代原本「每次互動只要有變就跳」的洗版式做法）：三層優先序——
  // 第1層戀愛狀態轉換／第2層關係狀態文字級距改變，當回合必定提示；第3層一般關係值增減，每位NPC累積尚未提示過的
  // 變化量（relationshipHintAccum），累積絕對值達RELATIONSHIP_HINT_ACCUM_THRESHOLD才提示一次並歸零。
  // 每回合最多顯示RELATIONSHIP_HINT_MAX_PER_TURN則，依tier排序取前幾則，沒被選中的（tier3的累積值）繼續保留，不丟棄
  const beforeRelationship = new Map(s.characters.map(c=>[c.name, { romanceStatus:c.romanceStatus||null, label:relationshipStatusLabel(c) }]));
  const relationshipHintCandidates = [];
  (r.character_updates||[]).forEach(cu=>{
    const c = s.characters.find(x=>x.name===cu.name);
    if(!c) return;
    const before = beforeRelationship.get(cu.name) || { romanceStatus:c.romanceStatus||null, label:relationshipStatusLabel(c) };
    const delta = cu.affinity_delta||0;
    c.affinity = clamp(c.affinity + delta,0,100);
    appendNpcSharedMemory(c, cu.summary_add);
    c.lastTurn = s.turnCount; c.active = true;
    applyRomanceSignal(s, c, cu.romantic_signal); // 四、4.4：AI只給positive/negative分類，狀態機轉換由客戶端判斷
    const nowStatus = c.romanceStatus||null;
    if(nowStatus !== before.romanceStatus){
      const transitionText = {
        ambiguous:`你和${c.name}之間，好像開始有點曖昧了`,
        dating:`你和${c.name}正式開始交往了`,
        stable:`你和${c.name}的感情穩定了下來`,
        breakup:`你和${c.name}，分開了`
      }[nowStatus];
      if(transitionText){ relationshipHintCandidates.push({ tier:1, text:transitionText }); return; }
    }
    const nowLabel = relationshipStatusLabel(c);
    if(nowLabel !== before.label){
      relationshipHintCandidates.push({ tier:2, text:`和${c.name}的關係好像不一樣了，現在更像是「${nowLabel}」` });
      return;
    }
    if(delta!==0){
      c.relationshipHintAccum = (c.relationshipHintAccum||0) + delta;
      if(Math.abs(c.relationshipHintAccum) >= RELATIONSHIP_HINT_ACCUM_THRESHOLD){
        const positive = c.relationshipHintAccum > 0;
        relationshipHintCandidates.push({ tier:3, text: positive ? `和${c.name}的關係更近了一些` : `和${c.name}的關係有點疏遠了` });
        c.relationshipHintAccum = 0;
      }
    }
  });
  // 四、4.3事件狀態機制：先依這回合最新的age刷新鎖定狀態，AI的回報才不會被「上一輪」的舊locked狀態誤擋
  refreshMilestoneLocks(s);
  // AI只能回報非auto的5個里程碑（信用卡/打工/戀愛/創業/結婚），且只能設completed/skipped，
  // 不能繞過客戶端的locked狀態，也不能動auto:true那5個（那5個完全由客戶端結構化判斷，見上方各處）
  const AI_REPORTABLE_MILESTONES = MILESTONE_DEFS.filter(d=>!d.auto).map(d=>d.id);
  (r.milestone_updates||[]).forEach(mu=>{
    if(!mu) return;
    const reportable = AI_REPORTABLE_MILESTONES.includes(mu.id);
    // 2026-09-20新增：first_child／home_purchase／moved_out這3個auto:true項目，額外開放AI只能回報skipped，
    // completed仍完全由客戶端結構化判斷（見下方各處直接寫s.milestones.xxx="completed"的既有邏輯），不受這裡影響
    const skipOnly = SKIP_ONLY_MILESTONES.includes(mu.id) && mu.status==="skipped";
    if(!reportable && !skipOnly) return;
    if(mu.status!=="completed" && mu.status!=="skipped") return;
    if(s.milestones[mu.id]==="locked") return;
    if(s.milestones[mu.id]==="completed") return; // 已結構化完成的不可被事後改回skipped
    s.milestones[mu.id] = mu.status;
    if(mu.id==="marriage_decision" && mu.status==="completed") applyMarriageDecisionCompletion(s);
    // 十二、12.11.1（2026-09-22補充）：家長退休是接手家業的第二個觸發來源
    if(mu.id==="parent_retirement" && mu.status==="completed") checkFamilyBusinessOnParentRetirement(s);
  });

  demoteStaleCharacters(relationshipHintCandidates); // 四、4.1.1：同住緩降造成的級距改變併入同一批候選一起排序/限額

  // 四、4.5（2026-09-20修正，QA手冊34.2「人生階段邊界回合的chronicle條目歸屬誤植」）：
  // updateLifeTrajectory()（內含ensureStageTransition的段落切換偵測）必須在這回合的chronicle.push()之前執行，
  // 否則階段切換偵測讀到的chronicle.length會已經包含這回合新增的條目，導致條目被誤歸進即將凍結的舊階段。
  // 提前到這裡執行後，切換偵測看到的是「上一回合為止」的舊長度，這回合稍後push的條目會落在新階段的
  // chronicleStart之後，正確歸屬到這回合實際所屬的新階段（技術判斷：事件發生在轉換當下，算新階段，非設計文件明文定案，可覆寫）。
  // forceEnding時的最後一段凍結改由takeTurn()呼叫AI之前的freezeFinalLifeStageForEnding()處理，這裡不重複凍結。
  if(!forceEnding) updateLifeTrajectory(s);
  // 六、6.2：填上freezeStageTrajectory()原本承接的空陣列——這回合若有破格時刻成立，記進目前(可能是剛切換的新)人生階段
  if(breakthroughFired && s.stageAccum) s.stageAccum.breakthroughEvents.push(breakthroughFired.label);

  const tagAge = structured ? s.age : ageAtEvent;
  const tagLabel = structured ? timeCtx.label : null;

  // 四、4.2.2（9/19新增）：achievement/setback類型受每人生階段2次上限管制，程式擋下超額觸發時整個不記錄，
  // 避免AI過度觸發把履歷洗成流水帳；其餘類型（既有里程碑等）不受影響，維持原本行為
  // 四、4.2.3（9/19改版）：不再設全域總量上限、不做FIFO淘汰——總量已由上面的分階段2次上限自然封頂（8階段×2＝16則），
  // 取代原本「超過10則捨棄最舊」的做法（會優先丟掉童年/學生時期紀錄，讓死亡結局判定讀不到早年人生軌跡）
  if(r.major_event_summary && shouldRecordJudgedMajorEvent(s, r.major_event_type)){
    s.chronicle.push(`（${tagLabel || (tagAge+"歲")}）${r.major_event_summary}`);
  }

  // bug修正（9/14，人生草稿0914測試.pdf）：結算顯示的「目前存款」之前是每次都讀取最新的s.cash，
  // 導致歷史回合全部顯示同一個（最新的）數字。這裡把「這回合結算完當下」的存款快照存進settlement，
  // 讓每一則日記顯示自己那個時間點的正確存款，不是被之後回合覆蓋的最新值。
  if(s.lastSettlement) s.lastSettlement.balanceAfter = s.cash;

  // 九、大學科系系統（9/16新增）：放在財務結算之後，確保lowCashStreak判斷的是這回合結算完的最新現金水位
  sweepUniversityState(s);
  // 七、7.3.5（2026-09-20新增）：子女成長節點檢查，不依賴大學狀態，任何人生階段都可能有子女
  checkParentingGrowthNode(s);
  // 七、7.6（2026-09-20新增）：關係投入節點＋婚姻危機候選檢查
  checkRelationshipInvestmentNode(s);
  sweepMarriageCrisisCandidate(s);
  // 七、7.6.1.1（2026-09-22新增）：同居觸發入口檢查
  checkCohabitationOffer(s, actionText);

  // 可見數值變化顯示（9/15新增）：算出這回合實際變化量（含所有倍率/邊際遞減/衰退後的最終結果），四捨五入後只保留真的有變化的項目
  const statChanges = {};
  Object.keys(VISIBLE_STAT_LABELS).forEach(k=>{
    const after = k==="appearance" ? s.appearance : s.stats[k];
    const diff = Math.round(after - beforeVisibleStats[k]);
    if(diff!==0) statChanges[k] = diff;
  });

  // 四、4.1.1：候選依tier排序（1戀愛狀態轉換／2級距改變／3一般累積），每回合最多顯示RELATIONSHIP_HINT_MAX_PER_TURN則；
  // Array.prototype.sort為穩定排序，同tier內維持原本互動發生的順序
  const relationshipHints = relationshipHintCandidates
    .slice()
    .sort((a,b)=>a.tier-b.tier)
    .slice(0, RELATIONSHIP_HINT_MAX_PER_TURN)
    .map(h=>h.text);
  // 四、4.2.1.1（9/19新增）：AI每回合順便回傳turn_summary（1-2句話），供這則日記日後被擠出「最近3回合」視窗時使用，不用另外呼叫API生成
  // 一、1.2.9.11.4（2026-09-24新增）：記下新場景日期與摘要，供下一回合的previous_scene使用；
  // 違規兩次仍照常顯示時，日期夾回本回合範圍內，避免之後的回合被錯誤日期帶偏
  let sceneDate = null;
  if(timeCtx && timeCtx.window){
    const win = timeCtx.window;
    const off = Number.isInteger(r.scene_day_offset) ? clamp(r.scene_day_offset, 0, win.end-win.start) : 0;
    s.timeState.cal.lastSceneDay = win.start + off;
    s.timeState.cal.lastSceneSummary = String(r.scene_summary || r.turn_summary || "").slice(0,80);
    sceneDate = calFormat(win.start + off);
  }
  // 一、1.2.9.7：伏筆狀態由程式記錄
  applyForeshadowUpdates(s, r);
  // 一、1.2.9.11.3（2026-09-24新增）：敘事分成「行動結果」＋「時間推進後的新場景」兩段依序呈現；
  // 1.2.8.4.2：{{名字|台詞}}依角色dialogue_style截斷後換成「台詞」，沒用這個格式的文字照常顯示
  const composedText = [r.action_result, r.narrative].map(t=>String(t||"").trim()).filter(Boolean).join("\n\n");
  const dialogue = processDialogueMarkup(s, composedText);
  dialogue.notes.forEach(n=>{ console.warn("[台詞上限]", n); addReviewFlag(s, "dialogue_limit", n); });
  // 一、1.2.9.6：回合標題副標(AI產生)，畫面顯示「時期標籤｜副標」
  const subtitle = r.chapter_subtitle ? String(r.chapter_subtitle).trim().slice(0,30) : "";
  s.log.push({age:tagAge, timeLabel:tagLabel, subtitle, sceneDate, text:dialogue.text, turnSummary:r.turn_summary||"", settlement:s.lastSettlement, statChanges, relationshipHints});
  // 介面：回憶錄（9/19新增，回應「畫面上舊日記消失」的困擾）：上限從60大幅提高到2000，
  // 足夠涵蓋單一人生全程(~1200-1400回合)不流失；每世reincarnate/succeedAsChild時log都會重置為[]，不會跨世累積
  if(s.log.length>2000) s.log.shift();

  s.choices = r.choices || [];

  // 七、7.1.5（9/16改版）：死亡結局現在完全由client端的forceEnding決定，AI不能自行發起結局——
  // 取代原本「意外死亡需滿足19歲以上+已有前兆」的防呆邏輯，因為AI已經不再有判斷「要不要死」的空間，只剩forceEnding這一道閘門
  if(r.is_ending && forceEnding){
    s.phase = "ending";
    // 七、7.1.4（9/20改版）：不再有title/summary，改為三層結構的人生總結

async function startLife(){

  const ap = ensureAP(state);
  if(ap.giftPending){
    ap.giftPending = false;
    const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
    const slotRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
    if(key){
      const claim = await claimNewLifeGift(key, slotRaw!==null ? Number(slotRaw) : 0);
      // 10.3.11（2026-09-25）：真實模式以Worker回傳的伺服器端餘額為準；mock模式或Worker連不上時維持本機計算
      if(!USE_MOCK && claim.ap) syncServerAP(state, claim.ap);
      else if(claim.granted) ap.gift = AP_NEW_LIFE_GIFT;
    }

  state.phase = "playing";

function reincarnate(){

    chronicleCarry: `前世走完了一生${state.ending?.epitaph ? "，最後留下一句：「"+state.ending.epitaph+"」" : ""}，帶著一絲餘蔭轉生。`,

function economicTierForSavingsAmount(savings){

function rollEconomicTierForced(tier){

// 十、10.3.6／10.3.7（2026-09-23新增，取代原本hardReset()「清空這個slot、同格重新取名」）：
// 「就此闔卷」(死亡且不傳承,reason="ended")與「刪除這段人生」(reason="deleted")都讓這條人生結束——
// 移到唯讀的人生回顧區、空出格子；禮包點消失，購買點全部移到金鑰錢包（由Worker在/archive裡加總）
async function endLife(reason){
  // 十五、人生之書：封存前把還沒寫完的章節等完(最多90秒)，人生回顧裡才看得到完整的書；刪除人生不等
  if(reason!=="deleted" && state && state.book && state.book.chapters.some(c=>c.status!=="done")){
    state.book.chapters.forEach(c=>{ if(c.status==="failed") c.status = "pending"; }); // 失敗的章節封存前再試最後一次
    document.getElementById("app").insertAdjacentHTML("afterbegin", `<div class="loading" id="book-finishing">正在把最後一章寫進人生之書…</div>`);
    await waitForBook(90000);
  }
  closeBookPage();
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  const slotRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
  const slot = slotRaw!==null ? Number(slotRaw) : null;
  const ap = ensureAP(state);
  const endedAt = Date.now();
  const id = endedAt.toString(36) + Math.random().toString(36).slice(2,8);
  const meta = { name:state.name, age:state.age, stage:stageLabel(state.age), reincarnations:state.reincarnations||0, reason, endedAt };
  const purchased = ap.purchased;
  const archivedState = JSON.parse(JSON.stringify(state));
  archivedState.snapshot = null;
  archivedState.ap = { daily:0, gift:0, purchased:0, lastRefillDate:ap.lastRefillDate };
  try{ localStorage.removeItem(STORAGE_KEY+(slot!==null?":"+slot:"")); }catch(e){}
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} // 相容改版前沒有slot後綴的殘留資料
  try{ localStorage.removeItem(ACTIVE_SLOT_STORAGE_NAME); }catch(e){}
  cloudSyncStatus = null;
  if(!key || slot===null){ state = { phase:"keyChoice" }; render(); return; } // 防呆：理論上進得了遊戲畫面一定有金鑰+slot
  let archivedOnCloud = false;
  try{
    const res = await fetch(WORKER_URL+"archive", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ key, slot, id, meta, purchased, state: archivedState })
    });
    const data = await res.json();
    archivedOnCloud = res.ok && data && data.success===true;
  }catch(e){ console.warn("雲端封存人生失敗，改存本機", e); }
  if(!archivedOnCloud){
    try{
      const list = JSON.parse(localStorage.getItem(ARCHIVE_LOCAL_PREFIX+key) || "[]");
      list.push({ id, meta, state: archivedState });
      localStorage.setItem(ARCHIVE_LOCAL_PREFIX+key, JSON.stringify(list));
    }catch(e){ console.warn("本機封存也失敗（可能超過瀏覽器容量）", e); }
  }
  await showSlotPicker(key);
}

// ========== 十五、人生之書：章節成書（2026-09-25新增，佇列批次6，【定案草稿】待使用者確認） ==========
// 每換一個人生階段(高中→大學／技職→初入社會→職涯發展→中年→老年)成一章；同一階段超過5個遊戲年，每5年另成一章；
// 人生結束(死亡)那一回合把最後一段也收成一章。素材只用每回合的turn_summary與重大事件，不送完整敘事(控制成本)。
// 背景生成、不扣行動點、不影響任何遊戲數值；失敗可稍後重試，不影響遊玩
const BOOK_MAX_YEARS_PER_CHAPTER = 5;        // 【定案草稿,十五、15.1】
const BOOK_MAX_SUMMARIES_PER_CHAPTER = 150;  // 【測試參數,15.2】素材上限，超過就平均抽樣(有重大事件的回合一定保留)
const BOOK_AUTO_RETRY_MAX = 3;               // 【測試參數,15.5】失敗後每回合結束自動重試一次，最多3次；之後只能手動重試
let MOCK_CHAPTER_FAIL_RATE = 0;              // 🛠面板可調，測試失敗重試用
let MOCK_CHAPTER_DELAY_MS = 600;
let bookInFlight = null;                     // 目前正在生成的Promise(一次只生成一章)
const CHINESE_NUMS = ["零","一","二","三","四","五","六","七","八","九","十"];
function chineseNum(n){
  if(n<=10) return CHINESE_NUMS[n];
  if(n<20) return "十"+(n%10?CHINESE_NUMS[n%10]:"");
  return CHINESE_NUMS[Math.floor(n/10)]+"十"+(n%10?CHINESE_NUMS[n%10]:"");
}
function bookStageOf(s){
  const mode = s.timeState && s.timeState.stageMode;
  if(mode==="highschool") return { key:"highschool", label:"高中" };
  if(mode==="college") return { key:"college", label:"大學／技職" };
  if(s.age<30) return { key:"adult-early", label:"初入社會" };
  if(s.age<=45) return { key:"adult-career", label:"職涯發展" };
  if(s.age<=60) return { key:"adult-middle", label:"中年" };
  return { key:"adult-old", label:"老年" };
}
function ensureBook(s){
  if(!s.book) s.book = { chapters:[], draft:null, unseen:0, seq:0 };
  // 讀檔時上一次沒寫完的(頁面關掉)改回待寫
  if(!bookInFlight) s.book.chapters.forEach(c=>{ if(c.status==="writing") c.status = "pending"; });
  return s.book;
}
// 每回合成功套用結果後呼叫：先判斷要不要收成一章，再把這回合的摘要放進目前這一章的素材
function bookAfterTurn(s, r, forceEnding){
  const book = ensureBook(s);
  const st = bookStageOf(s);
  const d = book.draft;
  if(d && (d.key!==st.key || s.age - d.startAge >= BOOK_MAX_YEARS_PER_CHAPTER)) closeBookDraft(s);
  if(!book.draft){
    book.draft = { key:st.key, label:st.label, startAge:s.age, endAge:s.age, startTurn:s.turnCount, items:[], events:[] };
  }
  const draft = book.draft;
  const last = s.log[s.log.length-1] || {};
  const summary = String(r.turn_summary||"").trim();
  if(summary) draft.items.push({ t: last.timeLabel || (s.age+"歲"), s: summary.slice(0,200), d: last.sceneDate || null, ev: !!r.major_event_summary });
  // 重大事件：取這回合新增的人生大事記(chronicle)——包含AI回報的major_event_summary，以及程式自己記的大事(重大疾病、父母過世等)
  const chron = s.chronicle || [];
  if(typeof book.chronicleSeen!=="number" || book.chronicleSeen > chron.length) book.chronicleSeen = Math.min(book.chronicleSeen||0, chron.length);
  chron.slice(book.chronicleSeen).forEach(e=>draft.events.push(String(e).slice(0,120)));
  book.chronicleSeen = chron.length;
  draft.endAge = s.age;
  if(!draft.dateFrom && last.sceneDate) draft.dateFrom = last.sceneDate;
  if(last.sceneDate) draft.dateTo = last.sceneDate;
  if(forceEnding || s.phase==="ending") closeBookDraft(s);
}
function closeBookDraft(s){
  const book = ensureBook(s);
  const d = book.draft;
  book.draft = null;
  if(!d || !d.items.length) return null;
  book.seq = (book.seq||0) + 1;
  const part = book.chapters.filter(c=>c.key===d.key).length + 1;
  const ch = {
    id: (s.lifeId||"life") .replace(/[^a-z0-9]/g,"").slice(0,20) + "c" + book.seq,
    index: book.chapters.length + 1,
    key: d.key, label: d.label, part,
    ageFrom: d.startAge, ageTo: d.endAge, dateFrom: d.dateFrom||null, dateTo: d.dateTo||null,
    items: d.items, events: d.events,
    status: "pending", attempts: 0, lastAttemptTurn: null,
    createdTurn: s.turnCount, title: null, text: null
  };
  book.chapters.push(ch);
  return ch;
}
function sampleChapterItems(items){
  if(items.length<=BOOK_MAX_SUMMARIES_PER_CHAPTER) return items;
  const keep = new Set(items.map((it,i)=>it.ev?i:-1).filter(i=>i>=0));
  const slots = Math.max(0, BOOK_MAX_SUMMARIES_PER_CHAPTER - keep.size);
  for(let k=0;k<slots;k++) keep.add(Math.floor(k*items.length/slots));
  return [...keep].sort((a,b)=>a-b).slice(0,BOOK_MAX_SUMMARIES_PER_CHAPTER).map(i=>items[i]);
}
function chapterStageText(ch){
  return ch.label + (ch.part>1 ? `（${chineseNum(ch.part)}）` : "");
}
function buildChapterMaterial(s, ch){
  const book = ensureBook(s);
  const prev = book.chapters.filter(c=>c.index<ch.index && c.status==="done").slice(-1)[0];
  return {
    player_name: s.name, gender: s.gender,
    chapter_index: ch.index, stage_label: chapterStageText(ch),
    age_from: ch.ageFrom, age_to: ch.ageTo, date_from: ch.dateFrom, date_to: ch.dateTo,
    turn_summaries: sampleChapterItems(ch.items).map(it=>({ t:it.t, s:it.s })),
    major_events: (ch.events||[]).slice(-60),
    characters: (s.characters||[]).slice(0,40).map(c=>({ name:c.name, relation:c.relation })),
    previous_chapter_title: prev ? prev.title : null
  };
}
async function callChapterAI(s, ch){
  const res = await fetch(WORKER_URL, {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      kind:"chapter",
      key: localStorage.getItem(RECOVERY_KEY_STORAGE_NAME),
      slot: Number(localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME)),
      life_id: ensureLifeId(s), chapter_id: ch.id,
      messages: [{ role:"user", content: JSON.stringify(buildChapterMaterial(s, ch)) }]
    })
  });
  const text = await res.text();
  let data; try{ data = JSON.parse(text); }catch(e){ throw new Error("章節回應不是合法JSON（HTTP "+res.status+"）"); }
  if(!res.ok) throw new Error("章節生成失敗 "+res.status+"："+(data?.error?.message||""));
  if(data && data.lifegame && data.lifegame.usage) lastChapterUsage = data.lifegame.usage;
  const block = (data.content||[]).find(b=>b.type==="tool_use" && b.name==="submit_chapter");
  if(!block || !block.input) throw new Error("回應裡沒有submit_chapter");
  return block.input;
}
let lastChapterUsage = null;
async function mockGenerateChapter(s, ch){
  await new Promise(r=>setTimeout(r, MOCK_CHAPTER_DELAY_MS));
  if(Math.random() < MOCK_CHAPTER_FAIL_RATE) throw new Error("模擬章節生成失敗");
  const m = buildChapterMaterial(s, ch);
  const paras = [];
  paras.push(`〔模擬章節〕這是mock模式依素材拼出來的示意正文，真實API才會寫成小說。`);
  m.turn_summaries.forEach(it=>paras.push(`${it.t}。${it.s}`));
  m.major_events.forEach(e=>paras.push(e));
  let text = paras.join("\n\n");
  while(Array.from(text).length < 1500) text += "\n\n窗外的光慢慢移過桌面，你把杯子裡剩下的水喝完。";
  return { title: `${m.stage_label}的日子`, text: Array.from(text).slice(0,2500).join("") };
}
async function generateChapter(s, ch){
  ch.status = "writing"; ch.attempts = (ch.attempts||0)+1; ch.lastAttemptTurn = s.turnCount;
  try{
    const out = USE_MOCK ? await mockGenerateChapter(s, ch) : await callChapterAI(s, ch);
    const title = String(out.title||"").replace(/^第.{1,4}章[\s　:：]*/,"").trim().slice(0,20);
    const text = String(out.text||"").trim();
    if(!title || Array.from(text).length < 300) throw new Error("章節內容過短或沒有章名");
    ch.title = title; ch.text = text; ch.status = "done"; ch.error = null;
    delete ch.items; delete ch.events; // 寫好後素材用不到了，減少存檔大小
    const book = ensureBook(s);
    if(!book.chapters.includes(ch)) return; // 這一章在生成途中被反悔撤掉了
    book.unseen = (book.unseen||0) + 1;
    if(state===s){ saveGame(); showBookToast(); refreshBookPage(); updateBookLink(); }
  }catch(e){
    console.warn("章節生成失敗，之後會再試：", e);
    ch.status = "failed"; ch.error = String(e && e.message || e).slice(0,200);
    if(state===s){ saveGame(); refreshBookPage(); }
  }
}
// 依序把待寫的章節寫完。autoRetry=true時，失敗的章節(自動重試未滿3次、這回合還沒試過)也重試一次
function processBookQueue(autoRetry){
  const s = state;
  if(!s || !s.book || bookInFlight) return bookInFlight;
  const next = s.book.chapters.find(c=>c.status==="pending" ||
    (autoRetry && c.status==="failed" && (c.attempts||0) < BOOK_AUTO_RETRY_MAX && c.lastAttemptTurn!==s.turnCount));
  if(!next) return null;
  const p = generateChapter(s, next).finally(()=>{ if(bookInFlight===p) bookInFlight = null; if(state===s) processBookQueue(false); });
  bookInFlight = p;
  return p;
}
function retryChapter(id){
  const ch = state && state.book && state.book.chapters.find(c=>c.id===id);
  if(!ch || ch.status!=="failed") return;
  ch.status = "pending";
  refreshBookPage();
  processBookQueue(false);
}
// 人生結束前把還沒寫完的章節等完(最多等maxMs)，讓封存到人生回顧的是完整的書
async function waitForBook(maxMs){
  const deadline = Date.now() + (maxMs||90000);
  while(Date.now() < deadline){
    const p = processBookQueue(false);
    if(!p) return;
    await Promise.race([p, new Promise(r=>setTimeout(r, Math.max(0, deadline-Date.now())))]);
  }
}
function showBookToast(){
  if(!state || (state.phase!=="playing" && state.phase!=="ending")) return;
  document.getElementById("book-toast")?.remove();

  document.body.appendChild(div);
  setTimeout(()=>div.remove(), 6000);
}
function bookLinkText(s){

}
function updateBookLink(){

}
let bookPageCtx = null; // { book, readOnly, owner, openId }
function openBookPage(book, opts){
  bookPageCtx = { book, readOnly: !!(opts && opts.readOnly), owner: (opts && opts.owner) || "", openId: null };
  if(!bookPageCtx.readOnly && book && book.unseen){ book.unseen = 0; saveGame(); updateBookLink(); }
  refreshBookPage(true);
}
function closeBookPage(){ document.getElementById("book-page")?.remove(); bookPageCtx = null; }
function refreshBookPage(create){

  if(!page){
    page = document.createElement("div");

  }
  const { book, readOnly, owner, openId } = bookPageCtx;
  const chapters = (book && book.chapters) || [];
  const ch = openId ? chapters.find(c=>c.id===openId) : null;
  if(ch && ch.status==="done"){
    page.innerHTML = `

        <div class="book-chapter-head">
          <div class="book-chapter-no">第${chineseNum(ch.index)}章・${escapeHtml(chapterStageText(ch))}・${ch.ageFrom===ch.ageTo?ch.ageFrom:ch.ageFrom+"－"+ch.ageTo}歲</div>

        </div>

        <button class="ghost-btn" id="btn-book-back2">← 回到目錄</button>
      </div>`;
    page.scrollTop = 0;
    page.querySelectorAll("#btn-book-back,#btn-book-back2").forEach(b=>b.onclick = ()=>{ bookPageCtx.openId = null; refreshBookPage(); });
    return;
  }
  const statusText = (c)=> c.status==="done" ? "" : c.status==="failed" ? (readOnly ? "這一章沒有寫成" : "這一章還沒寫成") : (readOnly ? "這一章沒有寫成" : "旁白正在寫這一章…");
  const draft = book && book.draft;
  page.innerHTML = `
    <div class="book-inner">
      <div class="book-cover">
        <div class="book-cover-sub">${escapeHtml(owner||"")}</div>
        <h2>人生之書</h2>
      </div>
      ${chapters.length ? `<ol class="book-toc">${chapters.map(c=>`
        <li class="book-toc-item${c.status==="done"?" is-done":""}" ${c.status==="done"?`data-open="${c.id}"`:""}>
          <div class="book-chapter-no">第${chineseNum(c.index)}章・${escapeHtml(chapterStageText(c))}・${c.ageFrom===c.ageTo?c.ageFrom:c.ageFrom+"－"+c.ageTo}歲</div>
          <div class="book-toc-title">${c.status==="done" ? escapeHtml(c.title) : `<span style="color:var(--ink-soft);">${statusText(c)}</span>`}</div>
          ${(!readOnly && c.status==="failed") ? `<button class="ghost-btn book-retry" data-retry="${c.id}">重試</button>` : ``}
        </li>`).join("")}</ol>` : `<p class="book-empty">還沒有任何一章。每走完一個人生階段（或同一階段每5年），旁白會把這段日子整理成一章。</p>`}
      ${(!readOnly && draft && draft.items && draft.items.length) ? `<p class="book-empty">現在這一章（${escapeHtml(draft.label)}）還在發生中。</p>` : ``}
      <button class="ghost-btn" id="btn-book-close">關閉</button>
    </div>`;
  page.querySelectorAll("[data-open]").forEach(li=>li.onclick = ()=>{ bookPageCtx.openId = li.dataset.open; refreshBookPage(); });
  page.querySelectorAll("[data-retry]").forEach(b=>b.onclick = (ev)=>{ ev.stopPropagation(); retryChapter(b.dataset.retry); });
  document.getElementById("btn-book-close").onclick = closeBookPage;
}

async function showArchiveList(key){
  let items = [];
  try{
    const res = await fetch(WORKER_URL+"archives?key="+encodeURIComponent(key));
    const data = await res.json();
    if(data && data.success && Array.isArray(data.archives)) items = data.archives.map(a=>({ id:a.id, meta:a.meta||{}, source:"cloud" }));
  }catch(e){ console.warn("讀取人生回顧清單失敗", e); }
  try{

      if(!items.some(x=>x.id===a.id)) items.push({ id:a.id, meta:a.meta||{}, source:"local" });
    });
  }catch(e){}
  items.sort((a,b)=>(b.meta.endedAt||0)-(a.meta.endedAt||0));
  state = { phase:"archiveList", items };
  render();
}
function renderArchiveList(){

function renderProgressStrip(s){
  if(!s.timeState) return ``;
  const timeLabel = computeTimeLabel(s);
  const progress = computeStageProgress(s);
  const pct = progress && progress.total>0 ? clamp(Math.round(progress.current/progress.total*100),0,100) : 0;
  return `
  <div class="progress-strip">
    <div class="prow"><b>${escapeHtml(timeLabel)}</b>${progress ? `<span>${progress.label}　${progress.current}/${progress.total}</span>` : ``}</div>
    ${progress ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>` : ``}
  </div>`;
}
function ledgerRow(label,val){
  // bug修正（9/14，人生草稿0914測試.pdf）：底層數值（例如邊際遞減後的才識/人脈）是浮點數，
  // 不影響計算精度，但呈現層要四捨五入成整數再顯示，不能把25.130356487721這種原始浮點數丟給玩家看
  return `<div class="ledger-row"><span class="lbl">${label}</span><span class="dots"></span><span class="val">${Math.round(val)}</span></div>`;
}
function renderStatChanges(statChanges){
  // 可見數值變化顯示（9/15新增）：跟財富結算小字同一種呈現邏輯，只在真的有變化時才顯示
  if(!statChanges) return ``;
  const parts = Object.keys(VISIBLE_STAT_LABELS)
    .filter(k=>statChanges[k])
    .map(k=>{
      const v = statChanges[k];
      const color = v>0 ? "var(--teal)" : "var(--stamp)";
      return `<span style="color:${color};">${VISIBLE_STAT_LABELS[k]}${v>0?'+':''}${v}</span>`;
    });
  if(parts.length===0) return ``;
  return `<p style="font-size:11px;color:var(--ink-soft);margin-top:6px;">本回合數值變化：${parts.join("　")}</p>`;
}
function renderRelationshipHints(hints){
  // 4.1.1顯示規則（9/16新增）：關係變化用方向性提示呈現，不精確報數字，跟renderStatChanges並列在日記下方
  if(!hints || hints.length===0) return ``;
  return `<p style="font-size:11px;color:var(--ink-soft);margin-top:4px;">${hints.map(h=>escapeHtml(h)).join("；")}</p>`;

function rosterCard(c,isBg){
  // 4.1.1顯示規則（9/16改版）：列表卡片以文字化狀態為主，不裸露0-100數字；點擊可叫出詳細頁
  const category = relationCategoryLabel(c);
  return `<div class="rcard ${isBg?'bg':''}" data-npc="${escapeHtml(c.name)}">
    <div class="name">${escapeHtml(c.name)}</div>
    <div class="rel">${escapeHtml(category)}</div>
    <div class="status-text">${escapeHtml(relationshipStatusLabel(c))}</div>
  </div>`;
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function renderPlainParagraphs(text){
  // 1.2.8.4.2防呆：舊日記或沒被處理到的{{名字|台詞}}標記，一律當成「台詞」顯示
  return String(text).replace(/\{\{[^|{}]+\|([^{}]*)\}\}/g, "「$1」").split(/\n{1,}/).map(p=>p.trim()).filter(Boolean)
    .map(p=>`<p>${escapeHtml(p)}</p>`).join("");
}
// 一、1.2.9.4（2026-09-24實作）：〔文件:標題〕…〔/文件〕渲染成獨立文件框，其餘照一般段落顯示
function renderParagraphs(text){
  return String(text).split(/(〔文件[:：][^〕]*〕[\s\S]*?〔\/文件〕)/).map(part=>{
    const m = part.match(/^〔文件[:：]([^〕]*)〕([\s\S]*?)〔\/文件〕$/);
    if(!m) return renderPlainParagraphs(part);
    return `<div class="doc-box"><div class="doc-title">${escapeHtml(m[1].trim())}</div>${renderPlainParagraphs(m[2])}</div>`;
  }).join("");
}

}

// 9.5.1 轉系結果判定：抽出成純函式方便測試，不依賴DOM。mainChoice: "stay"/"apply"/"wait"；targetKey僅在apply時需要
// 十一、11.4（2026-09-23新增）：收錄為明牌檢定節點，回傳{success,roll,probPct,majorLabel}供UI揭曉骰值細節，取代原本直接Math.random()判定不現骰值的做法
function resolveTransferOffer(s, mainChoice, targetKey){
  s.transferCooldown = TRANSFER_COOLDOWN_TURNS;
  s.examBelowExpectationStreak = 0;
  if(mainChoice==="apply" && targetKey){
    const cat = findMajorCategory(targetKey);
    if(!cat) return null;
    // 9.5.1【定案】結果判定複用2.4考試成績算法精神：知識值+自律程度換算成功機率，不另設新公式
    const probPct = Math.round(clamp(0.3 + (s.stats.knowledge/100)*0.5 + (s.conscientiousness.selfDiscipline-50)/200, 0.1, 0.95) * 100); // 【測試參數】
    const roll = rnd(1,100);
    const success = roll <= probPct;
    if(success){
      const isFive = cat.isFiveYearEligible && isTransferFeasible(s.age,5,s.collegeDelayYearsUsed);
      assignStudentMajor(s, targetKey, isFive);
      s.timeState.yearInStage = 1; // 9.5.1【定案】不做學分抵免判斷，一律從大一重新起算
      s.universityEventLog = { type:"transfer_success", major: cat.label };
    } else {
      s.universityEventLog = { type:"transfer_failed", major: cat.label };
    }
    return { success, roll, probPct, majorLabel: cat.label };
  } else if(mainChoice==="stay"){
    s.universityEventLog = { type:"transfer_declined" };
  }
  return null;
}

// 9.5.3 休學/肄業決定：choice = "leave"/"withdraw"/"stay"
function resolveWithdrawalOffer(s, choice){
  // 9.8.1（2026-09-22修正）：休學可用條件改為兩項都要成立，不再只看delay_years上限（防呆，UI也會先擋，這裡是程式層再把關一次）
  if(choice==="leave" && !isAnotherLeaveFeasible(s)) return;
  if(choice==="leave"){
    // 9.8：delay_years最小粒度0.5年對應休一學期，記一次0.5年代價（只作帳本用途，不再加進畢業門檻，見9.8.1）
    s.collegeDelayYearsUsed = clamp((s.collegeDelayYearsUsed||0)+0.5, 0, COLLEGE_DELAY_CAP);
    // 9.5.3（9/16補充）：記錄休學當下正在哪個學期（上學期0~6段 or 下學期7~13段），供復學時重置回該學期開頭，該學期視為未完成不計入進度
    s.leaveSemesterHalfIndex = (s.timeState.segmentIndex||0) < SEMESTER_PHASES.length ? 0 : SEMESTER_PHASES.length;
    s.leaveStatus = "onLeave";
    s.leaveResumeCountdown = LEAVE_OF_ABSENCE_TURNS;
    s.lowHealthStreak = 0; s.lowCashStreak = 0; // 復學視為重新開始，不然同樣的低點會立刻再次觸發候選
    s.universityEventLog = { type:"leave_of_absence" };
  } else if(choice==="withdraw"){
    s.studentStatus = "withdrawn"; // 九、9.5.3（2026-09-22定案）：肄業後不可重新入學，本函式與其他任何地方都不會把studentStatus從withdrawn改回enrolled
    s.timeState.stageMode = "career";
    applyHalfYearCarryOnCareerEntry(s); // 9.8.1：帶著halfYearCarry=1肄業時，當年度回合預算設為一半
    s.universityEventLog = { type:"withdrawn" };
  }
}

function renderEnding(){
  const s = state;
  const kids = eligibleChildren();
  const canSucceed = s.ending.successionAvailable && kids.length>0;
  // 七、7.1.4（9/20改版）：不顯示任何標籤、分數、排名。
  // 依序是 L1段落回顧 →（階段之間）L2變化句 → L3墓誌銘。
  // 舊存檔相容：9/20以前的存檔只有title/summary，沒有segments，降級成單段顯示不讓畫面爆掉。
  const segs = s.ending.segments || (s.ending.summary ? [{label:"", text:s.ending.summary}] : []);
  const transByStage = {};
  (s.ending.transitions||[]).forEach(t=>{ if(t && t.after_stage) transByStage[t.after_stage] = t.text||""; });
  const summaryHtml = segs.map(seg=>{
    const trans = transByStage[seg.stage];
    return `
    <div style="text-align:left;margin-bottom:14px;">
      ${seg.label ? `<div class="k" style="margin-bottom:4px;">${escapeHtml(seg.label)}${seg.age_from!=null?`（${seg.age_from}－${seg.age_to}歲）`:""}</div>` : ``}
      <p style="font-size:14.5px;margin:0;">${escapeHtml(seg.text||"")}</p>
    </div>
    ${trans ? `<p style="font-size:14px;opacity:.75;text-align:left;margin:0 0 14px;">${escapeHtml(trans)}</p>` : ``}`;
  }).join("");
  return `
  <div class="center-screen">
    <div class="stamp" style="margin:0 auto 14px;"><b>${s.age}</b>歲</div>
    ${summaryHtml}
    ${s.ending.epitaph ? `<div class="end-title" style="font-size:18px;line-height:1.7;margin:18px 0 10px;">${escapeHtml(s.ending.epitaph)}</div>` : ``}
    <div class="roll-grid">
      <div class="roll-item"><div class="k">存款</div><div class="v" style="font-size:15px;">${s.cash.toLocaleString()}</div></div>
      <div class="roll-item"><div class="k">健康</div><div class="v">${Math.round(s.stats.health)}</div></div>
      <div class="roll-item"><div class="k">才識</div><div class="v">${Math.round(s.stats.knowledge)}</div></div>
      <div class="roll-item"><div class="k">人脈</div><div class="v">${Math.round(s.stats.network)}</div></div>
      <div class="roll-item"><div class="k">福緣</div><div class="v">${s.luckHidden}</div></div>
      <div class="roll-item"><div class="k">羈絆</div><div class="v">${s.characters.length}</div></div>
    </div>
    ${canSucceed ? `
    <div class="roll-item" style="text-align:left;margin-bottom:14px;">
      <div class="k">延續下一世——選一位孩子接續</div>
      ${kids.map(k=>`<button class="choice-btn" data-child="${escapeHtml(k.name)}" style="padding-left:8px;">${escapeHtml(k.name)}（${escapeHtml(k.relation)}）</button>`).join("")}
    </div>` : ``}
    <button class="ghost-btn" id="btn-ending-book">${bookLinkText(s)}</button>
    <button class="primary-btn" id="btn-reincarnate">服下轉世丹，重新投胎</button>
    <button class="ghost-btn" id="btn-reset-end">就此闔卷</button>
  </div>`;
}

      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <label style="flex:1;color:#ccc;">生活費倍率(LIVING_COST_MULTIPLIER)</label>
        <input type="number" step="0.1" id="input-living-cost-mult" value="${LIVING_COST_MULTIPLIER}" style="width:70px;background:#333;color:#fff;border:1px solid #555;padding:3px 5px;font-family:'Courier New',monospace;">
      </div>
    </div>`;
  // 一、1.2.9.11.4（2026-09-24新增）：場景日期違規/台詞截斷的待確認清單，最新的在上面
  const flags = (state.reviewFlags||[]).slice(-30).reverse();
  const reviewHtml = `
    <div style="margin-bottom:12px;border-bottom:1px solid #444;padding-bottom:10px;">
      <div style="color:#e0a15c;margin-bottom:4px;">待確認清單（${(state.reviewFlags||[]).length}筆，顯示最近30筆）</div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <label style="flex:1;color:#ccc;">模擬章節生成失敗機率(人生之書)</label>
        <input type="number" step="0.1" id="input-mock-chapter-fail" value="${MOCK_CHAPTER_FAIL_RATE}" style="width:70px;background:#333;color:#fff;border:1px solid #555;padding:3px 5px;">
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <label style="flex:1;color:#ccc;">模擬AI延遲毫秒(測等待畫面)</label>
        <input type="number" step="500" id="input-mock-delay" value="${MOCK_AI_DELAY_MS}" style="width:70px;background:#333;color:#fff;border:1px solid #555;padding:3px 5px;">
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <label style="flex:1;color:#ccc;">模擬AI場景日期違規機率</label>
        <input type="number" step="0.05" id="input-mock-date-violation" value="${MOCK_SCENE_DATE_VIOLATION_RATE}" style="width:70px;background:#333;color:#fff;border:1px solid #555;padding:3px 5px;">
      </div>
      ${flags.length ? flags.map(f=>`<div style="color:#bbb;font-size:11px;margin-bottom:3px;">第${f.turn}回合［${escapeHtml(f.kind)}］${escapeHtml(f.detail)}</div>`).join("") : `<div style="color:#777;font-size:11px;">目前沒有</div>`}
    </div>`;
  const groups = debugFieldGroups();
  const body = groups.map(g=>`
    <div style="margin-bottom:12px;">
      <div style="color:#e0a15c;margin-bottom:4px;">${g.title}</div>
      ${g.fields.map(([label,path,val])=>`
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">
          <label style="flex:1;color:#ccc;">${label}</label>
          <input type="number" step="any" data-path="${path}" value="${val}"
            style="width:70px;background:#333;color:#fff;border:1px solid #555;padding:3px 5px;font-family:'Courier New',monospace;">
        </div>`).join("")}
    </div>`).join("");
  return header + `
    <div style="max-height:56vh;overflow-y:auto;padding-right:4px;">${toggles}${reviewHtml}${body}</div>
    <button id="debug-apply" style="width:100%;margin-top:8px;padding:9px;background:var(--teal,#3e6b5c);color:#fff;border:none;cursor:pointer;font-family:inherit;">套用變更並刷新畫面</button>
    <button id="debug-dump" style="width:100%;margin-top:6px;padding:7px;background:#444;color:#fff;border:none;cursor:pointer;font-family:inherit;">印出完整 state 到 Console</button>
    <p style="color:#888;font-size:10.5px;margin-top:12px;line-height:1.6;">＊此面板只在 USE_MOCK=true 時出現，正式模式（USE_MOCK=false）完全不會建立這個按鈕。<br>＊四、4.3事件狀態（available/active/completed/skipped/locked）追蹤機制本身早已實作(見state.milestones)，但這個面板還沒有專屬UI可以直接勾選觸發特定里程碑或查詢完成紀錄，想確認的話用上面「印出完整state到Console」按鈕查state.milestones即可。<br>＊數值故意不做範圍限制，方便測試極端角色（例如全部設100或全部設0）。</p>
  `;
}
function bindDebugPanelContent(){
  const marginalToggle = document.getElementById("toggle-marginal-diminish");
  if(marginalToggle) marginalToggle.onchange = ()=>{ ENABLE_MARGINAL_DIMINISH = marginalToggle.checked; };
  const idleToggle = document.getElementById("toggle-network-idle-decay");
  if(idleToggle) idleToggle.onchange = ()=>{ ENABLE_NETWORK_IDLE_DECAY = idleToggle.checked; };
  const salaryScaleInput = document.getElementById("input-salary-scale");
  if(salaryScaleInput) salaryScaleInput.onchange = ()=>{ const v=Number(salaryScaleInput.value); if(!Number.isNaN(v)) SALARY_SCALE = v; };
  const mockViolationInput = document.getElementById("input-mock-date-violation");
  if(mockViolationInput) mockViolationInput.onchange = ()=>{ const v=Number(mockViolationInput.value); if(!Number.isNaN(v)) MOCK_SCENE_DATE_VIOLATION_RATE = clamp(v,0,1); };
  const mockChapterFailInput = document.getElementById("input-mock-chapter-fail");
  if(mockChapterFailInput) mockChapterFailInput.onchange = ()=>{ const v=Number(mockChapterFailInput.value); if(!Number.isNaN(v)) MOCK_CHAPTER_FAIL_RATE = clamp(v,0,1); };
  const mockDelayInput = document.getElementById("input-mock-delay");
  if(mockDelayInput) mockDelayInput.onchange = ()=>{ const v=Number(mockDelayInput.value); if(!Number.isNaN(v)) MOCK_AI_DELAY_MS = Math.max(0, v); };
  const livingCostMultInput = document.getElementById("input-living-cost-mult");
  if(livingCostMultInput) livingCostMultInput.onchange = ()=>{ const v=Number(livingCostMultInput.value); if(!Number.isNaN(v)) LIVING_COST_MULTIPLIER = v; };
  const applyBtn = document.getElementById("debug-apply");
  if(applyBtn) applyBtn.onclick = ()=>{
    document.querySelectorAll("#debug-panel input[data-path]").forEach(inp=>{
      const path = inp.dataset.path.split(".");
      let obj = state;
      for(let i=0;i<path.length-1;i++) obj = obj[path[i]];
      const num = Number(inp.value);
      if(!Number.isNaN(num)) obj[path[path.length-1]] = num;
    });
    saveGame();
    render();
  };
  const dumpBtn = document.getElementById("debug-dump");
  if(dumpBtn) dumpBtn.onclick = ()=>{
    console.log(JSON.parse(JSON.stringify(state)));
    alert("已印到瀏覽器主控台（F12 → Console 分頁）");
  };
}

initApp();
</script>
</body>
</html>
