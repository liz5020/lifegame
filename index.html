<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人生草稿</title>
<style>
  :root{
    --paper:#EDE7D9;
    --paper-card:#F6F1E4;
    --paper-dark:#E1D8C3;
    --ink:#262220;
    --ink-soft:#6b6156;
    --line:#c3b79c;
    --stamp:#9c3b2e;
    --teal:#3e6b5c;
    --gold:#93752f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
  }
  .cover{
    padding:22px 20px 14px;
    border-bottom:3px double var(--ink);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .cover h1{
    font-size:22px;
    margin:0;
    letter-spacing:2px;
    font-weight:700;
  }
  .cover .sub{
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:3px;
    margin-top:2px;
  }
  .stamp{
    border:2px solid var(--stamp);
    color:var(--stamp);
    border-radius:50%;
    width:56px;height:56px;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    transform:rotate(-8deg);
    font-size:10px;
    line-height:1.1;
    text-align:center;
    flex-shrink:0;
    opacity:.85;
  }
  .stamp b{font-size:16px;display:block;font-family:serif;}

  .progress-strip{
    padding:8px 20px;
    border-bottom:1px solid var(--line);
    background:var(--paper-card);
  }
  .progress-strip .prow{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;
  }
  .progress-strip .prow b{color:var(--ink);font-weight:700;}
  .progress-track{height:4px;background:var(--paper-dark);}
  .progress-fill{height:100%;background:var(--teal);}

  .ledger{
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    background:var(--paper-card);
  }
  .ledger-row{
    display:flex;align-items:baseline;gap:8px;
    font-size:14px;
    padding:3px 0;
  }
  .ledger-row .lbl{white-space:nowrap;color:var(--ink-soft);font-size:12.5px;letter-spacing:1px;}
  .ledger-row .dots{
    flex:1;border-bottom:1px dotted var(--line);
    height:10px;
  }
  .ledger-row .val{
    font-variant-numeric:tabular-nums;
    font-family:"Courier New",monospace;
    font-size:13.5px;
    min-width:28px;text-align:right;
  }
  .pips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
  .pip{width:9px;height:9px;border-radius:50%;border:1px solid var(--gold);}
  .pip.on{background:var(--gold);}

  .journal{
    flex:1;
    padding:16px 20px 8px;
  }
  .entry{margin-bottom:18px;}
  .entry .age-tag{
    font-size:11px;color:var(--stamp);letter-spacing:2px;
    border-bottom:1px solid var(--stamp);
    display:inline-block;padding-bottom:2px;margin-bottom:6px;
  }
  .entry p{margin:0 0 10px;font-size:15.5px;line-height:1.7;}
  .entry p:last-child{margin-bottom:0;}
  .entry.chronicle{
    font-family:"Noto Sans TC",sans-serif;
    font-size:12px;color:var(--ink-soft);
    border-left:2px solid var(--line);
    padding-left:10px;margin:10px 0;
  }

  .choices{padding:6px 20px 4px;}
  .choice-btn{
    display:block;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--line);
    padding:10px 4px 10px 22px;position:relative;
    font-family:"Noto Serif TC",serif;font-size:15px;color:var(--ink);
    cursor:pointer;
  }
  .choice-btn:before{
    content:"○";position:absolute;left:0;top:10px;color:var(--teal);
  }
  .choice-btn:active{background:var(--paper-dark);}
  .choice-btn:disabled{opacity:.4;}

  .custom-row{
    display:flex;gap:8px;padding:14px 20px 18px;
    border-bottom:1px solid var(--line);
  }
  .custom-row input{
    flex:1;border:none;border-bottom:1px solid var(--ink-soft);
    background:transparent;font-family:"Noto Serif TC",serif;
    font-size:14.5px;padding:6px 2px;color:var(--ink);
  }
  .custom-row input:focus{outline:none;border-bottom:1px solid var(--stamp);}
  .custom-row button{
    border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    font-family:"Noto Serif TC",serif;font-size:13px;
    padding:6px 14px;cursor:pointer;
  }
  .custom-row button:disabled{opacity:.4;}
  .hint{font-size:11px;color:var(--ink-soft);padding:0 20px 14px;}
  .input-error{font-size:11px;color:var(--stamp);padding:0 20px 8px;display:none;}

  .roster{
    padding:14px 20px 20px;
    border-top:1px solid var(--line);
  }
  .roster-title{font-size:12px;letter-spacing:2px;color:var(--ink-soft);margin-bottom:8px;}
  .roster-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
  .rcard{
    flex:0 0 auto;width:118px;cursor:pointer;
    background:var(--paper-card);border:1px solid var(--line);
    padding:8px 10px;font-size:11.5px;
  }
  .rcard.bg{opacity:.45;}
  .rcard .name{font-size:13px;font-weight:700;margin-bottom:2px;}
  .rcard .rel{color:var(--ink-soft);margin-bottom:2px;}
  .rcard .status-text{color:var(--stamp);font-size:11px;}

  .footer-actions{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 20px 18px;font-size:11px;color:var(--ink-soft);
  }
  .footer-actions a{color:var(--ink-soft);text-decoration:underline;cursor:pointer;}

  .center-screen{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:30px 24px;text-align:center;
  }
  .center-screen h2{font-size:20px;margin-bottom:14px;letter-spacing:1px;}
  .roll-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0;
    text-align:left;
  }
  .roll-item{border:1px solid var(--line);padding:10px 12px;background:var(--paper-card);}
  .roll-item .k{font-size:11px;color:var(--ink-soft);letter-spacing:1px;}
  .roll-item .v{font-size:20px;font-family:"Courier New",monospace;}
  .primary-btn{
    background:var(--ink);color:var(--paper);border:none;
    padding:12px 28px;font-size:15px;letter-spacing:2px;
    font-family:"Noto Serif TC",serif;cursor:pointer;margin-top:10px;
  }
  .ghost-btn{
    background:none;border:1px solid var(--ink-soft);color:var(--ink);
    padding:10px 22px;font-size:13px;letter-spacing:1px;
    font-family:"Noto Serif TC",serif;cursor:pointer;margin-top:10px;
  }
  .loading{
    padding:20px;text-align:center;color:var(--ink-soft);font-size:13px;
    letter-spacing:1px;
  }
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(38,34,32,.55);
    display:flex;align-items:center;justify-content:center;z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--paper-card);max-width:340px;width:100%;
    padding:24px 22px;border:2px double var(--ink);
  }
  .modal h3{margin-top:0;font-size:17px;}
  .modal p{font-size:13.5px;color:var(--ink-soft);}
  .modal .demo-note{font-size:11px;color:var(--stamp);margin-top:10px;}
  .end-title{font-size:24px;margin:6px 0 4px;color:var(--stamp);}
</style>
</head>
<body>
<div id="app"><div class="loading">開卷中…</div></div>

<!-- 人生草稿 測試第一版（Test v1）基準點，2026-09-14。範圍：A2核心數值邊際遞減/人脈閒置衰退、3.4.8基本生活開銷擴大、3.4.9資產模型(現金/房產/房貸)、7.1.4結局計分制。B7結局重新設計仍為測試草案，未併入此版。 -->
<!-- 人生草稿 測試第二版（Test v2）基準點，2026-09-16。範圍（v1之後新增/改版)：4.3事件狀態機制(10個里程碑)、7.5.3買房頭期款門檻檢查、每回合可見數值變化顯示、學生財富系統改版(遊戲內單位制)+4個bug修正、3.2.2才識成長公式修正(event_type標籤+程式查表，取代AI自由給delta)、3.7.2自律的興趣來源成長(連續3/6次持續投入)、八、興趣系統v1(新章節，候選成立/投入度/自律加成/副業契機)、2.2/2.2.1學期節奏改版(14段/年，取代9/15版本的12段/年)+2.5整體人生階段回合預算(22歲以後加速曲線，取代「30歲以後AI自行判斷」的舊架構)。未併入此版：七、7.1.5死亡機制改版(文件明確要求機率公式定案前不動代碼，仍是舊版19歲門檻+雙因子機率)。⚠️已知未解問題：實測發現全人生總回合數約2000~2100回合，跟設計文件2.5.1「1-2小時一輪」的節奏目標矛盾，記錄在QA手冊34.6 A10，待內容組確認。 -->
<script>
const STORAGE_KEY = "life_sim_save_v1";
// 十、10.1（9/19新增）：封測階段純金鑰模式——復原金鑰對應「一個玩家」，終身不變，底下最多累積3段人生
const RECOVERY_KEY_STORAGE_NAME = "life_sim_recovery_key"; // 復原金鑰快取在本機，方便同一台裝置不用每次重輸入
const ACTIVE_SLOT_STORAGE_NAME = "life_sim_active_slot"; // 記住這台裝置上次玩的是第幾段人生(0~2)
const MAX_LIFE_SLOTS = 3; // 【定案,十、10.1】
// 十、10.1補充（2026-09-22新增）：雲端同步狀態，純本次session的UI顯示用，不存進state/localStorage——
// {success:true,time:timestamp}表示上次saveGame()雲端同步成功、{success:false}表示失敗、null表示這個session還沒嘗試過
let cloudSyncStatus = null;
function generateRecoveryKey(){
  // 用瀏覽器內建crypto產生10 bytes(80 bits)隨機性，格式化成5組4碼英數字方便玩家抄寫核對，例如 A1B2-C3D4-E5F6-7890-1234
  const bytes = new Uint8Array(10);
  (window.crypto || crypto).getRandomValues(bytes);
  const hex = Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("");
  return hex.match(/.{1,4}/g).join("-").toUpperCase();
}
const MODEL = "claude-sonnet-5"; // 2026-09-18：舊版claude-sonnet-4-6疑似帳號無此模型存取權限（403，非404 not_found，見CHANGELOG排查記錄），改用目前最新且更便宜的Sonnet版本
const CUSTOM_INPUT_MAX_CHARS = 200; // 十、10.3.2（2026-09-23取代同日稍早的100字版本）：上限200字，標點符號也算
// 字數一律用Array.from計算（依Unicode字元，不是UTF-16長度），避免emoji等被算成2字
function countInputChars(str){ return Array.from(str||"").length; }

// ---------- 十、10.3 行動點經濟（2026-09-23新增）----------
// 每條人生各自一個ap物件：daily=每日池、gift=禮包點、purchased=購買點(封測未開放購買，欄位先預留)、lastRefillDate=上次補點的台灣日期
const AP_DAILY_REFILL = 5;        // 【定案,10.3.5】每天補到5點，不累加
const AP_NEW_LIFE_GIFT = 55;      // 【定案,10.3.4】新手禮包55點（使用者2026-09-23確認由50改55）
const AP_GIFT_CLAIMS_PER_KEY = 3; // 【定案,10.3.4】每把金鑰一輩子最多領3次
const AP_COST_PER_TURN = 1;       // 【定案,10.3.1】每回合固定扣1點，選項/自由輸入相同
const GIFT_CLAIMS_LOCAL_PREFIX = "life_sim_gift_claims:"; // Worker連不上時的本機後備計數
const ARCHIVE_LOCAL_PREFIX = "life_sim_archive:";         // 人生回顧的本機後備副本
// 【定案,10.3.5】「今天」一律換算成Asia/Taipei日期(UTC+8，無日光節約)，不直接用UTC日期；
// 封測階段暫用瀏覽器時間，開放付費前要改由伺服器判斷
function taipeiDateString(ts){
  return new Date((ts ?? Date.now()) + 8*3600*1000).toISOString().slice(0,10);
}
function newLifeAP(){
  return { daily:AP_DAILY_REFILL, gift:0, purchased:0, lastRefillDate:taipeiDateString(), giftPending:true };
}
// 舊存檔相容/防呆：沒有ap物件時補一個（不發禮包，只給當日每日池）
function ensureAP(s){
  if(!s.ap) s.ap = { daily:AP_DAILY_REFILL, gift:0, purchased:0, lastRefillDate:taipeiDateString() };
  return s.ap;
}
function totalAP(s){ const ap = ensureAP(s); return ap.daily + ap.gift + ap.purchased; }
// 不用排程：進入遊戲或行動時發現台灣日期不同才補。只看每日池，永久池多少不影響。回傳是否有補
function refillDailyIfNeeded(s){
  const ap = ensureAP(s);
  const today = taipeiDateString();
  if(ap.lastRefillDate === today) return false;
  ap.lastRefillDate = today;
  if(ap.daily >= AP_DAILY_REFILL) return false;
  ap.daily = AP_DAILY_REFILL;
  return true;
}
// 扣點順序：每日池 → 禮包點 → 購買點（先用免費的，保護付費的）；回傳各池實際扣了多少，API失敗時照原樣退回
function spendAP(s, n){
  const ap = ensureAP(s);
  const used = { daily:0, gift:0, purchased:0 };
  for(const pool of ["daily","gift","purchased"]){
    const take = Math.min(n, ap[pool]);
    ap[pool] -= take; used[pool] = take; n -= take;
  }
  return used;
}
function refundAP(s, used){
  const ap = ensureAP(s);
  ap.daily += used.daily; ap.gift += used.gift; ap.purchased += used.purchased;
}
// 新手禮包：跟著金鑰計次，優先問Worker（跨裝置、清瀏覽器資料也不會重置），連不上才退回本機計數
async function claimNewLifeGift(key){
  const localName = GIFT_CLAIMS_LOCAL_PREFIX + key;
  let localCount = 0;
  try{ localCount = Number(localStorage.getItem(localName)) || 0; }catch(e){}
  try{
    const res = await fetch(WORKER_URL+"claim-gift", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ key }) });
    const data = await res.json();
    if(res.ok && data && data.success){
      try{ localStorage.setItem(localName, String(Math.max(localCount, data.claimed||0))); }catch(e){}
      return !!data.granted;
    }
  }catch(e){ console.warn("禮包領取改用本機計數", e); }
  if(localCount >= AP_GIFT_CLAIMS_PER_KEY) return false;
  try{ localStorage.setItem(localName, String(localCount+1)); }catch(e){}
  return true;
}

const STAGE_LABELS = [
  [0,14,"孩提"],[15,17,"高中"],[18,22,"大學／技職"],
  [23,29,"初入社會"],[30,45,"職涯發展"],[46,60,"中年"],[61,200,"老年"]
];
function stageLabel(age){
  for(const [a,b,label] of STAGE_LABELS){ if(age>=a && age<=b) return label; }
  return "人生";
}
const VISIBLE_STAT_LABELS = { health:"健康", knowledge:"才識", network:"人脈", expression:"表達力", appearance:"外表" };

// 四、4.3 事件狀態機制（9/15新增）：五種狀態 available/active/completed/skipped/locked
// auto:true 表示客戶端能從既有結構化資料直接判斷完成，不假手AI；auto:false 才需要AI透過milestone_updates回報
const MILESTONE_DEFS = [
  { id:"first_credit_card", label:"第一張信用卡", auto:false, lockedUntil: s=>s.age>=18 },
  { id:"first_part_time_job", label:"第一次打工", auto:false, lockedUntil: null },
  { id:"first_romance", label:"第一次戀愛", auto:true, lockedUntil: null }, // 四、4.4（9/16改版）：改由戀愛狀態機在首次進入「交往中」時自動判定，取代AI自由回報
  { id:"graduation_highschool", label:"高中畢業", auto:true, lockedUntil: null },
  { id:"graduation_college", label:"大學畢業", auto:true, lockedUntil: null },
  { id:"first_full_time_job", label:"第一次正職工作", auto:true, lockedUntil: null },
  // 十二、12.8.3（2026-09-20確認）：改列客戶端結構化自動判斷(business_status轉為經營中即完成)，取代原本AI回報，比照9/16「第一次戀愛」的前例
  { id:"first_startup", label:"第一次創業", auto:true, lockedUntil: null },
  { id:"moved_out", label:"搬出家裡", auto:true, lockedUntil: null },
  { id:"home_purchase", label:"買房", auto:true, lockedUntil: null },
  { id:"marriage_decision", label:"結婚/不婚決定", auto:false, lockedUntil: s=>s.age>=18 },
  // 四、4.2.2（9/19新增）：4.3.1原文明講清單非封閉，這裡補上履歷判準討論時發現4.2例子有列但4.3.1沒收的三項
  { id:"first_job_change", label:"第一次轉職", auto:true, lockedUntil: null }, // 有既有job_change結構化訊號，非首次job_change視為轉職
  { id:"first_child", label:"生育或領養", auto:true, lockedUntil: null }, // 有既有new_characters的is_child結構化訊號
  { id:"parent_retirement", label:"父母退休", auto:false, lockedUntil: null } // 無結構化訊號，AI回報
];
function initMilestones(){
  const m = {};
  MILESTONE_DEFS.forEach(def=>{ m[def.id] = def.lockedUntil ? "locked" : "available"; });
  return m;
}
function refreshMilestoneLocks(s){
  // 每回合檢查locked狀態的里程碑，門檻達成就翻成available（客戶端結構化判斷，不假手AI）
  MILESTONE_DEFS.forEach(def=>{
    if(def.lockedUntil && s.milestones[def.id]==="locked" && def.lockedUntil(s)){
      s.milestones[def.id] = "available";
    }
  });
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[rnd(0,arr.length-1)]; }

// 3.5.3 核心數值的邊際遞減與人脈閒置衰退（9/14整併QA 60局測試後定案，係數皆為【測試參數】未定案）
// 可切換開關，方便回歸比較（呼應開發參數規格「十五、開發完成標準」）
let ENABLE_MARGINAL_DIMINISH = true;
let ENABLE_NETWORK_IDLE_DECAY = true;
const NETWORK_IDLE_THRESHOLD = 6; // 連續N回合沒有人脈經營行為才開始衰退（測試參數）
const NETWORK_IDLE_DECAY_INTERVAL = 3; // 門檻觸發後，每隔幾回合衰退一次（測試參數）
function applyMarginalDiminish(rawDelta, currentValue){
  if(!ENABLE_MARGINAL_DIMINISH || rawDelta<=0) return rawDelta; // 只對正向成長量做邊際遞減，扣分不受影響
  const factor = Math.max(0, 100-currentValue)/100;
  return rawDelta*factor;
}


// ========== 三、3.8 幸福感系統（9/20新增，取代原七、7.1.4裡的幸福感角色定義）==========
// 幸福感是系統裡唯一量「過得好不好」而非「做到了什麼」的軸，不產生任何判決。
// 三層：基準線（長期水準，由五條來源管道決定）＋事件即時波動（AI只給emotional_tone，程式查表）＋朝基準線回歸。
// 以下數字全部是【測試參數,待驗證】，由模擬校準，不得由代碼自行升格為定案（3.8.3、3.8.4）
const HAPPINESS_TONE_DELTA = { uplifting:[6,12], warm:[2,5], unsettling:[-5,-2], heavy:[-12,-6] };
const HAPPINESS_TONE_ENUM = Object.keys(HAPPINESS_TONE_DELTA);
const HAPPINESS_REGRESSION_INTERVAL = 5;        // 每N回合朝基準線回歸一次
const HAPPINESS_REGRESSION_RATIO = 0.25;        // 每次移動的比例
const HAPPINESS_CHANNEL_TOP_WEIGHTS = [1.0, 0.7, 0.4]; // 3.8.2【定案】取前三高加權，第四第五條不計入
const HAPPINESS_CHANNEL_DIMINISH_SCALE = 55;    // 管道邊際遞減的尺度參數
const HAPPINESS_LOW_THRESHOLD = 35;             // 4.5 longest_low_streak 的低谷閾值（設計文件標【待補充】，這裡先給第一輪測試值）
const AUTONOMY_NEUTRAL_DEFAULT = 50;            // 還沒遇到任何可跳過里程碑時的中性值
// 3.8.4「可跳過的里程碑」在v1的實作範圍：只收「玩家自己這一生要不要走這條路」的選擇。
// parent_retirement（父母退休）不是玩家的選擇、graduation_*等auto里程碑目前代碼裡不存在skipped路徑，兩者皆不列入。
// ⚠️落差：first_child(生育/領養)、home_purchase(買房)、moved_out(搬出家裡)在語意上是可跳過的傳統路線，
// 但現行代碼只有「達成時自動completed」沒有「明確決定不做」的skipped入口，暫時無法計入自主感，已記入QA手冊34.2
// 三、3.8.4／六、6.4（2026-09-20補充,QA手冊34.2「明確不做」的skipped入口）：新增first_child／home_purchase／
// moved_out三項——這三個是auto:true(客戶端結構化判定completed)的里程碑，原本沒有「玩家明確決定不做」的skipped
// 入口，導致「不生小孩」「不買房」「不搬出家裡」在自主感管道機制上完全隱形。6.4中立性最常被引用的例子就是「不成家」。
const AUTONOMY_MILESTONES = ["marriage_decision","first_startup","first_credit_card","first_part_time_job","first_child","home_purchase","moved_out"];
// 這三項只允許AI回報skipped（明確不做），不允許回報completed（completed維持既有的客戶端結構化自動判斷不變）——
// 技術判斷：AI偵測玩家輸入裡「明確決定不生小孩/不買房/不搬出去住」等意圖後回報skipped，不影響「是否真的達成」這件事
// 仍然100%由客戶端結構化判斷把關，只是多開一個「明確不做」的旗標入口，不違反4.3「凡結構化訊號存在就不假手AI」的精神。
// 十二、12.8.3（2026-09-20新增）：first_startup同批一起改列auto:true後，比照理由補上skip-only入口，讓「明確決定不創業」仍能計入自主感
const SKIP_ONLY_MILESTONES = ["first_child","home_purchase","moved_out","first_startup"];
const INTIMATE_RELATION_RE = /配偶|伴侶|先生|太太|老公|老婆|兒子|女兒|父親|母親|爸|媽|哥|姊|姐|弟|妹/;

function happinessChannelDiminish(raw){
  // 3.8.2【定案】每條管道各自套用3.5.3的邊際遞減。3.5.3的成長式 Δ=原始Δ×(100−x)/100 連續化後
  // 封閉解為 x(t)=100(1−e^(−t/scale))，這裡直接拿它當「原始投入→管道分數」的靜態轉換：
  // 高位投入換來的分數越來越少，且永遠逼近但不撞滿100。
  if(!(raw>0)) return 0;
  return clamp(100*(1-Math.exp(-raw/HAPPINESS_CHANNEL_DIMINISH_SCALE)), 0, 100);
}
function avgAffinity(list){
  if(!list || !list.length) return 0;
  return list.reduce((a,c)=>a+(c.affinity||0),0)/list.length;
}
function computeAutonomyRaw(s){
  // 3.8.4【定案】chosen佔「已遇到的可跳過里程碑」的比例。
  // not_offered（未觸發）與unavailable（條件未達成）都不進分母——設計文件明講「一直沒遇到對象的角色則不加分」，
  // 不加分不等於扣分，若讓它們稀釋比例就變成扣分，會直接違反六、6.4中立性。
  const m = s.milestones||{};
  let chosen=0, encountered=0;
  AUTONOMY_MILESTONES.forEach(id=>{
    const st = m[id];
    if(st==="skipped"){ chosen++; encountered++; }
    else if(st==="completed" || st==="active"){ encountered++; }
  });
  if(!encountered) return AUTONOMY_NEUTRAL_DEFAULT;
  return (chosen/encountered)*100;
}
function milestoneSkipReasonFor(s, id){
  // 3.8.4【定案】skip_reason三選一。completed/active代表這條路實際走了，不屬於「跳過」，回null不記錄。
  const st = (s.milestones||{})[id];
  if(st==="skipped") return "chosen";
  if(st==="locked") return "unavailable";
  if(st==="available") return "not_offered";
  return null;
}
function refreshMilestoneSkipReasons(s){
  s.milestoneSkipReason = s.milestoneSkipReason || {};
  MILESTONE_DEFS.forEach(def=>{
    const reason = milestoneSkipReasonFor(s, def.id);
    if(reason) s.milestoneSkipReason[def.id] = reason;
    else delete s.milestoneSkipReason[def.id];
  });
}
function computeHappinessChannels(s){
  // 3.8.2【定案】五條來源管道，各自0-100、各自套用邊際遞減。
  // ⚠️落差：「社團參與」與「職涯認同」目前沒有對應的結構化欄位，v1先由人脈／才識承擔，已記入QA手冊34.2
  const chars = s.characters||[];
  const intimate = chars.filter(c=>INTIMATE_RELATION_RE.test(c.relation||""));
  const others = chars.filter(c=>!INTIMATE_RELATION_RE.test(c.relation||""));
  const interests = s.interestCandidates||[];
  const topInterest = interests.length ? Math.max.apply(null, interests.map(c=>c.investment||0)) : 0;
  const finHealth = computeFinancialHealthForState(s);
  const raw = {
    intimacy: avgAffinity(intimate),
    belonging: (s.stats.network||0)*0.6 + avgAffinity(others)*0.4,
    selfActualization: (s.stats.knowledge||0)*0.5 + clamp(topInterest,0,100)*0.5,
    stability: (s.stats.health||0)*0.5 + finHealth*0.5,
    autonomy: computeAutonomyRaw(s)
  };
  const out = {};
  Object.keys(raw).forEach(k=>{ out[k] = happinessChannelDiminish(raw[k]); });
  return out;
}
function computeHappinessBaseline(s){
  // 3.8.2【定案】取前三高加權，正規化0-100。第四、第五條不計入——
  // 這是六、6.4中立性的機制保證：管道數量不足本身不扣分，三條撐得夠高就跟走傳統路線的人一樣能到滿值。
  const ch = computeHappinessChannels(s);
  const sorted = Object.keys(ch).map(k=>ch[k]).sort((a,b)=>b-a).slice(0,3);
  let num=0, den=0;
  sorted.forEach((v,i)=>{ num += v*HAPPINESS_CHANNEL_TOP_WEIGHTS[i]; den += HAPPINESS_CHANNEL_TOP_WEIGHTS[i]; });
  return den ? clamp(num/den, 0, 100) : 50;
}
function happinessToneDelta(tone){
  // 3.8.3【定案】AI回傳enum以外的值，一律視為中性（增減量0），不崩潰也不憑猜測賦值
  const range = HAPPINESS_TONE_DELTA[tone];
  if(!range) return 0;
  return rnd(range[0], range[1]);
}
function applyHappiness(s, tone){
  // 3.8.4【定案,程式層禁令】這裡的輸入只有「事件結果(tone)」與「來源管道的投入回饋(baseline)」兩種，
  // 不得以「某里程碑是否達成／某狀態是否成立」作為加減條件。QA可直接靜態檢查本函式。
  s.happiness = clamp(s.happiness + happinessToneDelta(tone), 0, 100);
  s.happinessBaseline = computeHappinessBaseline(s);
  s.happinessRegressionCounter = (s.happinessRegressionCounter||0) + 1;
  if(s.happinessRegressionCounter >= HAPPINESS_REGRESSION_INTERVAL){
    s.happinessRegressionCounter = 0;
    s.happiness = clamp(s.happiness + (s.happinessBaseline - s.happiness)*HAPPINESS_REGRESSION_RATIO, 0, 100);
  }
}

// ========== 四、4.5 人生軌跡紀錄 life_trajectory（9/20新增）==========
// 【定案】每個人生階段結束時由客戶端結算一次並凍結，不可回頭修改，AI不參與結算。
// 階段切法沿用4.2.3既有定義（chronicleLifeStageKey：學生時期＋2.5七個年齡帶，共8段）
// ========== 六、6.2 性格破格里程碑（2026-09-20新增） ==========
// 【定案】判定機制沿用既有光譜位移，不另建一套：依附兩軸(anxiety/avoidance)與同儕位置(peerPosition)三條連續光譜，
// 讀的是光譜位置本身而非「原型標籤」。九種原型/類別只是內容設計分類方便，不新增獨立判定欄位。
// 【測試參數,待驗證】偏離開局基準線多遠才算「打破底色」、每條軸線終身最多觸發幾次——本節明文交給實作階段訂測試參數。
const BREAKTHROUGH_SHIFT_THRESHOLD = 30;
const BREAKTHROUGH_CAP_PER_AXIS = 2; // 呼應「每種性格傾向需預先設計至少1-2個破格時刻」，取上限值
const BREAKTHROUGH_AXIS_LABELS = {
  anxiety: { up:"焦慮軸大幅升高", down:"焦慮軸大幅下降" },
  avoidance: { up:"迴避軸大幅升高", down:"迴避軸大幅下降" },
  peerPosition: { up:"同儕位置大幅上移", down:"同儕位置大幅下移" }
};
function checkBreakthroughMilestones(s){
  // 回傳這回合是否有新的破格時刻成立（每次呼叫最多回傳一個，多軸同時達標時取第一個偵測到的，避免同一回合塞兩段加重敘事）
  s.breakthroughCountByAxis = s.breakthroughCountByAxis || {};
  s.breakthroughFiredAxes = s.breakthroughFiredAxes || {};
  const axes = [
    { key:"anxiety", baseline:s.anxietyBaseline ?? s.anxiety, current:s.anxiety },
    { key:"avoidance", baseline:s.avoidanceBaseline ?? s.avoidance, current:s.avoidance },
    { key:"peerPosition", baseline:s.peerPositionBaseline ?? s.peerPosition, current:s.peerPosition }
  ];
  let fired = null;
  axes.forEach(a=>{
    const count = s.breakthroughCountByAxis[a.key]||0;
    const diff = a.current - a.baseline;
    const overThreshold = Math.abs(diff) >= BREAKTHROUGH_SHIFT_THRESHOLD;
    if(overThreshold){
      if(!s.breakthroughFiredAxes[a.key] && count < BREAKTHROUGH_CAP_PER_AXIS){
        s.breakthroughFiredAxes[a.key] = true;
        s.breakthroughCountByAxis[a.key] = count+1;
        if(!fired) fired = { axis:a.key, direction: diff>0?"up":"down", label: BREAKTHROUGH_AXIS_LABELS[a.key][diff>0?"up":"down"] };
      }
    } else {
      // 回落到門檻內：解除「已觸發」旗標，之後若再度偏離超標視為新的一次破格（受BREAKTHROUGH_CAP_PER_AXIS總次數限制）
      s.breakthroughFiredAxes[a.key] = false;
    }
  });
  return fired;
}

const TRAJECTORY_KEY_NPC_COUNT = 3; // 4.5【定案】關係值最高的2至3位，取上限3
function spectrumSnapshot(s){
  // 依附兩軸（5.2.3/12.1.4）＋同儕位置（5.2.4）＋做事態度五條（3.7），共8個值
  const c = s.conscientiousness||{};
  return {
    anxiety: Math.round(s.anxiety||0), avoidance: Math.round(s.avoidance||0),
    peerPosition: Math.round(s.peerPosition||0),
    selfDiscipline: Math.round(c.selfDiscipline||0), prudence: Math.round(c.prudence||0),
    achievement: Math.round(c.achievement||0), responsibility: Math.round(c.responsibility||0),
    teamSolo: Math.round(c.teamSolo||0)
  };
}
function newStageAccum(s){
  return { stage: chronicleLifeStageKey(s), ageFrom: s.age, turns:0,
    happinessSum:0, peak:s.happiness, low:s.happiness,
    lowStreak:0, longestLowStreak:0, channelSums:{},
    chronicleStart:(s.chronicle||[]).length, breakthroughEvents:[] };
}
function freezeStageTrajectory(s){
  const a = s.stageAccum;
  if(!a || !a.turns) return;
  const chars = (s.characters||[]).slice().sort((x,y)=>(y.affinity||0)-(x.affinity||0));
  let dominant=null, best=-1;
  Object.keys(a.channelSums).forEach(k=>{ if(a.channelSums[k]>best){ best=a.channelSums[k]; dominant=k; } });
  s.lifeTrajectory.push({
    stage: a.stage, age_from: a.ageFrom, age_to: s.age, turns: a.turns,
    happiness_avg: +(a.happinessSum/a.turns).toFixed(1),
    happiness_peak: Math.round(a.peak), happiness_low: Math.round(a.low),
    dominant_channel: dominant,
    longest_low_streak: a.longestLowStreak,
    spectrum_snapshot: spectrumSnapshot(s),
    resume_entries: (s.chronicle||[]).slice(a.chronicleStart),
    key_npcs: chars.slice(0,TRAJECTORY_KEY_NPC_COUNT).map(c=>({ name:c.name, relation:c.relation||"", affinity:Math.round(c.affinity||0) })),
    // 六、6.2（2026-09-20實作）：checkBreakthroughMilestones()於applyResult()裡偵測到破格時刻時push進來，取代原本永遠空陣列
    breakthrough_events: a.breakthroughEvents.slice()
  });
}
function ensureStageTransition(s){
  // 四、4.5：段落邊界偵測+把上一段凍結進life_trajectory，抽出來給一般回合累計(updateLifeTrajectory)
  // 與結局前置凍結(freezeFinalLifeStageForEnding)共用，兩邊都需要「先確認目前是不是進了新階段」這一步
  s.lifeTrajectory = s.lifeTrajectory || [];
  if(!s.stageAccum) s.stageAccum = newStageAccum(s);
  const nowStage = chronicleLifeStageKey(s);
  if(nowStage !== s.stageAccum.stage){ freezeStageTrajectory(s); s.stageAccum = newStageAccum(s); }
}
function updateLifeTrajectory(s){
  // 四、4.5：一般回合(非結局)的累計，只在applyResult()裡forceEnding為false時呼叫——
  // forceEnding時的最後一段凍結改由takeTurn()呼叫AI之前的freezeFinalLifeStageForEnding()處理，
  // applyResult()不再重複凍結，避免同一段被凍結兩次
  ensureStageTransition(s);
  const a = s.stageAccum;
  a.turns++;
  a.happinessSum += s.happiness;
  if(s.happiness > a.peak) a.peak = s.happiness;
  if(s.happiness < a.low) a.low = s.happiness;
  if(s.happiness < HAPPINESS_LOW_THRESHOLD){
    a.lowStreak++;
    if(a.lowStreak > a.longestLowStreak) a.longestLowStreak = a.lowStreak;
  } else a.lowStreak = 0;
  const ch = computeHappinessChannels(s);
  Object.keys(ch).forEach(k=>{ a.channelSums[k] = (a.channelSums[k]||0) + ch[k]; });
}
function freezeFinalLifeStageForEnding(s){
  // 四、4.5（2026-09-20 b版修正）：forceEnding時，最後一段的邊界必須在AI被呼叫之前就確定並放進
  // s.lifeTrajectory，否則buildLifeSummaryMaterial()送給AI的payload只會看到前面已完結的幾段，
  // AI永遠沒機會寫到「角色死亡的那一段」，導致結局畫面最後一段永遠是空白——這是2026-09-20跑
  // 400+回合端到端測試時發現的bug，不是邊界情況，每一局都會發生。
  // 代價：這一回合本身的數值(這回合AI才要回傳的health/happiness等delta)不算進這一段的統計，
  // 只包含到上一回合為止的累積——對敘事語氣用途的人生總結而言可以接受。
  ensureStageTransition(s);
  freezeStageTrajectory(s);
  s.stageAccum = null;
}

// ========== 七、7.1.4 死亡結局的人生總結（9/20整節改版，取代ENDING_DEFINITIONS標籤計分制）==========
// 【定案】不輸出任何標籤、分數、排名。素材的挑選與排序全由客戶端從life_trajectory完成，AI只負責寫成回顧的語氣。
const SUMMARY_TONE_BANDS = [ // 7.1.4.2【定案】敘事溫度四級由happiness_avg決定；分界數字為【測試參數】
  { min:65, tone:"釋然" }, { min:45, tone:"平穩" }, { min:25, tone:"惋惜" }, { min:0, tone:"沉重" }
];
const SUMMARY_RESUME_PER_STAGE = 3;  // 7.1.4.2【待補充】每階段挑幾則履歷條目——第一輪測試值
const SUMMARY_NPC_PER_STAGE = 2;     // 7.1.4.2【待補充】每階段挑幾位角色卡——第一輪測試值
const SPECTRUM_SHIFT_THRESHOLD = 15; // 7.1.4.2【待補充】L2變化句的位移閾值——第一輪測試值
const SPECTRUM_LABELS = { anxiety:"焦慮軸", avoidance:"迴避軸", peerPosition:"同儕位置",
  selfDiscipline:"自律", prudence:"審慎", achievement:"成就傾向", responsibility:"責任感", teamSolo:"團隊vs單打獨鬥" };
const HAPPINESS_CHANNEL_LABELS = { intimacy:"親密與家庭", belonging:"友情與歸屬",
  selfActualization:"自我實現", stability:"身心安穩", autonomy:"自主感" };
function lifeStageLabel(key){
  if(key==="student") return "學生時期";
  if(key==="career_other") return "晚年";
  return key + "歲";
}
function summaryToneFor(avg){
  for(let i=0;i<SUMMARY_TONE_BANDS.length;i++){ if(avg>=SUMMARY_TONE_BANDS[i].min) return SUMMARY_TONE_BANDS[i].tone; }
  return SUMMARY_TONE_BANDS[SUMMARY_TONE_BANDS.length-1].tone;
}
function buildLifeSummaryMaterial(s){
  const traj = s.lifeTrajectory || [];
  const segments = traj.map(t=>({
    stage: t.stage, stage_label: lifeStageLabel(t.stage),
    age_from: t.age_from, age_to: t.age_to,
    tone: summaryToneFor(t.happiness_avg),
    dominant_channel: t.dominant_channel,
    dominant_channel_label: HAPPINESS_CHANNEL_LABELS[t.dominant_channel] || null,
    longest_low_streak: t.longest_low_streak,
    resume_entries: (t.resume_entries||[]).slice(0, SUMMARY_RESUME_PER_STAGE),
    key_npcs: (t.key_npcs||[]).slice(0, SUMMARY_NPC_PER_STAGE),
    breakthrough_events: t.breakthrough_events || []
  }));
  const transitions = [];
  for(let i=1;i<traj.length;i++){
    const a = traj[i-1].spectrum_snapshot || {}, b = traj[i].spectrum_snapshot || {};
    let axis=null, delta=0;
    Object.keys(SPECTRUM_LABELS).forEach(k=>{
      const d = (b[k]||0) - (a[k]||0);
      if(Math.abs(d) > Math.abs(delta)){ delta = d; axis = k; }
    });
    if(axis && Math.abs(delta) >= SPECTRUM_SHIFT_THRESHOLD){
      transitions.push({ after_stage: traj[i-1].stage,
        from_stage_label: lifeStageLabel(traj[i-1].stage), to_stage_label: lifeStageLabel(traj[i].stage),
        axis, axis_label: SPECTRUM_LABELS[axis], from: a[axis]||0, to: b[axis]||0,
        direction: delta>0 ? "up" : "down" });
    }
  }
  return { segments, transitions };
}
function assembleEnding(s, r){
  // 客戶端先挑好素材，再把AI寫的文字貼回對應的段落；AI沒寫到的段落留空字串，不補猜測內容
  const material = buildLifeSummaryMaterial(s);
  const ls = r.life_summary || {};
  const byStage = {}, byTrans = {};
  (ls.segments||[]).forEach(x=>{ if(x && x.stage) byStage[x.stage] = x.text || ""; });
  (ls.transitions||[]).forEach(x=>{ if(x && x.after_stage) byTrans[x.after_stage] = x.text || ""; });
  return {
    segments: material.segments.map(m=>({ stage:m.stage, label:m.stage_label, age_from:m.age_from, age_to:m.age_to,
      tone:m.tone, resume_entries:m.resume_entries, key_npcs:m.key_npcs, text: byStage[m.stage] || "" })),
    transitions: material.transitions.map(t=>({ after_stage:t.after_stage, text: byTrans[t.after_stage] || "" })),
    epitaph: ls.epitaph || "",
    successionAvailable: !!r.succession_available
  };
}

// 三、3.7.3（2026-09-23拍板）自律作為效率乘數：自律乘數＝1+(自律-50)×0.5%，範圍0.75~1.25【測試參數,待驗證】。
// 斜率刻意取其他四條光譜(3.7.3既有公式多為×1%)的一半，因為3.2.2才識成長鏈已疊加智慧/邏輯/團隊三層乘數，

// 此條與3.7.2（自律本身怎麼成長，見SELF_DISCIPLINE_INTEREST_STREAK_1/2）是兩件事，不要混在一起。
function getDisciplineMultiplier(s){
  return clamp(1 + (s.conscientiousness.selfDiscipline-50)*0.005, 0.75, 1.25);
}
// 三、3.5.1（2026-09-23拍板）過勞/憂鬱訊號門檻：自律≥60時連續6回合、其餘連續5回合，取代原本文件寫的「5-6回合」模糊區間。

// s.lowHealthStreak原本只是原始數字送給AI參考(low_health_streak)，AI自行決定何時寫成敘事，不是程式強制觸發；
// 九、9.7的WITHDRAWAL_STREAK_TRIGGER(=4)是另一個獨立機制(休學候選)，不是3.5.1這條，兩者不能混用同一個門檻，

// 三、3.2.4（2026-09-23拍板）exam_score_hint的才識拖累斜率：考前每選一次興趣路徑扣EXAM_INTEREST_DRAG_PER_CHOICE分【測試參數,待驗證】，
// 乘上拖累倍率(才識越高，拖累越輕)，沿用3.7.3以50分為中性基準的結構，但斜率(1%)、依據數值(才識而非自律)皆與3.7.3自律乘數是兩件獨立的事
const EXAM_INTEREST_DRAG_PER_CHOICE = 2; // 【測試參數,待驗證】
function computeExamInterestDragMultiplier(knowledge){
  return clamp(1 - (knowledge-50)*0.01, 0.5, 1.5);
}
// 三、3.2.2（9/16修正）才識成長：AI只給event_type標籤，程式查表決定「事件原始學習值」，取代原本AI直接給的knowledge delta
// 區間數字為【測試參數,待驗證】，milestone上限1~2次取上限值2（同一人生階段=timeState.stageMode）
const KNOWLEDGE_EVENT_VALUES = { ordinary:[3,5], intensive:[5,8], milestone:[10,15] };
const KNOWLEDGE_MILESTONE_CAP_PER_STAGE = 2;
// 四、4.2.2（9/19新增）：「重大失敗/成就」這類敘事判斷型履歷條目沒有結構化完成狀態可判斷，
// 呼應3.2.2 milestone精神——不由AI自行判斷次數，程式依人生階段計數擋下超額觸發
const MAJOR_EVENT_JUDGED_CAP_PER_STAGE = 2;
// 四、4.2.3（9/19新增）：L3履歷的「人生階段」切法對齊二、2.5的年齡帶定義（學生時期＋七個年齡帶，共8段），
// 不沿用timeState.stageMode（該欄位只有highschool/college/career三值，career涵蓋22-100+整段不夠細，
// 會讓「每階段上限2則」在出社會後的六七十年裡只算一次，違背分階段配額的本意）。
// 學生時期判斷依據呼應3.4.6/9.8改版，統一以studentStatus是否已轉為graduated/withdrawn為準，不看年齡
function chronicleLifeStageKey(s){
  if(s.studentStatus!=="graduated" && s.studentStatus!=="withdrawn") return "student";
  const bucket = LIFE_STAGE_ROUND_BUDGET.find(b=>s.age>=b.minAge && s.age<=b.maxAge);
  return bucket ? `${bucket.minAge}-${bucket.maxAge}` : "career_other";
}
function shouldRecordJudgedMajorEvent(s, majorEventType){
  if(majorEventType!=="achievement" && majorEventType!=="setback") return true; // 非敘事判斷型（例如既有里程碑類），不受此上限管
  const stage = chronicleLifeStageKey(s);
  s.majorEventJudgedCountByStage = s.majorEventJudgedCountByStage||{};
  s.majorEventJudgedCountByStage[stage] = s.majorEventJudgedCountByStage[stage]||0;
  if(s.majorEventJudgedCountByStage[stage] >= MAJOR_EVENT_JUDGED_CAP_PER_STAGE) return false;
  s.majorEventJudgedCountByStage[stage]++;
  return true;
}
function rollKnowledgeRawValue(eventType, eventId, s){
  if(eventType==="ordinary" || eventType==="intensive"){
    const [lo,hi] = KNOWLEDGE_EVENT_VALUES[eventType];
    return rnd(lo,hi);
  }
  if(eventType==="milestone"){
    const stage = s.timeState.stageMode;
    s.knowledgeMilestoneCountByStage[stage] = s.knowledgeMilestoneCountByStage[stage]||0;
    const alreadyUsed = eventId && s.knowledgeMilestoneUsedIds.includes(eventId);
    if(alreadyUsed || s.knowledgeMilestoneCountByStage[stage] >= KNOWLEDGE_MILESTONE_CAP_PER_STAGE){
      return 0; // 程式擋下：同一event_id重複，或本階段milestone次數已達上限
    }
    s.knowledgeMilestoneCountByStage[stage]++;
    if(eventId) s.knowledgeMilestoneUsedIds.push(eventId);
    const [lo,hi] = KNOWLEDGE_EVENT_VALUES.milestone;
    return rnd(lo,hi);
  }
  return 0; // 沒有event_type代表這回合沒有才識相關事件
}

// 八、興趣系統v1（9/16新增）——AI只分類(category/reaction)，候選成立/投入度/降階/下游出口一律由程式計算
// 以下數字皆為【測試參數,待驗證】，文件本身也明講候選淡出時間、轉正門檻等尚未定案，這裡先給一組內部一致的測試值
const INTEREST_CATEGORIES = ["藝術創作","手作工藝","知識研究","體能競技","科技邏輯","社交表演","商業交易"];
const INTEREST_CANDIDATE_TO_ACTIVE_STREAK = 3; // 候選連續正向N次轉正為正式興趣卡【測試參數】
// 八、8.1（2026-09-23拍板）：候選興趣12回合(對齊四、4.1 NPC「12回合無互動降級」)、正式興趣卡24回合，取代原本6/10的暫定值
const INTEREST_CANDIDATE_FADE_TURNS = 12; // 【測試參數,待驗證】候選興趣距上次positive/neutral反應滿N回合就淡出消失
const INTEREST_ACTIVE_DORMANT_TURNS = 24; // 【測試參數,待驗證】正式興趣卡距上次positive投入滿N回合就降階為背景興趣
const INTEREST_SIDE_BUSINESS_THRESHOLD = 40; // 【定案】投入度達40觸發副業契機事件
const SELF_DISCIPLINE_INTEREST_STREAK_1 = 3; // 【定案,3.7.2】連續3次持續投入
const SELF_DISCIPLINE_INTEREST_STREAK_2 = 6; // 【定案,3.7.2】連續6次持續投入

function findInterestCard(s, category){
  return (s.interestCandidates||[]).find(c=>c.category===category);
}
function computeInterestCareerWeightBonus(investment){
  // 8.7【測試值,非正式定案】基礎權重×(1+投入度×0.5%)，純工具函式：目前代碼沒有對應的「職涯分支選擇點」可以接，先備妥公式供未來整合
  return 1 + investment*0.005;
}
// 8.1-8.2 反應三分類：正向累積朝正式興趣卡邁進／中性維持原狀／明確負向暫停或降低(不刪除)
// 8.7 下游出口：自律(僅持續投入計入)、副業契機(投入度40，三選一，見renderSideBusinessModal)
// 8.2（9/16-v2.1補充）候選興趣進度(candidateProgress)與自律連續投入計數(positiveStreak)是兩個獨立欄位：
//   candidateProgress只管candidate→active轉正，positive=+1/neutral=0/negative=-1(下限0)，單次negative不會讓進度整個消失
//   positiveStreak仍是嚴格「連續」計數，供3.7.2自律判定使用，中斷(negative)一樣重新起算，這條規則v2.1未變動
function applyInterestEvent(s, interestEvent){
  if(!interestEvent || !interestEvent.category || !INTEREST_CATEGORIES.includes(interestEvent.category)) return;
  // 三、3.2.4（2026-09-23拍板）：這回合的行動投入在興趣路徑上，算一次考前拖累計數，與study_count_this_term同時累積、同時歸零
  s.interestCountThisTerm = (s.interestCountThisTerm||0)+1;
  if(!s.interestCandidates) s.interestCandidates = [];
  const category = interestEvent.category;
  const reaction = interestEvent.reaction; // "positive" | "neutral" | "negative"
  let card = findInterestCard(s, category);
  if(!card){
    card = {
      id: category+"_"+s.turnCount, category, status:"candidate", investment:0, positiveStreak:0, candidateProgress:0,
      lastEngagedRound: s.turnCount, sideBusinessOffered:false, sideBusinessStatus:null,
      selfDisciplineAwarded3:false, selfDisciplineAwarded6:false
    };
    s.interestCandidates.push(card);
  }
  // 八、8.1（2026-09-23拍板）：candidate階段positive/neutral都算互動、重置淡出計時；
  // active階段只有positive算投入、重置降階計時，neutral不算；negative兩階段都不重置(呼應「negative反應不會重置計時」)
  if(reaction==="positive" || (reaction==="neutral" && card.status==="candidate")){
    card.lastEngagedRound = s.turnCount;
  }
  if(reaction==="positive"){
    const raw = rnd(4,9); // 8.3【測試參數】原始投入值，量級比照其他成長型數值
    const grown = applyMarginalDiminish(raw*getDisciplineMultiplier(s), card.investment); // 8.3：套3.7.3自律乘數後再套邊際遞減，與才識/人脈共用同一套邊際遞減
    card.investment = clamp(card.investment+grown, 0, 100);
    card.positiveStreak++;
    card.candidateProgress = (card.candidateProgress||0) + 1; // 8.2：候選進度+1，不設上限
    if(card.status==="candidate" && card.candidateProgress>=INTEREST_CANDIDATE_TO_ACTIVE_STREAK) card.status="active";
    if(card.status==="dormant") card.status="active"; // 8.6：久未投入後重新投入，視為喚醒
    // 3.7.2（9/16新增）自律成長：僅「持續投入」計入，由程式計數連續正向次數，非AI給值
    if(!card.selfDisciplineAwarded3 && card.positiveStreak>=SELF_DISCIPLINE_INTEREST_STREAK_1){
      s.conscientiousness.selfDiscipline = clamp(s.conscientiousness.selfDiscipline+1,0,100);
      card.selfDisciplineAwarded3 = true;
    }
    if(!card.selfDisciplineAwarded6 && card.positiveStreak>=SELF_DISCIPLINE_INTEREST_STREAK_2){
      s.conscientiousness.selfDiscipline = clamp(s.conscientiousness.selfDiscipline+1,0,100);
      card.selfDisciplineAwarded6 = true;
    }
    if(card.status==="active" && !card.sideBusinessOffered && card.investment>=INTEREST_SIDE_BUSINESS_THRESHOLD){
      card.sideBusinessOffered = true;
      s.pendingSideBusinessCardId = card.id; // 8.7：觸發一次副業契機事件，每張卡最多首次觸發一次
    }
  } else if(reaction==="negative"){
    card.positiveStreak = 0; // 連續投入中斷，自律的連續次數獎勵重新起算(3.7.2「連續」語意不變)
    card.selfDisciplineAwarded3 = false; card.selfDisciplineAwarded6 = false;
    card.candidateProgress = Math.max(0, (card.candidateProgress||0) - 1); // 8.2（9/16-v2.1）：候選進度-1，下限0，不整個歸零
    card.investment = clamp(card.investment - rnd(3,8), 0, 100); // 暫停或降低，不整個刪除
  }
  // reaction==="neutral"：不增加也不歸零，維持原狀（investment/positiveStreak/candidateProgress皆不變）
}
// 8.1/8.6：候選興趣久未互動自然淡出消失；正式興趣卡久未投入降階為背景興趣
function sweepInterestDecay(s){
  if(!s.interestCandidates) return;
  s.interestCandidates = s.interestCandidates.filter(card=>{
    const idleTurns = s.turnCount - (card.lastEngagedRound ?? s.turnCount);
    if(card.status==="candidate" && idleTurns>=INTEREST_CANDIDATE_FADE_TURNS) return false;
    if(card.status==="active" && idleTurns>=INTEREST_ACTIVE_DORMANT_TURNS) card.status="dormant";
    return true;
  });
}

const PARENTING_FIRST_CHILD_NODE_ORDER = ["infant","school_entry","adolescent_conflict","path_choice","leaving_home"];
const PARENTING_LATER_CHILD_NODE_ORDER = ["infant","adolescent_conflict","leaving_home"];
function isFirstChild(s, childName){
  const kids = (s.characters||[]).filter(c=>c.isChild);
  return kids.length>0 && kids[0].name===childName;
}
// 【已知簡化】節點視窗(minAge~maxAge)若因回合稀疏被錯過(子女年齡跨過maxAge時仍未觸發過)，該節點終身不再觸發——
// 7.3.5.5已有「已完成節點不足2個」的正式fallback規則承接這種情況，不需要額外補觸發機制
function checkParentingGrowthNode(s){
  if(s.pendingParentingNode) return; // 一次只處理一個
  const kids = (s.characters||[]).filter(c=>c.isChild && c.active);
  for(const child of kids){
    const order = isFirstChild(s, child.name) ? PARENTING_FIRST_CHILD_NODE_ORDER : PARENTING_LATER_CHILD_NODE_ORDER;
    const done = child.parentingNodesDone || [];
    for(const key of order){
      if(done.includes(key)) continue;
      const node = PARENTING_GROWTH_NODES[key];
      if(typeof child.age==="number" && child.age>=node.minAge && child.age<=node.maxAge){
        s.pendingParentingNode = { childName: child.name, nodeKey: key };
        return;
      }
    }
  }
}
// optionId為null時代表玩家自訂輸入，位移量視為中性(0,0)——不由AI或系統猜測自訂輸入的教養傾向，呼應一、1.4「AI在明確事實基礎上生成語氣，不負責推算事實本身」
function resolveParentingGrowthNode(s, childName, nodeKey, optionId, customText){
  const child = s.characters.find(c=>c.name===childName);
  const node = PARENTING_GROWTH_NODES[nodeKey];
  if(!child || !node) return;
  const opt = node.options.find(o=>o.id===optionId) || null;
  const demand = opt ? opt.demand : 0;
  const warmth = opt ? opt.warmth : 0;
  child.parentingLog = child.parentingLog || [];
  child.parentingLog.push({
    child_id: childName, stage: nodeKey, choice_id: opt ? opt.id : "custom",
    demand_delta: demand, warmth_delta: warmth,
    relationship_snapshot: Math.round(child.affinity||50)
  });
  child.parentingNodesDone = child.parentingNodesDone || [];
  child.parentingNodesDone.push(nodeKey);
  // 4.1.2：成年離家節點完成，解除同住標記
  if(nodeKey==="leaving_home") releaseCohabiting(child);
  // 七、7.6.2：青春期衝突節點選到激化方向，是婚姻危機兩條觸發條件之一

    s.justEscalatedTeenConflict = true;
  }
  s.parentingEventLog = { nodeLabel: node.label, childName, optionText: opt ? opt.text : (customText||"（自訂做法）") };
}

}
// 【定案】選項設計為取捨而非優劣，沒有一個是純扣分：investTime連到親密管道，maintain不動，divertElsewhere連到自我實現/親密以外的既有管道(呼應3.8.2)
function resolveRelationshipInvestment(s, partnerName, choice){
  const partner = s.characters.find(c=>c.name===partnerName);
  if(!partner) return;
  partner.lastTurn = s.turnCount; // 節點本身就是一次互動，重置idle計數，避免下回合立刻重新觸發
  if(choice==="invest_time"){
    partner.affinity = clamp(partner.affinity + rnd(3,6), 0, 100);
  }
  // maintain_status_quo／divert_elsewhere：不直接扣分(六、6.4)，divert轉投入的時間本身已經在興趣/工作/子女各自的管道計分，這裡不重複加成避免雙重計分
  s.relationshipInvestmentEventLog = { choice, partnerName };
}

// 7.6.2 婚姻危機里程碑：觸發由客戶端判定，二選一條件
const MARRIAGE_CRISIS_LOW_THRESHOLD = 30; // 【測試參數,待驗證,7.6.2】
const MARRIAGE_CRISIS_LOW_STREAK_TRIGGER = 12; // 【測試參數,待驗證,7.6.2】——與4.1.2同住緩降的12回合週期對齊
const MARRIAGE_CRISIS_COOLDOWN_TURNS = 20; // 【測試參數,待驗證,7.6.2】
// 技術判斷：7.3.5.2青春期衝突節點的兩個極端選項(嚴格管教/放任不管)視為「激化方向」，中間的溝通選項不算，設計文件未逐一列出對照表，此為實作階段判斷
const MARRIAGE_CRISIS_ESCALATING_TEEN_CHOICES = ["strict_rules","let_go"];
function sweepMarriageCrisisCandidate(s){
  const spouse = s.characters.find(c=>c.romanceStatus==="married");
  if(!spouse){ s.justEscalatedTeenConflict = false; s.justLostJob = false; s.justReachedFertilityStage4 = false; return; }
  spouse.lowAffinityStreak = spouse.affinity<MARRIAGE_CRISIS_LOW_THRESHOLD ? (spouse.lowAffinityStreak||0)+1 : 0;
  if(!s.pendingMarriageCrisis && s.turnCount >= (s.marriageCrisisCooldownUntilTurn||0)){
    const lowStreakTrigger = spouse.lowAffinityStreak >= MARRIAGE_CRISIS_LOW_STREAK_TRIGGER;
    // 特定高壓事件疊加：青春期衝突激化方向、剛失業、七、7.3.3不孕症走到第四階段
    // 【定案,2026-09-23】三個旗標都是「只在狀態剛發生的那一回合觸發」，本函式每回合結束都會清成false，
    // 剛好滿足「如果剛失業/剛進第四階段那回合婚姻危機正在冷卻期，則不觸發也不延後」的要求——旗標只活一個sweep週期，不會被留到冷卻結束後重新判定
    const pressureEventTrigger = !!s.justEscalatedTeenConflict || !!s.justLostJob || !!s.justReachedFertilityStage4;
    if(lowStreakTrigger || pressureEventTrigger){
      s.pendingMarriageCrisis = { spouseName: spouse.name };
    }
  }
  s.justEscalatedTeenConflict = false;
  s.justLostJob = false;
  s.justReachedFertilityStage4 = false;
}
// choice: "repair"／"maintain"／"divorce"。三者在幸福感計算上地位平等，不預設哪個正確(呼應六、6.4)
// 技術判斷：文件明文只講「選擇修復後設冷卻期」，但「維持現狀」若不重置也會導致下回合立刻再次觸發(違反6.1不可無止盡重複的精神)，
// 此處讓repair/maintain都設冷卻期，divorce則婚姻關係已結束不需要冷卻
function resolveMarriageCrisis(s, spouseName, choice){
  const spouse = s.characters.find(c=>c.name===spouseName);
  if(!spouse) return;
  if(choice==="repair"){
    spouse.lowAffinityStreak = 0;
    spouse.affinity = clamp(spouse.affinity + rnd(5,10), 0, 100);
    s.marriageCrisisCooldownUntilTurn = s.turnCount + MARRIAGE_CRISIS_COOLDOWN_TURNS;
  } else if(choice==="maintain"){
    spouse.lowAffinityStreak = 0;
    s.marriageCrisisCooldownUntilTurn = s.turnCount + MARRIAGE_CRISIS_COOLDOWN_TURNS;
  } else if(choice==="divorce"){
    s.pendingDivorceSettlement = { spouseName };
  }
  s.marriageCrisisEventLog = { choice, spouseName };
}

// 7.6.3 離婚結算
// 【技術判斷】現金分割區間40%-60%由客戶端擲骰決定玩家保留比例，不交給AI決定——理由與薪資/考試分數等既有金額類禁令同源(12.13/一、1.2.6精神)
function finalizeDivorce(s, spouseName, propertyChoice, custodyChoice){
  const spouse = s.characters.find(c=>c.name===spouseName);
  if(!spouse) return;
  const playerSharePct = rnd(40,60);
  if(s.propertyValue>0){
    if(propertyChoice==="keep_other" || propertyChoice==="sell"){
      // 賣出變現後分配差額：沿用7.5.3既有的賣房轉租機制；由對方保留房產並承接房貸：玩家不取得變現金額，直接歸零
      if(propertyChoice==="sell") s.cash += (s.propertyValue - s.mortgageBalance);
      s.propertyValue = 0; s.mortgageBalance = 0;
      s.monthlyExpenses = s.monthlyExpenses.filter(e=>e.label!=="房貸");
      s.housing = s.housing && s.housing.type==="own" ? null : s.housing;
    }
    // keep_self：玩家保留房產並承接房貸剩餘本金，房產/房貸/housing皆維持原樣不變動
  }
  s.cash = Math.round(s.cash * (playerSharePct/100));
  s.spouseIncome = 0; s.spouseOccupationCategory = null;
  spouse.romanceStatus = "divorced";
  spouse.relation = "前配偶";
  releaseCohabiting(spouse);
  const custody = custodyChoice || "joint";
  if(custody==="non_primary"){
    // 非主要照顧者：子女隨對方生活，解除同住標記(呼應4.1.2解除時機清單)
    s.characters.filter(c=>c.isChild).forEach(releaseCohabiting);
  }
  s.custodyStatus = custody;
  s.pendingDivorceSettlement = null;
  s.divorceEventLog = { spouseName, playerCashSharePct: playerSharePct, propertyChoice: propertyChoice||null, custody };
  // 7.6.4：離婚後可重新進入4.4戀愛狀態機——不需要額外代碼，applyRomanceSignal/applyMarriageDecisionCompletion
  // 本來就只認romanceStatus當下狀態，divorced不會擋住任何新對象從null重新走完整戀愛流程
}

// 七、7.3.5.5：換算給7.4.2世代傳承——已完成2個以上節點時以節點平均換算；不足2個時改用子女關係值對照5.2.2四組好感度區間取最接近的一種
function computeInheritedParentingStyle(child){
  const log = (child && child.parentingLog) || [];
  if(log.length>=2){
    const demandAvg = log.reduce((sum,e)=>sum+e.demand_delta,0)/log.length;
    const warmthAvg = log.reduce((sum,e)=>sum+e.warmth_delta,0)/log.length;
    return parentingStyleFromAxes(demandAvg, warmthAvg);
  }
  // 節點數不足2個：改以子女關係值對照PARENTING_STYLES各自的affinityRange，取最接近的一種
  const aff = (child && typeof child.affinity==="number") ? child.affinity : 50;
  let best = PARENTING_STYLES[0], bestDist = Infinity;
  PARENTING_STYLES.forEach(style=>{
    const mid = (style.affinityRange[0]+style.affinityRange[1])/2;
    const dist = Math.abs(aff-mid);
    if(dist<bestDist){ bestDist = dist; best = style; }
  });
  return best.label;
}

// ========== 十二、職涯系統（2026-09-20新增） ==========
// 【定案,12.1】不新增第二套「工作績效」數值，職場表現一律由既有數值(才識/自律/責任感/人脈)合成
// 【定案,12.1】本章通則：不升遷/不創業/一輩子同一份工作都不預設扣分，只能透過既有幸福感管道的投入回饋影響(呼應3.8.4程式層禁令)
// 【定案,2026-09-23】career_status集中定義成常數，避免中英文字串對不上（曾發生七、7.6.2誤比對英文"unemployed"，但這裡實際寫入的是中文"失業"，導致條件永遠不成立）
const CAREER_STATUS = {
  EMPLOYED: "在職", JOB_SEARCHING: "求職中", UNEMPLOYED: "失業",
  BUSINESS: "創業中", SEMI_RETIRED: "半退休", RETIRED: "退休", NOT_EMPLOYED: "未就業"
};

// 12.3：職級語意依類別調整，自營類另看12.8經營規模不套用此表；自由/創作類另有專屬語意標籤
const JOB_LEVEL_LABELS_DEFAULT = ["新人","熟手","資深","管理職"];
const JOB_LEVEL_LABELS_CREATIVE = ["無名","接案穩定","有口碑","頭部"];
function jobLevelLabel(category, levelIndex){
  const labels = category==="自由/創作類" ? JOB_LEVEL_LABELS_CREATIVE : JOB_LEVEL_LABELS_DEFAULT;
  return labels[clamp(levelIndex||0,0,3)];
}
// 9.2既有的科系→職業八大類主要對應，供12.4「科系對應+10個百分點」判斷使用（技術判斷：僅列每個科系的主要對應類別，
// 9.2文件裡「或」/「創業走向」等次要對應不計入，避免同一科系同時匹配過多類別讓+10%規則失去鑑別度）
const MAJOR_OCCUPATION_MATCH = {
  理工資訊: ["受雇專業/白領類"], 商管財經: ["受雇專業/白領類","自營/家庭事業類"],
  人文語言傳播: ["受雇專業/白領類"], 醫藥護理: ["受雇專業/白領類"],
  教育: ["軍公教/警消類","受雇專業/白領類"], 藝術設計表演: ["自由/創作類"],
  法律政治: ["受雇專業/白領類","軍公教/警消類"], 服務社工餐旅: ["勞力/服務類"]
};
// 12.3【定案,測試參數】落點百分位＝clamp(才識÷100×0.5＋職級加成＋年資加成,0,1)；職級加成新人0/熟手0.12/資深0.24/管理職0.36；年資加成＝min(同職級年資年數×0.02,0.08)
function computeSalaryPercentile(s){
  const levelBonus = [0,0.12,0.24,0.36][clamp(s.jobLevel||0,0,3)];
  const tenureBonus = Math.min(((s.tenureMonths||0)/12)*0.02, 0.08);
  return clamp((s.stats.knowledge/100)*0.5 + levelBonus + tenureBonus, 0, 1);
}
function computeCareerSalary(s, category){
  const cat = findOccupationCategory(category);
  if(!cat) return 0;
  return +(cat.salaryRange[0] + (cat.salaryRange[1]-cat.salaryRange[0])*computeSalaryPercentile(s)).toFixed(1);
}

// 12.4【定案,測試參數】錄取機率＝基礎35%＋各項修正，下限5%、上限90%
const JOB_SEARCH_BASE_PROB_PP = 35;
const JOB_SEARCH_STREAK_FALLBACK = 3; // 【定案】連續3次失敗後，第4次必定出現保底offer
function computeHireProbability(s, targetCategory, opts){
  opts = opts||{};
  let pp = JOB_SEARCH_BASE_PROB_PP;
  pp += (s.stats.knowledge-50)*0.4;
  pp += (s.stats.network-50)*0.2;
  pp += (s.conscientiousness.achievement-50)*0.3; // 沿用3.7.3既有公式
  const majorMatch = s.studentMajorGroup && (MAJOR_OCCUPATION_MATCH[s.studentMajorGroup]||[]).includes(targetCategory);
  if(majorMatch) pp += 10;
  if(opts.crossCategoryTransfer) pp -= 10;
  if(s.studentStatus==="withdrawn") pp -= 10;
  if((s.collegeDelayYearsUsed||0) > 0) pp -= 5;
  if(s.age>=55) pp -= 20; else if(s.age>=50) pp -= 10;
  // 十二、12.11.1（2026-09-22新增）：自由接案/演藝圈職涯伏筆成為候選時，「自由/創作類」錄取機率加成，比照科系對口加成的作法
  if(opts.creativeBonusPct && targetCategory==="自由/創作類") pp += opts.creativeBonusPct;
  return clamp(pp,5,90);
}
function buildJobSearchOffers(s, extraOpts){
  const isTransfer = s.careerStatus===CAREER_STATUS.EMPLOYED;
  return OCCUPATION_CATEGORIES.map(cat=>({
    category: cat.key,
    probPct: Math.round(computeHireProbability(s, cat.key, Object.assign({ crossCategoryTransfer: isTransfer && s.occupationCategory!==cat.key }, extraOpts)))
  }));
}
// 12.4/12.6【定案,務必遵守12.13】求職/轉職成敗判定完全由客戶端擲骰決定；十一、11.4/12.14明牌檢定：roll+probPct完整回傳供UI詳細呈現
function resolveJobApplication(s, category, isTransfer, opts){
  opts = opts||{};
  const isFallbackForced = (s.jobSearchStreak||0) >= JOB_SEARCH_STREAK_FALLBACK;
  let finalCategory = category;
  let roll, probPct, hired;
  if(isFallbackForced){
    // 12.4【定案】保底規則：第4次必定出現一個「不穩定/待業類」或「勞力/服務類」的保底offer
    finalCategory = ["不穩定/待業類","勞力/服務類"].includes(category) ? category : pick(["不穩定/待業類","勞力/服務類"]);
    roll = 1; probPct = 100; hired = true;
  } else {
    probPct = Math.round(computeHireProbability(s, category, { crossCategoryTransfer: isTransfer && s.occupationCategory!==category, creativeBonusPct: opts.creativeBonusPct }));
    roll = rnd(1,100);
    hired = roll <= probPct;
  }
  if(hired){
    const wasFirstJob = !s.occupationCategory;
    const sameCategory = isTransfer && s.occupationCategory===finalCategory;
    s.jobSearchStreak = 0;
    // 十二、12.6.1【定案】海外型轉職一律視為跨類別轉職的子情境(留學/外派/移居)，即使選了同一類別也套用降級/歸零，不比照一般同類別轉職保留
    if(isTransfer && (!sameCategory || opts.isOverseas)){
      // 12.6【定案】跨類別轉職：job_level降一級(不低於新人)，tenure_months歸零
      s.jobLevel = 0; s.tenureMonths = 0;
    }
    // 同類別轉職：job_level/tenure_months保留，只重骰薪資落點（12.6【定案】）
    s.occupationCategory = finalCategory;
    const catDef = findOccupationCategory(finalCategory);
    s.riskyLifestyle = !!(catDef && catDef.isHighRisk); // 12.3：is_high_risk旗標接上7.1.1死亡機率加成
    s.careerStatus = CAREER_STATUS.EMPLOYED;
    s.retirementStatus = s.retirementStatus || "在職";
    s.monthlyIncome = Math.round(computeCareerSalary(s, finalCategory) * SALARY_SCALE);
    if(wasFirstJob && !s.mealFullyUnlocked){ s.mealFullyUnlocked = true; s.mealJustUnlocked = true; }
    if(wasFirstJob) s.milestones.first_full_time_job = "completed";
    else if(isTransfer && s.milestones.first_job_change!=="completed") s.milestones.first_job_change = "completed";
    s.careerTransferCooldown = CAREER_TRANSFER_COOLDOWN_TURNS;
    s.promotionDeclineStreak = 0;
    rollCareerForeshadow(s); // 12.11：畢業後首次求職／轉職／失業後再就業，三個觸發點都會經過這裡的「錄取成功」分支
  } else {
    s.jobSearchStreak = (s.jobSearchStreak||0)+1;
    if(s.careerStatus!==CAREER_STATUS.EMPLOYED) s.careerStatus = CAREER_STATUS.JOB_SEARCHING;
  }
  s.pendingJobSearch = null;
  // 十二、12.11.1（2026-09-22新增）：若這次求職候選來自職涯伏筆(自由接案/演藝圈線/海外線)，結算候選狀態——
  // 「已接受」定義為確實錄取且落在該線對應的目標路徑(自由接案/演藝圈線需命中自由/創作類；海外線只要錄取即算，因為重點是離開原職而非特定類別)
  if(opts.foreshadowLine){
    const landedIntendedPath = opts.isOverseas ? hired : (hired && finalCategory==="自由/創作類");
    closeForeshadowCandidate(s, opts.foreshadowLine, landedIntendedPath);
  }
  s.careerEventLog = { type:"job_search", category:finalCategory, roll, probPct, hired, isTransfer:!!isTransfer, wasFallback:isFallbackForced };
  return { category:finalCategory, roll, probPct, hired };
}
// 觸發時機三種（12.4）：畢業/肄業後下一回合、失業後、玩家選擇轉職後；用career_status+studentStatus判斷，不看年齡
function checkJobSearchTrigger(s){
  if(s.pendingJobSearch) return;
  const graduatedNotWorking = (s.studentStatus==="graduated" || s.studentStatus==="withdrawn") &&
    !s.occupationCategory && s.careerStatus!==CAREER_STATUS.BUSINESS && s.careerStatus!==CAREER_STATUS.RETIRED && s.careerStatus!==CAREER_STATUS.SEMI_RETIRED;
  const searching = s.careerStatus===CAREER_STATUS.JOB_SEARCHING || s.careerStatus===CAREER_STATUS.UNEMPLOYED || graduatedNotWorking;
  if(searching){
    s.pendingJobSearch = { offers: buildJobSearchOffers(s), isTransfer:false, isFallback:(s.jobSearchStreak||0)>=JOB_SEARCH_STREAK_FALLBACK };
  }
}
const CAREER_TRANSFER_COOLDOWN_TURNS = 8; // 【測試參數,待驗證,12.6】比照9.5.1轉系冷卻
const CAREER_TRANSFER_STREAK_TRIGGER = 2; // 【測試參數,待驗證,12.6】升遷候選連續兩次未成立、或健康連續下降達門檻
function detectJobChangeIntent(actionText){
  return /轉職|換工作|換份工作|辭職|離職|想換跑道|不想做這份工作/.test(actionText||"");
}
// 12.6【定案】被動候選訊號一律採可結構化觀察的數值，不使用幸福感(隱藏數值，依3.8.1不進入判決迴路)
function checkTransferCandidate(s, activeIntent){
  if(s.careerStatus!==CAREER_STATUS.EMPLOYED || s.pendingJobSearch || (s.careerTransferCooldown||0)>0) return;
  const passiveTrigger = (s.promotionDeclineStreak||0)>=CAREER_TRANSFER_STREAK_TRIGGER || (s.lowHealthStreak||0)>=CAREER_TRANSFER_STREAK_TRIGGER;
  if(activeIntent || passiveTrigger){
    s.pendingJobSearch = { offers: buildJobSearchOffers(s), isTransfer:true, isFallback:false, passive:!activeIntent };
  }
}

// 12.5【定案,測試參數】升遷年資門檻：新人→熟手2年/熟手→資深4年/資深→管理職6年；自律與責任感門檻50分；持續達標而非單次跌破
const PROMOTION_TENURE_MONTHS = [24,48,72];
const PROMOTION_COOLDOWN_TURNS = 6; // 【測試參數,待驗證,12.5】
function checkPromotionCandidate(s){
  if(s.careerStatus!==CAREER_STATUS.EMPLOYED || s.occupationCategory==="自營/家庭事業類") return; // 自營類看12.8經營規模，不套用升遷
  if(s.pendingPromotionOffer || s.pendingJobSearch || (s.promotionCooldown||0)>0) return;
  const level = s.jobLevel||0;
  if(level>=3){ checkCareerForkAtLevelCap(s); return; }
  const tenureThreshold = PROMOTION_TENURE_MONTHS[level];
  const eligible = (s.tenureMonths||0) >= tenureThreshold &&
    s.conscientiousness.selfDiscipline>=50 && s.conscientiousness.responsibility>=50;
  if(eligible){
    s.pendingPromotionOffer = { fromLevel: level };
    s.promotionOffersEncountered = (s.promotionOffersEncountered||0)+1;
  }
}
// 12.5【定案】職級封頂後不再出現升遷候選，改為每隔一段時間出現「維持現狀/轉職/創業」的岔路點
function checkCareerForkAtLevelCap(s){
  if(s.pendingCareerForkOffer || (s.promotionCooldown||0)>0) return;
  s.pendingCareerForkOffer = {};
}
function resolveCareerForkOffer(s, choice){ // choice: "stay"/"transfer"/"startup"
  s.promotionCooldown = PROMOTION_COOLDOWN_TURNS;
  s.pendingCareerForkOffer = null;
  rollCareerForeshadow(s); // 12.11：職級封頂岔路點
  if(choice==="transfer") s.pendingJobSearch = { offers: buildJobSearchOffers(s), isTransfer:true, isFallback:false };
  else if(choice==="startup") s.pendingBusinessLaunch = {};
  s.careerEventLog = { type:"career_fork", choice };
}
// 12.5【定案,測試參數】升遷成功機率＝基礎40%＋(成就傾向−50)×0.3個百分點，沿用3.7.3既有公式
function resolvePromotionOffer(s, accept){
  s.promotionCooldown = PROMOTION_COOLDOWN_TURNS;
  s.pendingPromotionOffer = null;
  if(!accept){
    // 12.5【定案】玩家可拒絕升遷，記為skip_reason:chosen，推高自主感管道；拒絕不扣幸福感也不影響後續升遷資格
    s.promotionOffersDeclined = (s.promotionOffersDeclined||0)+1;
    s.careerEventLog = { type:"promotion", accepted:false };
    return;
  }
  const probPct = clamp(40 + (s.conscientiousness.achievement-50)*0.3, 5, 95);
  const roll = rnd(1,100);
  const success = roll<=probPct;
  if(success){
    s.jobLevel = clamp((s.jobLevel||0)+1, 0, 3);
    s.tenureMonths = 0;
    s.monthlyIncome = Math.round(computeCareerSalary(s, s.occupationCategory) * SALARY_SCALE);
    // 3.7.3既有的成就傾向健康扣分倍率，不另設代價
    const healthCostMult = clamp(1+(s.conscientiousness.achievement-50)*0.01, 0.5, 1.5);
    s.stats.health = clamp(s.stats.health - Math.round(3*healthCostMult), 0, 100);
    s.promotionDeclineStreak = 0;
  }
  s.careerEventLog = { type:"promotion", accepted:true, success, probPct, roll };
}

// 12.7【定案,測試參數】年度裁員機率依職業類別分流，再乘年資修正(每滿3年×0.9，累乘下限0.5倍)；自由/創作類與自營/家庭事業類不適用
const LAYOFF_ANNUAL_PROBABILITY = {
  "軍公教/警消類": 0.005, "受雇專業/白領類": 0.02, "長期不在身邊類": 0.03,
  "政治人物子女(自身從政)": 0.03, "勞力/服務類": 0.04, "不穩定/待業類": 0.12,
  "自由/創作類": null, "自營/家庭事業類": null
};
const LAYOFF_TENURE_DISCOUNT_INTERVAL_YEARS = 3;
function rollAnnualLayoffCheck(s){
  if(s.careerStatus!==CAREER_STATUS.EMPLOYED) return { justForeshadowed:false, layoffTriggered:false };
  const baseProb = LAYOFF_ANNUAL_PROBABILITY[s.occupationCategory];
  if(baseProb==null) return { justForeshadowed:false, layoffTriggered:false };
  const tenureYears = (s.tenureMonths||0)/12;
  const discount = Math.max(0.5, Math.pow(0.9, Math.floor(tenureYears/LAYOFF_TENURE_DISCOUNT_INTERVAL_YEARS)));
  const hit = Math.random() < (baseProb*discount);
  if(!hit) return { justForeshadowed:false, layoffTriggered:false };
  // 12.7【定案】裁員前需有前兆，比照7.1.2前兆機制的兩段式關卡設計精神
  if(!s.layoffForeshadowed){ s.layoffForeshadowed = true; return { justForeshadowed:true, layoffTriggered:false }; }
  s.layoffForeshadowed = false;
  s.careerStatus = CAREER_STATUS.UNEMPLOYED;
  s.justLostJob = true; // 【定案,2026-09-23】七、7.6.2婚姻危機失業觸發改讀這個旗標，回合結束時清除
  s.monthlyIncome = 0;
  s.jobSearchStreak = 0;
  return { justForeshadowed:false, layoffTriggered:true };
}

// 12.8 創業
// 12.8.1【定案,9/20取代原雙條件草案】啟動門檻改為單一條件：現金≥啟動資金，比照7.5.3買房頭期款的既定做法
function computeStartupCapitalRequired(){
  const cat = findOccupationCategory("自營/家庭事業類");
  return Math.round((cat.salaryRange[0]+cat.salaryRange[1])/2 * 12);
}
function launchBusiness(s){
  const capital = computeStartupCapitalRequired();
  if(s.cash < capital) return false; // 現金不足：客戶端直接擋下，不扣款、不建立事業
  s.cash -= capital;
  s.businessCapital = capital;
  s.businessStatus = "經營中";
  s.businessOrigin = "startup"; // 12.11.1（2026-09-22新增）：區別於接手家業，供rollAnnualBusinessCheck()判斷是否套用接手家業的成功率加成
  s.occupationCategory = "自營/家庭事業類";
  s.careerStatus = CAREER_STATUS.BUSINESS;
  s.consecutiveLossYears = 0;
  s.monthlyIncome = Math.round(computeCareerSalary(s, "自營/家庭事業類") * SALARY_SCALE);
  // 12.8.3：第一次創業改列客戶端結構化自動判斷
  if(s.milestones.first_startup!=="completed") s.milestones.first_startup = "completed";
  s.careerEventLog = { type:"business_launch", success:true };
  return true;
}
// 十二、12.11.1（2026-09-22新增,Claude Code依使用者直接詢問後建議判斷,可覆寫）：接手家業已有既有客源/品牌/營運模式，
// 起跑點比從零開始的新創更穩，年度營運成功率額外+10個百分點，量級比照下方才識/人脈修正(各自約±10)與興趣投入度修正上限(+5)同一數量級
const INHERITED_BUSINESS_SUCCESS_BONUS_PP = 10; // 【測試參數】
// 12.8.2【定案,測試參數】年度營運成功率＝基礎45%＋(成就傾向−50)×0.3＋才識修正＋人脈修正＋相關興趣投入度修正(上限+5個百分點)＋接手家業加成
function rollAnnualBusinessCheck(s){
  if(s.businessStatus!=="經營中") return null;
  const topInvestment = (s.interestCandidates||[]).length ? Math.max.apply(null,(s.interestCandidates||[]).map(c=>c.investment||0)) : 0;
  const interestMod = Math.min(topInvestment*0.05, 5); // 8.4限制：興趣投入度只能是有上限的修正項，不得直接當成功率使用
  const inheritedMod = s.businessOrigin==="inherited" ? INHERITED_BUSINESS_SUCCESS_BONUS_PP : 0;
  const probPct = clamp(45 + (s.conscientiousness.achievement-50)*0.3 + (s.stats.knowledge-50)*0.1 + (s.stats.network-50)*0.1 + interestMod + inheritedMod, 5, 95);
  const roll = rnd(1,100);
  // 技術判斷：三態切分非文件明文規定，成長取roll<=probPct，持平再取後20個百分點，其餘視為虧損
  let outcome;
  if(roll<=probPct){
    outcome = "growth";
    s.jobLevel = clamp((s.jobLevel||0)+1, 0, 3);
    s.monthlyIncome = Math.round(computeCareerSalary(s, "自營/家庭事業類") * SALARY_SCALE);
    s.consecutiveLossYears = 0;
  } else if(roll<=Math.min(probPct+20,100)){
    outcome = "flat";
    s.consecutiveLossYears = 0;
  } else {
    outcome = "loss";
    s.cash = Math.max(0, s.cash - Math.round((s.businessCapital||0)*0.1));
    s.consecutiveLossYears = (s.consecutiveLossYears||0)+1;
  }
  if(s.consecutiveLossYears>=2 && !s.pendingBusinessContinuation && (s.businessContinuationCooldown||0)<=0){
    s.pendingBusinessContinuation = {};
  }
  return { outcome, roll, probPct };
}
function resolveBusinessContinuation(s, choice){ // "close"/"persist"/"inject"
  s.businessContinuationCooldown = 4; // 12.8.2【定案】冷卻4回合
  s.pendingBusinessContinuation = null;
  if(choice==="close"){
    s.businessStatus = "收攤";
    s.careerStatus = CAREER_STATUS.UNEMPLOYED; // 12.8.2【定案】收攤後回到12.4求職段落，不卡死人生
    s.justLostJob = true; // 【定案,2026-09-23】收攤視同一次失業寫入點，同樣要設旗標
    s.occupationCategory = null;
    s.monthlyIncome = 0;
    s.consecutiveLossYears = 0;
    s.businessOrigin = null;
  } else if(choice==="inject"){
    const capital = computeStartupCapitalRequired();
    if(s.cash>=capital){ s.cash -= capital; s.businessCapital = (s.businessCapital||0)+capital; s.consecutiveLossYears = 0; }
    // 現金不足：增資不成立，客戶端直接擋下，維持原狀
  }
  // persist：不做任何變動，繼續撐一年
  s.careerEventLog = { type:"business_continuation", choice };
}

// 12.10 退休與職涯結束（9/20整併，吸收十三、13.4草案）
const RETIREMENT_CANDIDATE_MIN_AGE = 60; // 【測試參數,待驗證,12.10】
const RETIREMENT_ANNUAL_OFFER_AGE = 65;
const RETIREMENT_EARLY_MIN_AGE = 55;
// 12.10【定案,測試參數】退休金替代率依職業類別在40%-60%區間分流
const RETIREMENT_REPLACEMENT_RATE = {
  "軍公教/警消類": 0.6, "政治人物子女(自身從政)": 0.55, "受雇專業/白領類": 0.5,
  "長期不在身邊類": 0.5, "勞力/服務類": 0.48, "自營/家庭事業類": 0.45,
  "不穩定/待業類": 0.4, "自由/創作類": 0.4
};
const RETIREMENT_FORCED_HEALTH_THRESHOLD = 20; // 【測試參數,待驗證,12.10／十三、13.3.4】待十三章health_cap機制實作後再校準
function checkRetirementCandidate(s){
  if(s.retirementStatus==="已退休" || s.pendingRetirementOffer) return;
  const working = s.careerStatus===CAREER_STATUS.EMPLOYED || s.careerStatus===CAREER_STATUS.BUSINESS || s.careerStatus===CAREER_STATUS.SEMI_RETIRED;
  if(!working) return;
  // 被迫退休分支：健康低於閾值時，不經過六選項候選，直接觸發（十三、13.3.4重大疾病治療期的觸發，待十三章實作後另外補掛）
  if(s.stats.health < RETIREMENT_FORCED_HEALTH_THRESHOLD){
    s.pendingRetirementOffer = { forced:true };
    return;
  }
  if(s.age>=RETIREMENT_CANDIDATE_MIN_AGE && (s.age>=RETIREMENT_ANNUAL_OFFER_AGE || !s.retirementOfferedOnce)){
    s.pendingRetirementOffer = { forced:false };
    s.retirementOfferedOnce = true;
  }
}
// choice: "on_time"/"delay"/"early"/"semi"/"no_retire"/null(自訂輸入，視同no_retire)
function resolveRetirementOffer(s, choice){
  s.pendingRetirementOffer = null;
  if(!choice || choice==="delay" || choice==="no_retire"){
    s.careerEventLog = { type:"retirement", choice: choice||"no_retire" };
    return; // 繼續工作，不做任何狀態變動（呼應6.4永遠可以跳過）
  }
  if(choice==="early" && s.age<RETIREMENT_EARLY_MIN_AGE) return; // 防呆：未達提早退休年齡
  const rate = RETIREMENT_REPLACEMENT_RATE[s.occupationCategory] || 0.45;
  const preRetireSalary = s.monthlyIncome;
  s.retirementStatus = "已退休";
  s.careerStatus = choice==="semi" ? CAREER_STATUS.SEMI_RETIRED : CAREER_STATUS.RETIRED;
  // 3.4.7既有「下一個完整月份才計入」規則：這裡直接覆寫monthlyIncome，因為退休決定發生在彈窗(回合之間)，
  // 自然只會影響下一次月結算，不會回溯這一回合已經算過的舊薪水，效果上等同「下一個完整月份起才變動」
  s.monthlyIncome = Math.round(preRetireSalary * rate * (choice==="semi" ? 0.5 : 1));
  s.careerEventLog = { type:"retirement", choice };
  // 12.10【定案】退休不扣幸福感，代碼中不出現「若已退休則幸福感-x」的寫法（呼應3.8.4程式層禁令，本函式完全不觸碰幸福感相關欄位）
}

// 12.11 職涯伏筆觸發點：掛在5個既有職涯狀態轉換節點，不新增判定回合(呼應9.1)
// 12.11.1（2026-09-22新增，取代原本「只寫入不讀取」的缺口）：命中後不再是單純的旗標陣列，而是{line,hitAge,hitTurn,status}
// 記錄，status依序鋪陳中(brewing)→已成為候選(candidate)→已接受(accepted)/已拒絕(declined)；判定順序每次隨機打亂，
// 不再固定創業線優先；每條線只要曾經有記錄（不論哪個狀態）就不會再命中第二次
function shuffledForeshadowLines(){
  const arr = FORESHADOW_LINES.slice();
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
function rollCareerForeshadow(s){
  if(!s.studentMajorGroup) return null;
  s.careerForeshadowLines = s.careerForeshadowLines || [];
  let hit = null;
  shuffledForeshadowLines().forEach(line=>{
    if(hit) return;
    if(s.careerForeshadowLines.some(e=>e.line===line)) return; // 每條線每一世最多命中一次
    if(Math.random() < foreshadowTriggerProbability(s.studentMajorGroup, line)){
      hit = line;
      s.careerForeshadowLines.push({ line, hitAge:s.age, hitTurn:s.turnCount, status:"brewing" });
    }
  });
  return hit;
}
const FORESHADOW_CANDIDATE_DELAY_TURNS = 6; // 【測試參數】命中後延遲幾回合才排入候選，鋪陳期間讓AI先自然帶出相關人事物
const FORESHADOW_CREATIVE_OFFER_BONUS_PP = 10; // 【測試參數】自由接案/演藝圈線候選時，「自由/創作類」錄取機率加成
const FORESHADOW_OVERSEAS_CASH_MONTHS = 6; // 【測試參數】海外線候選現金門檻＝N個月基本生活開銷（12.6.1原本待補的具體金額）
// 五、5.2.5／十二、12.11.1：接手家業前置條件——有一位父母角色卡職業為自營業者、仍在世、且這個機會還沒被任一觸發來源用掉過
// （2026-09-22補充：接手家業有兩個觸發來源——本函式供伏筆線與家長退休共用同一個判斷與同一個familyBusinessOfferUsed防重複旗標）
function findFamilyBusinessParent(s){
  return (s.characters||[]).find(c=>c.origin==="父母，從出生起" && c.occupation==="自營業者" && c.active!==false && !c.deceased && !c.familyBusinessOfferUsed) || null;
}
function closeForeshadowCandidate(s, line, accepted){
  const entry = (s.careerForeshadowLines||[]).find(e=>e.line===line && e.status==="candidate");
  if(entry) entry.status = accepted ? "accepted" : "declined";
}
// 每回合都要跑的掃描：鋪陳期滿的職涯伏筆線接回既有機制成為候選。各線候選欄位若被其他事件占用，這次先跳過，下回合再試
function sweepCareerForeshadowCandidates(s){
  (s.careerForeshadowLines||[]).forEach(entry=>{
    if(entry.status!=="brewing") return;
    if((s.turnCount - (entry.hitTurn||0)) < FORESHADOW_CANDIDATE_DELAY_TURNS) return;
    if(entry.line==="創業線"){
      if(s.businessStatus==="經營中"){ entry.status = "declined"; return; } // 已在創業中，直接記為已使用
      if(s.pendingBusinessLaunch) return;
      s.pendingBusinessLaunch = { foreshadowLine: entry.line };
      entry.status = "candidate";
    } else if(entry.line==="自由接案" || entry.line==="演藝圈線"){
      if(s.pendingJobSearch) return;
      s.pendingJobSearch = { offers: buildJobSearchOffers(s, { creativeBonusPct: FORESHADOW_CREATIVE_OFFER_BONUS_PP }), isTransfer: s.careerStatus===CAREER_STATUS.EMPLOYED, isFallback:false, foreshadowLine: entry.line, creativeBonusPct: FORESHADOW_CREATIVE_OFFER_BONUS_PP };
      entry.status = "candidate";
    } else if(entry.line==="海外線"){
      if(s.pendingJobSearch) return;
      if(s.cash < computeBaseLivingCost(s)*FORESHADOW_OVERSEAS_CASH_MONTHS){ entry.status = "declined"; return; } // 現金不足，候選不成立，不扣款
      s.pendingJobSearch = { offers: buildJobSearchOffers(s), isTransfer:true, isFallback:false, foreshadowLine: entry.line, isOverseas:true };
      entry.status = "candidate";
    } else if(entry.line==="接手家業"){
      const parent = findFamilyBusinessParent(s);
      if(!parent){ entry.status = "declined"; return; } // 前置條件不成立，只保留敘事，不產生候選
      if(s.pendingFamilyBusinessOffer) return;
      s.pendingFamilyBusinessOffer = { foreshadowLine: entry.line, parentName: parent.name };
      entry.status = "candidate";
    }
  });
}
// 十二、12.11.1（2026-09-22補充）：接手家業的第二個觸發來源——家長退休（parent_retirement里程碑由AI回報completed）時，
// 若還有一位自營業者家長沒被問過，也排入同一個「回家接手」候選；跟伏筆線觸發共用findFamilyBusinessParent()同一份判斷，
// 兩個來源合計每位家長只會被詢問一次，差別只在觸發來源不同（呼應9.3/12.11.1【定案】兩者共用同一個交棒動作）
function checkFamilyBusinessOnParentRetirement(s){
  if(s.pendingFamilyBusinessOffer) return;
  const parent = findFamilyBusinessParent(s);
  if(!parent) return;
  s.pendingFamilyBusinessOffer = { foreshadowLine: null, parentName: parent.name };
}
// 接受「接手家業」：玩家比照既有轉職流程結束原職業，occupation_category轉為自營/家庭事業類、business_status經營中，
// 免啟動資金，不計入first_startup里程碑（12.11.1【定案】，區別於12.8.1一般創業路徑）
function acceptFamilyBusinessOffer(s){
  s.occupationCategory = "自營/家庭事業類";
  s.businessStatus = "經營中";
  s.businessOrigin = "inherited"; // 供rollAnnualBusinessCheck()判斷是否套用接手家業的成功率加成
  s.careerStatus = CAREER_STATUS.BUSINESS;
  s.consecutiveLossYears = 0;
  s.monthlyIncome = Math.round(computeCareerSalary(s, "自營/家庭事業類") * SALARY_SCALE);
  s.careerEventLog = { type:"family_business_takeover", success:true };
}
// pending: { foreshadowLine, parentName }；choice: "accept"/"decline"——不論接受或拒絕，該家長都標記familyBusinessOfferUsed，
// 兩個觸發來源合計只會問這位家長一次；只有實際接受才額外標記handedOver（12.11.1【定案】「該家長職業標記為已交棒」）
function resolveFamilyBusinessOffer(s, pending, choice){
  const parent = s.characters.find(c=>c.name===pending.parentName);
  if(parent){
    parent.familyBusinessOfferUsed = true;
    if(choice==="accept") parent.handedOver = true;
  }
  if(choice==="accept") acceptFamilyBusinessOffer(s);
  if(pending.foreshadowLine) closeForeshadowCandidate(s, pending.foreshadowLine, choice==="accept");
}

// 12.12：職涯主狀態欄位初始化輔助——所有欄位皆用||預設值處理，比照9.4/9.8既有做法，不需要改newRoll()/succeedAsChild()，對舊存檔相容
function ensureCareerDefaults(s){
  if(!s.careerStatus) s.careerStatus = s.occupationCategory ? CAREER_STATUS.EMPLOYED : CAREER_STATUS.NOT_EMPLOYED;
  if(!s.retirementStatus) s.retirementStatus = "在職";
  if(typeof s.jobLevel!=="number") s.jobLevel = 0;
  if(typeof s.tenureMonths!=="number") s.tenureMonths = 0;
}
// 每年判定一次的職涯檢查集合：裁員/創業年度營運/退休候選，比照7.1.5rollAnnualDeathCheck()「每滿一年才判定一次」的既有做法，與回合預算解耦
function rollAnnualCareerChecks(s){
  ensureCareerDefaults(s);
  const layoff = rollAnnualLayoffCheck(s);
  const business = rollAnnualBusinessCheck(s);
  checkRetirementCandidate(s);
  return { layoff, business };
}
// 每回合都要跑的職涯檢查集合：求職觸發/升遷候選/轉職候選(段落型判定，不與回合預算解耦)
function checkCareerTriggers(s){
  ensureCareerDefaults(s);
  checkJobSearchTrigger(s);
  checkPromotionCandidate(s);
  checkTransferCandidate(s, false);
  sweepCareerForeshadowCandidates(s); // 十二、12.11.1（2026-09-22新增）
}

let state = null;
// 十、10.3.8：點數歸零時畫面停用到補回來為止；玩家把頁面開著跨過台灣時間00:00時，每分鐘檢查一次自動解鎖
setInterval(()=>{
  if(state && state.phase==="playing" && totalAP(state)===0 && refillDailyIfNeeded(state)){
    document.getElementById("ap-exhausted-modal")?.remove();
    saveGame(); render();
  }

// 十、10.1（9/19新增）：封測階段純金鑰模式的啟動流程，取代原本單純讀localStorage的loadGame()
// 流程：本機沒有金鑰→顯示「開始新旅程／我有復原金鑰」選擇；本機有金鑰→嘗試自動接續上次玩的slot，
// 失敗（沒記住slot、或該slot讀取失敗）才顯示選擇要繼續哪一段人生的畫面
async function initApp(){
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  if(!key){
    state = { phase:"keyChoice" };
    render();
    return;
  }
  const activeSlotRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
  const activeSlot = activeSlotRaw!==null ? Number(activeSlotRaw) : null;
  if(activeSlot!==null){
    const loaded = await tryLoadSlot(key, activeSlot, true);
    if(loaded) return;
  }
  await showSlotPicker(key);
}
// 讀取指定slot：先試Worker(跨裝置的最新資料)，失敗且allowLocalFallback時退回本機快取（離線容錯，不會直接卡死玩家）
async function tryLoadSlot(key, slot, allowLocalFallback){
  cloudSyncStatus = null; // 十、10.1補充：換一段人生要玩，上一段的同步狀態顯示沒有意義了
  try{
    const res = await fetch(WORKER_URL+"load?key="+encodeURIComponent(key)+"&slot="+slot);
    const data = await res.json();
    if(data && data.success){
      state = data.state;
      try{ localStorage.setItem(STORAGE_KEY+":"+slot, JSON.stringify(state)); }catch(e){}
      render();
      return true;
    }
  }catch(e){ console.warn("從雲端讀取存檔失敗，嘗試本機快取", e); }
  if(allowLocalFallback){
    try{
      const raw = localStorage.getItem(STORAGE_KEY+":"+slot);
      if(raw){ state = JSON.parse(raw); render(); return true; }
    }catch(e){}
  }
  return false;
}
async function showSlotPicker(key, currentSlot){
  let slots = [null,null,null];
  let wallet = 0; // 十、10.3.3金鑰錢包：封測未開放購買，實際上會一直是0，轉點介面等開放付費再做
  try{
    const res = await fetch(WORKER_URL+"slots?key="+encodeURIComponent(key));
    const data = await res.json();
    if(data && data.success && Array.isArray(data.slots)) slots = data.slots;
    if(data && data.success) wallet = Number(data.wallet)||0;
  }catch(e){ console.warn("讀取存檔清單失敗", e); }
  // 十、10.1補充（2026-09-22新增）：currentSlot有值時(從switchLife()同一瀏覽器內切換人生進來)，
  // renderSlotPicker()要在對應那段人生標示「進行中」；換裝置輸入金鑰進來的路徑不會帶這個參數，維持原樣不顯示
  state = { phase:"slotPicker", slots, wallet, currentSlot: currentSlot!==undefined ? currentSlot : null };
  render();
}
// 十、10.1補充（2026-09-22新增）：同一瀏覽器內切換人生——只清除本機「目前使用中slot」記錄，不刪除任何存檔，
// 回到三段人生選擇畫面(跟換裝置輸入金鑰後看到的畫面一樣)，並標示玩家剛剛離開的那一段是「進行中」
async function switchLife(){
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  const prevSlotRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
  const prevSlot = prevSlotRaw!==null ? Number(prevSlotRaw) : null;
  try{ localStorage.removeItem(ACTIVE_SLOT_STORAGE_NAME); }catch(e){}
  cloudSyncStatus = null;
  if(!key){ state = { phase:"keyChoice" }; render(); return; } // 防呆：理論上進得了playing畫面一定已經有金鑰
  await showSlotPicker(key, prevSlot);
}
async function saveGame(){
  const slotRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
  const slot = slotRaw!==null ? Number(slotRaw) : null;
  try{ localStorage.setItem(STORAGE_KEY+(slot!==null?":"+slot:""), JSON.stringify(state)); }
  catch(e){ console.warn("save failed", e); }
  // 十、10.1（9/19新增）：本機存完之後，同步存一份到Worker的KV，達成跨裝置存檔。
  // 只在真正進入遊戲(playing/ending)且有金鑰+slot時才同步，避免setup過程中還沒真的開始的角色也去打API；
  // 失敗只console.warn，不影響當下遊玩（本機那份已經存好了）
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  if(key && slot!==null && state && (state.phase==="playing" || state.phase==="ending")){
    try{
      const res = await fetch(WORKER_URL+"save", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          key, slot,
          meta: { name:state.name, age:state.age, stage:stageLabel(state.age), updatedAt:Date.now() },
          state
        })
      });
      // 十、10.1補充（2026-09-22修正）：原本只看fetch有沒有拋出網路例外，Worker回傳403/429/500等HTTP錯誤狀態
      // 時fetch本身不會拋例外，會被誤判成同步成功——改成明確檢查res.ok(HTTP狀態碼)+回傳body的success欄位
      let data = null;
      try{ data = await res.json(); }catch(e){}
      if(!res.ok || !data || data.success!==true) throw new Error("Worker回傳失敗狀態："+res.status);
      cloudSyncStatus = { success:true, time:Date.now() };
    }catch(e){
      console.warn("雲端存檔失敗", e);
      cloudSyncStatus = { success:false };
    }
    updateCloudSyncStatusUI();
  }
}
// 十、10.1補充（2026-09-22新增）：只更新畫面上「☁️ 已同步」狀態文字的那個小容器，不呼叫完整的render()——
// saveGame()是fire-and-forget呼叫(呼叫端通常不await，緊接著就呼叫render())，如果這裡也呼叫完整render()，
// 等雲端fetch非同步結束時很可能會蓋掉玩家當下正在輸入的自訂行動文字框內容
function cloudSyncStatusHTML(){
  if(!cloudSyncStatus) return "";
  if(cloudSyncStatus.success){
    const d = new Date(cloudSyncStatus.time);
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    return `☁️ 已同步：${hh}:${mm}`;
  }
  return `⚠️ 雲端同步失敗，這段進度目前只存在本機 <a id="link-retry-sync">重試同步</a>`;
}
function updateCloudSyncStatusUI(){
  const wrap = document.getElementById("cloud-sync-status-wrap");
  if(!wrap) return; // 不在playing/ending畫面時，畫面上本來就沒有這個容器
  wrap.innerHTML = cloudSyncStatusHTML();
  const retryLink = document.getElementById("link-retry-sync");
  if(retryLink) retryLink.onclick = ()=>{ saveGame(); };
}

// 9/19改版：斷點常數÷1000換算自原NT$數字，同步3.4.1家庭月收入/存款的遊戲幣單位改版，避免量級對不上恆算出接近0分（見3.4.6補充定案）
function computeFinancialHealth(savings, monthlyIncome){
  const savingsScore = savings<100 ? (savings/100)*40 : savings<3000 ? 40+((savings-100)/2900)*35 : 75+Math.min(25,(savings-3000)/200);
  const incomeScore = monthlyIncome<40 ? (monthlyIncome/40)*40 : monthlyIncome<100 ? 40+((monthlyIncome-40)/60)*35 : 75+Math.min(25,(monthlyIncome-100)/20);
  return clamp(Math.round(savingsScore*0.5+incomeScore*0.5),0,100);
}

const HOUSEHOLD_SHARED_LIVING_MULTIPLIER = 1.6; // 【測試參數,待驗證,3.4.11】已婚雙薪/已婚單薪：共同生活基本開銷＝單人基準×1.6，搭配配偶收入併入計算
// 七、7.6.1.1／三、3.4.11（2026-09-22新增）：同居(未婚)不合併伴侶收入，係數改為單人基準×1.6÷2＝0.8倍，
// 不再套用已婚的1.6倍——原本同居套用跟已婚一樣的1.6倍但沒有伴侶收入併入，等於玩家一個人負擔比單身還貴的開銷
const HOUSEHOLD_COHABITING_LIVING_MULTIPLIER = HOUSEHOLD_SHARED_LIVING_MULTIPLIER / 2; // 【測試參數】0.8倍
// 【定案】子女扶養費依年齡三級，大學階段直接接3.4.4(統一由家長支付，不扣款)，不重複建一套
const CHILD_SUPPORT_PRESCHOOL_MAX_AGE = 5;
const CHILD_SUPPORT_SCHOOL_MAX_AGE = 17;
const CHILD_SUPPORT_AMOUNT = { preschool:3, school:5 }; // 【待驗證,3.4.11】三級扶養費具體金額，跟3.4.8基準金額一樣先用參數值
function childSupportAmount(age){
  if(typeof age!=="number") return 0;
  if(age<=CHILD_SUPPORT_PRESCHOOL_MAX_AGE) return CHILD_SUPPORT_AMOUNT.preschool;
  if(age<=CHILD_SUPPORT_SCHOOL_MAX_AGE) return CHILD_SUPPORT_AMOUNT.school;
  return 0; // 大學階段：3.4.4統一由家長支付，不接扣款機制；已成年離家：不再列入扶養
}
function computeChildSupportCost(s){
  // 【定案】多名子女各自計算，不打折
  return (s.characters||[]).filter(c=>c.isChild && c.active).reduce((sum,c)=>sum+childSupportAmount(c.age),0);
}
function computeBaseLivingCost(s){
  // 9/14改版：學生時期(尚無正職)改用5.5生活方式選擇的公式，遊戲內單位，不對應NT$；出社會後維持既有housing分級公式
  if(!s.occupationCategory){
    const habitPct = SPENDING_HABITS[s.spendingHabit] ?? SPENDING_HABITS["普通花費"];
    const mealMult = MEAL_EXPENSE_MULT[s.mealArrangement] ?? MEAL_EXPENSE_MULT["自己打理"];
    return Math.round(s.monthlyIncome * habitPct * mealMult);
  }
  const tier = livingCostTierForState(s);
  let amount = LIVING_COST_BASE[tier] * LIVING_COST_MULTIPLIER;
  // 三、3.4.11（2026-09-20新增，2026-09-22拆分同居/已婚兩組係數，取代原本「與伴侶共同生活時整體×0.75」算不出household_status的舊做法）：
  // 已婚雙薪/已婚單薪採分攤係數1.6倍(搭配配偶收入併入計算)；同居(未婚)不合併伴侶收入，改用0.8倍；離婚後回到單身級距，不套用此係數
  const householdStatus = computeHouseholdStatus(s);
  if(householdStatus==="已婚雙薪" || householdStatus==="已婚單薪"){
    amount = amount * HOUSEHOLD_SHARED_LIVING_MULTIPLIER;
  } else if(householdStatus==="同居"){
    amount = amount * HOUSEHOLD_COHABITING_LIVING_MULTIPLIER;
  }
  // 十三、13.3.3（2026-09-20新增）：慢性病每項每月低費用等級固定支出，掛在這裡與子女扶養費同一套週期性結算路徑
  return Math.round(amount) + computeChildSupportCost(s) + (s.chronicConditions||[]).length*CHRONIC_CONDITION_MONTHLY_COST;
}

// 二、2.2學期內部節奏切分（9/16改版）：期中/期末各自有完整準備期（取代原本「期中後~期末前」單一段落混合準備+收尾的不對稱結構）
// 一學年14段，每段有回合預算(budget)，期中考/期末考是budget=1的里程碑段，觸發時算考試成績

  { key:"假期", budget:8, isExam:false }

const YEAR_SEGMENTS = [
  ...SEMESTER_PHASES.map(p=>({ ...p, half:"上學期" })),
  ...SEMESTER_PHASES.map(p=>({ ...p, half:"下學期" }))
]; // 14段：上學期7段+下學期7段（假期段落分別代表寒假/暑假），一學期預算上限27回合、一學年54回合
// 一、1.2.9.1（2026-09-23修正,發現monthsCrossed校準bug）：學生時期每回合的monthsCrossed原本寫死1.5，
// 54回合(一整年)累加起來等於81個月(6.75年)，跟「54回合＝年齡+1歲」的既有結構(見advanceStageYear)完全對不上——
// 已用Node vm模擬驗證：55回合(含開場段落)跑滿一整年，累加monthsCrossed=81，不是預期的12。
// 對照career模式既有的12/budget算法(12個月平均分攤到該年齡帶的budget回合數，兩者相除必為12)，
// 改用同一種算法：12個月平均分攤到一整年的54回合，讓總量正確等於12，不分段落類型(exam/prep/假期等份量差異留待之後細分，見1.2.9.1備註)
const STUDENT_MONTHS_PER_ROUND = 12 / YEAR_SEGMENTS.reduce((sum,seg)=>sum+seg.budget,0);

// 二、2.5（9/16新增，9/16-v2.1下修數字+年齡帶改左閉右開）：22歲以後加速曲線，取代原本「30歲以後交給AI自行判斷age_advance」的舊架構
// 邊界採10年一段、左閉右開（以生日為界，22-29歲＝22歲起滿30歲生日前），取代v2.1之前22-30/31-40等不對稱分段
const LIFE_STAGE_ROUND_BUDGET = [
  { minAge:22, maxAge:29, roundsPerYear:32 }, // 找方向期
  { minAge:30, maxAge:39, roundsPerYear:28 },
  { minAge:40, maxAge:49, roundsPerYear:15 },
  { minAge:50, maxAge:59, roundsPerYear:12 },
  { minAge:60, maxAge:69, roundsPerYear:10 },
  { minAge:70, maxAge:79, roundsPerYear:7 },
  { minAge:80, maxAge:9999, roundsPerYear:5 } // 【待驗證】預設值，實際存活年數依死亡判定結果而定
];
function roundsPerYearForAge(age){
  const bucket = LIFE_STAGE_ROUND_BUDGET.find(b=>age>=b.minAge && age<=b.maxAge);
  return bucket ? bucket.roundsPerYear : 10;
}
// 九、9.4（9/16新增）：修業年限改為依角色查表，取代原本寫死的「大學4年」
// s.collegeYearsRequired：科系基礎修業年限，一般科系4年、醫/牙/獸科系5年，由9.2/9.4科系選擇機制(assignStudentMajor())決定，未選科系前預設4年
// s.collegeDelayYearsUsed：已使用的延畢年數，封頂COLLEGE_DELAY_CAP，由9.5.3休學/延畢機制(sweepUniversityState())寫入
const COLLEGE_DELAY_CAP = 2; // 【定案,9.4】延畢封頂兩年
// 9.5.2（9/16 ChatGPT開發審閱+Claude Code判斷,可覆寫）：雙主修zero-cost，不計入delay_years，
// 雙主修相關代碼(renderDualMajorOfferModal()等)完成後同樣不會呼叫任何地方去增加collegeDelayYearsUsed
const COLLEGE_GRAD_AGE_CAP = { 4:24, 5:25 }; // 【定案,9.4】其餘科系最晚24歲、醫牙獸最晚25歲畢業
// 9.4「轉系最後可行年齡」：轉系當下年齡+目標科系修業年限+目前已用延畢年數，不得超過目標科系的畢業年齡上限
// （已用延畢年數要算進去，因為它代表「已消耗掉多少延畢緩衝額度」，轉系不會重置這個額度，見9.4【待驗證】備註）
function isTransferFeasible(currentAge, targetYearsRequired, delayYearsUsed){
  const cap = COLLEGE_GRAD_AGE_CAP[targetYearsRequired] || COLLEGE_GRAD_AGE_CAP[4];
  const usedDelay = clamp(delayYearsUsed||0, 0, COLLEGE_DELAY_CAP);
  return (currentAge + targetYearsRequired + usedDelay) <= cap;
