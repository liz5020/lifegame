}

function snapshotForUndo(){
  state.snapshot = JSON.parse(JSON.stringify({
    age:state.age, stats:state.stats, happiness:state.happiness,
    actionPoints:state.actionPoints, turnCount:state.turnCount,
    characters:state.characters, chronicle:state.chronicle,
    log:state.log, choices:state.choices,
    anxiety:state.anxiety, avoidance:state.avoidance,
    peerPosition:state.peerPosition, peerPositionSpecial:state.peerPositionSpecial,
    keyEvent:state.keyEvent, timeState:state.timeState, collegeLocation:state.collegeLocation,
    cash:state.cash, propertyValue:state.propertyValue, mortgageBalance:state.mortgageBalance,
    monthlyIncome:state.monthlyIncome, monthlyExpenses:state.monthlyExpenses,
    occupationCategory:state.occupationCategory, housing:state.housing,
    temperament:state.temperament, appearance:state.appearance,
    conscientiousness:state.conscientiousness, lowHealthStreak:state.lowHealthStreak,
    riskyLifestyle:state.riskyLifestyle, deathForeshadowed:state.deathForeshadowed,
    fertilityJourney:state.fertilityJourney, lastSettlement:state.lastSettlement,
    // 三、3.8／四、4.5（9/20新增）：回上一步時這些也要一起還原，否則undo後幸福感基準線與軌跡累計會對不上
    happinessBaseline:state.happinessBaseline, happinessRegressionCounter:state.happinessRegressionCounter,
    milestoneSkipReason:state.milestoneSkipReason,
    lifeTrajectory:state.lifeTrajectory, stageAccum:state.stageAccum
  }));
}
function applySnapshot(){
  if(!state.snapshot) return;
  Object.assign(state, JSON.parse(JSON.stringify(state.snapshot)));
}
function restoreUndo(){
  if(!state.snapshot) return;
  applySnapshot();
  state.undosLeft -= 1;
  state.snapshot = null;
  saveGame(); render();
}

async function takeTurn(actionText, cost){
  if(state.phase!=="playing") return;
  if(state.actionPoints < cost){ renderPaywall(); return; }
  snapshotForUndo();
  state.actionPoints -= cost;
  state.turnCount += 1;

  // 九、9.5.1轉系候選判定需要「考前實際累積的讀書次數」，必須在advanceStructuredTime把studyCountThisTerm歸零之前先存一份快照，
  // 否則applyResult()拿到的會是考試結算後已經歸零的值。這份快照(studyCountAtExam)同時也用來修正buildUserMessage()的
  // exam_score_hint/study_count_this_term計算順序bug（9/16修正，見2.4.1）
  const studyCountBeforeAdvance = state.studyCountThisTerm||0;
  // 二、2.5（9/16新增）：22歲以後改採加速曲線回合預算，取代原本「30歲以後交給AI自行判斷age_advance」的舊架構
  // 全生涯（15歲起）都由客戶端結構化算好本回合要推進多少時間，AI的age_advance一律視為0，不再有年齡分界
  const adv = advanceStructuredTime(actionText);
  // 十一、11.4（9/19新增）：期末考是首版明牌檢定白名單唯一節點，命中就在呼叫AI之前先擲骰決定確切分數
  // （呼應7.1.5死亡機制精神，不讓AI自由裁量這個數字），期中考不受影響、維持原本hint範圍由AI自由發揮
  const examCheck = (adv.examTriggered && adv.examType==="期末考") ? rollFinalExamCheck(state.stats.knowledge, studyCountBeforeAdvance) : null;
  let timeCtx = { structured:true, label: adv.toLabel, jump: adv.bigJump ? {from:adv.fromLabel, to:adv.toLabel} : null, monthsCrossed: adv.monthsCrossed||0, examTriggered: !!adv.examTriggered, examType: adv.examType||null, examCheck, studyCountAtExam: studyCountBeforeAdvance, deathForeshadowNow: !!adv.deathForeshadowNow };
  render(true);

  // 七、7.1.5（9/16改版,測試參數）：取代原本state.age>=state.lifeExpectancy的固定壽命值判定，
  // 死亡結局現在完全由client端的年度機率roll決定（見rollAnnualDeathCheck），不再有AI自行判斷的空間
  const forceEnding = !!adv.deathTriggered;
  // 四、4.5（2026-09-20 b版修正）：forceEnding時，最後一段的邊界要在呼叫AI之前先確定好，
  // 這樣buildUserMessage()/mockGenerateTurn()算出的life_summary_material才會是完整8段，AI才有機會
  // 寫到角色死亡的那一段（取代原本邊界只在applyResult()事後才凍結、AI永遠看不到最後一段的舊流程）
  if(forceEnding) freezeFinalLifeStageForEnding(state);
  // bug修正（9/14，人生草稿0914測試.pdf）：技術錯誤/破碎原始文字絕對不能外洩給玩家；
  // 失敗先重試一次，重試仍失敗才顯示中性容錯敘事，不附帶任何e.message或原始內容
  try{
    let result;
    try{
      result = USE_MOCK ? await mockCallAI(actionText, forceEnding, timeCtx) : await callAI(actionText, forceEnding, timeCtx);
    }catch(firstErr){
      console.error("第一次呼叫失敗，重試一次：", firstErr);
      result = USE_MOCK ? await mockCallAI(actionText, forceEnding, timeCtx) : await callAI(actionText, forceEnding, timeCtx);
    }
    applyResult(result, timeCtx, forceEnding);
  }catch(e){
    console.error("重試後仍失敗：", e);
    applySnapshot();
    state.log.push({age:state.age, timeLabel:null, text:"（旁白剛剛恍神了一下，這回合沒講清楚，稍後再試一次看看。）"});
  }
  saveGame();
  render();
  if(examCheck){ renderExamCheckModal(examCheck); }
  if(state.mealJustUnlocked){ state.mealJustUnlocked = false; renderMealUnlockModal(); }
  if(state.pendingSideBusinessCardId){ const cid = state.pendingSideBusinessCardId; state.pendingSideBusinessCardId = null; renderSideBusinessModal(cid); }
  // 九、大學科系系統：四個彈窗互斥，一次只處理一個，優先序為選科系＞轉系＞雙主修＞休學肄業
  // （選科系優先是因為其他三個狀態機都要有科系才有意義；後三者用if/else if避免同一回合疊兩個彈窗互相蓋掉）
  if(state.pendingMajorSelection){ state.pendingMajorSelection = false; renderMajorSelectionModal(); }
  else if(state.pendingTransferOffer){ state.pendingTransferOffer = false; renderTransferOfferModal(); }
  else if(state.pendingDualMajorOffer){ state.pendingDualMajorOffer = false; renderDualMajorOfferModal(); }
  else if(state.pendingDualMajorAbandonOffer){ state.pendingDualMajorAbandonOffer = false; renderDualMajorAbandonModal(); }
  else if(state.pendingLeaveOffer){ const reason = state.pendingLeaveOffer; state.pendingLeaveOffer = null; renderWithdrawalOfferModal(reason); }
}

function applyResult(r, timeCtx, forceEnding){
  const s = state;
  // 九、大學科系系統：university_recent_event只給AI看這一回合，用過就清掉，不然會被下一回合重複讀到
  s.universityEventLog = null;
  // 可見數值變化顯示（9/15新增）：先記錄這回合開始前的可見數值，最後跟結算一起顯示變化量
  const beforeVisibleStats = { health:s.stats.health, knowledge:s.stats.knowledge, network:s.stats.network, expression:s.stats.expression, appearance:s.appearance };
  const structured = !!(timeCtx && timeCtx.structured);
  const ageAtEvent = s.age; // 非結構化時間下的年齡（尚未套用 age_advance 之前）
  if(!structured){
    s.age = clamp(s.age + (r.age_advance||0), s.age, 130);
  }
  // structured=true 時，s.age 在呼叫AI之前就已經由 advanceStructuredTime() 算好了，這裡不再套用 r.age_advance
  const d = r.stat_deltas||{};
  s.stats.health = clamp(s.stats.health + (d.health||0), 0, 100);

  // 3.7.3 做事態度光譜——精確公式版：團隊vs單打獨鬥影響才識/邏輯 vs 人脈的此消彼長效率
  const teamKnowledgeMult = clamp(1+(50-s.conscientiousness.teamSolo)*0.01, 0.5, 1.5);
  const wisdomMult = 0.5 + (s.wisdom/200);
  const logicBonus = 1 + (s.logicAbility/400);
  const knowledgeRawValue = rollKnowledgeRawValue(r.event_type, r.event_id, s); // 3.2.2（9/16修正）：AI只給標籤，程式查表+計數把關
  let knowledgeDelta = knowledgeRawValue * wisdomMult * logicBonus * teamKnowledgeMult;
  knowledgeDelta = applyMarginalDiminish(knowledgeDelta, s.stats.knowledge); // 3.5.3邊際遞減
  s.stats.knowledge = clamp(s.stats.knowledge + knowledgeDelta, 0, 100);

  // 九、9.5.1（9/16新增）：考試結算時更新轉系候選的「連續低於預期」計數，完全不依賴AI敘事內容
  if(structured && timeCtx.examTriggered) updateTransferCandidateOnExam(s, timeCtx.studyCountAtExam);

  // 責任感→人脈加分/扣分幅度；團隊vs單打獨鬥→人脈成長效率，兩者疊乘
  const teamNetworkMult = clamp(1+(s.conscientiousness.teamSolo-50)*0.01, 0.5, 1.5);
  const respMult = (d.network||0)>=0
    ? clamp(1+(s.conscientiousness.responsibility-50)*0.01, 0.5, 1.5)
    : clamp(1+(50-s.conscientiousness.responsibility)*0.01, 0.5, 1.5);
  let networkDelta = (d.network||0) * respMult * teamNetworkMult;
  networkDelta = applyMarginalDiminish(networkDelta, s.stats.network); // 3.5.3邊際遞減
  s.stats.network = clamp(s.stats.network + networkDelta, 0, 100);

  // 3.5.3 人脈閒置衰退：連續N回合沒有人脈經營行為（AI/mock這回合完全沒給正向人脈delta）才啟動輕微衰退
  s.networkIdleStreak = (d.network||0)>0 ? 0 : (s.networkIdleStreak||0)+1;
  if(ENABLE_NETWORK_IDLE_DECAY && s.networkIdleStreak>=NETWORK_IDLE_THRESHOLD &&
     (s.networkIdleStreak-NETWORK_IDLE_THRESHOLD)%NETWORK_IDLE_DECAY_INTERVAL===0){
    s.stats.network = clamp(s.stats.network - rnd(1,3), 0, 100);
  }
  s.stats.expression = clamp(s.stats.expression + (d.expression||0), 0, 100);
  // 三、3.8（9/20改版，取代原本 s.happiness += r.happiness_delta 的直接加減）：
  // AI只給emotional_tone四選一，程式查表決定增減量，再依回歸週期朝基準線移動
  applyHappiness(s, r.emotional_tone);
  refreshMilestoneSkipReasons(s); // 3.8.4：skip_reason三選一，供自主感管道與QA查核用

  // 氣質被動成長（呼應才識/表達力提升、財務狀況、隨時間累積），外表=顏值+氣質
  let tempGrowth = 0;
  if(knowledgeDelta>3) tempGrowth+=1;
  if((d.expression||0)>3) tempGrowth+=1;
  s.temperament = clamp(s.temperament+tempGrowth,0,100);
  s.appearance = clamp(Math.round(s.looks*0.5+s.temperament*0.5),0,100);

  // 健康連續偏低追蹤（呼應3.5.1過勞/憂鬱觸發門檻，僅供AI參考，不強制觸發）
  s.lowHealthStreak = s.stats.health<30 ? s.lowHealthStreak+1 : 0;

  const as = r.attachment_shift||{};
  s.anxiety = clamp(s.anxiety + (as.anxiety||0), 0, 100);
  s.avoidance = clamp(s.avoidance + (as.avoidance||0), 0, 100);
  s.peerPosition = clamp(s.peerPosition + (r.peer_position_shift||0), 0, 100);

  const cs = r.conscientiousness_shift||{};
  ["selfDiscipline","prudence","achievement","responsibility","teamSolo"].forEach(k=>{
    s.conscientiousness[k] = clamp(s.conscientiousness[k]+(cs[k]||0),0,100);
  });

  // 八、興趣系統v1（9/16新增）：AI只分類，候選成立/投入度/自律加成/副業契機一律由程式計算
  applyInterestEvent(s, r.interest_event);
  sweepInterestDecay(s);

  if(r.revealed_key_event && s.keyEvent) s.keyEvent.revealed = true;
  if(r.college_location_choice && !s.collegeLocation){
    s.collegeLocation = r.college_location_choice;
    // 5.5解鎖時機：大學選外縣市/出國，自動解鎖三餐全部三個選項
    if(!s.mealFullyUnlocked && (s.collegeLocation==="外縣市" || s.collegeLocation==="出國")){
      s.mealFullyUnlocked = true; s.mealJustUnlocked = true;
    }
  }
  // 七、7.1.5（9/16改版）：deathForeshadowed現在由rollAnnualDeathCheck()在advanceStructuredTime裡直接設定，
  // 不再讀AI回傳的foreshadow_death（AI不再自行判斷要不要埋前兆，這個欄位已從schema移除）

  // 財富真實金額制：先用「跨過的月份數」結算舊的月收支，再套用這回合新的職業/支出/一次性交易
  const monthsCrossed = structured ? (timeCtx.monthsCrossed||0) : Math.round((r.age_advance||0)*12);
  if(monthsCrossed>0){
    const totalExpenses = s.monthlyExpenses.reduce((sum,e)=>sum+e.amount,0);
    // 3.4.8 基本生活開銷：所有人生階段皆適用，依居住狀態決定，不再以occupationCategory為開關
    const livingCost = computeBaseLivingCost(s);
    let net = Math.round((s.monthlyIncome - totalExpenses - livingCost) * monthsCrossed);
    // 5.5存款下限保護（9/14新增）：學生時期(尚無正職)存款不能變成負值，修正原本會出現NT$-35,950這種不合理負債的bug
    if(!s.occupationCategory && s.cash + net < 0) net = -s.cash;
    s.cash += net;
    s.lastSettlement = { months: monthsCrossed, net, income:s.monthlyIncome, expenses:totalExpenses+livingCost };
    // 資產模型（9/14新增）：房貸每月攤還本金（不含利息，簡化模型），還清時自動移除房貸支出項
    if(s.mortgageBalance>0){
      const mortgagePayment = s.monthlyExpenses.find(e=>e.label==="房貸")?.amount || 0;
      s.mortgageBalance = Math.max(0, s.mortgageBalance - mortgagePayment*monthsCrossed);
      if(s.mortgageBalance===0){
        s.monthlyExpenses = s.monthlyExpenses.filter(e=>e.label!=="房貸");
      }
    }
  } else {
    s.lastSettlement = null;
  }

  if(r.job_change && r.job_change.occupation_category){
    const isFirstJob = !s.occupationCategory;
    s.occupationCategory = r.job_change.occupation_category;
    if(typeof r.job_change.monthly_salary === "number") s.monthlyIncome = Math.round(r.job_change.monthly_salary * SALARY_SCALE); // A4 3×3敏感度分析用
    const riskyCats = ["勞力/服務業","長期不在身邊","軍公教警消","自由接案"];
    s.riskyLifestyle = riskyCats.includes(s.occupationCategory);
    // 5.5解鎖時機：出社會後(有正職)，不論是否仍住家裡，一律解鎖三餐全部三個選項
    if(isFirstJob && !s.mealFullyUnlocked){ s.mealFullyUnlocked = true; s.mealJustUnlocked = true; }
    if(isFirstJob) s.milestones.first_full_time_job = "completed"; // 4.3事件狀態機制：客戶端結構化判斷
    else if(s.milestones.first_job_change!=="completed") s.milestones.first_job_change = "completed"; // 4.2.2（9/19新增）：非首次job_change視為第一次轉職
  }
  (r.expense_change||[]).forEach(ec=>{
    if(!ec.label) return;
    if(ec.action==="end"){
      s.monthlyExpenses = s.monthlyExpenses.filter(e=>e.label!==ec.label);
    } else {
      const existing = s.monthlyExpenses.find(e=>e.label===ec.label);
      if(existing) existing.amount = ec.monthly_amount ?? existing.amount;
      else s.monthlyExpenses.push({ label:ec.label, amount: ec.monthly_amount||0 });
    }
  });
  (r.one_time_transaction||[]).forEach(tx=>{
    if(typeof tx.amount !== "number") return;
    // 5.5存款下限保護（9/14新增）：學生時期消費若超過目前存款，這筆消費「不會發生」，不是扣成負值
    if(!s.occupationCategory && tx.amount<0 && Math.abs(tx.amount) > s.cash) return;
    s.cash += tx.amount;
  });
  if(r.housing_choice && r.housing_choice.type && r.housing_choice.type!==(s.housing?.type)){
    const wasOwn = s.housing?.type==="own";
    const nowOwn = r.housing_choice.type==="own";
    // 七、7.5.3買房頭期款門檻檢查（9/15新增，取代原本無客戶端強制檢查的P2缺口）：
    // 現金不夠付頭期款，這次買房「不會成立」，整個housing_choice都不處理，狀態維持原樣，不會扣款也不會產生房產/房貸
    let purchaseBlocked = false;
    if(nowOwn && !wasOwn){
      const prospectiveMonthlyPayment = r.housing_choice.monthly_amount||0;
      const prospectiveMortgage = prospectiveMonthlyPayment*240;
      const prospectivePropertyValue = Math.round(prospectiveMortgage/0.8);
      const prospectiveDownPayment = prospectivePropertyValue - prospectiveMortgage;
      if(s.cash < prospectiveDownPayment) purchaseBlocked = true;
    }
    if(!purchaseBlocked){
      // 4.3事件狀態機制：客戶端結構化判斷「搬出家裡」「買房」，不假手AI
      if((r.housing_choice.type==="rent" || r.housing_choice.type==="own") && s.milestones.moved_out!=="completed"){
        s.milestones.moved_out = "completed";
      }
      if(nowOwn && s.milestones.home_purchase!=="completed") s.milestones.home_purchase = "completed";
      // 資產模型（9/14新增）：賣房/轉租時，房產淨值扣掉剩餘房貸後變現為現金；買房時，估算房貸本金與房產市值，頭期款從現金扣除
      if(wasOwn && !nowOwn){
        s.cash += (s.propertyValue - s.mortgageBalance); // 賣房變現：市值減掉剩餘房貸，差額入帳
        s.propertyValue = 0;
        s.mortgageBalance = 0;
      }
      s.housing = { type:r.housing_choice.type, monthlyCost:r.housing_choice.monthly_amount||0 };
      s.monthlyExpenses = s.monthlyExpenses.filter(e=>e.label!=="房租" && e.label!=="房貸");
      if(r.housing_choice.monthly_amount>0){
        s.monthlyExpenses.push({ label: nowOwn ? "房貸" : "房租", amount:r.housing_choice.monthly_amount });
      }
      if(nowOwn && !wasOwn){
        // 簡化假設（測試參數，非設計文件定案）：20年期房貸、不含利息、貸款成數80%(LTV)
        const monthlyPayment = r.housing_choice.monthly_amount||0;
        s.mortgageBalance = monthlyPayment*240;
        s.propertyValue = Math.round(s.mortgageBalance/0.8);
        const downPayment = s.propertyValue - s.mortgageBalance;
        s.cash -= downPayment; // 頭期款從現金扣除
      }
    }
  }

  (r.new_characters||[]).forEach(nc=>{
    if(!nc.name) return;
    const exists = s.characters.find(c=>c.name===nc.name);
    if(exists){ exists.active=true; exists.lastTurn=s.turnCount; return; }
    s.characters.push({
      name:nc.name, relation:nc.relation||"", traits:nc.traits||"",
      affinity: clamp(nc.initial_affinity ?? 50,0,100),
      summary:"", lastTurn:s.turnCount, active:true, isChild:!!nc.is_child,
      origin: nc.origin||"" // 四、4.1（9/19新增）：認識時間／來源，AI建立新角色卡時提供
    });
    // 四、4.2.2（9/19新增）：is_child是既有結構化訊號，生育/領養自動判定完成
    if(nc.is_child && s.milestones.first_child!=="completed") s.milestones.first_child = "completed";
  });
  // 4.1.1顯示規則（9/16新增）：先記錄這回合開始前的關係值/戀愛狀態，跟可見數值變化顯示同一套「先snapshot後diff」邏輯，
  // 用來算出方向性提示（不精確報數字），見下方relationshipHints
  const beforeRelationship = new Map(s.characters.map(c=>[c.name, { affinity:c.affinity, romanceStatus:c.romanceStatus||null }]));
  const relationshipHints = [];
  (r.character_updates||[]).forEach(cu=>{
    const c = s.characters.find(x=>x.name===cu.name);
    if(!c) return;
    const before = beforeRelationship.get(cu.name) || { affinity:c.affinity, romanceStatus:c.romanceStatus||null };
    c.affinity = clamp(c.affinity + (cu.affinity_delta||0),0,100);
    appendNpcSharedMemory(c, cu.summary_add);
    c.lastTurn = s.turnCount; c.active = true;
    applyRomanceSignal(s, c, cu.romantic_signal); // 四、4.4：AI只給positive/negative分類，狀態機轉換由客戶端判斷
    const nowStatus = c.romanceStatus||null;
    if(nowStatus !== before.romanceStatus){
      const transitionText = {
        ambiguous:`你和${c.name}之間，好像開始有點曖昧了`,
        dating:`你和${c.name}正式開始交往了`,
        stable:`你和${c.name}的感情穩定了下來`,
        breakup:`你和${c.name}，分開了`
      }[nowStatus];
      if(transitionText) relationshipHints.push(transitionText);
    } else if(c.affinity > before.affinity){
      relationshipHints.push(`和${c.name}的關係更近了一些`);
    } else if(c.affinity < before.affinity){
      relationshipHints.push(`和${c.name}的關係有點疏遠了`);
    }
  });
  // 四、4.3事件狀態機制：先依這回合最新的age刷新鎖定狀態，AI的回報才不會被「上一輪」的舊locked狀態誤擋
  refreshMilestoneLocks(s);
  // AI只能回報非auto的5個里程碑（信用卡/打工/戀愛/創業/結婚），且只能設completed/skipped，
  // 不能繞過客戶端的locked狀態，也不能動auto:true那5個（那5個完全由客戶端結構化判斷，見上方各處）
  const AI_REPORTABLE_MILESTONES = MILESTONE_DEFS.filter(d=>!d.auto).map(d=>d.id);
  (r.milestone_updates||[]).forEach(mu=>{
    if(!mu || !AI_REPORTABLE_MILESTONES.includes(mu.id)) return;
    if(mu.status!=="completed" && mu.status!=="skipped") return;
    if(s.milestones[mu.id]==="locked") return;
    s.milestones[mu.id] = mu.status;
  });

  demoteStaleCharacters();

  const tagAge = structured ? s.age : ageAtEvent;
  const tagLabel = structured ? timeCtx.label : null;

  // 四、4.2.2（9/19新增）：achievement/setback類型受每人生階段2次上限管制，程式擋下超額觸發時整個不記錄，
  // 避免AI過度觸發把履歷洗成流水帳；其餘類型（既有里程碑等）不受影響，維持原本行為
  // 四、4.2.3（9/19改版）：不再設全域總量上限、不做FIFO淘汰——總量已由上面的分階段2次上限自然封頂（8階段×2＝16則），
  // 取代原本「超過10則捨棄最舊」的做法（會優先丟掉童年/學生時期紀錄，讓死亡結局判定讀不到早年人生軌跡）
  if(r.major_event_summary && shouldRecordJudgedMajorEvent(s, r.major_event_type)){
    s.chronicle.push(`（${tagLabel || (tagAge+"歲")}）${r.major_event_summary}`);
  }

  // bug修正（9/14，人生草稿0914測試.pdf）：結算顯示的「目前存款」之前是每次都讀取最新的s.cash，
  // 導致歷史回合全部顯示同一個（最新的）數字。這裡把「這回合結算完當下」的存款快照存進settlement，
  // 讓每一則日記顯示自己那個時間點的正確存款，不是被之後回合覆蓋的最新值。
  if(s.lastSettlement) s.lastSettlement.balanceAfter = s.cash;

  // 九、大學科系系統（9/16新增）：放在財務結算之後，確保lowCashStreak判斷的是這回合結算完的最新現金水位
  sweepUniversityState(s);

  // 可見數值變化顯示（9/15新增）：算出這回合實際變化量（含所有倍率/邊際遞減/衰退後的最終結果），四捨五入後只保留真的有變化的項目
  const statChanges = {};
  Object.keys(VISIBLE_STAT_LABELS).forEach(k=>{
    const after = k==="appearance" ? s.appearance : s.stats[k];
    const diff = Math.round(after - beforeVisibleStats[k]);
    if(diff!==0) statChanges[k] = diff;
  });

  // 四、4.2.1.1（9/19新增）：AI每回合順便回傳turn_summary（1-2句話），供這則日記日後被擠出「最近3回合」視窗時使用，不用另外呼叫API生成
  s.log.push({age:tagAge, timeLabel:tagLabel, text:r.narrative, turnSummary:r.turn_summary||"", settlement:s.lastSettlement, statChanges, relationshipHints});
  // 介面：回憶錄（9/19新增，回應「畫面上舊日記消失」的困擾）：上限從60大幅提高到2000，
  // 足夠涵蓋單一人生全程(~1200-1400回合)不流失；每世reincarnate/succeedAsChild時log都會重置為[]，不會跨世累積
  if(s.log.length>2000) s.log.shift();

  s.choices = r.choices || [];

  // 四、4.5（2026-09-20 b版修正）：一般回合才把這回合記進當前人生階段的軌跡累計；forceEnding時
  // 最後一段已經在takeTurn()呼叫AI之前由freezeFinalLifeStageForEnding()凍結過了，這裡不再重複凍結
  // （位置在chronicle.push之後，才抓得到這回合新增的履歷條目——但forceEnding的最後一段本來就不含這回合的內容，見上方說明）
  if(!forceEnding) updateLifeTrajectory(s);

  // 七、7.1.5（9/16改版）：死亡結局現在完全由client端的forceEnding決定，AI不能自行發起結局——
  // 取代原本「意外死亡需滿足19歲以上+已有前兆」的防呆邏輯，因為AI已經不再有判斷「要不要死」的空間，只剩forceEnding這一道閘門
  if(r.is_ending && forceEnding){
    s.phase = "ending";
    // 七、7.1.4（9/20改版）：不再有title/summary，改為三層結構的人生總結
    s.ending = assembleEnding(s, r);
  }
}

function reincarnate(){
  const bonusStat = pick(["health","knowledge","network","expression","savings"]);
  const carry = { reincarnations:(state.reincarnations||0)+1,
    chronicleCarry: `前世走完了一生${state.ending?.epitaph ? "，最後留下一句：「"+state.ending.epitaph+"」" : ""}，帶著一絲餘蔭轉生。`,
    name: state.name, gender: state.gender };
  if(bonusStat==="savings") carry.savingsCarry = 5; else carry[bonusStat] = 8; // 9/19：5000是9/14學生零用錢改遊戲幣單位制時漏改的殘留NT$量級數字，一併換算(÷1000)避免轉生後現金爆量失真
  state = newRoll(carry, null);
  saveGame();
  render();
}

function economicTierForSavingsAmount(savings){
  // 9/19隨3.4整章遊戲幣單位改版同步÷1000
  if(savings<200) return "清寒";
  if(savings<3000) return "小康";
  return "富裕";
}
function rollEconomicTierForced(tier){
  if(tier==="清寒") return { tier, network:rnd(15,35), allowance:STUDENT_ALLOWANCE_UNITS["清寒"], savings:STUDENT_ALLOWANCE_UNITS["清寒"], ...rollFamilyFinance("清寒") };
  if(tier==="小康") return { tier, network:rnd(30,55), allowance:STUDENT_ALLOWANCE_UNITS["小康"], savings:STUDENT_ALLOWANCE_UNITS["小康"], ...rollFamilyFinance("小康") };
  return { tier:"富裕", network:rnd(50,75), allowance:STUDENT_ALLOWANCE_UNITS["富裕"], savings:STUDENT_ALLOWANCE_UNITS["富裕"], ...rollFamilyFinance("富裕") };
}
function deriveParentTraitFromAffinity(aff, summary){
  let tone;
  if(aff>=70) tone = "跟你感情很好，願意溝通、給空間、支持你的決定";
  else if(aff>=45) tone = "感情普通，日常互動平淡但不算疏離";
  else tone = "感情有些疏遠，報喜不報憂、情感表達少";
  return summary ? tone+"；過去點滴："+summary : tone;
}
function eligibleChildren(){
  return state.characters.filter(c=>c.isChild);
}
function succeedAsChild(childName){
  const prev = state;
  const child = prev.characters.find(c=>c.name===childName && c.isChild);
  if(!child) return;
  const spouse = prev.characters.find(c=>/配偶|伴侶|先生|太太|老公|老婆/.test(c.relation||""));
  const otherKids = prev.characters.filter(c=>c.isChild && c.name!==childName);

  const deceasedRelation = prev.gender==="男" ? "父親" : "母親";
  const characters = [];
  characters.push({
    name: prev.name, relation: deceasedRelation,
    traits: deriveParentTraitFromAffinity(child.affinity, child.summary),
    affinity: child.affinity, summary: child.summary||"", lastTurn:0, active:true, isChild:false,
    origin: "父母，從出生起" // 四、4.1（9/19新增）：世代傳承後從新主角視角重新寫，不沿用上一世「怎麼認識」的舊故事
  });
  let familyStructure;
  if(spouse){
    characters.push({
      name: spouse.name, relation: deceasedRelation==="父親" ? "母親" : "父親",
      traits: spouse.traits||"忙碌但關心家裡", affinity: spouse.affinity, summary: spouse.summary||"",
      lastTurn:0, active:true, isChild:false, origin: "父母，從出生起"
    });
    familyStructure = "雙親同住";
  } else {
    familyStructure = "單親－喪親";
  }
  otherKids.forEach(k=>{
    // bug修正（9/14）：手足稱謂要跟這個孩子原本的性別(由k.relation「兒子」/「女兒」推得)一致，不能亂配
    const kidIsMale = k.relation==="兒子" ? true : k.relation==="女兒" ? false : Math.random()<0.5;
    characters.push({
      name:k.name, relation: pick(kidIsMale ? SIBLING_RELATIONS_MALE : SIBLING_RELATIONS_FEMALE),
      traits: (k.traits||"")+"（同樣是上一代留下的孩子）", affinity: clamp(k.affinity+rnd(-10,10),0,100),
      summary:k.summary||"", lastTurn:0, active:true, isChild:false, origin: "手足，從出生起"
    });
  });

  const econ = rollEconomicTierForced(economicTierForSavingsAmount(prev.cash));
  const wisdom = rnd(30,70);
  const logicAbility = clamp(Math.round(wisdom*0.3+rnd(-10,10)),0,100);
  const talent = clamp(Math.round(wisdom*0.6+rnd(-5,5)),0,100);
  const health = rnd(45,90);
  const looks = rnd(20,90);
  const luckHidden = +(0.85+Math.random()*0.3).toFixed(2);
  const attach = rollAttachmentBaseline(null);
  const peerPosition = rollPeerPosition();
  const expression = rollSocialStart(null, peerPosition);
  const temperament = rollSocialStart(null, peerPosition);
  const appearance = clamp(Math.round(looks*0.5+temperament*0.5),0,100);
  const personalityStyle = pick(PERSONALITY_STYLES);
  const childGender = child.relation==="女兒" ? "女" : child.relation==="兒子" ? "男" : pick(["男","女"]);

  state = {
    version:4, phase:"setup",
    name: child.name, gender: childGender,
    age:15, luckHidden,
    family: econ.tier, familyMonthlyIncome: econ.familyMonthlyIncome, familySavings: econ.familySavings, familyStructure, isPoliticianChild:false,
    collegeLocation:null,
    timeState:{ stageMode:"highschool", segmentIndex:0, yearInStage:1, adultTurnsInYear:0, turnsInSegment:0 },
    studyCountThisTerm: 0,
    anxiety:attach.anxiety, avoidance:attach.avoidance, peerPosition, peerPositionSpecial:null,
    keyEvent:null,
    wisdom, logicAbility, looks, temperament, appearance, personalityStyle,
    conscientiousness:{ selfDiscipline:50, prudence:50, achievement:50, responsibility:50, teamSolo:50 },
    stats:{ health, knowledge:talent, network:econ.network, expression },
    cash: econ.savings, propertyValue:0, mortgageBalance:0, monthlyIncome: econ.allowance, monthlyExpenses:[],
    occupationCategory:null, housing:null, fertilityJourney:null,
    lowHealthStreak:0, networkIdleStreak:0, riskyLifestyle:false, deathForeshadowed:false,
    happiness:50, happinessBaseline:50, happinessRegressionCounter:0, milestoneSkipReason:{},
    // 四、4.5：世代傳承視為全新一世，軌跡紀錄不繼承上一世
    lifeTrajectory: [], stageAccum: null,
    actionPoints:20, maxActionPoints:20, turnCount:0,
    characters,
    chronicle: [`（傳承）延續上一世的血脈，成為${prev.name}的${child.relation}。${prev.ending?.epitaph ? "上一世留下的最後一句是：「"+prev.ending.epitaph+"」" : ""}`],
    log:[], choices:[], reincarnations:(prev.reincarnations||0)+1,
    undosLeft:3, snapshot:null, ending:null,
    // 5.5生活方式選擇：世代傳承沒有結構化的教養風格/職業資料可判斷資格，簡化為預設可選（家族已有一定資源與歷史）
    spendingHabit: null, mealArrangement: null, mealCareEligibleAtStart: true,
    mealFullyUnlocked: false, cookingInterestSeed: false,
    // 四、4.3事件狀態機制：世代傳承視為全新一世，里程碑重新初始化，不繼承上一世的完成紀錄
    milestones: initMilestones(),
    // 三、3.2.2（9/16修正）milestone標籤防重複觸發：世代傳承也視為全新一世，重新初始化不繼承
    knowledgeMilestoneUsedIds: [],
    knowledgeMilestoneCountByStage: {},
    // 八、興趣系統v1（9/16新增）：世代傳承視為全新一世，不繼承上一世的興趣卡
    interestCandidates: [],
    pendingSideBusinessCardId: null,
    // 九、大學科系系統（9/16新增）：世代傳承視為全新一世，不繼承上一世的科系/延畢狀態
    studentMajorGroup: null,
    studentIsFiveYearTrack: false,
    studentStatus: null,
    leaveStatus: "normal",
    transferCooldown: 0,
    dualMajorStatus: null,
    examBelowExpectationStreak: 0,
    lowCashStreak: 0,
    pendingMajorSelection: false,
    pendingTransferOffer: false,
    pendingDualMajorOffer: false,
    pendingLeaveOffer: null,
    leaveResumeCountdown: 0,
    universityEventLog: null,
    lastExamPerformanceLog: null
  };
  saveGame();
  render();
}

function hardReset(){
  // 十、10.1（9/19補充）：清空存檔重來只清「這個slot」的資料，不動復原金鑰本身——玩家還是同一個人，
  // 只是這一段人生重來，下次saveGame()存進同一個slot時會自然覆蓋掉Worker上的舊資料，不需要另外呼叫刪除API
  const slotRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
  const slot = slotRaw!==null ? Number(slotRaw) : null;
  try{ localStorage.removeItem(STORAGE_KEY+(slot!==null?":"+slot:"")); }catch(e){}
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} // 相容改版前沒有slot後綴的殘留資料
  state = slot!==null ? { phase:"identity", name:"", gender:"男" } : { phase:"keyChoice" };
  render();
}

// ---------- RENDER ----------
function render(loadingTurn){
  const app = document.getElementById("app");
  if(!state){ app.innerHTML = `<div class="center-screen"><p style="color:var(--ink-soft);">載入中…</p></div>`; return; }
  if(state.phase==="keyChoice"){ app.innerHTML = renderKeyChoice(); bindKeyChoice(); ensureDebugUI(); return; }
  if(state.phase==="keyInput"){ app.innerHTML = renderKeyInput(); bindKeyInput(); ensureDebugUI(); return; }
  if(state.phase==="keyReveal"){ app.innerHTML = renderKeyReveal(); bindKeyReveal(); ensureDebugUI(); return; }
  if(state.phase==="slotPicker"){ app.innerHTML = renderSlotPicker(); bindSlotPicker(); ensureDebugUI(); return; }
  if(state.phase==="identity"){ app.innerHTML = renderIdentityForm(); bindIdentityForm(); ensureDebugUI(); return; }
  if(state.phase==="setup"){ app.innerHTML = renderSetupRoll(); bindSetupRoll(); ensureDebugUI(); return; }
  if(state.phase==="lifestyle"){ app.innerHTML = renderLifestyleChoice(); bindLifestyleChoice(); ensureDebugUI(); return; }
  if(state.phase==="ending"){ app.innerHTML = renderEnding(); bindEnding(); ensureDebugUI(); return; }
  app.innerHTML = renderPlaying(loadingTurn);
  bindPlaying();
  const j = document.querySelector(".journal");
  if(j) j.scrollTop = j.scrollHeight;
  ensureDebugUI();
}

// 介面：現階段進度條（9/16新增）——顯示目前細顆粒時間標籤(如「大二・期中準備期」)+這個小段落跑了幾回合
function renderProgressStrip(s){
  if(!s.timeState) return ``;
  const timeLabel = computeTimeLabel(s);
  const progress = computeStageProgress(s);
  const pct = progress && progress.total>0 ? clamp(Math.round(progress.current/progress.total*100),0,100) : 0;
  return `
  <div class="progress-strip">
    <div class="prow"><b>${escapeHtml(timeLabel)}</b>${progress ? `<span>${progress.label}　${progress.current}/${progress.total}</span>` : ``}</div>
    ${progress ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>` : ``}
  </div>`;
}
function ledgerRow(label,val){
  // bug修正（9/14，人生草稿0914測試.pdf）：底層數值（例如邊際遞減後的才識/人脈）是浮點數，
  // 不影響計算精度，但呈現層要四捨五入成整數再顯示，不能把25.130356487721這種原始浮點數丟給玩家看
  return `<div class="ledger-row"><span class="lbl">${label}</span><span class="dots"></span><span class="val">${Math.round(val)}</span></div>`;
}
function renderStatChanges(statChanges){
  // 可見數值變化顯示（9/15新增）：跟財富結算小字同一種呈現邏輯，只在真的有變化時才顯示
  if(!statChanges) return ``;
  const parts = Object.keys(VISIBLE_STAT_LABELS)
    .filter(k=>statChanges[k])
    .map(k=>{
      const v = statChanges[k];
      const color = v>0 ? "var(--teal)" : "var(--stamp)";
      return `<span style="color:${color};">${VISIBLE_STAT_LABELS[k]}${v>0?'+':''}${v}</span>`;
    });
  if(parts.length===0) return ``;
  return `<p style="font-size:11px;color:var(--ink-soft);margin-top:6px;">本回合數值變化：${parts.join("　")}</p>`;
}
function renderRelationshipHints(hints){
  // 4.1.1顯示規則（9/16新增）：關係變化用方向性提示呈現，不精確報數字，跟renderStatChanges並列在日記下方
  if(!hints || hints.length===0) return ``;
  return `<p style="font-size:11px;color:var(--ink-soft);margin-top:4px;">${hints.map(h=>escapeHtml(h)).join("；")}</p>`;
}
function rosterCard(c,isBg){
  // 4.1.1顯示規則（9/16改版）：列表卡片以文字化狀態為主，不裸露0-100數字；點擊可叫出詳細頁
  const category = relationCategoryLabel(c);
  return `<div class="rcard ${isBg?'bg':''}" data-npc="${escapeHtml(c.name)}">
    <div class="name">${escapeHtml(c.name)}</div>
    <div class="rel">${escapeHtml(category)}</div>
    <div class="status-text">${escapeHtml(relationshipStatusLabel(c))}</div>
  </div>`;
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function renderParagraphs(text){
  return String(text).split(/\n{1,}/).map(p=>p.trim()).filter(Boolean)
    .map(p=>`<p>${escapeHtml(p)}</p>`).join("");
}
function bindPlaying(){
  document.querySelectorAll(".choice-btn[data-choice]").forEach(btn=>{
    btn.onclick = ()=>{
      const idx = +btn.dataset.choice;
      const text = state.choices[idx];
      takeTurn(text, 1);
    };
  });
  const undoBtn = document.getElementById("btn-undo");
  if(undoBtn) undoBtn.onclick = restoreUndo;
  const customBtn = document.getElementById("btn-custom");
  const input = document.getElementById("custom-input");
  const inputError = document.getElementById("custom-input-error");
  if(input){
    input.oninput = ()=>{ if(inputError) inputError.style.display="none"; };
  }
  if(customBtn){
    customBtn.onclick = ()=>{
      const val = input.value.trim();
      if(!val) return;
      if(val.length > CUSTOM_INPUT_MAX_CHARS){
        if(inputError){
          inputError.textContent = `這段行動描述太長了（目前${val.length}字，上限${CUSTOM_INPUT_MAX_CHARS}字），請稍微縮短後再送出`;
          inputError.style.display = "block";
        }
        return;
      }
      if(inputError) inputError.style.display="none";
      input.value="";
      takeTurn(val, 2);
    };
  }
  const resetLink = document.getElementById("link-reset");
  if(resetLink) resetLink.onclick = renderConfirmReset;
  const memoirLink = document.getElementById("link-memoir");
  if(memoirLink) memoirLink.onclick = renderMemoirModal;
  const viewKeyLink = document.getElementById("link-view-key");
  if(viewKeyLink) viewKeyLink.onclick = renderKeyViewModal;
  // 四、4.1.1顯示規則（9/16新增）：點擊NPC卡片（含已降級為背景的）叫出詳細頁
  document.querySelectorAll(".rcard[data-npc]").forEach(card=>{
    card.onclick = ()=> renderNpcDetailModal(card.dataset.npc);
  });
}

function renderNpcDetailModal(name){
  const c = state.characters.find(x=>x.name===name);
  if(!c) return;
  const div = document.createElement("div");
  div.id = "npc-detail-modal";
  div.className = "modal-backdrop";
  const category = relationCategoryLabel(c);
  const identity = c.relation||"";
  const turnsAgo = state.turnCount - c.lastTurn;
  const lastInteractLabel = turnsAgo<=0 ? "剛剛" : `${turnsAgo} 回合前`;
  div.innerHTML = `
    <div class="modal">
      <h3>${escapeHtml(c.name)}</h3>
      <p style="margin-top:-8px;">${escapeHtml(identity)}${identity && category!==identity ? "　·　"+escapeHtml(category) : (!identity ? escapeHtml(category) : "")}</p>

      ${c.origin ? `<p style="font-size:12px;color:var(--ink-soft);">認識時間／來源：${escapeHtml(c.origin)}</p>` : ``}
      ${c.summary ? `<p><b>共同記憶：</b>${escapeHtml(c.summary)}</p>` : ``}
      <p style="font-size:12px;">最近互動：${lastInteractLabel}</p>
      <p style="font-size:11px;">關係值（次要參考）：${Math.round(c.affinity)}/100</p>
      <button class="ghost-btn" id="btn-npc-detail-close" style="margin-top:14px;">關閉</button>
    </div>`;
  document.body.appendChild(div);
  document.getElementById("btn-npc-detail-close").onclick = ()=>div.remove();
}

// 9.5.1 轉系結果判定：抽出成純函式方便測試，不依賴DOM。mainChoice: "stay"/"apply"/"wait"；targetKey僅在apply時需要
function resolveTransferOffer(s, mainChoice, targetKey){
  s.transferCooldown = TRANSFER_COOLDOWN_TURNS;
  s.examBelowExpectationStreak = 0;
  if(mainChoice==="apply" && targetKey){
    const cat = findMajorCategory(targetKey);
    if(!cat) return;
    // 9.5.1【定案】結果判定複用2.4考試成績算法精神：知識值+自律程度換算成功機率，不另設新公式
    const successProb = clamp(0.3 + (s.stats.knowledge/100)*0.5 + (s.conscientiousness.selfDiscipline-50)/200, 0.1, 0.95); // 【測試參數】
    const success = Math.random() < successProb;
    if(success){
      const isFive = cat.isFiveYearEligible && isTransferFeasible(s.age,5,s.collegeDelayYearsUsed);
      assignStudentMajor(s, targetKey, isFive);
      s.timeState.yearInStage = 1; // 9.5.1【定案】不做學分抵免判斷，一律從大一重新起算
      s.universityEventLog = { type:"transfer_success", major: cat.label };
    } else {
      s.universityEventLog = { type:"transfer_failed", major: cat.label };
    }
  } else if(mainChoice==="stay"){
    s.universityEventLog = { type:"transfer_declined" };
  }
}

// 9.5.3 休學/肄業決定：choice = "leave"/"withdraw"/"stay"
function resolveWithdrawalOffer(s, choice){
  // 9.8：休學跟延畢共用同一個delay_years額度、不可各自獨立上限，額度用完時「休學」直接視同無效選擇（防呆，UI也會先擋，這裡是程式層再把關一次）
  if(choice==="leave" && (s.collegeDelayYearsUsed||0)>=COLLEGE_DELAY_CAP) return;
  if(choice==="leave"){
    // 9.8：delay_years最小粒度0.5年對應休一學期，記一次0.5年代價
    s.collegeDelayYearsUsed = clamp((s.collegeDelayYearsUsed||0)+0.5, 0, COLLEGE_DELAY_CAP);
    // 9.5.3（9/16補充）：記錄休學當下正在哪個學期（上學期0~6段 or 下學期7~13段），供復學時重置回該學期開頭，該學期視為未完成不計入進度
    s.leaveSemesterHalfIndex = (s.timeState.segmentIndex||0) < SEMESTER_PHASES.length ? 0 : SEMESTER_PHASES.length;
    s.leaveStatus = "onLeave";
    s.leaveResumeCountdown = LEAVE_OF_ABSENCE_TURNS;
    s.lowHealthStreak = 0; s.lowCashStreak = 0; // 復學視為重新開始，不然同樣的低點會立刻再次觸發候選
    s.universityEventLog = { type:"leave_of_absence" };
  } else if(choice==="withdraw"){
    s.studentStatus = "withdrawn";
    s.timeState.stageMode = "career"; s.timeState.adultTurnsInYear = 0; // 9.5.3：跳轉至22歲以後曲線起點，肄業不代表人生卡死
    s.universityEventLog = { type:"withdrawn" };
  }
}

function renderEnding(){
  const s = state;
  const kids = eligibleChildren();
  const canSucceed = s.ending.successionAvailable && kids.length>0;
  // 七、7.1.4（9/20改版）：不顯示任何標籤、分數、排名。
  // 依序是 L1段落回顧 →（階段之間）L2變化句 → L3墓誌銘。
  // 舊存檔相容：9/20以前的存檔只有title/summary，沒有segments，降級成單段顯示不讓畫面爆掉。
  const segs = s.ending.segments || (s.ending.summary ? [{label:"", text:s.ending.summary}] : []);
  const transByStage = {};
  (s.ending.transitions||[]).forEach(t=>{ if(t && t.after_stage) transByStage[t.after_stage] = t.text||""; });
  const summaryHtml = segs.map(seg=>{
    const trans = transByStage[seg.stage];
    return `
    <div style="text-align:left;margin-bottom:14px;">
      ${seg.label ? `<div class="k" style="margin-bottom:4px;">${escapeHtml(seg.label)}${seg.age_from!=null?`（${seg.age_from}－${seg.age_to}歲）`:""}</div>` : ``}
      <p style="font-size:14.5px;margin:0;">${escapeHtml(seg.text||"")}</p>
    </div>
    ${trans ? `<p style="font-size:14px;opacity:.75;text-align:left;margin:0 0 14px;">${escapeHtml(trans)}</p>` : ``}`;
  }).join("");
  return `
  <div class="center-screen">
    <div class="stamp" style="margin:0 auto 14px;"><b>${s.age}</b>歲</div>
    ${summaryHtml}
    ${s.ending.epitaph ? `<div class="end-title" style="font-size:18px;line-height:1.7;margin:18px 0 10px;">${escapeHtml(s.ending.epitaph)}</div>` : ``}
    <div class="roll-grid">
      <div class="roll-item"><div class="k">存款</div><div class="v" style="font-size:15px;">${s.cash.toLocaleString()}</div></div>
      <div class="roll-item"><div class="k">健康</div><div class="v">${Math.round(s.stats.health)}</div></div>
      <div class="roll-item"><div class="k">才識</div><div class="v">${Math.round(s.stats.knowledge)}</div></div>
      <div class="roll-item"><div class="k">人脈</div><div class="v">${Math.round(s.stats.network)}</div></div>
      <div class="roll-item"><div class="k">福緣</div><div class="v">${s.luckHidden}</div></div>
      <div class="roll-item"><div class="k">羈絆</div><div class="v">${s.characters.length}</div></div>
    </div>
    ${canSucceed ? `
    <div class="roll-item" style="text-align:left;margin-bottom:14px;">
      <div class="k">延續下一世——選一位孩子接續</div>
      ${kids.map(k=>`<button class="choice-btn" data-child="${escapeHtml(k.name)}" style="padding-left:8px;">${escapeHtml(k.name)}（${escapeHtml(k.relation)}）</button>`).join("")}
    </div>` : ``}
    <button class="primary-btn" id="btn-reincarnate">服下轉世丹，重新投胎</button>
    <button class="ghost-btn" id="btn-reset-end">就此闔卷</button>
  </div>`;
}

    btn.textContent = "🛠";
    btn.title = "Debug 測試面板";
    btn.style.cssText = "position:fixed;bottom:16px;right:16px;z-index:300;width:44px;height:44px;border-radius:50%;background:var(--stamp,#9c3b2e);color:#fff;border:none;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);";
    btn.onclick = toggleDebugPanel;
    document.body.appendChild(btn);
  }
  const panel = document.getElementById("debug-panel");
  if(panel && panel.dataset.open==="1"){
    panel.innerHTML = renderDebugPanelContent();
    bindDebugPanelContent();
  }
}
function toggleDebugPanel(){
  let panel = document.getElementById("debug-panel");
  if(!panel){
    panel = document.createElement("div");
    panel.id = "debug-panel";
    panel.style.cssText = "position:fixed;top:0;right:0;bottom:0;width:300px;max-width:88vw;background:#211f1d;color:#eee;z-index:299;overflow-y:auto;padding:16px 14px;font-family:'Courier New',monospace;font-size:12px;box-shadow:-3px 0 14px rgba(0,0,0,.4);";
    document.body.appendChild(panel);
  }
  const isOpen = panel.dataset.open==="1";
  panel.dataset.open = isOpen ? "0" : "1";
  panel.style.display = isOpen ? "none" : "block";
  if(!isOpen){ panel.innerHTML = renderDebugPanelContent(); bindDebugPanelContent(); }
}
function debugFieldGroups(){
  const s = state;
  return [
    { title:"時間／基本", fields:[
      ["年齡","age", s.age],
    ]},
    { title:"可見數值", fields:[
      ["健康","stats.health", s.stats.health],
      ["才識","stats.knowledge", s.stats.knowledge],
      ["表達力","stats.expression", s.stats.expression],
      ["人脈","stats.network", s.stats.network],
      ["外表","appearance", s.appearance],
    ]},
    { title:"隱藏數值", fields:[
      ["智慧(天資)","wisdom", s.wisdom],
      ["邏輯能力","logicAbility", s.logicAbility],
      ["幸福感","happiness", s.happiness],
      ["幸福感基準線(唯讀)","happinessBaseline", Math.round(s.happinessBaseline||0)],
      ["福緣","luckHidden", s.luckHidden],
    ]},
    { title:"財富", fields:[
      ["現金","cash", s.cash],
      ["房產淨值","propertyValue", s.propertyValue],
      ["房貸餘額","mortgageBalance", s.mortgageBalance],
      ["月收入","monthlyIncome", s.monthlyIncome],
    ]},
    { title:"依附兩軸", fields:[
      ["焦慮軸","anxiety", s.anxiety],
      ["迴避軸","avoidance", s.avoidance],
    ]},
    { title:"做事態度光譜", fields:[
      ["自律","conscientiousness.selfDiscipline", s.conscientiousness.selfDiscipline],
      ["審慎","conscientiousness.prudence", s.conscientiousness.prudence],
      ["成就傾向","conscientiousness.achievement", s.conscientiousness.achievement],
      ["責任感","conscientiousness.responsibility", s.conscientiousness.responsibility],
      ["團隊vs單打","conscientiousness.teamSolo", s.conscientiousness.teamSolo],
    ]},
    { title:"其他", fields:[
      ["行動點","actionPoints", s.actionPoints],
      ["反悔卡剩餘","undosLeft", s.undosLeft],
    ]},
  ];
}
function renderDebugPanelContent(){
  const header = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-bottom:1px solid #444;padding-bottom:8px;">
    <b style="letter-spacing:1px;">🛠 DEBUG 面板</b>
    <span style="cursor:pointer;color:#aaa;" onclick="toggleDebugPanel()">✕ 關閉</span>
  </div>`;
  if(!state || !state.stats){
    return header + `<p style="color:#999;">尚未開局，先建立角色（跑完開局擲骰）之後再回來調數值。</p>`;
  }
  const toggles = `
    <div style="margin-bottom:12px;border-bottom:1px solid #444;padding-bottom:10px;">
      <div style="color:#e0a15c;margin-bottom:4px;">3.5.3 平衡開關（測試參數，方便回歸比較）</div>
      <label style="display:flex;align-items:center;gap:6px;margin-bottom:5px;color:#ccc;">
        <input type="checkbox" id="toggle-marginal-diminish" ${ENABLE_MARGINAL_DIMINISH?"checked":""}> 邊際遞減（才識/人脈）
      </label>
      <label style="display:flex;align-items:center;gap:6px;color:#ccc;margin-bottom:8px;">
        <input type="checkbox" id="toggle-network-idle-decay" ${ENABLE_NETWORK_IDLE_DECAY?"checked":""}> 人脈閒置衰退
      </label>
      <div style="color:#e0a15c;margin:8px 0 4px;">A4 敏感度分析倍率</div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">
        <label style="flex:1;color:#ccc;">薪資倍率(SALARY_SCALE)</label>
        <input type="number" step="0.1" id="input-salary-scale" value="${SALARY_SCALE}" style="width:70px;background:#333;color:#fff;border:1px solid #555;padding:3px 5px;font-family:'Courier New',monospace;">
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <label style="flex:1;color:#ccc;">生活費倍率(LIVING_COST_MULTIPLIER)</label>
        <input type="number" step="0.1" id="input-living-cost-mult" value="${LIVING_COST_MULTIPLIER}" style="width:70px;background:#333;color:#fff;border:1px solid #555;padding:3px 5px;font-family:'Courier New',monospace;">
      </div>
    </div>`;
  const groups = debugFieldGroups();
  const body = groups.map(g=>`
    <div style="margin-bottom:12px;">
      <div style="color:#e0a15c;margin-bottom:4px;">${g.title}</div>
      ${g.fields.map(([label,path,val])=>`
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">
          <label style="flex:1;color:#ccc;">${label}</label>
          <input type="number" step="any" data-path="${path}" value="${val}"
            style="width:70px;background:#333;color:#fff;border:1px solid #555;padding:3px 5px;font-family:'Courier New',monospace;">
        </div>`).join("")}
    </div>`).join("");
  return header + `
    <div style="max-height:56vh;overflow-y:auto;padding-right:4px;">${toggles}${body}</div>
    <button id="debug-apply" style="width:100%;margin-top:8px;padding:9px;background:var(--teal,#3e6b5c);color:#fff;border:none;cursor:pointer;font-family:inherit;">套用變更並刷新畫面</button>
    <button id="debug-dump" style="width:100%;margin-top:6px;padding:7px;background:#444;color:#fff;border:none;cursor:pointer;font-family:inherit;">印出完整 state 到 Console</button>
    <p style="color:#888;font-size:10.5px;margin-top:12px;line-height:1.6;">＊此面板只在 USE_MOCK=true 時出現，正式模式（USE_MOCK=false）完全不會建立這個按鈕。<br>＊目前程式碼還沒有「事件狀態（completed/skipped/locked）」追蹤機制，所以還無法在此指定觸發特定里程碑或查詢事件完成紀錄。<br>＊數值故意不做範圍限制，方便測試極端角色（例如全部設100或全部設0）。</p>
  `;
}
function bindDebugPanelContent(){
  const marginalToggle = document.getElementById("toggle-marginal-diminish");
  if(marginalToggle) marginalToggle.onchange = ()=>{ ENABLE_MARGINAL_DIMINISH = marginalToggle.checked; };
  const idleToggle = document.getElementById("toggle-network-idle-decay");
  if(idleToggle) idleToggle.onchange = ()=>{ ENABLE_NETWORK_IDLE_DECAY = idleToggle.checked; };
  const salaryScaleInput = document.getElementById("input-salary-scale");
  if(salaryScaleInput) salaryScaleInput.onchange = ()=>{ const v=Number(salaryScaleInput.value); if(!Number.isNaN(v)) SALARY_SCALE = v; };
  const livingCostMultInput = document.getElementById("input-living-cost-mult");
  if(livingCostMultInput) livingCostMultInput.onchange = ()=>{ const v=Number(livingCostMultInput.value); if(!Number.isNaN(v)) LIVING_COST_MULTIPLIER = v; };
  const applyBtn = document.getElementById("debug-apply");
  if(applyBtn) applyBtn.onclick = ()=>{
    document.querySelectorAll("#debug-panel input[data-path]").forEach(inp=>{
      const path = inp.dataset.path.split(".");
      let obj = state;
      for(let i=0;i<path.length-1;i++) obj = obj[path[i]];
      const num = Number(inp.value);
      if(!Number.isNaN(num)) obj[path[path.length-1]] = num;
    });
    saveGame();
    render();
  };
  const dumpBtn = document.getElementById("debug-dump");
  if(dumpBtn) dumpBtn.onclick = ()=>{
    console.log(JSON.parse(JSON.stringify(state)));
    alert("已印到瀏覽器主控台（F12 → Console 分頁）");
  };
}

initApp();
</script>
</body>
</html>
