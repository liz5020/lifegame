function applySnapshot(){
  if(!state.snapshot) return;
  const snap = JSON.parse(JSON.stringify(state.snapshot));
  const bookDraft = snap.bookDraft; delete snap.bookDraft;
  Object.assign(state, snap);
  // 七、7.4.3.4：反悔掉的回合剛好是指定NPC登場的那一回合，卡片隨角色名冊回到登場前，要讓它重新排程
  if(state.reunionNpc && state.reunionNpc.done && state.reunionNpc.cardName && !(state.characters||[]).some(c=>c.name===state.reunionNpc.cardName)){ state.reunionNpc.done = false; state.reunionNpc.cardName = null; }
  // 十五：被反悔掉的那一回合如果剛好收成了一章，那一章也撤掉(已經寫好的章節不受影響)
  if(state.book && bookDraft!==undefined){
    state.book.draft = bookDraft ? bookDraft.draft : null;
    if(bookDraft) state.book.chronicleSeen = bookDraft.chronicleSeen;
    state.book.chapters = state.book.chapters.filter(c=>c.createdTurn <= state.turnCount || c.status==="done");
  }
}
// 十、10.3.13（2026-10-08）：每一世免費5次(取代每段人生3次)，用完每次扣1點、跳確認視窗。舊存檔(沒有undoRule)只補上新增的2次，不改變已用掉的次數
function ensureUndoRule(s){
  if(!s || s.undoRule===2) return;
  s.undoRule = 2;
  s.undosLeft = Math.min(UNDO_FREE_PER_LIFE, Math.max(0, s.undosLeft||0) + (UNDO_FREE_PER_LIFE - 3));
}
function undoIsPaid(s){ return (s.undosLeft||0) <= 0; }
function restoreUndo(){
  if(!state.snapshot) return;
  applySnapshot();
  if(state.undosLeft>0) state.undosLeft -= 1;
  state.snapshot = null;
  saveGame(); render();
}
// 免費次數用完後：點數不足1點不能按；夠就跳確認視窗，確定才扣點並反悔
function requestUndo(){
  if(!state.snapshot || blockIfTurnBusy("反悔")) return;
  if(!undoIsPaid(state)){ restoreUndo(); return; }
  if(totalAP(state) < UNDO_PAID_COST) return;
  const div = entryModal("undo-pay-modal", `<p>這一世的免費反悔用完了。</p><p>這次反悔要扣 ${UNDO_PAID_COST} 點，扣了不退。</p>
    <button class="primary-btn" id="btn-undo-pay-ok">反悔</button><button class="ghost-btn" id="btn-undo-pay-no">先不要</button>`);
  document.getElementById("btn-undo-pay-no").onclick = ()=>div.remove();
  document.getElementById("btn-undo-pay-ok").onclick = async ()=>{
    const b = document.getElementById("btn-undo-pay-ok"); if(b) b.disabled = true;
    const s0 = state;
    const r = await paySinglePoints(s0, UNDO_PAID_COST, "反悔（超過 5 次）");
    div.remove();
    if(state!==s0) return;
    if(!r.ok){ showWriterToast(r.insufficient ? "撰稿人提醒你：行動點不夠，這次不能反悔。" : "撰稿人提醒你：這次沒有成功，請稍後再試一次。"); return; }
    restoreUndo();
  };
}

// 回合進行中(從送出到結果寫回)會換掉或存下目前人生的操作一律先擋下：回合的await回來時寫的是全域state，
// 中途切換／刪除人生會寫進別段人生或首頁畫面而出錯；存到雲端會存到扣了點、還沒有內容的半個回合
let turnsInFlight = 0;
function turnBusy(){ return turnsInFlight>0; }
function blockIfTurnBusy(what){
  if(!turnBusy()) return false;
  showWriterToast(`撰稿人還在寫這一回合，寫完才能${what}。`);
  return true;
}
async function takeTurn(actionText, cost){
  turnsInFlight++;
  try{ return await takeTurnInner(actionText, cost); }
  finally{ turnsInFlight--; }
}
async function takeTurnInner(actionText, cost){
  if(state.phase!=="playing") return;
  refillDailyIfNeeded(state);
  // 十、10.3.12（2026-09-29）：測試用「不扣行動點」開著時本機不扣點(真實模式實際扣不扣由Worker依測試鑰匙名單決定)，回合數照常+1
  const apCost = apTestFreeActive() ? 0 : cost;
  if(totalAP(state) < apCost){ renderAPExhaustedModal(); render(); return; }
  maybeFireReunionNpc(state); // 七、7.4.3.4：轉世指定NPC在第一個人生階段內登場
  snapshotForUndo();
  const apBefore = { ...ensureAP(state) }; // 10.3.11：舊存檔第一次打Worker時，給Worker建立伺服器端紀錄用(扣點前的數字)
  const apTotalBefore = totalAP(state), apLogStartedAt = Date.now(); // 10.10.3：這回合點數紀錄用(扣點前餘額)
  const apUsed = spendAP(state, apCost);
  state.turnCount += 1;
  const cashStart = lastRecordedCash(state); // B2（2026-09-29）：本回合結算從上一回合畫面上的存款算起
  state.cash = Math.round(state.cash||0);
  if(cost>0) state.lastActiveDate = taipeiDateString(); // 10.6.2：mock模式本機算離線天數用(真實模式由Worker記)

  // 九、9.5.1轉系候選判定需要「考前實際累積的讀書次數」，必須在advanceStructuredTime把studyCountThisTerm歸零之前先存一份快照，
  // 否則applyResult()拿到的會是考試結算後已經歸零的值。這份快照(studyCountAtExam)同時也用來修正buildUserMessage()的
  // exam_score_hint/study_count_this_term計算順序bug（9/16修正，見2.4.1）
  const studyCountBeforeAdvance = state.studyCountThisTerm||0;
  // 三、3.2.4（2026-09-23拍板）：才識拖累斜率需要「考前實際累積的選興趣路徑次數」，同一個時序理由，快照方式比照上面studyCountBeforeAdvance
  const interestCountBeforeAdvance = state.interestCountThisTerm||0;
  const prepTurnsBeforeAdvance = state.prepTurnsThisTerm||0; // 二、2.4.2（A2）：這次準備期實際玩了幾回合(讀書比例的分母)
  const wasPrologue = !!state.timeState.prologue; // 一、1.2.9.11：開場回合沒有「上一回合場景」，也不需要行動結果段
  // 二、2.6.5（2026-09-28）：點選項的回應最高只到「不錯」，要先記下這次是點選項還是自由輸入
  const fromChoice = !wasPrologue && (state.choices||[]).includes(actionText);
  // 十六、16.3.4「想找」標籤只作用於這一次送出；淡出為背景的角色找了之後重新成為活躍角色
  const seek = state.seekTarget || null;
  state.seekTarget = null;
  // 四、4.6.4～4.6.6（2026-09-29）：找漸行漸遠的人＝重逢；找失聯的人由程式擲骰(成敗都照常花這回合的行動點)；已故的人＝回想場景
  let relationEvent = null;
  if(seek){
    const sc = state.characters.find(c=>c.name===seek);
    const st = characterState(sc);
    if(st==="deceased") relationEvent = { mode:"recall", name: sc.name };
    else if(st==="lost"){
      const found = Math.random() < lostContactFindProb(sc);
      relationEvent = { mode:"find_lost", name: sc.name, found, turns_apart: state.turnCount - (sc.lostTurn ?? sc.lastTurn ?? state.turnCount) };
      if(found){
        relationEvent.reunion_tone = reunionTone(sc); sc.lost = false; delete sc.lostTurn; sc.active = true; sc.lastTurn = state.turnCount;
        const apartEvents = unknownEventNames(sc); revealCharacterEvents(sc); // 4.7.4：失聯者身上的事件等成功聯繫上時一次揭曉
        if(apartEvents.length) relationEvent.events_while_apart = apartEvents;
      }
    } else if(sc){
      const apart = state.turnCount - (sc.lastTurn||0);
      if(markCharacterInteracted(state, sc)){
        relationEvent = { mode:"reunion", name: sc.name, reunion_tone: reunionTone(sc), turns_apart: apart };
        const apartEvents = unknownEventNames(sc); revealCharacterEvents(sc); // 4.7.4：恢復互動，旁白寫近況時揭曉
        if(apartEvents.length) relationEvent.events_while_apart = apartEvents;
      }
    }
  }
  // 二、2.6（2026-09-28）：學生時期這回合的重心(開場那一回合由程式自動產生，沒有重心)
  const turnFocus = wasPrologue ? null : resolveTurnFocus(state, actionText);
  // 二、2.5（9/16新增）：22歲以後改採加速曲線回合預算，取代原本「30歲以後交給AI自行判斷age_advance」的舊架構
  // 全生涯（15歲起）都由客戶端結構化算好本回合要推進多少時間，AI的age_advance一律視為0，不再有年齡分界
  const adv = advanceStructuredTime(actionText, turnFocus && turnFocus.key);
  maybeRollBackgroundEvents(state, adv); // 四、4.7：學生時期每學期(假期第一回合)、出社會後每年(跨入新年第一回合)擲一次NPC背景事件
  const focus = (turnFocus && !adv.bigJump) ? turnFocus : null; // 2.6.1：跳過指令的回合不結算重心
  // 3.4.2（2026-09-27）：打工收入由程式依時薪×時數算好，AI只負責敘事；學生時期改由打工重心觸發(2026-09-28)
  applyPartTimeWork(state, actionText, adv.window, turnFocus ? (focus ? focusPartTimeRatio(focus) : 0) : undefined);
  const orderNotice = wasPrologue ? null : prepareOrderTurn(state, turnFocus); // 八、8.13（2026-09-30）：逾期處理、交件／逾期通知、新詢問擲骰
  applyFertilityTurn(state, actionText); // 7.3.2（2026-09-27）：生育/領養的大方向由程式判定
  if(!state.timeState.prologue) checkLockedParentDeath(state); // 七、7.4.3.3.1（2026-09-28）：傳承中的上一代到鎖定年紀過世
  // 十一、11.4（9/19新增）：期末考是首版明牌檢定白名單唯一節點，命中就在呼叫AI之前先擲骰決定確切分數
  // （呼應7.1.5死亡機制精神，不讓AI自由裁量這個數字），期中考不受影響、維持原本hint範圍由AI自由發揮
  // 二、2.4.2（2026-09-29 A2）：期中、期末都在呼叫AI之前由程式擲出確切分數(AI要分數才能寫劇情)；只有期末考走明牌檢定畫面
  const examCheck = adv.examTriggered ? rollExamScore(state.stats.knowledge, adv.examType, studyCountBeforeAdvance, prepTurnsBeforeAdvance) : null;
  // 三、3.2.4：記下每次考試成績，供畫面上的課業軌跡顯示。B3（2026-09-29）：分數先鎖住(pending)，
  // 期中考等這回合正文完整顯示後、期末考等明牌檢定畫面看完，才出現在數值面板
  if(examCheck){
    state.examHistory = (state.examHistory||[]).concat([{ label: adv.currentLabel, type: adv.examType, score: examCheck.finalScore,
      breakdown: examBreakdownText(examCheck), pending: examCheck.isFinal ? "modal" : "text" }]).slice(-6);
  }
  if(examCheck && examCheck.isFinal && !examCheck.passed) markPlayStyleSetback(state, "exam_fail", null); // 十六、16.2.3
  if(examCheck && examCheck.isFinal) checkNonLeaveGraduationDelay(state, examCheck, interestCountBeforeAdvance); // 9.4（2026-09-27）：非休學型延畢
  // 2026-09-23修正（時間標籤慢一拍bug）：這回合顯示/送給AI的標籤改用currentLabel(這回合實際所在的段落)，
  // 不再用toLabel(換段後、下一回合才生效的段落)；jump提示(from/to)維持給跳過動作用，語意不變
  let timeCtx = { structured:true, label: adv.currentLabel, jump: adv.bigJump ? {from:adv.fromLabel, to:adv.toLabel} : null, monthsCrossed: adv.monthsCrossed||0, examTriggered: !!adv.examTriggered, examType: adv.examType||null, examCheck, studyCountAtExam: studyCountBeforeAdvance, interestCountAtExam: interestCountBeforeAdvance, deathForeshadowNow: !!adv.deathForeshadowNow, window: adv.window||null, prologue: wasPrologue,
    focus, fromChoice, seek, cashStart, orderNotice, relationEvent };
  // 十八、敘事節奏（2026-09-28）：呼叫AI之前由程式定好場景條件(學生時期)與劇情線/角色輪替的要求，重新生成時沿用同一組
  timeCtx.scenePlan = buildScenePlan(state, { focus, prologue: wasPrologue, skip: !!adv.bigJump, seek, actionText,
    examTriggered: !!adv.examTriggered, examType: adv.examType, segKey: adv.segKey, segTurn: adv.segTurn, half: adv.half, holiday: !!adv.holiday });
  timeCtx.rhythm = prepareNarrativeRhythm(state, { seek, actionText: wasPrologue ? "" : actionText, prologue: wasPrologue, fixedEvent: !!adv.examTriggered });
  timeCtx.friendNews = wasPrologue ? null : takeFriendNews(state);           // 四、4.7.4：熟悉朋友的轉折／重大事件，一回合最多一件
  timeCtx.socialFeed = wasPrologue ? null : pickSocialFeed(state, [seek, timeCtx.friendNews && timeCtx.friendNews.name]); // 四、4.6.8
  timeCtx.friendOpportunity = wasPrologue ? null : takeFriendOpportunity(state); // 三、3.5.5：朋友帶來的機會
  timeCtx.deviation = rollChoiceDeviation(state, { prologue: wasPrologue, fromChoice, whitelist: !!adv.examTriggered || !!programEventNow(state) || !!(timeCtx.scenePlan && timeCtx.scenePlan.mode==="override" && timeCtx.scenePlan.reason!=="player_named") }); // 一、1.2.17
  timeCtx.relationScene = wasPrologue ? null : prepareRelationScene(state, actionText); // 四、4.8：上一回合告白的回應／擲骰結果、玩家提分手、排定的分手場面(deviation要先擲，才看得到待回應的告白)
  timeCtx.expenseMentions = state.pendingExpenseMentions || []; state.pendingExpenseMentions = []; // 一、1.2.15
  // 十八、18.12（2026-09-29 A7）：這回合指定為主角日常場景時，取代18.2「跟重心相關／換到別處」的擲骰(考試、事件等覆寫仍優先)
  if(timeCtx.rhythm.daily_scene_now && timeCtx.scenePlan && timeCtx.scenePlan.mode!=="override")
    timeCtx.scenePlan = { mode:"daily", theme: timeCtx.rhythm.daily_scene_now.theme, period: timeCtx.scenePlan.period, banned_category: timeCtx.scenePlan.banned_category||null };
  aiWritingNow = true;
  render(true);

  // 七、7.1.5（9/16改版,測試參數）：取代原本state.age>=state.lifeExpectancy的固定壽命值判定，
  // 死亡結局現在完全由client端的年度機率roll決定（見rollAnnualDeathCheck），不再有AI自行判斷的空間
  const forceEnding = !!adv.deathTriggered;
  // 四、4.5（2026-09-20 b版修正）：forceEnding時，最後一段的邊界要在呼叫AI之前先確定好，
  // 這樣buildUserMessage()/mockGenerateTurn()算出的life_summary_material才會是完整8段，AI才有機會
  // 寫到角色死亡的那一段（取代原本邊界只在applyResult()事後才凍結、AI永遠看不到最後一段的舊流程）
  if(forceEnding) freezeFinalLifeStageForEnding(state);
  // 一、1.2.8.2（2026-09-24實作）：語氣軌/張力在呼叫AI之前由程式決定，重新生成時沿用同一組，成功套用結果後才計入碎念軌連續次數
  timeCtx.tone = computeToneTrack(state, timeCtx, actionText, forceEnding);
  // 十、10.3.11（2026-09-25）：同一回合(含失敗重試、場景日期重新生成)共用一個turn_nonce，Worker只扣一次點
  timeCtx.turnNonce = newTurnNonce();
  timeCtx.apBefore = apBefore;
  // bug修正（9/14，人生草稿0914測試.pdf）：技術錯誤/破碎原始文字絕對不能外洩給玩家；
  // 失敗先重試一次，重試仍失敗才顯示中性容錯敘事，不附帶任何e.message或原始內容
  try{
    // 一、1.2.9.16／十六、16.3.8.1（2026-09-28）：AI交回的段落清單先清理，再接成以空行分段的字串，下游沿用原本的字串處理
    const callOnce = async ()=>{
      // 十、10.9.2：mock模式沒有AI呼叫，帳號錢包的回合扣點在這裡向伺服器扣(同一turn_nonce只扣一次)；真實模式由AI代理在呼叫前預扣
      if(USE_MOCK && apUsed.wallet && apCost>0) await walletMockCharge(timeCtx.turnNonce, ensureLifeId(state));
      return normalizeTurnResultText(await (USE_MOCK ? mockCallAI(actionText, forceEnding, timeCtx) : callAI(actionText, forceEnding, timeCtx)));
    };
    let result;
    const genStartedAt = Date.now(); // 十六、16.3.1（2026-09-29）：測試模式顯示這回合AI實際生成秒數(含重試、重新生成)
    try{
      result = await callOnce();
    }catch(firstErr){
      if(firstErr && firstErr.noRetry) throw firstErr; // 10.3.11：伺服器端行動點不足/重新生成達上限，重試也沒用
      console.error("第一次呼叫失敗，重試一次：", firstErr);
      result = await callOnce();
    }
    // 一、1.2.9.11.4（2026-09-24新增）：新場景日期檢查——與上一回合同一天或超出本回合範圍視為違規，
    // 自動重新生成一次(不扣行動點，點數在上面已經只扣過一次)並記錄；重新生成仍違規就照常顯示、記入待確認清單，不再重試
    const dateCheck = validateSceneDate(result, timeCtx.window, !!timeCtx.prologue);
    if(!dateCheck.ok){
      console.warn("[場景日期違規] 自動重新生成一次：", dateCheck.reason);
      addReviewFlag(state, "scene_date_retry", "第一次生成違規，已自動重新生成："+dateCheck.reason);
      timeCtx.retryNote = `你上一次回傳的新場景日期不合規則：${dateCheck.reason}。這次scene_day_offset必須是0到${timeCtx.window.end-timeCtx.window.start}之間的整數（${calFormat(timeCtx.window.start)}～${calFormat(timeCtx.window.end)}）。`;
      try{
        const retried = await callOnce();
        const recheck = validateSceneDate(retried, timeCtx.window, !!timeCtx.prologue);
        result = retried;
        if(!recheck.ok) addReviewFlag(state, "scene_date_unresolved", "重新生成後仍違規，照常顯示："+recheck.reason);
      }catch(retryErr){
        console.error("重新生成失敗，沿用第一次的結果：", retryErr);
        addReviewFlag(state, "scene_date_unresolved", "重新生成呼叫失敗，沿用第一次違規的結果："+dateCheck.reason);
      }
      timeCtx.retryNote = null;
    }
    // 一、1.2.9.18（2026-09-29 A14）：正文最後一個引號沒關、段落以冒號/逗號/沒寫完的句子結尾、出現{ } "key": 這類資料格式符號時，
    // 自動重新產生，最多2次(同一個turn_nonce，不扣行動點)；2次後仍不合格就保留最後一次結果，寫入錯誤紀錄(待確認清單)
    let quality = detectOutputQualityIssues(result);
    for(let q=0; q<OUTPUT_QUALITY_MAX_RETRIES && quality.length; q++){
      console.warn("[輸出品質] 自動重新產生：", quality.join("；"));
      addReviewFlag(state, "output_quality_retry", `第${q+1}次重新產生：${quality.join("；")}`);
      timeCtx.retryNote = `你上一次回傳的正文有問題：${quality.join("；")}。這次每一段都要寫完整的句子，引號要成對，台詞一律用{{名字|台詞}}標記，正文不能出現大括號或資料欄位名稱。`;
      try{ result = await callOnce(); quality = detectOutputQualityIssues(result); }
      catch(qErr){ console.error("重新產生失敗，沿用上一次的結果：", qErr); break; }
    }
    timeCtx.retryNote = null;
    if(quality.length){
      console.warn("[輸出品質] 重新產生後仍不合格，保留最後一次結果：", quality.join("；"));
      addReviewFlag(state, "output_quality_unresolved", quality.join("；"));
    }
    const genMs = Date.now() - genStartedAt;
    applyResult(result, timeCtx, forceEnding, actionText);
    { const ge = state.log[state.log.length-1]; if(ge && !ge.error) ge.genMs = genMs; }
    bookAfterTurn(state, result, forceEnding); // 十五、人生之書：收集這回合的摘要，換階段/滿5年/人生結束時收成一章
    // 1.2.8.7：AI在事件發生時自行切換語氣軌的話，以實際語氣軌計入碎念軌連續次數並記在這則日記上
    const effectiveTone = resolveEffectiveTone(timeCtx.tone, result);
    const lastEntry = state.log[state.log.length-1];
    if(lastEntry) lastEntry.tone = { tone_track:effectiveTone.tone_track, tension:effectiveTone.tension, category:effectiveTone.category, switched:effectiveTone.switched };
    commitToneTrack(state, effectiveTone);
    apLogTurn(state, wasPrologue, apTotalBefore, apLogStartedAt, true); // 10.10.3：成功＝實際扣的點(開場0)
  }catch(e){
    aiWritingNow = false;
    console.error("重試後仍失敗：", e);
    applySnapshot();
    refundAP(state, apUsed); // 十、10.3.1：API呼叫失敗/斷線不扣點
    if(USE_MOCK && apUsed.wallet && apCost>0) await walletMockRefund(timeCtx.turnNonce, ensureLifeId(state)); // 十、10.9.2：mock模式向伺服器退回這回合扣的1點
    // 10.3.11：真實模式下callAI已經把Worker回傳的伺服器端餘額寫回state.ap，本機退點後再以伺服器端為準
    if(SERVER_AP && lastCallServerAP) syncServerAP(state, lastCallServerAP);
    if(lastCallWallet && walletActive(state)) syncWallet(lastCallWallet); // 帳號錢包同理：以伺服器端最後回報的餘額為準
    if(e && e.dailyCap){
      // 十、10.9.3.1／10.9.3.3／10.12.5第4則：全站每日花費上限暫停期間送出的行動——不扣點、不算回合(上面applySnapshot已還原)、
      // 輸入框文字保留，恢復後可直接再送出。開場回合沒有輸入框，留一則「重新送出」的說明；不寫點數紀錄(沒有呼叫AI、也沒動到點數)
      if(wasPrologue) state.log.push({age:state.age, timeLabel:null, text:"（撰稿人今天寫得太多，需要休息一下。故事會在台灣時間午夜後恢復。）", error:true, capBlocked:true, retryAction:actionText, retryCost:cost});
      saveGame();
      noteDailyCapBlocked();
      if(!wasPrologue && !fromChoice) restoreCustomDraft(actionText);
      return;
    }
    apLogTurn(state, wasPrologue, apTotalBefore, apLogStartedAt, false); // 10.10.3：失敗＝0(扣了又退)；伺服器端若真的扣了卻沒內容，這裡會是-1(異常，對帳用)
    if(e && e.apInsufficient){
      saveGame(); render(); renderAPExhaustedModal();
      return;
    }
    state.log.push({age:state.age, timeLabel:null, text:"（撰稿人一時沒接上線，這一回合還沒扣點。請稍等一下再送出一次。）", error:true, retryAction:actionText, retryCost:cost});
  }
  aiWritingNow = false;
  saveGame();
  render();
  // 十、10.3.8：用掉最後1點時，這回合照常生成顯示、自動存檔後才跳出提示（死亡結局那回合不用提示）
  const apJustExhausted = apCost>0 && !apTestFreeActive() && state.phase==="playing" && totalAP(state)===0;
  if(examCheck && examCheck.isFinal){ renderExamCheckModal(examCheck); }
  dispatchPendingModals(); // 2026-09-27：抽成函式，放置回溯(10.6.5)回到某個彈窗時也要能重新跳出
  if(apJustExhausted) renderAPExhaustedModal(); // 最後才疊上去，確保在其他彈窗之上
  updateDevUsageBox(); // 10.5：開發者面板的上一回合用量
  processBookQueue(true); // 十五、背景寫章節(不等它，不影響這回合)；失敗的章節每回合自動重試一次，最多3次
}

// 10.6.3 放置期間不生成選項、不呼叫AI：每回合依性格抽一個傾向標籤，套固定數值變化與模板短句；數值結算走既有公式。

const IDLE_TAGS = ["努力","社交","安逸","冒險","逃避","顧家"];
const IDLE_LINES = {
  努力: ["這段時間把心力放在手邊的事上。","忙了一陣子，進度往前推了一點。","常常忙到很晚，但覺得踏實。"],

const IDLE_NEW_FRIEND_LINE = "參加了一場聚會，認識了新朋友。";
const IDLE_MAX_NEW_CHARACTERS = 2;       // 10.6.3【定案】每次放置最多新增2位
const IDLE_ROLLBACK_COST = 5;            // 10.6.5【定案】
const IDLE_PERSONALITY_SHARE = 0.75;     // 10.6.9【定案,測試參數】75%依性格、25%平均隨機
function idleHasFamily(s){
  return (s.characters||[]).some(c=>!c.deceased && (c.romanceStatus==="married" || (c.cohabiting && ["dating","stable"].includes(c.romanceStatus)) || (c.isChild && c.active!==false)))
    || idleCaringForParent(s);
}
function idleCaringForParent(s){ return !!s.caringForParentName && (s.characters||[]).some(c=>c.name===s.caringForParentName && !c.deceased); }
// 10.6.9【定案，數字為測試參數】權重公式；「團隊」＝teamSolo，數值越高越偏團隊(對照3.7.3：teamNetworkMult=1+(teamSolo−50)×0.01)
function idleTagWeights(s){
  const c = s.conscientiousness;
  const w = {
    努力: 1+(c.selfDiscipline-50)/50+(c.achievement-50)/100,
    社交: 1+(c.teamSolo-50)/50,
    安逸: 1-(c.achievement-50)/100,
    冒險: 1-(c.prudence-50)/50,
    逃避: 0.5-(c.responsibility-50)/100,
    顧家: 1+(c.responsibility-50)/50
  };
  Object.keys(w).forEach(k=>{ if(w[k]<0.1) w[k] = 0.1; }); // 低於0.1以0.1計
  if(s.stats.health<30){ w.努力 = 0; w.冒險 = 0; }     // 安全規則：健康低於30
  if(!idleHasFamily(s)) w.顧家 = 0;                       // 安全規則：顧家只在有家庭狀態時
  return w;
}
function pickByWeightMap(weights){ // 注意：不可叫weightedPick，會蓋掉開局抽家庭結構用的同名函式
  const keys = Object.keys(weights).filter(k=>weights[k]>0);
  const total = keys.reduce((a,k)=>a+weights[k],0);
  if(!keys.length) return null;
  let r = Math.random()*total;
  for(const k of keys){ if(r<weights[k]) return k; r -= weights[k]; }
  return keys[keys.length-1];
}
function pickIdleTag(s){
  const w = idleTagWeights(s);
  if(Math.random() < IDLE_PERSONALITY_SHARE) return pickByWeightMap(w);
  const avail = Object.keys(w).filter(k=>w[k]>0);
  return pick(avail);
}
// 同一標籤的短句輪流使用，不連續兩回合出現同一句
function nextIdleLine(s, tag){
  s.idleLineIndex = s.idleLineIndex || {};
  const lines = IDLE_LINES[tag];
  let i = ((s.idleLineIndex[tag] ?? -1) + 1) % lines.length;
  if(lines[i]===s.idleLastLine) i = (i+1) % lines.length;
  s.idleLineIndex[tag] = i;
  s.idleLastLine = lines[i];
  return lines[i];
}
// 10.6.9【定案，數字為測試參數】各標籤的數值變化，比手動遊玩保守，都在3.9.2單回合上下限內；不動做事態度光譜與依附風格
function applyIdleTag(s, tag){
  const st = s.stats;
  if(tag==="努力"){
    const wisdomMult = 0.5 + (s.wisdom/200), logicBonus = 1 + (s.logicAbility/400);
    const teamKnowledgeMult = clamp(1+(50-s.conscientiousness.teamSolo)*0.01, 0.5, 1.5);
    const raw = rollKnowledgeRawValue("ordinary", null, s) * wisdomMult * logicBonus * getDisciplineMultiplier(s) * teamKnowledgeMult;
    st.knowledge = clamp(st.knowledge + applyMarginalDiminish(raw, st.knowledge), 0, 100);
    st.health = clamp(st.health - 1, 0, 100);
  } else if(tag==="社交"){
    st.network = clamp(st.network + applyMarginalDiminish(2, st.network), 0, 100);
    st.expression = clamp(st.expression + 1, 0, 100);
    const friend = pick((s.characters||[]).filter(c=>!c.deceased && !c.isChild && !INTIMATE_RELATION_RE.test(c.relation||"") && !c.romanceStatus).concat([null]));
    if(friend) friend.affinity = clamp(friend.affinity + 1, 0, 100);
  } else if(tag==="安逸"){
    st.health = clamp(st.health + 2, 0, 100);
  } else if(tag==="冒險"){
    st.expression = clamp(st.expression + 1, 0, 100);
    st.network = clamp(st.network + applyMarginalDiminish(1, st.network), 0, 100);
    st.health = clamp(st.health - 1, 0, 100);
  } else if(tag==="逃避"){
    st.health = clamp(st.health + 1, 0, 100);
    st.network = clamp(st.network - 1, 0, 100);
  } else if(tag==="顧家"){
    (s.characters||[]).filter(c=>!c.deceased && c.cohabiting && (c.romanceStatus==="married" || c.isChild)).forEach(c=>{ c.affinity = clamp(c.affinity + 2, 0, 100); });
    if(idleCaringForParent(s)) st.health = clamp(st.health - 1, 0, 100);
  }
}

// 一回合的放置：時間推進、年度判定(放置模式)、每月結算、標籤效果、既有每回合檢查、彈窗代選
function simulateIdleRound(s, index){
  const record = { i:index, popups:[], rollbackPoints:[], newFriend:false };
  const before = { health:s.stats.health, knowledge:s.stats.knowledge, network:s.stats.network, expression:s.stats.expression, cash:s.cash, age:s.age };

// 跑完整段放置：n回合(已由伺服器/本機算好)；回傳紀錄，存在state.idleRun
function runIdleRounds(s, n){
  s.idleMode = true;
  const startSnapshot = JSON.stringify(Object.assign({}, s, { snapshot:null }));
  const statBefore = { health:s.stats.health, knowledge:s.stats.knowledge, network:s.stats.network, expression:s.stats.expression, cash:s.cash, age:s.age };
  const rounds = [];
  try{
    for(let i=0;i<n;i++){
      if(s.phase!=="playing") break;
      rounds.push(simulateIdleRound(s, i));
    }
  } finally {
    s.idleMode = false;
  }
  const totals = {};
  ["health","knowledge","network","expression"].forEach(k=>{ const d = Math.round(s.stats[k]-statBefore[k]); if(d) totals[k] = d; });
  const dc = Math.round(s.cash-statBefore.cash); if(dc) totals.cash = dc;
  s.idleRun = { rounds, totals, ageFrom: statBefore.age, ageTo: s.age, startSnapshot, rolledBack:false, summary:null, createdAt: s.turnCount };
  s.snapshot = null; // 10.6.6【定案】一般悔棋不能撤銷放置結果
  return s.idleRun;
}
// 10.6.4【定案】關鍵片段：程式挑影響最大的回合(有彈窗決定的優先，其次數值變化總量)，少量回合1-2則、滿35回合最多5則
function pickIdleKeyRounds(rounds){
  const limit = rounds.length<=10 ? 2 : rounds.length<=20 ? 3 : rounds.length<=30 ? 4 : 5;
  const score = r => (r.popups.length*20) + Object.values(r.changes||{}).reduce((a,v)=>a+Math.abs(v),0) + (r.newFriend?5:0);
  return rounds.slice().sort((a,b)=>score(b)-score(a)).slice(0, Math.min(limit, rounds.length)).map(r=>r.i).sort((a,b)=>a-b);
}

const BIG_EXPENSE_RATIO = 0.1; // 1.2.15【定案】
function noteCashEntry(s, label, amount, cashBefore){
  const amt = Math.round(amount||0);
  if(!amt) return;
  s.cashLedger = (s.cashLedger||[]).concat([[String(label).slice(0,16), amt]]).slice(-20);
  const base = typeof cashBefore==="number" ? cashBefore : (s.cash||0) - amt;
  if(amt<0 && -amt > Math.max(0, base)*BIG_EXPENSE_RATIO)
    s.pendingExpenseMentions = (s.pendingExpenseMentions||[]).concat([{ label: String(label).slice(0,16), amount: amt }]).slice(-5);
}
function signed(n){ return (n>=0?"+":"−") + Math.abs(n).toLocaleString(); }
// B2（2026-09-29）：結算欄的項目。月收支兩項＋已知來源的收支；差額(列不出來源的)併成「其他收支」

// 舊存檔沒有cat的，一筆自成一項(沿用舊顯示)
const SETTLEMENT_GROUP_ORDER = ["打工收入","接案收入","副業收入","購物","其他收支"];
function buildSettlementItems(st, extras, turnNet){
  const items = [];
  if(st && st.months>0){
    const d = st.detail || {};
    items.push({ label: st.student ? "零用錢" : "收入", amount: st.incomeTotal||0, details: d.inc || [] });
    const paid = st.expensePaid!=null ? st.expensePaid : (st.expenseTotal||0);
    const expDetails = (d.exp||[]).map(([l,a])=>[l,-a]);
    if(paid < (st.expenseTotal||0)) expDetails.push(["存款見底沒付出去的部分", (st.expenseTotal||0)-paid]);
    items.push({ label: paid < (st.expenseTotal||0) ? "生活開銷（存款見底，只付得出這些）" : "生活開銷", amount: -paid, details: expDetails });
  }
  const groups = new Map();
  (extras||[]).forEach(x=>{
    if(!x || !x.amount) return;
    const key = x.cat || x.label;
    if(!groups.has(key)) groups.set(key, { label:key, amount:0, details:[] });
    const g = groups.get(key);
    g.amount += Math.round(x.amount); g.details.push([x.label, Math.round(x.amount)]);
  });
  const keys = Array.from(groups.keys()).sort((a,b)=>{ const ia = SETTLEMENT_GROUP_ORDER.indexOf(a), ib = SETTLEMENT_GROUP_ORDER.indexOf(b); return (ia<0?-1:ia)-(ib<0?-1:ib); });
  keys.forEach(k=>{ const g = groups.get(k); if(g.amount || g.details.length>1) items.push(g); });
  const listed = items.reduce((a,x)=>a+x.amount, 0);
  if(typeof turnNet==="number" && turnNet!==listed){
    const rest = turnNet-listed;
    const other = items.find(x=>x.label==="其他收支");
    if(other){ other.amount += rest; other.details.push(["未分類收支", rest]); }
    else items.push({ label:"其他收支", amount: rest, details:[["未分類收支", rest]] });
  }
  return items;
}

// 十六、16.11（2026-09-29）：結算列的HTML版——每個項目可以打開明細小視窗(電腦滑鼠移上去、手機點一下，點別處關閉)

// 三、3.4.7（2026-09-28）：每月收入、每月生活開銷(基本開銷＋房租房貸＋扶養費＋慢性病費用)，生活方式小卡與手頭狀態共用
function monthlyBudget(s){
  const income = s.monthlyIncome + (s.spouseIncome||0) + computeSideBusinessIncome(s);
  const expenses = s.monthlyExpenses.reduce((sum,e)=>sum+e.amount,0) + computeBaseLivingCost(s);
  return { income: Math.round(income), expenses: Math.round(expenses) };
}
// 五、5.5（2026-09-28）當月手頭狀態：依結餘÷收入分四級，學生期與出社會後共用；只給AI敘事參考
const MONEY_SITUATION_COMFORT_RATIO = 0.25; // 【測試參數，待驗證】
function computeMoneySituation(s){
  const { income, expenses } = monthlyBudget(s);
  const bal = income - expenses;
  if(bal < 0) return s.cash > 0 ? "吃緊" : "見底";
  return (income > 0 && bal/income >= MONEY_SITUATION_COMFORT_RATIO) ? "寬裕" : "剛好";
}
// 三、3.4.7週期性收支結算（2026-09-27從applyResult抽出，一般回合與放置代活(10.6.9「照3.4.7一般每月收支結算」)共用）
function applyMonthlySettlement(s, monthsCrossed){
  if(monthsCrossed>0){
    // 十二、12.12（2026-09-20新增）：tenure_months隨月份邊界累加，供12.5升遷年資門檻／12.3薪資年資加成使用
    if(s.careerStatus===CAREER_STATUS.EMPLOYED) s.tenureMonths = (s.tenureMonths||0) + monthsCrossed;
    // 十六、16.7.0人生總結備案要知道「做最久的職業」：在職或經營事業期間，依職業類別累計月數
    if((s.careerStatus===CAREER_STATUS.EMPLOYED || s.careerStatus===CAREER_STATUS.BUSINESS) && s.occupationCategory){
      s.occupationMonths = s.occupationMonths || {};
      s.occupationMonths[s.occupationCategory] = (s.occupationMonths[s.occupationCategory]||0) + monthsCrossed;
    }
    const totalExpenses = s.monthlyExpenses.reduce((sum,e)=>sum+e.amount,0);
    // 3.4.8 基本生活開銷：所有人生階段皆適用，依居住狀態決定，不再以occupationCategory為開關
    const livingCost = computeBaseLivingCost(s); // 3.4.11：已內含household共同生活分攤係數與子女扶養費
    // 三、3.4.11（2026-09-20新增）：household合併收入＝玩家個人月收入＋配偶月收入(若已婚)。配偶收入獨立追蹤(s.spouseIncome)，
    // 不直接併進s.monthlyIncome，避免玩家轉職時job_change覆寫monthlyIncome連帶把配偶收入也洗掉
    // 八、8.7（2026-09-27）：副業三選一的後續差異，接零星案／正式副業各有一筆週期性副業收入，見computeSideBusinessIncome()
    const householdMonthlyIncome = s.monthlyIncome + (s.spouseIncome||0) + computeSideBusinessIncome(s);
    // B2（2026-09-29）：收入、開銷在計算當下各自取整數，結餘＝兩個整數相減，畫面上的數字加起來一定對得上
    const incomeTotal = Math.round(householdMonthlyIncome*monthsCrossed);
    const expenseTotal = Math.round((totalExpenses+livingCost)*monthsCrossed);
    const rawNet = incomeTotal - expenseTotal;
    s.cash = Math.round(s.cash);
    let net = rawNet;
    // 5.5存款下限保護（9/14新增）：學生時期(尚無正職)存款不能變成負值，修正原本會出現NT$-35,950這種不合理負債的bug
    if(isStudentPhase(s) && s.cash + net < 0) net = -s.cash;
    s.cash += net;
    // 3.4.7（2026-09-28）：結算小字收入、支出分列。B2（2026-09-29）：存款觸底時，開銷改列實際付出去的金額(expensePaid)，
    // 取代原本「結餘照實列負數(rawNet)」——這樣上回合存款＋本回合結餘＝本回合存款
    s.lastSettlement = { months: monthsCrossed, net, rawNet, income:householdMonthlyIncome, expenses:totalExpenses+livingCost,
      incomeTotal, expenseTotal, student: isStudentPhase(s) };
    // 十六、16.11（2026-09-29）：收入、開銷的明細(名稱＋金額)，最後一筆吸收取整數的零頭，加起來＝總額
    const m = monthsCrossed, mo = m===1 ? "" : `（${m}個月）`;
    const inc = [[(isStudentPhase(s) ? "零用錢" : "個人收入")+mo, (s.monthlyIncome||0)*m]];
    if(s.spouseIncome) inc.push(["配偶收入"+mo, s.spouseIncome*m]);
    const exp = [["基本生活開銷"+mo, livingCost*m]].concat(s.monthlyExpenses.filter(e=>e.amount).map(e=>[String(e.label).slice(0,12)+mo, e.amount*m]));
    const fitTo = (list, total)=>{ const r = list.map(([l,a])=>[l, Math.round(a)]); const diff = total - r.reduce((x,y)=>x+y[1],0); if(r.length) r[r.length-1][1] += diff; return r.filter(x=>x[1]); };
    s.lastSettlement.detail = { inc: fitTo(inc, incomeTotal), exp: fitTo(exp, expenseTotal) };
    if(incomeTotal - net !== expenseTotal) s.lastSettlement.expensePaid = incomeTotal - net; // 只有存款見底、開銷沒付足時才記
    // 資產模型（9/14新增）：房貸每月攤還本金（不含利息，簡化模型），還清時自動移除房貸支出項
    if(s.mortgageBalance>0){
      const mortgagePayment = s.monthlyExpenses.find(e=>e.label==="房貸")?.amount || 0;
      s.mortgageBalance = Math.max(0, s.mortgageBalance - mortgagePayment*monthsCrossed);
      if(s.mortgageBalance===0){
        s.monthlyExpenses = s.monthlyExpenses.filter(e=>e.label!=="房貸");
      }
    }
  } else {
    s.lastSettlement = null;
  }
}

let idleCheckedLives = new Set();

function mockIdleOfflineDays(s){ // mock模式：本機依最後一次玩的日期算(真實模式一律由Worker算，10.6.2)
  if(!s.lastActiveDate) return 0;

const IDLE_MAX_DAYS_CLIENT = 7;
async function claimIdleRounds(s){
  if(!SERVER_AP || walletActive(s)){ // 10.8：雲端暫停期間跟mock一樣由本機算離線天數；帳號人生的錢包在Durable Object，不走每條人生的KV紀錄
    const days = mockIdleOfflineDays(s);

  try{

      body: JSON.stringify({ key: localStorage.getItem(RECOVERY_KEY_STORAGE_NAME), slot: Number(localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME)) }) });
    const data = await res.json();
    if(data && data.ap) syncServerAP(s, data.ap);
    return { rounds: (data && data.rounds) || 0, offlineDays: (data && data.offlineDays) || 0 };
  }catch(e){ console.warn("放置天數查詢失敗", e); return { rounds:0, offlineDays:0 }; }
}
async function maybeRunIdle(){
  const s = state;
  if(!s || s.phase!=="playing" || !s.idleEnabled || idleInFlight) return;
  const lifeKey = ensureLifeId(s);
  if(idleCheckedLives.has(lifeKey)) return;
  idleCheckedLives.add(lifeKey);
  idleInFlight = true;
  try{
    const claim = await claimIdleRounds(s);
    if(state!==s || !claim.rounds) return;
    const run = runIdleRounds(s, claim.rounds);
    run.offlineDays = claim.offlineDays;
    saveGame();
    await writeIdleSummary(s);
    saveGame(); render();
    renderIdleSummaryModal();
  } finally { idleInFlight = false; }

function buildIdleSummaryPayload(s){

async function rollbackIdleDecision(roundIndex, pointIndex){

  if(!run || run.rolledBack) return false;
  const round = run.rounds.find(r=>r.i===roundIndex);
  const point = round && round.rollbackPoints[pointIndex];
  if(!point) return false;
  if(totalAP(s) < IDLE_ROLLBACK_COST){ alert("行動點不足，不能回溯"); return false; }
  let apAfter = null;
  if(walletActive(s)){ // 十、10.9.2：帳號錢包一次性扣5點(伺服器不夠就不能回溯)
    const spent = await walletSpendOnce(IDLE_ROLLBACK_COST);

  } else if(!SERVER_AP) spendAP(s, IDLE_ROLLBACK_COST);

      const data = await res.json();
      if(!res.ok || !data.success){ alert((data && data.error && data.error.message) || "回溯失敗"); return false; }
      apAfter = data.ap;
    }catch(e){ alert("回溯失敗，請稍後再試"); return false; }
  }

  restored.log = (restored.log||[]).concat([{ age: restored.age, timeLabel:"放置期間", subtitle:"回到那個決定", text:`你回到放置期間第${roundIndex+1}回合的「${point.title}」，這一次由你自己決定。之後那段放置的日子已經改寫。`, turnSummary:`回到放置期間的${point.title}，自己重新決定`, statChanges:{} }]);
  state = restored;
  saveGame(); render();
  dispatchPendingModals();
  return true;
}

    syncBirthdayAge(s, win.start + off); // B1：新場景那天已過生日的話，年齡＋1
    sceneDate = calFormat(win.start + off);
  }
  // 十八、敘事節奏（2026-09-28，取代一、1.2.9.7的伏筆記帳）：劇情線、焦點角色由程式記錄；場景類別依AI事後回報計連續次數(學生時期)
  applyNarrativeRhythmResult(s, r, { prologue: !!(timeCtx && timeCtx.prologue), plan: timeCtx && timeCtx.scenePlan, gigCardId: (focusGigItem(timeCtx && timeCtx.focus)||{}).gigCardId });
  // 十八、18.13（2026-09-29 A10）：約定的新增、兌現/延期/取消；淡出中的約定在角色出場後移除
  { const lastAppear = (s.appearLog||[]).slice(-1)[0]; applyPromiseResults(s, r, timeCtx && timeCtx.window, new Set(lastAppear && lastAppear.turn===s.turnCount ? lastAppear.names : [])); }
  if(timeCtx && timeCtx.scenePlan) recordSceneCategory(s, s.placeCatNow || r.scene_category); // 18.15：類別以地點名單為準，scene_category只當舊回報的退路
  // 一、1.2.9.11.3（2026-09-24新增）：敘事分成「行動結果」＋「時間推進後的新場景」兩段依序呈現；
  // 1.2.8.4.2：{{名字|台詞}}依角色dialogue_style截斷後換成「台詞」，沒用這個格式的文字照常顯示
  // 十六、16.3.8（2026-09-28）：行動結果與新場景分開存，畫面上中間加分隔線；text仍存兩段合併的全文(回憶錄、AI的recent_turns等沿用)
  const markup = t=> t ? processDialogueMarkup(s, t) : { text:"", notes:[] };
  // 16.3.8.2：開場回合沒有行動結果(AI仍回了也不顯示)
  const resultDialogue = markup((timeCtx && timeCtx.prologue) ? "" : narrativeParagraphs(r.action_result).join("\n\n"));
  const sceneDialogue = markup(narrativeParagraphs(r.narrative).join("\n\n"));
  resultDialogue.notes.concat(sceneDialogue.notes).forEach(n=>{ console.warn("[台詞上限]", n); addReviewFlag(s, "dialogue_limit", n); });
  const resultText = String(resultDialogue.text||"").trim(), sceneText = String(sceneDialogue.text||"").trim();
  // 16.3.8.2選擇行：玩家選的選項或自己打的行動；開場回合沒有上一個選擇
  const chosenAction = (timeCtx && timeCtx.prologue) ? null : (String(actionText||"").trim() || null);
  // 一、1.2.9.6：回合標題副標(AI產生)，畫面顯示「時期標籤｜副標」
  const subtitle = r.chapter_subtitle ? String(r.chapter_subtitle).trim().slice(0,30) : "";
  // 兩段不重複存：text是全文，sceneAt是新場景在text裡的起點(存檔大小不變)，行動結果＝text.slice(0,sceneAt)
  const fullText = [resultText, sceneText].filter(Boolean).join("\n\n");
  applyItemMoves(s, r.item_moves, fullText); // 一、1.2.13（2026-09-29 A11）：重要物品轉手與提及
  // 二、2.6.2（2026-09-28）：學生時期的數值標記依來源上色——重心帶來的橘色、回應(及其他)帶來的紫色
  const focusMarks = studentTurn ? buildFocusMarks(s, turnFocus, focusChanges) : undefined; // 沒有任何重心變化時也要留空物件：代表這則用來源上色
  s.log.push({age:tagAge, timeLabel:tagLabel, subtitle, sceneDate, text:fullText, sceneAt: fullText.length - sceneText.length, action:chosenAction, turnSummary:r.turn_summary||"", settlement:compactSettlementForLog(s.lastSettlement), statChanges, focusMarks, relationshipHints,
    /* B5（2026-09-29）：這回合的重心也記在日記上(選擇紀錄、下載故事) */ focusLabel: turnFocus ? focusLogLabel(turnFocus) : undefined, focusNote: s.focusYearNote || undefined,
    /* 二、2.4.2（A2）：分數組成在公布時攤開 */ examNote: (timeCtx && timeCtx.examCheck) ? `${timeCtx.examCheck.examType}：${examBreakdownText(timeCtx.examCheck)}` : undefined, purchaseNote: purchaseNotes.join("；")||undefined, levelNotes: interestLevelNote||undefined, cash:s.cash}); // cash：十六、16.6回憶錄的「當時存款」
  // 介面：回憶錄（9/19新增，回應「畫面上舊日記消失」的困擾）：上限從60大幅提高到2000，
  // 足夠涵蓋單一人生全程(~1200-1400回合)不流失；每世reincarnate/succeedAsChild時log都會重置為[]，不會跨世累積
  s.focusYearNote = null; // 2.6.7.5：年度拚工作的健康扣分說明只跟這一則日記
  if(s.log.length>2000) s.log.shift();
  pruneSettlementDetails(s); // 十六、16.11：明細只留最近30則日記

  applyNamesRevealed(s, r); // QA 34.15 #4：名字被主角知道的角色解除
  s.choices = sanitizeChoiceNames(s, enforceConfessionChoices(s, r.choices || []));
  { const invite = takeInviteChoice(s); // 四、4.7.3【邀】：只出現這一回合的相關選項；沒去不扣好感
    if(invite && !s.choices.includes(invite)) s.choices = s.choices.concat([invite]); }
  // 下載故事(測試選單)用：這回合給玩家的選項跟著日記存；旁白回傳的完整資料只在測試瀏覽器留最近10回合(不含正文，正文已在日記)
  const lastLogEntry = s.log[s.log.length-1];
  if(lastLogEntry && s.choices.length) lastLogEntry.options = s.choices.slice(0,6);
  if(devToolsOn()){
    const raw = Object.assign({}, r); delete raw.action_result; delete raw.narrative;
    s.devAiLog = (s.devAiLog||[]).concat([{ turn: s.turnCount, label: tagLabel || (tagAge+"歲"), data: raw }]).slice(-DEV_AI_LOG_MAX);
  }

  // 七、7.1.5（9/16改版）：死亡結局現在完全由client端的forceEnding決定，AI不能自行發起結局——
  // 取代原本「意外死亡需滿足19歲以上+已有前兆」的防呆邏輯，因為AI已經不再有判斷「要不要死」的空間，只剩forceEnding這一道閘門
  if(r.is_ending && forceEnding){
    s.phase = "ending";
    // 七、7.1.4（9/20改版）：不再有title/summary，改為三層結構的人生總結
    s.ending = assembleEnding(s, r);
    s.lifeTrait = classifyLifeTrait(s.playStyle); // 7.7.4【定案】死亡時判定
  }
}

async function startLife(){
  // 十、10.3.4：全新人生在正式開始這一刻才領新手禮包（開場建角7步不扣點，反覆重骰也不會重複領）
  const ap = ensureAP(state);
  if(ap.giftPending && acct && acct.wl && !state.acct && !WL_HOLD.includes(acct.wl.status) && acct.wl.status!=="entered" && entryQuotaOn()){
    // 十、10.15：候補帳號的位子還沒輪到(或已過期)，不能開始；已填的角色設定留在畫面上
    await entryHandleWaitlist();
    return;
  }
  if(ap.giftPending && !acct && entryQuotaOn() && !deviceGiftClaimed()){
    // 十、10.15.2：名額在未綁信箱的啟程禮實際發出時才扣；這時名額被別人用完就顯示滿額訊息，已填的角色設定保留
    const k = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
    if(k){ const q = await entryClaimSlot(k); if(!q.ok){ showEntryFullModal(q.reason); return; } }
  }
  if(ap.giftPending && acct && !state.acct){
    // 十、10.9.2／10.9.3：登入帳號時開新人生＝帳號的人生(共用錢包)，不領本機的啟程禮；帳號第一次開到第2段人生時，由伺服器發第2份啟程禮(每日發放上限、發滿排隊)
    ap.giftPending = false;
    const r = await acctLifeAdd(state);
    if(!r.ok){
      // 帳號已滿(另一台裝置剛好開了新人生)或登入失效：這段人生照常開始，但不進帳號(沿用本機行動點，不發啟程禮)
      showWriterToast(r.error==="account_full" ? "撰稿人提醒你：帳號已滿 2 段人生，這段人生暫時不算在帳號裡。" : "撰稿人提醒你：這次沒能把人生登記進帳號，先照本機的行動點玩。");
    }
  } else if(ap.giftPending){
    ap.giftPending = false;
    const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
    const slotRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
    if(key){
      const claim = await claimNewLifeGift(key, slotRaw!==null ? Number(slotRaw) : 0);
      // 10.3.11（2026-09-25）：真實模式以Worker回傳的伺服器端餘額為準；mock模式或Worker連不上時維持本機計算
      if(SERVER_AP && claim.ap) syncServerAP(state, claim.ap);
      else if(claim.granted) ap.gift = AP_UNBOUND_GIFT;
      if(claim.granted){ state.giftGranted = true; apLogAdd(state, "啟程禮", AP_UNBOUND_GIFT); } // 10.10.3；giftGranted：這條人生領過啟程禮(10.11.4複製內容用，欄位名稱沿用內部命名)
    }
  }
  state.phase = "playing";
  render(true);
  maybeShowIntroModal(state); // 16.18.2：第一回合前跳出；開場回合照常在背後產生
  // 二、2.2（2026-09-23修正）：原本這句文字含「暑假」二字，會被detectTimeSkipIntent()誤判成跳過指令，
  // 導致第一回合就隨機跳2~4段；改用timeState.prologue旗標讓這一回合完全不經過跳過判定/段落推進
  // 2026-09-29：回傳開場回合的promise，呼叫端(測試)await時會等到開場回合寫完；畫面上的按鈕不await，行為不變
  return takeTurn("（人生正式開始：15歲的你，在高中開學前的暑假最後一天。）", 0);
}

// 16.7「再寫一次人生」＝轉世。七、7.4.3.2（2026-09-28定案）：免費轉世不保留任何數值(取代原本隨機一項數值小幅加成)，
// 只留前世記憶式的敘事痕跡，寫給旁白的素材也不直接說「前世」。點數照十、10.3.6全部保留
function reincarnate(opts){
  const carry = { reincarnations:(state.reincarnations||0)+1,
    calStartYear: calNextOpeningYear(state.timeState && state.timeState.cal && state.timeState.cal.v===2 ? state.timeState.cal.lastRoundEnd : 0), // 二、2.7：轉世從上一世結束後的下一個開局日開始
    chronicleCarry: `（說不上來的熟悉感）偶爾會有似曾相識的片刻或夢境，只能隱約帶過，不說破來由。`,
    name: state.name, gender: state.gender,
    ap: ensureAP(state), apLog: state.apLog, giftGranted: state.giftGranted, acct: state.acct }; // 十、10.3.6（2026-09-23使用者確認轉世丹＝restart_item）：點數全部保留，「第X回合」歸零
  const prevForKeep = state;
  state = newRoll(carry, null);
  if(opts && opts.keep) applyLifeKeep(state, opts.keep, "reincarnate", prevForKeep);
  saveGame();
  render();
}

// ========== 七、7.4.3.4／十、10.3.13 人生重開丹（2026-10-08）：10點，轉世或傳承時三選一，帶一份東西到下一世 ==========
// 興趣天賦：挑一個這一世的興趣，下一世的同一個興趣卡一建立就從投入度20起始（上限100；副業門檻40不受影響）
// 數值起點：才識或人脈擇一，下一世起點＋5
// 指定NPC：轉世＝以新身份在下一世第一個人生階段內宿緣重逢（好感度從一般新角色的起點開始，熟悉感只以敘事呈現）；傳承＝也帶到孩子這一世
const LIFE_KEEP_STAT_LABELS = { knowledge:"才識", network:"人脈" };
const LIFE_KEEP_REUNION_RELATIONS = ["同學","鄰居","補習班同學","社團同學"];
function lifeKeepNpcCandidates(s, mode, childName){
  return (s.characters||[]).filter(c=>c && c.name && !isFamilyCharacter(c) && c.name!==childName && c.romanceStatus!=="married")
    .slice().sort((a,b)=>(b.affinity||0)-(a.affinity||0)).slice(0,8);
}
function lifeKeepText(keep, succeed){
  if(keep.type==="interest") return succeed ? `${keep.label}（從小跟著爸媽接觸）` : `興趣：${keep.label}`;
  if(keep.type==="stat") return succeed ? (keep.stat==="knowledge" ? "才識起點（家裡的教育資源）" : "人脈起點（家裡的人脈）") : `${LIFE_KEEP_STAT_LABELS[keep.stat]}起點`;
  return `指定的人：${keep.name}`;
}
function openLifeKeepPanel(mode, childName){
  if(blockIfTurnBusy("選人生重開丹")) return;
  const s = state, succeed = mode==="succeed";
  const can = totalAP(s) >= LIFE_KEEP_COST;
  const cards = formalInterestCards(s);
  const npcs = lifeKeepNpcCandidates(s, mode, childName);
  const need = can ? "" : `<span class="rv-note" style="margin-left:6px;">需要 ${LIFE_KEEP_COST} 點</span>`;
  const dis = can ? "" : "disabled";
  const btn = (keep, text, extra)=>`<button class="choice-btn" data-keep="${escapeHtml(JSON.stringify(keep))}" ${dis||extra||""}>${escapeHtml(text)}</button>`;
  const interestHtml = cards.length ? cards.map(c=>btn({ type:"interest", category:c.category, label:c.category }, c.category)).join("") : `<p class="rv-note">這一世沒有可以帶的興趣。</p>`;
  const statHtml = ["knowledge","network"].map(k=>btn({ type:"stat", stat:k }, succeed ? (k==="knowledge" ? "才識（家裡的教育資源）" : "人脈（家裡的人脈）") : LIFE_KEEP_STAT_LABELS[k])).join("");
  const npcHtml = npcs.length ? npcs.map(c=>btn({ type:"npc", name:c.name }, `${c.name}（${c.relation||"認識的人"}）`)).join("") : `<p class="rv-note">這一世沒有可以指定的人。</p>`;
  const div = entryModal("life-keep-modal", `<h3>人生重開丹</h3>
    <p style="font-size:13.5px;">用 ${LIFE_KEEP_COST} 點，換一份帶到下一世的東西。一次只能選一項。${need}</p>
    <div class="keep-group"><b>${succeed ? "興趣天賦（從小跟著爸媽接觸）" : "興趣天賦"}</b><p class="rv-note">挑一個這一世的興趣，下一世的它一開始就有基礎。</p>${interestHtml}</div>
    <div class="keep-group"><b>${succeed ? "數值起點（家裡的資源）" : "數值起點"}</b><p class="rv-note">才識或人脈擇一，下一世的起點多一點。</p>${statHtml}</div>
    <div class="keep-group"><b>指定的人</b><p class="rv-note">${succeed ? "挑一位這一世認識的人，也出現在孩子的這一世。" : "挑一位這一世認識的人，下一世會用新的身份再遇見，只剩說不上來的熟悉感。"}</p>${npcHtml}</div>
    <button class="ghost-btn" id="btn-keep-skip">${succeed ? "不帶，直接接著寫" : "不帶，直接轉世"}</button>
    <button class="ghost-btn" id="btn-keep-cancel">取消</button>`);
  div.querySelector(".modal").style.cssText += "max-height:86vh;overflow-y:auto;text-align:left;";
  const go = (keep)=>{ div.remove(); if(succeed) succeedAsChild(childName, keep ? { keep } : undefined); else reincarnate(keep ? { keep } : undefined); };
  document.getElementById("btn-keep-skip").onclick = ()=>go(null);
  document.getElementById("btn-keep-cancel").onclick = ()=>div.remove();
  div.querySelectorAll("button[data-keep]").forEach(b=>{
    b.onclick = ()=>{
      let keep; try{ keep = JSON.parse(b.dataset.keep); }catch(e){ return; }
      const ok = entryModal("life-keep-confirm", `<p>用 ${LIFE_KEEP_COST} 點換這份人生重開丹，帶到下一世。</p><p class="rv-note">${escapeHtml(lifeKeepText(keep, succeed))}</p>
        <button class="primary-btn" id="btn-keep-ok">確定</button><button class="ghost-btn" id="btn-keep-back">再想想</button>`);
      document.getElementById("btn-keep-back").onclick = ()=>ok.remove();
      document.getElementById("btn-keep-ok").onclick = async ()=>{
        const okBtn = document.getElementById("btn-keep-ok"); if(okBtn) okBtn.disabled = true;
        const s0 = state;
        const r = await paySinglePoints(s0, LIFE_KEEP_COST, "人生重開丹");
        ok.remove();
        if(state!==s0) return;
        if(!r.ok){ showWriterToast(r.insufficient ? "撰稿人提醒你：行動點不夠，這次不能用人生重開丹。" : "撰稿人提醒你：這次沒有成功，請稍後再試一次。"); return; }
        go(keep);
      };
    };
  });
}
// 新的一世建好後套用（出身骰定後不可重骰，所以直接寫進新state）
function applyLifeKeep(ns, keep, mode, prev){
  if(!ns || !keep) return;
  ns.lifeKeep = { type:keep.type, mode };
  if(keep.type==="stat" && LIFE_KEEP_STAT_LABELS[keep.stat]){
    ns.stats[keep.stat] = clamp((ns.stats[keep.stat]||0) + 5, 0, 100);
    ns.lifeKeep.stat = keep.stat;
  } else if(keep.type==="interest" && INTEREST_CATEGORIES.includes(keep.category)){
    ns.lifeKeep.category = keep.category; ns.lifeKeep.used = false; // 下一世第一次建立這個興趣的卡時，投入度從20起始（applyInterestEvent）
  } else if(keep.type==="npc"){
    const c = (prev && prev.characters || []).find(x=>x.name===keep.name);
    if(!c) return;
    const gender = CHARACTER_GENDERS.includes(c.gender) ? c.gender : rollNpcGender();
    if(mode==="succeed"){
      // 傳承：從孩子的角度重新寫來歷，直接帶進這一世的人脈
      ns.characters.push({ name:c.name, relation:"爸媽的舊識", gender, dialogueStyle:c.dialogueStyle||rollDialogueStyle(), traits:c.traits||"",
        affinity:50, summary:"", lastTurn:0, active:true, isChild:false, origin:"爸媽的舊識，從小就認識", cohabiting:false,
        age: typeof c.age==="number" ? Math.max(15, Math.round(c.age)) : rnd(35,55) });
      ns.lifeKeep.name = c.name; ns.lifeKeep.used = true;
    } else {
      ns.reunionNpc = { name:c.name, gender, traits:c.traits||"", relation:pick(LIFE_KEEP_REUNION_RELATIONS), triggerTurn:rnd(6,24), done:false, cardName:null };
      ns.lifeKeep.name = c.name;
    }
  }
}
// 轉世指定NPC：第一個人生階段內的某一回合新角色登場（建卡＋這回合告訴AI自然安排登場，熟悉感只以敘事呈現）
function maybeFireReunionNpc(s){
  s.reunionNow = null;
  const r = s.reunionNpc;
  if(!r || r.done || s.turnCount < r.triggerTurn) return;
  if(!s.timeState || s.timeState.stageMode!=="highschool"){ r.done = true; return; } // 錯過第一個人生階段就不再安排
  let name = r.name;
  if((s.characters||[]).some(c=>c.name===name)) name = renameForConflict(s, name, r.relation);
  s.characters.push({ name, relation:r.relation, gender:r.gender, dialogueStyle:rollDialogueStyle(), traits:r.traits||"", style:null,
    affinity:50, summary:"", lastTurn:s.turnCount, active:true, isChild:false, origin:"新認識的人，卻有種說不上來的熟悉感", age:rnd(15,17) });
  r.done = true; r.cardName = name;
  s.reunionNow = { name, relation:r.relation, gender:r.gender };
}

function economicTierForSavingsAmount(savings){
  // 9/19隨3.4整章遊戲幣單位改版同步÷1000
  if(savings<200) return "清寒";
  if(savings<3000) return "小康";
  return "富裕";
}
function rollEconomicTierForced(tier){
  if(tier==="清寒") return { tier, network:rnd(15,35), allowance:STUDENT_ALLOWANCE_UNITS["清寒"], savings:STUDENT_ALLOWANCE_UNITS["清寒"], ...rollFamilyFinance("清寒") };
  if(tier==="小康") return { tier, network:rnd(30,55), allowance:STUDENT_ALLOWANCE_UNITS["小康"], savings:STUDENT_ALLOWANCE_UNITS["小康"], ...rollFamilyFinance("小康") };
  return { tier:"富裕", network:rnd(50,75), allowance:STUDENT_ALLOWANCE_UNITS["富裕"], savings:STUDENT_ALLOWANCE_UNITS["富裕"], ...rollFamilyFinance("富裕") };
}
function deriveParentTraitFromAffinity(aff, summary){
  let tone;
  if(aff>=70) tone = "跟你感情很好，願意溝通、給空間、支持你的決定";
  else if(aff>=45) tone = "感情普通，日常互動平淡但不算疏離";
  else tone = "感情有些疏遠，報喜不報憂、情感表達少";
  return summary ? tone+"；過去點滴："+summary : tone;
}
function eligibleChildren(){

      list.push(Object.assign({ id, meta }, await packForCloud(archivedState)));

// ========== 十五、人生之書：章節成書（2026-09-25新增，佇列批次6，【定案草稿】待使用者確認） ==========
// 每換一個人生階段(高中→大學／技職→初入社會→職涯發展→中年→老年)成一章；同一階段超過5個遊戲年，每5年另成一章；
// 人生結束(死亡)那一回合把最後一段也收成一章。素材只用每回合的turn_summary與重大事件，不送完整敘事(控制成本)。
// 背景生成、不扣行動點、不影響任何遊戲數值；失敗可稍後重試，不影響遊玩
const BOOK_MAX_YEARS_PER_CHAPTER = 5;        // 【定案草稿,十五、15.1】
const BOOK_MAX_SUMMARIES_PER_CHAPTER = 150;  // 【測試參數,15.2】素材上限，超過就平均抽樣(有重大事件的回合一定保留)
const BOOK_AUTO_RETRY_MAX = 3;               // 【測試參數,15.5】失敗後每回合結束自動重試一次，最多3次；之後只能手動重試
let MOCK_CHAPTER_FAIL_RATE = 0;              // 🛠面板可調，測試失敗重試用
let MOCK_CHAPTER_DELAY_MS = 600;
let bookInFlight = null;                     // 目前正在生成的Promise(一次只生成一章)
const CHINESE_NUMS = ["零","一","二","三","四","五","六","七","八","九","十"];
function chineseNum(n){
  if(n<=10) return CHINESE_NUMS[n];
  if(n<20) return "十"+(n%10?CHINESE_NUMS[n%10]:"");
  return CHINESE_NUMS[Math.floor(n/10)]+"十"+(n%10?CHINESE_NUMS[n%10]:"");
}
function bookStageOf(s){
  const mode = s.timeState && s.timeState.stageMode;
  if(mode==="highschool") return { key:"highschool", label:"高中" };
  if(mode==="college") return { key:"college", label:"大學／技職" };
  if(s.age<30) return { key:"adult-early", label:"初入社會" };
  if(s.age<=45) return { key:"adult-career", label:"職涯發展" };
  if(s.age<=60) return { key:"adult-middle", label:"中年" };
  return { key:"adult-old", label:"老年" };
}
function ensureBook(s){
  if(!s.book) s.book = { chapters:[], draft:null, unseen:0, seq:0 };
  // 讀檔時上一次沒寫完的(頁面關掉)改回待寫
  if(!bookInFlight) s.book.chapters.forEach(c=>{ if(c.status==="writing") c.status = "pending"; });
  return s.book;
}
// 每回合成功套用結果後呼叫：先判斷要不要收成一章，再把這回合的摘要放進目前這一章的素材
function bookAfterTurn(s, r, forceEnding){
  const book = ensureBook(s);
  const st = bookStageOf(s);
  const d = book.draft;
  if(d && (d.key!==st.key || s.age - d.startAge >= BOOK_MAX_YEARS_PER_CHAPTER)) closeBookDraft(s);
  if(!book.draft){
    book.draft = { key:st.key, label:st.label, startAge:s.age, endAge:s.age, startTurn:s.turnCount, items:[], events:[] };
  }
  const draft = book.draft;
  const last = s.log[s.log.length-1] || {};
  const summary = String(r.turn_summary||"").trim();
  if(summary) draft.items.push({ t: last.timeLabel || (s.age+"歲"), s: summary.slice(0,200), d: last.sceneDate || null, ev: !!r.major_event_summary });
  // 重大事件：取這回合新增的人生大事記(chronicle)——包含AI回報的major_event_summary，以及程式自己記的大事(重大疾病、父母過世等)
  const chron = s.chronicle || [];
  if(typeof book.chronicleSeen!=="number" || book.chronicleSeen > chron.length) book.chronicleSeen = Math.min(book.chronicleSeen||0, chron.length);
  chron.slice(book.chronicleSeen).forEach(e=>draft.events.push(String(e).slice(0,120)));
  book.chronicleSeen = chron.length;
  draft.endAge = s.age;
  if(!draft.dateFrom && last.sceneDate) draft.dateFrom = last.sceneDate;
  if(last.sceneDate) draft.dateTo = last.sceneDate;
  if(forceEnding || s.phase==="ending") closeBookDraft(s);
}
function closeBookDraft(s){
  const book = ensureBook(s);
  const d = book.draft;
  book.draft = null;
  if(!d || !d.items.length) return null;
  book.seq = (book.seq||0) + 1;
  const part = book.chapters.filter(c=>c.key===d.key).length + 1;
  const ch = {
    id: (s.lifeId||"life") .replace(/[^a-z0-9]/g,"").slice(0,20) + "c" + book.seq,
    index: book.chapters.length + 1,
    key: d.key, label: d.label, part,
    ageFrom: d.startAge, ageTo: d.endAge, dateFrom: d.dateFrom||null, dateTo: d.dateTo||null,
    items: d.items, events: d.events,
    status: "pending", attempts: 0, lastAttemptTurn: null,
    createdTurn: s.turnCount, title: null, text: null
  };
  book.chapters.push(ch);
  return ch;
}
function sampleChapterItems(items){
  if(items.length<=BOOK_MAX_SUMMARIES_PER_CHAPTER) return items;
  const keep = new Set(items.map((it,i)=>it.ev?i:-1).filter(i=>i>=0));
  const slots = Math.max(0, BOOK_MAX_SUMMARIES_PER_CHAPTER - keep.size);
  for(let k=0;k<slots;k++) keep.add(Math.floor(k*items.length/slots));
  return [...keep].sort((a,b)=>a-b).slice(0,BOOK_MAX_SUMMARIES_PER_CHAPTER).map(i=>items[i]);
}
function chapterStageText(ch){
  return ch.label + (ch.part>1 ? `（${chineseNum(ch.part)}）` : "");
}
function buildChapterMaterial(s, ch){
  const book = ensureBook(s);
  const prev = book.chapters.filter(c=>c.index<ch.index && c.status==="done").slice(-1)[0];
  return {
    player_name: s.name, gender: s.gender,
    chapter_index: ch.index, stage_label: chapterStageText(ch),
    age_from: ch.ageFrom, age_to: ch.ageTo, date_from: ch.dateFrom, date_to: ch.dateTo,
    turn_summaries: sampleChapterItems(ch.items).map(it=>({ t:it.t, s:it.s })),
    major_events: (ch.events||[]).slice(-60),
    characters: (s.characters||[]).slice(0,40).map(c=>({ name:c.name, relation:c.relation })),
    romance_flags: buildRomanceFlags(s), intimacy_mode: "full", // 十六、16.3.7：人生之書套用同一尺度(2026-09-28起一律完整呈現)
    previous_chapter_title: prev ? prev.title : null
  };
}
async function callChapterAI(s, ch){
  const chapterMsg = JSON.stringify(buildChapterMaterial(s, ch));
  const res = await fetch(WORKER_URL, {
    method:"POST", headers: acctHeaders(),
    body: JSON.stringify({
      kind:"chapter",
      key: localStorage.getItem(RECOVERY_KEY_STORAGE_NAME),
      slot: Number(localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME)),
      life_id: ensureLifeId(s), chapter_id: ch.id,
      messages: [{ role:"user", content: chapterMsg }]
    })
  });
  const text = await res.text();
  let data; try{ data = JSON.parse(text); }catch(e){ throw new Error("章節回應不是合法JSON（HTTP "+res.status+"）"); }
  if(isDailyCapResponse(res, data)) noteDailyCapBlocked(); // 十、10.9.3.1：人生之書章節也是AI呼叫；這章之後會自動重試
  if(!res.ok) throw new Error("章節生成失敗 "+res.status+"："+(data?.error?.message||""));
  if(data && data.lifegame && data.lifegame.usage){ lastChapterUsage = data.lifegame.usage; addDevUsage(s, Object.assign({}, data.lifegame.usage, { sys_chars:data.lifegame.sys_chars||0 }), { kind:"chapter", inChars:{ stats:chapterMsg.length }, outChars:outputBlockChars(data) }); }
  const block = (data.content||[]).find(b=>b.type==="tool_use" && b.name==="submit_chapter");
  if(!block || !block.input) throw new Error("回應裡沒有submit_chapter");
  return block.input;
}
let lastChapterUsage = null;
async function mockGenerateChapter(s, ch){
  await new Promise(r=>setTimeout(r, MOCK_CHAPTER_DELAY_MS));
  if(Math.random() < MOCK_CHAPTER_FAIL_RATE) throw new Error("模擬章節生成失敗");
  const m = buildChapterMaterial(s, ch);
  const paras = [];
  paras.push(`〔模擬章節〕這是mock模式依素材拼出來的示意正文，真實API才會寫成小說。`);
  m.turn_summaries.forEach(it=>paras.push(`${it.t}。${it.s}`));
  m.major_events.forEach(e=>paras.push(e));
  let text = paras.join("\n\n");
  while(Array.from(text).length < 1500) text += "\n\n窗外的光慢慢移過桌面，你把杯子裡剩下的水喝完。";
  return { title: `${m.stage_label}的日子`, text: Array.from(text).slice(0,2500).join("") };
}
async function generateChapter(s, ch){
  ch.status = "writing"; ch.attempts = (ch.attempts||0)+1; ch.lastAttemptTurn = s.turnCount;
  try{
    const out = USE_MOCK ? await mockGenerateChapter(s, ch) : await callChapterAI(s, ch);
    const title = String(out.title||"").replace(/^第.{1,4}章[\s　:：]*/,"").trim().slice(0,20);
    const text = String(out.text||"").trim();
    if(!title || Array.from(text).length < 300) throw new Error("章節內容過短或沒有章名");
    ch.title = title; ch.text = text; ch.status = "done"; ch.error = null;
    delete ch.items; delete ch.events; // 寫好後素材用不到了，減少存檔大小
    const book = ensureBook(s);
    if(!book.chapters.includes(ch)) return; // 這一章在生成途中被反悔撤掉了
    book.unseen = (book.unseen||0) + 1;
    if(state===s){ saveGame(); showBookToast(); refreshBookPage(); updateBookLink(); }
  }catch(e){
    console.warn("章節生成失敗，之後會再試：", e);
    ch.status = "failed"; ch.error = String(e && e.message || e).slice(0,200);
    if(state===s){ saveGame(); refreshBookPage(); }
  }
}
// 依序把待寫的章節寫完。autoRetry=true時，失敗的章節(自動重試未滿3次、這回合還沒試過)也重試一次
function processBookQueue(autoRetry){
  const s = state;
  if(!s || !s.book || bookInFlight) return bookInFlight;
  const next = s.book.chapters.find(c=>c.status==="pending" ||
    (autoRetry && c.status==="failed" && (c.attempts||0) < BOOK_AUTO_RETRY_MAX && c.lastAttemptTurn!==s.turnCount));
  if(!next) return null;
  const p = generateChapter(s, next).finally(()=>{ if(bookInFlight===p) bookInFlight = null; if(state===s) processBookQueue(false); });
  bookInFlight = p;
  return p;
}
function retryChapter(id){
  const ch = state && state.book && state.book.chapters.find(c=>c.id===id);
  if(!ch || ch.status!=="failed") return;
  ch.status = "pending";
  refreshBookPage();
  processBookQueue(false);
}
// 人生結束前把還沒寫完的章節等完(最多等maxMs)，讓封存到人生回顧的是完整的書
async function waitForBook(maxMs){
  const deadline = Date.now() + (maxMs||90000);
  while(Date.now() < deadline){
    const p = processBookQueue(false);
    if(!p) return;
    await Promise.race([p, new Promise(r=>setTimeout(r, Math.max(0, deadline-Date.now())))]);
  }
}
// 十五、15.1（2026-09-28使用者確認）：世代傳承保留上一代的人生之書(唯讀)，轉世丹不保留。
// 比照「就此闔卷」先等還沒寫完的章節(最多90秒)，再把寫好的章節另存到Worker(/family-book)，家族年表只記id——
// 一本書約100KB，直接放存檔傳幾代就會超過Worker的1MB上限。上傳失敗(離線等)才把章節整本留在存檔裡，至少不會弄丟
const FAMILY_BOOK_CHAPTER_FIELDS = ["id","index","label","part","title","text","ageFrom","ageTo"];
async function preserveFamilyBook(prev){
  if(!prev.book || !prev.book.chapters.length) return null;
  await ensureArchivedContent(prev); // 10.7.3：章節內文在封存包裡時先補齊
  if(prev.book.chapters.some(c=>c.status!=="done")){
    prev.book.chapters.forEach(c=>{ if(c.status==="failed") c.status = "pending"; });
    document.getElementById("app").insertAdjacentHTML("afterbegin", `<div class="loading" id="book-finishing">正在把最後一章寫進人生之書…</div>`);
    await waitForBook(90000);
    document.getElementById("book-finishing")?.remove();
  }
  closeBookPage();
  const chapters = prev.book.chapters.filter(c=>c.status==="done").map(c=>{
    const o = { status:"done" };
    FAMILY_BOOK_CHAPTER_FIELDS.forEach(k=>{ if(c[k]!==undefined) o[k] = c[k]; });
    return o;
  });
  if(!chapters.length) return null;
  const id = "fb" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  if(key && CLOUD_SAVE_ENABLED){ // 十、10.8：雲端暫停期間整本留在存檔裡
    try{
      const res = await fetch(WORKER_URL+"family-book", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ key, id, book:{ owner: prev.name, chapters } }) });
      const data = await res.json();
      if(res.ok && data && data.success===true){ familyBookCache[id] = { chapters }; return { id, chapterCount: chapters.length }; }
    }catch(e){ console.warn("上一代的人生之書上傳失敗，改整本留在存檔裡", e); }
  }
  return { inline: { chapters }, chapterCount: chapters.length };
}
const familyBookCache = {};
async function loadFamilyBook(ref){
  if(!ref) return null;
  if(ref.inline) return ref.inline;
  if(familyBookCache[ref.id]) return familyBookCache[ref.id];
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  if(!key || !CLOUD_SAVE_ENABLED) return null;
  try{
    const res = await fetch(WORKER_URL+"family-book?key="+encodeURIComponent(key)+"&id="+encodeURIComponent(ref.id));
    const data = await res.json();
    if(res.ok && data && data.success===true){ familyBookCache[ref.id] = { chapters: data.chapters||[] }; return familyBookCache[ref.id]; }
  }catch(e){ console.warn("讀取上一代的人生之書失敗", e); }
  return null;
}

const LOADING_HOLD_MIN_MS = 8000, LOADING_HOLD_MAX_MS = 10000; // 【定案】每句停留8-10秒，每次隨機
let loadingStartedAt = null;
let loadingTimers = [];
let loadingLastRoundLine = -1; // 上一回合開頭那一句，這回合不重複
let loadingLineIdx = -1;
let loadingCurrentText = "";
function pickLoadingLine(avoidIdx){
  let i = Math.floor(Math.random()*LOADING_LINES.length);
  if(LOADING_LINES.length>1 && i===avoidIdx) i = (i + 1 + Math.floor(Math.random()*(LOADING_LINES.length-1))) % LOADING_LINES.length;
  loadingLineIdx = i;
  return LOADING_LINES[i];
}
function setLoadingText(text){
  loadingCurrentText = text;
  const t = document.querySelector("#turn-loading .loading-text");
  if(!t) return;

  </div>`;

function updateLoadingTimer(loadingTurn){
  if(!loadingTurn){
    loadingStartedAt = null; loadingCurrentText = "";
    loadingTimers.forEach(t=>clearTimeout(t)); loadingTimers = [];
    return;
  }
  if(loadingStartedAt) return; // 同一次等待中再次render(true)，不重新計時
  loadingStartedAt = Date.now();
  loadingCurrentText = ""; // 前3秒只有三個小點
  const hold = ()=> LOADING_HOLD_MIN_MS + Math.floor(Math.random()*(LOADING_HOLD_MAX_MS-LOADING_HOLD_MIN_MS+1));
  const next = ()=>{
    if(!loadingStartedAt) return;
    loadingLineIdx = (loadingLineIdx + 1) % LOADING_LINES.length; // 照順序，輪完從頭
    setLoadingText(LOADING_LINES[loadingLineIdx]);
    loadingTimers.push(setTimeout(next, hold()));
  };
  loadingTimers.push(setTimeout(()=>{
    if(!loadingStartedAt) return;
    setLoadingText(pickLoadingLine(loadingLastRoundLine));
    loadingLastRoundLine = loadingLineIdx;
    loadingTimers.push(setTimeout(next, hold()));
  }, LOADING_FIRST_DELAY_MS));
}

function homeUnfinishedLives(){
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);

  for(let slot=0; slot<3; slot++){

function relativeTimeText(ts){
  if(!ts) return "";
  const min = Math.floor((Date.now()-ts)/60000);
  if(min < 1) return "剛剛";
  if(min < 60) return `${min} 分鐘前`;
  const hr = Math.floor(min/60);
  if(hr < 24) return `${hr} 小時前`;
  const day = Math.floor(hr/24);
  if(day < 30) return `${day} 天前`;
  const mon = Math.floor(day/30);
  return mon < 12 ? `${mon} 個月前` : `${Math.floor(mon/12)} 年前`;
}

// 16.10.7：翻回第一頁，時長用16.4.1的「慢」(600ms)；減少動態模式直接跳回頂端
function smoothScrollTop(duration){
  if(reducedMotion() || !window.requestAnimationFrame){ window.scrollTo(0,0); return; }
  const from = window.scrollY, start = performance.now();
  const step = now=>{
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3); // 接近16.4.1的進場曲線
    window.scrollTo(0, Math.round(from*(1-eased)));
    if(p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// 雲端(Worker /archives)＋本機後備副本(雲端封存失敗時才會有)合併顯示，依結束時間新到舊
async function showArchiveList(key){
  let items = [];
  if(CLOUD_SAVE_ENABLED) try{ // 十、10.8
    const res = await fetch(WORKER_URL+"archives?key="+encodeURIComponent(key));
    const data = await res.json();
    if(data && data.success && Array.isArray(data.archives)) items = data.archives.map(a=>({ id:a.id, meta:a.meta||{}, source:"cloud" }));
  }catch(e){ console.warn("讀取人生回顧清單失敗", e); }
  try{
    JSON.parse(localStorage.getItem(ARCHIVE_LOCAL_PREFIX+key) || "[]").forEach(a=>{
      if(!items.some(x=>x.id===a.id)) items.push({ id:a.id, meta:a.meta||{}, source:"local" });
    });
  }catch(e){}
  items.sort((a,b)=>(b.meta.endedAt||0)-(a.meta.endedAt||0));
  state = { phase:"archiveList", items };
  render();
}
function renderArchiveList(){
  const rows = state.items.map(a=>{
    const m = a.meta;

    return `<button class="ghost-btn archive-btn" data-id="${escapeHtml(a.id)}" data-source="${a.source}" style="display:block;width:100%;text-align:left;margin:6px 0;">
      ${escapeHtml(m.name||"")}・第${(m.reincarnations||0)+1}世・${m.age||"?"}歲・${m.reason==="deleted"?"中途放下":"走完一生"}　<span style="font-size:11px;color:var(--ink-soft);">${dateText}</span>

    const link = document.createElement("a");
    link.href = url; link.download = `${info.name||"人生"}的這一生.png`;

function drawShareCard(info, events){
  const canvas = document.createElement("canvas");
  canvas.width = 720; canvas.height = 420 + events.length*34;
  const ctx = canvas.getContext && canvas.getContext("2d");
  if(!ctx) return null;
  ctx.fillStyle = "#f6f1e7"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#2b2622"; ctx.font = "bold 30px sans-serif"; ctx.fillText(`${info.name||""}的這一生`, 40, 60);
  ctx.font = "22px sans-serif"; ctx.fillText(info.trait && info.trait.type ? info.trait.text : LIFE_TRAIT_UNCLEAR_TEXT, 40, 105);
  lifeTraitCardBars(info.playStyle).forEach((b,i)=>{
    const y = 150 + i*36;
    ctx.fillStyle = "#2b2622"; ctx.font = "18px sans-serif"; ctx.fillText(b.label, 40, y+14);
    ctx.fillStyle = "#e3dccf"; ctx.fillRect(170, y, 400, 16);
    ctx.fillStyle = "#9c3b2e"; ctx.fillRect(170, y, Math.round(400*b.v), 16);
  });
  ctx.fillStyle = "#2b2622"; ctx.font = "18px sans-serif";
  events.forEach((e,i)=>ctx.fillText("・"+e, 40, 360 + i*34));
  return canvas.toDataURL("image/png");
}

    if(!localStorage.getItem(RECOVERY_KEY_STORAGE_NAME)){

// 日記拆回「行動結果」「新場景」兩段(sceneAt)；16.3.8之前的舊日記沒有sceneAt，整段算新場景
function splitEntryText(e){
  const text = String(e.text||"");
  const split = Number.isInteger(e.sceneAt) && e.sceneAt>=0 && e.sceneAt<=text.length;
  return { split, resultText: split ? text.slice(0, e.sceneAt).trim() : "", sceneText: split ? text.slice(e.sceneAt).trim() : text };
}
function renderEntryBody(e, withTag){
  const text = String(e.text||"");
  const { split, resultText, sceneText } = splitEntryText(e);
  const story = split
    ? `${resultText ? renderParagraphs(resultText, true) : ``}${resultText && sceneText ? `<hr class="turn-divider" aria-hidden="true">` : ``}${renderParagraphs(sceneText, true)}`
    : renderParagraphs(text, true);
  return `${e.action ? `<div class="choice-line">→ ${escapeHtml(e.action)}${e.focusLabel ? `<span class="focus-note">　重心：${escapeHtml(e.focusLabel)}</span>` : ``}</div>` : ``}${withTag ? `<div class="age-tag">${renderEntryTag(e)}</div>` : ``}${story}

}

function renderFocusBar(s, disabled){

  const workGig = adult ? (adultWork && adultWork.kind==="gig" ? adultWork.card : null) : currentWorkChoice(s);
  const workHasPicker = adult ? workOpts.length>1 : gigCards.length>0;
  const workLabel = adult ? `工作：${adultWork ? adultWork.label : ""}${workHasPicker ? " ▾" : ""}` : (gigCards.length ? `工作：${workGig ? workGig.category : "打工"} ▾` : "工作");

  const familyLabel = care ? `家人：照顧${careTitle(care)}` : FOCUS_LABELS.family;
  const labelOf = k=> k==="interest" ? interestLabel : k==="work" ? workLabel : k==="family" ? familyLabel : k==="study" ? focusStudyLabel(s) : FOCUS_LABELS[k];
  const on = k=> ranked ? rank.includes(k) : key===k;
  const badge = k=> ranked && rank.includes(k) ? `<span class="focus-rank">${rank.indexOf(k)+1}</span>` : ``;
  const btn = k=>`<button class="focus-btn${on(k)?" on":""}" data-focus="${k}" ${ranked ? `aria-pressed="${on(k)}"` : `role="radio" aria-checked="${on(k)}"`} ${disabled?"disabled":""}>${badge(k)}${escapeHtml(labelOf(k))}</button>`;
  const keys = FOCUS_KEYS.filter(k=>focusKeyAvailable(s, k));
  const removeBtn = k=> ranked && rank.includes(k) && rank.length>1 ? `<button class="focus-btn" data-rank-remove="${k}">從排序拿掉</button>` : ``;
  const picker = (interestPickerOpen && cards.length && !disabled) ? `<div class="interest-pick" id="interest-pick">

        : `<button class="focus-btn${!workGig?" on":""}" data-work-pick="part">打工</button>
      ${gigCards.map(c=>`<button class="focus-btn${workGig && workGig.id===c.id?" on":""}" data-work-pick="${escapeHtml(c.id)}">${escapeHtml(SIDE_BUSINESS_LABELS[c.sideBusinessStatus])}：${escapeHtml(c.category)}</button>`).join("")}`}${removeBtn("work")}
    </div>` : ``;
  let hint;
  if(key==="interest" && !chosenCard) hint = "主要給興趣投入，下個場景可能在嘗試新的事物";
  else if(key==="work" && workGig) hint = "主要推進手上的訂單（也算一半興趣投入），下個場景可能在處理訂單的地方";
  else if(adult && key==="work" && adultWork) hint = adultWork.id==="part" ? FOCUS_HINTS.work : ADULT_FOCUS_HINTS[adultWork.id];
  else if(adult && key==="study") hint = ADULT_FOCUS_HINTS.study;
  else if(key==="family" && care) hint = `陪伴照顧，和${careTitle(care)}更親近`;
  else hint = FOCUS_HINTS[key];
  const rankNote = ranked ? `<div class="focus-hint">依序點選最多三個，排越前面越常發生；再點一次可以拿掉。</div>` : ``;

}

function taipeiStampText(ts){ return new Date((ts ?? Date.now()) + 8*3600*1000).toISOString().slice(0,16).replace("T"," ").replace(/-/g,"/"); }

function taipeiMDHM(ts){
  const d = new Date((ts ?? Date.now()) + 8*3600*1000), p2 = n=>String(n).padStart(2,"0");
  return `${d.getUTCMonth()+1}/${d.getUTCDate()} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`;
}
function apLogChangeText(n){ return n>0 ? "+"+n : (n<0 ? "-"+Math.abs(n) : "0"); } // 10.11.6：「+5」「-1」「0」
function apLogResultText(e){ return e.ok===false ? "失敗" : "成功"; } // 舊存檔沒有結果欄＝成功
function apLogRowsHTML(list){
  return list.map(e=>`<div class="ic-sub" style="display:flex;justify-content:space-between;gap:8px;margin:3px 0;"><span>${escapeHtml(taipeiMDHM(e.t))}　${escapeHtml(apLogTypeName(e.type))}</span><span><b>${apLogChangeText(e.n)}</b>　${apLogResultText(e)}</span></div>`).join("");

function otherLivesForWallet(){
  const out = [];
  const activeRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
  for(let i=0;i<3;i++){
    if(activeRaw!==null && Number(activeRaw)===i) continue;
    try{
      const raw = localStorage.getItem(STORAGE_KEY+":"+i);
      if(!raw) continue;
      const o = JSON.parse(raw);
      if(!o || o.phase!=="playing" || !o.ap) continue;
      out.push({ name:o.name||"無名氏", total:(o.ap.daily||0)+(o.ap.gift||0)+(o.ap.purchased||0), shared: !!(acct && o.acct && o.acct.aid===acct.aid) });

function giftClaimedFor(s){
  if(s && (s.giftGranted || (s.apLog||[]).some(e=>apLogTypeName(e.type)==="啟程禮"))) return true;

    const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);

  }catch(e){}

function walletReportText(s){
  const log = (s.apLog||[]).slice(-5).reverse();
  const lastRefill = (s.apLog||[]).slice().reverse().find(e=>e.type==="每日補點");
  const lines = [
    "【點數明細】",
    `複製時間：${taipeiMDHM()}（台灣時間）`,
    `目前餘額：${totalAP(s)} 點`,
    `信箱：${accountEmailBound() ? "已綁" : "未綁"}`,
    `啟程禮：${acct ? `已領 ${acct.gifts.claimed}／${acct.gifts.max} 份` : (giftClaimedFor(s) ? "已領" : "未領")}` // 10.11.4：已綁信箱寫「已領 N／2 份」，未綁只寫已領／未領
  ];
  if(lastRefill) lines.push(`最近補點：${taipeiMDHM(lastRefill.t)}，+${lastRefill.n} 點`);
  lines.push("", "【最近 5 筆】");

}

        <h4>興趣和副業怎麼選</h4>
        <p>輸入框上方的按鈕是這段時間主要花在哪裡。選「興趣」是專心練那項興趣，投入全部算進去，不會推進訂單；選「工作」再挑「副業」是趕手上的單，訂單會往前一格，同一項興趣也會跟著練到一半的份量。想練功選興趣，想賺錢或怕逾期選工作。你寫的內容會優先寫進故事，成長的部分還是看你選的重心。</p>

        <p>畫面最上面的大標題是「年級・學期・月份」，例如「高一・上學期・10月」。下面那行小字是這個學期階段走到哪了，例如「期中準備期 5/6」。每一回合大約是一到兩週，故事裡的時間、節日和季節會跟著月份走。</p>
        <h4>地點</h4>
        <p>去過的地方都會記在「地點」裡：那個地方有什麼特別、誰常在那裡、上次是哪個月去的。按「去這裡」只會幫你在輸入框寫好「去○○，」，可以再補上你想做什麼，送出才算一回合、才會花 1 點行動點。關掉的店會變灰、排在最後，不會消失。</p>

        <h4>曖昧中與在一起</h4>

        <h4>人物</h4>
        <p>衝突背後，通常有一件沒說出口的在意。</p>
      </div>

function rollNumber(el, from, to, duration, delay){
  if(!duration){ el.textContent = to.toLocaleString(); return; }
  el.textContent = from.toLocaleString();
  setTimeout(()=>{
    const start = performance.now();
    const step = now=>{
      const p = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = Math.round(from + (to-from)*eased).toLocaleString();
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, delay||0);
}

}

const TURN_NUMERIC_OBJECT_DEFAULTS = {
  stat_deltas:["health","network","expression"],
  attachment_shift:["anxiety","avoidance"],
  conscientiousness_shift:["selfDiscipline","prudence","achievement","responsibility","teamSolo"]
};
function fillOmittedTurnFields(r){
  Object.keys(TURN_FIELD_DEFAULTS).forEach(k=>{
    const d = TURN_FIELD_DEFAULTS[k];
    if(r[k]===undefined || r[k]===null) r[k] = Array.isArray(d) ? [] : d;
    else if(Array.isArray(d) && !Array.isArray(r[k])) r[k] = [];
  });
  Object.keys(TURN_NUMERIC_OBJECT_DEFAULTS).forEach(k=>{
    const o = (r[k] && typeof r[k]==="object" && !Array.isArray(r[k])) ? r[k] : {};
    TURN_NUMERIC_OBJECT_DEFAULTS[k].forEach(f=>{ if(typeof o[f]!=="number" || !isFinite(o[f])) o[f] = 0; });
    r[k] = o;
  });
  return r;
}
function normalizeTurnResultText(r){
  if(!r || typeof r!=="object") return r;
  fillOmittedTurnFields(r);
  r.action_result = narrativeParagraphs(r.action_result).join("\n\n");
  r.narrative = narrativeParagraphs(r.narrative).join("\n\n");
  return r;
}
function renderPlainParagraphs(text, linkNames){
  // 1.2.8.4.2防呆：舊日記或沒被處理到的{{名字|台詞}}標記，一律當成「台詞」顯示
  return narrativeParagraphs(String(text==null ? "" : text).replace(/\{\{[^|{}]+\|([^{}]*)\}\}/g, "「$1」"))
    .map(p=>`<p>${linkNpcNames(escapeHtml(p), linkNames)}</p>`).join("");
}
// 四、4.1.1【定案】查看入口含「劇情中提及的角色名」（2026-09-27補上）：把已跳脫的段落裡出現的角色名包成可點的span，
// 點擊由document層的事件委派叫出renderNpcDetailModal()。只在遊戲畫面的日記裡啟用(人生之書/封存回顧不加)
function linkNpcNames(escapedText, enabled){
  if(!enabled || !state || !state.characters) return escapedText;
  const names = state.characters.map(c=>c.name).filter(n=>n && n.length>=2).sort((a,b)=>b.length-a.length);
  if(!names.length) return escapedText;
  const re = new RegExp(names.map(n=>escapeHtml(n).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"), "g");
  return escapedText.replace(re, m=>`<span class="npc-link" data-npc="${m}">${m}</span>`);
}

function renderParagraphs(text, linkNames){
  return cleanNarrativeText(text).split(/(〔文件[:：][^〕]*〕[\s\S]*?〔\/文件〕)/).map(part=>{
    const m = part.match(/^〔文件[:：]([^〕]*)〕([\s\S]*?)〔\/文件〕$/);
    if(!m) return renderPlainParagraphs(part, linkNames);
    return `<div class="doc-box"><div class="doc-title">${escapeHtml(m[1].trim())}</div>${renderPlainParagraphs(m[2], linkNames)}</div>`;
  }).join("");
}

// 交期月份＝依目前日期＋剩下回合數×最近一回合的平均天數估算(訂單只記回合數，沒有真實日期)
// 第「ahead」個未來回合(1＝下一回合)的日期範圍中點所在月份，依2.7已排好的學年日期(學生時期)或年度回合預算(出社會後)換算；
// 超出已排好的日期(下學年以後)或休學中、開場時回傳null，呼叫端再用估算
function futureTurnMonth(s, ahead){
  const ts = s.timeState, cal = ts && ts.cal;
  if(!cal || ts.prologue || ahead<1 || s.leaveStatus==="onLeave") return null;
  let a, b;
  if(isStudentCalendarMode(s) && cal.sched){
    let idx = ts.segmentIndex % YEAR_SEGMENTS.length, t = ts.turnsInSegment||0;
    for(let k=1;k<=ahead;k++){
      if(t >= YEAR_SEGMENTS[idx].budget){ idx++; t = 0; }
      if(idx >= YEAR_SEGMENTS.length) return null;
      if(k===ahead){ a = schoolAnchor(cal, idx, t); b = schoolAnchor(cal, idx, t+1)-1; }
      t++;
    }
  } else if(cal.careerYearBase!=null){
    const budget = roundsPerYearForAge(s.age);
    const t = (ts.adultTurnsInYear||0) + ahead - 1;
    if(t >= budget) return null;
    a = careerAnchor(cal, t, budget); b = careerAnchor(cal, t+1, budget)-1;
  } else return null;
  if(!(a>0) || b<a) return null;
  return calAbsToDate(Math.floor((a+b)/2)).m + "月";
}
function orderDueMonth(s, o){
  const cal = s.timeState && s.timeState.cal;
  if(!cal || cal.lastRoundEnd==null) return "";
  const real = futureTurnMonth(s, o.due - s.turnCount);
  if(real) return real;
  const span = Math.max(1, cal.lastRoundEnd - (cal.lastWinStart!=null ? cal.lastWinStart : cal.lastRoundEnd) + 1); // 排好的日期用完了，才用「最近一回合的天數」估算
  return calAbsToDate(cal.lastRoundEnd + Math.max(0, o.due - s.turnCount) * span).m + "月";
}

const MEMOIR_HALF_KEYS = ["上學期","下學期","寒假","暑假","休學中"];

function memoirGroupOf(e){
  const label = String(e.timeLabel||"");
  const parts = label.split("・").map(x=>x.replace(/（[^）]*）/g,""));
  const hi = parts.findIndex(p=>MEMOIR_HALF_KEYS.includes(p));
  if(hi>=0) return { key:"s:"+parts.slice(0,hi+1).join("・"), name:parts.slice(0,hi+1).join("・"), sub:parts.slice(hi+1).join("・"), age:e.age };
  if(/^(高[一二三]|大[一二三四五])/.test(parts[0]||"")) return { key:"s:"+parts[0], name:parts[0], sub:parts.slice(1).join("・"), age:e.age };
  return { key:"a:"+e.age, name:stageLabel(e.age), sub: label && !/^\d+歲$/.test(label) ? label.replace(/^\d+歲・/, "") : "", age:e.age };
}
function memoirCashOf(e){
  if(typeof e.cash==="number") return e.cash;
  if(e.settlement && typeof e.settlement.balanceAfter==="number") return e.settlement.balanceAfter;

function acctErrText(data, status, network){
  if(network) return ACCT_ERR_TEXT.network;

  if(e==="wrong_code") return `驗證碼不對，請再確認一次。（還可以試 ${data.tries_left} 次）`;
  return ACCT_ERR_TEXT[e] || "這次沒有成功，請稍後再試一次。";
}
let acctFlow = null; // {mode:"bind"|"login"|"change", step:"intro"|"email"|"code", email, error, cooldownUntil, busy, timer, offerLogin}

}

async function acctFlowSend(isResend){
  const f = acctFlow; if(!f || f.busy) return;
  const emailEl = document.getElementById("acct-email");
  if(emailEl) f.email = emailEl.value;
  const email = String(f.email||"").trim();
  if(!email){ f.error = ACCT_ERR_TEXT.invalid_email; renderAccountFlow(); return; }
  f.busy = true; f.error = ""; f.offerLogin = false;
  const r = await acctFetch("account/send-code", { email });
  f.busy = false;
  if(acctFlow!==f) return;
  if(r.ok){ f.step = "code"; f.cooldownUntil = Date.now() + ((r.data.next_send_in||60)*1000); renderAccountFlow(); return; }
  if(r.data && r.data.error==="too_soon"){ // 60秒內剛寄過：前一組還有效，直接進輸入驗證碼那一步，重寄鈕顯示剩餘秒數
    f.step = "code"; f.cooldownUntil = Date.now() + ((r.data.retry_after||60)*1000); renderAccountFlow(); return;
  }
  f.error = acctErrText(r.data, r.status, r.network);
  renderAccountFlow();
}
// 這台裝置上還沒寫完、還不是這個帳號的人生：目前這段排第一，其餘照格子順序(帳號最多收2段)。點數只帶「這段人生自己」的
function collectDeviceLives(){
  try{ if(state && state.phase==="playing") saveLocalOnly(); }catch(e){}
  const activeRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
  const activeIdx = activeRaw!==null ? Number(activeRaw) : -1;
  const list = [];
  for(let i=0;i<MAX_LIFE_SLOTS;i++){
    let st = null;
    if(i===activeIdx && state && state.phase==="playing") st = state;
    else { try{ st = JSON.parse(localStorage.getItem(STORAGE_KEY+":"+i) || "null"); }catch(e){} }
    if(!st || st.phase!=="playing") continue;
    if(acct && st.acct && st.acct.aid===acct.aid) continue; // 已經是這個帳號的人生
    const ap = st.ap || {};
    list.push({ slot:i, st, lid: newAcctLid(), pool:{ daily:ap.daily||0, gift:ap.gift||0, purchased:ap.purchased||0 } });
  }
  list.sort((a,b)=>((b.slot===activeIdx)-(a.slot===activeIdx)) || (a.slot-b.slot));
  return list;
}
// 伺服器收下的人生：存檔記上帳號代號與lid、本機點數池歸零(點數已經併進帳號錢包，不能再留一份在本機)；超過2段的不動，留在原本的復原金鑰上
function acctApplyAttach(list, result){
  const accepted = new Set(((result && result.accepted)||[]).map(x=>x.lid));
  const applied = { accepted:[], overflow:[] };
  const zero = ()=>({ daily:0, gift:0, purchased:0, lastRefillDate: taipeiDateString() });
  list.forEach(it=>{
    if(!accepted.has(it.lid)){ applied.overflow.push(it); return; }
    it.st.acct = { aid: acct.aid, lid: it.lid };
    it.st.ap = zero();
    if(it.st!==state){ try{ localStorage.setItem(STORAGE_KEY+":"+it.slot, JSON.stringify(it.st)); }catch(e){} }
    applied.accepted.push(it);
  });
  if(state && state.acct){ try{ saveLocalOnly(); }catch(e){} }
  return applied;
}
async function acctFlowVerify(){
  const f = acctFlow; if(!f || f.busy) return;
  const code = String((document.getElementById("acct-code")||{}).value||"").replace(/\s+/g,"");
  if(!/^\d{6}$/.test(code)){ f.error = "請輸入 6 位數的驗證碼。"; renderAccountFlow(); return; }
  f.busy = true; f.error = "";
  const lives = (f.mode==="change" || f.mode==="waitlist") ? [] : collectDeviceLives();
  const liveBody = lives.map(it=>({ lid:it.lid, pool:it.pool }));
  let r;
  if(f.mode==="bind"){
    let key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
    if(!key){ key = generateRecoveryKey(); try{ localStorage.setItem(RECOVERY_KEY_STORAGE_NAME, key); }catch(e){} }
    r = await acctFetch("account/bind", { email:f.email, code, key, lives:liveBody });
  } else if(f.mode==="waitlist"){
    let key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
    if(!key){ key = generateRecoveryKey(); try{ localStorage.setItem(RECOVERY_KEY_STORAGE_NAME, key); }catch(e){} }
    r = await acctFetch("waitlist/join", { email:f.email, code, key });
  } else if(f.mode==="login"){
    r = await acctFetch("account/login", { email:f.email, code, lives:liveBody });
  } else {
    r = await acctFetch("account/change-email", { email:f.email, code });
  }
  f.busy = false;
  if(acctFlow!==f) return;
  if(!r.ok){
    f.error = acctErrText(r.data, r.status, r.network);
    const e = r.data && r.data.error;
    if(e==="email_exists" && (f.mode==="bind" || f.mode==="waitlist")) f.offerLogin = true; // 綁到已有帳號的信箱：拒絕，並提供改用登入
    if(e==="not_full" && f.mode==="waitlist"){ closeAccountFlow(); showWriterToast("撰稿人提醒你：今天還有名額，可以直接開始。"); return; }
    if(["code_locked","code_expired","no_code"].includes(e)) f.cooldownUntil = Math.min(f.cooldownUntil, Date.now());
    renderAccountFlow(); return;
  }
  if(f.mode==="change"){
    acctSetAccount(r.data.account); closeAccountFlow();
    showWriterToast("撰稿人提醒你：信箱已經換綁好了，之後請用新的信箱登入。");
    return;
  }
  // 綁定／登入成功：記下登入狀態、把伺服器收下的人生記上帳號
  try{ localStorage.setItem(ACCT_TOKEN_KEY, r.data.token); }catch(e){}
  acctSetAccount(r.data.account);
  if(f.mode==="waitlist"){ // 十、10.15.4：候補成功(第11則)，回到首頁
    acctRefreshAskedDate = taipeiDateString();
    closeAccountFlow();
    showWaitlistJoinedModal(r.data.result && r.data.result.position);
    if(!state || state.phase!=="playing") state = { phase:"home" };
    render();
    return;
  }
  if(f.mode==="login" && !localStorage.getItem(RECOVERY_KEY_STORAGE_NAME)) try{ localStorage.setItem(RECOVERY_KEY_STORAGE_NAME, acct.recovery_key); }catch(e){} // 全新裝置：沿用帳號的金鑰
  acctRefreshAskedDate = taipeiDateString();
  const applied = acctApplyAttach(lives, r.data.result);
  acctApplyEvents(r.data.events);
  await acctFlushPendingRemovals(); // 沒登入時收掉的帳號人生，這時通知伺服器空出格子
  closeAccountFlow();
  const overflow = applied.overflow.length>0;
  if(f.mode==="bind"){
    renderBindResultModal(r.data.result && r.data.result.gift && r.data.result.gift.status==="queued" ? "gift_full" : "normal", overflow);
  } else if(applied.accepted.length){
    renderBindResultModal("merged", overflow);
  } else if(overflow){
    renderBindResultModal(null, true);
  } else if(acct && acct.wl && ["waiting","allocated","notified","send_failed","expired"].includes(acct.wl.status) && !(acct.lives && acct.lives.length)){
    entryHandleWaitlist(); // 十、10.15：候補玩家登入後依狀態顯示第13／12則或排隊中提示
  } else {
    showWriterToast("撰稿人提醒你：已經用信箱登入了。");
  }
  if(state && state.phase==="playing") render();
  else if(state && state.phase==="home") render();
  acctCloudSaveAccepted(applied.accepted); // 剛收進帳號的人生順手存一份到雲端(換裝置登入才拿得回來)
}
