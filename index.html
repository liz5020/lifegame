// 九、9.8.1（2026-09-22修正）：延畢的時間延長改由「該學期重跑」自然產生，yearInStage正常情況下不會超過base，
// 不再用「延畢第N年」這種獨立序數，改為在年級後面附註已延畢年數（若有）
function collegeYearLabel(s){
  const base = s.collegeYearsRequired || 4;
  const ordinals = ["大一","大二","大三","大四","大五"];
  const yearInStage = clamp(s.timeState.yearInStage, 1, base);
  const label = ordinals[clamp(yearInStage,1,ordinals.length)-1];
  const delay = clamp(s.collegeDelayYearsUsed||0, 0, COLLEGE_DELAY_CAP);
  return delay>0 ? `${label}・已延畢${delay}年` : label;
}
// 九、9.8.1（2026-09-22新增）：休學選項可用條件——delay_years尚未達上限，且「加上這次休學半年後的預計畢業年齡」
// 不得超過該科系畢業年齡上限（取代原本「delay_years封頂兩年已自然限制最多4次」的舊定案，該定案沒考慮到轉系後
// 起始年齡已提高的情境）
function isAnotherLeaveFeasible(s){
  const usedDelay = clamp(s.collegeDelayYearsUsed||0, 0, COLLEGE_DELAY_CAP);
  if(usedDelay >= COLLEGE_DELAY_CAP) return false;
  const base = s.collegeYearsRequired || 4;
  const cap = COLLEGE_GRAD_AGE_CAP[base] || COLLEGE_GRAD_AGE_CAP[4];
  const projectedGradAge = computeExpectedGraduationAge(s) + 0.5;
  return projectedGradAge <= cap;
}

// ========== 九、大學科系系統（9/16新增）==========
// 9.2 科系分類（8大類）：isFiveYearEligible=true代表「醫藥/護理類」底下可能出現醫學/牙醫/獸醫這種5年制特例，
// 具體是不是5年制由玩家在選科系/轉系時的次選擇決定（見9.4：只有醫學系/牙醫學系/獸醫學系三個特定科系是5年，
// 同類別下的藥學/護理/物理治療等其餘科系仍是4年），不是整個「醫藥/護理類」類別都5年制
const MAJOR_CATEGORIES = [
  { key:"理工資訊", label:"理工/資訊類", examples:"資訊工程、資訊管理、電機工程、機械工程、土木工程", isFiveYearEligible:false },
  { key:"商管財經", label:"商管/財經類", examples:"企業管理、財務金融、會計、行銷、國際貿易", isFiveYearEligible:false },
  { key:"人文語言傳播", label:"人文/語言/傳播類", examples:"中文、外文、歷史、大眾傳播", isFiveYearEligible:false },
  { key:"醫藥護理", label:"醫藥/護理類", examples:"醫學、藥學、護理、物理治療", isFiveYearEligible:true },
  { key:"教育", label:"教育類", examples:"教育學系、師範體系各科、幼教、特教", isFiveYearEligible:false },
  { key:"藝術設計表演", label:"藝術/設計/表演類", examples:"美術、音樂、舞蹈、戲劇影視、視覺傳達設計", isFiveYearEligible:false },
  { key:"法律政治", label:"法律/政治類", examples:"法律學系、政治學系、公共行政", isFiveYearEligible:false },
  { key:"服務社工餐旅", label:"服務/社工/餐旅類", examples:"社會工作學系、餐旅管理、觀光、運動休閒", isFiveYearEligible:false }
];
function findMajorCategory(key){ return MAJOR_CATEGORIES.find(m=>m.key===key) || null; }

// 9.3 下游伏筆權重表（高/中/低相對排序，9/16 ChatGPT開發審閱建議改用「共同基準機率×類別倍率」，
// 具體絕對機率仍是【待補充,測試組】，這裡的BASE/MULTIPLIER都是實作階段自訂的【測試參數】，非正式定案數字）
const FORESHADOW_LINES = ["創業線","自由接案","海外線","演藝圈線","接手家業"];
const FORESHADOW_BASE_RATE = 0.08; // 【定案,9/16補充,標記測試參數】封測用第一組數字：共同基準機率8%（乘上類別倍率後才是實際機率）
const FORESHADOW_WEIGHT_MULTIPLIER = { 高:2.0, 中:1.0, 低:0.4 }; // 【定案,9/16補充,標記測試參數】
const MAJOR_FORESHADOW_WEIGHT_TABLE = {
  "理工資訊":       { 創業線:"中", 自由接案:"高", 海外線:"中", 演藝圈線:"低", 接手家業:"低" },
  "商管財經":       { 創業線:"高", 自由接案:"中", 海外線:"中", 演藝圈線:"低", 接手家業:"中" },
  "人文語言傳播":   { 創業線:"低", 自由接案:"高", 海外線:"高", 演藝圈線:"中", 接手家業:"低" },
  "醫藥護理":       { 創業線:"低", 自由接案:"低", 海外線:"中", 演藝圈線:"低", 接手家業:"低" },
  "教育":           { 創業線:"低", 自由接案:"中", 海外線:"低", 演藝圈線:"低", 接手家業:"低" },
  "藝術設計表演":   { 創業線:"中", 自由接案:"高", 海外線:"中", 演藝圈線:"高", 接手家業:"低" },
  "法律政治":       { 創業線:"低", 自由接案:"低", 海外線:"中", 演藝圈線:"低", 接手家業:"低" },
  "服務社工餐旅":   { 創業線:"中", 自由接案:"中", 海外線:"低", 演藝圈線:"低", 接手家業:"高" }
};
// 任何科系都能觸發任何一條伏筆線（9.3【定案】不做獨佔鎖死），這裡只回傳「這回合這條線的觸發機率」讓呼叫端自行擲骰
function foreshadowTriggerProbability(majorGroup, line){
  const weight = (MAJOR_FORESHADOW_WEIGHT_TABLE[majorGroup]||{})[line] || "低";
  return FORESHADOW_BASE_RATE * (FORESHADOW_WEIGHT_MULTIPLIER[weight]||1);
}

// 9.8 學生主狀態欄位規格：判斷是否已出社會一律用studentStatus，不是單純看年齡（9.8【定案】）
function assignStudentMajor(s, majorKey, isFiveYear){
  const cat = findMajorCategory(majorKey);
  if(!cat) return;
  s.studentMajorGroup = majorKey;
  s.studentIsFiveYearTrack = !!(cat.isFiveYearEligible && isFiveYear);
  s.collegeYearsRequired = s.studentIsFiveYearTrack ? 5 : 4;
}
// 九、9.8.1（2026-09-22修正）：改用基礎修業年限(不含delay)＋尚未實現的halfYearCarry半年——
// 已實現的延畢（每滿兩次休學復學）已經直接反映在s.age本身，若再加整個collegeDelayYearsUsed會把同一段延畢重複計算兩次
function computeExpectedGraduationAge(s){
  const base = s.collegeYearsRequired || 4;
  const remainingYears = base - (s.timeState?.yearInStage||1) + 1;
  return s.age + Math.max(0, remainingYears) + (s.halfYearCarry||0)*0.5;
}
// 9.5.1 轉系候選觸發：連續兩次段考成績低於預期區間【測試參數，9.7測試項目2待校準】
// 「預期區間」用跟2.4考試成績算法同精神、但採client端可重算的proxy（知識值+讀書次數×3），
// 不依賴AI自由回報的敘事分數，確保這條線完全不受AI輸出內容影響（9.9 AI/程式責任邊界的要求）
const TRANSFER_EXAM_EXPECTATION_THRESHOLD = 55; // 【測試參數】低於此proxy分數視為「低於預期」
const TRANSFER_EXAM_STREAK_TRIGGER = 2; // 【定案】連續兩次
const TRANSFER_COOLDOWN_TURNS = 8; // 【測試參數,9.5.1新增待補】轉系候選冷卻回合數
function updateTransferCandidateOnExam(s, studyCountAtExam){
  const proxy = clamp(Math.round(s.stats.knowledge + (studyCountAtExam||0)*3), 0, 100);
  const belowExpectation = proxy < TRANSFER_EXAM_EXPECTATION_THRESHOLD;
  s.examBelowExpectationStreak = belowExpectation ? (s.examBelowExpectationStreak||0)+1 : 0;
  s.lastExamPerformanceLog = { expected: TRANSFER_EXAM_EXPECTATION_THRESHOLD, actual: proxy, streak: s.examBelowExpectationStreak };
  if(s.studentStatus==="enrolled" && !s.transferCooldown && s.examBelowExpectationStreak>=TRANSFER_EXAM_STREAK_TRIGGER){
    s.pendingTransferOffer = true;
  }
}

// 十一、11.4明牌檢定機制（9/19新增，首版白名單僅「期末考成績公布」一項）：
// 定案文字只規定呈現格式要有「骰值＋屬性加成換算依據＋門檻對比＋成敗結果」，沒有給具體骰值範圍/及格門檻數字，
// 以下數字皆為實作階段選定的【測試參數，待驗證】——60分及格門檻沿用台灣常見及格線慣例、骰值範圍呼應
// system prompt既有「hint±10分左右合理，保留少量機率更意外」的敘事指示，改寫成client端可明牌呈現的擲骰版本
const EXAM_CHECK_PASS_THRESHOLD = 60; // 【測試參數，待驗證】
function rollFinalExamCheck(wisdom, studyCount){
  const base = clamp(Math.round(wisdom + (studyCount||0)*3), 0, 100); // 沿用既有2.4.1大方向層公式
  const roll = rnd(1,100); // 骰值，明牌呈現給玩家
  let swing;
  if(roll<=90){
    swing = rnd(-10,10); // 一般範圍
  } else {
    // 保留少量意外機率，正負對半，不偏向負面（呼應六、6.1正向配額精神）
    swing = (roll%2===0) ? rnd(11,25) : rnd(-25,-11);
  }
  const finalScore = clamp(base+swing, 0, 100);
  return { wisdom:Math.round(wisdom), studyCount:(studyCount||0), base, roll, swing, finalScore, passThreshold: EXAM_CHECK_PASS_THRESHOLD, passed: finalScore>=EXAM_CHECK_PASS_THRESHOLD };
}
// 9.5.2 雙主修候選觸發：才識數值達門檻【測試參數，9.7測試項目3待校準】，或特定科系伏筆權重被觸發
const DUAL_MAJOR_KNOWLEDGE_THRESHOLD = 70; // 【測試參數】
function checkDualMajorCandidate(s){
  if(s.studentStatus!=="enrolled" || s.dualMajorStatus) return; // 已經是candidate/active/abandoned/completed就不重複判定
  if(s.stats.knowledge>=DUAL_MAJOR_KNOWLEDGE_THRESHOLD){
    s.dualMajorStatus = "candidate"; s.pendingDualMajorOffer = true; return;
  }
  // 「特定科系伏筆權重被觸發」：用商管財經線的創業權重當作雙主修傾向的簡化代表（實作階段自訂映射，非文件明文規定）
  if(s.studentMajorGroup && Math.random() < foreshadowTriggerProbability(s.studentMajorGroup, "創業線")){
    s.dualMajorStatus = "candidate"; s.pendingDualMajorOffer = true;
  }
}
// 9.5.2（9/16補充）雙主修中途放棄候選：dual_major_status=active期間，自律或財務健康度連續3回合低於40分成立候選，冷卻4回合
const DUAL_MAJOR_ABANDON_STRESS_THRESHOLD = 40; // 【定案,9/16補充】自律或財務健康度低於此分視為壓力訊號（呼應3.7.3的50分中性基準，取中性偏下）
const DUAL_MAJOR_ABANDON_STREAK_TRIGGER = 3; // 【定案,9/16補充】連續3回合
const DUAL_MAJOR_ABANDON_COOLDOWN_TURNS = 4; // 【定案,9/16補充】冷卻4回合，避免連續跳出同一提案
function checkDualMajorAbandonCandidate(s){
  if(s.dualMajorStatus!=="active" || s.pendingDualMajorAbandonOffer) return;
  if((s.dualMajorAbandonCooldown||0)>0) return;
  const financialHealth = computeFinancialHealthForState(s); // 9/16修正：雙主修進行中一定是學生，改用家庭財務數字
  const underStress = s.conscientiousness.selfDiscipline<DUAL_MAJOR_ABANDON_STRESS_THRESHOLD || financialHealth<DUAL_MAJOR_ABANDON_STRESS_THRESHOLD;
  s.dualMajorAbandonStreak = underStress ? (s.dualMajorAbandonStreak||0)+1 : 0;
  if(s.dualMajorAbandonStreak>=DUAL_MAJOR_ABANDON_STREAK_TRIGGER){
    s.pendingDualMajorAbandonOffer = true;
  }
}
// 9.5.3 休學/肄業候選觸發：持續低值（連續N回合），不是單次瞬間跌破（9/16 ChatGPT開發審閱補強）
// 健康面沿用既有s.lowHealthStreak（health<30才累加，早於本次開發就存在），財務面新增s.lowCashStreak（呼應3.4.10學生現金floor在0的既有保護機制）
const WITHDRAWAL_STREAK_TRIGGER = 4; // 【測試參數，9.7測試項目4待校準】
function checkWithdrawalCandidate(s){
  if(s.studentStatus!=="enrolled" || s.leaveStatus!=="normal" || s.pendingLeaveOffer) return;
  if((s.lowHealthStreak||0)>=WITHDRAWAL_STREAK_TRIGGER){ s.pendingLeaveOffer = "health"; return; }
  if((s.lowCashStreak||0)>=WITHDRAWAL_STREAK_TRIGGER){ s.pendingLeaveOffer = "financial"; }
}
// 9.8 leave_status復學（9/16補充,取代原本「不真的暫停回合引擎」的簡化說明）：休學期間改用獨立的「休學學期」段落，
// 回合數為7回合（測試參數，9.8.1定案取代原本「比照2.3假期段落份量6-8回合」的寫法），不套用SEMESTER_PHASES/YEAR_SEGMENTS
// 正常學期結構（見advanceStructuredTime的onLeave分支）；復學時該學期視為未完成，segmentIndex重置回休學當下那個學期
// （上/下學期）的開頭重新跑一次，不從中斷點續接
const LEAVE_OF_ABSENCE_TURNS = 7; // 【測試參數】
// 一、1.2.9.1（2026-09-23修正,同monthsCrossed校準bug）：休學一學期對應delay_years+=0.5(半年=6個月)，
// 平均分攤到LEAVE_OF_ABSENCE_TURNS回合，取代原本advanceStructuredTime onLeave分支寫死monthsCrossed:1的做法(7回合×1=7個月，跟6個月對不上)
const LEAVE_MONTHS_PER_ROUND = 6 / LEAVE_OF_ABSENCE_TURNS;
// 每回合college狀態下都要跑的維護：冷卻倒數、財務floor連續低值streak、休學復學倒數、雙主修/休學候選檢查
function sweepUniversityState(s){
  if(s.timeState?.stageMode!=="college" || s.studentStatus!=="enrolled") return;
  if(s.transferCooldown>0) s.transferCooldown--;
  if(s.dualMajorAbandonCooldown>0) s.dualMajorAbandonCooldown--; // 9.5.2（9/16補充）雙主修中途放棄候選冷卻
  s.lowCashStreak = s.cash<=0 ? (s.lowCashStreak||0)+1 : 0;
  if(s.leaveStatus==="onLeave"){
    s.leaveResumeCountdown = (s.leaveResumeCountdown||LEAVE_OF_ABSENCE_TURNS)-1;
    if(s.leaveResumeCountdown<=0){
      // 9.5.3（9/16補充）復學：leave_status轉正常，segmentIndex重置回休學前那個學期的開頭（不是中斷點），
      // turnsInSegment/study_count_this_term一併歸零，program_year（yearInStage）維持不變（不前進）
      s.leaveStatus = "normal"; s.leaveResumeCountdown = 0;
      s.timeState.segmentIndex = s.leaveSemesterHalfIndex||0;
      s.timeState.turnsInSegment = 0;
      s.studyCountThisTerm = 0;
      s.interestCountThisTerm = 0;
      // 9.8.1（2026-09-22新增）：每完成一次休學復學記半年，累積到2次（滿一年）時年齡+1並歸零
      s.halfYearCarry = (s.halfYearCarry||0) + 1;
      if(s.halfYearCarry>=2){
        s.halfYearCarry = 0;
        s.age += 1;
        ageChildren(s, 1);
      }
      s.universityEventLog = { type:"leave_resumed" };
    }
    return; // 休學期間不再檢查新的雙主修/休學候選
  }
  checkDualMajorCandidate(s);
  checkDualMajorAbandonCandidate(s); // 9.5.2（9/16補充）雙主修中途放棄候選
  checkWithdrawalCandidate(s);
}
// 9.8.1（2026-09-22修正）：halfYearCarry為1時代表行事曆已錯開半年，寒假/暑假標籤對調
function segmentLabel(seg, isFirstHalf, halfYearCarry){
  if(seg.key==="假期"){
    const isWinter = halfYearCarry ? !isFirstHalf : isFirstHalf;
    return isWinter ? "寒假" : "暑假";
  }
  return seg.half+"・"+seg.key;
}
function computeTimeLabel(s){
  // 二、2.2（2026-09-23新增）：開場段落，整局只會出現這一次
  if(s.timeState.prologue) return "高一開學前・暑假最後一天";
  const mode = s.timeState.stageMode;
  if(mode==="college" && s.leaveStatus==="onLeave"){
    return collegeYearLabel(s)+"・休學中"; // 9.5.3（9/16補充）：學期引擎凍結期間不顯示段落標籤，避免看起來仍在正常推進
  }
  if(mode==="highschool" || mode==="college"){
    const idx = s.timeState.segmentIndex % YEAR_SEGMENTS.length;
    const seg = YEAR_SEGMENTS[idx];
    const yr = mode==="highschool"
      ? ["高一","高二","高三"][clamp(s.timeState.yearInStage,1,3)-1]
      : collegeYearLabel(s);
    let label = yr+"・"+segmentLabel(seg, idx<SEMESTER_PHASES.length, s.halfYearCarry);
    if(mode==="college" && s.timeState.yearInStage>=(s.collegeYearsRequired||4) && idx>=SEMESTER_PHASES.length) label += "（畢業倒數）";
    return label;
  }
  if(mode==="career"){
    if(s.age<=29) return `入職第${s.age-21}年`; // 22歲入職算第1年
    return `${s.age}歲`; // 呼應一、1.1.2：30歲以後改用年齡本身當時間戳，不再細分上下半年
  }
  return `${s.age}歲`;
}
// 介面：現階段進度指示（9/16新增）——依目前所在模式，回傳「這個小段落」還剩多少回合的進度資訊，供UI畫進度條
// 三種模式各自的「一個段落」定義不同：學生時期是目前學期段落(開學初/準備期/考試/假期等)；休學中是休學倒數；出社會是本年度
function computeStageProgress(s){
  if(s.timeState.prologue) return { label:"開場", current:0, total:1 };
  const mode = s.timeState.stageMode;
  if(mode==="college" && s.leaveStatus==="onLeave"){
    const total = LEAVE_OF_ABSENCE_TURNS;
    const current = clamp(total - (s.leaveResumeCountdown ?? total), 0, total);
    return { label:"休學進度", current, total };
  }
  if(mode==="highschool" || mode==="college"){
    const idx = s.timeState.segmentIndex % YEAR_SEGMENTS.length;
    const seg = YEAR_SEGMENTS[idx];
    return { label:segmentLabel(seg, idx<SEMESTER_PHASES.length, s.halfYearCarry)+"進度", current:Math.min(s.timeState.turnsInSegment||0, seg.budget), total:seg.budget };
  }
  if(mode==="career"){
    const total = roundsPerYearForAge(s.age);
    return { label:"本年度進度", current:Math.min(s.timeState.adultTurnsInYear||0, total), total };
  }
  return null;
}
// 二、2.2（2026-09-23修正）：原本的關鍵字太寬(直接/之後/過了/寒假/暑假/下學期單獨出現就觸發)，
// 一般行動描述（例如「放學之後直接去打工」）也會被誤判成跳過，導致隨機跳段可能越過考試；
// 收窄為只有明確跳過指令才算：跳過/快轉/直接跳到/一段時間後，或「跳到」+段落名稱
function detectTimeSkipIntent(actionText){
  const t = actionText||"";
  if(/跳過|快轉|直接跳到|一段時間後/.test(t)) return true;
  return /跳到/.test(t) && /寒假|暑假|下學期|期中|期末/.test(t);
}
// 只有「跳到」+段落名稱才有明確目標，其餘跳過指令(跳過/快轉/一段時間後)沒有指定目標
function resolveTimeSkipTarget(actionText){
  const t = actionText||"";
  if(!/跳到/.test(t)) return null;
  if(/下學期/.test(t)) return { key:"開學初", half:"下學期" };
  if(/寒假/.test(t)) return { key:"假期", half:"上學期" };
  if(/暑假/.test(t)) return { key:"假期", half:"下學期" };
  if(/期中/.test(t)) return { key:"期中考", half:null };
  if(/期末/.test(t)) return { key:"期末考", half:null };

// 從fromGlobalIdx往後找第一個符合target的段落，14段一輪必定會命中一次
function findNextSegmentGlobalIdx(fromGlobalIdx, target){
  for(let i=fromGlobalIdx+1; i<=fromGlobalIdx+YEAR_SEGMENTS.length; i++){
    const seg = YEAR_SEGMENTS[i%YEAR_SEGMENTS.length];
    if(seg.key===target.key && (!target.half || seg.half===target.half)) return i;
  }
  return fromGlobalIdx+1; // 防呆，理論上不會走到這裡
}

function advanceStructuredTime(actionText){
  const s = state;

    const currentSeg = YEAR_SEGMENTS[fromGlobalIdx % YEAR_SEGMENTS.length];
    // 二、2.2（2026-09-23修正,標籤慢一拍bug）：本回合的時間標籤與考試判定都以「這回合所在的段落」為準
    // (即fromLabel，換段是這回合結束後才生效、供下一回合用)，取代原本把換段後的toLabel當成本回合標籤的舊寫法
    const fromLabel = computeTimeLabel(s);
    // 考試段不能被跳過：人已經站在考試段上，這回合強制進行考試，不允許用跳過語意繞過去
    const skip = detectTimeSkipIntent(actionText) && !currentSeg.isExam;
    let examType = null;
    let monthsCrossed;

    if(skip){
      // 二、2.2（2026-09-23修正）：沒指定目標時只結束目前段落、進下一段第1回合，不再是原本的rnd(2,4)大跳段；
      // 有指定目標(跳到+寒假/暑假/下學期/期中/期末)時找下一次出現該段落的位置

      // 考試段不能被跳過：途中遇到考試段就停在考試段，下一回合才真的進行考試
      for(let i=fromGlobalIdx+1;i<toGlobalIdx;i++){

      }
      s.timeState.segmentIndex = toGlobalIdx % YEAR_SEGMENTS.length;
      s.timeState.turnsInSegment = 0;
      const yearsToAdd = Math.floor(toGlobalIdx/YEAR_SEGMENTS.length) - Math.floor(fromGlobalIdx/YEAR_SEGMENTS.length);
      monthsCrossed = +((toGlobalIdx-fromGlobalIdx)*STUDENT_MONTHS_PER_ROUND).toFixed(2);
      if(yearsToAdd>0) advanceStageYear(s, mode, yearsToAdd);
      toLabel = computeTimeLabel(s);
      currentLabel = toLabel; // 跳過本身就是這回合的行動，這回合的敘事就是「跳到了X」
    } else {

      s.timeState.turnsInSegment = (s.timeState.turnsInSegment||0)+1;
      monthsCrossed = +STUDENT_MONTHS_PER_ROUND.toFixed(2); // 修正版：12個月平均分攤到一整年54回合，見上方STUDENT_MONTHS_PER_ROUND說明
      if(s.timeState.turnsInSegment >= currentSeg.budget){

    // 2026-09-23：改用收窄後的detectTimeSkipIntent，避免「之後」「直接」等一般用語誤觸發整年跳過

      s.timeState.adultTurnsInYear = 0;
      yearsToAdd = 1;
      monthsCrossed = 12;
    } else {
      s.timeState.adultTurnsInYear = (s.timeState.adultTurnsInYear||0) + 1;
      monthsCrossed = +(12/budget).toFixed(2); // 每回合粗估幾個月，隨年齡區間的budget不同而不同
      if(s.timeState.adultTurnsInYear >= budget){

    if(yearsToAdd>0){

      rollAnnualCareerChecks(s); // 十二、12.2/12.7/12.8/12.10：裁員/創業年度營運/退休候選，同樣每滿一年才判定一次
      rollAnnualHealthChecks(s); // 十三、13.2/13.3/13.5：健康cap收斂/疾病判定/父母健康狀態機推進，同樣每滿一年才判定一次
    }
    const toLabel = computeTimeLabel(s);
    return { bigJump: skip, fromLabel, toLabel, currentLabel:toLabel, monthsCrossed, examTriggered:false, examType:null, deathForeshadowNow: deathCheck.justForeshadowed, deathTriggered: deathCheck.deathTriggered };
  }
  return { bigJump:false, fromLabel:null, toLabel:null, currentLabel:null, monthsCrossed:0, examTriggered:false, examType:null };
}

function applyRomanceSignal(s, c, signal){
  if(!signal || !c) return;
  c.romanceProgress = c.romanceProgress||0;
  c.romanceStableStreak = c.romanceStableStreak||0;
  c.romanceNegativeStreak = c.romanceNegativeStreak||0;
  const prevStatus = c.romanceStatus||null;
  if(signal==="positive"){
    c.romanceProgress += 1;
    c.romanceNegativeStreak = 0;
    if(!c.romanceStatus && c.romanceProgress>=ROMANCE_AMBIGUOUS_PROGRESS){
      c.romanceStatus = "ambiguous";
    } else if(c.romanceStatus==="ambiguous" && c.romanceProgress>=ROMANCE_DATING_PROGRESS){
      c.romanceStatus = "dating";
    } else if(c.romanceStatus==="dating"){
      c.romanceStableStreak += 1;
      if(c.romanceStableStreak>=ROMANCE_STABLE_STREAK){
        c.romanceStatus = "stable";
        c.stableSinceTurn = s.turnCount; // 七、7.6.1.1（2026-09-22新增）：記錄進入穩定交往的回合數，供同居觸發入口判斷「持續≥8回合」
      }
    }
  } else if(signal==="negative"){
    c.romanceProgress = Math.max(0, c.romanceProgress-1);
    c.romanceStableStreak = 0;
    if(c.romanceStatus==="dating" || c.romanceStatus==="stable"){
      c.romanceNegativeStreak += 1;
      if(c.romanceNegativeStreak>=ROMANCE_BREAKUP_STREAK){
        c.romanceStatus = "breakup";
        releaseCohabiting(c); // 七、7.6.1.1：穩定交往轉分手時解除同住標記
      }
    }
  }
  // 4.4定案：first_romance里程碑改由客戶端在第一次進入「交往中」時自動判定，取代AI自由回報（9/16使用者確認）
  if(prevStatus!=="dating" && c.romanceStatus==="dating" &&
     s.milestones.first_romance!=="completed" && s.milestones.first_romance!=="skipped"){
    s.milestones.first_romance = "completed";
  }
}

const COHABITATION_STABLE_TURNS = 8; // 【測試參數,待驗證】穩定交往持續回合數門檻
const COHABITATION_OFFER_COOLDOWN_TURNS = 12; // 【測試參數,待驗證】選「先維持各自住」後的冷卻回合數
function detectCohabitationIntent(actionText){
  return /同居|搬去一起住|一起租房|搬過去一起住|住在一起/.test(actionText||"");
}
// 被動觸發條件全部成立：與某NPC穩定交往≥8回合、已搬出原生家庭且住租屋/自有房、沒有配偶、沒有其他同居對象；
// 主動觸發：偵測到同居意圖關鍵字時，條件符合就立即排入彈窗，比照detectJobChangeIntent()既有模式
function checkCohabitationOffer(s, actionText){
  if(s.pendingCohabitationOffer || s.turnCount < (s.cohabitationOfferCooldownUntilTurn||0)) return;
  if(s.characters.some(c=>c.romanceStatus==="married")) return; // 已有配偶
  if(s.characters.some(c=>c.cohabiting && c.romanceStatus==="stable")) return; // 已有其他同居對象
  if(s.milestones.moved_out!=="completed") return; // 還住在原生家庭，不出現這個彈窗
  if(!s.housing || (s.housing.type!=="rent" && s.housing.type!=="own")) return;
  const partner = s.characters.find(c=>c.romanceStatus==="stable" && !c.cohabiting);
  if(!partner) return;
  const durationOk = (s.turnCount - (partner.stableSinceTurn ?? s.turnCount)) >= COHABITATION_STABLE_TURNS;
  if(detectCohabitationIntent(actionText) || durationOk){
    s.pendingCohabitationOffer = { partnerName: partner.name };
  }
}
// choice: "move_in"/"stay_separate"；此彈窗是玩家選擇，不涉及機率判定，不列入十一、11.4明牌檢定白名單
function resolveCohabitationOffer(s, partnerName, choice){
  if(choice==="move_in"){
    const partner = s.characters.find(c=>c.name===partnerName);
    if(partner) partner.cohabiting = true;
  } else {
    s.cohabitationOfferCooldownUntilTurn = s.turnCount + COHABITATION_OFFER_COOLDOWN_TURNS;
  }
  s.cohabitationEventLog = { choice, partnerName }; // 供下一回合payload的cohabitation_event_now告訴AI剛發生了什麼
}

- 【事件狀態機制，四、4.3，務必遵守】：payload的milestone_status會列出13個一次性里程碑事件目前的狀態(available未觸發/completed已完成/skipped已跳過/locked鎖定中)。狀態是completed或skipped的事件，**絕對不能再當作新鮮事重新觸發**（例如已經completed的「第一張信用卡」，不能再讓劇情出現「要不要辦第一張信用卡」這種選項；已經skipped的，可以在特定情境提起「你當初沒有選擇辦卡」，但不能重新當成一個懸而未決的選擇再問一次）。狀態是locked的，代表前置條件還沒到，不要主動帶出這個選項。以下4個里程碑由你自己判斷完成/跳過後透過milestone_updates回傳{id, status:"completed"或"skipped"}：first_credit_card(第一張信用卡)、first_part_time_job(第一次打工)、marriage_decision(結婚或明確決定不婚)、parent_retirement(父母退休，9/19新增)——只有這4個需要你回報，沒發生變化就不用回傳。first_startup(第一次創業，2026-09-20起改為系統自動判斷，不在這4個裡面)見下方唯一例外說明。- 【六、6.2性格破格里程碑，2026-09-20新增，務必遵守】：payload的breakthrough_event_now不是null時，代表系統剛判定玩家的依附風格或同儕位置光譜出現一次「打破底色」的重大偏移，這回合請寫一段比平常更長、更慢、更聚焦情緒的加重敘事，讓玩家清楚感覺到「我打破了原本的樣子」，不是日常流水帳；是否成立、多久成立一次由系統判斷，你不用也不能自己決定要不要觸發。
另外9個（畢業高中/畢業大學、第一次正職、買房、搬出家裡、第一次戀愛first_romance、第一次轉職first_job_change、生育或領養first_child、第一次創業first_startup）是系統自動判斷，你不用管，milestone_status裡看到它們變成completed是系統自己更新的（first_romance是9/16改版，玩家關係第一次進入「交往中」時系統自動判定；first_job_change/first_child是9/19新增，分別由求職結果非首次觸發、new_characters的is_child判斷；first_startup是2026-09-20新增，由business_status轉為經營中時判定，一律不由你回報），你只需要讀取參考，不用也不能透過milestone_updates去改它們——**唯一例外（2026-09-20新增）**：這9個裡的home_purchase(買房)、moved_out(搬出家裡)、first_child(生育或領養)、first_startup(第一次創業)四項，如果玩家的自由輸入明確表達「決定不買房」「決定不搬出去住」「決定不生小孩」「決定不創業」這類明確不做的意圖，你可以（也只能）透過milestone_updates回傳{id, status:"skipped"}，讓這個決定被系統記錄下來；但你不能對這四項回傳"completed"，達成與否永遠由系統自動判斷，不由你決定
- 【十三、健康衰退與老年階段，2026-09-20新增，務必遵守】：30歲以後每年有機率生病(急性/慢性/重大疾病三種)，60歲以後父母可能進入需要協助/失能/過世的狀態，全部由系統結構化判定並透過payload的illness_event_now／major_illness_event_now／parent_health_event_now／eldercare_event_now／parent_death_event_now告訴你剛發生了什麼，你只要自然帶進敘事即可，不要自己判斷玩家或NPC「該不該生病」「該不該過世」；疾病與長照題材允許沉重，但要保留旁白喘息空間(呼應六、6.3)與正向意外機率(呼應六、6.1)，不要連續好幾回合都是壞消息。60歲以後的敘事主題可以多圍繞健康/醫療、關係(老友/伴侶/子女角色反轉)、自我與意義回顧、事務交代這四個方向，年紀越大，事務性與回顧性的比例可以越高。
- 【十二、職涯系統，2026-09-20新增，務必遵守】：出社會後的求職/面試/升遷/轉職/裁員/創業/退休，全部由系統跳出獨立彈窗讓玩家做結構化決定，不經過你的choices欄位，也不再透過job_change欄位回報(該欄位已移除)。彈窗結果會透過payload的career_event_now告訴你這回合剛發生了什麼(例如剛錄取哪個類別的工作、剛升遷、剛被裁員、剛退休、剛接手家裡的事業)，你只要自然帶進敘事即可，職業類別、薪資數字、成功與否全部由系統計算，你不用也不能自己編造或回報具體薪資金額
- 【十二、12.11.1職涯伏筆，2026-09-22新增】：payload的career_foreshadow是一個陣列，列出目前正在「鋪陳中」的職涯伏筆線(創業線/自由接案/海外線/演藝圈線/接手家業其中之一或多個)，請在敘事中自然帶出相關的人事物鋪陳(例如提到某個朋友在國外發展、家裡生意缺人手、有人找你接案)，讓這件事之後真的成為候選時感覺有跡可循；不要替玩家宣告已經轉職、已經創業或已經決定接手，成不成立、什麼時候成立全部由系統判斷
- 【college_location 大學地點選擇】：如果玩家在劇情中實際做出「大學/技職要去哪裡念」的決定（本地／外縣市／出國），透過 college_location_choice 回傳其中一個值；如果這件事還沒發生或已經決定過，一律回傳 null（已決定過的地點會透過 payload 的 college_location 持續告訴你，不用重複詢問或重複設定）。地點會影響親子互動的密度質地：本地就讀的話，跟父母碰面頻率高但多是表面的日常擦身而過（深度對話需要特別情境才觸發，不要因為住在一起就自動假設關係更緊密）；外縣市或出國就讀的話，聯絡頻率低（大約一週一次），但每次聯絡在敘事份量上可以稍微重一點。
- 【房屋里程碑】：初入社會階段(23-29歲)，或大學選了外縣市/出國分支畢業後，適合自然帶出「租屋/買房/住家裡」的選項。玩家選定後透過 housing_choice 回傳 {type:"rent"/"own"/"parents", monthly_amount:數字}（租屋或房貸才需要monthly_amount，住家裡填0），系統會自動疊加進月支出；買房後如果財務惡化，可以在劇情裡提供「賣房/轉租」的逆向選項。沒有相關決定時 housing_choice 填 null。
  - 【買房頭期款門檻，務必檢查】：買房不是按一個選項就完成，需要現金足夠支付頭期款。payload的max_affordable_home_monthly_payment告訴你，以目前現金，最高能負擔多少月付房貸（背後公式：頭期款＝月付房貸×60，對應20年期、8成貸款成數的簡化假設）。你決定的monthly_amount不能超過這個數字，否則系統會直接擋下這次購屋、完全不生效。如果玩家想買的房子明顯超出負擔，請在敘事裡走向「看房後發現預算不夠、繼續存錢」「找更便宜的物件」這類分支，不要讓劇情寫成買房成功了，實際上系統會忽略這個housing_choice導致劇情跟數值對不上
- 【感情關係的收尾】：一段感情走到尾聲時，不用預設哪種收法更好，常見的是三種——分手（適合當作前面關係測試點失敗後的自然結果，不必是狗血事件）、畢業後漸行漸遠（沒有明確攤牌，只是聯絡越來越少，適合留白處理）、或關係持續帶入下一個人生階段（不用在這裡寫完結局，讓角色卡的關係史摘要繼續累積即可）。分手當下，可以依玩家的依附軸呈現不同反應：焦慮軸偏高的容易反覆回想、翻舊訊息；迴避軸偏高的容易把訊息封存、迅速恢復日常表面上的樣子。
- 【七、7.6伴侶關係維繫/婚姻危機/離婚，2026-09-20新增】：穩定交往以上的伴侶關係，久了系統會自己跳出關係投入節點、婚姻危機、離婚結算等彈窗，玩家在彈窗裡做的選擇會透過payload的relationship_investment_event_now／marriage_crisis_event_now／divorce_event_now告訴你，你只要自然帶進敘事即可，這些事件成不成立、財務怎麼分，全部由系統計算，不用也不能自己判斷或回報。
- 【七、7.6.1.1同居觸發入口，2026-09-22新增】：穩定交往一段時間、且已搬出原生家庭的玩家，系統會自己跳出「要不要一起住」彈窗，玩家的選擇會透過payload的cohabitation_event_now告訴你(choice為move_in或stay_separate)，你只要自然帶進敘事即可，不用也不能自己判斷玩家該不該同居；household_status變成「同居」後純供你敘事參考，共同生活開銷怎麼算全部由系統計算。
- 【七、7.3.5子女成長里程碑，2026-09-20新增】：子女到了特定年齡，系統會跳出一個獨立彈窗讓玩家直接選教養做法，不經過你的choices欄位；彈窗結果會透過payload的parenting_event_now告訴你這回合剛發生了什麼，你只要自然帶進敘事即可，教養風格的位移量與判斷全部由系統計算，你不用也不能自己推算或回報。
- 【三、3.4.11家庭財務合併，2026-09-20新增】：結婚後payload會多出household_status(單身/同居/已婚雙薪/已婚單薪/離婚後)與spouse_income(配偶月收入)，這兩個數字純供你敘事參考(例如可以提一句「兩人的收入加起來」)，實際的共同生活開銷分攤、配偶收入多寡、子女扶養費，全部由系統自動計算並加減到存款結算，你不用也不能自己算這些數字或透過任何欄位回報。
- 【兒女與生育系統】：不需要先結婚，單身也可以選擇生育或領養，只要有穩定關係或經濟條件即可，不限年齡階段，每次觸發都是一次性決定要不要生/領養，可以反覆觸發累積多個小孩。決定生育後用兩層骰邏輯（大方向看健康/年齡/financial_health，細節你自由發揮：一次成功/需要多次嘗試/走向不孕症）。如果走向不孕症，採四階段慢慢展開：①自然嘗試期(平淡帶過，期待與輕微失落交替)→②意識到不對勁決定就醫(先模糊的不對勁，隔一段時間才出現具體導火線去看醫生)→③治療嘗試多回合(依附兩軸呈現伴侶雙方不同反應；用one_time_transaction扣治療費，費用等級用「高費用」對照can_afford_medical判斷)→④岔路點(繼續嘗試/轉向領養/決定不再嘗試，三者在情緒份量上地位平等，不預設哪個正確，也不要無止盡重複讓玩家陷入負面循環，嘗試幾次後就該給出明確岔路)。小孩透過 new_characters 建立角色卡，relation 填「兒子」或「女兒」，並額外加一個欄位 is_child:true。領養的小孩跟親生地位完全對等。**（2026-09-23新增）**這四階段目前走到第幾階段由你的敘事節奏決定，但系統需要知道目前走到哪一階段（供七、7.6.2婚姻危機判斷「走到第四階段」這個觸發條件用），所以只要這回合的敘事推進或維持在不孕症四階段中的某一階段，透過fertility_stage_update回傳對應數字(1~4)；沒有涉及這條敘事線的回合就回傳null，不用每回合重複回報同一個數字。
- 【死亡機制（七、7.1.5，9/16改版，機率判定型，取代原本「壽命到達/意外死亡」兩條路徑）】：死亡結局現在完全由系統的年度機率判定決定，**你不用也不能自己判斷這回合玩家會不會死**，只負責在系統已經決定的框架內把細節寫出來：
  - **這回合是死亡結局本身**：如果 payload 的 forceEnding 是 true，代表系統已經判定這是玩家人生的最後一回合，你必須在這回合寫出結局場景的敘事（呼應前面已經鋪陳過的前兆，讓死亡感覺是這段人生的自然收尾，不是突兀的意外），並把 is_ending 設為 true、填寫 life_summary（見下面的【人生總結】規則）；forceEnding 為 false 時，即使你覺得劇情很適合角色死掉，也絕對不能自己把 is_ending 設為 true，系統會忽略這個欄位。
  - **這回合要埋前兆**：如果 payload 的 death_foreshadow_now 是 true，代表系統剛好判定「風險正在上升」，這回合的敘事裡要自然帶出一個微小前兆（疲勞感、差點發生意外的驚險場面、健康檢查結果不佳等），呼應防壓抑機制的精神，點到為止即可，不用解釋這代表什麼；death_foreshadowed 告訴你之前是否已經有過前兆，只是給你維持語氣延續感的參考，不用你判斷任何事。
  - 40歲以前（國高中/大學/初入社會/找方向期前段）forceEnding 與 death_foreshadow_now 都不會是 true，這個階段完全不用考慮死亡相關的敘事。
- 【世代傳承（死亡結局時，如果玩家有小孩）】：如果 payload 的 has_children 是 true 且這回合觸發死亡結局（無論哪種死法），在 life_summary 之外，額外透過 succession_available 設為 true 告知系統可以提供轉生選項；不用你自己處理繼承細節，那是系統的事。如果沒有小孩，succession_available 設為 false。
- 【情緒份量 emotional_tone（三、3.8，9/20新增，取代原本的 happiness_delta）】：你不再給幸福感數值，只回報這一回合對玩家而言的情緒份量，四選一：uplifting（明確的好事、鬆一口氣、被看見）、warm（平靜的暖意、日常的小確幸）、unsettling（隱隱不安、卡住、被忽略）、heavy（明確的打擊、失去、長期壓在身上的事）。多數平淡回合落在 warm 或 unsettling，兩端不要濫用。這四個字串以外的值系統一律當作中性處理，所以不要自創分類，也不要寫成「有點warm」這種模糊描述。幸福感的長期水準由系統依五條來源管道自己計算，不需要你操心。
- 【人生總結 life_summary（七、7.1.4，9/20新增，取代原本的 ending_title／ending_summary）】：只有 forceEnding 是 true 的那一回合才要填。這一生不給標籤、不給分數、不做總評、不跟別人比較，只回顧「經歷過什麼、後來變成什麼樣子」。payload 會給你 life_summary_material，裡面已經由系統挑好、排好素材：
  - segments：每個人生階段一筆，帶 stage（照抄當作 key）、stage_label、age_from/age_to、tone（釋然／平穩／惋惜／沉重，這是系統算好的敘事溫度，你照著寫，不要自己改判）、resume_entries（這段人生的履歷條目）、key_npcs（這段身邊的人）。每一筆寫一段回顧：當時的處境、這些履歷條目、這些人，語氣依 tone。不要寫成流水帳，也不要補系統沒給的事件。
  - transitions：階段與階段之間的光譜位移，帶 after_stage（照抄當作 key）、axis_label、from、to、direction。每一筆寫**一句**行為對比，只描述行為怎麼變了，不評價好壞、不說是進步或退步、不要出現「焦慮軸」「自律」這類機制詞彙。寫法參考：「你從一進教室就往牆邊走的人，變成會先問別人作業寫完了沒」。transitions 是空陣列時就不要寫。

- 【段落切分】：narrative 內容不要寫成單一區塊，要依「畫面轉換」或「心理轉折」切成2-3個小段落，段落之間用一個換行符號分隔（在JSON字串裡就是 \\n\\n）。參考結構：第一段場景/動作 → 第二段內心想法 → 第三段（如果有）對話或選項前導。

// 七、7.1.5（9/16機率公式提案,測試參數,待測試組驗證）：機率判定型死亡機制，取代原本computeAccidentRiskHint()
// 只給AI模糊提示、由AI自行判斷要不要觸發的舊設計——改成完全由client端算好機率+擲骰決定，AI只負責敘事，不再自行判斷「這回合要不要死」
// ========== 十三、健康衰退、疾病與老年階段（2026-09-20新增） ==========
// 13.2【定案,測試參數】健康年齡上限：健康現值不因年齡直接扣分，而是受這個天花板限制
const HEALTH_CAP_TABLE = [
  { maxAge:49, cap:100 }, { maxAge:59, cap:95 }, { maxAge:69, cap:88 },
  { maxAge:79, cap:78 }, { maxAge:89, cap:65 }, { maxAge:9999, cap:50 }
];
function baseHealthCapForAge(age){
  const bucket = HEALTH_CAP_TABLE.find(b=>age<=b.maxAge);
  return bucket ? bucket.cap : 50;
}
const HEALTH_CAP_BONUS_STREAK_TRIGGER = 8; // 【測試參數,待驗證,13.2】長期健康經營行為連續N年，供cap上修+5用，年數本身非文件明文規定
function computeHealthCap(s){
  // 13.2【定案】玩家能動性：長期健康經營行為可讓cap上修+5；慢性病每項cap-5；重大疾病康復後cap永久-5
  let cap = baseHealthCapForAge(s.age);
  if(s.healthCapBonusEarned) cap += 5;
  cap -= 5 * ((s.chronicConditions||[]).length);
  cap -= 5 * (s.majorIllnessRecoveredCount||0);
  return Math.max(cap, 10); // 技術判斷：避免多重扣減疊加壓到不合理的低值，設一個下限，非文件明文規定
}
// 13.2【定案】收斂方式：健康現值高於cap時，每滿一歲收斂一次，收斂量為(現值−cap)×0.5，與回合預算解耦(比照7.1.5同一設計精神)
const HEALTH_CAP_CONVERGENCE_RATE = 0.5;
function applyHealthCapConvergence(s){
  const cap = computeHealthCap(s);
  if(s.stats.health > cap){
    s.stats.health = clamp(s.stats.health - (s.stats.health-cap)*HEALTH_CAP_CONVERGENCE_RATE, 0, 100);
  }
}

const DEATH_MIN_AGE = 40; // 【定案,9/16改版,7.1.5】40歲以前不會觸發死亡結局
const DEATH_AGE_BASE_PROBABILITY = [ // 【測試參數,待測試組複驗,7.1.5四，9/16分段修正】40-69歲維持原值；70-79/80-89/90+三段依內容組(b)方案上修，疊加7.1.2前兆兩段式關卡後校準回75-82歲中位死亡年齡目標
  { minAge:40, maxAge:49, prob:0.002 },
  { minAge:50, maxAge:59, prob:0.006 },
  { minAge:60, maxAge:69, prob:0.015 },
  { minAge:70, maxAge:79, prob:0.07 },
  { minAge:80, maxAge:89, prob:0.24 },
  { minAge:90, maxAge:9999, prob:0.32 }
];
const RISKY_LIFESTYLE_DEATH_BONUS = 0.02; // 【測試參數,7.1.5三】高風險行為/職業固定加成，每年+2個百分點，加法疊加不隨年齡縮放
function deathAgeBaseProbability(age){
  const bucket = DEATH_AGE_BASE_PROBABILITY.find(b=>age>=b.minAge && age<=b.maxAge);
  return bucket ? bucket.prob : 0;
}
// 十三、13.2.2（2026-09-20拍板）：原公式的50其實是health_cap÷2(當時health_cap恆為100)，把隱含假設攤開後推廣為查表值，
// cap=100時與原公式完全等價，不是行為改變。7.1.5已結案的年齡基礎機率表與校準結果不需要重新做N=200,000網格搜尋
function deathHealthMultiplier(health, cap){
  cap = (typeof cap==="number") ? cap : 100;
  return 1 + ((cap/2 - health)/(cap/2)) * 0.5;
}
function computeDeathProbability(s){
  // 【測試參數,7.1.5一】死亡機率 = 年齡基礎機率×健康修正倍率 + 高風險行為/職業加成
  if(s.age<DEATH_MIN_AGE) return 0;
  const base = deathAgeBaseProbability(s.age) * deathHealthMultiplier(s.stats.health, computeHealthCap(s));
  const riskyBonus = s.riskyLifestyle ? RISKY_LIFESTYLE_DEATH_BONUS : 0;
  return clamp(base + riskyBonus, 0, 1);
}
// 每年一次判定（在advanceStructuredTime的career分支、年份真的跳動時呼叫）：
// roll成功且尚未有前兆→這年先埋前兆(呼應7.1.2前兆機制，不能無預兆死亡)；roll成功且已有前兆→這年觸發死亡結局
function rollAnnualDeathCheck(s){
  if(s.age<DEATH_MIN_AGE) return { justForeshadowed:false, deathTriggered:false };
  const hit = Math.random() < computeDeathProbability(s);
  if(!hit) return { justForeshadowed:false, deathTriggered:false };
  if(!s.deathForeshadowed){
    s.deathForeshadowed = true;
    return { justForeshadowed:true, deathTriggered:false };
  }
  return { justForeshadowed:false, deathTriggered:true };
}

// 13.3 疾病事件
// 【待確認,非本次拍板範圍,先照草案數字寫入】疾病最低年齡門檻30歲，本身是否合適尚未拍板
const ILLNESS_MIN_AGE = 30;
const ILLNESS_ANNUAL_PROBABILITY = [ // 【測試參數,待驗證,13.3.1】
  { minAge:30, maxAge:39, prob:0.015 }, { minAge:40, maxAge:49, prob:0.03 },
  { minAge:50, maxAge:59, prob:0.06 }, { minAge:60, maxAge:69, prob:0.12 },
  { minAge:70, maxAge:79, prob:0.20 }, { minAge:80, maxAge:9999, prob:0.28 }
];
const ILLNESS_LEVEL_WEIGHTS = [ // 【測試參數,待驗證,13.3.1】命中後再抽等級，權重依年齡帶調整
  { minAge:30, maxAge:49, weights:{ acute:70, chronic:25, major:5 } },
  { minAge:50, maxAge:69, weights:{ acute:45, chronic:40, major:15 } },
  { minAge:70, maxAge:9999, weights:{ acute:35, chronic:40, major:25 } }
];
const MAJOR_ILLNESS_MAX_PER_AGEBAND = 1; // 13.3.5【定案】每個年齡帶最多觸發1條重大疾病線
const CHRONIC_CONDITION_MAX_CONCURRENT = 3; // 13.3.3【測試參數,待驗證】同時最多並存3項
const CHRONIC_CONDITION_MONTHLY_COST = 2; // 13.3.3【定案,套用3.4.5低費用等級,測試參數】
const CHRONIC_CONTROL_STREAK_TRIGGER = 5; // 13.3.3【測試參數,待驗證】連續數回合健康經營行為可轉為控制良好
function illnessAnnualProbability(age){
  const b = ILLNESS_ANNUAL_PROBABILITY.find(x=>age>=x.minAge && age<=x.maxAge);
  return b ? b.prob : 0;
}
function rollIllnessLevel(age){
  const band = ILLNESS_LEVEL_WEIGHTS.find(x=>age>=x.minAge && age<=x.maxAge) || ILLNESS_LEVEL_WEIGHTS[0];
  const w = band.weights;
  const total = w.acute+w.chronic+w.major;
  const r = rnd(1,total);
  if(r<=w.acute) return "acute";
  if(r<=w.acute+w.chronic) return "chronic";
  return "major";
}
// 13.3.1【定案】疾病機率＝(年齡基礎疾病機率×健康修正倍率)＋高風險行為/職業加成，運算結構刻意與7.1.5一致，健康修正倍率沿用13.2.2推廣式
// 【定案】擲骰與等級判定全由客戶端完成，AI只負責在已決定的框架內寫敘事，不自行判斷要不要生病
function rollAnnualIllnessCheck(s){
  if(s.age<ILLNESS_MIN_AGE || s.majorIllness) return null; // 已在重大疾病線中，不重複判定新疾病事件(技術判斷，避免同時疊加多條疾病線)
  const cap = computeHealthCap(s);
  const prob = clamp(illnessAnnualProbability(s.age)*deathHealthMultiplier(s.stats.health, cap) + (s.riskyLifestyle?RISKY_LIFESTYLE_DEATH_BONUS:0), 0, 1);
  if(Math.random() >= prob) return null;
  let level = rollIllnessLevel(s.age);
  const bandKey = chronicleLifeStageKey(s); // 沿用既有8段年齡帶定義做「每個年齡帶」判斷
  s.majorIllnessCountByBand = s.majorIllnessCountByBand || {};
  if(level==="major" && (s.majorIllnessCountByBand[bandKey]||0) >= MAJOR_ILLNESS_MAX_PER_AGEBAND) level = "acute"; // 上限已達，降級為急性事件
  s.chronicConditions = s.chronicConditions || [];
  if(level==="chronic" && s.chronicConditions.length >= CHRONIC_CONDITION_MAX_CONCURRENT) level = "acute"; // 並存上限已達，降級為急性事件
  if(level==="major"){
    s.majorIllnessCountByBand[bandKey] = (s.majorIllnessCountByBand[bandKey]||0)+1;
    s.majorIllness = { stage:"onset", turnsInStage:0, onsetTargetTurns: rnd(1,3) };
    return { level:"major" };
  }
  if(level==="chronic"){
    s.chronicConditions.push({ id:"chronic_"+s.turnCount+"_"+rnd(1000,9999), controlledStreak:0, controlled:false });
    return { level:"chronic" };
  }
  // 13.3.2 急性事件：單一回合內完成，健康一次性扣分並於後續回合回升(不產生持續性狀態旗標)
  s.stats.health = clamp(s.stats.health - rnd(5,15), 0, 100); // 【測試參數,待驗證,13.3.2】
  return { level:"acute" };
}
// 13.3.4 重大疾病四階段：徵兆期(1-3回合)→確診(1回合,里程碑)→治療期(3-6回合)→岔路點(康復/帶病生存/惡化)
// 每回合都要檢查(治療期是連續回合而非年度事件)，跟疾病最初觸發的年度判定分開
function advanceMajorIllness(s){
  const mi = s.majorIllness;
  if(!mi) return null;
  mi.turnsInStage = (mi.turnsInStage||0)+1;
  if(mi.stage==="onset"){
    if(mi.turnsInStage>=mi.onsetTargetTurns) { mi.stage="diagnosed"; mi.turnsInStage=0; }
    return { stage:"onset" };
  }
  if(mi.stage==="diagnosed"){
    // 【定案】確診為里程碑，寫入L3人生履歷——結構化事件，不依賴AI回報是否記得寫
    s.chronicle.push(`（${s.age}歲）確診重大疾病，開始一段治療的日子`);
    mi.stage = "treatment"; mi.turnsInStage = 0; mi.treatmentTargetTurns = rnd(3,6);
    return { stage:"diagnosed" };
  }
  if(mi.stage==="treatment"){
    s.stats.health = clamp(s.stats.health - rnd(2,5), 0, 100); // 【測試參數,待驗證】治療期健康持續扣分
    if(mi.turnsInStage>=mi.treatmentTargetTurns){
      // 【定案】岔路點三者在幸福感計算上地位平等，不預設哪個是正確結果；技術判斷：機率式自動判定，非玩家選項(文件未列出玩家可選的具體選項文字)
      const roll = rnd(1,100);
      let outcome;
      if(roll<=40){
        outcome = "recover";
        s.stats.health = clamp(s.stats.health + rnd(10,20), 0, 100);
        s.majorIllnessRecoveredCount = (s.majorIllnessRecoveredCount||0)+1; // cap永久-5，透過computeHealthCap讀取
      } else if(roll<=75){
        outcome = "chronic";
        s.chronicConditions = s.chronicConditions || [];
        if(s.chronicConditions.length<CHRONIC_CONDITION_MAX_CONCURRENT){
          s.chronicConditions.push({ id:"from_major_"+s.turnCount, controlledStreak:0, controlled:false });
        }
      } else {
        outcome = "worsen"; // 【定案】惡化不直接判定死亡，只是把健康壓低，死亡仍走七、7.1.5的年度判定
        s.stats.health = clamp(s.stats.health - rnd(15,30), 0, 100);
      }
      s.majorIllness = null;
      return { stage:"fork", outcome };
    }
    return { stage:"treatment" };
  }
  return null;
}

// 13.5.1【定案,測試參數】父母年齡骰定為玩家出生時25到35歲；健康採四階段狀態機：1健康自理/2需要協助/3失能長照/4過世(見13.6)

// 2026-09-22二次修正：使用者回報的原始分級表(60-69:5%/70-79:10%/80-89:18%/90-99:30%/100+:50%+最後階段30%)

// 60-69歲維持原本5%不變；調整後20萬次模擬：40歲86.65%(目標80-90)／60歲35.75%(目標25-40)／80歲0.20%(目標<2)，皆落在目標範圍內
const PARENT_CHILD_AGE_GAP_MIN = 22; // newRoll()開局骰父母年齡用
const PARENT_CHILD_AGE_GAP_MAX = 38;
const PARENT_HEALTH_STAGE_ADVANCE_PROBABILITY_BY_AGE = [
  { maxAge:59, probability:0.02 },
  { maxAge:69, probability:0.05 },
  { maxAge:79, probability:0.06 }, // 2026-09-22二次修正：原10%，20萬次模擬顯示會讓60歲在世比例過低
  { maxAge:89, probability:0.09 }, // 2026-09-22二次修正：原18%，同上
  { maxAge:99, probability:0.30 },
  { maxAge:Infinity, probability:0.50 }

function parentHealthStageAdvanceProbability(age){
  const tier = PARENT_HEALTH_STAGE_ADVANCE_PROBABILITY_BY_AGE.find(t=>(age||0)<=t.maxAge);
  return tier ? tier.probability : 0.50;
}
const PARENT_HEALTH_LAST_LIVING_STAGE = 3; // 失能長照：過世(4)前最後一個在世階段
const PARENT_HEALTH_LAST_STAGE_DEATH_PROBABILITY = 0.22; // 2026-09-22二次修正：原30%，理由同上
const PARENT_HEALTH_HARD_CAP_AGE = 105;
function rollParentHealthStageAdvance(s){
  const events = [];
  // 13.6【定案】過世的父母(deceased===true，含世代傳承後標記為過世的上一代主角)不再進入這個狀態機，避免被判定「再過世一次」
  // 十三、13.5.1（2026-09-23新增）：隔代教養的祖父母卡納入同一套狀態機，長照決策/過世/遺產一律沿用13.5、13.6既有流程
  s.characters.filter(c=>(c.origin==="父母，從出生起" || c.origin==="隔代教養，從出生起") && (c.healthStage||1)<4 && c.active!==false && !c.deceased).forEach(c=>{

    if(stage===PARENT_HEALTH_LAST_LIVING_STAGE && Math.random() < PARENT_HEALTH_LAST_STAGE_DEATH_PROBABILITY){
      finalizeParentDeath(s, c.name);
      events.push({ parentName:c.name, newStage:4 });
      return;
    }
    if(Math.random() < parentHealthStageAdvanceProbability(c.age||0)){
      c.healthStage = stage+1;
      events.push({ parentName:c.name, newStage:c.healthStage });
      if(c.healthStage===2 || c.healthStage===3){
        if(!s.pendingEldercareDecision) s.pendingEldercareDecision = { parentName:c.name, stage:c.healthStage };
      } else if(c.healthStage===4){
        // 13.6：過世沒有列出玩家可選選項(只有敘事處理+遺產計算)，不需要彈窗，直接結算
        finalizeParentDeath(s, c.name);
      }
    }
  });
  return events;
}
// 13.5.2【定案】選項：自己擔任主要照顧者/與手足分工/聘僱居家照服員或機構(中費用等級)/由手足承擔自己有限度參與/自訂輸入
const ELDERCARE_HIRE_MONTHLY_COST = 5; // 【測試參數,待驗證,13.5.2】中費用等級
function resolveEldercareDecision(s, parentName, choice){
  const parent = s.characters.find(c=>c.name===parentName);
  if(parent){
    if(choice==="hire"){
      s.monthlyExpenses.push({ label:"長照看護費", amount:ELDERCARE_HIRE_MONTHLY_COST });
    } else if(choice==="self"){
      // 13.5.2【定案】代價與回饋：照顧行為佔用回合、健康扣分(比照3.5.1既有家庭壓力累積)，父母關係值上升
      parent.affinity = clamp(parent.affinity + rnd(3,6), 0, 100);
      s.stats.health = clamp(s.stats.health - rnd(3,6), 0, 100);
    } else if(choice==="split"){
      // 13.5.2【定案】連動五、5.2家庭結構的手足角色卡，手足互動是支援或衝突取決於既有關係值，這裡採支援方向的預設效果
      const sibling = s.characters.find(c=>/^哥哥$|^弟弟$|^姊姊$|^妹妹$/.test(c.relation||""));
      if(sibling) sibling.affinity = clamp(sibling.affinity + rnd(1,4), 0, 100);
    }
    // limited：由手足承擔，自己有限度參與——不做額外數值變動，代價由「沒有主動投入」自然反映
  }
  s.pendingEldercareDecision = null;
  s.eldercareEventLog = { parentName, choice, stage: parent ? parent.healthStage : null };
}

// 13.6 父母過世
function finalizeParentDeath(s, parentName){
  const parent = s.characters.find(c=>c.name===parentName);
  if(!parent) return;
  if(parent.estateSettled) return; // 2026-09-22修正：遺產/過世結算只能觸發一次，防止同一位角色被重複判定過世、重複發遺產
  parent.active = false;
  parent.deceased = true;
  parent.estateSettled = true;
  // 13.6【定案,測試參數】遺產依家境與是否有房產，一次性變動現金；簡化估算，非精算遺產稅/繼承法規則
  const inheritance = s.familySavings ? Math.round(s.familySavings*0.1) : rnd(5,20);
  s.cash += inheritance;
  // 13.6【定案】喪禮回合採強制過渡回合的敘事處理已交由system prompt guidance；結構化紀錄部分：直接寫入L3人生履歷
  s.chronicle.push(`（${s.age}歲）${parent.relation}過世了`);
  s.pendingParentDeath = null;
  s.parentDeathEventLog = { parentName, relation:parent.relation, inheritance };
}

// 十三、健康衰退年度檢查集合：健康cap收斂/疾病判定/父母健康狀態機推進，比照12的rollAnnualCareerChecks，每滿一年判定一次
function rollAnnualHealthChecks(s){
  applyHealthCapConvergence(s);
  const illness = rollAnnualIllnessCheck(s);
  if(illness) s.illnessEventLog = illness;
  const parentEvents = rollParentHealthStageAdvance(s);
  if(parentEvents.length) s.parentHealthEventLog = parentEvents;
  return { illness, parentEvents };
}

// 更早的完全不送給AI（由4.2履歷/4.1 NPC記憶承接長期記憶），取代原本「recent_log只給最近2則原文、更早整個看不到」的做法
const RECENT_FULL_TEXT_TURNS = 3; // 【定案,9/19,見4.2.1.1】
const RECENT_SUMMARY_TURNS = 6; // 【測試參數,Claude Code判斷,呼應L3履歷摘要同樣抓6則】
// 一、1.2.9.1（2026-09-23取代原本固定250-350字規則）：敘事字數依這回合monthsCrossed(這回合涵蓋的遊戲內時間長度)分級，
// 程式直接算好級距+建議字數告訴AI，不讓AI自己換算週期。三個級距的分界(2週=0.5個月/1個月)與各級字數皆為【測試參數,暫定,待驗證】
function narrativeLengthTier(monthsCrossed){
  const m = monthsCrossed||0;
  if(m<=0.5) return { tier:"short", word_range:"400-500字", structure:"只寫一個核心場景(約450字為基準)，不需要轉場句" };
  if(m<=1) return { tier:"medium", word_range:"450-600字", structure:"核心場景為主，可視情況加0-1個次要片段，多出的字數優先用在片段/轉場，不要拉長核心場景本身" };
  return { tier:"long", word_range:"500-700字", structure:"完整三段結構：核心場景(約450字為基準)＋次要片段0-2個(各1-3句)＋轉場句1-2句" };
}

const WORKER_URL = "https://life-game.smile80275.workers.dev/";

async function callAI(actionText, forceEnding, timeCtx){
  let res;
  try{
    res = await fetch(WORKER_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 3000, // 2026-09-18：從1400調高，Sonnet 5預設會自動思考(adaptive thinking)佔用部分token額度，1400太容易被截斷（無文字內容/JSON解析失敗）
        // 2026-09-19：試過output_config.format(structured outputs)想在API層強制JSON結構，但這份schema規模對
        // Anthropic的grammar編譯器來說太大（400「compiled grammar too large」），拿掉全部enum約束後仍然超過限制，撤回改回
        // 純文字指示JSON，結果真實測試中出現「AI整段寫成故事、完全不包JSON」的失敗（見CHANGELOG續6/續11）。
        // 2026-09-19（續）：改用強制工具呼叫（tools+tool_choice，見TURN_RESULT_TOOL定義），不加strict:true避開
        // 跟structured outputs同一套grammar編譯限制，改吃Claude原生工具呼叫能力——AI在架構上不可能再回傳純文字，
        // 工具參數也由API端直接解析成物件，不用再自己JSON.parse
        output_config: {
          effort: "low" // 敘事生成不需要高強度推理，用低努力度壓低思考的token消耗，兼顧成本與穩定度
        },
        tools: [ TURN_RESULT_TOOL ],
        tool_choice: { type: "tool", name: "submit_turn_result" },
        // 2026-09-19新增：prompt caching——buildSystemPrompt()完全是固定文字，每個玩家、每一回合都一字不差，
        // 沒開快取代表每次都用全額input token價格重複付這3萬多字。cache_control改用便宜很多的快取讀取價格計費
        // （命中快取時usage.cache_read_input_tokens會>0，可用來驗證真的有生效），不影響AI實際讀到的內容
        system: [ { type: "text", text: buildSystemPrompt(), cache_control: { type: "ephemeral" } } ],
        messages: [{ role:"user", content: buildUserMessage(actionText, forceEnding, timeCtx) }]
      })
    });
  }catch(networkErr){
    throw new Error("網路請求失敗："+networkErr.message);
  }

  let text;
  try{ text = await res.text(); }
  catch(readErr){ throw new Error("讀取回應內容失敗："+readErr.message); }

  if(!text || text.trim().length===0){
    const ct = res.headers.get("content-type");
    throw new Error("收到空白回應（HTTP "+res.status+" "+res.statusText+"，content-type: "+ct+"，長度: "+text.length+"）");
  }

  let data;
  try{ data = JSON.parse(text); }
  catch(parseErr){ throw new Error("回應不是合法JSON（HTTP "+res.status+"）內容前2000字：「"+text.slice(0,2000)+"」"); }

  if(!res.ok){
    throw new Error("API錯誤 "+res.status+"："+(data?.error?.message||JSON.stringify(data)));
  }
  if(data.error){
    throw new Error("API錯誤："+data.error.message);
  }
  // 2026-09-19（續）：改用強制工具呼叫，直接讀tool_use區塊的.input（API端已經幫忙解析成物件），
  // 不再需要find文字區塊+手動JSON.parse，見TURN_RESULT_TOOL/tool_choice的說明
  const toolBlock = (data.content||[]).find(b=>b.type==="tool_use" && b.name==="submit_turn_result");
  if(!toolBlock){
    // 診斷用（9/18新增）：stop_reason/usage能直接看出是不是max_tokens被思考吃光，不用再靠截斷的原始內容猜
    throw new Error("回應裡沒有submit_turn_result工具呼叫｜stop_reason="+data.stop_reason+" ｜usage="+JSON.stringify(data.usage)+" ｜content概要："+JSON.stringify((data.content||[]).map(b=>({type:b.type, len:(b.text||b.thinking||"").length}))));
  }
  // 2026-09-19（續2）：實測發現一種新的失敗模式——AI雖然有呼叫submit_turn_result工具（toolBlock存在），
  // 但把整個回應寫成舊式「prompted tool use」的偽XML文字格式（例如narrative欄位結尾出現</narrative>，
  // 後面接著整串<parameter name="turn_summary">...</parameter>之類的標籤），而不是老實把值分別填進schema的
  // 各自獨立欄位。這種情況toolBlock.input存在、不會被上面的!toolBlock擋下，但內容是壞的，之前會被當成
  // 「成功」悄悄吃下去，玩家看到的敘事會混進一堆標籤碎片。這裡補一道驗證，偵測到就當作失敗觸發既有的重試機制
  if(isMalformedTurnResult(toolBlock.input)){
    throw new Error("工具呼叫內容格式異常（疑似AI把整個回應寫成舊式文字標籤格式，沒有正確使用schema欄位）｜stop_reason="+data.stop_reason+" ｜narrative前300字：「"+String(toolBlock.input && toolBlock.input.narrative).slice(0,300)+"」");
  }
  return toolBlock.input;
}
// 見上方callAI()註解：偵測AI是否把整個工具呼叫錯寫成舊式偽XML文字格式，混進narrative欄位或其他欄位缺漏/型別不對
// 2026-09-19（續3）：實測發現汙染不一定只出現在narrative欄位結尾——曾出現narrative本身乾淨、但event_type/
// interest_event/character_updates等其他欄位被塞進<parameter name="...">...</parameter>標籤文字的情況，
// 原本只檢查narrative欄位完全抓不到，導致這種「半污染」回應被當成功接受，choices欄位因此也連帶空掉或缺漏，
// 造成畫面上選項整組消失（玩家只剩自訂輸入可用）。改成序列化整個input物件做全欄位掃描，涵蓋任何欄位藏汙染的情況
function isMalformedTurnResult(input){
  if(!input || typeof input!=="object") return true;
  if(typeof input.narrative!=="string" || !input.narrative.trim()) return true;
  if(typeof input.turn_summary!=="string" || !input.turn_summary.trim()) return true;
  if(!Array.isArray(input.choices)) return true;
  if(!input.is_ending && input.choices.length===0) return true; // 非結局回合choices不該是空陣列，呼應一、1.2.7「給3到4個選項」定案
  try{
    if(/<\/narrative>|<parameter\s+name=/.test(JSON.stringify(input))) return true;
  }catch(e){ return true; }
  return false;
}

function weightedPick(pairs){
  const total = pairs.reduce((s,p)=>s+p[1],0);
  let r = Math.random()*total;
  for(const [val,w] of pairs){ if(r<w) return val; r-=w; }
  return pairs[0][0];
}
function pickAgeAdvance(age){
  if(age<=18) return weightedPick([[0,7],[1,3]]);
  if(age<=29) return weightedPick([[0,4],[1,6]]);
  if(age<=45) return weightedPick([[1,5],[2,5]]);
  return weightedPick([[2,5],[3,3],[4,2]]);
}

  // 三、3.2.4（2026-09-23拍板）：才識拖累斜率需要「考前實際累積的選興趣路徑次數」，同一個時序理由，快照方式比照上面studyCountBeforeAdvance
  const interestCountBeforeAdvance = state.interestCountThisTerm||0;
  // 二、2.5（9/16新增）：22歲以後改採加速曲線回合預算，取代原本「30歲以後交給AI自行判斷age_advance」的舊架構
  // 全生涯（15歲起）都由客戶端結構化算好本回合要推進多少時間，AI的age_advance一律視為0，不再有年齡分界
  const adv = advanceStructuredTime(actionText);
  // 十一、11.4（9/19新增）：期末考是首版明牌檢定白名單唯一節點，命中就在呼叫AI之前先擲骰決定確切分數
  // （呼應7.1.5死亡機制精神，不讓AI自由裁量這個數字），期中考不受影響、維持原本hint範圍由AI自由發揮
  const examCheck = (adv.examTriggered && adv.examType==="期末考") ? rollFinalExamCheck(state.stats.knowledge, studyCountBeforeAdvance) : null;
  // 2026-09-23修正（時間標籤慢一拍bug）：這回合顯示/送給AI的標籤改用currentLabel(這回合實際所在的段落)，
  // 不再用toLabel(換段後、下一回合才生效的段落)；jump提示(from/to)維持給跳過動作用，語意不變
  let timeCtx = { structured:true, label: adv.currentLabel, jump: adv.bigJump ? {from:adv.fromLabel, to:adv.toLabel} : null, monthsCrossed: adv.monthsCrossed||0, examTriggered: !!adv.examTriggered, examType: adv.examType||null, examCheck, studyCountAtExam: studyCountBeforeAdvance, interestCountAtExam: interestCountBeforeAdvance, deathForeshadowNow: !!adv.deathForeshadowNow };
  render(true);

  // 七、7.1.5（9/16改版,測試參數）：取代原本state.age>=state.lifeExpectancy的固定壽命值判定，
  // 死亡結局現在完全由client端的年度機率roll決定（見rollAnnualDeathCheck），不再有AI自行判斷的空間
  const forceEnding = !!adv.deathTriggered;
  // 四、4.5（2026-09-20 b版修正）：forceEnding時，最後一段的邊界要在呼叫AI之前先確定好，
  // 這樣buildUserMessage()/mockGenerateTurn()算出的life_summary_material才會是完整8段，AI才有機會
  // 寫到角色死亡的那一段（取代原本邊界只在applyResult()事後才凍結、AI永遠看不到最後一段的舊流程）
  if(forceEnding) freezeFinalLifeStageForEnding(state);
  // bug修正（9/14，人生草稿0914測試.pdf）：技術錯誤/破碎原始文字絕對不能外洩給玩家；
  // 失敗先重試一次，重試仍失敗才顯示中性容錯敘事，不附帶任何e.message或原始內容
  try{
    let result;
    try{
      result = USE_MOCK ? await mockCallAI(actionText, forceEnding, timeCtx) : await callAI(actionText, forceEnding, timeCtx);
    }catch(firstErr){
      console.error("第一次呼叫失敗，重試一次：", firstErr);
      result = USE_MOCK ? await mockCallAI(actionText, forceEnding, timeCtx) : await callAI(actionText, forceEnding, timeCtx);
    }
    applyResult(result, timeCtx, forceEnding, actionText);
  }catch(e){
    console.error("重試後仍失敗：", e);
    applySnapshot();
    refundAP(state, apUsed); // 十、10.3.1：API呼叫失敗/斷線不扣點
    state.log.push({age:state.age, timeLabel:null, text:"（旁白剛剛恍神了一下，這回合沒講清楚，稍後再試一次看看。）"});
  }
  saveGame();
  render();
  // 十、10.3.8：用掉最後1點時，這回合照常生成顯示、自動存檔後才跳出提示（死亡結局那回合不用提示）
  const apJustExhausted = cost>0 && state.phase==="playing" && totalAP(state)===0;
  if(examCheck){ renderExamCheckModal(examCheck); }
  if(state.mealJustUnlocked){ state.mealJustUnlocked = false; renderMealUnlockModal(); }
  if(state.pendingSideBusinessCardId){ const cid = state.pendingSideBusinessCardId; state.pendingSideBusinessCardId = null; renderSideBusinessModal(cid); }
  // 九、大學科系系統：四個彈窗互斥，一次只處理一個，優先序為選科系＞轉系＞雙主修＞休學肄業
  // （選科系優先是因為其他三個狀態機都要有科系才有意義；後三者用if/else if避免同一回合疊兩個彈窗互相蓋掉）
  if(state.pendingMajorSelection){ state.pendingMajorSelection = false; renderMajorSelectionModal(); }
  else if(state.pendingTransferOffer){ state.pendingTransferOffer = false; renderTransferOfferModal(); }
  else if(state.pendingDualMajorOffer){ state.pendingDualMajorOffer = false; renderDualMajorOfferModal(); }
  else if(state.pendingDualMajorAbandonOffer){ state.pendingDualMajorAbandonOffer = false; renderDualMajorAbandonModal(); }
  else if(state.pendingLeaveOffer){ const reason = state.pendingLeaveOffer; state.pendingLeaveOffer = null; renderWithdrawalOfferModal(reason); }
  // 七、7.3.5（2026-09-20新增）：子女成長節點，跟大學四個彈窗互斥鏈分開處理（性質不同，理論上不會同回合撞在一起）
  if(state.pendingParentingNode){ const pn = state.pendingParentingNode; state.pendingParentingNode = null; renderParentingNodeModal(pn); }
  // 七、7.6（2026-09-20新增）：婚姻危機優先於關係投入節點(較急迫)，兩者互斥避免同回合疊兩個彈窗
  if(state.pendingMarriageCrisis){ const mc = state.pendingMarriageCrisis; state.pendingMarriageCrisis = null; renderMarriageCrisisModal(mc); }
  else if(state.pendingRelationshipInvestment){ const ri = state.pendingRelationshipInvestment; state.pendingRelationshipInvestment = null; renderRelationshipInvestmentModal(ri); }
  else if(state.pendingCohabitationOffer){ const co = state.pendingCohabitationOffer; state.pendingCohabitationOffer = null; renderCohabitationOfferModal(co); }
  // 十二、職涯系統（2026-09-20新增）：六個彈窗互斥，一次只處理一個，優先序為求職＞升遷＞職涯岔路＞創業啟動＞創業存續＞退休
  if(state.pendingJobSearch){ const js = state.pendingJobSearch; state.pendingJobSearch = null; renderJobSearchModal(js); }
  else if(state.pendingPromotionOffer){ const po = state.pendingPromotionOffer; state.pendingPromotionOffer = null; renderPromotionOfferModal(po); }
  else if(state.pendingCareerForkOffer){ state.pendingCareerForkOffer = null; renderCareerForkModal(); }
  else if(state.pendingBusinessLaunch){ const bl = state.pendingBusinessLaunch; state.pendingBusinessLaunch = null; renderBusinessLaunchModal(bl); }
  else if(state.pendingFamilyBusinessOffer){ const fb = state.pendingFamilyBusinessOffer; state.pendingFamilyBusinessOffer = null; renderFamilyBusinessOfferModal(fb); }
  else if(state.pendingBusinessContinuation){ state.pendingBusinessContinuation = null; renderBusinessContinuationModal(); }
  else if(state.pendingRetirementOffer){ const ro = state.pendingRetirementOffer; state.pendingRetirementOffer = null; renderRetirementOfferModal(ro); }
  // 十三、13.5.2（2026-09-20新增）：照顧年邁父母的決策節點
  if(state.pendingEldercareDecision){ const ec = state.pendingEldercareDecision; state.pendingEldercareDecision = null; renderEldercareDecisionModal(ec); }
  if(apJustExhausted) renderAPExhaustedModal(); // 最後才疊上去，確保在其他彈窗之上
}

function applyResult(r, timeCtx, forceEnding, actionText){
  const s = state;
  // 九、大學科系系統：university_recent_event只給AI看這一回合，用過就清掉，不然會被下一回合重複讀到
  s.universityEventLog = null;
  // 六、6.2（2026-09-20新增）：breakthrough_event_now只給AI看這一回合，用過就清掉，比照university_recent_event
  s.breakthroughEventLog = null;
  // 七、7.3.5（2026-09-20新增）：parenting_event_now只給AI看這一回合，用過就清掉
  s.parentingEventLog = null;
  // 七、7.6（2026-09-20新增）：以下三個event log只給AI看這一回合，用過就清掉
  s.relationshipInvestmentEventLog = null;
  s.marriageCrisisEventLog = null;
  s.divorceEventLog = null;
  // 七、7.6.1.1（2026-09-22新增）：cohabitation_event_now只給AI看這一回合，用過就清掉
  s.cohabitationEventLog = null;
  // 十二、職涯系統（2026-09-20新增）：career_event_now只給AI看這一回合，用過就清掉
  s.careerEventLog = null;
  // 十三、健康衰退與老年階段（2026-09-20新增）：以下event log只給AI看這一回合，用過就清掉
  s.illnessEventLog = null;
  s.majorIllnessEventLog = null;
  s.parentHealthEventLog = null;
  s.eldercareEventLog = null;
  s.parentDeathEventLog = null;
  // 可見數值變化顯示（9/15新增）：先記錄這回合開始前的可見數值，最後跟結算一起顯示變化量
  const beforeVisibleStats = { health:s.stats.health, knowledge:s.stats.knowledge, network:s.stats.network, expression:s.stats.expression, appearance:s.appearance };
  const structured = !!(timeCtx && timeCtx.structured);
  const ageAtEvent = s.age; // 非結構化時間下的年齡（尚未套用 age_advance 之前）
  if(!structured){
    s.age = clamp(s.age + (r.age_advance||0), s.age, 130);
  }
  // structured=true 時，s.age 在呼叫AI之前就已經由 advanceStructuredTime() 算好了，這裡不再套用 r.age_advance
  const d = r.stat_deltas||{};
  // 十三、13.3.3（2026-09-20新增）：慢性病命中機率×0.85（每項疊乘），不封鎖選項本身，只是這次健康加分沒有生效；
  // 同時追蹤「連續健康經營行為」讓慢性病轉為控制良好狀態(控制良好後移除此機率折扣，保留支出與cap影響)
  let healthDelta = d.health||0;
  (s.chronicConditions||[]).forEach(c=>{
    if(c.controlled) return;
    if(healthDelta>0){ c.controlledStreak = (c.controlledStreak||0)+1; if(c.controlledStreak>=CHRONIC_CONTROL_STREAK_TRIGGER) c.controlled = true; }
    else c.controlledStreak = 0;
  });
  if(healthDelta>0 && s.chronicConditions && s.chronicConditions.length){
    const uncontrolledCount = s.chronicConditions.filter(c=>!c.controlled).length;
    if(uncontrolledCount>0 && Math.random() >= Math.pow(0.85, uncontrolledCount)) healthDelta = 0;
  }
  s.stats.health = clamp(s.stats.health + healthDelta, 0, 100);
  // 十三、13.2（2026-09-20新增）：健康年齡上限收斂(年度)已在rollAnnualHealthChecks處理；13.3.4重大疾病治療期是連續回合機制，每回合都要推進
  const majorIllnessProgress = advanceMajorIllness(s);
  if(majorIllnessProgress) s.majorIllnessEventLog = majorIllnessProgress;

  // 3.7.3 做事態度光譜——精確公式版：團隊vs單打獨鬥影響才識/邏輯 vs 人脈的此消彼長效率
  const teamKnowledgeMult = clamp(1+(50-s.conscientiousness.teamSolo)*0.01, 0.5, 1.5);
  const wisdomMult = 0.5 + (s.wisdom/200);
  const logicBonus = 1 + (s.logicAbility/400);
  const disciplineMult = getDisciplineMultiplier(s); // 3.7.3（2026-09-23拍板）：自律乘數，接在邏輯加成之後、團隊倍率之前
  const knowledgeRawValue = rollKnowledgeRawValue(r.event_type, r.event_id, s); // 3.2.2（9/16修正）：AI只給標籤，程式查表+計數把關
  let knowledgeDelta = knowledgeRawValue * wisdomMult * logicBonus * disciplineMult * teamKnowledgeMult;
  knowledgeDelta = applyMarginalDiminish(knowledgeDelta, s.stats.knowledge); // 3.5.3邊際遞減
  s.stats.knowledge = clamp(s.stats.knowledge + knowledgeDelta, 0, 100);

  // 九、9.5.1（9/16新增）：考試結算時更新轉系候選的「連續低於預期」計數，完全不依賴AI敘事內容
  if(structured && timeCtx.examTriggered) updateTransferCandidateOnExam(s, timeCtx.studyCountAtExam);

  // 責任感→人脈加分/扣分幅度；團隊vs單打獨鬥→人脈成長效率，兩者疊乘
  const teamNetworkMult = clamp(1+(s.conscientiousness.teamSolo-50)*0.01, 0.5, 1.5);
  const respMult = (d.network||0)>=0
    ? clamp(1+(s.conscientiousness.responsibility-50)*0.01, 0.5, 1.5)
    : clamp(1+(50-s.conscientiousness.responsibility)*0.01, 0.5, 1.5);
  let networkDelta = (d.network||0) * respMult * teamNetworkMult;
  networkDelta = applyMarginalDiminish(networkDelta, s.stats.network); // 3.5.3邊際遞減
  s.stats.network = clamp(s.stats.network + networkDelta, 0, 100);

  // 3.5.3 人脈閒置衰退：連續N回合沒有人脈經營行為（AI/mock這回合完全沒給正向人脈delta）才啟動輕微衰退
  s.networkIdleStreak = (d.network||0)>0 ? 0 : (s.networkIdleStreak||0)+1;
  if(ENABLE_NETWORK_IDLE_DECAY && s.networkIdleStreak>=NETWORK_IDLE_THRESHOLD &&
     (s.networkIdleStreak-NETWORK_IDLE_THRESHOLD)%NETWORK_IDLE_DECAY_INTERVAL===0){
    s.stats.network = clamp(s.stats.network - rnd(1,3), 0, 100);
  }
  s.stats.expression = clamp(s.stats.expression + (d.expression||0), 0, 100);
  // 三、3.8（9/20改版，取代原本 s.happiness += r.happiness_delta 的直接加減）：
  // AI只給emotional_tone四選一，程式查表決定增減量，再依回歸週期朝基準線移動
  applyHappiness(s, r.emotional_tone);
  refreshMilestoneSkipReasons(s); // 3.8.4：skip_reason三選一，供自主感管道與QA查核用

  // 氣質被動成長（呼應才識/表達力提升、財務狀況、隨時間累積），外表=顏值+氣質
  let tempGrowth = 0;
  if(knowledgeDelta>3) tempGrowth+=1;
  if((d.expression||0)>3) tempGrowth+=1;
  s.temperament = clamp(s.temperament+tempGrowth,0,100);
  s.appearance = clamp(Math.round(s.looks*0.5+s.temperament*0.5),0,100);

  // 健康連續偏低追蹤（呼應3.5.1過勞/憂鬱觸發門檻，僅供AI參考，不強制觸發）
  s.lowHealthStreak = s.stats.health<30 ? s.lowHealthStreak+1 : 0;
  // 3.5.1（2026-09-23拍板）：連續回合數達自律門檻(burnoutStreakThreshold)時，額外給AI一個明確的門檻制訊號，
  // 取代原本只送lowHealthStreak原始數字讓AI自行判斷「夠不夠久」的模糊做法
  s.burnoutSignalNow = s.lowHealthStreak>0 && s.lowHealthStreak>=burnoutStreakThreshold(s);

  const as = r.attachment_shift||{};
  s.anxiety = clamp(s.anxiety + (as.anxiety||0), 0, 100);
  s.avoidance = clamp(s.avoidance + (as.avoidance||0), 0, 100);
  s.peerPosition = clamp(s.peerPosition + (r.peer_position_shift||0), 0, 100);
  // 六、6.2（2026-09-20新增）：光譜位移套用完畢後才檢查是否打破底色，讀的是套用後的最新光譜位置
  const breakthroughFired = checkBreakthroughMilestones(s);
  if(breakthroughFired){
    s.breakthroughEventLog = breakthroughFired;
    // 【建議,非強制定案】至少一次破格與角色卡(尤其父母)好感度/關係史產生連動，讓突破感有具體的敘事回饋
    const parent = s.characters.find(c=>c.relation==="父親" || c.relation==="母親");
    if(parent){
      parent.affinity = clamp(parent.affinity + rnd(2,5), 0, 100);
      appendNpcSharedMemory(parent, `你身上有些什麼不一樣了（${breakthroughFired.label}）`);
    }
  }

  const cs = r.conscientiousness_shift||{};
  ["selfDiscipline","prudence","achievement","responsibility","teamSolo"].forEach(k=>{
    s.conscientiousness[k] = clamp(s.conscientiousness[k]+(cs[k]||0),0,100);
  });

  // 八、興趣系統v1（9/16新增）：AI只分類，候選成立/投入度/自律加成/副業契機一律由程式計算
  applyInterestEvent(s, r.interest_event);
  sweepInterestDecay(s);

  if(r.revealed_key_event && s.keyEvent) s.keyEvent.revealed = true;
  if(r.college_location_choice && !s.collegeLocation){
    s.collegeLocation = r.college_location_choice;
    // 5.5解鎖時機：大學選外縣市/出國，自動解鎖三餐全部三個選項
    if(!s.mealFullyUnlocked && (s.collegeLocation==="外縣市" || s.collegeLocation==="出國")){
      s.mealFullyUnlocked = true; s.mealJustUnlocked = true;
    }
  }
  // 七、7.1.5（9/16改版）：deathForeshadowed現在由rollAnnualDeathCheck()在advanceStructuredTime裡直接設定，
  // 不再讀AI回傳的foreshadow_death（AI不再自行判斷要不要埋前兆，這個欄位已從schema移除）

  // 七、7.3.3（2026-09-23修正）：fertilityJourney先前從未被寫入(QA手冊34.3已記錄)，AI無輸出管道回寫進度，
  // 導致7.6.2「不孕症走到第四階段」這個婚姻危機觸發條件永遠無法成立。四階段的節奏由AI敘事決定(7.3.2)，
  // 所以改為讀AI新回傳的fertility_stage_update當作AI輸出管道，程式只負責記錄目前階段+偵測「剛進入第四階段」
  if(typeof r.fertility_stage_update === "number"){
    const prevStage = s.fertilityJourney ? s.fertilityJourney.stage : 0;
    s.fertilityJourney = { stage: r.fertility_stage_update, updatedTurn: s.turnCount };
    if(r.fertility_stage_update===4 && prevStage!==4) s.justReachedFertilityStage4 = true;
  }

  // 財富真實金額制：先用「跨過的月份數」結算舊的月收支，再套用這回合新的職業/支出/一次性交易
  const monthsCrossed = structured ? (timeCtx.monthsCrossed||0) : Math.round((r.age_advance||0)*12);
  if(monthsCrossed>0){
    // 十二、12.12（2026-09-20新增）：tenure_months隨月份邊界累加，供12.5升遷年資門檻／12.3薪資年資加成使用
    if(s.careerStatus===CAREER_STATUS.EMPLOYED) s.tenureMonths = (s.tenureMonths||0) + monthsCrossed;
    const totalExpenses = s.monthlyExpenses.reduce((sum,e)=>sum+e.amount,0);
    // 3.4.8 基本生活開銷：所有人生階段皆適用，依居住狀態決定，不再以occupationCategory為開關
    const livingCost = computeBaseLivingCost(s); // 3.4.11：已內含household共同生活分攤係數與子女扶養費
    // 三、3.4.11（2026-09-20新增）：household合併收入＝玩家個人月收入＋配偶月收入(若已婚)。配偶收入獨立追蹤(s.spouseIncome)，
    // 不直接併進s.monthlyIncome，避免玩家轉職時job_change覆寫monthlyIncome連帶把配偶收入也洗掉
    const householdMonthlyIncome = s.monthlyIncome + (s.spouseIncome||0);
    let net = Math.round((householdMonthlyIncome - totalExpenses - livingCost) * monthsCrossed);
    // 5.5存款下限保護（9/14新增）：學生時期(尚無正職)存款不能變成負值，修正原本會出現NT$-35,950這種不合理負債的bug
    if(!s.occupationCategory && s.cash + net < 0) net = -s.cash;
    s.cash += net;
    s.lastSettlement = { months: monthsCrossed, net, income:householdMonthlyIncome, expenses:totalExpenses+livingCost };
    // 資產模型（9/14新增）：房貸每月攤還本金（不含利息，簡化模型），還清時自動移除房貸支出項
    if(s.mortgageBalance>0){
      const mortgagePayment = s.monthlyExpenses.find(e=>e.label==="房貸")?.amount || 0;
      s.mortgageBalance = Math.max(0, s.mortgageBalance - mortgagePayment*monthsCrossed);
      if(s.mortgageBalance===0){
        s.monthlyExpenses = s.monthlyExpenses.filter(e=>e.label!=="房貸");
      }
    }
  } else {
    s.lastSettlement = null;
  }

  // 十二、職涯系統（2026-09-20新增，取代原本job_change由AI自由回報occupation_category/monthly_salary的舊機制）：
  // 求職/轉職/升遷/裁員/創業/退休全部改由結構化彈窗處理，觸發檢查見checkCareerTriggers(s)，AI不再回報薪資或職業類別
  checkCareerTriggers(s);
  (r.expense_change||[]).forEach(ec=>{
    if(!ec.label) return;
    if(ec.action==="end"){
      s.monthlyExpenses = s.monthlyExpenses.filter(e=>e.label!==ec.label);
    } else {
      const existing = s.monthlyExpenses.find(e=>e.label===ec.label);
      if(existing) existing.amount = ec.monthly_amount ?? existing.amount;
      else s.monthlyExpenses.push({ label:ec.label, amount: ec.monthly_amount||0 });
    }
  });
  (r.one_time_transaction||[]).forEach(tx=>{
    if(typeof tx.amount !== "number") return;
    // 5.5存款下限保護（9/14新增）：學生時期消費若超過目前存款，這筆消費「不會發生」，不是扣成負值
    if(!s.occupationCategory && tx.amount<0 && Math.abs(tx.amount) > s.cash) return;
    s.cash += tx.amount;
  });
  if(r.housing_choice && r.housing_choice.type && r.housing_choice.type!==(s.housing?.type)){
    const wasOwn = s.housing?.type==="own";
    const nowOwn = r.housing_choice.type==="own";
    // 七、7.5.3買房頭期款門檻檢查（9/15新增，取代原本無客戶端強制檢查的P2缺口）：
    // 現金不夠付頭期款，這次買房「不會成立」，整個housing_choice都不處理，狀態維持原樣，不會扣款也不會產生房產/房貸
    let purchaseBlocked = false;
    if(nowOwn && !wasOwn){
      const prospectiveMonthlyPayment = r.housing_choice.monthly_amount||0;
      const prospectiveMortgage = prospectiveMonthlyPayment*240;
      const prospectivePropertyValue = Math.round(prospectiveMortgage/0.8);
      const prospectiveDownPayment = prospectivePropertyValue - prospectiveMortgage;
      if(s.cash < prospectiveDownPayment) purchaseBlocked = true;
    }
    if(!purchaseBlocked){
      // 4.3事件狀態機制：客戶端結構化判斷「搬出家裡」「買房」，不假手AI
      if((r.housing_choice.type==="rent" || r.housing_choice.type==="own") && s.milestones.moved_out!=="completed"){
        s.milestones.moved_out = "completed";
        // 四、4.1.2（2026-09-20新增）：搬出家裡是解除原生家庭cohabiting標記的時機之一
        s.characters.filter(c=>/^父母|^手足|^隔代教養/.test(c.origin||"")).forEach(releaseCohabiting);
      }
      if(nowOwn && s.milestones.home_purchase!=="completed") s.milestones.home_purchase = "completed";
      // 資產模型（9/14新增）：賣房/轉租時，房產淨值扣掉剩餘房貸後變現為現金；買房時，估算房貸本金與房產市值，頭期款從現金扣除
      if(wasOwn && !nowOwn){
        s.cash += (s.propertyValue - s.mortgageBalance); // 賣房變現：市值減掉剩餘房貸，差額入帳
        s.propertyValue = 0;
        s.mortgageBalance = 0;
      }
      s.housing = { type:r.housing_choice.type, monthlyCost:r.housing_choice.monthly_amount||0 };
      s.monthlyExpenses = s.monthlyExpenses.filter(e=>e.label!=="房租" && e.label!=="房貸");
      if(r.housing_choice.monthly_amount>0){
        s.monthlyExpenses.push({ label: nowOwn ? "房貸" : "房租", amount:r.housing_choice.monthly_amount });
      }
      if(nowOwn && !wasOwn){
        // 簡化假設（測試參數，非設計文件定案）：20年期房貸、不含利息、貸款成數80%(LTV)
        const monthlyPayment = r.housing_choice.monthly_amount||0;
        s.mortgageBalance = monthlyPayment*240;
        s.propertyValue = Math.round(s.mortgageBalance/0.8);
        const downPayment = s.propertyValue - s.mortgageBalance;
        s.cash -= downPayment; // 頭期款從現金扣除
      }
    }
  }

  (r.new_characters||[]).forEach(nc=>{
    if(!nc.name) return;
    const exists = s.characters.find(c=>c.name===nc.name);
    if(exists){ exists.active=true; exists.lastTurn=s.turnCount; return; }
    s.characters.push({
      name:nc.name, relation:nc.relation||"", traits:nc.traits||"",
      affinity: clamp(nc.initial_affinity ?? 50,0,100),
      summary:"", lastTurn:s.turnCount, active:true, isChild:!!nc.is_child,
      origin: nc.origin||"", // 四、4.1（9/19新增）：認識時間／來源，AI建立新角色卡時提供
      // 七、7.3.5前置需求（2026-09-20新增）：子女出生/領養當下年齡為0，供成長節點與3.4.11扶養費三級判斷共用；
      // 四、4.1.2（2026-09-20新增）：子女預設同住(cohabiting)，直到7.3.5.2「成年離家」節點解除
      age: nc.is_child ? 0 : undefined,
      cohabiting: !!nc.is_child,
      parentingLog: nc.is_child ? [] : undefined
    });
    // 四、4.2.2（9/19新增）：is_child是既有結構化訊號，生育/領養自動判定完成
    if(nc.is_child && s.milestones.first_child!=="completed") s.milestones.first_child = "completed";
  });
  // 4.1.1顯示規則（2026-09-22改版，取代原本「每次互動只要有變就跳」的洗版式做法）：三層優先序——
  // 第1層戀愛狀態轉換／第2層關係狀態文字級距改變，當回合必定提示；第3層一般關係值增減，每位NPC累積尚未提示過的
  // 變化量（relationshipHintAccum），累積絕對值達RELATIONSHIP_HINT_ACCUM_THRESHOLD才提示一次並歸零。
  // 每回合最多顯示RELATIONSHIP_HINT_MAX_PER_TURN則，依tier排序取前幾則，沒被選中的（tier3的累積值）繼續保留，不丟棄
  const beforeRelationship = new Map(s.characters.map(c=>[c.name, { romanceStatus:c.romanceStatus||null, label:relationshipStatusLabel(c) }]));
  const relationshipHintCandidates = [];
  (r.character_updates||[]).forEach(cu=>{
    const c = s.characters.find(x=>x.name===cu.name);
    if(!c) return;
    const before = beforeRelationship.get(cu.name) || { romanceStatus:c.romanceStatus||null, label:relationshipStatusLabel(c) };
    const delta = cu.affinity_delta||0;
    c.affinity = clamp(c.affinity + delta,0,100);
    appendNpcSharedMemory(c, cu.summary_add);
    c.lastTurn = s.turnCount; c.active = true;
    applyRomanceSignal(s, c, cu.romantic_signal); // 四、4.4：AI只給positive/negative分類，狀態機轉換由客戶端判斷
    const nowStatus = c.romanceStatus||null;
    if(nowStatus !== before.romanceStatus){
      const transitionText = {
        ambiguous:`你和${c.name}之間，好像開始有點曖昧了`,
        dating:`你和${c.name}正式開始交往了`,
        stable:`你和${c.name}的感情穩定了下來`,
        breakup:`你和${c.name}，分開了`
      }[nowStatus];
      if(transitionText){ relationshipHintCandidates.push({ tier:1, text:transitionText }); return; }
    }
    const nowLabel = relationshipStatusLabel(c);
    if(nowLabel !== before.label){
      relationshipHintCandidates.push({ tier:2, text:`和${c.name}的關係好像不一樣了，現在更像是「${nowLabel}」` });
      return;
    }
    if(delta!==0){
      c.relationshipHintAccum = (c.relationshipHintAccum||0) + delta;
      if(Math.abs(c.relationshipHintAccum) >= RELATIONSHIP_HINT_ACCUM_THRESHOLD){
        const positive = c.relationshipHintAccum > 0;
        relationshipHintCandidates.push({ tier:3, text: positive ? `和${c.name}的關係更近了一些` : `和${c.name}的關係有點疏遠了` });
        c.relationshipHintAccum = 0;
      }
    }
  });
  // 四、4.3事件狀態機制：先依這回合最新的age刷新鎖定狀態，AI的回報才不會被「上一輪」的舊locked狀態誤擋
  refreshMilestoneLocks(s);
  // AI只能回報非auto的5個里程碑（信用卡/打工/戀愛/創業/結婚），且只能設completed/skipped，
  // 不能繞過客戶端的locked狀態，也不能動auto:true那5個（那5個完全由客戶端結構化判斷，見上方各處）
  const AI_REPORTABLE_MILESTONES = MILESTONE_DEFS.filter(d=>!d.auto).map(d=>d.id);
  (r.milestone_updates||[]).forEach(mu=>{
    if(!mu) return;
    const reportable = AI_REPORTABLE_MILESTONES.includes(mu.id);
    // 2026-09-20新增：first_child／home_purchase／moved_out這3個auto:true項目，額外開放AI只能回報skipped，
    // completed仍完全由客戶端結構化判斷（見下方各處直接寫s.milestones.xxx="completed"的既有邏輯），不受這裡影響
    const skipOnly = SKIP_ONLY_MILESTONES.includes(mu.id) && mu.status==="skipped";
    if(!reportable && !skipOnly) return;
    if(mu.status!=="completed" && mu.status!=="skipped") return;
    if(s.milestones[mu.id]==="locked") return;
    if(s.milestones[mu.id]==="completed") return; // 已結構化完成的不可被事後改回skipped
    s.milestones[mu.id] = mu.status;
    if(mu.id==="marriage_decision" && mu.status==="completed") applyMarriageDecisionCompletion(s);
    // 十二、12.11.1（2026-09-22補充）：家長退休是接手家業的第二個觸發來源
    if(mu.id==="parent_retirement" && mu.status==="completed") checkFamilyBusinessOnParentRetirement(s);
  });

  demoteStaleCharacters(relationshipHintCandidates); // 四、4.1.1：同住緩降造成的級距改變併入同一批候選一起排序/限額

  // 四、4.5（2026-09-20修正，QA手冊34.2「人生階段邊界回合的chronicle條目歸屬誤植」）：
  // updateLifeTrajectory()（內含ensureStageTransition的段落切換偵測）必須在這回合的chronicle.push()之前執行，
  // 否則階段切換偵測讀到的chronicle.length會已經包含這回合新增的條目，導致條目被誤歸進即將凍結的舊階段。
  // 提前到這裡執行後，切換偵測看到的是「上一回合為止」的舊長度，這回合稍後push的條目會落在新階段的
  // chronicleStart之後，正確歸屬到這回合實際所屬的新階段（技術判斷：事件發生在轉換當下，算新階段，非設計文件明文定案，可覆寫）。
  // forceEnding時的最後一段凍結改由takeTurn()呼叫AI之前的freezeFinalLifeStageForEnding()處理，這裡不重複凍結。
  if(!forceEnding) updateLifeTrajectory(s);
  // 六、6.2：填上freezeStageTrajectory()原本承接的空陣列——這回合若有破格時刻成立，記進目前(可能是剛切換的新)人生階段
  if(breakthroughFired && s.stageAccum) s.stageAccum.breakthroughEvents.push(breakthroughFired.label);

  const tagAge = structured ? s.age : ageAtEvent;
  const tagLabel = structured ? timeCtx.label : null;

  // 四、4.2.2（9/19新增）：achievement/setback類型受每人生階段2次上限管制，程式擋下超額觸發時整個不記錄，
  // 避免AI過度觸發把履歷洗成流水帳；其餘類型（既有里程碑等）不受影響，維持原本行為
  // 四、4.2.3（9/19改版）：不再設全域總量上限、不做FIFO淘汰——總量已由上面的分階段2次上限自然封頂（8階段×2＝16則），
  // 取代原本「超過10則捨棄最舊」的做法（會優先丟掉童年/學生時期紀錄，讓死亡結局判定讀不到早年人生軌跡）
  if(r.major_event_summary && shouldRecordJudgedMajorEvent(s, r.major_event_type)){
    s.chronicle.push(`（${tagLabel || (tagAge+"歲")}）${r.major_event_summary}`);
  }

  // bug修正（9/14，人生草稿0914測試.pdf）：結算顯示的「目前存款」之前是每次都讀取最新的s.cash，
  // 導致歷史回合全部顯示同一個（最新的）數字。這裡把「這回合結算完當下」的存款快照存進settlement，
  // 讓每一則日記顯示自己那個時間點的正確存款，不是被之後回合覆蓋的最新值。
  if(s.lastSettlement) s.lastSettlement.balanceAfter = s.cash;

  // 九、大學科系系統（9/16新增）：放在財務結算之後，確保lowCashStreak判斷的是這回合結算完的最新現金水位
  sweepUniversityState(s);
  // 七、7.3.5（2026-09-20新增）：子女成長節點檢查，不依賴大學狀態，任何人生階段都可能有子女
  checkParentingGrowthNode(s);
  // 七、7.6（2026-09-20新增）：關係投入節點＋婚姻危機候選檢查
  checkRelationshipInvestmentNode(s);
  sweepMarriageCrisisCandidate(s);
  // 七、7.6.1.1（2026-09-22新增）：同居觸發入口檢查
  checkCohabitationOffer(s, actionText);

  // 可見數值變化顯示（9/15新增）：算出這回合實際變化量（含所有倍率/邊際遞減/衰退後的最終結果），四捨五入後只保留真的有變化的項目
  const statChanges = {};
  Object.keys(VISIBLE_STAT_LABELS).forEach(k=>{
    const after = k==="appearance" ? s.appearance : s.stats[k];
    const diff = Math.round(after - beforeVisibleStats[k]);
    if(diff!==0) statChanges[k] = diff;
  });

  // 四、4.1.1：候選依tier排序（1戀愛狀態轉換／2級距改變／3一般累積），每回合最多顯示RELATIONSHIP_HINT_MAX_PER_TURN則；
  // Array.prototype.sort為穩定排序，同tier內維持原本互動發生的順序
  const relationshipHints = relationshipHintCandidates
    .slice()
    .sort((a,b)=>a.tier-b.tier)
    .slice(0, RELATIONSHIP_HINT_MAX_PER_TURN)
    .map(h=>h.text);
  // 四、4.2.1.1（9/19新增）：AI每回合順便回傳turn_summary（1-2句話），供這則日記日後被擠出「最近3回合」視窗時使用，不用另外呼叫API生成
  s.log.push({age:tagAge, timeLabel:tagLabel, text:r.narrative, turnSummary:r.turn_summary||"", settlement:s.lastSettlement, statChanges, relationshipHints});
  // 介面：回憶錄（9/19新增，回應「畫面上舊日記消失」的困擾）：上限從60大幅提高到2000，
  // 足夠涵蓋單一人生全程(~1200-1400回合)不流失；每世reincarnate/succeedAsChild時log都會重置為[]，不會跨世累積
  if(s.log.length>2000) s.log.shift();

  s.choices = r.choices || [];

  // 七、7.1.5（9/16改版）：死亡結局現在完全由client端的forceEnding決定，AI不能自行發起結局——
  // 取代原本「意外死亡需滿足19歲以上+已有前兆」的防呆邏輯，因為AI已經不再有判斷「要不要死」的空間，只剩forceEnding這一道閘門
  if(r.is_ending && forceEnding){
    s.phase = "ending";
    // 七、7.1.4（9/20改版）：不再有title/summary，改為三層結構的人生總結
    s.ending = assembleEnding(s, r);
  }
}

async function startLife(){
  // 十、10.3.4：全新人生在正式開始這一刻才領新手禮包（開場建角7步不扣點，反覆重骰也不會重複領）
  const ap = ensureAP(state);
  if(ap.giftPending){
    ap.giftPending = false;
    const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
    if(key && await claimNewLifeGift(key)) ap.gift = AP_NEW_LIFE_GIFT;
  }
  state.phase = "playing";
  render(true);
  // 二、2.2（2026-09-23修正）：原本這句文字含「暑假」二字，會被detectTimeSkipIntent()誤判成跳過指令，
  // 導致第一回合就隨機跳2~4段；改用timeState.prologue旗標讓這一回合完全不經過跳過判定/段落推進
  takeTurn("（人生正式開始：15歲的你，在高中開學前的暑假最後一天。）", 0);
}

function reincarnate(){
  const bonusStat = pick(["health","knowledge","network","expression","savings"]);
  const carry = { reincarnations:(state.reincarnations||0)+1,
    chronicleCarry: `前世走完了一生${state.ending?.epitaph ? "，最後留下一句：「"+state.ending.epitaph+"」" : ""}，帶著一絲餘蔭轉生。`,
    name: state.name, gender: state.gender,
    ap: ensureAP(state) }; // 十、10.3.6（2026-09-23使用者確認轉世丹＝restart_item）：點數全部保留，「第X回合」歸零
  if(bonusStat==="savings") carry.savingsCarry = 5; else carry[bonusStat] = 8; // 9/19：5000是9/14學生零用錢改遊戲幣單位制時漏改的殘留NT$量級數字，一併換算(÷1000)避免轉生後現金爆量失真
  state = newRoll(carry, null);
  saveGame();
  render();
}

function economicTierForSavingsAmount(savings){
  // 9/19隨3.4整章遊戲幣單位改版同步÷1000
  if(savings<200) return "清寒";
  if(savings<3000) return "小康";
  return "富裕";
}
function rollEconomicTierForced(tier){
  if(tier==="清寒") return { tier, network:rnd(15,35), allowance:STUDENT_ALLOWANCE_UNITS["清寒"], savings:STUDENT_ALLOWANCE_UNITS["清寒"], ...rollFamilyFinance("清寒") };
  if(tier==="小康") return { tier, network:rnd(30,55), allowance:STUDENT_ALLOWANCE_UNITS["小康"], savings:STUDENT_ALLOWANCE_UNITS["小康"], ...rollFamilyFinance("小康") };
  return { tier:"富裕", network:rnd(50,75), allowance:STUDENT_ALLOWANCE_UNITS["富裕"], savings:STUDENT_ALLOWANCE_UNITS["富裕"], ...rollFamilyFinance("富裕") };
}
function deriveParentTraitFromAffinity(aff, summary){
  let tone;
  if(aff>=70) tone = "跟你感情很好，願意溝通、給空間、支持你的決定";
  else if(aff>=45) tone = "感情普通，日常互動平淡但不算疏離";
  else tone = "感情有些疏遠，報喜不報憂、情感表達少";
  return summary ? tone+"；過去點滴："+summary : tone;
}
function eligibleChildren(){
  return state.characters.filter(c=>c.isChild);
}
function succeedAsChild(childName){
  const prev = state;
  const child = prev.characters.find(c=>c.name===childName && c.isChild);
  if(!child) return;
  // 2026-09-22修正：配偶認定改用romanceStatus==="married"（比照7.6.2sweepMarriageCrisisCandidate既有寫法），
  // 不再用relation字串regex比對——離婚後的「前配偶」relation仍含「配偶」兩字，regex會誤判成現任配偶
  const spouse = prev.characters.find(c=>c.romanceStatus==="married" && c.active!==false);
  const otherKids = prev.characters.filter(c=>c.isChild && c.name!==childName);

  const deceasedRelation = prev.gender==="男" ? "父親" : "母親";
  const characters = [];
  characters.push({
    name: prev.name, relation: deceasedRelation,
    traits: deriveParentTraitFromAffinity(child.affinity, child.summary),
    affinity: child.affinity, summary: child.summary||"", lastTurn:0,
    // 2026-09-22修正（bug回報：世代傳承後上一代主角被當成活著的父母）：
    // 上一代主角在傳承當下已經過世，標記deceased/active:false/healthStage:4(過世)、cohabiting:false，
    // 並直接視為estateSettled(遺產已經透過下面econ=rollEconomicTierForced(...prev.cash)在傳承流程內一次結算完畢)，
    // 這樣13.5 rollParentHealthStageAdvance()的過濾條件(active!==false && !deceased)會自然跳過這張角色卡，
    // 不會再被判定「需要協助/失能長照/再過世一次」
    active:false, deceased:true, healthStage:4, estateSettled:true, isChild:false,
    origin: "父母，從出生起", cohabiting: false, // 四、4.1（9/19新增）：世代傳承後從新主角視角重新寫，不沿用上一世「怎麼認識」的舊故事
    age: prev.age // 十三、13.5.1：沿用上一世死亡當下的年齡，比隨機骰更準確
  });
  let familyStructure;
  if(spouse){
    characters.push({
      name: spouse.name, relation: deceasedRelation==="父親" ? "母親" : "父親",
      // 2026-09-22修正（bug回報：在世配偶被當成新角色重新產生）：年齡/健康階段/同住狀態/關係值一律沿用傳承前資料，不重新骰——
      // married的配偶在目前架構下不會有獨立死亡判定，傳承當下必然還在世，也不會被finalizeDivorce解除同住，cohabiting因此必為true
      traits: spouse.traits||"忙碌但關心家裡", affinity: spouse.affinity, summary: spouse.summary||"",

  state = {

    keyEvent:null,

    stats:{ health, knowledge:talent, network:econ.network, expression },

    milestones: initMilestones(),

// 十、10.3.6／10.3.7（2026-09-23新增，取代原本hardReset()「清空這個slot、同格重新取名」）：
// 「就此闔卷」(死亡且不傳承,reason="ended")與「刪除這段人生」(reason="deleted")都讓這條人生結束——
// 移到唯讀的人生回顧區、空出格子；禮包點消失，購買點全部移到金鑰錢包（由Worker在/archive裡加總）
async function endLife(reason){
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  const slotRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
  const slot = slotRaw!==null ? Number(slotRaw) : null;
  const ap = ensureAP(state);
  const endedAt = Date.now();
  const id = endedAt.toString(36) + Math.random().toString(36).slice(2,8);
  const meta = { name:state.name, age:state.age, stage:stageLabel(state.age), reincarnations:state.reincarnations||0, reason, endedAt };
  const purchased = ap.purchased;
  const archivedState = JSON.parse(JSON.stringify(state));
  archivedState.snapshot = null;
  archivedState.ap = { daily:0, gift:0, purchased:0, lastRefillDate:ap.lastRefillDate };
  try{ localStorage.removeItem(STORAGE_KEY+(slot!==null?":"+slot:"")); }catch(e){}
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} // 相容改版前沒有slot後綴的殘留資料
  try{ localStorage.removeItem(ACTIVE_SLOT_STORAGE_NAME); }catch(e){}
  cloudSyncStatus = null;
  if(!key || slot===null){ state = { phase:"keyChoice" }; render(); return; } // 防呆：理論上進得了遊戲畫面一定有金鑰+slot
  let archivedOnCloud = false;
  try{
    const res = await fetch(WORKER_URL+"archive", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ key, slot, id, meta, purchased, state: archivedState })
    });
    const data = await res.json();
    archivedOnCloud = res.ok && data && data.success===true;
  }catch(e){ console.warn("雲端封存人生失敗，改存本機", e); }
  if(!archivedOnCloud){
    try{
      const list = JSON.parse(localStorage.getItem(ARCHIVE_LOCAL_PREFIX+key) || "[]");
      list.push({ id, meta, state: archivedState });
      localStorage.setItem(ARCHIVE_LOCAL_PREFIX+key, JSON.stringify(list));
    }catch(e){ console.warn("本機封存也失敗（可能超過瀏覽器容量）", e); }
  }
  await showSlotPicker(key);
}

// ---------- RENDER ----------
function render(loadingTurn){
  const app = document.getElementById("app");
  if(!state){ app.innerHTML = `<div class="center-screen"><p style="color:var(--ink-soft);">載入中…</p></div>`; return; }
  if(state.phase==="keyChoice"){ app.innerHTML = renderKeyChoice(); bindKeyChoice(); ensureDebugUI(); return; }
  if(state.phase==="keyInput"){ app.innerHTML = renderKeyInput(); bindKeyInput(); ensureDebugUI(); return; }
  if(state.phase==="keyReveal"){ app.innerHTML = renderKeyReveal(); bindKeyReveal(); ensureDebugUI(); return; }
  if(state.phase==="slotPicker"){ app.innerHTML = renderSlotPicker(); bindSlotPicker(); ensureDebugUI(); return; }
  if(state.phase==="identity"){ app.innerHTML = renderIdentityForm(); bindIdentityForm(); ensureDebugUI(); return; }
  if(state.phase==="setup"){ app.innerHTML = renderSetupRoll(); bindSetupRoll(); ensureDebugUI(); return; }
  if(state.phase==="lifestyle"){ app.innerHTML = renderLifestyleChoice(); bindLifestyleChoice(); ensureDebugUI(); return; }
  if(state.phase==="ending"){ app.innerHTML = renderEnding(); bindEnding(); ensureDebugUI(); return; }
  if(state.phase==="archiveList"){ app.innerHTML = renderArchiveList(); bindArchiveList(); ensureDebugUI(); return; }
  if(state.phase==="archiveView"){ app.innerHTML = renderArchiveView(); bindArchiveView(); ensureDebugUI(); return; }
  // 十、10.3.5：進入遊戲畫面時檢查台灣日期，跨日才補每日池（不用排程）
  if(refillDailyIfNeeded(state)) saveGame();
  app.innerHTML = renderPlaying(loadingTurn);
  bindPlaying();
  const j = document.querySelector(".journal");
  if(j) j.scrollTop = j.scrollHeight;
  ensureDebugUI();
}

// 雲端(Worker /archives)＋本機後備副本(雲端封存失敗時才會有)合併顯示，依結束時間新到舊
async function showArchiveList(key){
  let items = [];
  try{
    const res = await fetch(WORKER_URL+"archives?key="+encodeURIComponent(key));
    const data = await res.json();
    if(data && data.success && Array.isArray(data.archives)) items = data.archives.map(a=>({ id:a.id, meta:a.meta||{}, source:"cloud" }));
  }catch(e){ console.warn("讀取人生回顧清單失敗", e); }
  try{
    JSON.parse(localStorage.getItem(ARCHIVE_LOCAL_PREFIX+key) || "[]").forEach(a=>{
      if(!items.some(x=>x.id===a.id)) items.push({ id:a.id, meta:a.meta||{}, source:"local" });
    });
  }catch(e){}
  items.sort((a,b)=>(b.meta.endedAt||0)-(a.meta.endedAt||0));
  state = { phase:"archiveList", items };
  render();
}
function renderArchiveList(){
  const rows = state.items.map(a=>{
    const m = a.meta;
    const d = m.endedAt ? new Date(m.endedAt) : null;
    const dateText = d ? `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}` : "";
    return `<button class="ghost-btn archive-btn" data-id="${escapeHtml(a.id)}" data-source="${a.source}" style="display:block;width:100%;text-align:left;margin:6px 0;">
      ${escapeHtml(m.name||"")}・第${(m.reincarnations||0)+1}世・${m.age||"?"}歲・${m.reason==="deleted"?"中途放下":"走完一生"}　<span style="font-size:11px;color:var(--ink-soft);">${dateText}</span>
    </button>`;
  }).join("");
  return `
  <div class="center-screen">
    <h2>人生回顧</h2>
    <p style="color:var(--ink-soft);font-size:12.5px;">已結束的人生只能翻閱，不能繼續玩</p>
    <div style="text-align:left;">${rows || `<p style="color:var(--ink-soft);">還沒有已結束的人生。</p>`}</div>
    <button class="ghost-btn" id="btn-archive-back" style="margin-top:10px;">← 回到人生選擇</button>
  </div>`;
}
function bindArchiveList(){
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  document.getElementById("btn-archive-back").onclick = ()=>showSlotPicker(key);
  document.querySelectorAll(".archive-btn").forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      let archived = null;
      if(btn.dataset.source==="cloud"){
        try{
          const res = await fetch(WORKER_URL+"archive?key="+encodeURIComponent(key)+"&id="+encodeURIComponent(id));
          const data = await res.json();
          if(data && data.success) archived = data.state;
