};
const IDLE_NEW_FRIEND_LINE = "參加了一場聚會，認識了新朋友。";
const IDLE_MAX_NEW_CHARACTERS = 2;       // 10.6.3【定案】每次放置最多新增2位
const IDLE_ROLLBACK_COST = 5;            // 10.6.5【定案】
const IDLE_PERSONALITY_SHARE = 0.75;     // 10.6.9【定案,測試參數】75%依性格、25%平均隨機
function idleHasFamily(s){
  return (s.characters||[]).some(c=>!c.deceased && (c.romanceStatus==="married" || (c.cohabiting && ["dating","stable"].includes(c.romanceStatus)) || (c.isChild && c.active!==false)))
    || idleCaringForParent(s);
}
function idleCaringForParent(s){ return !!s.caringForParentName && (s.characters||[]).some(c=>c.name===s.caringForParentName && !c.deceased); }
// 10.6.9【定案，數字為測試參數】權重公式；「團隊」＝teamSolo，數值越高越偏團隊(對照3.7.3：teamNetworkMult=1+(teamSolo−50)×0.01)
function idleTagWeights(s){
  const c = s.conscientiousness;
  const w = {
    努力: 1+(c.selfDiscipline-50)/50+(c.achievement-50)/100,
    社交: 1+(c.teamSolo-50)/50,
    安逸: 1-(c.achievement-50)/100,
    冒險: 1-(c.prudence-50)/50,
    逃避: 0.5-(c.responsibility-50)/100,
    顧家: 1+(c.responsibility-50)/50
  };
  Object.keys(w).forEach(k=>{ if(w[k]<0.1) w[k] = 0.1; }); // 低於0.1以0.1計
  if(s.stats.health<30){ w.努力 = 0; w.冒險 = 0; }     // 安全規則：健康低於30
  if(!idleHasFamily(s)) w.顧家 = 0;                       // 安全規則：顧家只在有家庭狀態時
  return w;
}
function pickByWeightMap(weights){ // 注意：不可叫weightedPick，會蓋掉開局抽家庭結構用的同名函式
  const keys = Object.keys(weights).filter(k=>weights[k]>0);
  const total = keys.reduce((a,k)=>a+weights[k],0);
  if(!keys.length) return null;
  let r = Math.random()*total;
  for(const k of keys){ if(r<weights[k]) return k; r -= weights[k]; }
  return keys[keys.length-1];
}
function pickIdleTag(s){
  const w = idleTagWeights(s);
  if(Math.random() < IDLE_PERSONALITY_SHARE) return pickByWeightMap(w);
  const avail = Object.keys(w).filter(k=>w[k]>0);
  return pick(avail);
}
// 同一標籤的短句輪流使用，不連續兩回合出現同一句
function nextIdleLine(s, tag){
  s.idleLineIndex = s.idleLineIndex || {};
  const lines = IDLE_LINES[tag];
  let i = ((s.idleLineIndex[tag] ?? -1) + 1) % lines.length;
  if(lines[i]===s.idleLastLine) i = (i+1) % lines.length;
  s.idleLineIndex[tag] = i;
  s.idleLastLine = lines[i];
  return lines[i];
}
// 10.6.9【定案，數字為測試參數】各標籤的數值變化，比手動遊玩保守，都在3.9.2單回合上下限內；不動做事態度光譜與依附風格
function applyIdleTag(s, tag){
  const st = s.stats;
  if(tag==="努力"){
    const wisdomMult = 0.5 + (s.wisdom/200), logicBonus = 1 + (s.logicAbility/400);
    const teamKnowledgeMult = clamp(1+(50-s.conscientiousness.teamSolo)*0.01, 0.5, 1.5);
    const raw = rollKnowledgeRawValue("ordinary", null, s) * wisdomMult * logicBonus * getDisciplineMultiplier(s) * teamKnowledgeMult;
    st.knowledge = clamp(st.knowledge + applyMarginalDiminish(raw, st.knowledge), 0, 100);
    st.health = clamp(st.health - 1, 0, 100);
  } else if(tag==="社交"){
    st.network = clamp(st.network + applyMarginalDiminish(2, st.network), 0, 100);
    st.expression = clamp(st.expression + 1, 0, 100);
    const friend = pick((s.characters||[]).filter(c=>!c.deceased && !c.isChild && !INTIMATE_RELATION_RE.test(c.relation||"") && !c.romanceStatus).concat([null]));
    if(friend) friend.affinity = clamp(friend.affinity + 1, 0, 100);
  } else if(tag==="安逸"){
    st.health = clamp(st.health + 2, 0, 100);
  } else if(tag==="冒險"){
    st.expression = clamp(st.expression + 1, 0, 100);
    st.network = clamp(st.network + applyMarginalDiminish(1, st.network), 0, 100);
    st.health = clamp(st.health - 1, 0, 100);
  } else if(tag==="逃避"){
    st.health = clamp(st.health + 1, 0, 100);
    st.network = clamp(st.network - 1, 0, 100);
  } else if(tag==="顧家"){
    (s.characters||[]).filter(c=>!c.deceased && c.cohabiting && (c.romanceStatus==="married" || c.isChild)).forEach(c=>{ c.affinity = clamp(c.affinity + 2, 0, 100); });
    if(idleCaringForParent(s)) st.health = clamp(st.health - 1, 0, 100);
  }
}

// 每回合結束後把這回合產生的彈窗依序代選；每個決定前都存一份回溯快照(10.6.5)
function idleResolvePendingPopups(s, record){
  const decide = (kind, key, detail)=>{ record.popups.push({ kind, title: IDLE_POPUP_TITLES[kind]||kind, choice: key, label: detail || IDLE_CHOICE_LABELS[key] || key }); };
  // 回溯快照要保留「這個彈窗還沒決定」的狀態：patch把剛清掉的pending欄位放回快照裡，回溯後dispatchPendingModals()會重新跳出
  const snap = (kind, patch)=>{ record.rollbackPoints.push({ kind, title: IDLE_POPUP_TITLES[kind]||kind, snapshot: JSON.stringify(Object.assign({}, s, { snapshot:null, idleRun:null }, patch||{})) }); };
  let guard = 0;
  while(guard++ < 12){
    if(s.mealJustUnlocked){ s.mealJustUnlocked = false; continue; }
    if(s.pendingSideBusinessCardId){
      const card = (s.interestCandidates||[]).find(c=>c.id===s.pendingSideBusinessCardId); s.pendingSideBusinessCardId = null;
      if(card){ snap("sideBusiness", { pendingSideBusinessCardId: card.id }); const k = idleChooseOption(s, IDLE_POPUP_MAP.sideBusiness); card.sideBusinessStatus = k; if(k==="formal") card.sideBusinessSince = s.turnCount; s.sideBusinessEventLog = { category:card.category, choice:k }; decide("sideBusiness", k); }
      continue;
    }
    if(s.pendingMajorSelection){
      s.pendingMajorSelection = false; snap("major", { pendingMajorSelection: true });
      const m = pick(MAJOR_CATEGORIES); const dept = pick(MAJOR_DEPARTMENTS[m.key]); // 16.8：放置期間代選到系別
      enrollInDepartment(s, m.key, dept); decide("major", m.key, `${m.label}・${dept}`); continue;
    }
    if(s.pendingTransferOffer){
      s.pendingTransferOffer = false; snap("transfer", { pendingTransferOffer: true });
      const k = idleChooseOption(s, IDLE_POPUP_MAP.transfer);
      const target = pick(MAJOR_CATEGORIES.filter(m=>m.key!==s.studentMajorGroup && isTransferFeasible(s.age, m.isFiveYearEligible?5:4, s.collegeDelayYearsUsed)));
      if(k==="apply" && target){ const r = resolveTransferOffer(s, "apply", target.key); decide("transfer", k, `申請轉到${target.label}，${r && r.success ? "成功":"沒有成功"}`); }
      else { resolveTransferOffer(s, "stay", null); decide("transfer", "stay"); }
      continue;
    }
    if(s.pendingDualMajorOffer){ s.pendingDualMajorOffer = false; snap("dualMajor", { pendingDualMajorOffer: true }); const k = idleChooseOption(s, IDLE_POPUP_MAP.dualMajor); resolveDualMajorOffer(s, k); decide("dualMajor", k); continue; }
    if(s.pendingDualMajorAbandonOffer){ s.pendingDualMajorAbandonOffer = false; snap("dualAbandon", { pendingDualMajorAbandonOffer: true }); const k = idleChooseOption(s, IDLE_POPUP_MAP.dualAbandon); resolveDualMajorAbandonOffer(s, k); decide("dualAbandon", k); continue; }
    if(s.pendingLeaveOffer){
      const lo = s.pendingLeaveOffer; s.pendingLeaveOffer = null; snap("withdrawal", { pendingLeaveOffer: lo });
      let k = idleChooseOption(s, IDLE_POPUP_MAP.withdrawal); if(k==="leave" && !isAnotherLeaveFeasible(s)) k = "stay";
      resolveWithdrawalOffer(s, k); decide("withdrawal", k); continue;
    }
    if(s.pendingParentingNode){
      const pn = s.pendingParentingNode; s.pendingParentingNode = null; snap("parenting", { pendingParentingNode: pn });
      const child = s.characters.find(c=>c.name===pn.childName); const node = PARENTING_GROWTH_NODES[pn.nodeKey];
      if(child && node){
        const opts = parentingNodeOptionsFor(child, node);
        // 顧家→溫暖最高、努力→要求最高、安逸/逃避→要求最低、社交/冒險→隨機
        const tag = pickIdleTag(s);
        const byWarmth = opts.slice().sort((a,b)=>b.warmth-a.warmth), byDemand = opts.slice().sort((a,b)=>b.demand-a.demand);
        const o = tag==="顧家" ? byWarmth[0] : tag==="努力" ? byDemand[0] : (tag==="安逸"||tag==="逃避") ? byDemand[byDemand.length-1] : pick(opts);
        resolveParentingGrowthNode(s, pn.childName, pn.nodeKey, o.id, ""); decide("parenting", o.id, `${node.label}：${o.text}`);
      }
      continue;
    }
    if(s.pendingMarriageCrisis){
      const mc = s.pendingMarriageCrisis; s.pendingMarriageCrisis = null; snap("marriageCrisis", { pendingMarriageCrisis: mc });
      const k = idleChooseOption(s, IDLE_POPUP_MAP.marriageCrisis); resolveMarriageCrisis(s, mc.spouseName, k); decide("marriageCrisis", k); continue;
    }
    if(s.pendingDivorceSettlement){
      const ds = s.pendingDivorceSettlement; snap("divorce");
      const hasKids = s.characters.some(c=>c.isChild && !c.deceased);
      finalizeDivorce(s, ds.spouseName, s.propertyValue>0 ? "sell" : null, hasKids ? (pickIdleTag(s)==="顧家" ? "primary" : "joint") : null);
      s.pendingDivorceSettlement = null; decide("divorce", "divorce", "完成離婚結算"); continue;
    }
    if(s.pendingRelationshipInvestment){
      const ri = s.pendingRelationshipInvestment; s.pendingRelationshipInvestment = null; snap("relationship", { pendingRelationshipInvestment: ri });
      const k = idleChooseOption(s, IDLE_POPUP_MAP.relationship); resolveRelationshipInvestment(s, ri.partnerName, k); decide("relationship", k); continue;
    }
    if(s.pendingDivorceRecovery){ s.pendingDivorceRecovery = null; snap("divorceRecovery", { pendingDivorceRecovery: true }); const k = idleChooseOption(s, IDLE_POPUP_MAP.divorceRecovery); resolveDivorceRecovery(s, k); decide("divorceRecovery", k); continue; }
    if(s.pendingCohabitationOffer){
      const co = s.pendingCohabitationOffer; s.pendingCohabitationOffer = null; snap("cohabitation", { pendingCohabitationOffer: co });
      const k = idleChooseOption(s, IDLE_POPUP_MAP.cohabitation); resolveCohabitationOffer(s, co.partnerName, k); decide("cohabitation", k); continue;
    }
    if(s.pendingJobOffer){ acceptJobOffer(s); continue; }
    if(s.pendingMajorPurchase){ resolveMajorPurchase(s, false); continue; } // 十七：放置期間重大開銷一律先放回去
    if(s.pendingJobSearch){
      const js = s.pendingJobSearch; s.pendingJobSearch = null; snap("jobSearch", { pendingJobSearch: js });
      // 冒險→隨便投一類；其他→投錄取機率最高的一類(11.4明牌檢定照樣擲骰)
      const tag = pickIdleTag(s);
      const offer = tag==="冒險" ? pick(js.offers) : js.offers.slice().sort((a,b)=>b.probPct-a.probPct)[0];
      const r = resolveJobApplication(s, offer.category, js.isTransfer, { isOverseas: js.isOverseas, foreshadowLine: js.foreshadowLine, creativeBonusPct: js.creativeBonusPct });
      decide("jobSearch", "apply", `投遞${r.category}：擲出${r.roll}／門檻${r.probPct}%，${r.hired ? "錄取":"沒有錄取"}`); continue;
    }
    if(s.pendingPromotionOffer){
      const po = s.pendingPromotionOffer; s.pendingPromotionOffer = null; snap("promotion", { pendingPromotionOffer: po });
      const k = idleChooseOption(s, IDLE_POPUP_MAP.promotion); resolvePromotionOffer(s, k==="accept");
      const log = s.careerEventLog||{}; decide("promotion", k, k==="accept" ? `爭取升遷：擲出${log.roll}／門檻${Math.round(log.probPct)}%，${log.success?"成功":"沒有成功"}` : "維持現狀"); continue;
    }
    if(s.pendingCareerForkOffer){ s.pendingCareerForkOffer = null; snap("careerFork", { pendingCareerForkOffer: {} }); const k = idleChooseOption(s, IDLE_POPUP_MAP.careerFork); resolveCareerForkOffer(s, k); decide("careerFork", k); continue; }
    if(s.pendingBusinessLaunch){
      const bl = s.pendingBusinessLaunch; s.pendingBusinessLaunch = null; snap("businessLaunch", { pendingBusinessLaunch: bl });
      const k = idleChooseOption(s, IDLE_POPUP_MAP.businessLaunch);
      const launched = k==="launch" && launchBusiness(s);
      if(bl && bl.foreshadowLine) closeForeshadowCandidate(s, bl.foreshadowLine, launched);
      decide("businessLaunch", k, launched ? "啟動創業" : (k==="launch" ? "想創業但現金不夠" : "先不創業")); continue;
    }
    if(s.pendingFamilyBusinessOffer){ const fb = s.pendingFamilyBusinessOffer; s.pendingFamilyBusinessOffer = null; snap("familyBusiness", { pendingFamilyBusinessOffer: fb }); const k = idleChooseOption(s, IDLE_POPUP_MAP.familyBusiness); resolveFamilyBusinessOffer(s, fb, k); decide("familyBusiness", k); continue; }
    if(s.pendingBusinessContinuation){
      s.pendingBusinessContinuation = null; snap("businessCont", { pendingBusinessContinuation: {} });
      let k = idleChooseOption(s, IDLE_POPUP_MAP.businessCont); resolveBusinessContinuation(s, k); decide("businessCont", k); continue;
    }
    if(s.pendingRetirementOffer){
      const ro = s.pendingRetirementOffer; s.pendingRetirementOffer = null; snap("retirement", { pendingRetirementOffer: ro });
      const tag = pickIdleTag(s);
      let k;
      if(ro.forced) k = (tag==="努力"||tag==="冒險") ? "semi" : "rest";
      else if(tag==="安逸"||tag==="逃避") k = s.age>=RETIREMENT_CANDIDATE_MIN_AGE ? "on_time" : (canRetireEarly(s) ? "early" : "delay");
      else if(tag==="顧家"||tag==="社交") k = "semi";
      else k = s.age<RETIREMENT_DELAY_MAX_AGE ? "delay" : "on_time";
      resolveRetirementOffer(s, k); decide("retirement", k); continue;
    }
    if(s.pendingEldercareDecision){
      const ec = s.pendingEldercareDecision; snap("eldercare");
      const hasSibling = s.characters.some(c=>c.origin==="手足，從出生起" && !c.deceased);
      const opts = IDLE_POPUP_MAP.eldercare.filter(o=>hasSibling || (o.key!=="split" && o.key!=="limited"));
      const k = idleChooseOption(s, opts); resolveEldercareDecision(s, ec.parentName, k);
      decide("eldercare", k); continue;
    }
    break;
  }
}

// 一回合的放置：時間推進、年度判定(放置模式)、每月結算、標籤效果、既有每回合檢查、彈窗代選
function simulateIdleRound(s, index){
  const record = { i:index, popups:[], rollbackPoints:[], newFriend:false };
  const before = { health:s.stats.health, knowledge:s.stats.knowledge, network:s.stats.network, expression:s.stats.expression, cash:s.cash, age:s.age };
  const stageBefore = bookStageOf(s).label;
  s.turnCount += 1;
  const studyBefore = s.studyCountThisTerm||0, interestBefore = s.interestCountThisTerm||0;
  const adv = advanceStructuredTime("（放置中）");
  record.label = adv.currentLabel || computeTimeLabel(s);
  if(adv.examTriggered && adv.examType==="期末考"){
    // 10.6.3【定案】明牌節點也依性格代選，照樣擲骰，結果寫進摘要
    const check = rollFinalExamCheck(s.stats.knowledge, studyBefore, interestBefore);
    record.popups.push({ kind:"exam", title:"期末考", choice:"exam", label:`擲出${check.roll}，${check.finalScore}分，${check.passed?"通過":"沒過"}` });
    checkNonLeaveGraduationDelay(s, check, interestBefore);
  }
  applyMonthlySettlement(s, adv.monthsCrossed||0);
  const tag = pickIdleTag(s);
  applyIdleTag(s, tag);
  record.tag = tag;
  record.line = nextIdleLine(s, tag);
  record.newFriend = record.line===IDLE_NEW_FRIEND_LINE;
  applyAcuteRecovery(s);
  applyCaregivingTurn(s);
  advanceMajorIllness(s); // 已經在治療中的照常推進；新的重大疾病不判定(rollAnnualIllnessCheck讀idleMode)
  s.lowHealthStreak = s.stats.health<30 ? (s.lowHealthStreak||0)+1 : 0;
  refreshAppearance(s);
  checkCareerTriggers(s);
  sweepUniversityState(s);
  checkParentingGrowthNode(s);
  checkRelationshipInvestmentNode(s);
  sweepMarriageCrisisCandidate(s);
  checkDivorceRecoveryNode(s);
  checkCohabitationOffer(s, "");
  refreshMilestoneLocks(s);
  demoteStaleCharacters(null);
  sweepInterestDecay(s);
  idleResolvePendingPopups(s, record);
  recordMilestoneChronicle(s, record.label);
  const stageAfter = bookStageOf(s).label;
  if(stageAfter!==stageBefore) record.stageChange = `從${stageBefore}進入${stageAfter}`;
  record.changes = {};
  ["health","knowledge","network","expression"].forEach(k=>{ const d = Math.round(s.stats[k]-before[k]); if(d) record.changes[k] = d; });
  const dc = Math.round(s.cash-before.cash); if(dc) record.changes.cash = dc;
  // 每個回合結束都清掉只給AI看一次的事件紀錄，避免累積到回來那一回合
  s.careerEventLog = null; s.universityEventLog = null; s.parentingEventLog = null; s.lifestyleChangeLog = null; s.relationshipInvestmentEventLog = null;
  s.marriageCrisisEventLog = null; s.divorceEventLog = null; s.cohabitationEventLog = null; s.sideBusinessEventLog = null;
  return record;
}
// 跑完整段放置：n回合(已由伺服器/本機算好)；回傳紀錄，存在state.idleRun
function runIdleRounds(s, n){
  s.idleMode = true;
  const startSnapshot = JSON.stringify(Object.assign({}, s, { snapshot:null }));
  const statBefore = { health:s.stats.health, knowledge:s.stats.knowledge, network:s.stats.network, expression:s.stats.expression, cash:s.cash, age:s.age };
  const rounds = [];
  try{
    for(let i=0;i<n;i++){
      if(s.phase!=="playing") break;
      rounds.push(simulateIdleRound(s, i));
    }
  } finally {
    s.idleMode = false;
  }
  const totals = {};
  ["health","knowledge","network","expression"].forEach(k=>{ const d = Math.round(s.stats[k]-statBefore[k]); if(d) totals[k] = d; });
  const dc = Math.round(s.cash-statBefore.cash); if(dc) totals.cash = dc;
  s.idleRun = { rounds, totals, ageFrom: statBefore.age, ageTo: s.age, startSnapshot, rolledBack:false, summary:null, createdAt: s.turnCount };
  s.snapshot = null; // 10.6.6【定案】一般悔棋不能撤銷放置結果
  return s.idleRun;
}
// 10.6.4【定案】關鍵片段：程式挑影響最大的回合(有彈窗決定的優先，其次數值變化總量)，少量回合1-2則、滿35回合最多5則
function pickIdleKeyRounds(rounds){
  const limit = rounds.length<=10 ? 2 : rounds.length<=20 ? 3 : rounds.length<=30 ? 4 : 5;
  const score = r => (r.popups.length*20) + Object.values(r.changes||{}).reduce((a,v)=>a+Math.abs(v),0) + (r.newFriend?5:0);
  return rounds.slice().sort((a,b)=>score(b)-score(a)).slice(0, Math.min(limit, rounds.length)).map(r=>r.i).sort((a,b)=>a-b);
}

// 三、3.4.7（2026-09-28）結算小字：收入、支出分列，支出只列合計。3個月以內照這回合實際推進天數換算、寫「本回合結餘」；
// 超過3個月改成區間總結。舊存檔的紀錄沒有分列數字，維持舊格式
function signed(n){ return (n>=0?"+":"−") + Math.abs(n).toLocaleString(); }
function settlementText(st, cashNow){
  const bal = (st.balanceAfter ?? cashNow).toLocaleString();
  if(st.incomeTotal===undefined) return `本回合結算：${st.months}個月淨${st.net>=0?'收入':'支出'} ${Math.abs(st.net).toLocaleString()}；目前存款 ${bal}`;
  const net = st.rawNet ?? st.net;
  if(st.months > 3) return `這段期間收入約 ${st.incomeTotal.toLocaleString()}，支出約 ${st.expenseTotal.toLocaleString()}，結餘 ${signed(net)}；目前存款 ${bal}`;
  return `${st.student?"零用錢":"收入"} +${st.incomeTotal.toLocaleString()}，生活開銷 −${st.expenseTotal.toLocaleString()}，本回合結餘 ${signed(net)}；目前存款 ${bal}`;
}
// 三、3.4.7（2026-09-28）：每月收入、每月生活開銷(基本開銷＋房租房貸＋扶養費＋慢性病費用)，生活方式小卡與手頭狀態共用
function monthlyBudget(s){
  const income = s.monthlyIncome + (s.spouseIncome||0) + computeSideBusinessIncome(s);
  const expenses = s.monthlyExpenses.reduce((sum,e)=>sum+e.amount,0) + computeBaseLivingCost(s);
  return { income: Math.round(income), expenses: Math.round(expenses) };
}
// 五、5.5（2026-09-28）當月手頭狀態：依結餘÷收入分四級，學生期與出社會後共用；只給AI敘事參考
const MONEY_SITUATION_COMFORT_RATIO = 0.25; // 【測試參數，待驗證】
function computeMoneySituation(s){
  const { income, expenses } = monthlyBudget(s);
  const bal = income - expenses;
  if(bal < 0) return s.cash > 0 ? "吃緊" : "見底";
  return (income > 0 && bal/income >= MONEY_SITUATION_COMFORT_RATIO) ? "寬裕" : "剛好";
}
// 三、3.4.7週期性收支結算（2026-09-27從applyResult抽出，一般回合與放置代活(10.6.9「照3.4.7一般每月收支結算」)共用）
function applyMonthlySettlement(s, monthsCrossed){
  if(monthsCrossed>0){
    // 十二、12.12（2026-09-20新增）：tenure_months隨月份邊界累加，供12.5升遷年資門檻／12.3薪資年資加成使用
    if(s.careerStatus===CAREER_STATUS.EMPLOYED) s.tenureMonths = (s.tenureMonths||0) + monthsCrossed;
    const totalExpenses = s.monthlyExpenses.reduce((sum,e)=>sum+e.amount,0);
    // 3.4.8 基本生活開銷：所有人生階段皆適用，依居住狀態決定，不再以occupationCategory為開關
    const livingCost = computeBaseLivingCost(s); // 3.4.11：已內含household共同生活分攤係數與子女扶養費
    // 三、3.4.11（2026-09-20新增）：household合併收入＝玩家個人月收入＋配偶月收入(若已婚)。配偶收入獨立追蹤(s.spouseIncome)，
    // 不直接併進s.monthlyIncome，避免玩家轉職時job_change覆寫monthlyIncome連帶把配偶收入也洗掉
    // 八、8.7（2026-09-27）：副業三選一的後續差異，接零星案／正式副業各有一筆週期性副業收入，見computeSideBusinessIncome()
    const householdMonthlyIncome = s.monthlyIncome + (s.spouseIncome||0) + computeSideBusinessIncome(s);
    const rawNet = Math.round((householdMonthlyIncome - totalExpenses - livingCost) * monthsCrossed);
    let net = rawNet;
    // 5.5存款下限保護（9/14新增）：學生時期(尚無正職)存款不能變成負值，修正原本會出現NT$-35,950這種不合理負債的bug
    if(isStudentPhase(s) && s.cash + net < 0) net = -s.cash;
    s.cash += net;
    // 3.4.7（2026-09-28）：結算小字收入、支出分列；存款觸底時結餘照實列負數(rawNet)，存款維持0
    s.lastSettlement = { months: monthsCrossed, net, rawNet, income:householdMonthlyIncome, expenses:totalExpenses+livingCost,
      incomeTotal: Math.round(householdMonthlyIncome*monthsCrossed), expenseTotal: Math.round((totalExpenses+livingCost)*monthsCrossed),
      student: isStudentPhase(s) };
    // 資產模型（9/14新增）：房貸每月攤還本金（不含利息，簡化模型），還清時自動移除房貸支出項
    if(s.mortgageBalance>0){
      const mortgagePayment = s.monthlyExpenses.find(e=>e.label==="房貸")?.amount || 0;
      s.mortgageBalance = Math.max(0, s.mortgageBalance - mortgagePayment*monthsCrossed);
      if(s.mortgageBalance===0){
        s.monthlyExpenses = s.monthlyExpenses.filter(e=>e.label!=="房貸");
      }
    }
  } else {
    s.lastSettlement = null;
  }
}
// ========== 十、10.6 放置代活：回來時的流程（2026-09-27） ==========
let idleCheckedLives = new Set();
let idleInFlight = false;
function mockIdleOfflineDays(s){ // mock模式：本機依最後一次玩的日期算(真實模式一律由Worker算，10.6.2)
  if(!s.lastActiveDate) return 0;
  const day = d=>Math.floor(Date.parse(d+"T00:00:00Z")/86400000);
  return Math.max(0, Math.min(IDLE_MAX_DAYS_CLIENT, day(taipeiDateString()) - day(s.lastActiveDate) - 1));
}
const IDLE_MAX_DAYS_CLIENT = 7;
async function claimIdleRounds(s){
  if(USE_MOCK){
    const days = mockIdleOfflineDays(s);
    s.lastActiveDate = taipeiDateString();
    return { rounds: days*5, offlineDays: days };
  }
  try{
    const res = await fetch(WORKER_URL+"idle-claim", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ key: localStorage.getItem(RECOVERY_KEY_STORAGE_NAME), slot: Number(localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME)) }) });
    const data = await res.json();
    if(data && data.ap) syncServerAP(s, data.ap);
    return { rounds: (data && data.rounds) || 0, offlineDays: (data && data.offlineDays) || 0 };
  }catch(e){ console.warn("放置天數查詢失敗", e); return { rounds:0, offlineDays:0 }; }
}
async function maybeRunIdle(){
  const s = state;
  if(!s || s.phase!=="playing" || !s.idleEnabled || idleInFlight) return;
  const lifeKey = ensureLifeId(s);
  if(idleCheckedLives.has(lifeKey)) return;
  idleCheckedLives.add(lifeKey);
  idleInFlight = true;
  try{
    const claim = await claimIdleRounds(s);
    if(state!==s || !claim.rounds) return;
    const run = runIdleRounds(s, claim.rounds);
    run.offlineDays = claim.offlineDays;
    saveGame();
    await writeIdleSummary(s);
    saveGame(); render();
    renderIdleSummaryModal();
  } finally { idleInFlight = false; }
}
function buildIdleSummaryPayload(s){
  const run = s.idleRun;
  const stage = run.rounds.map(r=>r.stageChange).filter(Boolean);
  return {
    player_name: s.name, gender: s.gender, age_from: run.ageFrom, age_to: run.ageTo, offline_days: run.offlineDays||null,
    idle_rounds: run.rounds.map(r=>({ i:r.i, t:r.label, tag:r.tag, line:r.line, changes:r.changes, popup: r.popups.map(p=>`${p.title}：${p.label}`).join("；")||null, new_friend: r.newFriend })),
    key_rounds: pickIdleKeyRounds(run.rounds),
    stage_change: stage.length ? stage.join("；") : null,
    characters: (s.characters||[]).filter(c=>!c.deceased).slice(0,30).map(c=>({ name:c.name, relation:c.relation, gender:c.gender||null })),
    new_character_limit: Math.min(IDLE_MAX_NEW_CHARACTERS, run.rounds.filter(r=>r.newFriend).length)
  };
}
function mockIdleSummary(payload){
  return {
    retrospect: `（模擬摘要）你不在的這段時間，日子照樣過著，從${payload.age_from}歲走到${payload.age_to}歲。${payload.stage_change ? "這段時間"+payload.stage_change+"。" : ""}`,
    fragments: payload.key_rounds.map(i=>({ i, text:`（模擬片段）第${i+1}回合：${(payload.idle_rounds.find(r=>r.i===i)||{}).line||""}` })),
    new_characters: payload.idle_rounds.filter(r=>r.new_friend).slice(0, payload.new_character_limit).map((r,k)=>({ name: pick(["郁婷","柏翰","品妤","冠廷"])+(k+1), gender: k%2?"男":"女", relation:"朋友", traits:"在聚會上認識", origin:"放置期間參加聚會認識", i:r.i }))
  };
}
async function writeIdleSummary(s){
  const payload = buildIdleSummaryPayload(s);
  let out = null;
  if(USE_MOCK) out = mockIdleSummary(payload);
  else{
    try{
      const res = await fetch(WORKER_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({
        kind:"idle_summary", key: localStorage.getItem(RECOVERY_KEY_STORAGE_NAME), slot: Number(localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME)),
        life_id: ensureLifeId(s), messages:[{ role:"user", content: JSON.stringify(payload) }] }) });
      const data = await res.json();
      const block = (data.content||[]).find(b=>b.type==="tool_use" && b.name==="submit_idle_summary");
      if(block && block.input) out = block.input;
    }catch(e){ console.warn("放置摘要生成失敗", e); }
  }
  if(!out) out = { retrospect:"你不在的這段時間，日子照樣一天一天過去。", fragments:[], new_characters:[] };
  // 10.6.3【定案】新角色只能來自有「新朋友」標記的回合、每次最多2位；照一般回合規則建卡(同名改名)
  const friendRounds = new Set(s.idleRun.rounds.filter(r=>r.newFriend).map(r=>r.i));
  const created = [];
  (out.new_characters||[]).filter(nc=>nc && nc.name && friendRounds.has(nc.i)).slice(0, IDLE_MAX_NEW_CHARACTERS).forEach(nc=>{
    let name = String(nc.name).slice(0,12);
    const exists = s.characters.find(c=>c.name===name);
    if(exists) name = renameForConflict(s, name, nc.relation||"");
    s.characters.push({ name, relation: nc.relation||"朋友", gender: resolveNewCharacterGender(nc),
      traits: nc.traits||"", dialogueStyle:"normal", affinity:50, summary:"", lastTurn:s.turnCount, active:true, isChild:false,
      origin: nc.origin||"放置期間認識", createdByIdleRound: nc.i });
    created.push(name);
  });
  s.idleRun.summary = { retrospect: String(out.retrospect||""), fragments: (out.fragments||[]).map(f=>({ i:f.i, text:String(f.text||"") })), newCharacters: created };
  // 摘要也寫進日記，讓之後的回合AI讀得到這段時間(一般回合的recent_turns)
  s.log.push({ age:s.age, timeLabel:"放置期間", subtitle:"不在的時候", cash:s.cash, text: [s.idleRun.summary.retrospect].concat(s.idleRun.summary.fragments.map(f=>f.text)).join("\n\n"),
    turnSummary: s.idleRun.summary.retrospect.slice(0,80), statChanges: s.idleRun.totals });
}
const IDLE_STAT_LABELS = { health:"健康", knowledge:"才識", network:"人脈", expression:"表達力", cash:"存款" };

      <p>${escapeHtml(run.summary.retrospect)}</p>
      ${run.summary.fragments.map(f=>`<p style="font-size:13.5px;">${escapeHtml(f.text)}</p>`).join("")}
      ${run.summary.newCharacters.length ? `<p style="font-size:12.5px;color:var(--ink-soft);">新認識的人：${escapeHtml(run.summary.newCharacters.join("、"))}</p>` : ""}
      <div style="font-size:13px;margin:8px 0;">${totals}</div>
      ${points.length ? `<div style="font-size:12.5px;margin-top:6px;">可以回到其中一個決定重選（花${IDLE_ROLLBACK_COST}點，這次放置只能一次）：
        ${points.map(p=>`<button class="ghost-btn idle-rollback-btn" data-r="${p.r}" data-j="${p.j}" style="display:block;width:100%;text-align:left;margin:3px 0;">可回到此處：第${p.r+1}回合・${escapeHtml(p.title)}（${escapeHtml(p.label)}）</button>`).join("")}</div>` : ""}

      <button class="primary-btn" id="btn-idle-close" style="margin-top:10px;">繼續</button>
    </div>`;

  document.getElementById("btn-idle-expand").onclick = ()=>{ const el = document.getElementById("idle-rounds"); el.style.display = el.style.display==="none" ? "block" : "none"; };
  document.getElementById("btn-idle-close").onclick = ()=>div.remove();
  div.querySelectorAll(".idle-rollback-btn").forEach(btn=>{
    btn.onclick = async ()=>{ const ok = await rollbackIdleDecision(+btn.dataset.r, +btn.dataset.j); if(ok) div.remove(); };
  });

// 10.6.5【定案】回溯：花5點回到放置期間某個彈窗決定之前，之後的放置回合作廢、不補回；數值年齡回到當時；
// 作廢段落裡產生的新角色一併刪除(快照在建卡之前，還原後自然不存在)；每次放置只能回溯一次；摘要不重寫，作廢段落標示「已改寫」
async function rollbackIdleDecision(roundIndex, pointIndex){
  const s = state, run = s.idleRun;
  if(!run || run.rolledBack) return false;
  const round = run.rounds.find(r=>r.i===roundIndex);
  const point = round && round.rollbackPoints[pointIndex];
  if(!point) return false;
  if(totalAP(s) < IDLE_ROLLBACK_COST){ alert("行動點不足，不能回溯"); return false; }
  let apAfter = null;
  if(USE_MOCK) spendAP(s, IDLE_ROLLBACK_COST);
  else{
    try{
      const res = await fetch(WORKER_URL+"idle-rollback", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ key: localStorage.getItem(RECOVERY_KEY_STORAGE_NAME), slot: Number(localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME)) }) });
      const data = await res.json();
      if(!res.ok || !data.success){ alert((data && data.error && data.error.message) || "回溯失敗"); return false; }
      apAfter = data.ap;
    }catch(e){ alert("回溯失敗，請稍後再試"); return false; }
  }
  const ap = apAfter || ensureAP(s);
  const restored = JSON.parse(point.snapshot);
  run.rolledBack = true;
  run.rounds.forEach(r=>{ r.rewritten = r.i>=roundIndex; }); // 從這個決定起(含這回合決定之後)都作廢
  restored.idleRun = run;
  restored.ap = Object.assign({}, ensureAP(restored), { daily:ap.daily, gift:ap.gift, purchased:ap.purchased });
  restored.snapshot = null;
  restored.log = (restored.log||[]).concat([{ age: restored.age, timeLabel:"放置期間", subtitle:"回到那個決定", text:`你回到放置期間第${roundIndex+1}回合的「${point.title}」，這一次由你自己決定。之後那段放置的日子已經改寫。`, turnSummary:`回到放置期間的${point.title}，自己重新決定`, statChanges:{} }]);
  state = restored;
  saveGame(); render();
  dispatchPendingModals();
  return true;
}
// 回合結束後依序跳出待處理的彈窗（2026-09-27從takeTurn抽出，內容不變）
function dispatchPendingModals(){
  if(state.pendingDivorceSettlement){ renderDivorceSettlementModal(state.pendingDivorceSettlement); return; } // 10.6.5：回溯到離婚結算時
  if(state.mealJustUnlocked){ state.mealJustUnlocked = false; renderMealUnlockModal(); }
  if(state.pendingSideBusinessCardId){ const cid = state.pendingSideBusinessCardId; state.pendingSideBusinessCardId = null; renderSideBusinessModal(cid); }
  // 九、大學科系系統：四個彈窗互斥，一次只處理一個，優先序為選科系＞轉系＞雙主修＞休學肄業
  // （選科系優先是因為其他三個狀態機都要有科系才有意義；後三者用if/else if避免同一回合疊兩個彈窗互相蓋掉）
  if(state.pendingMajorSelection){ state.pendingMajorSelection = false; renderMajorSelectionModal(); }
  else if(state.pendingTransferOffer){ state.pendingTransferOffer = false; renderTransferOfferModal(); }
  else if(state.pendingDualMajorOffer){ state.pendingDualMajorOffer = false; renderDualMajorOfferModal(); }
  else if(state.pendingDualMajorAbandonOffer){ state.pendingDualMajorAbandonOffer = false; renderDualMajorAbandonModal(); }
  else if(state.pendingLeaveOffer){ const reason = state.pendingLeaveOffer; state.pendingLeaveOffer = null; renderWithdrawalOfferModal(reason); }
  // 七、7.3.5（2026-09-20新增）：子女成長節點，跟大學四個彈窗互斥鏈分開處理（性質不同，理論上不會同回合撞在一起）
  if(state.pendingParentingNode){ const pn = state.pendingParentingNode; state.pendingParentingNode = null; renderParentingNodeModal(pn); }
  // 七、7.6（2026-09-20新增）：婚姻危機優先於關係投入節點(較急迫)，兩者互斥避免同回合疊兩個彈窗
  if(state.pendingMarriageCrisis){ const mc = state.pendingMarriageCrisis; state.pendingMarriageCrisis = null; renderMarriageCrisisModal(mc); }
  else if(state.pendingRelationshipInvestment){ const ri = state.pendingRelationshipInvestment; state.pendingRelationshipInvestment = null; renderRelationshipInvestmentModal(ri); }
  else if(state.pendingDivorceRecovery){ state.pendingDivorceRecovery = null; renderDivorceRecoveryModal(); }
  else if(state.pendingCohabitationOffer){ const co = state.pendingCohabitationOffer; state.pendingCohabitationOffer = null; renderCohabitationOfferModal(co); }
  // 十二、職涯系統（2026-09-20新增）：六個彈窗互斥，一次只處理一個，優先序為求職＞升遷＞職涯岔路＞創業啟動＞創業存續＞退休
  if(state.pendingJobOffer){ renderJobOfferDecisionModal(); } // 12.4：錄取後還沒決定接不接受就重新整理時，補出決定彈窗
  else if(state.pendingJobSearch){ const js = state.pendingJobSearch; state.pendingJobSearch = null; renderJobSearchModal(js); }
  else if(state.pendingPromotionOffer){ const po = state.pendingPromotionOffer; state.pendingPromotionOffer = null; renderPromotionOfferModal(po); }
  else if(state.pendingCareerForkOffer){ state.pendingCareerForkOffer = null; renderCareerForkModal(); }
  else if(state.pendingBusinessLaunch){ const bl = state.pendingBusinessLaunch; state.pendingBusinessLaunch = null; renderBusinessLaunchModal(bl); }
  else if(state.pendingFamilyBusinessOffer){ const fb = state.pendingFamilyBusinessOffer; state.pendingFamilyBusinessOffer = null; renderFamilyBusinessOfferModal(fb); }
  else if(state.pendingBusinessContinuation){ state.pendingBusinessContinuation = null; renderBusinessContinuationModal(); }
  else if(state.pendingRetirementOffer){ const ro = state.pendingRetirementOffer; state.pendingRetirementOffer = null; renderRetirementOfferModal(ro); }
  // 十三、13.5.2（2026-09-20新增）：照顧年邁父母的決策節點
  if(state.pendingEldercareDecision){ const ec = state.pendingEldercareDecision; state.pendingEldercareDecision = null; renderEldercareDecisionModal(ec); }
  // 十七、17.3.4（2026-09-28）：重大開銷確認。pending保留到玩家做決定為止(重新整理後會再跳出)
  if(state.pendingMajorPurchase && !document.getElementById("major-purchase-modal")) renderMajorPurchaseModal();
}
function applyResult(r, timeCtx, forceEnding, actionText){
  const s = state;
  // 九、大學科系系統：university_recent_event只給AI看這一回合，用過就清掉，不然會被下一回合重複讀到
  s.universityEventLog = null;
  // 六、6.2（2026-09-20新增）：breakthrough_event_now只給AI看這一回合，用過就清掉，比照university_recent_event
  s.breakthroughEventLog = null;
  // 七、7.3.5（2026-09-20新增）：parenting_event_now只給AI看這一回合，用過就清掉
  s.parentingEventLog = null;
  // 七、7.6（2026-09-20新增）：以下三個event log只給AI看這一回合，用過就清掉
  s.relationshipInvestmentEventLog = null;
  s.marriageCrisisEventLog = null;
  s.divorceEventLog = null;
  // 七、7.6.1.1（2026-09-22新增）：cohabitation_event_now只給AI看這一回合，用過就清掉
  s.cohabitationEventLog = null;
  // 十二、職涯系統（2026-09-20新增）：career_event_now只給AI看這一回合，用過就清掉
  s.careerEventLog = null;
  s.sideBusinessEventLog = null; // 8.7（2026-09-27）
  s.lifestyleChangeLog = null; // 5.5（2026-09-28）
  // 十三、健康衰退與老年階段（2026-09-20新增）：以下event log只給AI看這一回合，用過就清掉
  s.illnessEventLog = null;
  s.majorIllnessEventLog = null;
  s.parentHealthEventLog = null;
  s.eldercareEventLog = null;
  const parentDiedThisTurn = !!s.parentDeathEventLog || !!s.spouseDeathEventLog; // 13.6／13.7.2：清掉前先記下，下面幸福感用(喪偶同樣以heavy計)
  s.spouseDeathEventLog = null; s.parentRetirementEventLog = null; s.divorceRecoveryEventLog = null;
  s.parentDeathEventLog = null;
  // 一、1.2.8.6／1.2.9.13（2026-09-24新增）：以下只給AI看這一回合，用過就清掉
  s.graduationEventLog = null;
  s.interestFormedEventLog = null;
  s.renameNotices = [];
  s.foreshadowFadeNotices = [];
  s.purchaseEventNow = null; // 十七：上一個彈窗的購物結果只給AI看這一回合
  // 可見數值變化顯示（9/15新增）：先記錄這回合開始前的可見數值，最後跟結算一起顯示變化量
  const beforeVisibleStats = { health:s.stats.health, knowledge:s.stats.knowledge, network:s.stats.network, expression:s.stats.expression, appearance:s.appearance };
  const structured = !!(timeCtx && timeCtx.structured);
  const ageAtEvent = s.age; // 非結構化時間下的年齡（尚未套用 age_advance 之前）
  if(!structured){
    s.age = clamp(s.age + (r.age_advance||0), s.age, 130);
  }
  // structured=true 時，s.age 在呼叫AI之前就已經由 advanceStructuredTime() 算好了，這裡不再套用 r.age_advance
  // 三、3.9.2（2026-09-25）：AI回報的stat_deltas先截在單回合上下限內，再進入下面既有的乘數/遞減計算
  const d = clampStatDeltas(r.stat_deltas);
  // 十三、13.3.3（2026-09-20新增）：慢性病命中機率×0.85（每項疊乘），不封鎖選項本身，只是這次健康加分沒有生效；
  // 同時追蹤「連續健康經營行為」讓慢性病轉為控制良好狀態(控制良好後移除此機率折扣，保留支出與cap影響)
  let healthDelta = d.health||0;
  // 13.2（2026-09-27）：出社會後每回合累計健康經營回合數，年度結算見settleHealthyYear()（慢性病折扣前的原始訊號）
  if(s.timeState?.stageMode==="career"){
    s.turnsThisYearForHealth = (s.turnsThisYearForHealth||0)+1;
    if(healthDelta>0) s.healthyTurnsThisYear = (s.healthyTurnsThisYear||0)+1;
  }
  (s.chronicConditions||[]).forEach(c=>{
    if(c.controlled) return;
    if(healthDelta>0){ c.controlledStreak = (c.controlledStreak||0)+1; if(c.controlledStreak>=CHRONIC_CONTROL_STREAK_TRIGGER) c.controlled = true; }
    else c.controlledStreak = 0;
  });
  if(healthDelta>0 && s.chronicConditions && s.chronicConditions.length){
    const uncontrolledCount = s.chronicConditions.filter(c=>!c.controlled).length;
    if(uncontrolledCount>0 && Math.random() >= Math.pow(0.85, uncontrolledCount)) healthDelta = 0;
  }
  s.stats.health = clamp(s.stats.health + healthDelta, 0, 100);
  // 十三、13.2（2026-09-20新增）：健康年齡上限收斂(年度)已在rollAnnualHealthChecks處理；13.3.4重大疾病治療期是連續回合機制，每回合都要推進
  applyAcuteRecovery(s); // 13.3.2（2026-09-27）：急性病之後幾回合健康回升
  applyCaregivingTurn(s); // 13.5.2（2026-09-27）：照顧家人的負荷
  const majorIllnessProgress = advanceMajorIllness(s);
  if(majorIllnessProgress) s.majorIllnessEventLog = majorIllnessProgress;

  // 3.7.3 做事態度光譜——精確公式版：團隊vs單打獨鬥影響才識/邏輯 vs 人脈的此消彼長效率
  const teamKnowledgeMult = clamp(1+(50-s.conscientiousness.teamSolo)*0.01, 0.5, 1.5);
  const wisdomMult = 0.5 + (s.wisdom/200);
  const logicBonus = 1 + (s.logicAbility/400);
  const disciplineMult = getDisciplineMultiplier(s); // 3.7.3（2026-09-23拍板）：自律乘數，接在邏輯加成之後、團隊倍率之前
  const knowledgeRawValue = rollKnowledgeRawValue(r.event_type, r.event_id, s); // 3.2.2（9/16修正）：AI只給標籤，程式查表+計數把關
  let knowledgeDelta = knowledgeRawValue * wisdomMult * logicBonus * disciplineMult * teamKnowledgeMult;
  knowledgeDelta = applyMarginalDiminish(knowledgeDelta, s.stats.knowledge); // 3.5.3邊際遞減
  s.stats.knowledge = clamp(s.stats.knowledge + knowledgeDelta, 0, 100);

  // 九、9.5.1（9/16新增）：考試結算時更新轉系候選的「連續低於預期」計數，完全不依賴AI敘事內容
  if(structured && timeCtx.examTriggered) updateTransferCandidateOnExam(s, timeCtx.studyCountAtExam);

  // 責任感→人脈加分/扣分幅度；團隊vs單打獨鬥→人脈成長效率，兩者疊乘
  const teamNetworkMult = clamp(1+(s.conscientiousness.teamSolo-50)*0.01, 0.5, 1.5);
  const respMult = (d.network||0)>=0
    ? clamp(1+(s.conscientiousness.responsibility-50)*0.01, 0.5, 1.5)
    : clamp(1+(50-s.conscientiousness.responsibility)*0.01, 0.5, 1.5);
  let networkDelta = (d.network||0) * respMult * teamNetworkMult;
  networkDelta = applyMarginalDiminish(networkDelta, s.stats.network); // 3.5.3邊際遞減
  s.stats.network = clamp(s.stats.network + networkDelta, 0, 100);

  // 3.5.3 人脈閒置衰退：連續N回合沒有人脈經營行為（AI/mock這回合完全沒給正向人脈delta）才啟動輕微衰退
  s.networkIdleStreak = (d.network||0)>0 ? 0 : (s.networkIdleStreak||0)+1;
  if(ENABLE_NETWORK_IDLE_DECAY && s.networkIdleStreak>=NETWORK_IDLE_THRESHOLD &&
     (s.networkIdleStreak-NETWORK_IDLE_THRESHOLD)%NETWORK_IDLE_DECAY_INTERVAL===0){
    s.stats.network = clamp(s.stats.network - rnd(1,3), 0, 100);
  }
  s.stats.expression = clamp(s.stats.expression + (d.expression||0), 0, 100);
  // 三、3.8（9/20改版，取代原本 s.happiness += r.happiness_delta 的直接加減）：

      // 4.1.1【定案】第1層戀愛狀態轉換含結婚，當回合必定提示（2026-09-27補上）
      if(spouse) relationshipHintCandidates.push({ tier:1, text:`你和${spouse.name}結婚了` });
    }
    // 十二、12.11.1（2026-09-22補充）：家長退休是接手家業的第二個觸發來源
    if(mu.id==="parent_retirement" && mu.status==="completed") checkFamilyBusinessOnParentRetirement(s);
  });

  demoteStaleCharacters(relationshipHintCandidates); // 四、4.1.1：同住緩降造成的級距改變併入同一批候選一起排序/限額

  // 四、4.5（2026-09-20修正，QA手冊34.2「人生階段邊界回合的chronicle條目歸屬誤植」）：
  // updateLifeTrajectory()（內含ensureStageTransition的段落切換偵測）必須在這回合的chronicle.push()之前執行，
  // 否則階段切換偵測讀到的chronicle.length會已經包含這回合新增的條目，導致條目被誤歸進即將凍結的舊階段。
  // 提前到這裡執行後，切換偵測看到的是「上一回合為止」的舊長度，這回合稍後push的條目會落在新階段的
  // chronicleStart之後，正確歸屬到這回合實際所屬的新階段（技術判斷：事件發生在轉換當下，算新階段，非設計文件明文定案，可覆寫）。
  // forceEnding時的最後一段凍結改由takeTurn()呼叫AI之前的freezeFinalLifeStageForEnding()處理，這裡不重複凍結。
  if(!forceEnding) updateLifeTrajectory(s);
  // 六、6.2：填上freezeStageTrajectory()原本承接的空陣列——這回合若有破格時刻成立，記進目前(可能是剛切換的新)人生階段
  if(breakthroughFired && s.stageAccum) s.stageAccum.breakthroughEvents.push(breakthroughFired.label);

  const tagAge = structured ? s.age : ageAtEvent;
  const tagLabel = structured ? timeCtx.label : null;

  // 四、4.2.2（9/19新增）：achievement/setback類型受每人生階段2次上限管制，程式擋下超額觸發時整個不記錄，
  // 避免AI過度觸發把履歷洗成流水帳；其餘類型（既有里程碑等）不受影響，維持原本行為
  // 四、4.2.3（9/19改版）：不再設全域總量上限、不做FIFO淘汰——總量已由上面的分階段2次上限自然封頂（8階段×2＝16則），
  // 取代原本「超過10則捨棄最舊」的做法（會優先丟掉童年/學生時期紀錄，讓死亡結局判定讀不到早年人生軌跡）
  if(r.major_event_summary && shouldRecordJudgedMajorEvent(s, r.major_event_type)){
    s.chronicle.push(`（${tagLabel || (tagAge+"歲")}）${r.major_event_summary}`);
  }
  recordMilestoneChronicle(s, tagLabel || (tagAge+"歲"));

  // bug修正（9/14，人生草稿0914測試.pdf）：結算顯示的「目前存款」之前是每次都讀取最新的s.cash，
  // 導致歷史回合全部顯示同一個（最新的）數字。這裡把「這回合結算完當下」的存款快照存進settlement，
  // 讓每一則日記顯示自己那個時間點的正確存款，不是被之後回合覆蓋的最新值。
  if(s.lastSettlement) s.lastSettlement.balanceAfter = s.cash;

  // 九、大學科系系統（9/16新增）：放在財務結算之後，確保lowCashStreak判斷的是這回合結算完的最新現金水位
  sweepUniversityState(s);
  // 七、7.3.5（2026-09-20新增）：子女成長節點檢查，不依賴大學狀態，任何人生階段都可能有子女
  checkParentingGrowthNode(s);
  // 七、7.6（2026-09-20新增）：關係投入節點＋婚姻危機候選檢查
  checkRelationshipInvestmentNode(s);
  sweepMarriageCrisisCandidate(s);
  checkDivorceRecoveryNode(s); // 7.6.3（2026-09-27）
  // 七、7.6.1.1（2026-09-22新增）：同居觸發入口檢查
  checkCohabitationOffer(s, actionText);

  // 可見數值變化顯示（9/15新增）：算出這回合實際變化量（含所有倍率/邊際遞減/衰退後的最終結果），四捨五入後只保留真的有變化的項目
  const statChanges = {};
  Object.keys(VISIBLE_STAT_LABELS).forEach(k=>{
    const after = k==="appearance" ? s.appearance : s.stats[k];
    const diff = Math.round(after - beforeVisibleStats[k]) + ((s.carryStatChanges||{})[k]||0); // 十七：上一個購物彈窗的變化併進來
    if(diff!==0) statChanges[k] = diff;
  });
  s.carryStatChanges = null;
  const purchaseNotes = [s.carryPurchaseNote, purchaseNote].filter(Boolean);
  s.carryPurchaseNote = null;

  // 四、4.1.1：候選依tier排序（1戀愛狀態轉換／2級距改變／3一般累積），每回合最多顯示RELATIONSHIP_HINT_MAX_PER_TURN則；
  // Array.prototype.sort為穩定排序，同tier內維持原本互動發生的順序
  const relationshipHints = relationshipHintCandidates
    .slice()
    .sort((a,b)=>a.tier-b.tier)
    .slice(0, RELATIONSHIP_HINT_MAX_PER_TURN)
    .map(h=>h.text);
  // 四、4.2.1.1（9/19新增）：AI每回合順便回傳turn_summary（1-2句話），供這則日記日後被擠出「最近3回合」視窗時使用，不用另外呼叫API生成
  // 一、1.2.9.11.4（2026-09-24新增）：記下新場景日期與摘要，供下一回合的previous_scene使用；
  // 違規兩次仍照常顯示時，日期夾回本回合範圍內，避免之後的回合被錯誤日期帶偏
  let sceneDate = null;
  if(timeCtx && timeCtx.window){
    const win = timeCtx.window;
    const off = Number.isInteger(r.scene_day_offset) ? clamp(r.scene_day_offset, 0, win.end-win.start) : 0;
    s.timeState.cal.lastSceneDay = win.start + off;
    s.timeState.cal.lastSceneSummary = String(r.scene_summary || r.turn_summary || "").slice(0,80);
    sceneDate = calFormat(win.start + off);
  }
  // 一、1.2.9.7：伏筆狀態由程式記錄
  applyForeshadowUpdates(s, r);
  // 一、1.2.9.11.3（2026-09-24新增）：敘事分成「行動結果」＋「時間推進後的新場景」兩段依序呈現；
  // 1.2.8.4.2：{{名字|台詞}}依角色dialogue_style截斷後換成「台詞」，沒用這個格式的文字照常顯示
  const composedText = [r.action_result, r.narrative].map(t=>String(t||"").trim()).filter(Boolean).join("\n\n");
  const dialogue = processDialogueMarkup(s, composedText);
  dialogue.notes.forEach(n=>{ console.warn("[台詞上限]", n); addReviewFlag(s, "dialogue_limit", n); });
  // 一、1.2.9.6：回合標題副標(AI產生)，畫面顯示「時期標籤｜副標」
  const subtitle = r.chapter_subtitle ? String(r.chapter_subtitle).trim().slice(0,30) : "";
  s.log.push({age:tagAge, timeLabel:tagLabel, subtitle, sceneDate, text:dialogue.text, turnSummary:r.turn_summary||"", settlement:s.lastSettlement, statChanges, relationshipHints, purchaseNote: purchaseNotes.join("；")||undefined, cash:s.cash}); // cash：十六、16.6回憶錄的「當時存款」
  // 介面：回憶錄（9/19新增，回應「畫面上舊日記消失」的困擾）：上限從60大幅提高到2000，
  // 足夠涵蓋單一人生全程(~1200-1400回合)不流失；每世reincarnate/succeedAsChild時log都會重置為[]，不會跨世累積
  if(s.log.length>2000) s.log.shift();

  s.choices = r.choices || [];

  // 七、7.1.5（9/16改版）：死亡結局現在完全由client端的forceEnding決定，AI不能自行發起結局——
  // 取代原本「意外死亡需滿足19歲以上+已有前兆」的防呆邏輯，因為AI已經不再有判斷「要不要死」的空間，只剩forceEnding這一道閘門
  if(r.is_ending && forceEnding){
    s.phase = "ending";
    // 七、7.1.4（9/20改版）：不再有title/summary，改為三層結構的人生總結
    s.ending = assembleEnding(s, r);
    s.lifeTrait = classifyLifeTrait(s.playStyle); // 7.7.4【定案】死亡時判定
  }
}

async function startLife(){
  // 十、10.3.4：全新人生在正式開始這一刻才領新手禮包（開場建角7步不扣點，反覆重骰也不會重複領）
  const ap = ensureAP(state);
  if(ap.giftPending){
    ap.giftPending = false;
    const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
    const slotRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
    if(key){
      const claim = await claimNewLifeGift(key, slotRaw!==null ? Number(slotRaw) : 0);
      // 10.3.11（2026-09-25）：真實模式以Worker回傳的伺服器端餘額為準；mock模式或Worker連不上時維持本機計算
      if(!USE_MOCK && claim.ap) syncServerAP(state, claim.ap);
      else if(claim.granted) ap.gift = AP_NEW_LIFE_GIFT;
    }
  }
  state.phase = "playing";
  render(true);
  // 二、2.2（2026-09-23修正）：原本這句文字含「暑假」二字，會被detectTimeSkipIntent()誤判成跳過指令，
  // 導致第一回合就隨機跳2~4段；改用timeState.prologue旗標讓這一回合完全不經過跳過判定/段落推進
  takeTurn("（人生正式開始：15歲的你，在高中開學前的暑假最後一天。）", 0);
}

// 16.7「再寫一次人生」＝轉世。七、7.4.3.2（2026-09-28定案）：免費轉世不保留任何數值(取代原本隨機一項數值小幅加成)，
// 只留前世記憶式的敘事痕跡，寫給旁白的素材也不直接說「前世」。點數照十、10.3.6全部保留
function reincarnate(){
  const carry = { reincarnations:(state.reincarnations||0)+1,
    chronicleCarry: `（說不上來的熟悉感）偶爾會有似曾相識的片刻或夢境，只能隱約帶過，不說破來由。`,
    name: state.name, gender: state.gender,
    ap: ensureAP(state) }; // 十、10.3.6（2026-09-23使用者確認轉世丹＝restart_item）：點數全部保留，「第X回合」歸零
  state = newRoll(carry, null);
  saveGame();
  render();
}

function economicTierForSavingsAmount(savings){
  // 9/19隨3.4整章遊戲幣單位改版同步÷1000
  if(savings<200) return "清寒";
  if(savings<3000) return "小康";
  return "富裕";
}
function rollEconomicTierForced(tier){
  if(tier==="清寒") return { tier, network:rnd(15,35), allowance:STUDENT_ALLOWANCE_UNITS["清寒"], savings:STUDENT_ALLOWANCE_UNITS["清寒"], ...rollFamilyFinance("清寒") };
  if(tier==="小康") return { tier, network:rnd(30,55), allowance:STUDENT_ALLOWANCE_UNITS["小康"], savings:STUDENT_ALLOWANCE_UNITS["小康"], ...rollFamilyFinance("小康") };
  return { tier:"富裕", network:rnd(50,75), allowance:STUDENT_ALLOWANCE_UNITS["富裕"], savings:STUDENT_ALLOWANCE_UNITS["富裕"], ...rollFamilyFinance("富裕") };
}
function deriveParentTraitFromAffinity(aff, summary){
  let tone;
  if(aff>=70) tone = "跟你感情很好，願意溝通、給空間、支持你的決定";
  else if(aff>=45) tone = "感情普通，日常互動平淡但不算疏離";
  else tone = "感情有些疏遠，報喜不報憂、情感表達少";
  return summary ? tone+"；過去點滴："+summary : tone;
}
function eligibleChildren(){
  return state.characters.filter(c=>c.isChild);
}
let succeeding = false; // 十五、15.1：保存上一代的書要等網路，避免連點選了兩個孩子
async function succeedAsChild(childName){
  const prev = state;
  const child = prev.characters.find(c=>c.name===childName && c.isChild);
  if(!child || succeeding) return;
  succeeding = true;
  let familyBook = null;
  try{ familyBook = await preserveFamilyBook(prev); } finally { succeeding = false; }
  if(state!==prev) return; // 等待期間畫面已經換掉(例如切換人生)，不再繼續傳承
  // 2026-09-22修正：配偶認定改用romanceStatus==="married"（比照7.6.2sweepMarriageCrisisCandidate既有寫法），
  // 不再用relation字串regex比對——離婚後的「前配偶」relation仍含「配偶」兩字，regex會誤判成現任配偶
  const spouse = prev.characters.find(c=>c.romanceStatus==="married" && c.active!==false);
  const otherKids = prev.characters.filter(c=>c.isChild && c.name!==childName);

  const deceasedRelation = prev.gender==="男" ? "父親" : "母親"; // 4.1.3：依上一代主角性別
  // 七、7.4.2／7.3.5.5：教養風格由這一世對該兒女的parenting_log換算得出（提前到建卡前算，家長卡的語氣要用到）
  const inheritedParentingStyle = computeInheritedParentingStyle(child);
  const heirOfFamilyBusiness = !!child.familyBusinessHeir; // 12.10交棒（2026-09-27）：這位孩子是上一代事業的繼承人
  const inheritedStyleDef = PARENTING_STYLES.find(x=>x.label===inheritedParentingStyle) || null;
  // 7.4.2（2026-09-27補上）：換算出的教養風格原本只當骰依附/社交起點的偏向，家長卡語氣仍依關係值另外推；
  // 改成兩張家長卡的traits都以這個風格的parentTrait開頭（跟開局newRoll家長卡同一套描述），AI從家長卡讀到的語氣就是這一世實際的教養方式。
  // 關係值不動（7.4.2：關係史延續）。在世配偶沿用自己的個性描述，接在教養風格後面（Claude判斷：parenting_log記的是玩家的選擇，
  // 但新主角15歲後是由在世的另一位家長帶大，這個家的教養環境由他延續）
  const styleTraitPrefix = inheritedStyleDef ? inheritedStyleDef.parentTrait : null;
  const characters = [];
  characters.push({
    name: prev.name, relation: deceasedRelation, gender: prev.gender==="女" ? "女" : "男", dialogueStyle: rollDialogueStyle(),
    traits: styleTraitPrefix ? (styleTraitPrefix + (child.summary ? "；過去點滴："+child.summary : "")) : deriveParentTraitFromAffinity(child.affinity, child.summary),
    affinity: child.affinity, summary: child.summary||"", lastTurn:0,
    // 2026-09-22修正（bug回報：世代傳承後上一代主角被當成活著的父母）：
    // 上一代主角在傳承當下已經過世，標記deceased/active:false/healthStage:4(過世)、cohabiting:false，
    // 並直接視為estateSettled(遺產已經透過下面econ=rollEconomicTierForced(...prev.cash)在傳承流程內一次結算完畢)，
    // 這樣13.5 rollParentHealthStageAdvance()的過濾條件(active!==false && !deceased)會自然跳過這張角色卡，
    // 不會再被判定「需要協助/失能長照/再過世一次」
    active:false, deceased:true, healthStage:4, estateSettled:true, isChild:false,
    origin: "父母，從出生起", cohabiting: false, // 四、4.1（9/19新增）：世代傳承後從新主角視角重新寫，不沿用上一世「怎麼認識」的舊故事
    age: prev.age, // 十三、13.5.1：沿用上一世死亡當下的年齡，比隨機骰更準確
    occupation: heirOfFamilyBusiness ? "自營業者" : undefined, handedOver: heirOfFamilyBusiness || undefined
  });
  let familyStructure;
  // 舊存檔配偶卡gender可能還是null(尚未gender_fill)：先看稱謂有沒有寫明(丈夫/妻子等)，再不行才補骰寫入
  const spouseGender = spouse ? (CHARACTER_GENDERS.includes(spouse.gender) ? spouse.gender
    : /^(前)?(丈夫|老公|先生)/.test(spouse.relation||"") ? "男" : /^(前)?(妻子|老婆|太太)/.test(spouse.relation||"") ? "女" : rollNpcGender()) : null;
  if(spouse){
    characters.push({
      // 4.1.3【定案】另一位家長的稱謂依配偶卡的gender決定(父親／母親)，同性伴侶即為兩位父親或兩位母親；取代「配偶取玩家稱謂相反」的舊寫法
      name: spouse.name, relation: spouseGender==="男" ? "父親" : "母親", gender: spouseGender, dialogueStyle: spouse.dialogueStyle || rollDialogueStyle(),
      // 2026-09-22修正（bug回報：在世配偶被當成新角色重新產生）：年齡/健康階段/同住狀態/關係值一律沿用傳承前資料，不重新骰——
      // married的配偶在目前架構下不會有獨立死亡判定，傳承當下必然還在世，也不會被finalizeDivorce解除同住，cohabiting因此必為true
      traits: styleTraitPrefix ? (styleTraitPrefix + "；" + (spouse.traits||"忙碌但關心家裡")) : (spouse.traits||"忙碌但關心家裡"), affinity: spouse.affinity, summary: spouse.summary||"",
      lastTurn:0, active:true, isChild:false, origin: "父母，從出生起",

  // 不可能是「雙親同住」；依實際是否還有一位在世同住家長，對應到既有分類裡最貼近的「單親－喪親」
  // （目前架構沒有「兩位家長皆已不在」的既有分類，沒有配偶時沿用原本就有的單親－喪親判斷）
  familyStructure = "單親－喪親";
  otherKids.forEach(k=>{
    // 4.1.3：手足稱謂依子女卡的gender(沒有才依「兒子／女兒」稱謂，再沒有才補骰)
    const kidGender = CHARACTER_GENDERS.includes(k.gender) ? k.gender : (genderFromRelation(k.relation) || rollNpcGender());
    characters.push({
      name:k.name, relation: pick(kidGender==="男" ? SIBLING_RELATIONS_MALE : SIBLING_RELATIONS_FEMALE), gender: kidGender, dialogueStyle: k.dialogueStyle || rollDialogueStyle(),
      traits: (k.traits||"")+"（同樣是上一代留下的孩子）", affinity: clamp(k.affinity+rnd(-10,10),0,100),
      summary:k.summary||"", lastTurn:0, active:true, isChild:false, origin: "手足，從出生起", cohabiting: true
    });
  });

  // 7.4.2【定案】家境繼承「死亡當下的財富水準」（2026-09-27修正：原本只看現金，改為現金＋房產淨值(市值−房貸)，與3.4.9三欄位一致）
  const netWorthAtDeath = (prev.cash||0) + Math.max(0,(prev.propertyValue||0)-(prev.mortgageBalance||0));
  const econ = rollEconomicTierForced(economicTierForSavingsAmount(netWorthAtDeath));
  const wisdom = rnd(30,70);
  const logicAbility = clamp(Math.round(wisdom*0.3+rnd(-10,10)),0,100);
  const talent = clamp(Math.round(wisdom*0.6+rnd(-5,5)),0,100);
  const health = rnd(45,90);
  const looks = rnd(20,90);
  const luckHidden = +(0.85+Math.random()*0.3).toFixed(2);
  // 七、7.4.2／7.3.5.5（2026-09-20新增）：教養風格由這一世對該兒女的parenting_log換算得出，取代原本biasStyle固定null——
  // 依附風格/同儕位置本身「不繼承」(仍是新骰定的隨機值)，但影響隨機骰的biasStyle改用「真的發生過的教養方式」而非重新亂骰
  const attach = rollAttachmentBaseline(inheritedParentingStyle);
  const peerPosition = rollPeerPosition();
  const expression = rollSocialStart(inheritedParentingStyle, peerPosition);
  const temperament = rollSocialStart(inheritedParentingStyle, peerPosition);

// 十、10.3.6／10.3.7（2026-09-23新增，取代原本hardReset()「清空這個slot、同格重新取名」）：
// 「就此闔卷」(死亡且不傳承,reason="ended")與「刪除這段人生」(reason="deleted")都讓這條人生結束——
// 移到唯讀的人生回顧區、空出格子；禮包點消失，購買點全部移到金鑰錢包（由Worker在/archive裡加總）
async function endLife(reason){
  // 十五、人生之書：封存前把還沒寫完的章節等完(最多90秒)，人生回顧裡才看得到完整的書；刪除人生不等
  if(reason!=="deleted" && state && state.book && state.book.chapters.some(c=>c.status!=="done")){
    state.book.chapters.forEach(c=>{ if(c.status==="failed") c.status = "pending"; }); // 失敗的章節封存前再試最後一次
    document.getElementById("app").insertAdjacentHTML("afterbegin", `<div class="loading" id="book-finishing">正在把最後一章寫進人生之書…</div>`);
    await waitForBook(90000);
  }
  closeBookPage();
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  const slotRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
  const slot = slotRaw!==null ? Number(slotRaw) : null;
  const ap = ensureAP(state);
  const endedAt = Date.now();
  const id = endedAt.toString(36) + Math.random().toString(36).slice(2,8);
  const meta = { name:state.name, age:state.age, stage:stageLabel(state.age), reincarnations:state.reincarnations||0, reason, endedAt };
  const purchased = ap.purchased;
  const archivedState = JSON.parse(JSON.stringify(state));
  archivedState.snapshot = null;
  archivedState.ap = { daily:0, gift:0, purchased:0, lastRefillDate:ap.lastRefillDate };
  try{ localStorage.removeItem(STORAGE_KEY+(slot!==null?":"+slot:"")); }catch(e){}
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} // 相容改版前沒有slot後綴的殘留資料
  try{ localStorage.removeItem(ACTIVE_SLOT_STORAGE_NAME); }catch(e){}
  if(slot!==null){ try{ localStorage.removeItem(HOME_META_PREFIX+slot); }catch(e){} } // 16.10.2：已結束的人生不列在首頁
  cloudSyncStatus = null;
  if(!key || slot===null){ state = { phase:"home" }; render(); return; } // 防呆：理論上進得了遊戲畫面一定有金鑰+slot
  let archivedOnCloud = false;
  try{
    const res = await fetch(WORKER_URL+"archive", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ key, slot, id, meta, purchased, state: archivedState })
    });
    const data = await res.json();
    archivedOnCloud = res.ok && data && data.success===true;
  }catch(e){ console.warn("雲端封存人生失敗，改存本機", e); }
  if(!archivedOnCloud){
    try{
      const list = JSON.parse(localStorage.getItem(ARCHIVE_LOCAL_PREFIX+key) || "[]");
      list.push({ id, meta, state: archivedState });
      localStorage.setItem(ARCHIVE_LOCAL_PREFIX+key, JSON.stringify(list));
    }catch(e){ console.warn("本機封存也失敗（可能超過瀏覽器容量）", e); }
  }
  await showSlotPicker(key);
}

// ========== 十五、人生之書：章節成書（2026-09-25新增，佇列批次6，【定案草稿】待使用者確認） ==========
// 每換一個人生階段(高中→大學／技職→初入社會→職涯發展→中年→老年)成一章；同一階段超過5個遊戲年，每5年另成一章；
// 人生結束(死亡)那一回合把最後一段也收成一章。素材只用每回合的turn_summary與重大事件，不送完整敘事(控制成本)。
// 背景生成、不扣行動點、不影響任何遊戲數值；失敗可稍後重試，不影響遊玩
const BOOK_MAX_YEARS_PER_CHAPTER = 5;        // 【定案草稿,十五、15.1】
const BOOK_MAX_SUMMARIES_PER_CHAPTER = 150;  // 【測試參數,15.2】素材上限，超過就平均抽樣(有重大事件的回合一定保留)
const BOOK_AUTO_RETRY_MAX = 3;               // 【測試參數,15.5】失敗後每回合結束自動重試一次，最多3次；之後只能手動重試
let MOCK_CHAPTER_FAIL_RATE = 0;              // 🛠面板可調，測試失敗重試用
let MOCK_CHAPTER_DELAY_MS = 600;
let bookInFlight = null;                     // 目前正在生成的Promise(一次只生成一章)
const CHINESE_NUMS = ["零","一","二","三","四","五","六","七","八","九","十"];
function chineseNum(n){
  if(n<=10) return CHINESE_NUMS[n];
  if(n<20) return "十"+(n%10?CHINESE_NUMS[n%10]:"");
  return CHINESE_NUMS[Math.floor(n/10)]+"十"+(n%10?CHINESE_NUMS[n%10]:"");
}
function bookStageOf(s){
  const mode = s.timeState && s.timeState.stageMode;
  if(mode==="highschool") return { key:"highschool", label:"高中" };
  if(mode==="college") return { key:"college", label:"大學／技職" };
  if(s.age<30) return { key:"adult-early", label:"初入社會" };
  if(s.age<=45) return { key:"adult-career", label:"職涯發展" };
  if(s.age<=60) return { key:"adult-middle", label:"中年" };
  return { key:"adult-old", label:"老年" };
}
function ensureBook(s){
  if(!s.book) s.book = { chapters:[], draft:null, unseen:0, seq:0 };
  // 讀檔時上一次沒寫完的(頁面關掉)改回待寫
  if(!bookInFlight) s.book.chapters.forEach(c=>{ if(c.status==="writing") c.status = "pending"; });
  return s.book;
}
// 每回合成功套用結果後呼叫：先判斷要不要收成一章，再把這回合的摘要放進目前這一章的素材
function bookAfterTurn(s, r, forceEnding){
  const book = ensureBook(s);
  const st = bookStageOf(s);
  const d = book.draft;
  if(d && (d.key!==st.key || s.age - d.startAge >= BOOK_MAX_YEARS_PER_CHAPTER)) closeBookDraft(s);
  if(!book.draft){
    book.draft = { key:st.key, label:st.label, startAge:s.age, endAge:s.age, startTurn:s.turnCount, items:[], events:[] };
  }
  const draft = book.draft;
  const last = s.log[s.log.length-1] || {};
  const summary = String(r.turn_summary||"").trim();
  if(summary) draft.items.push({ t: last.timeLabel || (s.age+"歲"), s: summary.slice(0,200), d: last.sceneDate || null, ev: !!r.major_event_summary });
  // 重大事件：取這回合新增的人生大事記(chronicle)——包含AI回報的major_event_summary，以及程式自己記的大事(重大疾病、父母過世等)
  const chron = s.chronicle || [];
  if(typeof book.chronicleSeen!=="number" || book.chronicleSeen > chron.length) book.chronicleSeen = Math.min(book.chronicleSeen||0, chron.length);
  chron.slice(book.chronicleSeen).forEach(e=>draft.events.push(String(e).slice(0,120)));
  book.chronicleSeen = chron.length;
  draft.endAge = s.age;
  if(!draft.dateFrom && last.sceneDate) draft.dateFrom = last.sceneDate;
  if(last.sceneDate) draft.dateTo = last.sceneDate;
  if(forceEnding || s.phase==="ending") closeBookDraft(s);
}
function closeBookDraft(s){
  const book = ensureBook(s);
  const d = book.draft;
  book.draft = null;
  if(!d || !d.items.length) return null;
  book.seq = (book.seq||0) + 1;
  const part = book.chapters.filter(c=>c.key===d.key).length + 1;
  const ch = {
    id: (s.lifeId||"life") .replace(/[^a-z0-9]/g,"").slice(0,20) + "c" + book.seq,
    index: book.chapters.length + 1,
    key: d.key, label: d.label, part,
    ageFrom: d.startAge, ageTo: d.endAge, dateFrom: d.dateFrom||null, dateTo: d.dateTo||null,
    items: d.items, events: d.events,
    status: "pending", attempts: 0, lastAttemptTurn: null,
    createdTurn: s.turnCount, title: null, text: null
  };
  book.chapters.push(ch);
  return ch;
}
function sampleChapterItems(items){
  if(items.length<=BOOK_MAX_SUMMARIES_PER_CHAPTER) return items;
  const keep = new Set(items.map((it,i)=>it.ev?i:-1).filter(i=>i>=0));
  const slots = Math.max(0, BOOK_MAX_SUMMARIES_PER_CHAPTER - keep.size);
  for(let k=0;k<slots;k++) keep.add(Math.floor(k*items.length/slots));
  return [...keep].sort((a,b)=>a-b).slice(0,BOOK_MAX_SUMMARIES_PER_CHAPTER).map(i=>items[i]);
}
function chapterStageText(ch){
  return ch.label + (ch.part>1 ? `（${chineseNum(ch.part)}）` : "");
}
function buildChapterMaterial(s, ch){
  const book = ensureBook(s);
  const prev = book.chapters.filter(c=>c.index<ch.index && c.status==="done").slice(-1)[0];
  return {
    player_name: s.name, gender: s.gender,
    chapter_index: ch.index, stage_label: chapterStageText(ch),
    age_from: ch.ageFrom, age_to: ch.ageTo, date_from: ch.dateFrom, date_to: ch.dateTo,
    turn_summaries: sampleChapterItems(ch.items).map(it=>({ t:it.t, s:it.s })),
    major_events: (ch.events||[]).slice(-60),
    characters: (s.characters||[]).slice(0,40).map(c=>({ name:c.name, relation:c.relation })),
    previous_chapter_title: prev ? prev.title : null
  };
}
async function callChapterAI(s, ch){
  const res = await fetch(WORKER_URL, {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      kind:"chapter",
      key: localStorage.getItem(RECOVERY_KEY_STORAGE_NAME),
      slot: Number(localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME)),
      life_id: ensureLifeId(s), chapter_id: ch.id,
      messages: [{ role:"user", content: JSON.stringify(buildChapterMaterial(s, ch)) }]
    })
  });
  const text = await res.text();
  let data; try{ data = JSON.parse(text); }catch(e){ throw new Error("章節回應不是合法JSON（HTTP "+res.status+"）"); }
  if(!res.ok) throw new Error("章節生成失敗 "+res.status+"："+(data?.error?.message||""));
  if(data && data.lifegame && data.lifegame.usage) lastChapterUsage = data.lifegame.usage;
  const block = (data.content||[]).find(b=>b.type==="tool_use" && b.name==="submit_chapter");
  if(!block || !block.input) throw new Error("回應裡沒有submit_chapter");
  return block.input;
}
let lastChapterUsage = null;
async function mockGenerateChapter(s, ch){
  await new Promise(r=>setTimeout(r, MOCK_CHAPTER_DELAY_MS));
  if(Math.random() < MOCK_CHAPTER_FAIL_RATE) throw new Error("模擬章節生成失敗");
  const m = buildChapterMaterial(s, ch);
  const paras = [];
  paras.push(`〔模擬章節〕這是mock模式依素材拼出來的示意正文，真實API才會寫成小說。`);
  m.turn_summaries.forEach(it=>paras.push(`${it.t}。${it.s}`));
  m.major_events.forEach(e=>paras.push(e));
  let text = paras.join("\n\n");
  while(Array.from(text).length < 1500) text += "\n\n窗外的光慢慢移過桌面，你把杯子裡剩下的水喝完。";
  return { title: `${m.stage_label}的日子`, text: Array.from(text).slice(0,2500).join("") };
}
async function generateChapter(s, ch){
  ch.status = "writing"; ch.attempts = (ch.attempts||0)+1; ch.lastAttemptTurn = s.turnCount;
  try{
    const out = USE_MOCK ? await mockGenerateChapter(s, ch) : await callChapterAI(s, ch);
    const title = String(out.title||"").replace(/^第.{1,4}章[\s　:：]*/,"").trim().slice(0,20);
    const text = String(out.text||"").trim();
    if(!title || Array.from(text).length < 300) throw new Error("章節內容過短或沒有章名");
    ch.title = title; ch.text = text; ch.status = "done"; ch.error = null;
    delete ch.items; delete ch.events; // 寫好後素材用不到了，減少存檔大小
    const book = ensureBook(s);
    if(!book.chapters.includes(ch)) return; // 這一章在生成途中被反悔撤掉了
    book.unseen = (book.unseen||0) + 1;
    if(state===s){ saveGame(); showBookToast(); refreshBookPage(); updateBookLink(); }
  }catch(e){
    console.warn("章節生成失敗，之後會再試：", e);
    ch.status = "failed"; ch.error = String(e && e.message || e).slice(0,200);
    if(state===s){ saveGame(); refreshBookPage(); }
  }
}
// 依序把待寫的章節寫完。autoRetry=true時，失敗的章節(自動重試未滿3次、這回合還沒試過)也重試一次
function processBookQueue(autoRetry){
  const s = state;
  if(!s || !s.book || bookInFlight) return bookInFlight;
  const next = s.book.chapters.find(c=>c.status==="pending" ||
    (autoRetry && c.status==="failed" && (c.attempts||0) < BOOK_AUTO_RETRY_MAX && c.lastAttemptTurn!==s.turnCount));
  if(!next) return null;
  const p = generateChapter(s, next).finally(()=>{ if(bookInFlight===p) bookInFlight = null; if(state===s) processBookQueue(false); });
  bookInFlight = p;
  return p;
}
function retryChapter(id){
  const ch = state && state.book && state.book.chapters.find(c=>c.id===id);
  if(!ch || ch.status!=="failed") return;
  ch.status = "pending";
  refreshBookPage();
  processBookQueue(false);
}
// 人生結束前把還沒寫完的章節等完(最多等maxMs)，讓封存到人生回顧的是完整的書
async function waitForBook(maxMs){
  const deadline = Date.now() + (maxMs||90000);
  while(Date.now() < deadline){
    const p = processBookQueue(false);
    if(!p) return;
    await Promise.race([p, new Promise(r=>setTimeout(r, Math.max(0, deadline-Date.now())))]);
  }
}
// 十五、15.1（2026-09-28使用者確認）：世代傳承保留上一代的人生之書(唯讀)，轉世丹不保留。
// 比照「就此闔卷」先等還沒寫完的章節(最多90秒)，再把寫好的章節另存到Worker(/family-book)，家族年表只記id——
// 一本書約100KB，直接放存檔傳幾代就會超過Worker的1MB上限。上傳失敗(離線等)才把章節整本留在存檔裡，至少不會弄丟
const FAMILY_BOOK_CHAPTER_FIELDS = ["id","index","label","part","title","text","ageFrom","ageTo"];
async function preserveFamilyBook(prev){
  if(!prev.book || !prev.book.chapters.length) return null;
  if(prev.book.chapters.some(c=>c.status!=="done")){
    prev.book.chapters.forEach(c=>{ if(c.status==="failed") c.status = "pending"; });
    document.getElementById("app").insertAdjacentHTML("afterbegin", `<div class="loading" id="book-finishing">正在把最後一章寫進人生之書…</div>`);
    await waitForBook(90000);
    document.getElementById("book-finishing")?.remove();
  }
  closeBookPage();
  const chapters = prev.book.chapters.filter(c=>c.status==="done").map(c=>{
    const o = { status:"done" };
    FAMILY_BOOK_CHAPTER_FIELDS.forEach(k=>{ if(c[k]!==undefined) o[k] = c[k]; });
    return o;
  });
  if(!chapters.length) return null;
  const id = "fb" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  if(key){
    try{
      const res = await fetch(WORKER_URL+"family-book", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ key, id, book:{ owner: prev.name, chapters } }) });
      const data = await res.json();
      if(res.ok && data && data.success===true){ familyBookCache[id] = { chapters }; return { id, chapterCount: chapters.length }; }
    }catch(e){ console.warn("上一代的人生之書上傳失敗，改整本留在存檔裡", e); }
  }
  return { inline: { chapters }, chapterCount: chapters.length };
}
const familyBookCache = {};
async function loadFamilyBook(ref){
  if(!ref) return null;
  if(ref.inline) return ref.inline;
  if(familyBookCache[ref.id]) return familyBookCache[ref.id];
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);

const LOADING_LINES = [ // 【定案】清單寫成陣列，方便日後增刪
  "人生翻下一頁中",
  "正在翻開下一頁",
  "下一段人生落筆中",
  "草稿塗塗改改中",
  "筆尖沙沙作響中",
  "時間悄悄往前走",
  "墨水還沒乾，稍等一下"
];
const LOADING_ROTATE_MS = 4000;
let LOADING_SLOW_NOTICE_MS = 10000;
const LOADING_SLOW_TEXT = "這一頁寫得比較久，再等一下下";
let loadingStartedAt = null;
let loadingTimers = [];
let loadingLastRoundLine = -1; // 上一回合開頭那一句，這回合不重複
let loadingLineIdx = -1;
let loadingCurrentText = "";
function pickLoadingLine(avoidIdx){
  let i = Math.floor(Math.random()*LOADING_LINES.length);
  if(LOADING_LINES.length>1 && i===avoidIdx) i = (i + 1 + Math.floor(Math.random()*(LOADING_LINES.length-1))) % LOADING_LINES.length;
  loadingLineIdx = i;
  return LOADING_LINES[i];
}
function setLoadingText(text){
  loadingCurrentText = text;
  const t = document.querySelector("#turn-loading .loading-text");
  if(!t) return;
  t.classList.add("fading");
  setTimeout(()=>{ t.textContent = loadingCurrentText; t.classList.remove("fading"); }, reducedMotion() ? 150 : 300);
}
function renderTurnLoading(){
  return `<div class="loading-card glass" id="turn-loading" role="status" aria-live="polite">
    <span class="loading-text">${escapeHtml(loadingCurrentText || LOADING_LINES[0])}</span>
    <div class="breath" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>`;
}
function updateLoadingTimer(loadingTurn){
  if(!loadingTurn){
    loadingStartedAt = null;
    loadingTimers.forEach(t=>clearTimeout(t)); loadingTimers = [];
    return;
  }
  if(loadingStartedAt) return; // 同一次等待中再次render(true)，不重新計時
  loadingStartedAt = Date.now();
  loadingCurrentText = pickLoadingLine(loadingLastRoundLine);
  loadingLastRoundLine = loadingLineIdx;
  const rotate = ()=>{
    if(!loadingStartedAt) return;
    if(Date.now()-loadingStartedAt >= LOADING_SLOW_NOTICE_MS) return;
    setLoadingText(pickLoadingLine(loadingLineIdx));
    loadingTimers.push(setTimeout(rotate, LOADING_ROTATE_MS));
  };
  loadingTimers.push(setTimeout(rotate, LOADING_ROTATE_MS));
  loadingTimers.push(setTimeout(()=>{ if(loadingStartedAt) setLoadingText(LOADING_SLOW_TEXT); }, LOADING_SLOW_NOTICE_MS));
}
function reducedMotion(){
  try{ return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }catch(e){ return false; }
}

  // 10.3.11（2026-09-25）：真實模式由伺服器判斷日期與補點，本機跨日時向Worker重新讀一次餘額(每個日期只問一次，避免時鐘不一致時一直重問)

  ensureDebugUI();

function relativeTimeText(ts){
  if(!ts) return "";
  const min = Math.floor((Date.now()-ts)/60000);
  if(min < 1) return "剛剛";
  if(min < 60) return `${min} 分鐘前`;
  const hr = Math.floor(min/60);
  if(hr < 24) return `${hr} 小時前`;
  const day = Math.floor(hr/24);
  if(day < 30) return `${day} 天前`;
  const mon = Math.floor(day/30);
  return mon < 12 ? `${mon} 個月前` : `${Math.floor(mon/12)} 年前`;
}

// 16.10.7：翻回第一頁，時長用16.4.1的「慢」(600ms)；減少動態模式直接跳回頂端
function smoothScrollTop(duration){
  if(reducedMotion() || !window.requestAnimationFrame){ window.scrollTo(0,0); return; }
  const from = window.scrollY, start = performance.now();
  const step = now=>{
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3); // 接近16.4.1的進場曲線
    window.scrollTo(0, Math.round(from*(1-eased)));
    if(p<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function drawShareCard(info, events){
  const canvas = document.createElement("canvas");
  canvas.width = 720; canvas.height = 420 + events.length*34;
  const ctx = canvas.getContext && canvas.getContext("2d");
  if(!ctx) return null;
  ctx.fillStyle = "#f6f1e7"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#2b2622"; ctx.font = "bold 30px sans-serif"; ctx.fillText(`${info.name||""}的這一生`, 40, 60);
  ctx.font = "22px sans-serif"; ctx.fillText(info.trait && info.trait.type ? info.trait.text : LIFE_TRAIT_UNCLEAR_TEXT, 40, 105);
  lifeTraitCardBars(info.playStyle).forEach((b,i)=>{
    const y = 150 + i*36;
    ctx.fillStyle = "#2b2622"; ctx.font = "18px sans-serif"; ctx.fillText(b.label, 40, y+14);
    ctx.fillStyle = "#e3dccf"; ctx.fillRect(170, y, 400, 16);
    ctx.fillStyle = "#9c3b2e"; ctx.fillRect(170, y, Math.round(400*b.v), 16);
  });
  ctx.fillStyle = "#2b2622"; ctx.font = "18px sans-serif";
  events.forEach((e,i)=>ctx.fillText("・"+e, 40, 360 + i*34));
  return canvas.toDataURL("image/png");
}

let lastAnimatedLogLen = null;

  const s = state;

    stampEl.classList.add("restamp");
    try{ if(!rm && /Android/i.test(navigator.userAgent) && navigator.vibrate) navigator.vibrate(12); }catch(e){}
  }
  if(!loadingTurn) lastStampKey = stampKey;
  if(loadingTurn){
    const lc = document.getElementById("turn-loading");
    if(lc) scrollToCard(lc, rm);
    return;
  }
  const card = document.getElementById("latest-entry");
  const logLen = (s.log||[]).length;
  const isNew = lastAnimatedLogLen!==null && logLen!==lastAnimatedLogLen && card;
  const cashFrom = lastShownCash;
  lastAnimatedLogLen = logLen;
  lastShownCash = s.cash;
  if(!isNew) return;
  // 16.4.2第4～6步：卡片淡入(400ms)、段落每段間隔80ms、膠囊延遲200ms依序彈出(間隔60ms)、關係變化與存款結算接著淡入
  card.classList.add("anim-card");
  let t = 0;
  card.querySelectorAll(":scope > p, :scope > .doc-box p").forEach((p,i)=>{ p.style.animationDelay = (i*80)+"ms"; t = i*80; });
  let capAt = Math.max(400, t) + 200;
  card.querySelectorAll(".cap").forEach((c,i)=>{ c.style.animationDelay = (capAt + i*60)+"ms"; capAt += 0; });
  const nCaps = card.querySelectorAll(".cap").length;
  let lateAt = capAt + nCaps*60 + (nCaps?150:0);
  card.querySelectorAll(".rel-hint, .small-line").forEach((el,i)=>{ el.classList.add("late"); el.style.animationDelay = (lateAt + i*60)+"ms"; });
  // 16.4.2第7步：頂部存款由舊數字滾到新數字(慢)
  const cashEl = document.getElementById("tb-cash");
  if(cashEl && cashFrom!==null && cashFrom!==s.cash) rollNumber(cashEl, cashFrom, s.cash, rm ? 0 : 600, rm ? 0 : lateAt);
  // 16.4.2第8步：自動捲到新卡片頂端
  scrollToCard(card, rm);
}
function rollNumber(el, from, to, duration, delay){
  if(!duration){ el.textContent = to.toLocaleString(); return; }
  el.textContent = from.toLocaleString();
  setTimeout(()=>{
    const start = performance.now();
    const step = now=>{
      const p = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = Math.round(from + (to-from)*eased).toLocaleString();
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, delay||0);
}
function scrollToCard(el, rm){
  try{
    const bar = document.querySelector(".topbar");
    const top = el.getBoundingClientRect().top + window.scrollY - (bar ? bar.offsetHeight : 0) - 10;
    window.scrollTo({ top: Math.max(0, top), behavior: rm ? "auto" : "smooth" });
  }catch(e){}
}

  if(typeof s.chronicleSeen!=="number"){ s.chronicleSeen = len; return; }
  if(len > s.chronicleSeen){
    const last = [...s.log].reverse().find(e=>!e.error);
    if(last) last.major = true;
  }
  s.chronicleSeen = len;
}
const MEMOIR_HALF_KEYS = ["上學期","下學期","寒假","暑假","休學中"];
// 分組：學生時期每個學期或假期一個大節點；出社會後每一歲一個大節點(階段名稱沿用一、1.1.2)
function memoirGroupOf(e){
  const label = String(e.timeLabel||"");
  const parts = label.split("・").map(x=>x.replace(/（[^）]*）/g,""));
  const hi = parts.findIndex(p=>MEMOIR_HALF_KEYS.includes(p));
  if(hi>=0) return { key:"s:"+parts.slice(0,hi+1).join("・"), name:parts.slice(0,hi+1).join("・"), sub:parts.slice(hi+1).join("・"), age:e.age };
  if(/^(高[一二三]|大[一二三四五])/.test(parts[0]||"")) return { key:"s:"+parts[0], name:parts[0], sub:parts.slice(1).join("・"), age:e.age };
  return { key:"a:"+e.age, name:stageLabel(e.age), sub: label && !/^\d+歲$/.test(label) ? label : "", age:e.age };
}
function memoirCashOf(e){
  if(typeof e.cash==="number") return e.cash;
  if(e.settlement && typeof e.settlement.balanceAfter==="number") return e.settlement.balanceAfter;
  return null;
}
function renderMemoirTimeline(s){
  const entries = s.log.filter(e=>!e.error);
  if(!entries.length) return `<p style="color:var(--ink-soft);">還沒有任何紀錄。</p>`;
  const lastIdx = entries.length-1;
  let html = "", curKey = null;
  entries.forEach((e,i)=>{
    const g = memoirGroupOf(e);
    if(g.key!==curKey){
      curKey = g.key;
      html += `<div class="tl-node"><span class="stamp tl-stamp"><b>${escapeHtml(String(g.age))}</b>歲</span><div><div class="tl-node-name">${escapeHtml(g.name)}</div><div class="tl-node-sub">${escapeHtml(g.age+"歲・"+stageLabel(g.age))}</div></div></div>`;
    }
    const cash = memoirCashOf(e);
    const meta = [g.sub, e.subtitle, cash!==null ? `存款 ${cash.toLocaleString()}` : ""].filter(Boolean).join("　");
    html += `<div class="tl-item${e.major?" major":""}${i===lastIdx?" latest":""}">
      <span class="tl-dot" aria-hidden="true">${e.major ? `<span class="tl-mini-stamp">印</span>` : ``}</span>
      <div class="tl-card glass" role="button" tabindex="0" aria-expanded="false">
        ${meta ? `<div class="tl-meta">${escapeHtml(meta)}</div>` : ``}
        <div class="tl-text">${renderPlainParagraphs(e.text, false)}</div>
        ${renderStatChanges(e.statChanges)}
      </div>
    </div>`;
  });
  return html;
}

function renderLifestyleModal(){
  const s = state;
  if(!s || s.phase!=="playing") return;
  document.getElementById("lifestyle-modal")?.remove();
  const draft = {}; LIFESTYLE_SETTINGS.forEach(x=>draft[x.key] = s[x.key]);
  const div = document.createElement("div");
  div.id = "lifestyle-modal";
  div.className = "modal-backdrop";
  const paint = ()=>{

    div.innerHTML = `
      <div class="modal" style="text-align:left;">
        <h3>生活方式</h3>
        ${LIFESTYLE_SETTINGS.map(x=>`
          <div class="k" style="margin:10px 0 6px;">${x.label}</div>
          ${x.options(s).map(o=>`<button class="ghost-btn ls-opt" data-key="${x.key}" data-val="${escapeHtml(o.value)}" ${o.locked?'disabled':''}
              style="margin:0 6px 6px 0;${o.locked?'opacity:.45;':''}${draft[x.key]===o.value?'background:var(--ink);color:var(--paper);':''}">${escapeHtml(o.value)}</button>`).join("")}
          ${x.options(s).filter(o=>o.locked).map(o=>`<div style="font-size:11px;color:var(--ink-soft);">${escapeHtml(o.value)}：${escapeHtml(o.reason)}</div>`).join("")}`).join("")}

      </div>`;
    div.querySelectorAll(".ls-opt").forEach(btn=>btn.onclick = ()=>{ if(btn.disabled) return; draft[btn.dataset.key] = btn.dataset.val; paint(); });
    document.getElementById("btn-lifestyle-cancel").onclick = ()=>div.remove();
    document.getElementById("btn-lifestyle-save").onclick = ()=>{ div.remove(); applyLifestyleChange(draft); };
  };

function applyLifestyleChange(draft){
  const s = state;
  const from = {}, to = {};
  LIFESTYLE_SETTINGS.forEach(x=>{
    const v = draft[x.key];
    if(!v || v===s[x.key]) return;
    const opt = x.options(s).find(o=>o.value===v);
    if(!opt || opt.locked) return; // 防呆：鎖住的選項不能選
    from[x.key] = s[x.key]; to[x.key] = v; s[x.key] = v;
  });
  if(!Object.keys(to).length) return;
  if(to.mealArrangement==="自己打理") s.cookingInterestSeed = true; // 5.5／3.4.10興趣系統伏筆(原本只寫在解鎖視窗)
  // 下一回合payload通知AI一次(同一回合改好幾次，保留最早的from)
  const prev = s.lifestyleChangeLog;
  s.lifestyleChangeLog = { from: Object.assign({}, from, prev ? prev.from : {}), to: Object.assign({}, prev ? prev.to : {}, to) };
  Object.keys(s.lifestyleChangeLog.to).forEach(k=>{ if(s.lifestyleChangeLog.from[k]===s.lifestyleChangeLog.to[k]){ delete s.lifestyleChangeLog.from[k]; delete s.lifestyleChangeLog.to[k]; } });
  if(!Object.keys(s.lifestyleChangeLog.to).length) s.lifestyleChangeLog = null;
  saveGame(); render();
}

// 9.5.1 轉系結果判定：抽出成純函式方便測試，不依賴DOM。mainChoice: "stay"/"apply"/"wait"；targetKey僅在apply時需要
// 十一、11.4（2026-09-23新增）：收錄為明牌檢定節點，回傳{success,roll,probPct,majorLabel}供UI揭曉骰值細節，取代原本直接Math.random()判定不現骰值的做法
function resolveTransferOffer(s, mainChoice, targetKey){
  s.transferCooldown = TRANSFER_COOLDOWN_TURNS;
  s.examBelowExpectationStreak = 0;
  if(mainChoice==="apply" && targetKey){
    const cat = findMajorCategory(targetKey);
    if(!cat) return null;
    // 十六、16.2.2/16.2.3：申請轉系算冒險＋偏離常規；考試失利後申請轉系算「轉向」、留在原系算「重來」
    logPlayStyleRisk(s, 1); logPlayStyleDeviation(s); logPlayStyleSetbackResponse(s, "pivot", ["exam_fail"]);
    // 9.5.1【定案】結果判定複用2.4考試成績算法（2026-09-27使用者同意Claude建議）：rollFinalExamCheck(才識, 本學期讀書次數)，
    // 最終分數≥60(EXAM_CHECK_PASS_THRESHOLD)算轉系成功，取代原本另設的0.3＋才識×0.5＋自律修正公式
    const examCheck = rollFinalExamCheck(s.stats.knowledge, s.studyCountThisTerm||0);
    const success = examCheck.passed;
    const roll = examCheck.roll, probPct = null;
    if(success){
      const isFive = cat.isFiveYearEligible && isTransferFeasible(s.age,5,s.collegeDelayYearsUsed);
      assignStudentMajor(s, targetKey, isFive);
      s.timeState.yearInStage = 1; // 9.5.1【定案】不做學分抵免判斷，一律從大一重新起算
      s.universityEventLog = { type:"transfer_success", major: cat.label };
    } else {
      s.universityEventLog = { type:"transfer_failed", major: cat.label };
    }
    return { success, roll, probPct, majorLabel: cat.label, examCheck };
  } else if(mainChoice==="stay"){
    logPlayStyleRisk(s, -1); logPlayStyleSetbackResponse(s, "retry", ["exam_fail"]);
    s.universityEventLog = { type:"transfer_declined" };
  }
  return null;
}

// 9.5.3 休學/肄業決定：choice = "leave"/"withdraw"/"stay"
function resolveWithdrawalOffer(s, choice){
  // 9.8.1（2026-09-22修正）：休學可用條件改為兩項都要成立，不再只看delay_years上限（防呆，UI也會先擋，這裡是程式層再把關一次）
  if(choice==="leave" && !isAnotherLeaveFeasible(s)) return;
  // 十六、16.2.2/16.2.3：休學、肄業算偏離常規；挫折後休學算「休息」、肄業算「轉向」、撐下去算「重來」
  if(choice==="leave" || choice==="withdraw") logPlayStyleDeviation(s);
  logPlayStyleSetbackResponse(s, choice==="leave" ? "rest" : choice==="withdraw" ? "pivot" : "retry", null);
  if(choice==="leave"){
    // 9.8：delay_years最小粒度0.5年對應休一學期，記一次0.5年代價（只作帳本用途，不再加進畢業門檻，見9.8.1）
    s.collegeDelayYearsUsed = clamp((s.collegeDelayYearsUsed||0)+0.5, 0, COLLEGE_DELAY_CAP);
    // 9.5.3（9/16補充）：記錄休學當下正在哪個學期（上學期0~6段 or 下學期7~13段），供復學時重置回該學期開頭，該學期視為未完成不計入進度
    s.leaveSemesterHalfIndex = (s.timeState.segmentIndex||0) < SEMESTER_PHASES.length ? 0 : SEMESTER_PHASES.length;
    s.leaveStatus = "onLeave";
    s.leaveResumeCountdown = LEAVE_OF_ABSENCE_TURNS;
    s.lowHealthStreak = 0; s.lowCashStreak = 0; // 復學視為重新開始，不然同樣的低點會立刻再次觸發候選
    s.universityEventLog = { type:"leave_of_absence" };
  } else if(choice==="withdraw"){
    s.studentStatus = "withdrawn"; // 九、9.5.3（2026-09-22定案）：肄業後不可重新入學，本函式與其他任何地方都不會把studentStatus從withdrawn改回enrolled
    s.timeState.stageMode = "career";
    applyHalfYearCarryOnCareerEntry(s); // 9.8.1：帶著halfYearCarry=1肄業時，當年度回合預算設為一半
    s.universityEventLog = { type:"withdrawn" };
  } else {
    // 2026-09-27修正：選「撐下去」後原本下一回合會立刻再跳。冷卻回合數沿用觸發門檻WITHDRAWAL_STREAK_TRIGGER，
    // 不動lowHealthStreak（過勞訊號與轉職候選共用），冷卻期滿後若仍持續低值才再提
    s.withdrawalOfferCooldown = WITHDRAWAL_STREAK_TRIGGER;
  }
}

function renderBusinessLaunchModal(pending){
  const s = state;

  const div = document.createElement("div");

  const partner = findBusinessPartnerCandidate(s);
  const offerPartner = partner && Math.random() < partnerOptionProb(s);
  const partnerCapital = Math.round(capital*PARTNER_CAPITAL_SHARE);
  const affordable = s.cash >= capital;
  const partnerAffordable = offerPartner && s.cash >= partnerCapital;
  div.innerHTML = `
    <div class="modal">
      <h3>要開始創業嗎？</h3>
      <p style="font-size:13px;">啟動門檻：現金需≥${capital}（目前現金：${Math.round(s.cash)}）</p>

      <button class="ghost-btn" id="btn-business-launch-decline" style="margin-top:10px;">先不創業</button>
    </div>`;
  document.body.appendChild(div);
  const finish = (launched)=>{
    // 十二、12.11.1（2026-09-22新增）：若這次創業候選來自職涯伏筆的創業線，結算候選狀態(接受/拒絕)
    if(pending && pending.foreshadowLine) closeForeshadowCandidate(s, pending.foreshadowLine, launched);
    div.remove(); saveGame(); render();
  };
  const solo = document.getElementById("btn-business-launch-solo");
  if(solo) solo.onclick = ()=> finish(launchBusiness(s));
  const withPartner = document.getElementById("btn-business-launch-partner");
  if(withPartner && partnerAffordable) withPartner.onclick = ()=> finish(launchBusiness(s, { partnerName: partner.name }));
  document.getElementById("btn-business-launch-decline").onclick = ()=> finish(false);
}

  const segs = s.ending.segments || (s.ending.summary ? [{label:"", text:s.ending.summary}] : []);

  // 十六、16.7（2026-09-28 claude.ai定案結構）：結局卡 → 人生回顧(L1/L2展開不收合) → 翻開人生之書 → 下一步按鈕 → 闔上這份草稿。
