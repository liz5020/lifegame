function resolveRetirementOffer(s, choice, customText){
  s.pendingRetirementOffer = null;
  // 2026-09-27修正：原本70歲以後只在UI把按鈕反灰，彈窗預設值仍是delay，直接按確定可無限延後；程式層在這裡把關
  if(choice==="delay" && s.age>=RETIREMENT_DELAY_MAX_AGE) choice = "on_time";
  // 12.10【定案】第6個選項「自訂輸入」（2026-09-27補上）：視同繼續工作，玩家寫的內容交給AI寫進敘事
  if(choice==="custom"){
    s.careerEventLog = { type:"retirement", choice:"custom", text: String(customText||"").slice(0, CUSTOM_INPUT_MAX_CHARS) };
    return;
  }
  if(choice==="handover" && !canHandOverBusiness(s)) return;
  if(!choice || choice==="delay" || choice==="no_retire"){
    s.careerEventLog = { type:"retirement", choice: choice||"no_retire" };
    return; // 繼續工作，不做任何狀態變動（呼應6.4永遠可以跳過）
  }
  if(choice==="early" && !canRetireEarly(s)) return; // 防呆：未達提早退休年齡或財務健康度門檻
  if(choice==="rest") choice = "on_time"; // 被迫退休的「專心療養」＝完全退休
  const rate = (RETIREMENT_REPLACEMENT_RATE[s.occupationCategory] || 0.45) + retirementTenureAdjustment(s);
  const preRetireSalary = s.monthlyIncome;
  s.retirementStatus = "已退休";
  completeMilestone(s, "retirement"); // 4.3.1（2026-09-27）
  s.careerStatus = choice==="semi" ? CAREER_STATUS.SEMI_RETIRED : CAREER_STATUS.RETIRED;
  s.riskyLifestyle = false; s.jobRiskSubtype = null; // 12.3（2026-09-27）：高風險旗標只來自在職的職業類別，離開該職業(失業/創業/收攤/退休)就清掉
  // 3.4.7既有「下一個完整月份才計入」規則：這裡直接覆寫monthlyIncome，因為退休決定發生在彈窗(回合之間)，
  // 自然只會影響下一次月結算，不會回溯這一回合已經算過的舊薪水，效果上等同「下一個完整月份起才變動」
  s.monthlyIncome = Math.round(preRetireSalary * rate * (choice==="semi" ? 0.5 : 1));
  s.careerEventLog = { type:"retirement", choice };
  // 2026-09-27：自營事業的老闆退休後，年度營運判定原本會繼續跑、改寫月收入；退休(非交棒)時把事業收起來
  if(choice!=="handover" && s.businessStatus==="經營中") s.businessStatus = "已收起";
  if(choice==="handover"){
    const heir = handoverHeirCandidate(s);
    s.businessStatus = "已交棒";
    heir.familyBusinessHeir = true;
    s.chronicle.push(`（${s.age}歲）把一手經營的事業交給了${heir.name}`);
    s.careerEventLog = { type:"retirement", choice, heir: heir.name };
  }
  // 12.10【定案】退休不扣幸福感，代碼中不出現「若已退休則幸福感-x」的寫法（呼應3.8.4程式層禁令，本函式完全不觸碰幸福感相關欄位）
}

// 12.11 職涯伏筆觸發點：掛在5個既有職涯狀態轉換節點，不新增判定回合(呼應9.1)
// 12.11.1（2026-09-22新增，取代原本「只寫入不讀取」的缺口）：命中後不再是單純的旗標陣列，而是{line,hitAge,hitTurn,status}
// 記錄，status依序鋪陳中(brewing)→已成為候選(candidate)→已接受(accepted)/已拒絕(declined)；判定順序每次隨機打亂，
// 不再固定創業線優先；每條線只要曾經有記錄（不論哪個狀態）就不會再命中第二次
function shuffledForeshadowLines(){
  const arr = FORESHADOW_LINES.slice();
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
function rollCareerForeshadow(s){
  if(!s.studentMajorGroup) return null;
  s.careerForeshadowLines = s.careerForeshadowLines || [];
  let hit = null;
  shuffledForeshadowLines().forEach(line=>{
    if(hit) return;
    if(s.careerForeshadowLines.some(e=>e.line===line)) return; // 每條線每一世最多命中一次
    if(Math.random() < foreshadowTriggerProbability(s.studentMajorGroup, line)){
      hit = line;
      s.careerForeshadowLines.push({ line, hitAge:s.age, hitTurn:s.turnCount, status:"brewing" });
    }
  });
  return hit;
}
const FORESHADOW_CANDIDATE_DELAY_TURNS = 6; // 【測試參數】命中後延遲幾回合才排入候選，鋪陳期間讓AI先自然帶出相關人事物
const FORESHADOW_CREATIVE_OFFER_BONUS_PP = 10; // 【測試參數】自由接案/演藝圈線候選時，「自由/創作類」錄取機率加成
const FORESHADOW_OVERSEAS_CASH_MONTHS = 6; // 【測試參數】海外線候選現金門檻＝N個月基本生活開銷（12.6.1原本待補的具體金額）
// 五、5.2.5／十二、12.11.1：接手家業前置條件——有一位父母角色卡職業為自營業者、仍在世、且這個機會還沒被任一觸發來源用掉過
// （2026-09-22補充：接手家業有兩個觸發來源——本函式供伏筆線與家長退休共用同一個判斷與同一個familyBusinessOfferUsed防重複旗標）
function findFamilyBusinessParent(s){
  return (s.characters||[]).find(c=>c.origin==="父母，從出生起" && c.occupation==="自營業者" && c.active!==false && !c.deceased && !c.familyBusinessOfferUsed) || null;
}
function closeForeshadowCandidate(s, line, accepted){
  const entry = (s.careerForeshadowLines||[]).find(e=>e.line===line && e.status==="candidate");
  if(entry) entry.status = accepted ? "accepted" : "declined";
}
// 每回合都要跑的掃描：鋪陳期滿的職涯伏筆線接回既有機制成為候選。各線候選欄位若被其他事件占用，這次先跳過，下回合再試
function sweepCareerForeshadowCandidates(s){
  (s.careerForeshadowLines||[]).forEach(entry=>{
    if(entry.status!=="brewing") return;
    if((s.turnCount - (entry.hitTurn||0)) < FORESHADOW_CANDIDATE_DELAY_TURNS) return;
    if(entry.line==="創業線"){
      if(s.businessStatus==="經營中"){ entry.status = "declined"; return; } // 已在創業中，直接記為已使用
      if(s.pendingBusinessLaunch) return;
      s.pendingBusinessLaunch = { foreshadowLine: entry.line };
      entry.status = "candidate";
    } else if(entry.line==="自由接案" || entry.line==="演藝圈線"){
      if(s.pendingJobSearch) return;
      s.pendingJobSearch = { offers: buildJobSearchOffers(s, { creativeBonusPct: FORESHADOW_CREATIVE_OFFER_BONUS_PP }), isTransfer: s.careerStatus===CAREER_STATUS.EMPLOYED, isFallback:false, foreshadowLine: entry.line, creativeBonusPct: FORESHADOW_CREATIVE_OFFER_BONUS_PP };
      entry.status = "candidate";
    } else if(entry.line==="海外線"){
      if(s.pendingJobSearch) return;
      if(s.cash < computeBasicLivingCost(s)*FORESHADOW_OVERSEAS_CASH_MONTHS){ entry.status = "declined"; return; } // 現金不足，候選不成立，不扣款
      s.pendingJobSearch = { offers: buildJobSearchOffers(s), isTransfer:true, isFallback:false, foreshadowLine: entry.line, isOverseas:true };
      entry.status = "candidate";
    } else if(entry.line==="接手家業"){
      const parent = findFamilyBusinessParent(s);
      if(!parent){ entry.status = "declined"; return; } // 前置條件不成立，只保留敘事，不產生候選
      if(s.pendingFamilyBusinessOffer) return;
      s.pendingFamilyBusinessOffer = { foreshadowLine: entry.line, parentName: parent.name };
      entry.status = "candidate";
    }
  });
}
// 十二、12.11.1（2026-09-22補充）：接手家業的第二個觸發來源——家長退休（parent_retirement里程碑由AI回報completed）時，
// 若還有一位自營業者家長沒被問過，也排入同一個「回家接手」候選；跟伏筆線觸發共用findFamilyBusinessParent()同一份判斷，
// 兩個來源合計每位家長只會被詢問一次，差別只在觸發來源不同（呼應9.3/12.11.1【定案】兩者共用同一個交棒動作）
function checkFamilyBusinessOnParentRetirement(s){
  if(s.pendingFamilyBusinessOffer) return;
  const parent = findFamilyBusinessParent(s);
  if(!parent) return;
  s.pendingFamilyBusinessOffer = { foreshadowLine: null, parentName: parent.name };
}
// 接受「接手家業」：玩家比照既有轉職流程結束原職業，occupation_category轉為自營/家庭事業類、business_status經營中，
// 免啟動資金，不計入first_startup里程碑（12.11.1【定案】，區別於12.8.1一般創業路徑）
function acceptFamilyBusinessOffer(s){
  s.occupationCategory = "自營/家庭事業類";
  s.businessStatus = "經營中";
  s.businessOrigin = "inherited"; // 供rollAnnualBusinessCheck()判斷是否套用接手家業的成功率加成
  s.businessPartner = null;
  s.careerStatus = CAREER_STATUS.BUSINESS;
  s.riskyLifestyle = false; s.jobRiskSubtype = null; // 12.3（2026-09-27）：高風險旗標只來自在職的職業類別，離開該職業(失業/創業/收攤/退休)就清掉
  s.consecutiveLossYears = 0;
  s.monthlyIncome = Math.round(computeCareerSalary(s, "自營/家庭事業類") * SALARY_SCALE * businessIncomeFactor(s));
  s.careerEventLog = { type:"family_business_takeover", success:true };
}
// pending: { foreshadowLine, parentName }；choice: "accept"/"decline"——不論接受或拒絕，該家長都標記familyBusinessOfferUsed，
// 兩個觸發來源合計只會問這位家長一次；只有實際接受才額外標記handedOver（12.11.1【定案】「該家長職業標記為已交棒」）
function resolveFamilyBusinessOffer(s, pending, choice){
  const parent = s.characters.find(c=>c.name===pending.parentName);
  if(parent){
    parent.familyBusinessOfferUsed = true;
    if(choice==="accept") parent.handedOver = true;
  }
  if(choice==="accept") acceptFamilyBusinessOffer(s);
  if(pending.foreshadowLine) closeForeshadowCandidate(s, pending.foreshadowLine, choice==="accept");
}

// 12.12：職涯主狀態欄位初始化輔助——所有欄位皆用||預設值處理，比照9.4/9.8既有做法，不需要改newRoll()/succeedAsChild()，對舊存檔相容
function ensureCareerDefaults(s){
  if(!s.careerStatus) s.careerStatus = s.occupationCategory ? CAREER_STATUS.EMPLOYED : CAREER_STATUS.NOT_EMPLOYED;
  if(!s.retirementStatus) s.retirementStatus = "在職";
  if(typeof s.jobLevel!=="number") s.jobLevel = 0;
  if(typeof s.tenureMonths!=="number") s.tenureMonths = 0;
}
// 每年判定一次的職涯檢查集合：裁員/創業年度營運/退休候選，比照7.1.5rollAnnualDeathCheck()「每滿一年才判定一次」的既有做法，與回合預算解耦
function rollAnnualCareerChecks(s){
  ensureCareerDefaults(s);
  // 12.10（2026-09-27）：累積工作年資(在職或經營事業的年數)，供退休金依年資微調
  if(s.careerStatus===CAREER_STATUS.EMPLOYED || s.careerStatus===CAREER_STATUS.BUSINESS) s.careerYearsWorked = (s.careerYearsWorked||0)+1;
  const layoff = rollAnnualLayoffCheck(s);
  const business = rollAnnualBusinessCheck(s);
  checkRetirementCandidate(s);
  // 12.7/12.8.2/12.13（2026-09-27修正）：年度判定結果原本被丟掉，AI拿不到裁員前兆與營運結果。
  // 年度判定在呼叫AI之前跑，寫進careerEventLog就會隨本回合career_event_now送出；若同回合已有彈窗事件，掛在annual底下不覆蓋
  let annualEvent = null;
  if(layoff.justForeshadowed) annualEvent = { type:"layoff_foreshadow" };
  else if(layoff.layoffTriggered) annualEvent = { type:"layoff" };
  else if(business) annualEvent = { type:"business_annual", outcome: business.outcome };
  if(annualEvent){
    s.careerEventLog = s.careerEventLog ? Object.assign({}, s.careerEventLog, { annual: annualEvent }) : annualEvent;
  }
  return { layoff, business };
}
// 每回合都要跑的職涯檢查集合：求職觸發/升遷候選/轉職候選(段落型判定，不與回合預算解耦)
const SIDE_BUSINESS_UPGRADE_TURNS = 24; // 【測試參數,12.8.1，2026-09-27】
// 八、8.7【定案】副業三選一「非二元開關」、正式副業要真正產生成本/時間壓力差異（2026-09-27補上，使用者授權Claude全權判斷，【測試參數】）：
// 保持興趣＝無變化；接零星案＝每月小額副業收入；正式副業＝每月較多副業收入，時間成本依8.7【測試值】現階段用敘事呈現(prompt)，
// 滿24回合再升級為創業候選(12.8.1)。只算仍是正式興趣卡(active)的副業，興趣淡成背景就停；正式副業已經升級並成功創業後，
// 收入改由事業本身計算，不重複給
const SIDE_BUSINESS_MONTHLY_INCOME = { gig:3, formal:6 };
function computeSideBusinessIncome(s){
  return (s.interestCandidates||[]).reduce((sum,c)=>{
    if(c.status!=="active") return sum;
    if(c.sideBusinessStatus==="formal" && c.sideBusinessUpgradeOffered && s.businessStatus==="經營中") return sum;
    return sum + (SIDE_BUSINESS_MONTHLY_INCOME[c.sideBusinessStatus]||0);
  }, 0);
}
// 12.8.1：正式副業持續滿SIDE_BUSINESS_UPGRADE_TURNS回合，升級為創業候選（跳創業彈窗，現金門檻照常在launchBusiness把關）；每張卡只升級一次
function checkSideBusinessUpgrade(s){
  if(s.businessStatus==="經營中" || s.pendingBusinessLaunch) return;
  const card = (s.interestCandidates||[]).find(c=>c.sideBusinessStatus==="formal" && !c.sideBusinessUpgradeOffered &&
    c.sideBusinessSince!=null && s.turnCount - c.sideBusinessSince >= SIDE_BUSINESS_UPGRADE_TURNS);
  if(!card) return;
  card.sideBusinessUpgradeOffered = true;
  s.pendingBusinessLaunch = { source:"side_business", interestCategory: card.category };
  rollCareerForeshadow(s); // 12.11：8.7副業轉正是五個伏筆觸發點之一
}
function checkCareerTriggers(s){
  ensureCareerDefaults(s);
  checkSideBusinessUpgrade(s);
  checkJobSearchTrigger(s);
  checkPromotionCandidate(s);
  checkTransferCandidate(s, false);
  sweepCareerForeshadowCandidates(s); // 十二、12.11.1（2026-09-22新增）
}

// ========== 十六、16.2 隱性行為傾向追蹤 playStyle（2026-09-26新增，【草案】待使用者確認） ==========
// 只記錄「這一生怎麼活」，不影響任何數值判定、不送給AI、不顯示給玩家（16.2.1）。
// 第一版只從結構化節點(彈窗選擇/客戶端判定)計數，不分析自由輸入文字——時間跳過雖然由關鍵字偵測，但它本身就是既有的結構化跳過指令
const PLAYSTYLE_SETBACK_WINDOW_TURNS = 24; // 【測試參數,16.2.3】挫折後多少回合內的下一個結構化選擇，才算「面對錯誤」的回應
const PLAYSTYLE_JOB_RISKY_PCT = 50; // 【測試參數,16.2.2】求職投遞錄取機率低於此值算「高風險路線」
const PLAYSTYLE_JOB_SAFE_PCT = 70;  // 【測試參數,16.2.2】求職投遞錄取機率達此值以上算「保守路線」
function newPlayStyle(){
  return {
    risk:0, riskEvents:0,          // 面對風險：高風險+1／保守−1，riskEvents為計入次數
    deviation:0,                   // 規則與自由度：每走一次偏離常規的路線+1
    relation:0, relationEvents:0,  // 人際與界線：投入關係+1／獨處或抽離−1
    setback:{ retry:0, pivot:0, rest:0 }, pendingSetback:null, // 面對錯誤：挫折後下一個結構化選擇分成重來/轉向/休息
    skips:0,                       // 效率與控制感：每次成功跳過時間+1
    longestInterest:null           // 長期關注：{category, turns}，持續最久的興趣
  };
}
function ensurePlayStyle(s){ if(!s.playStyle) s.playStyle = newPlayStyle(); return s.playStyle; }
function logPlayStyleRisk(s, delta){ const p = ensurePlayStyle(s); p.risk += delta; p.riskEvents += 1; }
function logPlayStyleDeviation(s){ ensurePlayStyle(s).deviation += 1; }
function logPlayStyleRelation(s, delta){ const p = ensurePlayStyle(s); p.relation += delta; p.relationEvents += 1; }
function logPlayStyleSkip(s){ ensurePlayStyle(s).skips += 1; }
// type: "exam_fail"(期末考明牌檢定未過)／"job_loss"(裁員、收攤)；prevCategory供判斷「重來」(回到同一類工作)還是「轉向」
function markPlayStyleSetback(s, type, prevCategory){
  ensurePlayStyle(s).pendingSetback = { type, turn: s.turnCount||0, prevCategory: prevCategory||null };
}
// kind: "retry"/"pivot"/"rest"；types：這個選擇只算哪幾種挫折的回應(null＝任何挫折都算)
function logPlayStyleSetbackResponse(s, kind, types){
  const p = ensurePlayStyle(s);
  const sb = p.pendingSetback;
  if(!sb) return;
  if((s.turnCount||0) - sb.turn > PLAYSTYLE_SETBACK_WINDOW_TURNS){ p.pendingSetback = null; return; }
  if(types && !types.includes(sb.type)) return;
  p.setback[kind] += 1;
  p.pendingSetback = null;
}
function updatePlayStyleLongestInterest(s, card){
  const start = typeof card.createdTurn==="number" ? card.createdTurn : parseInt(String(card.id).split("_").pop(),10);
  if(!isFinite(start)) return;
  const turns = (card.lastEngagedRound||0) - start;
  const p = ensurePlayStyle(s);
  if(!p.longestInterest || turns > p.longestInterest.turns) p.longestInterest = { category: card.category, turns };
}

let state = null;
// 十、10.3.8：點數歸零時畫面停用到補回來為止；玩家把頁面開著跨過台灣時間00:00時，每分鐘檢查一次自動解鎖
setInterval(()=>{
  if(state && state.phase==="playing" && totalAP(state)===0 && refillDailyIfNeeded(state)){
    document.getElementById("ap-exhausted-modal")?.remove();
    saveGame(); render();
  }
}, 60*1000);

// 十、10.1（9/19新增）：封測階段純金鑰模式的啟動流程。
// 十六、16.10.9（2026-09-28使用者同意Claude建議）：取消「有金鑰就自動接續上次那段人生」，進站一律先顯示首頁，
// 從「還沒寫完的人生」卡片接回；開始新人生/切換其他人生都從首頁的按鈕進去
async function initApp(){
  state = { phase:"home" };
  render();
}
// 讀取指定slot：先試Worker(跨裝置的最新資料)，失敗且allowLocalFallback時退回本機快取（離線容錯，不會直接卡死玩家）
async function tryLoadSlot(key, slot, allowLocalFallback){
  cloudSyncStatus = null; // 十、10.1補充：換一段人生要玩，上一段的同步狀態顯示沒有意義了
  try{
    const res = await fetch(WORKER_URL+"load?key="+encodeURIComponent(key)+"&slot="+slot);
    const data = await res.json();
    if(data && data.success){
      state = data.state;
      if(state && state.characters) ensureCharacterGenders(state); // 4.1.3：舊存檔遷移
      try{ localStorage.setItem(STORAGE_KEY+":"+slot, JSON.stringify(state)); }catch(e){}
      render();
      refreshServerAP(); // 10.3.11：行動點以伺服器端為準，讀檔後同步一次
      if(state.book){ ensureBook(state); processBookQueue(false); } // 十五：上次沒寫完的章節接著寫
      return true;
    }
  }catch(e){ console.warn("從雲端讀取存檔失敗，嘗試本機快取", e); }
  if(allowLocalFallback){
    try{
      const raw = localStorage.getItem(STORAGE_KEY+":"+slot);
      if(raw){ state = JSON.parse(raw); if(state && state.characters) ensureCharacterGenders(state); render(); return true; } // 4.1.3：舊存檔遷移
    }catch(e){}
  }
  return false;
}
async function showSlotPicker(key, currentSlot, notice){

async function switchLife(){
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  const prevSlotRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
  const prevSlot = prevSlotRaw!==null ? Number(prevSlotRaw) : null;
  try{ localStorage.removeItem(ACTIVE_SLOT_STORAGE_NAME); }catch(e){}
  cloudSyncStatus = null;
  if(!key){ state = { phase:"home" }; render(); return; } // 防呆：理論上進得了playing畫面一定已經有金鑰
  await showSlotPicker(key, prevSlot);

async function saveGame(){
  const slotRaw = localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME);
  const slot = slotRaw!==null ? Number(slotRaw) : null;
  try{ localStorage.setItem(STORAGE_KEY+(slot!==null?":"+slot:""), JSON.stringify(state)); }
  catch(e){ console.warn("save failed", e); }
  writeHomeMeta(slot);
  // 十、10.1（9/19新增）：本機存完之後，同步存一份到Worker的KV，達成跨裝置存檔。
  // 只在真正進入遊戲(playing/ending)且有金鑰+slot時才同步，避免setup過程中還沒真的開始的角色也去打API；
  // 失敗只console.warn，不影響當下遊玩（本機那份已經存好了）
  const key = localStorage.getItem(RECOVERY_KEY_STORAGE_NAME);
  if(key && slot!==null && state && (state.phase==="playing" || state.phase==="ending")){
    try{
      const res = await fetch(WORKER_URL+"save", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
          key, slot,
          meta: { name:state.name, age:state.age, stage:stageLabel(state.age), updatedAt:Date.now() },
          state
        })
      });
      // 十、10.1補充（2026-09-22修正）：原本只看fetch有沒有拋出網路例外，Worker回傳403/429/500等HTTP錯誤狀態
      // 時fetch本身不會拋例外，會被誤判成同步成功——改成明確檢查res.ok(HTTP狀態碼)+回傳body的success欄位
      let data = null;
      try{ data = await res.json(); }catch(e){}
      if(!res.ok || !data || data.success!==true) throw new Error("Worker回傳失敗狀態："+res.status);
      cloudSyncStatus = { success:true, time:Date.now() };
    }catch(e){
      console.warn("雲端存檔失敗", e);
      cloudSyncStatus = { success:false };
    }
    updateCloudSyncStatusUI();
  }
}
// 十、10.1補充（2026-09-22新增）：只更新畫面上「☁️ 已同步」狀態文字的那個小容器，不呼叫完整的render()——
// saveGame()是fire-and-forget呼叫(呼叫端通常不await，緊接著就呼叫render())，如果這裡也呼叫完整render()，
// 等雲端fetch非同步結束時很可能會蓋掉玩家當下正在輸入的自訂行動文字框內容
function cloudSyncStatusHTML(){
  if(!cloudSyncStatus) return "";
  if(cloudSyncStatus.success){
    const d = new Date(cloudSyncStatus.time);
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    return `☁️ 已同步：${hh}:${mm}`;
  }
  return `⚠️ 雲端同步失敗，這段進度目前只存在本機 <a id="link-retry-sync">重試同步</a>`;
}
function updateCloudSyncStatusUI(){
  const wrap = document.getElementById("cloud-sync-status-wrap");
  if(!wrap) return; // 不在playing/ending畫面時，畫面上本來就沒有這個容器
  wrap.innerHTML = cloudSyncStatusHTML();
  const retryLink = document.getElementById("link-retry-sync");
  if(retryLink) retryLink.onclick = ()=>{ saveGame(); };
}

// 【定案】household_status：單身／同居／已婚雙薪／已婚單薪／離婚後——這格原本算不出來，補上後3.4.8共同生活那格才能落實
function computeHouseholdStatus(s){
  const married = s.characters.find(c=>c.romanceStatus==="married");
  if(married) return (s.spouseIncome||0) > 0 ? "已婚雙薪" : "已婚單薪";
  if(s.characters.some(c=>c.romanceStatus==="divorced")) return "離婚後";
  if(s.characters.some(c=>c.romanceStatus==="stable" && c.cohabiting)) return "同居"; // 七、7.6.1.1（2026-09-22新增觸發入口）：穩定交往滿8回合且已搬出原生家庭時，可透過結構化彈窗選擇搬去一起住
  return "單身";
}
const HOUSEHOLD_SHARED_LIVING_MULTIPLIER = 1.6; // 【測試參數,待驗證,3.4.11】已婚雙薪/已婚單薪：共同生活基本開銷＝單人基準×1.6，搭配配偶收入併入計算
// 七、7.6.1.1／三、3.4.11（2026-09-22新增）：同居(未婚)不合併伴侶收入，係數改為單人基準×1.6÷2＝0.8倍，
// 不再套用已婚的1.6倍——原本同居套用跟已婚一樣的1.6倍但沒有伴侶收入併入，等於玩家一個人負擔比單身還貴的開銷
const HOUSEHOLD_COHABITING_LIVING_MULTIPLIER = HOUSEHOLD_SHARED_LIVING_MULTIPLIER / 2; // 【測試參數】0.8倍
// 【定案】子女扶養費依年齡三級，大學階段直接接3.4.4(統一由家長支付，不扣款)，不重複建一套
const CHILD_SUPPORT_PRESCHOOL_MAX_AGE = 5;
const CHILD_SUPPORT_SCHOOL_MAX_AGE = 17;
const CHILD_SUPPORT_AMOUNT = { preschool:3, school:5 }; // 【待驗證,3.4.11】三級扶養費具體金額，跟3.4.8基準金額一樣先用參數值
const CHILD_SUPPORT_COLLEGE_MAX_AGE = 22; // 【測試參數,3.4.11，2026-09-27】
function childSupportAmount(age){
  if(typeof age!=="number") return 0;
  if(age<=CHILD_SUPPORT_PRESCHOOL_MAX_AGE) return CHILD_SUPPORT_AMOUNT.preschool;
  if(age<=CHILD_SUPPORT_SCHOOL_MAX_AGE) return CHILD_SUPPORT_AMOUNT.school;
  // 3.4.11（2026-09-27使用者同意Claude建議）：18~22歲大學期間照青少年級繼續算生活費；學費照3.4.4由家長支付、不另外算
  if(age<=CHILD_SUPPORT_COLLEGE_MAX_AGE) return CHILD_SUPPORT_AMOUNT.school;
  return 0; // 22歲以後：不再列入扶養
}
function computeChildSupportCost(s){
  // 【定案】多名子女各自計算，不打折
  // 3.4.11【定案】離婚後非主要照顧者扶養費維持為週期性支出（2026-09-27修正：原本只算active子女，沒同住的子女12回合沒互動
  // 被降為背景角色後扶養費就停了）。改看是否仍在世，成年與否由childSupportAmount()依年齡處理
  return (s.characters||[]).filter(c=>c.isChild && !c.deceased).reduce((sum,c)=>sum+childSupportAmount(c.age),0);
}
// 3.4.10（2026-09-28）：基本需求(未乘三餐)。學生期固定STUDENT_BASIC_NEED；出社會後照3.4.8居住分級，已婚/同居套3.4.11分攤係數
// 2026-09-27：學生判斷改用studentStatus（3.4.8明文禁止以occupationCategory判斷），畢業未就業/收攤者走housing分級，不會變0
function livingBasicNeed(s){
  if(isStudentPhase(s)) return STUDENT_BASIC_NEED;
  const tier = livingCostTierForState(s);
  let amount = LIVING_COST_BASE[tier] * LIVING_COST_MULTIPLIER;
  // 三、3.4.11（2026-09-20新增，2026-09-22拆分同居/已婚兩組係數，取代原本「與伴侶共同生活時整體×0.75」算不出household_status的舊做法）：
  // 已婚雙薪/已婚單薪採分攤係數1.6倍(搭配配偶收入併入計算)；同居(未婚)不合併伴侶收入，改用0.8倍；離婚後回到單身級距，不套用此係數
  const householdStatus = computeHouseholdStatus(s);
  if(householdStatus==="已婚雙薪" || householdStatus==="已婚單薪"){
    amount = amount * HOUSEHOLD_SHARED_LIVING_MULTIPLIER;
  } else if(householdStatus==="同居"){
    amount = amount * HOUSEHOLD_COHABITING_LIVING_MULTIPLIER;
  }
  return amount;
}
// 基本生活開銷＝基本需求×三餐倍率＋子女扶養費＋慢性病費用；不含可支配花費。
// 醫療費、出國伏筆門檻這些「以生活費為量級」的計算用這個，不會因為收入高、花錢大方就跟著變貴
function computeBasicLivingCost(s){
  const meal = MEAL_EXPENSE_MULT[s.mealArrangement] ?? MEAL_EXPENSE_MULT["自己打理"];
  // 十三、13.3.3（2026-09-20新增）：慢性病每項每月低費用等級固定支出，掛在這裡與子女扶養費同一套週期性結算路徑
  return Math.round(livingBasicNeed(s) * meal) + computeChildSupportCost(s) + (s.chronicConditions||[]).length*CHRONIC_CONDITION_MONTHLY_COST;
}
// 每月生活開銷(結算用)＝基本生活開銷＋可支配的錢×花錢習慣比例。
// 可支配的錢＝每月收入(含配偶、副業)−基本需求−固定支出(房租房貸等monthlyExpenses、扶養費、慢性病)，不足時為0；
// 學生期收入＝零用錢(打工收入是一次性入帳，不算在這裡)
function computeBaseLivingCost(s){
  const meal = MEAL_EXPENSE_MULT[s.mealArrangement] ?? MEAL_EXPENSE_MULT["自己打理"];
  const income = s.monthlyIncome + (s.spouseIncome||0) + computeSideBusinessIncome(s);
  const fixed = s.monthlyExpenses.reduce((sum,e)=>sum+e.amount,0) + computeChildSupportCost(s) + (s.chronicConditions||[]).length*CHRONIC_CONDITION_MONTHLY_COST;
  const disposable = Math.max(0, income - livingBasicNeed(s) - fixed);
  const habit = SPENDING_HABITS[s.spendingHabit] ?? SPENDING_HABITS["普通花費"];
  // 加總後才四捨五入一次，避免兩段各自進位多算1
  return Math.round(livingBasicNeed(s) * meal + disposable * habit) + computeChildSupportCost(s) + (s.chronicConditions||[]).length*CHRONIC_CONDITION_MONTHLY_COST;
}

  // relation標「（不同住）」、不同住、自己的教養風格與職業、好感度依自己的風格區間再−10（不同住、見面少）；

// 二、2.2學期內部節奏切分（9/16改版）：期中/期末各自有完整準備期（取代原本「期中後~期末前」單一段落混合準備+收尾的不對稱結構）
// 一學年14段，每段有回合預算(budget)，期中考/期末考是budget=1的里程碑段，觸發時算考試成績
const SEMESTER_PHASES = [
  { key:"開學初", budget:3, isExam:false },

  { key:"期末考", budget:1, isExam:true, examType:"期末考" },

const YEAR_SEGMENTS = [
  ...SEMESTER_PHASES.map(p=>({ ...p, half:"上學期" })),

]; // 14段：上學期7段+下學期7段（假期段落分別代表寒假/暑假），一學期預算上限27回合、一學年54回合
// 一、1.2.9.1（2026-09-23修正,發現monthsCrossed校準bug）：學生時期每回合的monthsCrossed原本寫死1.5，
// 54回合(一整年)累加起來等於81個月(6.75年)，跟「54回合＝年齡+1歲」的既有結構(見advanceStageYear)完全對不上——
// 已用Node vm模擬驗證：55回合(含開場段落)跑滿一整年，累加monthsCrossed=81，不是預期的12。

// 改用同一種算法：12個月平均分攤到一整年的54回合，讓總量正確等於12，不分段落類型(exam/prep/假期等份量差異留待之後細分，見1.2.9.1備註)
// 【2026-09-24取代】STUDENT_MONTHS_PER_ROUND已移除，改由下方行事曆依每回合實際推進天數換算月數(1.2.9.11.5)，一整年加總仍是12個月
// ===== 一、1.2.9.11（2026-09-24新增）遊戲內行事曆：日期由程式掌管，AI不自行決定時間 =====
// 絕對日(absDay)：0＝高一開學前一天8/29(開場段落)，之後每天+1，不分年份(遊戲沒有西元年，只用月/日)。
// 學生時期每個段落對應固定的月/日區間(1.2.9.11.1.1，對照台灣高中大致時程，測試參數)，回合在段落內平均分配天數；
// 出社會後每回合天數＝365÷該年齡帶每年回合預算。每回合的「本回合範圍」＝[起始日,結束日]，起始日至少是上一回合場景的隔天。
const CAL_DAYS_IN_MONTH = [31,28,31,30,31,30,31,31,30,31,30,31];
function calMdToDoy(m,d){ let n=0; for(let i=0;i<m-1;i++) n+=CAL_DAYS_IN_MONTH[i]; return n+d-1; }
function calDoyToMd(doy){
  let m=0; doy=((doy%365)+365)%365;
  while(doy>=CAL_DAYS_IN_MONTH[m]){ doy-=CAL_DAYS_IN_MONTH[m]; m++; }
  return { m:m+1, d:doy+1 };
}
const CAL_EPOCH_DOY = calMdToDoy(8,29); // absDay 0 = 8/29
function calAbsToMd(abs){ return calDoyToMd(CAL_EPOCH_DOY+abs); }
function calFormat(abs){ const {m,d}=calAbsToMd(abs); return `${m}/${d}`; }
// 各段落起始月/日，順序對應YEAR_SEGMENTS(上學期7段＋下學期7段)，一學年從8/30開學起算、合計365天
const SCHOOL_SEGMENT_START_MD = [
  [8,30],[9,20],[10,14],[10,17],[10,31],[1,13],[1,16], // 上學期：開學初/期中準備期/期中考/期中後放鬆/期末準備期/期末考/寒假
  [2,11],[3,4],[4,7],[4,10],[4,24],[6,24],[6,27]      // 下學期：開學初/期中準備期/期中考/期中後放鬆/期末準備期/期末考/暑假
];
const SCHOOL_YEAR_START_DOY = calMdToDoy(8,30);
const SCHOOL_SEGMENT_OFFSET = SCHOOL_SEGMENT_START_MD.map(([m,d])=>(calMdToDoy(m,d)-SCHOOL_YEAR_START_DOY+365)%365);
const SCHOOL_SEGMENT_LENGTH = SCHOOL_SEGMENT_OFFSET.map((off,i)=>(i+1<SCHOOL_SEGMENT_OFFSET.length ? SCHOOL_SEGMENT_OFFSET[i+1] : 365)-off);
const LEAVE_OF_ABSENCE_DAYS = 182; // 休學一學期＝半年，平均分攤到LEAVE_OF_ABSENCE_TURNS回合
const DAYS_PER_MONTH = 365/12;
// 固定事件(1.2.9.11.2第5項)：國曆節日照實際日期；農曆節日遊戲沒有年份，用固定近似日期並標approx(prompt註明「約在這段時間前後」)
const CAL_FIXED_HOLIDAYS = [
  { m:1, d:1, name:"元旦" }, { m:2, d:1, name:"春節", approx:true }, { m:2, d:28, name:"和平紀念日" },
  { m:4, d:4, name:"兒童節／清明節" }, { m:6, d:15, name:"端午節", approx:true }, { m:8, d:8, name:"父親節" },
  { m:9, d:25, name:"中秋節", approx:true }, { m:9, d:28, name:"教師節" }, { m:10, d:10, name:"國慶日" },
  { m:12, d:25, name:"聖誕節" }, { m:12, d:31, name:"跨年夜" }
];
function rollBirthday(){ const doy = rnd(0,364); return calDoyToMd(doy); }
function isStudentCalendarMode(s){ const m=s.timeState.stageMode; return m==="highschool"||m==="college"; }
// 學生時期：第idx段第t回合的起始絕對日
function schoolAnchor(cal, idx, t){
  const seg = YEAR_SEGMENTS[idx];
  return cal.yearBase + SCHOOL_SEGMENT_OFFSET[idx] + Math.floor(t*SCHOOL_SEGMENT_LENGTH[idx]/seg.budget);
}
function careerAnchor(cal, t, budget){ return cal.careerYearBase + Math.floor(t*365/budget); }
// 舊存檔/新人生第一次用到行事曆時補上cal欄位(timeState.cal，跟著timeState進反悔快照，反悔時日期一併還原)
function ensureCalendar(s){
  if(!s.birthday) s.birthday = rollBirthday();
  const ts = s.timeState;
  if(ts.cal) return ts.cal;
  const cal = { yearBase:1, careerYearBase:null, leaveBase:null, leaveRound:0, lastSceneDay:0, lastRoundEnd:0, lastSceneSummary:null };
  ts.cal = cal;
  if(ts.prologue) return cal;
  // 舊存檔(2026-09-24以前)：沒有日期紀錄，依目前所在的段落/年度進度推一個對應的日期，之後照常推進
  if(isStudentCalendarMode(s)){
    cal.yearBase = 1 + 365*10;
    const start = schoolAnchor(cal, ts.segmentIndex % YEAR_SEGMENTS.length, ts.turnsInSegment||0);
    if(s.leaveStatus==="onLeave"){ cal.leaveBase = start; cal.leaveRound = Math.max(0, LEAVE_OF_ABSENCE_TURNS-(s.leaveResumeCountdown||LEAVE_OF_ABSENCE_TURNS)); }
    cal.lastRoundEnd = cal.lastSceneDay = start-1;
  } else {
    const budget = roundsPerYearForAge(s.age);
    cal.careerYearBase = 365*20;
    cal.lastRoundEnd = cal.lastSceneDay = careerAnchor(cal, ts.adultTurnsInYear||0, budget)-1;
  }
  return cal;
}
// 給定錨點區間[anchorStart,anchorEnd]，算出本回合範圍：起始日至少是上一回合場景的隔天(1.2.9.11.1第2項)，跨度至少一天
function buildRoundWindow(cal, anchorStart, anchorEnd){
  const start = Math.max(anchorStart, cal.lastSceneDay+1);
  const end = Math.max(start, anchorEnd);
  const daysAdvanced = Math.max(0, end - cal.lastRoundEnd);
  cal.lastRoundEnd = end;
  return { start, end, daysAdvanced };
}
function calSpanText(days){
  if(days<=1) return "一天";
  if(days<=4) return `約${days}天`;
  if(days<=10) return "約一週";
  if(days<=17) return "約兩週";
  if(days<=24) return "約三週";
  if(days<=45) return "約一個月";
  return `約${Math.round(days/DAYS_PER_MONTH)}個月`;
}
// 本回合範圍內的固定事件：開學日/段考/寒暑假開始(學生時期)、節日、玩家生日
function collectFixedEvents(s, win){
  const events = [];
  const student = isStudentCalendarMode(s) && s.leaveStatus!=="onLeave";
  const cal = s.timeState.cal;
  const maxDays = Math.min(win.end-win.start, 400);
  for(let abs=win.start; abs<=win.start+maxDays; abs++){
    const {m,d} = calAbsToMd(abs);
    const date = `${m}/${d}`;
    if(student){
      const off = ((abs - cal.yearBase)%365+365)%365;
      const idx = SCHOOL_SEGMENT_OFFSET.indexOf(off);
      if(idx>=0){
        const seg = YEAR_SEGMENTS[idx];
        if(seg.key==="開學初") events.push({ date, name: seg.half+"開學日" });
        else if(seg.isExam) events.push({ date, name: seg.half+seg.examType+"開始" });
        else if(seg.key==="假期") events.push({ date, name: segmentLabel(seg, idx<SEMESTER_PHASES.length, s.halfYearCarry)+"開始" });
      }
    }
    CAL_FIXED_HOLIDAYS.forEach(h=>{ if(h.m===m && h.d===d) events.push({ date, name:h.name, approx: !!h.approx }); });
    if(s.birthday && s.birthday.m===m && s.birthday.d===d) events.push({ date, name:"你的生日" });
  }
  return events;
}
// AI回傳的新場景日期檢查(1.2.9.11.4)：scene_day_offset是相對本回合起始日的天數，須落在本回合範圍內
function validateSceneDate(r, win){
  if(!win) return { ok:true };
  const off = r && r.scene_day_offset;
  const maxOff = win.end - win.start;
  if(typeof off!=="number" || !Number.isInteger(off)) return { ok:false, reason:`scene_day_offset沒有回傳整數（收到${JSON.stringify(off)}）` };
  if(off<0) return { ok:false, reason:`新場景日期早於本回合起始日（offset=${off}），等於停在上一回合的時間點` };
  if(off>maxOff) return { ok:false, reason:`新場景日期超出本回合範圍（offset=${off}，上限${maxOff}）` };
  return { ok:true };
}

// 二、2.5（9/16新增，9/16-v2.1下修數字+年齡帶改左閉右開）：22歲以後加速曲線，取代原本「30歲以後交給AI自行判斷age_advance」的舊架構
// 邊界採10年一段、左閉右開（以生日為界，22-29歲＝22歲起滿30歲生日前），取代v2.1之前22-30/31-40等不對稱分段
const LIFE_STAGE_ROUND_BUDGET = [
  { minAge:22, maxAge:29, roundsPerYear:32 }, // 找方向期
  { minAge:30, maxAge:39, roundsPerYear:28 },
  { minAge:40, maxAge:49, roundsPerYear:15 },
  { minAge:50, maxAge:59, roundsPerYear:12 },

  { minAge:70, maxAge:79, roundsPerYear:7 },

];
function roundsPerYearForAge(age){
  const bucket = LIFE_STAGE_ROUND_BUDGET.find(b=>age>=b.minAge && age<=b.maxAge);
  return bucket ? bucket.roundsPerYear : 10;
}
// 九、9.4（9/16新增）：修業年限改為依角色查表，取代原本寫死的「大學4年」

const COLLEGE_DELAY_CAP = 2; // 【定案,9.4】延畢封頂兩年

// 雙主修相關代碼(renderDualMajorOfferModal()等)完成後同樣不會呼叫任何地方去增加collegeDelayYearsUsed
const COLLEGE_GRAD_AGE_CAP = { 4:24, 5:25 }; // 【定案,9.4】其餘科系最晚24歲、醫牙獸最晚25歲畢業
// 9.4「轉系最後可行年齡」：轉系當下年齡+目標科系修業年限+目前已用延畢年數，不得超過目標科系的畢業年齡上限
// （已用延畢年數要算進去，因為它代表「已消耗掉多少延畢緩衝額度」，轉系不會重置這個額度，見9.4【待驗證】備註）
function isTransferFeasible(currentAge, targetYearsRequired, delayYearsUsed){
  const cap = COLLEGE_GRAD_AGE_CAP[targetYearsRequired] || COLLEGE_GRAD_AGE_CAP[4];
  const usedDelay = clamp(delayYearsUsed||0, 0, COLLEGE_DELAY_CAP);

// 九、9.8.1（2026-09-22修正）：延畢的時間延長改由「該學期重跑」自然產生，yearInStage正常情況下不會超過base，
// 不再用「延畢第N年」這種獨立序數，改為在年級後面附註已延畢年數（若有）
function collegeYearLabel(s){
  const base = s.collegeYearsRequired || 4;

  const yearInStage = clamp(s.timeState.yearInStage, 1, base);
  const label = ordinals[clamp(yearInStage,1,ordinals.length)-1];

// 起始年齡已提高的情境）

// 延畢額度與畢業年齡上限還夠時(isAnotherLeaveFeasible)，考完直接回到這學期開頭重跑(那個假期沒得放)；時間照休學復學的做法記半年
const DELAY_INTEREST_COUNT_TRIGGER = 3;
function checkNonLeaveGraduationDelay(s, examCheck, interestCount){
  if(examCheck.passed || s.timeState.stageMode!=="college" || s.studentStatus!=="enrolled") return false;
  const byInterest = (interestCount||0) >= DELAY_INTEREST_COUNT_TRIGGER;
  const byFinance = (s.lowCashStreak||0) >= WITHDRAWAL_STREAK_TRIGGER;
  if(!byInterest && !byFinance) return false;
  if(!isAnotherLeaveFeasible(s)) return false;
  const cal = s.timeState.cal;
  const halfStart = (s.timeState.segmentIndex % YEAR_SEGMENTS.length) < SEMESTER_PHASES.length ? 0 : SEMESTER_PHASES.length;
  s.timeState.segmentIndex = halfStart;
  s.timeState.turnsInSegment = 0;

  if(cal && cal.lastRoundEnd!=null) cal.yearBase = (cal.lastRoundEnd + 1) - SCHOOL_SEGMENT_OFFSET[halfStart];
  s.collegeDelayYearsUsed = clamp((s.collegeDelayYearsUsed||0)+0.5, 0, COLLEGE_DELAY_CAP);
  s.halfYearCarry = (s.halfYearCarry||0) + 1;
  if(s.halfYearCarry>=2){ s.halfYearCarry = 0; s.age += 1; ageChildren(s, 1); }

  const usedDelay = clamp(s.collegeDelayYearsUsed||0, 0, COLLEGE_DELAY_CAP);

  const cap = COLLEGE_GRAD_AGE_CAP[base] || COLLEGE_GRAD_AGE_CAP[4];
  const projectedGradAge = computeExpectedGraduationAge(s) + 0.5;
  return projectedGradAge <= cap;
}

function foreshadowTriggerProbability(majorGroup, line){
  const weight = (MAJOR_FORESHADOW_WEIGHT_TABLE[majorGroup]||{})[line] || "低";

// 9.8 學生主狀態欄位規格：判斷是否已出社會一律用studentStatus，不是單純看年齡（9.8【定案】）
function assignStudentMajor(s, majorKey, isFiveYear){
  const cat = findMajorCategory(majorKey);
  if(!cat) return;
  s.studentMajorGroup = majorKey;
  s.studentIsFiveYearTrack = !!(cat.isFiveYearEligible && isFiveYear);
  s.collegeYearsRequired = s.studentIsFiveYearTrack ? 5 : 4;

// 九、9.8.1（2026-09-22修正）：改用基礎修業年限(不含delay)＋尚未實現的halfYearCarry半年——
// 已實現的延畢（每滿兩次休學復學）已經直接反映在s.age本身，若再加整個collegeDelayYearsUsed會把同一段延畢重複計算兩次
function computeExpectedGraduationAge(s){
  const base = s.collegeYearsRequired || 4;
  const remainingYears = base - (s.timeState?.yearInStage||1) + 1;
  return s.age + Math.max(0, remainingYears) + (s.halfYearCarry||0)*0.5;
}
// 9.5.1 轉系候選觸發：連續兩次段考成績低於預期區間【測試參數，9.7測試項目2待校準】
// 「預期區間」用跟2.4考試成績算法同精神、但採client端可重算的proxy（知識值+讀書次數×3），
// 不依賴AI自由回報的敘事分數，確保這條線完全不受AI輸出內容影響（9.9 AI/程式責任邊界的要求）
const TRANSFER_EXAM_EXPECTATION_THRESHOLD = 55; // 【測試參數】低於此proxy分數視為「低於預期」
const TRANSFER_EXAM_STREAK_TRIGGER = 2; // 【定案】連續兩次
const TRANSFER_COOLDOWN_TURNS = 8; // 【測試參數,9.5.1新增待補】轉系候選冷卻回合數
function updateTransferCandidateOnExam(s, studyCountAtExam){
  const proxy = clamp(Math.round(s.stats.knowledge + (studyCountAtExam||0)*3), 0, 100);
  const belowExpectation = proxy < TRANSFER_EXAM_EXPECTATION_THRESHOLD;
  s.examBelowExpectationStreak = belowExpectation ? (s.examBelowExpectationStreak||0)+1 : 0;
  // 9.5.1【定案】轉系須先通過9.4「轉系最後可行年齡」才成立候選（2026-09-27修正：原本不檢查，超過20歲仍跳出全部反灰的彈窗）。
  // 4年制是所有目標裡門檻最寬的，連4年制都不可行就沒有任何可轉的科系
  const anyTargetFeasible = isTransferFeasible(s.age, 4, s.collegeDelayYearsUsed);
  const signal = s.studentStatus==="enrolled" && !s.transferCooldown && s.examBelowExpectationStreak>=TRANSFER_EXAM_STREAK_TRIGGER && anyTargetFeasible;
  // 9.5.1【定案】候選成立機率由才識與自律決定（2026-09-27使用者同意Claude建議，【測試參數】）：
  // 50%＋(才識−50)×0.5＋(自律−50)×0.3，夾在5%～95%；沒成立時streak保留，下一次仍低於預期會再判定一次
  const candidateProbPct = clamp(50 + (s.stats.knowledge-50)*0.5 + (s.conscientiousness.selfDiscipline-50)*0.3, 5, 95);
  const candidate = signal && rnd(1,100) <= candidateProbPct;
  // 9.5.1：log須同時輸出預期區間、實際成績、連續計數、候選判定結果
  s.lastExamPerformanceLog = { expected: TRANSFER_EXAM_EXPECTATION_THRESHOLD, actual: proxy, streak: s.examBelowExpectationStreak, candidate, ageFeasible: anyTargetFeasible, candidateProbPct: signal ? Math.round(candidateProbPct) : null };
  if(candidate){
    s.pendingTransferOffer = true;
  }
}

// 十一、11.4明牌檢定機制（9/19新增，首版白名單僅「期末考成績公布」一項）：
// 定案文字只規定呈現格式要有「骰值＋屬性加成換算依據＋門檻對比＋成敗結果」，沒有給具體骰值範圍/及格門檻數字，
// 以下數字皆為實作階段選定的【測試參數，待驗證】——60分及格門檻沿用台灣常見及格線慣例、骰值範圍呼應
// system prompt既有「hint±10分左右合理，保留少量機率更意外」的敘事指示，改寫成client端可明牌呈現的擲骰版本
const EXAM_CHECK_PASS_THRESHOLD = 60; // 【測試參數，待驗證】
function rollFinalExamCheck(wisdom, studyCount, interestCount){
  // 三、3.2.4（2026-09-27補上）：期末考明牌檢定的基準分原本沒有扣興趣路徑拖累，跟期中考exam_score_hint不一致；
  // 改成同一條公式（才識＋讀書×3−興趣×2×拖累倍率）。轉系(9.5.1)呼叫時不傳interestCount，維持原本算法
  const drag = (interestCount||0) * EXAM_INTEREST_DRAG_PER_CHOICE * computeExamInterestDragMultiplier(wisdom);
  const base = clamp(Math.round(wisdom + (studyCount||0)*3 - drag), 0, 100); // 沿用既有2.4.1大方向層公式
  const roll = rnd(1,100); // 骰值，明牌呈現給玩家
  let swing;
  if(roll<=90){
    swing = rnd(-10,10); // 一般範圍
  } else {
    // 保留少量意外機率，正負對半，不偏向負面（呼應六、6.1正向配額精神）
    swing = (roll%2===0) ? rnd(11,25) : rnd(-25,-11);
  }
  const finalScore = clamp(base+swing, 0, 100);
  return { wisdom:Math.round(wisdom), studyCount:(studyCount||0), interestCount:(interestCount||0), drag:Math.round(drag*10)/10, base, roll, swing, finalScore, passThreshold: EXAM_CHECK_PASS_THRESHOLD, passed: finalScore>=EXAM_CHECK_PASS_THRESHOLD };
}
// 9.5.2 雙主修候選觸發：才識數值達門檻【測試參數，9.7測試項目3待校準】，或特定科系伏筆權重被觸發
const DUAL_MAJOR_KNOWLEDGE_THRESHOLD = 70; // 【測試參數】
function checkDualMajorCandidate(s){
  if(s.studentStatus!=="enrolled" || s.dualMajorStatus) return; // 已經是candidate/active/abandoned/completed就不重複判定
  if(s.dualMajorOfferDeclined) return; // 9.8「狀態一次轉換，不重複觸發」（2026-09-27修正）：拒絕過一次就不再提
  if(s.stats.knowledge>=DUAL_MAJOR_KNOWLEDGE_THRESHOLD){
    s.dualMajorStatus = "candidate"; s.pendingDualMajorOffer = true; return;

  // 「特定科系伏筆權重被觸發」：用商管財經線的創業權重當作雙主修傾向的簡化代表（實作階段自訂映射，非文件明文規定）
  if(s.studentMajorGroup && Math.random() < foreshadowTriggerProbability(s.studentMajorGroup, "創業線")){
    s.dualMajorStatus = "candidate"; s.pendingDualMajorOffer = true;
  }
}

const DUAL_MAJOR_ABANDON_STRESS_THRESHOLD = 40; // 【定案,9/16補充】自律或財務健康度低於此分視為壓力訊號（呼應3.7.3的50分中性基準，取中性偏下）
const DUAL_MAJOR_ABANDON_STREAK_TRIGGER = 3; // 【定案,9/16補充】連續3回合
const DUAL_MAJOR_ABANDON_COOLDOWN_TURNS = 4; // 【定案,9/16補充】冷卻4回合，避免連續跳出同一提案
function checkDualMajorAbandonCandidate(s){
  if(s.dualMajorStatus!=="active" || s.pendingDualMajorAbandonOffer) return;
  if((s.dualMajorAbandonCooldown||0)>0) return;

  const underStress = s.conscientiousness.selfDiscipline<DUAL_MAJOR_ABANDON_STRESS_THRESHOLD || financialHealth<DUAL_MAJOR_ABANDON_STRESS_THRESHOLD;

// 9.5.3 休學/肄業候選觸發：持續低值（連續N回合），不是單次瞬間跌破（9/16 ChatGPT開發審閱補強）
// 健康面沿用既有s.lowHealthStreak（health<30才累加，早於本次開發就存在），財務面新增s.lowCashStreak（呼應3.4.10學生現金floor在0的既有保護機制）
const WITHDRAWAL_STREAK_TRIGGER = 4; // 【測試參數，9.7測試項目4待校準】
const WITHDRAWAL_FINANCIAL_HEALTH_THRESHOLD = 20; // 【測試參數，9.5.3，2026-09-27】
const WITHDRAWAL_CANDIDATE_PROB_PCT = 60; // 【測試參數，9.5.3，2026-09-27】
function checkWithdrawalCandidate(s){
  if(s.studentStatus!=="enrolled" || s.leaveStatus!=="normal" || s.pendingLeaveOffer) return;

// 9.8.1（2026-09-22修正）：halfYearCarry為1時代表行事曆已錯開半年，寒假/暑假標籤對調
function segmentLabel(seg, isFirstHalf, halfYearCarry){

    return isWinter ? "寒假" : "暑假";
  }
  return seg.half+"・"+seg.key;

function computeTimeLabel(s){

  if(mode==="college" && s.leaveStatus==="onLeave"){
    return collegeYearLabel(s)+"・休學中"; // 9.5.3（9/16補充）：學期引擎凍結期間不顯示段落標籤，避免看起來仍在正常推進
  }
  if(mode==="highschool" || mode==="college"){
    const idx = s.timeState.segmentIndex % YEAR_SEGMENTS.length;
    const seg = YEAR_SEGMENTS[idx];
    const yr = mode==="highschool"
      ? ["高一","高二","高三"][clamp(s.timeState.yearInStage,1,3)-1]
      : collegeYearLabel(s);
    let label = yr+"・"+segmentLabel(seg, idx<SEMESTER_PHASES.length, s.halfYearCarry);
    if(mode==="college" && s.timeState.yearInStage>=(s.collegeYearsRequired||4) && idx>=SEMESTER_PHASES.length) label += "（畢業倒數）";

      // 舊存檔沒有careerEntryAge時沿用原本22歲入職的假設
      const entryAge = s.careerEntryAge ?? 22;
      const budget = roundsPerYearForAge(s.age);
      const half = (s.timeState.adultTurnsInYear||0) < budget/2 ? "上半年" : "下半年";
      return `入職第${Math.max(1, s.age-entryAge+1)}年・${half}`;

// 介面：現階段進度指示（9/16新增）——依目前所在模式，回傳「這個小段落」還剩多少回合的進度資訊，供UI畫進度條
// 三種模式各自的「一個段落」定義不同：學生時期是目前學期段落(開學初/準備期/考試/假期等)；休學中是休學倒數；出社會是本年度
function computeStageProgress(s){
  if(s.timeState.prologue) return { label:"開場", current:0, total:1 };
  const mode = s.timeState.stageMode;
  if(mode==="college" && s.leaveStatus==="onLeave"){
    const total = LEAVE_OF_ABSENCE_TURNS;
    const current = clamp(total - (s.leaveResumeCountdown ?? total), 0, total);
    return { label:"休學進度", current, total };
  }
  if(mode==="highschool" || mode==="college"){
    const idx = s.timeState.segmentIndex % YEAR_SEGMENTS.length;
    const seg = YEAR_SEGMENTS[idx];
    return { label:segmentLabel(seg, idx<SEMESTER_PHASES.length, s.halfYearCarry)+"進度", current:Math.min(s.timeState.turnsInSegment||0, seg.budget), total:seg.budget };

// 一般行動描述（例如「放學之後直接去打工」）也會被誤判成跳過，導致隨機跳段可能越過考試；
// 收窄為只有明確跳過指令才算：跳過/快轉/直接跳到/一段時間後，或「跳到」+段落名稱
function detectTimeSkipIntent(actionText){
  const t = actionText||"";
  if(/跳過|快轉|直接跳到|一段時間後/.test(t)) return true;
  return /跳到/.test(t) && /寒假|暑假|下學期|期中|期末/.test(t);

function resolveTimeSkipTarget(actionText){
  const t = actionText||"";
  if(!/跳到/.test(t)) return null;
  if(/下學期/.test(t)) return { key:"開學初", half:"下學期" };
  if(/寒假/.test(t)) return { key:"假期", half:"上學期" };
  if(/暑假/.test(t)) return { key:"假期", half:"下學期" };
  if(/期中/.test(t)) return { key:"期中考", half:null };
  if(/期末/.test(t)) return { key:"期末考", half:null };

// 四、4.1.1（2026-09-22新增）：hintCandidates為選填參數，供同住緩降造成的關係狀態級距改變推入第2層提示候選——

// 四、4.1（9/19補充,修正既有定案未落實問題）：「重要共同記憶」欄位機制性上限2則,FIFO捨棄最舊一則,
// 由程式機械判定不交由AI決定——原本是無上限字串累加,違反4.1「1-2句話等級」的既有定案文字
function appendNpcSharedMemory(c, addition){

function relationshipStatusLabel(c){

function applyRomanceSignal(s, c, signal){
  if(!signal || !c) return;
  c.romanceProgress = c.romanceProgress||0;
  c.romanceStableStreak = c.romanceStableStreak||0;
  c.romanceNegativeStreak = c.romanceNegativeStreak||0;
  const prevStatus = c.romanceStatus||null;
  if(signal==="positive"){
    c.romanceProgress += 1;
    c.romanceNegativeStreak = 0;
    if(!c.romanceStatus && c.romanceProgress>=ROMANCE_AMBIGUOUS_PROGRESS){
      c.romanceStatus = "ambiguous";
    } else if(c.romanceStatus==="ambiguous" && c.romanceProgress>=ROMANCE_DATING_PROGRESS){
      c.romanceStatus = "dating";
    } else if(c.romanceStatus==="dating"){
      c.romanceStableStreak += 1;
      if(c.romanceStableStreak>=ROMANCE_STABLE_STREAK){
        c.romanceStatus = "stable";
        c.stableSinceTurn = s.turnCount; // 七、7.6.1.1（2026-09-22新增）：記錄進入穩定交往的回合數，供同居觸發入口判斷「持續≥8回合」
      }
    }
  } else if(signal==="negative"){
    c.romanceProgress = Math.max(0, c.romanceProgress-1);
    c.romanceStableStreak = 0;
    if(c.romanceStatus==="dating" || c.romanceStatus==="stable"){
      c.romanceNegativeStreak += 1;
      if(c.romanceNegativeStreak>=ROMANCE_BREAKUP_STREAK){
        c.romanceStatus = "breakup";
        releaseCohabiting(c); // 七、7.6.1.1：穩定交往轉分手時解除同住標記
      }
    }
  }
  // 4.4定案：first_romance里程碑改由客戶端在第一次進入「交往中」時自動判定，取代AI自由回報（9/16使用者確認）
  if(prevStatus!=="dating" && c.romanceStatus==="dating" &&
     s.milestones.first_romance!=="completed" && s.milestones.first_romance!=="skipped"){
    s.milestones.first_romance = "completed";
  }
}

  if(s.characters.some(c=>c.romanceStatus==="married")) return; // 已有配偶，不重複觸發

// ========== 七、7.6.1.1 同居觸發入口（2026-09-22新增） ==========
const COHABITATION_STABLE_TURNS = 8; // 【測試參數,待驗證】穩定交往持續回合數門檻
const COHABITATION_OFFER_COOLDOWN_TURNS = 12; // 【測試參數,待驗證】選「先維持各自住」後的冷卻回合數
function detectCohabitationIntent(actionText){
  return /同居|搬去一起住|一起租房|搬過去一起住|住在一起/.test(actionText||"");
}
// 被動觸發條件全部成立：與某NPC穩定交往≥8回合、已搬出原生家庭且住租屋/自有房、沒有配偶、沒有其他同居對象；
// 主動觸發：偵測到同居意圖關鍵字時，條件符合就立即排入彈窗，比照detectJobChangeIntent()既有模式
function checkCohabitationOffer(s, actionText){
  if(s.pendingCohabitationOffer || s.turnCount < (s.cohabitationOfferCooldownUntilTurn||0)) return;
  if(s.characters.some(c=>c.romanceStatus==="married")) return; // 已有配偶
  if(s.characters.some(c=>c.cohabiting && c.romanceStatus==="stable")) return; // 已有其他同居對象
  if(s.milestones.moved_out!=="completed") return; // 還住在原生家庭，不出現這個彈窗
  if(!s.housing || (s.housing.type!=="rent" && s.housing.type!=="own")) return;
  const partner = s.characters.find(c=>c.romanceStatus==="stable" && !c.cohabiting);
  if(!partner) return;
  const durationOk = (s.turnCount - (partner.stableSinceTurn ?? s.turnCount)) >= COHABITATION_STABLE_TURNS;
  if(detectCohabitationIntent(actionText) || durationOk){
    s.pendingCohabitationOffer = { partnerName: partner.name };
  }
}
// choice: "move_in"/"stay_separate"；此彈窗是玩家選擇，不涉及機率判定，不列入十一、11.4明牌檢定白名單
function resolveCohabitationOffer(s, partnerName, choice){
  if(choice==="move_in"){
    const partner = s.characters.find(c=>c.name===partnerName);
    if(partner) partner.cohabiting = true;
  } else {
    s.cohabitationOfferCooldownUntilTurn = s.turnCount + COHABITATION_OFFER_COOLDOWN_TURNS;
  }
  s.cohabitationEventLog = { choice, partnerName }; // 供下一回合payload的cohabitation_event_now告訴AI剛發生了什麼
}

const HEALTH_CAP_TABLE = [
  { maxAge:49, cap:100 }, { maxAge:59, cap:95 }, { maxAge:69, cap:88 },

function baseHealthCapForAge(age){

// 13.5.1【定案,測試參數】父母年齡骰定為玩家出生時25到35歲；健康採四階段狀態機：1健康自理/2需要協助/3失能長照/4過世(見13.6)
// 2026-09-22修正（bug回報：父母年齡沒有上限，20萬次模擬80歲時仍有約20%父母在世且常超過110歲）：
//   - 父母初始年齡改用PARENT_CHILD_AGE_GAP_MIN/MAX（主角年齡＋22~38歲），取代newRoll()原本rnd(25,35)+15（換算落差只有25-35歲，比要求的22-38歲窄）
//   - 健康階段推進機率改依父母年齡分級，取代原本不分年齡的單一5%
//   - 最後一個「在世」階段(失能長照)另加每年獨立死亡機率，避免長期卡在同一階段不動
//   - 新增105歲硬上限，到齡強制進入過世流程
// 2026-09-22二次修正：使用者回報的原始分級表(60-69:5%/70-79:10%/80-89:18%/90-99:30%/100+:50%+最後階段30%)
// 20萬次模擬顯示60歲時父母在世比例只有約18%，遠低於「25%~40%」的目標——70-79與80-89兩檔、以及最後階段死亡機率調降，
// 60-69歲維持原本5%不變；調整後20萬次模擬：40歲86.65%(目標80-90)／60歲35.75%(目標25-40)／80歲0.20%(目標<2)，皆落在目標範圍內
const PARENT_CHILD_AGE_GAP_MIN = 22; // newRoll()開局骰父母年齡用
const PARENT_CHILD_AGE_GAP_MAX = 38;
const PARENT_HEALTH_STAGE_ADVANCE_PROBABILITY_BY_AGE = [
  { maxAge:59, probability:0.02 },
  { maxAge:69, probability:0.05 },
  { maxAge:79, probability:0.06 }, // 2026-09-22二次修正：原10%，20萬次模擬顯示會讓60歲在世比例過低
  { maxAge:89, probability:0.09 }, // 2026-09-22二次修正：原18%，同上
  { maxAge:99, probability:0.30 },
  { maxAge:Infinity, probability:0.50 }
];
function parentHealthStageAdvanceProbability(age){
  const tier = PARENT_HEALTH_STAGE_ADVANCE_PROBABILITY_BY_AGE.find(t=>(age||0)<=t.maxAge);
  return tier ? tier.probability : 0.50;
}
const PARENT_HEALTH_LAST_LIVING_STAGE = 3; // 失能長照：過世(4)前最後一個在世階段
const SIBLING_ESTATE_NEGOTIATION_AFFINITY = 50; // 【測試參數,13.6，2026-09-27】手足關係值≥此值走協商，否則衝突
const PARENT_HEALTH_LAST_STAGE_DEATH_PROBABILITY = 0.22; // 2026-09-22二次修正：原30%，理由同上
const PARENT_HEALTH_HARD_CAP_AGE = 105;
function rollParentHealthStageAdvance(s){
  const events = [];
  // 13.6【定案】過世的父母(deceased===true，含世代傳承後標記為過世的上一代主角)不再進入這個狀態機，避免被判定「再過世一次」
  // 十三、13.5.1（2026-09-23新增）：隔代教養的祖父母卡納入同一套狀態機，長照決策/過世/遺產一律沿用13.5、13.6既有流程
  // 2026-09-27修正（既有bug）：原本也排除active===false，但父母搬離/不同住後12回合沒互動就會被降為背景角色(active=false)，
  // 從此不再老化、不會需要照顧或過世（服刑家長從第13回合起就是如此）。降級只代表近期沒出場，不代表不在世；
  // 已過世一律有deceased標記（含傳承時的上一代主角），所以只看deceased即可
  s.characters.filter(c=>(c.origin==="父母，從出生起" || c.origin==="隔代教養，從出生起") && (c.healthStage||1)<4 && !c.deceased).forEach(c=>{
    if(s.idleMode && ((c.age||0) >= PARENT_HEALTH_HARD_CAP_AGE || (c.healthStage||1)>=PARENT_HEALTH_LAST_LIVING_STAGE)) return; // 10.6.7：放置期間家人過世比照死亡排除，最後一個在世階段也不往下推
    if((c.age||0) >= PARENT_HEALTH_HARD_CAP_AGE){
      finalizeParentDeath(s, c.name);
      events.push({ parentName:c.name, newStage:4 });
      return;
    }
    if(c.bereavementBumpAge===s.age) return; // 13.6：今年已因另一位家長過世提前一階
    const stage = c.healthStage||1;
    if(stage===PARENT_HEALTH_LAST_LIVING_STAGE && Math.random() < PARENT_HEALTH_LAST_STAGE_DEATH_PROBABILITY){
      finalizeParentDeath(s, c.name);
      events.push({ parentName:c.name, newStage:4 });
      return;
    }
    if(Math.random() < parentHealthStageAdvanceProbability(c.age||0)){
      c.healthStage = stage+1;
      events.push({ parentName:c.name, newStage:c.healthStage });
      if(c.healthStage===2 || c.healthStage===3){
        // 13.5.2（2026-09-27修正）：原本已有待決定的照顧彈窗時，另一位父母的決策會被直接略過；改為排隊，前一個決定完再跳
        queueEldercareDecision(s, c);
      } else if(c.healthStage===4){
        // 13.6：過世沒有列出玩家可選選項(只有敘事處理+遺產計算)，不需要彈窗，直接結算
        finalizeParentDeath(s, c.name);
      }
    }
  });
  return events;
}
// 13.5.2【定案】選項：自己擔任主要照顧者/與手足分工/聘僱居家照服員或機構(中費用等級)/由手足承擔自己有限度參與/自訂輸入
const ELDERCARE_HIRE_MONTHLY_COST = 5; // 【測試參數,待驗證,13.5.2】中費用等級
// 13.5.2（2026-09-27補完，使用者授權Claude全權判斷，【測試參數】）：
//  ①第5個選項「自訂輸入」：不做數值變動，玩家寫的安排交給AI；②跟手足分工：手足關係值≥50是支援(+1~4)，否則是衝突(−2~4)，並告訴AI；
//  ③自己擔任主要照顧者：在職者減少工時(月收入×CAREGIVER_INCOME_FACTOR，照顧結束時恢復)，照顧期間每回合健康−CAREGIVER_HEALTH_COST_PER_TURN，
//    這些回合AI會收到caregiving_now，敘事要寫出照顧佔掉的時間
const CAREGIVER_INCOME_FACTOR = 0.8;
const CAREGIVER_HEALTH_COST_PER_TURN = 0.5;
function startCaregiving(s, parentName){
  s.caringForParentName = parentName;
  if(s.careerStatus===CAREER_STATUS.EMPLOYED && !s.caregiverIncomeCut){
    s.caregiverIncomeCut = { original: s.monthlyIncome };
    s.monthlyIncome = Math.round(s.monthlyIncome * CAREGIVER_INCOME_FACTOR);
  }
}
function endCaregivingIfDone(s){
  if(!s.caringForParentName) return;
  const p = s.characters.find(c=>c.name===s.caringForParentName);
  if(p && !p.deceased) return;
  s.caringForParentName = null;
  if(s.caregiverIncomeCut){
    if(s.careerStatus===CAREER_STATUS.EMPLOYED) s.monthlyIncome = Math.max(s.monthlyIncome, s.caregiverIncomeCut.original);
    s.caregiverIncomeCut = null;
  }
}
function applyCaregivingTurn(s){
  endCaregivingIfDone(s);
  if(!s.caringForParentName) return false;
  s.stats.health = clamp(s.stats.health - CAREGIVER_HEALTH_COST_PER_TURN, 0, 100);
  return true;
}
function resolveEldercareDecision(s, parentName, choice, customText){
  const parent = s.characters.find(c=>c.name===parentName);
  let siblingTone = null;
  if(parent){
    if(choice==="hire"){
      s.monthlyExpenses.push({ label:"長照看護費", amount:ELDERCARE_HIRE_MONTHLY_COST });
    } else if(choice==="self"){
      // 13.5.2【定案】代價與回饋：照顧行為佔用回合、健康扣分(比照3.5.1既有家庭壓力累積)，父母關係值上升
      parent.affinity = clamp(parent.affinity + rnd(3,6), 0, 100);
      s.stats.health = clamp(s.stats.health - rnd(3,6), 0, 100);
      completeMilestone(s, "became_caregiver"); // 4.3.1（2026-09-27）
      startCaregiving(s, parentName); // 13.5.2（2026-09-27）：工時與照顧負荷連動；10.6.9放置時「顧家」也讀這個狀態
    } else if(choice==="split"){
      // 13.5.2【定案】連動五、5.2家庭結構的手足角色卡，手足互動是支援或衝突取決於既有關係值，這裡採支援方向的預設效果
      const sibling = s.characters.find(c=>c.origin==="手足，從出生起" && !c.deceased) || s.characters.find(c=>/^哥哥$|^弟弟$|^姊姊$|^妹妹$/.test(c.relation||""));
      if(sibling){
        siblingTone = (sibling.affinity||0)>=50 ? "support" : "conflict";
        sibling.affinity = clamp(sibling.affinity + (siblingTone==="support" ? rnd(1,4) : -rnd(2,4)), 0, 100);
      }
    }
    // limited：由手足承擔，自己有限度參與——不做額外數值變動，代價由「沒有主動投入」自然反映
  }
  s.pendingEldercareDecision = null;
  // 排隊中的下一位（仍在世、仍在需要照顧的階段才問）
  while(s.eldercareQueue && s.eldercareQueue.length && !s.pendingEldercareDecision){
    const next = s.eldercareQueue.shift();
    const np = s.characters.find(c=>c.name===next.parentName);
    if(np && !np.deceased && (np.healthStage||1)<4) s.pendingEldercareDecision = { parentName:np.name, stage:np.healthStage };
  }
  s.eldercareEventLog = { parentName, choice, stage: parent ? parent.healthStage : null, sibling_tone: siblingTone,
    custom_text: choice==="custom" ? String(customText||"").slice(0, CUSTOM_INPUT_MAX_CHARS) : undefined };
}

function queueEldercareDecision(s, c){
  const ecReq = { parentName:c.name, stage:c.healthStage };
  if(!s.pendingEldercareDecision) s.pendingEldercareDecision = ecReq;
  else (s.eldercareQueue = s.eldercareQueue||[]).push(ecReq);
}
// 13.6 父母過世
// 十三、13.6（2026-09-27使用者同意Claude建議，【測試參數】）：原生家庭的房子。開局依家境決定有沒有(清寒20%／小康60%／富裕95%)，
// 價值＝家庭月收入×120。父母兩人(含隔代教養的祖父母)都過世時才繼承，有在世手足時平分；繼承的是沒有房貸的房產淨值(掛3.4.9)
const FAMILY_HOME_OWN_PROB = { 清寒:0.2, 小康:0.6, 富裕:0.95 };
const FAMILY_HOME_VALUE_MONTHS = 120;
function ensureFamilyHome(s){
  if(s.familyHomeValue!==undefined) return;
  const owns = Math.random() < (FAMILY_HOME_OWN_PROB[s.family] ?? 0.6);
  s.familyHomeValue = owns ? Math.round((s.familyMonthlyIncome||60) * FAMILY_HOME_VALUE_MONTHS) : 0;
}
function settleFamilyHomeInheritance(s){
  ensureFamilyHome(s);
  if(!s.familyHomeValue || s.familyHomeInherited) return 0;
  const livingParents = (s.characters||[]).filter(c=>(c.origin==="父母，從出生起" || c.origin==="隔代教養，從出生起") && !c.deceased && !/不同住/.test(c.relation||""));
  if(livingParents.length) return 0;
  const siblings = (s.characters||[]).filter(c=>c.origin==="手足，從出生起" && !c.deceased).length;
  const share = Math.round(s.familyHomeValue / (1+siblings));
  s.propertyValue = (s.propertyValue||0) + share;
  s.familyHomeInherited = true;
  return share;
}
function finalizeParentDeath(s, parentName){
  const parent = s.characters.find(c=>c.name===parentName);
  if(!parent) return;
  if(parent.estateSettled) return; // 2026-09-22修正：遺產/過世結算只能觸發一次，防止同一位角色被重複判定過世、重複發遺產
  parent.active = false;
  parent.deceased = true;
  parent.estateSettled = true;
  // 13.6【定案,測試參數】遺產依家境與是否有房產，一次性變動現金；簡化估算，非精算遺產稅/繼承法規則
  const inheritance = s.familySavings ? Math.round(s.familySavings*0.1) : rnd(5,20);
  s.cash += inheritance;
  // 13.6【定案】喪禮回合採強制過渡回合的敘事處理已交由system prompt guidance；結構化紀錄部分：直接寫入L3人生履歷
  s.chronicle.push(`（${s.age}歲）${parent.relation}過世了`);
  completeMilestone(s, "parent_death"); // 4.3.1（2026-09-27）
  s.pendingParentDeath = null;
  // 13.6【定案】有手足時依關係值觸發遺產分配的協商或衝突（2026-09-27使用者同意Claude建議）：關係值≥50走協商、否則衝突，
  // 由AI寫成敘事，不另外改數值
  const siblings = s.characters.filter(c=>c.origin==="手足，從出生起" && !c.deceased)
    .map(c=>({ name:c.name, tone: (c.affinity||0)>=SIBLING_ESTATE_NEGOTIATION_AFFINITY ? "negotiation" : "conflict" }));
  // 13.6【定案】另一位家長進入單親狀態、照顧負荷提升（2026-09-27使用者同意Claude建議）：在世的另一位家長健康階段提前一階
  // （不超過失能長照），進入需要協助/失能時照常跳照顧決策彈窗
  // 離異不同住的另一方不是「單親狀態下的另一位家長」（兩人早已分開），不套用照顧負荷提前
  const otherParent = s.characters.find(c=>c.name!==parentName && (c.origin==="父母，從出生起" || c.origin==="隔代教養，從出生起") && !c.deceased && !/不同住/.test(c.relation||""));
  let otherParentStage = null;
  if(otherParent && (otherParent.healthStage||1) < PARENT_HEALTH_LAST_LIVING_STAGE){
    otherParent.healthStage = (otherParent.healthStage||1)+1;
    otherParent.bereavementBumpAge = s.age; // 同一年的年度狀態機不再對他推進，避免一年跳兩階
    otherParentStage = otherParent.healthStage;
    queueEldercareDecision(s, otherParent);
  }
  const homeShare = settleFamilyHomeInheritance(s); // 13.6（2026-09-27）：最後一位家長過世時繼承房子
  if(homeShare) s.chronicle.push(`（${s.age}歲）繼承了家裡的房子${siblings.length ? "（和手足平分）" : ""}`);
  s.parentDeathEventLog = { parentName, relation:parent.relation, inheritance, home_share: homeShare || null, siblings_estate: siblings.length ? siblings : null,
    other_parent: otherParent ? { name: otherParent.name, new_health_stage: otherParentStage } : null };
}

// 十三、健康衰退年度檢查集合：健康cap收斂/疾病判定/父母健康狀態機推進，比照12的rollAnnualCareerChecks，每滿一年判定一次
// ========== 四、4.2.2 父母退休客戶端判定（2026-09-27，使用者授權Claude全權判斷，【測試參數】） ==========
// 13.5.1父母狀態機沒有退休節點，改用父母卡的年齡與職業判斷：在世父母(含不同住、隔代教養的祖父母卡)滿PARENT_RETIREMENT_AGE退休，
// 自營業者晚PARENT_RETIREMENT_SELF_EMPLOYED_EXTRA年。第一位退休時完成parent_retirement里程碑；
// 退休的是自營業者時照舊觸發12.11.1接手家業(原本這條要等AI回報)。每位家長只判定一次，退休記在卡上(parent.retired)
const PARENT_RETIREMENT_AGE = 65;
const PARENT_RETIREMENT_SELF_EMPLOYED_EXTRA = 5;
function checkParentRetirements(s){
  const events = [];
  (s.characters||[]).filter(c=>(c.origin==="父母，從出生起" || c.origin==="隔代教養，從出生起") && !c.deceased && !c.retired && typeof c.age==="number").forEach(c=>{
    const retireAge = PARENT_RETIREMENT_AGE + (c.occupation==="自營業者" ? PARENT_RETIREMENT_SELF_EMPLOYED_EXTRA : 0);
    if(c.age < retireAge) return;
    c.retired = true;
    events.push({ parentName:c.name, relation:c.relation });
    if(s.milestones.parent_retirement!=="completed"){ completeMilestone(s, "parent_retirement"); }
    if(c.occupation==="自營業者" && s.careerStatus!==CAREER_STATUS.RETIRED) checkFamilyBusinessOnParentRetirement(s);
  });
  if(events.length) s.parentRetirementEventLog = events;
}
// ========== 十三、13.7.2 喪偶（2026-09-27，使用者授權Claude全權判斷） ==========
// 【定案】伴侶角色卡沿用同一套年度判定：配偶沒有健康數值，用7.1.5年齡基礎機率(不乘健康倍率、沒有高風險加成)，40歲以前不判定(同7.1.5)。
// 過世後：配偶卡標deceased、不再同住、配偶收入歸零；喪偶里程碑與履歷；這一回合幸福感以heavy計(比照13.6父母過世)，之後交回歸機制；
// 戀愛狀態機照常可以開始新關係(沒有配偶就不會擋)。婚時沒有年齡的配偶卡(舊存檔)以玩家年齡補上
function rollSpouseAnnualDeath(s){
  if(s.idleMode) return null; // 10.6.7【定案】放置期間家人過世比照死亡排除
  const spouse = (s.characters||[]).find(c=>c.romanceStatus==="married" && !c.deceased);
  if(!spouse) return null;
  if(typeof spouse.age!=="number") spouse.age = s.age;
  if(spouse.age < DEATH_MIN_AGE) return null;
  if(Math.random() >= deathAgeBaseProbability(spouse.age)) return null;
  spouse.deceased = true; spouse.active = false; spouse.romanceStatus = "widowed";
  releaseCohabiting(spouse);
  s.spouseIncome = 0; s.spouseOccupationCategory = null;
  completeMilestone(s, "widowed");
  s.chronicle.push(`（${s.age}歲）${spouse.name}走了`);
  s.spouseDeathEventLog = { spouseName: spouse.name };
  s.pendingRelationshipHints = (s.pendingRelationshipHints||[]).concat([{ tier:1, text:`${spouse.name}走了` }]);
  return spouse.name;
}
function rollAnnualHealthChecks(s){
  checkParentRetirements(s); // 4.2.2（2026-09-27）
  rollSpouseAnnualDeath(s); // 13.7.2（2026-09-27）
  if(s.riskyHobbyScore>0) s.riskyHobbyScore--; // 7.1.1（2026-09-27）：極限運動習慣每滿一年退一分
  settleHealthyYear(s); // 13.2（2026-09-27）：先結算上一年的健康經營，再做cap收斂
  applyHealthCapConvergence(s);
  const illness = rollAnnualIllnessCheck(s);
  if(illness) s.illnessEventLog = illness;
  const parentEvents = rollParentHealthStageAdvance(s);
  if(parentEvents.length) s.parentHealthEventLog = parentEvents;
  return { illness, parentEvents };
}

// 四、4.2.1.1（9/19新增）：短期上下文壓縮規則——最近3回合給完整原文，再往前6則只給AI已經產生過的turn_summary壓縮摘要，
// 更早的完全不送給AI（由4.2履歷/4.1 NPC記憶承接長期記憶），取代原本「recent_log只給最近2則原文、更早整個看不到」的做法
const RECENT_FULL_TEXT_TURNS = 3; // 【定案,9/19,見4.2.1.1】
const RECENT_SUMMARY_TURNS = 6; // 【測試參數,Claude Code判斷,呼應L3履歷摘要同樣抓6則】
// 一、1.2.9.1（2026-09-23取代原本固定250-350字規則）：敘事字數依這回合monthsCrossed(這回合涵蓋的遊戲內時間長度)分級，
// 程式直接算好級距+建議字數告訴AI，不讓AI自己換算週期。三個級距的分界(2週=0.5個月/1個月)與各級字數皆為【測試參數,暫定,待驗證】
// 2026-09-24：①tension為low時取該級距下限(1.2.8.4.3定案)；②字數含行動結果＋新場景兩部分，行動結果約占1/4-1/3(1.2.9.11.3)
function narrativeLengthTier(monthsCrossed, tension){
  const m = monthsCrossed||0;
  let g;
  if(m<=0.5) g = { tier:"short", min:400, max:500, structure:"新場景只寫一個核心場景，不需要轉場句" };
  else if(m<=1) g = { tier:"medium", min:450, max:600, structure:"新場景以核心場景為主，可視情況加0-1個次要片段，多出的字數優先用在片段/轉場，不要拉長核心場景本身" };
  else g = { tier:"long", min:500, max:700, structure:"新場景用完整三段結構：核心場景＋次要片段0-2個(各1-3句)＋轉場句1-2句" };
  const total = tension==="low" ? g.min : Math.round((g.min+g.max)/2);
  return {
    tier:g.tier, word_range:`${g.min}-${g.max}字`, target_total_words: total,
    action_result_words: `${Math.round(total/4)}-${Math.round(total/3)}字`,
    structure: g.structure
  };
}
// ===== 一、1.2.9.13（2026-09-24新增）角色卡同名衝突 =====
// 家人稱謂正規化：只看relation開頭(例如「父親（服刑中）」→父親、「前配偶」→配偶)，避免「同學的哥哥」這類非家人被誤判
const FAMILY_ROLE_PATTERNS = [
  ["父親",/^(父親|爸爸)/], ["母親",/^(母親|媽媽)/], ["繼父",/^繼父/], ["繼母",/^繼母/],
  ["哥哥",/^哥哥/], ["弟弟",/^弟弟/], ["姊姊",/^(姊姊|姐姐)/], ["妹妹",/^妹妹/],
  ["祖父",/^(爺爺|阿公|外公|祖父)/], ["祖母",/^(奶奶|阿嬤|外婆|祖母)/],
  ["兒子",/^兒子/], ["女兒",/^女兒/], ["配偶",/^(前)?(配偶|丈夫|妻子|老公|老婆)/]
];
const FAMILY_ROLE_GENDER = { 父親:"男", 繼父:"男", 哥哥:"男", 弟弟:"男", 祖父:"男", 兒子:"男", 母親:"女", 繼母:"女", 姊姊:"女", 妹妹:"女", 祖母:"女", 女兒:"女" };
function familyRoleOf(relation){
  const r = String(relation||"").trim();
  const hit = FAMILY_ROLE_PATTERNS.find(([,re])=>re.test(r));
  return hit ? hit[0] : null;
}
// 衝突判斷(1.2.9.13定案)：家人稱謂不同，或一方是家人、一方不是家人，才算衝突；非家人稱謂的差異視為同一人
function isCharacterNameConflict(existingRelation, newRelation){
  const a = familyRoleOf(existingRelation), b = familyRoleOf(newRelation);
  if(!a && !b) return false;
  return a!==b;
}
const RENAME_GIVEN_NAMES_MALE = ["冠宇","承翰","宥辰","子豪","柏宇","品睿","俊傑","宇軒","哲瑋","文彬"];
const RENAME_GIVEN_NAMES_FEMALE = ["品妍","宜蓁","思妤","芷晴","欣怡","語彤","佳穎","郁婷","宛瑜","筱涵"];
const RENAME_SURNAMES = ["陳","林","黃","張","李","王","吳","劉","蔡","楊","許","鄭","謝","郭","洪"];
function allUsedNames(s){
  const set = new Set((s.characters||[]).map(c=>c.name));
  if(s.name) set.add(s.name);
  return set;
}
// 改名方式(1.2.9.13定案)：新卡是家人→改名字、不加姓氏；新卡不是家人→加姓氏區分(原本已帶姓氏就換一個姓)
function renameForConflict(s, name, newRelation){
  const used = allUsedNames(s);
  const role = familyRoleOf(newRelation);
  if(role){
    const g = FAMILY_ROLE_GENDER[role];
    const pool = g==="男" ? RENAME_GIVEN_NAMES_MALE : g==="女" ? RENAME_GIVEN_NAMES_FEMALE : RENAME_GIVEN_NAMES_MALE.concat(RENAME_GIVEN_NAMES_FEMALE);
    const free = pool.filter(n=>!used.has(n));
    if(free.length) return pick(free);
    return name+"二"; // 防呆：名單用盡時的最後手段
  }
  const base = (name.length>=3 && RENAME_SURNAMES.includes(name[0])) ? name.slice(1) : name;
  const free = RENAME_SURNAMES.map(sn=>sn+base).filter(n=>n!==name && !used.has(n));
  return free.length ? pick(free) : base+"（二）";
}

// ===== 一、1.2.8.4.2（2026-09-24實作）NPC台詞長度上限 dialogue_style =====
const DIALOGUE_STYLE_LIMITS = { terse:2, normal:4, talkative:8 };
function rollDialogueStyle(){ return weightedPick([["terse",30],["normal",50],["talkative",20]]); } // 【測試參數】家人卡開局隨機
// AI以{{名字|台詞}}標記NPC台詞；程式依該角色dialogue_style截斷，顯示時換成「台詞」。
// 截斷在上限內最後一個句號/問號/驚嘆號處，不在句子中間硬切；找不到標點則保留整句並回報(1.2.8.4.2定案)
function truncateDialogueLine(line, limit){
  const ends = [];
  const re = /[。？！?!]+|…+|\.{3,}/g; let m;
  while((m = re.exec(line))){ ends.push({ idx:m.index+m[0].length, strong:/[。？！?!]/.test(m[0]) }); }
  // 最後一句沒有結尾標點時也算一句
  const lastEnd = ends.length ? ends[ends.length-1].idx : 0;
  const count = ends.length + (line.slice(lastEnd).trim() ? 1 : 0);
  if(count<=limit) return { text:line, truncated:false };
  const within = ends.slice(0, limit).filter(e=>e.strong);
  if(!within.length) return { text:line, truncated:false, noPunctuation:true };
  return { text:line.slice(0, within[within.length-1].idx), truncated:true };
}
function processDialogueMarkup(s, text){
  const notes = [];
  const out = String(text||"").replace(/「?\s*\{\{([^|{}]+)\|([^{}]*)\}\}\s*」?/g, (all, rawName, rawLine)=>{
    const name = rawName.trim();
    let line = rawLine.trim().replace(/^「/,"").replace(/」$/,"");
    const c = (s.characters||[]).find(x=>x.name===name);
    const limit = c ? DIALOGUE_STYLE_LIMITS[c.dialogueStyle||"normal"] : null;
    if(limit){
      const t = truncateDialogueLine(line, limit);
      if(t.truncated) notes.push(`${name}的台詞超過${c.dialogueStyle||"normal"}上限${limit}句，已在句尾截斷`);
      if(t.noPunctuation) notes.push(`${name}的台詞超過上限${limit}句，但上限內找不到句號/問號/驚嘆號，保留整句`);
      line = t.text;
    }
    return "「"+line+"」";
  });
  return { text: out, notes };
}

// ===== 一、1.2.9.7（2026-09-24實作）伏筆追蹤(程式掌管) =====
const FORESHADOW_MAX_OPEN = 3; // 【測試參數,暫定待實測】
const FORESHADOW_REMIND_AFTER = 15; // 【測試參數,暫定待實測】
const FORESHADOW_AUTO_FADE_AFTER = 20; // 1.2.9.7保底（2026-09-24定案）：提醒後再過5回合仍未回收，程式自動標為淡出並釋出名額
function openForeshadows(s){ return (s.foreshadows||[]).filter(f=>f.status==="open"); }
function applyForeshadowUpdates(s, r){
  s.foreshadows = s.foreshadows || [];
  (r.foreshadow_updates||[]).forEach(u=>{
    const f = s.foreshadows.find(x=>x.id===u.id && x.status==="open");
    if(f && (u.status==="resolved" || u.status==="faded")){ f.status = u.status; f.closedTurn = s.turnCount; }
  });
  (r.foreshadow_new||[]).forEach(text=>{
    if(!text || typeof text!=="string") return;
    if(openForeshadows(s).length>=FORESHADOW_MAX_OPEN){ console.warn("[伏筆] 已達上限，忽略新伏筆：", text); return; }
    s.foreshadowSeq = (s.foreshadowSeq||0)+1;
    s.foreshadows.push({ id:"f"+s.foreshadowSeq, text:text.slice(0,80), bornTurn:s.turnCount, status:"open" });
  });
  // 1.2.9.7保底（2026-09-24定案）：開啟滿FORESHADOW_AUTO_FADE_AFTER回合仍未回收→自動淡出，下一回合告知AI
  s.foreshadowFadeNotices = s.foreshadowFadeNotices || [];
  s.foreshadows.forEach(f=>{
    if(f.status==="open" && s.turnCount - f.bornTurn >= FORESHADOW_AUTO_FADE_AFTER){
      f.status = "faded"; f.closedTurn = s.turnCount; f.autoFaded = true;
      s.foreshadowFadeNotices.push({ id:f.id, text:f.text });
    }
  });
  // 已結束的伏筆只保留最近20筆，避免存檔無限變大
  const closed = s.foreshadows.filter(f=>f.status!=="open");
  if(closed.length>20){ const drop = new Set(closed.slice(0, closed.length-20)); s.foreshadows = s.foreshadows.filter(f=>!drop.has(f)); }
}

// ===== 一、1.2.8.2（2026-09-24實作）語氣軌tone_track／張力tension由程式指定 =====
// 依1.2.8.2.5對照表，只用「呼叫AI之前就已經確定」的程式訊號判斷；優先序：強制克制軌＞回望軌＞一般克制軌＞碎念軌，tension任一high即high
const MUTTER_STREAK_LIMIT = 3; // 1.2.8.2.3
function detectRelationshipTurningIntent(actionText){ return /告白|表白|求婚|分手|提分手/.test(actionText||""); }
function computeToneTrack(s, timeCtx, actionText, forceEnding){
  const hits = []; // {track, forced, tension, category}
  const add = (track, tension, category, forced)=>hits.push({ track, tension, category, forced:!!forced });
  if(forceEnding) add("restrained","high","死亡相關(本人)",true);
  if(timeCtx && timeCtx.deathForeshadowNow) add("restrained","high","死亡相關(前兆)",true);
  if(s.divorceEventLog || s.parentDeathEventLog || s.spouseDeathEventLog) add("restrained","high","家庭成員重大變故",true); // 2026-09-28補上喪偶
  // 1.2.8.7（2026-09-28使用者同意Claude建議）：生育/領養改由程式判定後可事先指定語氣軌——
  // 出生、領養成功＝人生階段轉換級的回望軌高張力；嘗試沒懷上＝克制軌低張力；領養沒辦成＝克制軌低張力
  const fe = s.fertilityEventLog;
  if(fe){
    if(fe.type==="birth" || (fe.type==="adoption" && fe.success)) add("retrospect","high","生育或領養(新成員加入)",false);
    else if(!fe.success) add("restrained","low", fe.type==="adoption" ? "領養沒辦成" : "嘗試生育沒懷上", false);
    else add("restrained","low","得知懷孕",false);
  }
  if(timeCtx && timeCtx.prologue) add("restrained","low","開局家庭背景描述",false);
  if(timeCtx && timeCtx.examCheck) add("restrained","high","高張力明牌檢定(期末考成績公布)",false);
  else if(timeCtx && timeCtx.examTriggered) add("restrained","low","期中考/期末考(考試當下)",false);
  if(s.pendingSideBusinessCardId) add("restrained","high","副業觸發抉擇",false);
  if(detectRelationshipTurningIntent(actionText) || s.marriageCrisisEventLog) add("restrained","high","告白/表態、分手/關係破裂、結婚",false);
  if(s.marriageCrisisArc) add("restrained", s.marriageCrisisArc.stage==="confrontation" ? "high" : "low", "婚姻危機（"+(s.marriageCrisisArc.stage==="surfacing"?"浮現":"攤牌")+"）", false); // 7.6.2（2026-09-27）
  if(s.careerEventLog){
    if(s.careerEventLog.type==="retirement") add("retrospect","high","人生階段轉換(退休)",false);
    else add("restrained","high","求職面試、轉職、升遷、創業啟動",false);
  }
  if(s.graduationEventLog) add("retrospect","high","人生階段轉換(畢業)",false);
  if(s.interestFormedEventLog) add("retrospect","low","興趣卡由候選正式成形",false);
  const mode = s.timeState.stageMode;
  if((mode==="highschool"||mode==="college") && !(timeCtx && timeCtx.prologue) && !(timeCtx && timeCtx.examTriggered)){
    const seg = YEAR_SEGMENTS[s.timeState.segmentIndex % YEAR_SEGMENTS.length];
    add("mutter","low", /準備期/.test(seg.key) ? "期中/期末準備期" : "學期日常", false);
  } else if(mode==="career" && s.careerStatus===CAREER_STATUS.EMPLOYED){
    add("mutter","low","工作日常",false);
  }
  // 1.2.8.7（2026-09-24拍板）：戀愛日常——目前有交往對象，且本回合沒有其他重大事件(沒有強制克制軌/回望軌/高張力類別)時，指定碎念軌低張力
  const hasPartner = (s.characters||[]).some(c=>c.active!==false && !c.deceased && ["dating","stable","married"].includes(c.romanceStatus));
  if(hasPartner && !hits.some(h=>h.forced || h.track==="retrospect" || h.tension==="high")) add("mutter","low","戀愛、友情日常互動",false);
  const rank = h => h.forced ? 0 : h.track==="retrospect" ? 1 : h.track==="restrained" ? 2 : 3;
  let chosen = hits.slice().sort((a,b)=>rank(a)-rank(b))[0] || { track:"restrained", tension:"low", category:"其他未歸類" };
  let tension = hits.some(h=>h.tension==="high") ? "high" : "low";
  let track = chosen.track, category = chosen.category;
  // 1.2.8.2.3：碎念軌最多連續3回合，第4回合改克制軌(低張力)，出現非碎念軌回合後重新計數
  if(track==="mutter" && (s.mutterStreak||0)>=MUTTER_STREAK_LIMIT){
    track = "restrained"; tension = "low"; category += "(碎念軌連續上限，改克制軌)";
  }
  return { tone_track:track, tension, category };
}

const TONE_SWITCH_EVENTS = {

const WORKER_URL = "https://life-game.smile80275.workers.dev/";
let lastTurnServerInfo = null; // Worker回傳的lifegame欄位(行動點、遙測)，開發者面板顯示用
let lastCallServerAP = null;    // 這一次callAI收到的伺服器端行動點(失敗時takeTurn用它校正本機退點)

async function callAI(actionText, forceEnding, timeCtx){
  lastCallServerAP = null;
  let res;
  try{
    res = await fetch(WORKER_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      // 2026-09-25（十、10.4）：只送messages。model/max_tokens/output_config/tools/tool_choice/system全部改由Worker決定
      // (見worker/prompt.js與worker.js的buildTurnRequest)，前端就算送了也會被忽略
      // 十、10.3.11（2026-09-25）：附帶金鑰/slot/這回合的turn_nonce，Worker以伺服器端行動點餘額決定能不能呼叫AI；
      // 同一回合的重試與重新生成沿用同一個turn_nonce，不會重複扣點。ap_hint只在Worker還沒有這條人生的紀錄(舊存檔)時用來建立紀錄
      body: JSON.stringify({
        key: localStorage.getItem(RECOVERY_KEY_STORAGE_NAME),
        slot: Number(localStorage.getItem(ACTIVE_SLOT_STORAGE_NAME)),
        turn_nonce: timeCtx && timeCtx.turnNonce,
        life_id: ensureLifeId(state),
        ap_hint: timeCtx && timeCtx.apBefore,
        messages: [{ role:"user", content: buildUserMessage(actionText, forceEnding, timeCtx) }]
      })
    });
  }catch(networkErr){
    throw new Error("網路請求失敗："+networkErr.message);
  }

  let text;
  try{ text = await res.text(); }
  catch(readErr){ throw new Error("讀取回應內容失敗："+readErr.message); }

  if(!text || text.trim().length===0){
    const ct = res.headers.get("content-type");
    throw new Error("收到空白回應（HTTP "+res.status+" "+res.statusText+"，content-type: "+ct+"，長度: "+text.length+"）");
  }

  let data;
  try{ data = JSON.parse(text); }
  catch(parseErr){ throw new Error("回應不是合法JSON（HTTP "+res.status+"）內容前2000字：「"+text.slice(0,2000)+"」"); }

  // 十、10.3.11：Worker回傳的伺服器端餘額(成功或失敗都有)，一律以它為準
  if(data && data.lifegame && data.lifegame.ap){ syncServerAP(state, data.lifegame.ap); lastCallServerAP = data.lifegame.ap; }
  if(data && data.lifegame) lastTurnServerInfo = data.lifegame;
  if(res.status===402 || res.status===429){
    const err = new Error(res.status===402 ? "行動點不足（伺服器端）" : "這一回合重新生成次數已達上限");
    err.noRetry = true; err.apInsufficient = res.status===402;
    throw err;
  }
  if(!res.ok){
    throw new Error("API錯誤 "+res.status+"："+(data?.error?.message||JSON.stringify(data)));
  }
  if(data.error){
    throw new Error("API錯誤："+data.error.message);
  }
  // 2026-09-19（續）：改用強制工具呼叫，直接讀tool_use區塊的.input（API端已經幫忙解析成物件），
  // 不再需要find文字區塊+手動JSON.parse，見TURN_RESULT_TOOL/tool_choice的說明
  const toolBlock = (data.content||[]).find(b=>b.type==="tool_use" && b.name==="submit_turn_result");
  if(!toolBlock){
    // 診斷用（9/18新增）：stop_reason/usage能直接看出是不是max_tokens被思考吃光，不用再靠截斷的原始內容猜
    throw new Error("回應裡沒有submit_turn_result工具呼叫｜stop_reason="+data.stop_reason+" ｜usage="+JSON.stringify(data.usage)+" ｜content概要："+JSON.stringify((data.content||[]).map(b=>({type:b.type, len:(b.text||b.thinking||"").length}))));
  }
  // 2026-09-19（續2）：實測發現一種新的失敗模式——AI雖然有呼叫submit_turn_result工具（toolBlock存在），
  // 但把整個回應寫成舊式「prompted tool use」的偽XML文字格式（例如narrative欄位結尾出現</narrative>，
  // 後面接著整串<parameter name="turn_summary">...</parameter>之類的標籤），而不是老實把值分別填進schema的
  // 各自獨立欄位。這種情況toolBlock.input存在、不會被上面的!toolBlock擋下，但內容是壞的，之前會被當成
  // 「成功」悄悄吃下去，玩家看到的敘事會混進一堆標籤碎片。這裡補一道驗證，偵測到就當作失敗觸發既有的重試機制
  if(isMalformedTurnResult(toolBlock.input)){
    throw new Error("工具呼叫內容格式異常（疑似AI把整個回應寫成舊式文字標籤格式，沒有正確使用schema欄位）｜stop_reason="+data.stop_reason+" ｜narrative前300字：「"+String(toolBlock.input && toolBlock.input.narrative).slice(0,300)+"」");
  }
  return toolBlock.input;
}
// 見上方callAI()註解：偵測AI是否把整個工具呼叫錯寫成舊式偽XML文字格式，混進narrative欄位或其他欄位缺漏/型別不對
// 2026-09-19（續3）：實測發現汙染不一定只出現在narrative欄位結尾——曾出現narrative本身乾淨、但event_type/
// interest_event/character_updates等其他欄位被塞進<parameter name="...">...</parameter>標籤文字的情況，
// 原本只檢查narrative欄位完全抓不到，導致這種「半污染」回應被當成功接受，choices欄位因此也連帶空掉或缺漏，
// 造成畫面上選項整組消失（玩家只剩自訂輸入可用）。改成序列化整個input物件做全欄位掃描，涵蓋任何欄位藏汙染的情況
function isMalformedTurnResult(input){
  if(!input || typeof input!=="object") return true;
  if(typeof input.narrative!=="string" || !input.narrative.trim()) return true;
  if(typeof input.turn_summary!=="string" || !input.turn_summary.trim()) return true;
  if(!Array.isArray(input.choices)) return true;
  if(!input.is_ending && input.choices.length===0) return true; // 非結局回合choices不該是空陣列，呼應一、1.2.7「給3到4個選項」定案
  try{
    if(/<\/narrative>|<parameter\s+name=/.test(JSON.stringify(input))) return true;
  }catch(e){ return true; }
  return false;
}

function weightedPick(pairs){
  const total = pairs.reduce((s,p)=>s+p[1],0);
  let r = Math.random()*total;
  for(const [val,w] of pairs){ if(r<w) return val; r-=w; }
  return pairs[0][0];
}
function pickAgeAdvance(age){
  if(age<=18) return weightedPick([[0,7],[1,3]]);
  if(age<=29) return weightedPick([[0,4],[1,6]]);
  if(age<=45) return weightedPick([[1,5],[2,5]]);
  return weightedPick([[2,5],[3,3],[4,2]]);
}
function guessFocus(actionText){

function applySnapshot(){
  if(!state.snapshot) return;
  const snap = JSON.parse(JSON.stringify(state.snapshot));
  const bookDraft = snap.bookDraft; delete snap.bookDraft;
  Object.assign(state, snap);
  // 十五：被反悔掉的那一回合如果剛好收成了一章，那一章也撤掉(已經寫好的章節不受影響)
  if(state.book && bookDraft!==undefined){
    state.book.draft = bookDraft ? bookDraft.draft : null;
    if(bookDraft) state.book.chronicleSeen = bookDraft.chronicleSeen;
    state.book.chapters = state.book.chapters.filter(c=>c.createdTurn <= state.turnCount || c.status==="done");
  }
}
function restoreUndo(){
  if(!state.snapshot) return;
  applySnapshot();
  state.undosLeft -= 1;
  state.snapshot = null;
  saveGame(); render();
}

  const apUsed = spendAP(state, cost);

  if(cost>0) state.lastActiveDate = taipeiDateString(); // 10.6.2：mock模式本機算離線天數用(真實模式由Worker記)

  // 九、9.5.1轉系候選判定需要「考前實際累積的讀書次數」，必須在advanceStructuredTime把studyCountThisTerm歸零之前先存一份快照，
  // 否則applyResult()拿到的會是考試結算後已經歸零的值。這份快照(studyCountAtExam)同時也用來修正buildUserMessage()的
  // exam_score_hint/study_count_this_term計算順序bug（9/16修正，見2.4.1）
  const studyCountBeforeAdvance = state.studyCountThisTerm||0;
  // 三、3.2.4（2026-09-23拍板）：才識拖累斜率需要「考前實際累積的選興趣路徑次數」，同一個時序理由，快照方式比照上面studyCountBeforeAdvance
  const interestCountBeforeAdvance = state.interestCountThisTerm||0;
  const wasPrologue = !!state.timeState.prologue; // 一、1.2.9.11：開場回合沒有「上一回合場景」，也不需要行動結果段
  // 二、2.5（9/16新增）：22歲以後改採加速曲線回合預算，取代原本「30歲以後交給AI自行判斷age_advance」的舊架構
  // 全生涯（15歲起）都由客戶端結構化算好本回合要推進多少時間，AI的age_advance一律視為0，不再有年齡分界
  const adv = advanceStructuredTime(actionText);
  applyPartTimeWork(state, actionText, adv.window); // 3.4.2（2026-09-27）：打工收入由程式依時薪×時數算好，AI只負責敘事
  applyFertilityTurn(state, actionText); // 7.3.2（2026-09-27）：生育/領養的大方向由程式判定
  // 十一、11.4（9/19新增）：期末考是首版明牌檢定白名單唯一節點，命中就在呼叫AI之前先擲骰決定確切分數
  // （呼應7.1.5死亡機制精神，不讓AI自由裁量這個數字），期中考不受影響、維持原本hint範圍由AI自由發揮
  const examCheck = (adv.examTriggered && adv.examType==="期末考") ? rollFinalExamCheck(state.stats.knowledge, studyCountBeforeAdvance, interestCountBeforeAdvance) : null;
  // 三、3.2.4（2026-09-27）：記下每次考試成績，供畫面上的課業軌跡顯示（期中考用大方向落點，期末考用明牌檢定分數）
  if(adv.examTriggered){
    const score = examCheck ? examCheck.finalScore : clamp(Math.round(state.stats.knowledge + studyCountBeforeAdvance*3
      - interestCountBeforeAdvance*EXAM_INTEREST_DRAG_PER_CHOICE*computeExamInterestDragMultiplier(state.stats.knowledge)), 0, 100);
    state.examHistory = (state.examHistory||[]).concat([{ label: adv.currentLabel, type: adv.examType, score }]).slice(-6);
  }
  if(examCheck && !examCheck.passed) markPlayStyleSetback(state, "exam_fail", null); // 十六、16.2.3
  if(examCheck) checkNonLeaveGraduationDelay(state, examCheck, interestCountBeforeAdvance); // 9.4（2026-09-27）：非休學型延畢
  // 2026-09-23修正（時間標籤慢一拍bug）：這回合顯示/送給AI的標籤改用currentLabel(這回合實際所在的段落)，
  // 不再用toLabel(換段後、下一回合才生效的段落)；jump提示(from/to)維持給跳過動作用，語意不變
  let timeCtx = { structured:true, label: adv.currentLabel, jump: adv.bigJump ? {from:adv.fromLabel, to:adv.toLabel} : null, monthsCrossed: adv.monthsCrossed||0, examTriggered: !!adv.examTriggered, examType: adv.examType||null, examCheck, studyCountAtExam: studyCountBeforeAdvance, interestCountAtExam: interestCountBeforeAdvance, deathForeshadowNow: !!adv.deathForeshadowNow, window: adv.window||null, prologue: wasPrologue };
  render(true);

  // 七、7.1.5（9/16改版,測試參數）：取代原本state.age>=state.lifeExpectancy的固定壽命值判定，
  // 死亡結局現在完全由client端的年度機率roll決定（見rollAnnualDeathCheck），不再有AI自行判斷的空間
  const forceEnding = !!adv.deathTriggered;
  // 四、4.5（2026-09-20 b版修正）：forceEnding時，最後一段的邊界要在呼叫AI之前先確定好，
  // 這樣buildUserMessage()/mockGenerateTurn()算出的life_summary_material才會是完整8段，AI才有機會
  // 寫到角色死亡的那一段（取代原本邊界只在applyResult()事後才凍結、AI永遠看不到最後一段的舊流程）
  if(forceEnding) freezeFinalLifeStageForEnding(state);
  // 一、1.2.8.2（2026-09-24實作）：語氣軌/張力在呼叫AI之前由程式決定，重新生成時沿用同一組，成功套用結果後才計入碎念軌連續次數
  timeCtx.tone = computeToneTrack(state, timeCtx, actionText, forceEnding);
  // 十、10.3.11（2026-09-25）：同一回合(含失敗重試、場景日期重新生成)共用一個turn_nonce，Worker只扣一次點
  timeCtx.turnNonce = newTurnNonce();
  timeCtx.apBefore = apBefore;
  // bug修正（9/14，人生草稿0914測試.pdf）：技術錯誤/破碎原始文字絕對不能外洩給玩家；
  // 失敗先重試一次，重試仍失敗才顯示中性容錯敘事，不附帶任何e.message或原始內容
  try{
    const callOnce = ()=> USE_MOCK ? mockCallAI(actionText, forceEnding, timeCtx) : callAI(actionText, forceEnding, timeCtx);
    let result;
    try{
      result = await callOnce();
    }catch(firstErr){
      if(firstErr && firstErr.noRetry) throw firstErr; // 10.3.11：伺服器端行動點不足/重新生成達上限，重試也沒用
      console.error("第一次呼叫失敗，重試一次：", firstErr);
      result = await callOnce();
    }
    // 一、1.2.9.11.4（2026-09-24新增）：新場景日期檢查——與上一回合同一天或超出本回合範圍視為違規，
    // 自動重新生成一次(不扣行動點，點數在上面已經只扣過一次)並記錄；重新生成仍違規就照常顯示、記入待確認清單，不再重試
    const dateCheck = validateSceneDate(result, timeCtx.window);
    if(!dateCheck.ok){
      console.warn("[場景日期違規] 自動重新生成一次：", dateCheck.reason);
      addReviewFlag(state, "scene_date_retry", "第一次生成違規，已自動重新生成："+dateCheck.reason);
      timeCtx.retryNote = `你上一次回傳的新場景日期不合規則：${dateCheck.reason}。這次scene_day_offset必須是0到${timeCtx.window.end-timeCtx.window.start}之間的整數（${calFormat(timeCtx.window.start)}～${calFormat(timeCtx.window.end)}）。`;
      try{
        const retried = await callOnce();
        const recheck = validateSceneDate(retried, timeCtx.window);
        result = retried;
        if(!recheck.ok) addReviewFlag(state, "scene_date_unresolved", "重新生成後仍違規，照常顯示："+recheck.reason);
      }catch(retryErr){
        console.error("重新生成失敗，沿用第一次的結果：", retryErr);
        addReviewFlag(state, "scene_date_unresolved", "重新生成呼叫失敗，沿用第一次違規的結果："+dateCheck.reason);
      }
      timeCtx.retryNote = null;
    }
    applyResult(result, timeCtx, forceEnding, actionText);
    bookAfterTurn(state, result, forceEnding); // 十五、人生之書：收集這回合的摘要，換階段/滿5年/人生結束時收成一章
    // 1.2.8.7：AI在事件發生時自行切換語氣軌的話，以實際語氣軌計入碎念軌連續次數並記在這則日記上
    const effectiveTone = resolveEffectiveTone(timeCtx.tone, result);
    const lastEntry = state.log[state.log.length-1];
    if(lastEntry) lastEntry.tone = { tone_track:effectiveTone.tone_track, tension:effectiveTone.tension, category:effectiveTone.category, switched:effectiveTone.switched };
    commitToneTrack(state, effectiveTone);
  }catch(e){
    console.error("重試後仍失敗：", e);
    applySnapshot();
    refundAP(state, apUsed); // 十、10.3.1：API呼叫失敗/斷線不扣點
    // 10.3.11：真實模式下callAI已經把Worker回傳的伺服器端餘額寫回state.ap，本機退點後再以伺服器端為準
    if(!USE_MOCK && lastCallServerAP) syncServerAP(state, lastCallServerAP);
    if(e && e.apInsufficient){
      saveGame(); render(); renderAPExhaustedModal();
      return;
    }
    state.log.push({age:state.age, timeLabel:null, text:"（旁白剛剛恍神了一下，這回合沒講清楚，稍後再試一次看看。）", error:true, retryAction:actionText, retryCost:cost});
  }
  saveGame();
  render();
  // 十、10.3.8：用掉最後1點時，這回合照常生成顯示、自動存檔後才跳出提示（死亡結局那回合不用提示）
  const apJustExhausted = cost>0 && state.phase==="playing" && totalAP(state)===0;
  if(examCheck){ renderExamCheckModal(examCheck); }
  dispatchPendingModals(); // 2026-09-27：抽成函式，放置回溯(10.6.5)回到某個彈窗時也要能重新跳出
  if(apJustExhausted) renderAPExhaustedModal(); // 最後才疊上去，確保在其他彈窗之上
  updateDevUsageBox(); // 10.5：開發者面板的上一回合用量
  processBookQueue(true); // 十五、背景寫章節(不等它，不影響這回合)；失敗的章節每回合自動重試一次，最多3次
}

// 10.6.1 玩家離線期間角色依性格自動推進；預設關閉、每條人生各自設定(state.idleEnabled)。回來時由程式一次補算。
// 10.6.3 放置期間不生成選項、不呼叫AI：每回合依性格抽一個傾向標籤，套固定數值變化與模板短句；數值結算走既有公式。
// 10.6.7 放置期間不判定死亡、重大疾病、家人過世(由各判定函式讀s.idleMode擋掉)；其他年度判定照常
const IDLE_TAGS = ["努力","社交","安逸","冒險","逃避","顧家"];
const IDLE_LINES = {
  努力: ["這段時間把心力放在手邊的事上。","忙了一陣子，進度往前推了一點。","常常忙到很晚，但覺得踏實。"],

  冒險: ["試了一件以前沒做過的事。","臨時起意去了一個沒去過的地方。","接下了一個有點沒把握的挑戰。"],
