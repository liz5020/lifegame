<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人生草稿</title>
<!-- 十六、16.10.8 社群分享預覽(目前以Threads為主)。og:image要是完整網址，og.png(1200×630)跟index.html一起上傳到Pages(16.10.9例外) -->
<meta name="description" content="AI 文字人生模擬。生在哪裡你選不了，但每一頁都由你落筆。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="人生草稿">
<meta property="og:title" content="人生草稿｜這一次，換你決定要活成什麼樣子">
<meta property="og:description" content="AI 文字人生模擬。生在哪裡你選不了，但每一頁都由你落筆。">
<meta property="og:url" content="https://draftmylife.com/">
<meta property="og:image" content="https://draftmylife.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="人生草稿：15歲・起稿">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F7F0E3">
<style>
  /* 十六、16.1～16.2（2026-09-28）：色彩改版。--stamp改為定案的珊瑚紅強調色，--ink改為深棕主要文字；
     --paper-card改為彈窗/面板用的暖白底(16.2.2滑出面板背景)，一般卡片改用.glass毛玻璃 */
  :root{
    --paper:#F7F0E3;
    --paper-card:rgba(250,244,234,.92);
    --paper-dark:rgba(74,46,31,.08);
    --ink:#4A2E1F;
    --ink-soft:#8A6F5E;
    --line:rgba(74,46,31,.16);
    --stamp:#C8553D;
    --teal:#3B6D11;
    --gold:#C8553D;
    --bar:#E0836A;
    --up-bg:rgba(99,153,34,.16); --up-fg:#3B6D11;
    --down-bg:rgba(216,90,48,.16); --down-fg:#993C1D;
    --resp-bg:rgba(200,85,61,.14); --resp-fg:#9A3B27; /* 十六、16.17（2026-09-30）：取代紫色——回應帶來的數值增加＝淺珊瑚底深珊瑚字 */
    --resp-down-bg:rgba(120,96,82,.14); --resp-down-fg:#5E4C40; /* 減少＝淺灰棕底深灰字(一律保留正負號) */
    --focus-bg:rgba(230,140,40,.18); --focus-fg:#9A5A12; /* 二、2.6.2：重心帶來的數值(橘) */
    --danger:#A32D2D;
    --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
    --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
    --t-fast:150ms; --t-std:300ms; --t-slow:600ms;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:transparent;
    display:flex;
    flex-direction:column;
  }

  .pips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
  .pip{width:9px;height:9px;border-radius:50%;border:1px solid var(--gold);}
  .pip.on{background:var(--gold);}

  /* 一、1.2.9.4（2026-09-24實作）文件框：成績單/薪資單/訊息等正式資訊，左側色條、斜體、與正文區隔 */
  .entry .doc-box{border-left:3px solid var(--stamp);padding:6px 12px;margin:0 0 10px;font-style:italic;background:rgba(200,85,61,0.06);}
  .entry .doc-box .doc-title{font-size:12px;color:var(--stamp);letter-spacing:1px;margin-bottom:4px;font-style:normal;}
  .entry .doc-box p{font-size:14.5px;margin:0 0 4px;}
  .npc-link{border-bottom:1px dotted var(--ink-soft);cursor:pointer;} /* 四、4.1.1：劇情中的角色名可點開詳細頁 */

  .roll-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0;
    text-align:left;
  }
  .roll-item{border:1px solid rgba(255,255,255,.65);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.45);}
  .roll-item .k{font-size:11px;color:var(--ink-soft);letter-spacing:1px;}
  .roll-item .v{font-size:20px;font-variant-numeric:tabular-nums;}
  /* 十五、人生之書（2026-09-25新增） */
  .book-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);
    padding:10px 18px;font-size:13px;letter-spacing:1px;box-shadow:0 3px 10px rgba(0,0,0,.25);cursor:pointer;max-width:calc(100vw - 32px);}
  .book-page{position:fixed;inset:0;z-index:55;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .book-inner{max-width:520px;margin:0 auto;padding:24px 20px 40px;}
  .book-cover{text-align:center;border-bottom:2px double var(--ink);padding-bottom:14px;margin-bottom:10px;}
  .book-cover h2{margin:4px 0 0;font-size:24px;letter-spacing:4px;}
  .book-cover-sub{font-size:12px;color:var(--ink-soft);letter-spacing:2px;}
  .book-toc{list-style:none;padding:0;margin:0;}
  .book-toc-item{padding:12px 2px;border-bottom:1px dotted var(--line);}
  .book-toc-item.is-done{cursor:pointer;}
  .book-toc-title{font-size:16px;margin-top:2px;}
  .book-chapter-no{font-size:11.5px;color:var(--ink-soft);letter-spacing:1px;}
  .book-chapter-head{text-align:center;margin:14px 0 18px;}
  .book-chapter-head h2{margin:6px 0 0;font-size:21px;letter-spacing:2px;}
  .book-text p{font-size:15px;line-height:1.95;margin:0 0 1em;}
  .book-empty{font-size:13px;color:var(--ink-soft);}
  .book-retry{margin-top:6px;padding:4px 12px;font-size:12px;}

  /* ========== 十六、介面與視覺設計（2026-09-28實作）========== */
  /* 16.1 暖陽顆粒背景：單一固定背景，純CSS＋SVG */
  @keyframes drift1 { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(40px,30px) scale(1.12); } }
  @keyframes drift2 { 0% { transform: translate(0,0) scale(1.05); } 100% { transform: translate(-35px,-25px) scale(.95); } }
  .bg { position: fixed; inset: 0; background: #F7F0E3; overflow: hidden; z-index: -1; pointer-events:none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(38px); }
  .blob-1 { width: 270px; height: 270px; left: -50px; top: 15%;  background: #E8604C; animation: drift1 16s ease-in-out infinite alternate; }
  .blob-2 { width: 290px; height: 290px; left: 33%;   top: 45%;  background: #F0A04B; animation: drift2 19s ease-in-out infinite alternate; }
  .blob-3 { width: 240px; height: 240px; right: -60px; top: -70px; background: #B9D3EA; animation: drift2 22s ease-in-out infinite alternate; }
  .blob-4 { width: 260px; height: 260px; left: -70px; bottom: -40px; background: #E3EFC5; animation: drift1 20s ease-in-out infinite alternate; }
  .grain {
    position: absolute; inset: 0; opacity: .55; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  /* 16.2.2 毛玻璃卡片 */
  .glass {
    background: rgba(255,255,255,.45);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.65);
    border-radius: 18px;
  }
  /* 16.2.4 年齡印章：珊瑚紅圓框、年齡數字＋「歲・階段」、傾斜約-8度 */
  .stamp{
    border:2px solid var(--stamp);color:var(--stamp);border-radius:50%;
    width:60px;height:60px;flex-shrink:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-8deg);font-family:var(--sans);font-size:9.5px;line-height:1.15;text-align:center;
    letter-spacing:0;white-space:nowrap;
  }
  .stamp b{font-size:18px;display:block;font-family:var(--serif);font-weight:700;}
  .stamp .stamp-lbl{display:block;}
  .stamp.long .stamp-lbl{font-size:8px;white-space:normal;max-width:46px;line-height:1.2;}
  .stamp.big{width:92px;height:92px;font-size:12px;border-width:2.5px;}
  .stamp.big b{font-size:28px;}
  @keyframes restamp{0%{transform:rotate(-8deg) scale(1.6);opacity:0;}70%{transform:rotate(-8deg) scale(.95);opacity:1;}100%{transform:rotate(-8deg) scale(1);opacity:1;}}
  .stamp.restamp{animation:restamp 350ms var(--ease) both;}
  /* 16.2.3 字型：故事內文明體、介面元素黑體 */
  .entry p,.story-serif,.book-text,.book-cover h2,.book-chapter-head h2,.end-title{font-family:var(--serif);}
  h1,h2,h3{letter-spacing:.5px;}
  /* 共用按鈕 */
  .primary-btn{
    background:var(--stamp);color:#fff;border:none;border-radius:999px;
    padding:12px 28px;font-size:15px;letter-spacing:1px;font-family:var(--sans);cursor:pointer;margin-top:10px;
    transition:transform var(--t-fast) var(--ease),opacity var(--t-fast);
  }
  .ghost-btn{
    background:rgba(255,255,255,.4);border:1px solid rgba(74,46,31,.22);color:var(--ink);border-radius:999px;
    padding:10px 22px;font-size:13.5px;letter-spacing:.5px;font-family:var(--sans);cursor:pointer;margin-top:10px;
    transition:transform var(--t-fast) var(--ease),opacity var(--t-fast);
  }
  .primary-btn:active,.ghost-btn:active{transform:scale(.97);}
  .primary-btn:disabled,.ghost-btn:disabled{opacity:.45;cursor:default;}
  /* 彈窗：比照16.2.2滑出面板的底色 */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(74,46,31,.28);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
    animation:fade-in var(--t-std) var(--ease) both;
  }
  .modal{
    background:rgba(250,244,234,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    max-width:340px;width:100%;padding:24px 22px;border:1px solid rgba(255,255,255,.7);border-radius:22px;
    box-shadow:0 10px 30px rgba(74,46,31,.18);max-height:88vh;overflow-y:auto;
  }
  .modal h3{margin-top:0;font-size:17px;}
  .modal p{font-size:13.5px;color:var(--ink-soft);}
  .modal .demo-note{font-size:11px;color:var(--stamp);margin-top:10px;}
  .end-title{font-size:24px;margin:6px 0 4px;color:var(--stamp);}
  .center-screen{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:30px 24px;text-align:center;
  }
  .center-screen h2{font-size:20px;margin-bottom:14px;}

  /* 16.3.1 頂部狀態列(固定) */
  .topbar{position:sticky;top:0;z-index:20;margin:0;border-radius:0 0 18px 18px;border-top:none;padding:10px 14px 8px;}
  .tb-main{display:flex;align-items:center;gap:10px;}
  .tb-mid{flex:1;min-width:0;}
  .tb-stage{font-size:14px;font-weight:700;letter-spacing:.2px;line-height:1.35;}
  .tb-meta{font-size:11px;color:var(--ink-soft);line-height:1.5;margin-top:2px;}
  .tb-meta span{white-space:nowrap;}
  .tb-btns{display:flex;gap:6px;}
  .round-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(74,46,31,.15);background:rgba(255,255,255,.55);
    color:var(--ink);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
    transition:transform var(--t-fast) var(--ease);}
  .round-btn:active{transform:scale(.94);}
  /* 測試選單(開發用，正式上線刪除)：紫色與其他圓鈕區隔 */
  /* 十六、16.17（2026-09-30）：底部選單抽屜、線條圖示、選單鈕。全面移除紫色與emoji */
  .ic-svg{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none;}
  .menu-fab{width:40px;height:40px;border-radius:50%;border:none;background:var(--stamp);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;transition:transform var(--t-fast) var(--ease);}
  .menu-fab:active{transform:scale(.94);}
  .menu-fab .ic-svg{width:20px;height:20px;}
  .drawer{position:fixed;left:50%;width:100%;max-width:520px;bottom:var(--drawer-bottom,130px);max-height:66vh;overflow-y:auto;z-index:44;padding:12px 14px 16px;
    background:rgba(250,244,234,.74);backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);border:1px solid rgba(255,255,255,.65);
    border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(74,46,31,.14);transform:translate(-50%,115%);visibility:hidden;transition:transform 350ms var(--ease),visibility 0s 350ms;}
  .drawer.open{transform:translate(-50%,0);visibility:visible;transition:transform 350ms var(--ease),visibility 0s;}
  .drawer-sec{font-size:13px;font-weight:700;margin:10px 2px 9px;color:var(--ink);}
  .drawer-sec::after{content:"";display:block;width:26px;height:2px;border-radius:2px;background:var(--stamp);margin-top:3px;}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .tile{position:relative;padding:11px 4px 9px;text-align:center;cursor:pointer;font-family:var(--sans);color:var(--ink);border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.5);border-radius:16px;transition:transform var(--t-fast) var(--ease);}
  .tile:active{transform:scale(.96);}
  .tile .base{width:42px;height:42px;border-radius:50%;background:rgba(232,150,126,.22);color:#8A5A45;display:flex;align-items:center;justify-content:center;margin:0 auto 5px;transition:color var(--t-fast);}
  .tile .base .ic-svg{width:21px;height:21px;}
  .tile:active .base,.tile.on .base{color:var(--stamp);}
  .tile .t{font-size:13.5px;font-weight:700;}
  .tile .n{font-size:11.5px;color:var(--ink-soft);min-height:1.3em;}
  .tile .dot{position:absolute;top:8px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--stamp);}
  .tile.dev .base{background:rgba(120,110,100,.18);color:#6B625A;}
  .bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .bar-tile{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--ink);border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.5);border-radius:16px;text-align:left;}
  .bar-tile .ic-svg{width:20px;height:20px;color:#8A5A45;}
  .bar-tile:active .ic-svg{color:var(--stamp);}
  .legend p{margin:6px 0;font-size:13.5px;line-height:1.75;text-align:left;}
  .legend h4{margin:14px 0 2px;font-size:14px;}
  .legend h4::after{content:"";display:block;width:22px;height:2px;border-radius:2px;background:var(--stamp);margin-top:3px;}
  .dev-fab{position:fixed;top:10px;right:10px;z-index:310;box-shadow:0 2px 8px rgba(0,0,0,.25);}
  #panel-test .menu-note{word-break:break-all;}
  .tb-sub{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:6px;font-size:11.5px;color:var(--ink-soft);gap:4px 8px;} /* QA 34.13#17：標籤太多時換行，存款不凸出卡片 */
  .tb-sub .right{margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .demo-tag{font-size:10.5px;color:var(--stamp);border:1px solid rgba(200,85,61,.45);border-radius:999px;padding:0 8px;white-space:nowrap;}
  .demo-tag.side-tag{color:var(--ink-soft);border-color:rgba(74,46,31,.3);margin-left:4px;}
  .demo-tag.sync-tag{cursor:pointer;opacity:.75;}
  .demo-tag.cloud-save-tag{cursor:pointer;margin-left:8px;font-weight:400;letter-spacing:0;vertical-align:1px;}
  .demo-tag.cloud-save-tag.fail{color:var(--stamp);border-color:var(--stamp);font-weight:600;}
  .undo-note{font-size:11.5px;color:var(--ink-soft);margin-left:6px;}

  /* 16.3.2 故事區 */
  .journal{flex:1;padding:14px 14px 10px;}
  .entry{margin-bottom:12px;}
  .entry.card{padding:16px 16px 14px;}
  .entry .age-tag{
    font-size:11.5px;color:var(--stamp);letter-spacing:1px;border-bottom:1px solid var(--stamp);
    display:inline-block;padding-bottom:2px;margin-bottom:8px;
  }
  /* 16.3.8.2（2026-09-28）：段落各自排版，段與段之間空出約一行字高(1em)；字級與行高維持原樣 */
  .entry p{margin:0 0 1em;font-size:15.5px;line-height:1.8;}
  .entry p:last-child{margin-bottom:0;}
  /* 16.3.8.2 選擇行：比正文小一號、淡色、前加「→」、靠左；分隔線：淡色細線、約正文四成寬、置中 */
  .entry .choice-line{font-family:var(--serif);font-size:14px;line-height:1.6;color:var(--ink-soft);text-align:left;margin:0 0 10px;}
  .entry .choice-line .focus-note{font-size:12px;opacity:.8;}
  .entry .turn-divider{border:none;border-top:1px solid var(--line);width:40%;margin:0 auto 1em;}
  .entry-summary{display:flex;align-items:center;gap:8px;padding:9px 14px;opacity:.55;cursor:pointer;font-size:12.5px;
    border-radius:14px;background:rgba(255,255,255,.3);transition:opacity var(--t-std) var(--ease);}
  .entry-summary .s-tag{color:var(--stamp);white-space:nowrap;}
  .entry-summary .s-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--serif);}
  .entry-summary .s-arrow{flex-shrink:0;transition:transform var(--t-std) var(--ease);}
  .entry-summary.open{opacity:.8;}
  .entry-summary.open .s-arrow{transform:rotate(180deg);}
  .entry-expanded{margin:-4px 0 12px;padding:12px 14px;opacity:.8;}
  .entry-meta{margin-top:12px;}
  .caps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .cap{font-size:12px;padding:2px 10px;border-radius:999px;font-variant-numeric:tabular-nums;}
  .cap.up{background:var(--up-bg);color:var(--up-fg);}
  .cap.down{background:var(--down-bg);color:var(--down-fg);}
  .cap.resp{background:var(--resp-bg);color:var(--resp-fg);}
  .cap.resp.neg{background:var(--resp-down-bg);color:var(--resp-down-fg);}
  .cap.focus{background:var(--focus-bg);color:var(--focus-fg);}
  /* 二、2.6.3／16.3.3 重心按鈕、三行輸入框、想找標籤 */
  .focus-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
  .focus-btn{border:1px solid rgba(74,46,31,.16);background:rgba(255,255,255,.55);color:var(--ink);border-radius:999px;padding:5px 11px;
    font-size:12.5px;font-family:var(--sans);cursor:pointer;}
  .focus-btn.on{background:var(--focus-bg);border-color:var(--focus-fg);color:var(--focus-fg);font-weight:600;}
  .focus-rank{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;margin-right:4px;border-radius:999px;background:var(--focus-fg);color:#fff;font-size:11px;font-weight:700;line-height:1;}
  .focus-btn:disabled{opacity:.45;cursor:default;}
  .focus-hint{font-size:11.5px;color:var(--ink-soft);margin:2px 2px 8px;}
  .focus-hint.focus-title{margin:0 2px 4px;} /* 二、2.6.3（2026-10-04）：重心按鈕列上方的小標題 */
  .interest-pick{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px;padding:8px;border-radius:12px;background:rgba(255,255,255,.5);}
  .seek-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--resp-bg);color:var(--resp-fg);margin:0 0 6px;}
  .seek-tag button{border:none;background:none;color:inherit;font-size:14px;cursor:pointer;padding:0 0 0 2px;line-height:1;}
  .custom-row textarea{flex:1;min-width:0;border:1px solid rgba(74,46,31,.16);border-radius:14px;background:rgba(255,255,255,.6);
    font-family:var(--sans);font-size:14px;padding:8px 12px;color:var(--ink);resize:none;line-height:1.5;}
  .custom-row textarea:focus{outline:none;border-color:var(--stamp);}
  .rel-hints{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .rel-hint{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);}
  .avatar{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:rgba(200,85,61,.14);color:var(--stamp);font-size:12.5px;font-weight:700;font-family:var(--serif);}
  .avatar.lg{width:36px;height:36px;font-size:15px;}
  .avatar.gray{background:rgba(74,46,31,.08);color:var(--ink-soft);}
  .stl-item{position:relative;}
  .stl-item:not(.plain){cursor:pointer;border-bottom:1px dotted currentColor;}
  .stl-pop{display:none;position:absolute;left:0;bottom:calc(100% + 4px);z-index:40;min-width:150px;max-width:min(260px,80vw);padding:6px 10px;border-radius:8px;background:var(--paper,#FFFBF3);color:var(--ink);box-shadow:0 4px 14px rgba(74,46,31,.18);border:1px solid var(--line);font-size:11.5px;line-height:1.6;white-space:normal;}
  .stl-row{display:flex;justify-content:space-between;gap:10px;}
  .stl-item.open .stl-pop{display:block;}
  @media (hover:hover){ .stl-item:hover .stl-pop{display:block;} }
  .small-line{font-size:11.5px;color:var(--ink-soft);margin:8px 0 0 !important;font-family:var(--sans) !important;line-height:1.6 !important;}
  .entry.chronicle{font-size:12px;color:var(--ink-soft);border-left:2px solid var(--line);padding-left:10px;margin:10px 0;}
  /* 16.3.6 旁白錯誤 */
  .narrator-error{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;margin-bottom:12px;
    animation:fade-in var(--t-std) var(--ease) both;}
  .narrator-error span{font-size:14px;font-family:var(--serif);}
  .narrator-error button{margin:0;padding:6px 14px;font-size:12.5px;white-space:nowrap;}
  /* 16.5 載入：空白卡片＋輪播文字＋三個呼吸閃爍小點(1.2秒一循環) */
  .loading{padding:20px;text-align:center;color:var(--ink-soft);font-size:13px;letter-spacing:1px;}
  .loading-card{padding:26px 16px;text-align:center;color:var(--ink-soft);font-size:13.5px;margin-bottom:12px;}
  .loading-card .loading-text{display:inline-block;transition:opacity var(--t-std) var(--ease);font-family:var(--serif);}
  .loading-card .loading-text.fading{opacity:0;}
  .breath{display:flex;gap:7px;justify-content:center;margin-top:12px;}
  .breath i{width:6px;height:6px;border-radius:50%;background:var(--stamp);opacity:.2;animation:breath 1.2s ease-in-out infinite;}
  .breath i:nth-child(2){animation-delay:.2s;}
  .breath i:nth-child(3){animation-delay:.4s;}
  @keyframes breath{0%,100%{opacity:.2;transform:scale(.85);}40%{opacity:1;transform:scale(1);}}

  /* 16.3.3 底部行動區(固定)。16.3.8.3（2026-09-28）：底部只留一條細列(自由輸入、送出、反悔、字數)，選項改放正文最後 */
  .actions{position:sticky;bottom:0;z-index:20;border-radius:18px 18px 0 0;border-bottom:none;padding:8px 14px calc(6px + env(safe-area-inset-bottom));}
  .choices{display:grid;grid-template-columns:1fr;gap:8px;}
  .story-choices{margin:0 0 12px;}
  @media (min-width:768px){ .choices{grid-template-columns:1fr 1fr;} } /* 手機一欄直排、電腦兩欄 */
  .choice-btn{
    text-align:left;background:rgba(255,255,255,.55);border:1px solid rgba(74,46,31,.14);border-radius:14px;
    padding:10px 12px;font-family:var(--sans);font-size:13.5px;line-height:1.45;color:var(--ink);cursor:pointer;
    transition:transform var(--t-fast) var(--ease),opacity var(--t-std) var(--ease);
  }
  .choice-btn:active{transform:scale(.97);}
  .choice-btn:disabled{opacity:.45;cursor:default;}
  .choice-btn.chosen{opacity:1;border-color:var(--stamp);}
  .choices.one-col{grid-template-columns:1fr;}
  .custom-row{display:flex;gap:8px;align-items:center;margin-top:10px;padding:0;border:none;}
  .custom-row input{
    flex:1;min-width:0;border:1px solid rgba(74,46,31,.16);border-radius:999px;background:rgba(255,255,255,.6);
    font-family:var(--sans);font-size:14px;padding:9px 14px;color:var(--ink);
  }
  .custom-row input:focus{outline:none;border-color:var(--stamp);}
  .send-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--stamp);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;transition:transform var(--t-fast) var(--ease);}
  .send-btn:active{transform:scale(.94);}
  .send-btn:disabled{opacity:.4;cursor:default;}
  .act-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11.5px;color:var(--ink-soft);min-height:18px;}
  .text-btn{background:none;border:none;padding:0;color:var(--stamp);font-size:12px;cursor:pointer;font-family:var(--sans);}
  .text-btn:disabled{opacity:.4;}
  .input-error{font-size:11.5px;color:var(--stamp);padding:4px 2px 0;display:none;}
  .ap-out{font-size:12px;color:var(--stamp);margin-bottom:8px;}

  /* 16.3.4 滑出面板(由下往上) */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(74,46,31,.22);z-index:40;opacity:0;pointer-events:none;transition:opacity 350ms var(--ease);}
  .sheet-backdrop.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:520px;max-height:82vh;overflow-y:auto;z-index:45;
    background:rgba(250,244,234,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));
    transform:translate(-50%,105%);visibility:hidden;transition:transform 350ms var(--ease),visibility 0s linear 350ms;
    box-shadow:0 -6px 24px rgba(74,46,31,.12);}
  .sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform 350ms var(--ease),visibility 0s;}
  .sheet-grip{width:38px;height:4px;border-radius:2px;background:rgba(74,46,31,.18);margin:0 auto 10px;}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .sheet-head h3{margin:0;font-size:16px;}
  .sheet-close{background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;padding:0 4px;}
  .cash-big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px;}
  .cash-lbl{font-size:12px;color:var(--ink-soft);}
  .stat-bars{margin-top:12px;display:flex;flex-direction:column;gap:9px;}
  .stat-bar{display:grid;grid-template-columns:52px 1fr 32px;align-items:center;gap:10px;font-size:13px;}
  .stat-bar .track{height:7px;border-radius:4px;background:rgba(74,46,31,.08);overflow:hidden;}
  .stat-bar .fill{height:100%;border-radius:4px;background:var(--bar);transition:width var(--t-slow) var(--ease);}
  .stat-bar .num{text-align:right;font-variant-numeric:tabular-nums;}
  /* 16.3.4數值說明（2026-09-28）：滑鼠移過去／鍵盤聚焦／手機點一下(.tip-open)時，在該列下方顯示半透明小框 */
  /* 16.3.4數值說明（2026-09-28改版）：小框浮在該列下方、不推擠版面，也不擋滑鼠(pointer-events:none)，
     看完第一項可以直接往下移到第二項；滑鼠移過去／鍵盤聚焦／手機點一下(.tip-open)時淡入 */
  .has-tip{position:relative;cursor:help;border-radius:8px;transition:background var(--t-fast) var(--ease);}
  .has-tip:focus{outline:none;}
  .stat-bar.has-tip > span:first-child,.ledger-row.has-tip .lbl,.cash-block.has-tip .cash-lbl{border-bottom:1px dotted rgba(74,46,31,.35);justify-self:start;}
  .stat-tip{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:6;pointer-events:none;
    padding:10px 12px;border-radius:12px;background:rgba(58,36,24,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    white-space:pre-line;color:#FFF8EE;font-size:12.5px;line-height:1.65;box-shadow:0 8px 22px rgba(74,46,31,.22);
    opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity var(--t-fast) var(--ease),transform var(--t-fast) var(--ease),visibility 0s linear var(--t-fast);}
  .stat-tip::before{content:"";position:absolute;top:-6px;left:22px;border:6px solid transparent;border-top:none;border-bottom-color:rgba(58,36,24,.86);}
  .stat-tip b{display:block;font-size:11px;color:#F0B9A6;font-weight:400;letter-spacing:.5px;margin-top:6px;}
  .stat-tip b:first-child{margin-top:0;}
  @media (hover:hover){ .has-tip:hover{background:rgba(255,255,255,.35);} .has-tip:hover > .stat-tip{opacity:1;visibility:visible;transform:none;transition-delay:0s;} }
  .has-tip:focus-visible > .stat-tip,.has-tip.tip-open > .stat-tip{opacity:1;visibility:visible;transform:none;transition-delay:0s;}
  .has-tip.tip-open{background:rgba(255,255,255,.35);}
  #panel-stats{padding-bottom:calc(120px + env(safe-area-inset-bottom));} /* 最後一項的說明框有地方顯示 */
  @media (prefers-reduced-motion: reduce){ .stat-tip{transition:opacity 150ms linear,visibility 0s linear 150ms;transform:none;} }
  .sheet .ledger{padding:6px 0 0;border:none;background:transparent;margin-top:10px;}
  .ledger-row{display:flex;align-items:baseline;gap:8px;font-size:13.5px;padding:3px 0;}
  .ledger-row .lbl{white-space:nowrap;color:var(--ink-soft);font-size:12.5px;}
  .ledger-row .dots{flex:1;border-bottom:1px dotted var(--line);height:10px;}
  .ledger-row .val{font-variant-numeric:tabular-nums;font-size:13px;min-width:28px;text-align:right;}
  .roster-list{display:flex;flex-direction:column;}
  .rrow{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
  .rrow:last-child{border-bottom:none;}
  .rrow .who{flex:1;min-width:0;}
  .rrow .nm{font-size:14.5px;font-weight:700;}
  .rrow .sub{font-size:12px;color:var(--ink-soft);}
  .rrow.st-fading .nm,.rrow.st-deceased .nm,.rrow.st-lost .nm{color:var(--ink-soft);}
  .rrow .dots5{flex-shrink:0;}
  .dots5{display:flex;gap:4px;}
  .dots5 i{width:8px;height:8px;border-radius:50%;background:rgba(74,46,31,.12);}
  .dots5 i.on{background:var(--stamp);}
  .dots5.faded i.on{background:var(--stamp);opacity:.38;}
  .interest-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:rgba(255,255,255,.45);}
  .interest-card.dormant{opacity:.65;}
  .interest-card .ic-head{display:flex;justify-content:space-between;align-items:baseline;}
  .interest-card .ic-level{font-size:12.5px;color:var(--stamp);}
  .interest-card .ic-track{height:6px;border-radius:3px;background:rgba(74,46,31,.12);margin:8px 0 4px;overflow:hidden;}
  .interest-card .ic-fill{display:block;height:100%;background:var(--stamp);border-radius:3px;}
  .interest-card .ic-sub{font-size:11.5px;color:var(--ink-soft);}
  .npc-dyn{font-size:12.5px;margin:6px 0;line-height:1.7;}
  .npc-dyn b{display:block;font-size:12px;color:var(--ink-soft);}
  .npc-dyn summary{cursor:pointer;color:var(--ink-soft);font-size:12px;}
  .roster-note{font-size:12px;color:var(--ink-soft);margin:2px 0 8px;}
  .menu-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .menu-card{padding:16px 14px;cursor:pointer;text-align:left;font-family:var(--sans);color:var(--ink);transition:transform var(--t-fast) var(--ease);}
  .menu-card:active{transform:scale(.97);}
  .menu-card .ic{font-size:20px;}
  .menu-card .t{font-size:14.5px;font-weight:700;margin-top:4px;}
  .menu-card .n{font-size:12px;color:var(--ink-soft);}
  .menu-sec{font-size:11.5px;color:var(--ink-soft);letter-spacing:1px;margin:18px 2px 4px;}
  .menu-item{display:block;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;color:var(--ink);text-decoration:none;}
  .menu-item.danger{color:var(--danger);border-bottom:none;margin-top:14px;}
  .menu-item.off{opacity:.45;cursor:default;} /* 回合進行中暫停的項目(切換／刪除人生) */
  .menu-note{font-size:11.5px;color:var(--ink-soft);padding:6px 2px 8px;border-bottom:1px solid var(--line);}
  .menu-note a{color:var(--stamp);cursor:pointer;text-decoration:underline;}

  /* 16.4 轉場與回饋 */
  @keyframes fade-in{from{opacity:0;}to{opacity:1;}}
  @keyframes rise-in{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @keyframes cap-pop{0%{opacity:0;transform:scale(.6);}70%{opacity:1;transform:scale(1.08);}100%{opacity:1;transform:scale(1);}}
  @keyframes dim-in{from{opacity:1;}to{opacity:.55;}}
  .anim-card{animation:rise-in 400ms var(--ease) both;}
  .anim-card p{animation:fade-in 400ms var(--ease) both;}
  .anim-card .cap{animation:cap-pop var(--t-std) var(--ease) both;}
  .anim-card .late{animation:fade-in var(--t-std) var(--ease) both;}
  .anim-collapse{animation:dim-in var(--t-std) var(--ease) both;}


  /* 十六、16.10 首頁 */
  .home{padding:0 20px 28px;}
  .home-hero{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 0 24px;}
  .home-hero.has-lives{min-height:0;padding-top:28px;} /* 有進行中的人生時，讓存檔卡片在第一個畫面就露出來 */
  .home-hero .stamp{margin-bottom:18px;}
  .home-hero h1{font-family:var(--serif);font-size:36px;letter-spacing:6px;margin:6px 0 4px;}
  .home-sub{font-size:15px;color:var(--stamp);margin:0 0 20px;letter-spacing:1px;}
  .home-lead{font-size:14.5px;line-height:2;margin:0 0 22px;}
  .home-hero .primary-btn,.home-hero .ghost-btn{width:100%;max-width:300px;}
  .home-note{font-size:12px;color:var(--ink-soft);margin-top:16px;line-height:1.7;max-width:320px;}
  .home-sec{margin:34px 0;}
  .home-sec h2{font-family:var(--serif);font-size:19px;margin:0 0 14px;letter-spacing:1px;}
  .home-sec p{font-size:15px;line-height:1.95;margin:0 0 12px;}
  .serif{font-family:var(--serif);}
  .life-card{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;margin-bottom:10px;cursor:pointer;text-align:left;color:var(--ink);font-family:var(--sans);transition:transform var(--t-fast) var(--ease);}
  .life-card:active{transform:scale(.98);}
  .stamp.mini{width:46px;height:46px;font-size:9px;border-width:1.5px;}
  .stamp.mini b{font-size:15px;}
  .lc-body{flex:1;min-width:0;display:flex;flex-direction:column;}
  .lc-name{font-size:15px;font-weight:700;}
  .lc-stage{font-size:13px;color:var(--ink-soft);}
  .lc-time{font-size:11.5px;color:var(--ink-soft);}
  .lc-arrow{color:var(--stamp);font-size:18px;}
  .home-steps{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
  .home-steps .step{padding:14px 16px;}
  .home-steps .step b{color:var(--stamp);font-family:var(--serif);font-size:16px;letter-spacing:2px;}
  .home-steps .step p{margin:4px 0 0;}
  .home-rule{text-align:center;color:var(--ink-soft);margin:18px 0;letter-spacing:4px;}
  .faq{padding:0 16px;margin-bottom:10px;}
  .faq summary{padding:14px 0;cursor:pointer;font-weight:700;font-size:15px;list-style:none;display:flex;justify-content:space-between;gap:10px;}
  .faq summary::-webkit-details-marker{display:none;}
  .faq summary::after{content:"＋";color:var(--stamp);font-weight:400;}
  .faq[open] summary::after{content:"－";}
  .faq p{font-size:14.5px;margin:0 0 12px;}
  .home-foot{text-align:center;margin:48px 0 10px;}
  .home-foot p{font-size:15px;}
  .foot-mark{font-family:var(--serif);font-size:22px;letter-spacing:8px;color:rgba(74,46,31,.22);margin-top:34px;}
  .foot-copy{font-size:11px;color:var(--ink-soft);margin-top:6px;}
  .foot-copy a{color:inherit;text-decoration:underline;text-underline-offset:2px;}
  /* 16.10.0 進站年齡確認：毛玻璃卡片浮在暖陽背景上，首頁內容在後方淡淡透出 */

  /* 十六、16.6 回憶錄時間軸 */
  .modal.memoir{padding:20px 16px;}
  .timeline{overflow-y:auto;flex:1;margin-top:4px;padding:4px 4px 4px 0;position:relative;}
  .timeline::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:rgba(200,85,61,.22);}
  .tl-node{display:flex;align-items:center;gap:12px;margin:18px 0 10px;position:relative;}
  .tl-node:first-child{margin-top:4px;}
  .tl-stamp{width:44px;height:44px;font-size:9px;border-width:1.5px;background:var(--paper);}
  .tl-stamp b{font-size:15px;}
  .tl-node-name{font-size:14.5px;font-weight:700;}
  .tl-node-sub{font-size:11.5px;color:var(--stamp);}
  .tl-item{display:flex;gap:10px;margin:0 0 10px;position:relative;}
  .tl-dot{flex:0 0 44px;display:flex;justify-content:center;padding-top:14px;}
  .tl-dot::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--stamp);opacity:.55;}
  .tl-item.major .tl-dot::before{display:none;}
  .tl-mini-stamp{width:20px;height:20px;border:1.5px solid var(--stamp);border-radius:50%;color:var(--stamp);font-size:10px;line-height:17px;text-align:center;transform:rotate(-8deg);background:var(--paper);font-family:var(--serif);}
  .tl-card{flex:1;min-width:0;padding:10px 12px;cursor:pointer;}
  .tl-item.major .tl-card{background:rgba(232,96,76,.1);}
  .tl-item.latest .tl-card{border-color:var(--stamp);}
  .tl-meta{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
  .tl-text{font-family:var(--serif);font-size:14.5px;line-height:1.75;}
  .tl-text p{margin:0 0 6px;}
  .tl-card:not(.open) .tl-text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .tl-card:not(.open) .tl-text p{display:inline;margin:0;}
  .tl-card .caps{margin-top:8px;}

  /* 十六、16.8 大學科系學生證 */
  .modal.major-pick{max-width:380px;padding:20px 18px;text-align:center;}
  .mp-title{font-size:12px;color:var(--stamp);letter-spacing:1px;}
  .major-pick h3{margin:2px 0 12px;}
  .mp-groups{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;}
  .mp-group{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:12px;border:1px solid rgba(74,46,31,.14);background:rgba(255,255,255,.5);color:var(--ink);font-size:11px;line-height:1.25;cursor:pointer;font-family:var(--sans);}
  .mp-group.on{border-color:var(--stamp);color:var(--stamp);background:rgba(200,85,61,.08);}
  .major-ic{width:22px;height:22px;}
  .sid-card{perspective:900px;height:196px;cursor:pointer;margin:0 auto;max-width:330px;}
  .sid-inner{position:relative;width:100%;height:100%;transition:transform 500ms var(--ease);transform-style:preserve-3d;}
  .sid-card.flipped .sid-inner{transform:rotateY(180deg);}
  .sid-face{position:absolute;inset:0;border-radius:14px;overflow:hidden;background:#FFFBF4;border:1px solid rgba(74,46,31,.14);box-shadow:0 6px 18px rgba(74,46,31,.12);backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:left;}
  .sid-back{transform:rotateY(180deg);}
  .sid-band{background:var(--stamp);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:13px;font-weight:700;letter-spacing:.5px;}
  .sid-no{font-variant-numeric:tabular-nums;font-weight:400;font-size:12px;opacity:.9;}
  .sid-body{display:flex;gap:14px;padding:14px;}
  .sid-photo{width:64px;height:80px;border-radius:8px;background:rgba(200,85,61,.12);color:var(--stamp);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:30px;font-weight:700;flex-shrink:0;}
  .sid-fields{margin:0;display:flex;flex-direction:column;gap:3px;font-size:12.5px;}
  .sid-fields div{display:flex;gap:8px;}
  .sid-fields dt{color:var(--ink-soft);width:52px;flex-shrink:0;}

<!-- 二、2.7真實日曆（2026-09-29）：農曆節日用現成套件lunar-javascript(MIT)，部署時要跟index.html一起上傳；沒載入時程式退回瀏覽器內建農曆 -->
<script src="lunar.min.js"></script>
<script>
const STORAGE_KEY = "life_sim_save_v1";
// 十、10.8（2026-09-29）：封測期間暫停雲端存檔(KV)——存檔、點數、人生回顧都只存在這台裝置的瀏覽器，不呼叫Worker的存檔類網址，
// 恢復金鑰畫面隱藏(金鑰仍在背景產生，當作本機存檔的編號)。版本庫預設關閉；比照USE_MOCK，測試時可用localStorage旗標
// lifegame_cloud_save="on"打開(Worker端也要打開才有作用)。正式重新打開＝這裡改true＋worker/wrangler.toml的CLOUD_SAVE_ENABLED改"true"並重新部署；
// 打開前要先完成QA手冊34.12的KV用量修正並回報每回合寫入次數(10.8第7條)。雲端相關程式碼全部保留
const CLOUD_SAVE_DEFAULT = false;
const CLOUD_SAVE_FLAG_KEY = "lifegame_cloud_save";
const CLOUD_SAVE_ENABLED = (function(){
  try{ const v = localStorage.getItem(CLOUD_SAVE_FLAG_KEY); if(v==="on") return true; if(v==="off") return false; }catch(e){}
  return CLOUD_SAVE_DEFAULT;
})();
// 十、10.1（9/19新增）：封測階段純金鑰模式——復原金鑰對應「一個玩家」，終身不變，底下最多累積3段人生
const RECOVERY_KEY_STORAGE_NAME = "life_sim_recovery_key"; // 復原金鑰快取在本機，方便同一台裝置不用每次重輸入
const ACTIVE_SLOT_STORAGE_NAME = "life_sim_active_slot"; // 記住這台裝置上次玩的是第幾段人生(0~2)
const HOME_META_PREFIX = "life_sim_home:"; // 十六、16.10.2：首頁「還沒寫完的人生」卡片用的摘要(每個slot一份，存檔時順手更新)
const MAX_LIFE_SLOTS = 3; // 【定案,十、10.1】
// 十、10.1補充（2026-09-22新增）：雲端同步狀態，純本次session的UI顯示用，不存進state/localStorage——
// {success:true,time:timestamp}表示上次saveGame()雲端同步成功、{success:false}表示失敗、null表示這個session還沒嘗試過
let cloudSyncStatus = null;
function generateRecoveryKey(){
  // 用瀏覽器內建crypto產生10 bytes(80 bits)隨機性，格式化成5組4碼英數字方便玩家抄寫核對，例如 A1B2-C3D4-E5F6-7890-1234
  const bytes = new Uint8Array(10);
  (window.crypto || crypto).getRandomValues(bytes);
  const hex = Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("");
  return hex.match(/.{1,4}/g).join("-").toUpperCase();
}
const MODEL = "claude-sonnet-5"; // 2026-09-18：舊版claude-sonnet-4-6疑似帳號無此模型存取權限（403，非404 not_found，見CHANGELOG排查記錄），改用目前最新且更便宜的Sonnet版本
const CUSTOM_INPUT_MAX_CHARS = 200; // 十、10.3.2（2026-09-23取代同日稍早的100字版本）：上限200字，標點符號也算
// 字數一律用Array.from計算（依Unicode字元，不是UTF-16長度），避免emoji等被算成2字
function countInputChars(str){ return Array.from(str||"").length; }

// ---------- 三、3.9 單回合變動上限（2026-09-25新增，【定案草稿】待使用者確認數字）----------
// AI若被玩家說服(「我中了樂透」「撿到一袋錢」)會直接在one_time_transaction回報大筆收入；stat_deltas也只有0-100總範圍。
// 上限值放進payload讓AI事先知道範圍，程式端再硬性截斷當保險。賣房(housing_choice)、遺產、離婚結算等程式管理的大額來源
// 不走one_time_transaction，不受這個上限影響
const WINDFALL_CAP_STUDENT = 50;            // 【測試參數,3.9.1】學生期(還沒有職業)單回合一次性收入合計上限，遊戲幣單位(約一個月零用錢的量級)
const WINDFALL_CAP_INCOME_MULTIPLIER = 3;   // 【測試參數,3.9.1】有工作後：月收入×3(約年終獎金的量級)
const WINDFALL_CAP_ADULT_FLOOR = 50;        // 【測試參數,3.9.1】出社會但月收入很低/為0(待業、退休)時的下限
// 【測試參數,3.9.2】stat_deltas單回合上下限。system prompt原本沒有給這三項建議幅度，比照既有attachment_shift「-5到+5」的精神訂出；
// 負向幅度略大(受傷、過勞、吵架可以一次掉比較多)，正向成長較慢。大病/慢性病走十三章程式判定，不靠這裡
const STAT_DELTA_LIMITS = { health:[-10,5], network:[-8,5], expression:[-5,5] };
function computeMaxWindfall(s){
  // 學生期判斷比照chronicleLifeStageKey()：studentStatus還沒轉為graduated/withdrawn就算學生，不看年齡
  if(s.studentStatus!=="graduated" && s.studentStatus!=="withdrawn") return WINDFALL_CAP_STUDENT;
  return Math.max(WINDFALL_CAP_ADULT_FLOOR, Math.round((s.monthlyIncome||0) * WINDFALL_CAP_INCOME_MULTIPLIER));
}
// 回傳截斷後的交易陣列與被擋下的金額；支出(負數)不受影響
function capWindfallTransactions(txs, cap){
  let remaining = cap, blocked = 0;
  const out = (txs||[]).map(tx=>{
    if(!tx || typeof tx.amount!=="number" || tx.amount<=0) return tx;
    const allowed = Math.max(0, Math.min(tx.amount, remaining));
    remaining -= allowed; blocked += tx.amount - allowed;
    return { ...tx, amount: allowed };
  });
  return { txs: out, blocked };
}
function clampStatDeltas(d){
  const out = { ...(d||{}) };
  for(const [k,[lo,hi]] of Object.entries(STAT_DELTA_LIMITS)){
    if(typeof out[k]==="number") out[k] = clamp(out[k], lo, hi);
  }
  return out;
}

// ---------- 十、10.3 行動點經濟（2026-09-23新增）----------
// 每條人生各自一個ap物件：daily=每日池、gift=禮包點、purchased=購買點(封測未開放購買，欄位先預留)、lastRefillDate=上次補點的台灣日期
const AP_DAILY_REFILL = 5;        // 【定案,10.3.5】每天補到5點，不累加
// 2026-09-30(第三批，使用者決定)：未綁信箱新人生的啟程禮25點、每台裝置只領1次(同時只能1段人生)；綁定信箱再+30點(25＋30＝55)；帳號開第2段人生再+55點。
// 25點：上學期27回合裡寒假從第20回合開始，25點用到寒假倒數第2回合，「意猶未盡」才有動機綁定；55點約一學年
const AP_UNBOUND_GIFT = 25;       // 【定案,10.3.4】未綁信箱新人生的啟程禮
const AP_BIND_BONUS = 30;         // 【定案,10.9.2】綁定信箱再領(說明文字用；實際發放在Worker)
const AP_SECOND_LIFE_GIFT = 55;   // 【定案,10.9.3】帳號第一次開第2段人生
const AP_GIFT_CLAIMS_PER_KEY = 1; // 【定案,10.3.4】每把金鑰(未綁時＝每台裝置)一輩子最多領1次
const AP_COST_PER_TURN = 1;       // 【定案,10.3.1】每回合固定扣1點，選項/自由輸入相同
const GIFT_CLAIMS_LOCAL_PREFIX = "life_sim_gift_claims:"; // Worker連不上時的本機後備計數
const ARCHIVE_LOCAL_PREFIX = "life_sim_archive:";         // 人生回顧的本機後備副本
// 【定案,10.3.5】「今天」一律換算成Asia/Taipei日期(UTC+8，無日光節約)，不直接用UTC日期；
// 封測階段暫用瀏覽器時間，開放付費前要改由伺服器判斷
function taipeiDateString(ts){
  return new Date((ts ?? Date.now()) + 8*3600*1000).toISOString().slice(0,10);
}
function newLifeAP(){
  return { daily:AP_DAILY_REFILL, gift:0, purchased:0, lastRefillDate:taipeiDateString(), giftPending:true };
}
// 舊存檔相容/防呆：沒有ap物件時補一個（不發禮包，只給當日每日池）
function ensureAP(s){
  if(!s.ap) s.ap = { daily:AP_DAILY_REFILL, gift:0, purchased:0, lastRefillDate:taipeiDateString() };
  return s.ap;
}
function totalAP(s){
  if(walletActive(s)) return (acct.wallet && acct.wallet.total) || 0; // 十、10.9.2：帳號人生的行動點＝整個帳號共用的錢包
  const ap = ensureAP(s); return ap.daily + ap.gift + ap.purchased;
}
// 十、10.10.3（2026-09-30第二版）：最近點數紀錄，記錄這條人生所有點數異動(含每回合扣點、開場)，每筆＝時間、實際最終變動、原因、結果(成功／失敗)，只留最近30筆；
// 存在存檔的state.apLog(封測期間跟著本機存檔)；測試「不扣行動點」開著時不寫入(10.3.12)。
// opts.ok===false＝失敗；opts.zero===true＝變動為0也要記(開場、失敗的回合)。舊存檔的紀錄沒有ok欄、原因可能是「新手禮包」，顯示時當成功／改稱「啟程禮」
const AP_LOG_MAX = 30;
function apLogAdd(s, type, n, opts){
  if(!s || apTestFreeActive()) return;
  if(!n && !(opts && opts.zero)) return;
  const arr = s.apLog || (s.apLog = []);
  arr.push({ t:Date.now(), d:taipeiDateString(), type, n: n||0, ok: !(opts && opts.ok===false) });
  if(arr.length > AP_LOG_MAX) arr.splice(0, arr.length - AP_LOG_MAX);
  if(type==="每日補點" && n>0) showDailyRefillToast(s);
}
// 十、10.12.5第8則：當天第一次打開遊戲、實際有補點時的短提示，幾秒後自動收起；沒補到點(餘額已達上限)時不會走到這裡
function showDailyRefillToast(s){
  try{
    if(typeof document==="undefined" || !document.body || s!==state || !state || (state.phase!=="playing" && state.phase!=="ending")) return;
    document.getElementById("refill-toast")?.remove();
    const div = document.createElement("div");
    div.id = "refill-toast";
    div.className = "book-toast";
    div.setAttribute("role","status");
    div.textContent = "撰稿人已經幫你備好今天的行動點了。";
    div.onclick = ()=>div.remove();
    document.body.appendChild(div);
    setTimeout(()=>div.remove(), 4000);
  }catch(e){}
}
// 一般回合／開場的點數紀錄：一次送出(takeTurn)只寫一筆，記實際最終變動(＝結束後餘額－扣點前餘額，扣了又退＝0；
// 送出期間伺服器端剛好跨日補點的量另外記成每日補點、不算進這一筆)，成功與否看有沒有拿到內容
// 注意(10.10.3.1)：同一帳號兩台裝置同時遊玩、或剛好碰到每日補點時，差值可能混入其他變動，查帳時要留意
function apLogTurn(s, isPrologue, totalBefore, startedAt, ok){
  if(!s || apTestFreeActive()) return;
  const refilled = (s.apLog||[]).filter(e=>e.t>=startedAt && e.type==="每日補點").reduce((a,e)=>a+e.n, 0);
  const n = totalAP(s) - totalBefore - refilled;
  apLogAdd(s, isPrologue ? "開場" : "回合", n, { ok, zero:true });
}

// 不用排程：進入遊戲或行動時發現台灣日期不同才補。只看每日池，永久池多少不影響。回傳是否有補
function refillDailyIfNeeded(s){
  if(walletActive(s)){ acctDayCheck(); return false; } // 帳號錢包的每日補點由伺服器做(當天第一次打開時)，這裡只負責「跨日了就去問一次」
  const ap = ensureAP(s);

  if(ap.lastRefillDate === today) return false;
  ap.lastRefillDate = today;
  if(ap.daily >= AP_DAILY_REFILL) return false;
  apLogAdd(s, "每日補點", AP_DAILY_REFILL - ap.daily); // 10.10.3：記實際補的數量
  ap.daily = AP_DAILY_REFILL;

}
// 扣點順序：每日池 → 禮包點 → 購買點（先用免費的，保護付費的）；回傳各池實際扣了多少，API失敗時照原樣退回
function spendAP(s, n){
  if(walletActive(s)){ // 帳號錢包：本機先照扣(畫面即時)，真正的扣點在伺服器，回應回來後以伺服器端數字為準
    const w = acct.wallet, used = { daily:0, gift:0, purchased:0, wallet:true };
    used.gift = Math.min(n, w.free); w.free -= used.gift; n -= used.gift;
    used.purchased = Math.min(n, w.purchased); w.purchased -= used.purchased;
    w.total = w.free + w.purchased; acctSaveCache();
    return used;
  }
  const ap = ensureAP(s);
  const used = { daily:0, gift:0, purchased:0 };
  for(const pool of ["daily","gift","purchased"]){
    const take = Math.min(n, ap[pool]);
    ap[pool] -= take; used[pool] = take; n -= take;
  }
  return used;
}
function refundAP(s, used){
  if(used && used.wallet){ // 扣的是帳號錢包：只退回錢包；登入已經失效(walletActive為false)就不能退進本機的點數池
    if(walletActive(s)){ const w = acct.wallet; w.free += used.daily + used.gift; w.purchased += used.purchased; w.total = w.free + w.purchased; acctSaveCache(); }
    return;
  }
  const ap = ensureAP(s);
  ap.daily += used.daily; ap.gift += used.gift; ap.purchased += used.purchased;
}

// ---------- 十、10.2／10.9.2／10.9.3 帳號系統（2026-09-30，第二批）----------
// 登入＝信箱＋6位數驗證碼；登入狀態(token)存在這台裝置，90天沒用才失效，每次使用往後延。帳號的共用錢包、人生登記(最多2段)、啟程禮份數都在Worker的Durable Object裡。
// 「帳號人生」＝這段人生的存檔裡有 s.acct={aid,lid}(帳號代號、這段人生在帳號裡的代號；轉世／世代傳承沿用同一個lid)，而且這台裝置正登入同一個帳號 →
// 行動點用帳號錢包(walletActive)。其他人生(還沒綁、或超過2段留在原復原金鑰上的)照封測規則，用各自本機的行動點。
const ACCT_TOKEN_KEY = "life_sim_account_token";
const ACCT_CACHE_KEY = "life_sim_account_cache";                 // 最近一次拿到的帳號公開資料，開頁面時先用它顯示，不用等網路
const ACCT_PENDING_REMOVE_KEY = "life_sim_acct_pending_remove";  // 沒登入時收掉的帳號人生，下次登入再通知伺服器空出格子
let acct = null; // {aid, email_masked, recovery_key, wallet:{free,purchased,total,refill_cap}, lives:[{lid,slot}], gifts:{claimed,queued,max}}
(function loadAcctCache(){
  try{ if(localStorage.getItem(ACCT_TOKEN_KEY)){ const c = JSON.parse(localStorage.getItem(ACCT_CACHE_KEY) || "null"); if(c && c.aid && c.wallet) acct = c; } }catch(e){}
})();
function acctToken(){ try{ return localStorage.getItem(ACCT_TOKEN_KEY) || ""; }catch(e){ return ""; } }
function acctHeaders(){ const h = { "Content-Type":"application/json" }; const t = acctToken(); if(t) h.Authorization = "Bearer "+t; return h; }
function acctSaveCache(){ try{ if(acct && acctToken()) localStorage.setItem(ACCT_CACHE_KEY, JSON.stringify(acct)); else localStorage.removeItem(ACCT_CACHE_KEY); }catch(e){} }
function acctSetAccount(account){ if(account && account.aid){ acct = account; acctSaveCache(); } }
function syncWallet(w){ if(acct && w){ acct.wallet = Object.assign({}, w); acctSaveCache(); } } // 複製一份：spendAP／refundAP會就地改acct.wallet，不能改到呼叫端手上那份伺服器回報
function walletActive(s){ return !!(acct && s && s.acct && s.acct.aid===acct.aid); }
function newAcctLid(){ return "l" + Date.now().toString(36) + Math.random().toString(36).slice(2,8); } // 小寫英數，跟Worker的格式檢查對得上
// 每次呼叫Worker的帳號網址：自動帶登入token；401＝登入已失效
async function acctFetch(path, body){
  let res, data = null;
  try{ res = await fetch(WORKER_URL+path, { method: body!==undefined ? "POST" : "GET", headers: acctHeaders(), body: body!==undefined ? JSON.stringify(body) : undefined }); }
  catch(e){ return { ok:false, status:0, data:null, network:true }; }
  try{ data = await res.json(); }catch(e){}
  if(res.status===401 && acctToken()) acctSessionLost();
  return { ok: !!(res.ok && data && data.success!==false), status: res.status, data };
}
// 這台裝置上所有「帳號人生」的行動點歸零(登出／登入失效時)：錢包留在帳號裡，這台裝置變回「沒登入」，這幾段人生退回本機點數池(從0開始，明天起照舊每天補5點)，
// 不會把錢包裡的點數複製一份留在本機

}
function acctClearSession(){

// 伺服器端送來的帳號事件(每日補點、啟程禮、補發、併入)：記進目前這段人生的點數紀錄；沒有可記的人生就先排隊，等進到遊戲畫面再記
let acctEventQueue = [];
function acctApplyEvents(events){
  if(!events || !events.length) return;
  events.forEach(e=>{ if(e && e.type && e.n) acctEventQueue.push({ type:e.type, n:e.n }); });
  acctFlushEvents();
}
function acctFlushEvents(){
  if(!acctEventQueue.length || !state || state.phase!=="playing" || !walletActive(state)) return;
  const list = acctEventQueue.splice(0);
  list.forEach(e=>apLogAdd(state, e.type, e.n)); // 「每日補點」在apLogAdd裡會跳第8則短提示
  try{ saveLocalOnly(); }catch(e){}
}
// 跨日後(台灣時間)向伺服器要一次最新的錢包(伺服器在當天第一次使用時補點)；每個日期只問一次，避免時鐘不一致時一直重問
let acctRefreshing = false, acctRefreshAskedDate = null;
function acctDayCheck(){
  if(!acctToken() || acctRefreshing || acctRefreshAskedDate===taipeiDateString()) return;
  refreshAccount().then(ok=>{ if(ok && state && state.phase==="playing"){ document.getElementById("ap-exhausted-modal")?.remove(); render(); } });
}
async function refreshAccount(){
  if(!acctToken() || acctRefreshing) return false;
  acctRefreshing = true; acctRefreshAskedDate = taipeiDateString();
  try{
    const r = await acctFetch("account/me");
    if(r.ok){ acctSetAccount(r.data.account); acctApplyEvents(r.data.events); await acctFlushPendingRemovals(); syncConsentToAccount(); return true; }
  } finally { acctRefreshing = false; }
  return false;
}
function acctQueueRemoval(lid){
  try{ const a = JSON.parse(localStorage.getItem(ACCT_PENDING_REMOVE_KEY) || "[]"); if(!a.includes(lid)) a.push(lid); localStorage.setItem(ACCT_PENDING_REMOVE_KEY, JSON.stringify(a)); }catch(e){}
}
async function acctFlushPendingRemovals(){
  let list = []; try{ list = JSON.parse(localStorage.getItem(ACCT_PENDING_REMOVE_KEY) || "[]"); }catch(e){}
  if(!list.length) return;
  const left = [];
  for(const lid of list){
    const r = await acctFetch("account/lives", { op:"remove", lid });
    if(r.ok) acctSetAccount(r.data.account); else if(r.status!==401) left.push(lid);
  }
  try{ localStorage.setItem(ACCT_PENDING_REMOVE_KEY, JSON.stringify(left)); }catch(e){}
}
// 這段人生結束／刪除：帳號的人生格子空出來(沒登入就先記著，下次登入再通知)
async function acctLifeRemoved(s){
  if(!s || !s.acct || !s.acct.lid) return;
  if(acct && s.acct.aid===acct.aid){
    const r = await acctFetch("account/lives", { op:"remove", lid:s.acct.lid });
    if(r.ok){ acctSetAccount(r.data.account); return; }
  }
  acctQueueRemoval(s.acct.lid);
}
// 開新人生(帳號登入中)：登記進帳號，最多2段；帳號第一次開到第2段時伺服器發第2份啟程禮(發滿就排隊)
async function acctLifeAdd(s){
  const lid = (s.acct && s.acct.lid) || newAcctLid();
  const r = await acctFetch("account/lives", { op:"add", lid });
  if(r.ok){ s.acct = { aid: r.data.account.aid, lid }; acctSetAccount(r.data.account); acctApplyEvents(r.data.events); return { ok:true }; }
  return { ok:false, status:r.status, error:r.data && r.data.error };
}

  return { ok:false, insufficient: r.status===402 };

async function paySinglePoints(s, n, reason){

async function entryHandleWaitlist(){
  if(!acct || !acct.wl) return false;
  await refreshAcctWl();
  const w = acct.wl; if(!w) return false;
  if(w.status==="waiting"){ showWaitlistWaitingNote(w.position); return true; }
  if(WL_HOLD.includes(w.status)){ showWaitlistReadyModal(!!w.gift_full); return true; }

async function entryGate(){
  if(!entryQuotaOn()) return true;
  if(acct){
    if(acct.lives && acct.lives.length>0) return true;

  return s.monthlyIncome>0 ? s.monthlyIncome : computeBasicLivingCost(s);

function purchaseAmount(s, tier, majorItem){

  return Math.max(1, Math.round(raw));
}

function settlePurchase(s, p){

// moved_out三項——這三個是auto:true(客戶端結構化判定completed)的里程碑，原本沒有「玩家明確決定不做」的skipped
// 入口，導致「不生小孩」「不買房」「不搬出家裡」在自主感管道機制上完全隱形。6.4中立性最常被引用的例子就是「不成家」。
const AUTONOMY_MILESTONES = ["marriage_decision","first_startup","first_credit_card","first_part_time_job","first_child","home_purchase","moved_out"];
// 這三項只允許AI回報skipped（明確不做），不允許回報completed（completed維持既有的客戶端結構化自動判斷不變）——
// 技術判斷：AI偵測玩家輸入裡「明確決定不生小孩/不買房/不搬出去住」等意圖後回報skipped，不影響「是否真的達成」這件事
// 仍然100%由客戶端結構化判斷把關，只是多開一個「明確不做」的旗標入口，不違反4.3「凡結構化訊號存在就不假手AI」的精神。
// 十二、12.8.3（2026-09-20新增）：first_startup同批一起改列auto:true後，比照理由補上skip-only入口，讓「明確決定不創業」仍能計入自主感
const SKIP_ONLY_MILESTONES = ["first_child","home_purchase","moved_out","first_startup"];
const INTIMATE_RELATION_RE = /配偶|伴侶|先生|太太|老公|老婆|兒子|女兒|父親|母親|爸|媽|哥|姊|姐|弟|妹/;

function happinessChannelDiminish(raw){
  // 3.8.2【定案】每條管道各自套用3.5.3的邊際遞減。3.5.3的成長式 Δ=原始Δ×(100−x)/100 連續化後
  // 封閉解為 x(t)=100(1−e^(−t/scale))，這裡直接拿它當「原始投入→管道分數」的靜態轉換：
  // 高位投入換來的分數越來越少，且永遠逼近但不撞滿100。
  if(!(raw>0)) return 0;
  return clamp(100*(1-Math.exp(-raw/HAPPINESS_CHANNEL_DIMINISH_SCALE)), 0, 100);
}
function avgAffinity(list){
  if(!list || !list.length) return 0;
  return list.reduce((a,c)=>a+(c.affinity||0),0)/list.length;
}
function computeAutonomyRaw(s){
  // 3.8.4【定案】chosen佔「已遇到的可跳過里程碑」的比例。
  // not_offered（未觸發）與unavailable（條件未達成）都不進分母——設計文件明講「一直沒遇到對象的角色則不加分」，
  // 不加分不等於扣分，若讓它們稀釋比例就變成扣分，會直接違反六、6.4中立性。
  const m = s.milestones||{};
  let chosen=0, encountered=0;
  AUTONOMY_MILESTONES.forEach(id=>{
    const st = m[id];
    if(st==="skipped"){ chosen++; encountered++; }
    else if(st==="completed" || st==="active"){ encountered++; }
  });
  // 12.5【定案】拒絕升遷記為skip_reason:chosen推高自主感（2026-09-27接上）：升遷可重複出現，整段人生合併算一項可跳過事件，
  // 遇過升遷候選即進分母、拒絕過至少一次即算chosen，避免升遷次數多寡稀釋其他里程碑
  if((s.promotionOffersEncountered||0)>0){
    encountered++;
    if((s.promotionOffersDeclined||0)>0) chosen++;
  }
  // 7.6.3（2026-09-27）：離婚後選「重新安排自己的生活」，算一項自己選的
  if(s.autonomyExtraChosen){ encountered += s.autonomyExtraChosen; chosen += s.autonomyExtraChosen; }
  if(!encountered) return AUTONOMY_NEUTRAL_DEFAULT;
  return (chosen/encountered)*100;
}
function milestoneSkipReasonFor(s, id){
  // 3.8.4【定案】skip_reason三選一。completed/active代表這條路實際走了，不屬於「跳過」，回null不記錄。
  const st = (s.milestones||{})[id];
  if(st==="skipped") return "chosen";
  if(st==="locked") return "unavailable";
  if(st==="available") return "not_offered";
  return null;
}
function refreshMilestoneSkipReasons(s){
  s.milestoneSkipReason = s.milestoneSkipReason || {};
  MILESTONE_DEFS.forEach(def=>{
    const reason = milestoneSkipReasonFor(s, def.id);
    if(reason) s.milestoneSkipReason[def.id] = reason;
    else delete s.milestoneSkipReason[def.id];
  });
}
// 3.8.2 職涯認同（2026-09-27，【測試參數】）：只用既有結構化職涯狀態換算，不另設AI欄位。
// 在職＝40＋職級×15＋年資(年,上限10)×2；經營事業＝50＋規模×10；半退休＝40；正職工作跟某張正式興趣卡對應(8.9)再＋10；其餘0
function computeCareerIdentity(s){
  let v = 0;
  if(s.careerStatus===CAREER_STATUS.EMPLOYED) v = 40 + (s.jobLevel||0)*15 + Math.min((s.tenureMonths||0)/12, 10)*2;
  else if(s.careerStatus===CAREER_STATUS.BUSINESS) v = 50 + (s.jobLevel||0)*10;
  else if(s.careerStatus===CAREER_STATUS.SEMI_RETIRED) v = 40;
  if(v>0 && s.occupationCategory && (s.interestCandidates||[]).some(c=>c.status==="active" && (INTEREST_OCCUPATION_MATCH[c.category]||[]).includes(s.occupationCategory))) v += 10;
  return clamp(v, 0, 100);
}
// 3.8.2 社團參與（2026-09-27，【測試參數】）：AI每回合回報club_activity(這回合有沒有社團/球隊/志工/讀書會等團體活動)，
// 有就＋CLUB_ENGAGEMENT_GAIN(套3.5.3邊際遞減)；連續CLUB_IDLE_TURNS回合沒有就每回合−1，比照人脈閒置衰退
const CLUB_ENGAGEMENT_GAIN = 8;
const CLUB_IDLE_TURNS = 12;
function applyClubActivity(s, active){
  if(active){
    s.clubEngagement = clamp((s.clubEngagement||0) + applyMarginalDiminish(CLUB_ENGAGEMENT_GAIN, s.clubEngagement||0), 0, 100);
    s.clubIdleStreak = 0;
  } else {
    s.clubIdleStreak = (s.clubIdleStreak||0)+1;
    if(s.clubIdleStreak>=CLUB_IDLE_TURNS) s.clubEngagement = Math.max(0, (s.clubEngagement||0)-1);
  }
}
function computeHappinessChannels(s){
  // 3.8.2【定案】五條來源管道，各自0-100、各自套用邊際遞減。
  // （2026-09-27）「社團參與」「職涯認同」已補上，見applyClubActivity()／computeCareerIdentity()
  const chars = s.characters||[];
  const intimate = chars.filter(c=>INTIMATE_RELATION_RE.test(c.relation||""));
  const others = chars.filter(c=>!INTIMATE_RELATION_RE.test(c.relation||""));
  const interests = s.interestCandidates||[];
  const topInterest = interests.length ? Math.max.apply(null, interests.map(c=>c.investment||0)) : 0;
  const finHealth = computeFinancialHealthForState(s);
  // 3.8.2（2026-09-27補上社團參與與職涯認同，使用者授權Claude全權判斷）：兩個新輸入都跟原本的同類輸入「取較高」再加權，
  // 不是額外加一項——沒參加社團、沒在工作(學生/退休/不婚不就業)的人不會因此被拉低，維持六、6.4中立性
  const raw = {
    intimacy: avgAffinity(intimate),
    belonging: (s.stats.network||0)*0.6 + Math.max(avgAffinity(others), s.clubEngagement||0)*0.4,
    selfActualization: (s.stats.knowledge||0)*0.5 + Math.max(clamp(topInterest,0,100), computeCareerIdentity(s))*0.5,
    stability: (s.stats.health||0)*0.5 + finHealth*0.5,
    autonomy: computeAutonomyRaw(s)
  };
  const out = {};
  Object.keys(raw).forEach(k=>{ out[k] = happinessChannelDiminish(raw[k]); });
  return out;
}
function computeHappinessBaseline(s){
  // 3.8.2【定案】取前三高加權，正規化0-100。第四、第五條不計入——
  // 這是六、6.4中立性的機制保證：管道數量不足本身不扣分，三條撐得夠高就跟走傳統路線的人一樣能到滿值。
  const ch = computeHappinessChannels(s);
  const sorted = Object.keys(ch).map(k=>ch[k]).sort((a,b)=>b-a).slice(0,3);
  let num=0, den=0;
  sorted.forEach((v,i)=>{ num += v*HAPPINESS_CHANNEL_TOP_WEIGHTS[i]; den += HAPPINESS_CHANNEL_TOP_WEIGHTS[i]; });
  return den ? clamp(num/den, 0, 100) : 50;
}
function happinessToneDelta(tone){
  // 3.8.3【定案】AI回傳enum以外的值，一律視為中性（增減量0），不崩潰也不憑猜測賦值
  const range = HAPPINESS_TONE_DELTA[tone];
  if(!range) return 0;
  return rnd(range[0], range[1]);
}
function applyHappiness(s, tone){
  // 3.8.4【定案,程式層禁令】這裡的輸入只有「事件結果(tone)」與「來源管道的投入回饋(baseline)」兩種，
  // 不得以「某里程碑是否達成／某狀態是否成立」作為加減條件。QA可直接靜態檢查本函式。
  s.happiness = clamp(s.happiness + happinessToneDelta(tone), 0, 100);
  s.happinessBaseline = computeHappinessBaseline(s);
  s.happinessRegressionCounter = (s.happinessRegressionCounter||0) + 1;
  if(s.happinessRegressionCounter >= HAPPINESS_REGRESSION_INTERVAL){
    s.happinessRegressionCounter = 0;
    s.happiness = clamp(s.happiness + (s.happinessBaseline - s.happiness)*HAPPINESS_REGRESSION_RATIO, 0, 100);
  }
}

// ========== 四、4.5 人生軌跡紀錄 life_trajectory（9/20新增）==========
// 【定案】每個人生階段結束時由客戶端結算一次並凍結，不可回頭修改，AI不參與結算。
// 階段切法沿用4.2.3既有定義（chronicleLifeStageKey：學生時期＋2.5七個年齡帶，共8段）
// ========== 六、6.2 性格破格里程碑（2026-09-20新增） ==========
// 【定案】判定機制沿用既有光譜位移，不另建一套：依附兩軸(anxiety/avoidance)與同儕位置(peerPosition)三條連續光譜，
// 讀的是光譜位置本身而非「原型標籤」。九種原型/類別只是內容設計分類方便，不新增獨立判定欄位。
// 【測試參數,待驗證】偏離開局基準線多遠才算「打破底色」、每條軸線終身最多觸發幾次——本節明文交給實作階段訂測試參數。
const BREAKTHROUGH_SHIFT_THRESHOLD = 30;
const BREAKTHROUGH_CAP_PER_AXIS = 2; // 呼應「每種性格傾向需預先設計至少1-2個破格時刻」，取上限值
const BREAKTHROUGH_AXIS_LABELS = {
  anxiety: { up:"焦慮軸大幅升高", down:"焦慮軸大幅下降" },
  avoidance: { up:"迴避軸大幅升高", down:"迴避軸大幅下降" },
  peerPosition: { up:"同儕位置大幅上移", down:"同儕位置大幅下移" }
};
function checkBreakthroughMilestones(s){
  // 回傳這回合是否有新的破格時刻成立（每次呼叫最多回傳一個，多軸同時達標時取第一個偵測到的，避免同一回合塞兩段加重敘事）
  s.breakthroughCountByAxis = s.breakthroughCountByAxis || {};
  s.breakthroughFiredAxes = s.breakthroughFiredAxes || {};
  const axes = [
    { key:"anxiety", baseline:s.anxietyBaseline ?? s.anxiety, current:s.anxiety },
    { key:"avoidance", baseline:s.avoidanceBaseline ?? s.avoidance, current:s.avoidance },
    { key:"peerPosition", baseline:s.peerPositionBaseline ?? s.peerPosition, current:s.peerPosition }
  ];
  let fired = null;
  axes.forEach(a=>{
    const count = s.breakthroughCountByAxis[a.key]||0;
    const diff = a.current - a.baseline;
    const overThreshold = Math.abs(diff) >= BREAKTHROUGH_SHIFT_THRESHOLD;
    if(overThreshold){
      if(!s.breakthroughFiredAxes[a.key] && count < BREAKTHROUGH_CAP_PER_AXIS){
        s.breakthroughFiredAxes[a.key] = true;
        s.breakthroughCountByAxis[a.key] = count+1;
        if(!fired) fired = { axis:a.key, direction: diff>0?"up":"down", label: BREAKTHROUGH_AXIS_LABELS[a.key][diff>0?"up":"down"] };
      }
    } else {
      // 回落到門檻內：解除「已觸發」旗標，之後若再度偏離超標視為新的一次破格（受BREAKTHROUGH_CAP_PER_AXIS總次數限制）
      s.breakthroughFiredAxes[a.key] = false;
    }
  });
  return fired;
}

const TRAJECTORY_KEY_NPC_COUNT = 3; // 4.5【定案】關係值最高的2至3位，取上限3
function spectrumSnapshot(s){
  // 依附兩軸（5.2.3/12.1.4）＋同儕位置（5.2.4）＋做事態度五條（3.7），共8個值
  const c = s.conscientiousness||{};
  return {
    anxiety: Math.round(s.anxiety||0), avoidance: Math.round(s.avoidance||0),
    peerPosition: Math.round(s.peerPosition||0),
    selfDiscipline: Math.round(c.selfDiscipline||0), prudence: Math.round(c.prudence||0),
    achievement: Math.round(c.achievement||0), responsibility: Math.round(c.responsibility||0),
    teamSolo: Math.round(c.teamSolo||0)
  };
}
function newStageAccum(s){
  return { stage: chronicleLifeStageKey(s), ageFrom: s.age, turns:0,
    happinessSum:0, peak:s.happiness, low:s.happiness,
    lowStreak:0, longestLowStreak:0, channelSums:{},
    chronicleStart:(s.chronicle||[]).length, breakthroughEvents:[] };
}
function freezeStageTrajectory(s){
  const a = s.stageAccum;
  if(!a || !a.turns) return;
  const chars = (s.characters||[]).slice().sort((x,y)=>(y.affinity||0)-(x.affinity||0));
  let dominant=null, best=-1;
  Object.keys(a.channelSums).forEach(k=>{ if(a.channelSums[k]>best){ best=a.channelSums[k]; dominant=k; } });
  s.lifeTrajectory.push({
    stage: a.stage, age_from: a.ageFrom, age_to: s.age, turns: a.turns,
    happiness_avg: +(a.happinessSum/a.turns).toFixed(1),
    happiness_peak: Math.round(a.peak), happiness_low: Math.round(a.low),
    dominant_channel: dominant,
    longest_low_streak: a.longestLowStreak,
    spectrum_snapshot: spectrumSnapshot(s),
    resume_entries: (s.chronicle||[]).slice(a.chronicleStart),
    key_npcs: chars.slice(0,TRAJECTORY_KEY_NPC_COUNT).map(c=>({ name:c.name, relation:c.relation||"", affinity:Math.round(c.affinity||0) })),
    // 六、6.2（2026-09-20實作）：checkBreakthroughMilestones()於applyResult()裡偵測到破格時刻時push進來，取代原本永遠空陣列
    breakthrough_events: a.breakthroughEvents.slice()
  });
}
function ensureStageTransition(s){
  // 四、4.5：段落邊界偵測+把上一段凍結進life_trajectory，抽出來給一般回合累計(updateLifeTrajectory)
  // 與結局前置凍結(freezeFinalLifeStageForEnding)共用，兩邊都需要「先確認目前是不是進了新階段」這一步
  s.lifeTrajectory = s.lifeTrajectory || [];
  if(!s.stageAccum) s.stageAccum = newStageAccum(s);
  const nowStage = chronicleLifeStageKey(s);
  if(nowStage !== s.stageAccum.stage){ freezeStageTrajectory(s); s.stageAccum = newStageAccum(s); }
}
function updateLifeTrajectory(s){
  // 四、4.5：一般回合(非結局)的累計，只在applyResult()裡forceEnding為false時呼叫——
  // forceEnding時的最後一段凍結改由takeTurn()呼叫AI之前的freezeFinalLifeStageForEnding()處理，
  // applyResult()不再重複凍結，避免同一段被凍結兩次
  ensureStageTransition(s);
  const a = s.stageAccum;
  a.turns++;
  a.happinessSum += s.happiness;
  if(s.happiness > a.peak) a.peak = s.happiness;
  if(s.happiness < a.low) a.low = s.happiness;
  if(s.happiness < HAPPINESS_LOW_THRESHOLD){
    a.lowStreak++;
    if(a.lowStreak > a.longestLowStreak) a.longestLowStreak = a.lowStreak;
  } else a.lowStreak = 0;
  const ch = computeHappinessChannels(s);
  Object.keys(ch).forEach(k=>{ a.channelSums[k] = (a.channelSums[k]||0) + ch[k]; });
}
function freezeFinalLifeStageForEnding(s){
  // 四、4.5（2026-09-20 b版修正）：forceEnding時，最後一段的邊界必須在AI被呼叫之前就確定並放進
  // s.lifeTrajectory，否則buildLifeSummaryMaterial()送給AI的payload只會看到前面已完結的幾段，
  // AI永遠沒機會寫到「角色死亡的那一段」，導致結局畫面最後一段永遠是空白——這是2026-09-20跑
  // 400+回合端到端測試時發現的bug，不是邊界情況，每一局都會發生。
  // 代價：這一回合本身的數值(這回合AI才要回傳的health/happiness等delta)不算進這一段的統計，
  // 只包含到上一回合為止的累積——對敘事語氣用途的人生總結而言可以接受。
  ensureStageTransition(s);
  freezeStageTrajectory(s);
  s.stageAccum = null;
}

// ========== 七、7.1.4 死亡結局的人生總結（9/20整節改版，取代ENDING_DEFINITIONS標籤計分制）==========
// 【定案】不輸出任何標籤、分數、排名。素材的挑選與排序全由客戶端從life_trajectory完成，AI只負責寫成回顧的語氣。
const SUMMARY_TONE_BANDS = [ // 7.1.4.2【定案】敘事溫度四級由happiness_avg決定；分界數字為【測試參數】
  { min:65, tone:"釋然" }, { min:45, tone:"平穩" }, { min:25, tone:"惋惜" }, { min:0, tone:"沉重" }
];
const SUMMARY_RESUME_PER_STAGE = 3;  // 7.1.4.2【待補充】每階段挑幾則履歷條目——第一輪測試值
const SUMMARY_NPC_PER_STAGE = 2;     // 7.1.4.2【待補充】每階段挑幾位角色卡——第一輪測試值
const SPECTRUM_SHIFT_THRESHOLD = 15; // 7.1.4.2【待補充】L2變化句的位移閾值——第一輪測試值
const SPECTRUM_LABELS = { anxiety:"焦慮軸", avoidance:"迴避軸", peerPosition:"同儕位置",
  selfDiscipline:"自律", prudence:"審慎", achievement:"成就傾向", responsibility:"責任感", teamSolo:"團隊vs單打獨鬥" };
const HAPPINESS_CHANNEL_LABELS = { intimacy:"親密與家庭", belonging:"友情與歸屬",
  selfActualization:"自我實現", stability:"身心安穩", autonomy:"自主感" };
function lifeStageLabel(key){
  if(key==="student") return "學生時期";
  if(key==="career_other") return "晚年";
  return key + "歲";
}
function summaryToneFor(avg){
  for(let i=0;i<SUMMARY_TONE_BANDS.length;i++){ if(avg>=SUMMARY_TONE_BANDS[i].min) return SUMMARY_TONE_BANDS[i].tone; }
  return SUMMARY_TONE_BANDS[SUMMARY_TONE_BANDS.length-1].tone;
}
function buildLifeSummaryMaterial(s){
  const traj = s.lifeTrajectory || [];
  const segments = traj.map(t=>({
    stage: t.stage, stage_label: lifeStageLabel(t.stage),
    age_from: t.age_from, age_to: t.age_to,
    tone: summaryToneFor(t.happiness_avg),
    dominant_channel: t.dominant_channel,
    dominant_channel_label: HAPPINESS_CHANNEL_LABELS[t.dominant_channel] || null,
    longest_low_streak: t.longest_low_streak,
    resume_entries: (t.resume_entries||[]).slice(0, SUMMARY_RESUME_PER_STAGE),
    key_npcs: (t.key_npcs||[]).slice(0, SUMMARY_NPC_PER_STAGE),
    breakthrough_events: t.breakthrough_events || []
  }));
  const transitions = [];
  for(let i=1;i<traj.length;i++){
    const a = traj[i-1].spectrum_snapshot || {}, b = traj[i].spectrum_snapshot || {};
    let axis=null, delta=0;
    Object.keys(SPECTRUM_LABELS).forEach(k=>{
      const d = (b[k]||0) - (a[k]||0);
      if(Math.abs(d) > Math.abs(delta)){ delta = d; axis = k; }
    });
    if(axis && Math.abs(delta) >= SPECTRUM_SHIFT_THRESHOLD){

  const scores = {
    explorer:   p.risk>=2 && sb.retry>=1 && sb.retry>=sb.pivot && sb.retry>=sb.rest ? p.risk + sb.retry*2 : 0,

// 四、4.2.2（9/19新增）：「重大失敗/成就」這類敘事判斷型履歷條目沒有結構化完成狀態可判斷，
// 呼應3.2.2 milestone精神——不由AI自行判斷次數，程式依人生階段計數擋下超額觸發
const MAJOR_EVENT_JUDGED_CAP_PER_STAGE = 2;
// 四、4.2.3（9/19新增）：L3履歷的「人生階段」切法對齊二、2.5的年齡帶定義（學生時期＋七個年齡帶，共8段），
// 不沿用timeState.stageMode（該欄位只有highschool/college/career三值，career涵蓋22-100+整段不夠細，
// 會讓「每階段上限2則」在出社會後的六七十年裡只算一次，違背分階段配額的本意）。
// 學生時期判斷依據呼應3.4.6/9.8改版，統一以studentStatus是否已轉為graduated/withdrawn為準，不看年齡
// 3.4.8/3.4.10（2026-09-27修正）：存款下限、學生開銷公式、payload is_student也改用這個判斷，不再看occupationCategory
function isStudentPhase(s){
  return s.studentStatus!=="graduated" && s.studentStatus!=="withdrawn";
}
function chronicleLifeStageKey(s){
  if(isStudentPhase(s)) return "student";
  const bucket = LIFE_STAGE_ROUND_BUDGET.find(b=>s.age>=b.minAge && s.age<=b.maxAge);
  return bucket ? `${bucket.minAge}-${bucket.maxAge}` : "career_other";
}
// ========== 十六、16.7.2.5 命運的骰子紀錄 fateRolls（2026-09-28定案）==========
// 紀錄層：重大疾病治療結果、生育嘗試、年度營運判定、裁員四類，每次判定都記(死亡、疾病是否發生、候選判定、父母健康不記)。
// 保留規則：總上限20筆、每個人生階段(四、4.5八段)最多4筆；超過時刪最不意外的(|機率−0.5|最小，同分刪較舊)。
// 花絮層：只有以小搏大(成功機率≤30%且成功、≥70%且失敗)才能寫成花絮；生育嘗試只有成功的能寫。門檻為測試參數
const FATE_ROLLS_MAX = 20;
const FATE_ROLLS_MAX_PER_STAGE = 4;
const FATE_TIDBIT_LOW = 0.30;  // 【測試參數】
const FATE_TIDBIT_HIGH = 0.70; // 【測試參數】
function fateSurprise(r){ return Math.abs((r.probability||0) - 0.5); }
function recordFateRoll(s, category, event, probability, success, resultText, isOpenCheck){
  s.fateRolls = s.fateRolls || [];
  const rec = { round: s.turnCount||0, age: s.age, stage: chronicleLifeStageKey(s), category, event: String(event||""),
    probability: Math.round(clamp(probability,0,1)*1000)/1000, success: !!success, resultText: String(resultText||""), isOpenCheck: !!isOpenCheck };
  s.fateRolls.push(rec);
  const evictFrom = (pool)=>{
    // 最不意外的先走；同樣意外刪較舊的(陣列越前面越舊)
    let worst = null;
    pool.forEach(r=>{ if(!worst || fateSurprise(r) < fateSurprise(worst)) worst = r; });
    s.fateRolls.splice(s.fateRolls.indexOf(worst), 1);
  };
  const sameStage = s.fateRolls.filter(r=>r.stage===rec.stage);
  if(sameStage.length > FATE_ROLLS_MAX_PER_STAGE) evictFrom(sameStage);
  else if(s.fateRolls.length > FATE_ROLLS_MAX) evictFrom(s.fateRolls);
  return rec;
}
function isFateTidbitEligible(r){
  if(r.category==="fertility" && !r.success) return false;
  return (r.success && r.probability<=FATE_TIDBIT_LOW) || (!r.success && r.probability>=FATE_TIDBIT_HIGH);
}
// 花絮用：最意外的前N筆以小搏大紀錄；隱藏判定的機率改成文字(不在事後揭露沒公開過的數字)
function fateTidbitCandidates(s, n){
  return (s.fateRolls||[]).filter(isFateTidbitEligible).slice().sort((a,b)=>fateSurprise(b)-fateSurprise(a)).slice(0, n||3);
}
function fateProbabilityWords(r){
  if(r.isOpenCheck) return `只有${Math.round(r.probability*100)}%的機會`;
  const p = r.probability;
  if(p<=0.1) return "幾乎沒有機會"; if(p<=0.2) return "機會很小"; if(p<=0.3) return "機會不大";
  if(p>=0.9) return "幾乎十拿九穩"; if(p>=0.8) return "把握很大"; return "看起來很有把握";
}
function shouldRecordJudgedMajorEvent(s, majorEventType){
  if(majorEventType!=="achievement" && majorEventType!=="setback") return true; // 非敘事判斷型（例如既有里程碑類），不受此上限管
  const stage = chronicleLifeStageKey(s);
  s.majorEventJudgedCountByStage = s.majorEventJudgedCountByStage||{};
  s.majorEventJudgedCountByStage[stage] = s.majorEventJudgedCountByStage[stage]||0;
  if(s.majorEventJudgedCountByStage[stage] >= MAJOR_EVENT_JUDGED_CAP_PER_STAGE) return false;
  s.majorEventJudgedCountByStage[stage]++;
  return true;
}
function rollKnowledgeRawValue(eventType, eventId, s){
  if(eventType==="ordinary" || eventType==="intensive"){
    const [lo,hi] = KNOWLEDGE_EVENT_VALUES[eventType];
    return rnd(lo,hi);
  }
  if(eventType==="milestone"){
    // 3.2.2（2026-09-27使用者同意）：「同一人生階段」改用4.2.3履歷的8段切法(chronicleLifeStageKey)，
    // 取代timeState.stageMode三段（出社會後一輩子只算2次）
    const stage = chronicleLifeStageKey(s);
    s.knowledgeMilestoneCountByStage[stage] = s.knowledgeMilestoneCountByStage[stage]||0;
    const alreadyUsed = eventId && s.knowledgeMilestoneUsedIds.includes(eventId);
    if(alreadyUsed) return 0; // ①event_id去重：同一個具體事件不重複加值
    if(s.knowledgeMilestoneCountByStage[stage] >= KNOWLEDGE_MILESTONE_CAP_PER_STAGE){
      // ②3.2.2【定案】達階段上限強制降級為intensive處理（2026-09-27修正：原本直接給0）
      const [lo,hi] = KNOWLEDGE_EVENT_VALUES.intensive;
      return rnd(lo,hi);
    }
    s.knowledgeMilestoneCountByStage[stage]++;
    if(eventId) s.knowledgeMilestoneUsedIds.push(eventId);
    const [lo,hi] = KNOWLEDGE_EVENT_VALUES.milestone;
    return rnd(lo,hi);
  }
  if(eventType==null || eventType==="") return 0; // 沒有event_type代表這回合沒有才識相關事件
  // 3.2.2【定案】enum以外的值視為異常輸入，降級為ordinary（2026-09-27修正：原本給0）
  const [lo,hi] = KNOWLEDGE_EVENT_VALUES.ordinary;
  return rnd(lo,hi);
}

// 八、興趣系統v1（9/16新增）——AI只分類(category/reaction)，候選成立/投入度/降階/下游出口一律由程式計算

const INTEREST_CANDIDATE_TO_ACTIVE_STREAK = 3; // 候選連續正向N次轉正為正式興趣卡【測試參數】
// 八、8.1（2026-09-23拍板）：候選興趣12回合(對齊四、4.1 NPC「12回合無互動降級」)、正式興趣卡24回合，取代原本6/10的暫定值
const INTEREST_CANDIDATE_FADE_TURNS = 12; // 【測試參數,待驗證】候選興趣距上次positive/neutral反應滿N回合就淡出消失
const INTEREST_ACTIVE_DORMANT_TURNS = 24; // 【測試參數,待驗證】正式興趣卡距上次positive投入滿N回合就降階為背景興趣

// 八、8.9（2026-09-27新增）興趣類別對應職業類別：每類只列1～2個，同列不分主次；刻意不對應不穩定/待業類、政治人物子女、長期不在身邊類
const INTEREST_OCCUPATION_MATCH = {
  藝術創作: ["自由/創作類"],
  手作工藝: ["自營/家庭事業類","勞力/服務類"],
  知識研究: ["受雇專業/白領類","軍公教/警消類"],
  體能競技: ["勞力/服務類","軍公教/警消類"],
  科技邏輯: ["受雇專業/白領類","勞力/服務類"],
  社交表演: ["自由/創作類","受雇專業/白領類"],
  商業交易: ["自營/家庭事業類","受雇專業/白領類"]
};
const INTEREST_HIRE_BONUS_CAP_PP = 10; // 【測試參數,8.7/12.4】上限刻意等於科系對口加成
// 對應到targetCategory的正式興趣卡(active)中投入度最高的一張；candidate/dormant不算，多張不加總（8.7）
function topMatchedActiveInterestInvestment(s, targetCategory){
  let top = 0;
  (s.interestCandidates||[]).forEach(c=>{
    if(c.status!=="active") return;
    if(!(INTEREST_OCCUPATION_MATCH[c.category]||[]).includes(targetCategory)) return;
    top = Math.max(top, c.investment||0);
  });
  return top;
}
// 8.7（2026-09-27改寫，取代原本從未被呼叫的computeInterestCareerWeightBonus()）：12.4錄取機率加成＝投入度÷10(捨去)，0～10個百分點
function computeInterestHireBonusPp(s, targetCategory){
  return Math.min(Math.floor(topMatchedActiveInterestInvestment(s, targetCategory)/10), INTEREST_HIRE_BONUS_CAP_PP);
}
// 8.1-8.2 反應三分類：正向累積朝正式興趣卡邁進／中性維持原狀／明確負向暫停或降低(不刪除)
// 8.7 下游出口：自律(僅持續投入計入)、副業契機(投入度40，三選一，見renderSideBusinessModal)
// 8.2（9/16-v2.1補充）候選興趣進度(candidateProgress)與自律連續投入計數(positiveStreak)是兩個獨立欄位：
//   candidateProgress只管candidate→active轉正，positive=+1/neutral=0/negative=-1(下限0)，單次negative不會讓進度整個消失
//   positiveStreak仍是嚴格「連續」計數，供3.7.2自律判定使用，中斷(negative)一樣重新起算，這條規則v2.1未變動
// 八、8.4【定案】興趣須能掛時間/金錢/健康/機會成本，不強制每個都有負面效果（2026-09-27補上，使用者授權Claude全權判斷，【測試參數】）：
// 時間與機會成本已經有了——考前準備期選興趣會拖累成績(3.2.4)、正式副業佔時間(8.7)。這裡補金錢與健康：
// 正向/中性投入的那一回合，依類別扣一點器材材料費(學生存款不足就不扣，比照3.4.10)，體能競技有機率小傷、科技邏輯有機率熬夜。
// 商業交易類的財務風險8.4明定另外設計，這裡不掛；知識研究類不掛(不是每個興趣都要有負面效果)
const INTEREST_COSTS = {
  藝術創作: { money:1 }, 手作工藝: { money:2 }, 體能競技: { money:1, health:{ prob:0.1, amount:3, kind:"小傷" } },
  科技邏輯: { money:1, health:{ prob:0.1, amount:2, kind:"熬夜" } }, 社交表演: { money:1 }
};
function applyInterestCost(s, interestEvent){
  s.interestCostNow = null;
  if(!interestEvent || !INTEREST_COSTS[interestEvent.category]) return;
  if(interestEvent.reaction!=="positive" && interestEvent.reaction!=="neutral") return;
  const def = INTEREST_COSTS[interestEvent.category];
  const cost = { category: interestEvent.category, money:0, health:0, kind:null };
  if(def.money && !(isStudentPhase(s) && s.cash < def.money)){ s.cash -= def.money; cost.money = def.money; noteCashEntry(s, `${interestEvent.category}花費`, -def.money); }
  if(def.health && Math.random() < def.health.prob){
    s.stats.health = clamp(s.stats.health - def.health.amount, 0, 100);
    cost.health = def.health.amount; cost.kind = def.health.kind;
  }
  if(cost.money || cost.health) s.interestCostNow = cost;
}
function applyInterestEvent(s, interestEvent, scale){ // scale：投入份量倍率(工作：副業X為0.5)，預設1
  if(!interestEvent || !interestEvent.category || !INTEREST_CATEGORIES.includes(interestEvent.category)) return;
  // 三、3.2.4（2026-09-28取代）：興趣路徑次數改由「興趣」重心累計(見advanceStructuredTime)，這裡不再計數
  if(!s.interestCandidates) s.interestCandidates = [];
  const category = interestEvent.category;
  const reaction = interestEvent.reaction; // "positive" | "neutral" | "negative"
  let card = findInterestCard(s, category);
  if(!card){
    card = {
      id: category+"_"+s.turnCount, createdTurn: s.turnCount, category, status:"candidate", investment:0, positiveStreak:0, candidateProgress:0,
      lastEngagedRound: s.turnCount, sideBusinessOffered:false, sideBusinessStatus:null,
      selfDisciplineAwarded3:false, selfDisciplineAwarded6:false
    };
    // 七、7.4.3.4（2026-10-08）人生重開丹的興趣天賦：下一世這個興趣的卡一建立就從投入度20起始
    if(s.lifeKeep && s.lifeKeep.type==="interest" && !s.lifeKeep.used && s.lifeKeep.category===category){ card.investment = 20; s.lifeKeep.used = true; }
    s.interestCandidates.push(card);
  }
  // 八、8.1（2026-09-23拍板）：candidate階段positive/neutral都算互動、重置淡出計時；
  // active階段只有positive算投入、重置降階計時，neutral不算；negative兩階段都不重置(呼應「negative反應不會重置計時」)
  if(reaction==="positive" || (reaction==="neutral" && card.status==="candidate")){
    card.lastEngagedRound = s.turnCount;
    updatePlayStyleLongestInterest(s, card); // 十六、16.2.2：長期關注＝持續最久的興趣(卡片被淡出刪除後紀錄仍保留)
  }
  if(reaction==="positive"){
    const raw = rnd(4,9); // 8.3【測試參數】原始投入值，量級比照其他成長型數值
    const grown = applyMarginalDiminish(raw*(scale==null?1:scale)*getDisciplineMultiplier(s), card.investment); // 8.3：套3.7.3自律乘數後再套邊際遞減，與才識/人脈共用同一套邊際遞減
    card.investment = clamp(card.investment+grown, 0, 100);
    card.positiveStreak++;
    card.candidateProgress = (card.candidateProgress||0) + 1; // 8.2：候選進度+1，不設上限
    if(card.status==="candidate" && card.candidateProgress>=INTEREST_CANDIDATE_TO_ACTIVE_STREAK){
      card.status="active";
      // 一、1.2.8.6（2026-09-24拍板）：興趣卡由候選正式成形，由程式比對前後狀態偵測，下一回合語氣軌套用回望軌(retrospect/low)
      s.interestFormedEventLog = { category: card.category };
    }
    if(card.status==="dormant") card.status="active"; // 8.6：久未投入後重新投入，視為喚醒
    // 3.7.2（9/16新增）自律成長：僅「持續投入」計入，由程式計數連續正向次數，非AI給值
    if(!card.selfDisciplineAwarded3 && card.positiveStreak>=SELF_DISCIPLINE_INTEREST_STREAK_1){
      s.conscientiousness.selfDiscipline = clamp(s.conscientiousness.selfDiscipline+1,0,100);
      card.selfDisciplineAwarded3 = true;
    }
    if(!card.selfDisciplineAwarded6 && card.positiveStreak>=SELF_DISCIPLINE_INTEREST_STREAK_2){
      s.conscientiousness.selfDiscipline = clamp(s.conscientiousness.selfDiscipline+1,0,100);
      card.selfDisciplineAwarded6 = true;
    }
    if(card.status==="active" && !card.sideBusinessOffered && card.investment>=INTEREST_SIDE_BUSINESS_THRESHOLD){
      card.sideBusinessOffered = true;
      s.pendingSideBusinessCardId = card.id; // 8.7：觸發一次副業契機事件，每張卡最多首次觸發一次
    }
  } else if(reaction==="negative"){
    card.positiveStreak = 0; // 連續投入中斷，自律的連續次數獎勵重新起算(3.7.2「連續」語意不變)
    card.selfDisciplineAwarded3 = false; card.selfDisciplineAwarded6 = false;
    card.candidateProgress = Math.max(0, (card.candidateProgress||0) - 1); // 8.2（9/16-v2.1）：候選進度-1，下限0，不整個歸零
    card.investment = clamp(card.investment - rnd(3,8), 0, 100); // 暫停或降低，不整個刪除
  }
  // reaction==="neutral"：不增加也不歸零，維持原狀（investment/positiveStreak/candidateProgress皆不變）
}
// 8.1/8.6：候選興趣久未互動自然淡出消失；正式興趣卡久未投入降階為背景興趣
function sweepInterestDecay(s){
  if(!s.interestCandidates) return;
  s.interestCandidates = s.interestCandidates.filter(card=>{
    const idleTurns = s.turnCount - (card.lastEngagedRound ?? s.turnCount);
    if(card.status==="candidate" && idleTurns>=INTEREST_CANDIDATE_FADE_TURNS) return false;
    if(card.status==="active" && idleTurns>=INTEREST_ACTIVE_DORMANT_TURNS) card.status="dormant";
    return true;
  });
}

  if(s.pendingParentingNode) return; // 一次只處理一個

// 7.6.3 離婚結算
// 【技術判斷】現金分割區間40%-60%由客戶端擲骰決定玩家保留比例，不交給AI決定——理由與薪資/考試分數等既有金額類禁令同源(12.13/一、1.2.6精神)
function finalizeDivorce(s, spouseName, propertyChoice, custodyChoice){
  const spouse = s.characters.find(c=>c.name===spouseName);
  if(!spouse) return;
  const playerSharePct = rnd(40,60);
  if(s.propertyValue>0){
    if(propertyChoice==="keep_other" || propertyChoice==="sell"){
      // 賣出變現後分配差額：沿用7.5.3既有的賣房轉租機制；由對方保留房產並承接房貸：玩家不取得變現金額，直接歸零
      if(propertyChoice==="sell"){ s.cash += (s.propertyValue - s.mortgageBalance); noteCashEntry(s, "賣房分配", s.propertyValue - s.mortgageBalance); }
      s.propertyValue = 0; s.mortgageBalance = 0;
      s.monthlyExpenses = s.monthlyExpenses.filter(e=>e.label!=="房貸");
      s.housing = s.housing && s.housing.type==="own" ? null : s.housing;
    }
    // keep_self：玩家保留房產並承接房貸剩餘本金，房產/房貸/housing皆維持原樣不變動
  }
  s.cash = Math.round(s.cash * (playerSharePct/100));
  s.spouseIncome = 0; s.spouseOccupationCategory = null;
  spouse.romanceStatus = "divorced";
  completeMilestone(s, "divorce"); // 4.3.1（2026-09-27）
  s.divorceRecoveryNodeAtTurn = s.turnCount + DIVORCE_RECOVERY_NODE_DELAY_TURNS; // 7.6.3（2026-09-27）：之後開放重新累積的正向節點
  // 4.1.1【定案】第1層戀愛狀態轉換含離婚，當回合必定提示（2026-09-27補上）
  s.pendingRelationshipHints = (s.pendingRelationshipHints||[]).concat([{ tier:1, text:`你和${spouse.name}，離婚了` }]);
  spouse.relation = "前配偶";
  releaseCohabiting(spouse);
  const custody = custodyChoice || "joint";
  if(custody==="non_primary"){
    // 非主要照顧者：子女隨對方生活，解除同住標記(呼應4.1.2解除時機清單)
    s.characters.filter(c=>c.isChild).forEach(releaseCohabiting);
  }
  s.custodyStatus = custody;
  // 7.6.3（2026-09-27）：監護狀態記在離婚當下的每個子女身上，之後新關係的子女不受影響
  s.characters.filter(c=>c.isChild).forEach(c=>{ c.custody = custody; });
  s.pendingDivorceSettlement = null;
  s.divorceEventLog = { spouseName, playerCashSharePct: playerSharePct, propertyChoice: propertyChoice||null, custody };
  // 7.6.4：離婚後可重新進入4.4戀愛狀態機——不需要額外代碼，applyRomanceSignal/applyMarriageDecisionCompletion
  // 本來就只認romanceStatus當下狀態，divorced不會擋住任何新對象從null重新走完整戀愛流程
}

// 七、7.3.5.5：換算給7.4.2世代傳承——已完成2個以上節點時以節點平均換算；不足2個時改用子女關係值對照5.2.2四組好感度區間取最接近的一種
function computeInheritedParentingStyle(child){
  const log = (child && child.parentingLog) || [];
  if(log.length>=2){
    const demandAvg = log.reduce((sum,e)=>sum+e.demand_delta,0)/log.length;
    const warmthAvg = log.reduce((sum,e)=>sum+e.warmth_delta,0)/log.length;
    return parentingStyleFromAxes(demandAvg, warmthAvg);
  }
  // 節點數不足2個：改以子女關係值對照PARENTING_STYLES各自的affinityRange，取最接近的一種
  const aff = (child && typeof child.affinity==="number") ? child.affinity : 50;
  let best = PARENTING_STYLES[0], bestDist = Infinity;
  PARENTING_STYLES.forEach(style=>{
    const mid = (style.affinityRange[0]+style.affinityRange[1])/2;
    const dist = Math.abs(aff-mid);
    if(dist<bestDist){ bestDist = dist; best = style; }
  });
  return best.label;
}

  BUSINESS: "創業中", SEMI_RETIRED: "半退休", RETIRED: "退休", NOT_EMPLOYED: "未就業"

// 12.3：職級語意依類別調整，自營類另看12.8經營規模不套用此表；自由/創作類另有專屬語意標籤

function jobLevelLabel(category, levelIndex){
