<!DOCTYPE html>
<!-- 十六、16.10.8 分享預覽圖og.png的原始檔(1200×630)。改文案後用瀏覽器以1200×630開啟截圖，存成專案根目錄的og.png；本檔不上傳Pages --><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;}
.bg{position:absolute;inset:0;background:#F7F0E3;overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(70px);}
.b1{width:520px;height:520px;left:-90px;top:60px;background:#E8604C;}
.b2{width:560px;height:560px;left:520px;top:300px;background:#F0A04B;}
.b3{width:460px;height:460px;right:-110px;top:-170px;background:#B9D3EA;}
.b4{width:480px;height:480px;left:-140px;bottom:-230px;background:#E3EFC5;}
.grain{position:absolute;inset:0;opacity:.55;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#4A2E1F;}
.stamp{width:150px;height:150px;border:4px solid #C8553D;border-radius:50%;color:#C8553D;transform:rotate(-8deg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:20px;line-height:1.15;}
.stamp b{font-family:"Songti TC","Noto Serif TC",serif;font-size:50px;}
h1{font-family:"Songti TC","Noto Serif TC",serif;font-size:92px;letter-spacing:18px;margin:26px 0 8px;padding-left:18px;}
p{font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:32px;color:#C8553D;letter-spacing:3px;margin:0;}
</style></head><body><div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div><div class="grain"></div></div>
<div class="c"><div class="stamp"><b>15</b>歲・起稿</div><h1>人生草稿</h1><p>這一次，換你決定要活成什麼樣子</p></div></body></html>
