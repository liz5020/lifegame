<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人生草稿</title>
<style>
  :root{
    --paper:#EDE7D9;
    --paper-card:#F6F1E4;
    --paper-dark:#E1D8C3;
    --ink:#262220;
    --ink-soft:#6b6156;
    --line:#c3b79c;
    --stamp:#9c3b2e;
    --teal:#3e6b5c;
    --gold:#93752f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
  }
  .cover{
    padding:22px 20px 14px;
    border-bottom:3px double var(--ink);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .cover h1{
    font-size:22px;
    margin:0;
    letter-spacing:2px;
    font-weight:700;
  }
  .cover .sub{
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:3px;
    margin-top:2px;
  }
  .stamp{
    border:2px solid var(--stamp);
    color:var(--stamp);
    border-radius:50%;
    width:56px;height:56px;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    transform:rotate(-8deg);
    font-size:10px;
    line-height:1.1;
    text-align:center;
    flex-shrink:0;
    opacity:.85;
  }
  .stamp b{font-size:16px;display:block;font-family:serif;}

  .ledger{
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    background:var(--paper-card);
  }
  .ledger-row{
    display:flex;align-items:baseline;gap:8px;
    font-size:14px;
    padding:3px 0;
  }
  .ledger-row .lbl{white-space:nowrap;color:var(--ink-soft);font-size:12.5px;letter-spacing:1px;}
  .ledger-row .dots{
    flex:1;border-bottom:1px dotted var(--line);
    height:10px;
  }
  .ledger-row .val{
    font-variant-numeric:tabular-nums;
    font-family:"Courier New",monospace;
    font-size:13.5px;
    min-width:28px;text-align:right;
  }
  .pips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
  .pip{width:9px;height:9px;border-radius:50%;border:1px solid var(--gold);}
  .pip.on{background:var(--gold);}

  .journal{
    flex:1;
    padding:16px 20px 8px;
  }
  .entry{margin-bottom:18px;}
  .entry .age-tag{
    font-size:11px;color:var(--stamp);letter-spacing:2px;
    border-bottom:1px solid var(--stamp);
    display:inline-block;padding-bottom:2px;margin-bottom:6px;
  }
  .entry p{margin:0 0 10px;font-size:15.5px;line-height:1.7;}
  .entry p:last-child{margin-bottom:0;}
  .entry.chronicle{
    font-family:"Noto Sans TC",sans-serif;
    font-size:12px;color:var(--ink-soft);
    border-left:2px solid var(--line);
    padding-left:10px;margin:10px 0;
  }

  .choices{padding:6px 20px 4px;}
  .choice-btn{
    display:block;width:100%;text-align:left;
    background:none;border:none;border-bottom:1px solid var(--line);
    padding:10px 4px 10px 22px;position:relative;
    font-family:"Noto Serif TC",serif;font-size:15px;color:var(--ink);
    cursor:pointer;
  }
  .choice-btn:before{
    content:"○";position:absolute;left:0;top:10px;color:var(--teal);
  }
  .choice-btn:active{background:var(--paper-dark);}
  .choice-btn:disabled{opacity:.4;}

  .custom-row{
    display:flex;gap:8px;padding:14px 20px 18px;
    border-bottom:1px solid var(--line);
  }
  .custom-row input{
    flex:1;border:none;border-bottom:1px solid var(--ink-soft);
    background:transparent;font-family:"Noto Serif TC",serif;
    font-size:14.5px;padding:6px 2px;color:var(--ink);
  }
  .custom-row input:focus{outline:none;border-bottom:1px solid var(--stamp);}
  .custom-row button{
    border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    font-family:"Noto Serif TC",serif;font-size:13px;
    padding:6px 14px;cursor:pointer;
  }
  .custom-row button:disabled{opacity:.4;}
  .hint{font-size:11px;color:var(--ink-soft);padding:0 20px 14px;}

  .roster{
    padding:14px 20px 20px;
    border-top:1px solid var(--line);
  }
  .roster-title{font-size:12px;letter-spacing:2px;color:var(--ink-soft);margin-bottom:8px;}
  .roster-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
  .rcard{
    flex:0 0 auto;width:118px;
    background:var(--paper-card);border:1px solid var(--line);
    padding:8px 10px;font-size:11.5px;
  }
  .rcard.bg{opacity:.45;}
  .rcard .name{font-size:13px;font-weight:700;margin-bottom:2px;}
  .rcard .rel{color:var(--ink-soft);margin-bottom:6px;}
  .rcard .aff-bar{height:4px;background:var(--paper-dark);}
  .rcard .aff-fill{height:100%;background:var(--stamp);}

  .footer-actions{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 20px 18px;font-size:11px;color:var(--ink-soft);
  }
  .footer-actions a{color:var(--ink-soft);text-decoration:underline;cursor:pointer;}

  .center-screen{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:30px 24px;text-align:center;
  }
  .center-screen h2{font-size:20px;margin-bottom:14px;letter-spacing:1px;}
  .roll-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0;
    text-align:left;
  }
  .roll-item{border:1px solid var(--line);padding:10px 12px;background:var(--paper-card);}
  .roll-item .k{font-size:11px;color:var(--ink-soft);letter-spacing:1px;}
  .roll-item .v{font-size:20px;font-family:"Courier New",monospace;}
  .primary-btn{
    background:var(--ink);color:var(--paper);border:none;
    padding:12px 28px;font-size:15px;letter-spacing:2px;
    font-family:"Noto Serif TC",serif;cursor:pointer;margin-top:10px;
  }
  .ghost-btn{
    background:none;border:1px solid var(--ink-soft);color:var(--ink);
    padding:10px 22px;font-size:13px;letter-spacing:1px;
    font-family:"Noto Serif TC",serif;cursor:pointer;margin-top:10px;
  }
  .loading{
    padding:20px;text-align:center;color:var(--ink-soft);font-size:13px;
    letter-spacing:1px;
  }
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(38,34,32,.55);
    display:flex;align-items:center;justify-content:center;z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--paper-card);max-width:340px;width:100%;
    padding:24px 22px;border:2px double var(--ink);
  }
  .modal h3{margin-top:0;font-size:17px;}
  .modal p{font-size:13.5px;color:var(--ink-soft);}
  .modal .demo-note{font-size:11px;color:var(--stamp);margin-top:10px;}
  .end-title{font-size:24px;margin:6px 0 4px;color:var(--stamp);}
</style>
</head>
<body>
<div id="app"><div class="loading">開卷中…</div></div>

<script>
const STORAGE_KEY = "life_sim_save_v1";
const MODEL = "claude-sonnet-4-6";

const STAGE_LABELS = [
  [0,14,"孩提"],[15,17,"高中"],[18,22,"大學／技職"],
  [23,29,"初入社會"],[30,45,"職涯發展"],[46,60,"中年"],[61,200,"老年"]
];
function stageLabel(age){
  for(const [a,b,label] of STAGE_LABELS){ if(age>=a && age<=b) return label; }
  return "人生";
}
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[rnd(0,arr.length-1)]; }

let state = null;

async function loadGame(){
  try{
    const r = await window.storage.get(STORAGE_KEY, false);
    if(r && r.value){ state = JSON.parse(r.value); render(); return; }
  }catch(e){ /* no save yet */ }
  state = null;
  render();
}
async function saveGame(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
  catch(e){ console.warn("save failed", e); }
}

const PARENTING_STYLES = [
  { label:"威權高壓",
    parentTrait:"要求嚴格、少誇獎、講求規矩", affinityRange:[35,55] },
  { label:"民主開放",
    parentTrait:"願意溝通、給空間、支持你的決定", affinityRange:[60,80] },
  { label:"放任不管",
    parentTrait:"忙於自己的事、很少過問，像室友多過像家長", affinityRange:[45,65] },
  { label:"情感疏忽",
    parentTrait:"報喜不報憂、情感表達少、常常心不在焉", affinityRange:[25,45] }
];
const PARENT_OCCUPATIONS = [
  { label:"自營業者", trait:"自己做生意，家裡常聊到生意上的事" },
  { label:"白領上班族", trait:"朝九晚五，偶爾加班，話題常繞著公司" },
  { label:"勞力/服務業", trait:"工時不固定，體力活，回家常喊累" },
  { label:"待業中", trait:"目前沒有固定工作，家裡氣氛偶爾緊繃" },
  { label:"長期不在身邊", trait:"因工作長期在外地或國外，聚少離多" },
  { label:"自由接案", trait:"收入不穩定，工作時間彈性但常常在忙" },
  { label:"軍公教警消", trait:"作息規律，重紀律，偶爾提起工作上的責任" },
  { label:"政治人物", trait:"公眾人物，家裡常有外人不太自然的關注" }
];
const SIBLING_RELATIONS = ["哥哥","姊姊","弟弟","妹妹"];
const SIBLING_TRAITS = ["競爭心強，什麼都要比一下","很罩你，關鍵時刻挺你","各過各的，感情普通但不差","話不多，但需要時找得到人"];
const SIBLING_NAMES = ["阿翔","小雨","家豪","詩涵","柏勳","佳蓉","彥廷","雨潔"];

function rollAttachmentBaseline(styleLabel){
  let anxiety = rnd(30,70), avoidance = rnd(30,70);
  switch(styleLabel){
    case "威權高壓": anxiety+=rnd(0,15); avoidance+=rnd(0,10); break;
    case "情感疏忽": anxiety+=rnd(5,20); avoidance+=rnd(5,15); break;
    case "放任不管": avoidance+=rnd(5,15); break;
    case "民主開放": anxiety-=rnd(5,15); avoidance-=rnd(5,15); break;
    case "隔代教養": avoidance+=rnd(0,10); break;
    case "服刑家長": anxiety+=rnd(5,15); avoidance+=rnd(5,15); break;
  }
  return { anxiety: clamp(anxiety,0,100), avoidance: clamp(avoidance,0,100) };
}
function rollPeerPosition(){ return rnd(20,100); }
function peerPositionLabel(v, special){
  if(special) return special;
  if(v<=35) return "獨行俠";
  if(v<=55) return "邊緣觀察者";
  if(v<=75) return "小圈子黏著者";
  return "核心人氣圈";
}
function rollKeyEvent(familyRuptureApplied){
  if(Math.random()>=0.30) return null;
  const pool = ["反覆遷徙","社交創傷","早熟的責任","意外的高光時刻"];
  if(!familyRuptureApplied) pool.push("家庭斷裂");
  return pick(pool);
}
function applyKeyEvent(type, obj){
  switch(type){
    case "家庭斷裂":
      obj.anxiety = clamp(obj.anxiety+rnd(10,20),0,100);
      obj.avoidance = clamp(obj.avoidance+rnd(10,20),0,100);
      break;
    case "反覆遷徙":
      obj.peerPosition = clamp(obj.peerPosition-rnd(15,25),0,100);
      break;
    case "社交創傷":
      if(Math.random()<0.5) obj.avoidance = clamp(obj.avoidance+rnd(10,20),0,100);
      else obj.anxiety = clamp(obj.anxiety+rnd(10,20),0,100);
      break;
    case "早熟的責任":
      obj.peerPositionSpecial = "照顧者型";
      obj.avoidance = clamp(obj.avoidance+rnd(5,12),0,100);
      break;
    case "意外的高光時刻":
      obj.anxiety = clamp(obj.anxiety-rnd(8,15),0,100);
      obj.avoidance = clamp(obj.avoidance-rnd(8,15),0,100);
      break;
  }
}

const PERSONALITY_STYLES = ["陽光開朗型","溫柔婉約型","天真爛漫型","高冷神秘型","幹練俐落型","幽默風趣型"];
function rollEconomicTier(){
  const r = rnd(1,100);
  if(r<=30) return { tier:"清寒", network:rnd(15,35), allowance:rnd(300,800), savings:rnd(200,1000) };
  if(r<=80) return { tier:"小康", network:rnd(30,55), allowance:rnd(1500,3000), savings:rnd(1000,3000) };
  return { tier:"富裕", network:rnd(50,75), allowance:rnd(5000,9000), savings:rnd(3000,8000) };
}
function rollSocialStart(biasStyle, peerPosVal){
  let base = 50;
  if(biasStyle==="民主開放") base+=10;
  if(biasStyle==="情感疏忽") base-=10;
  if(peerPosVal>=76) base+=8;
  if(peerPosVal<=35) base-=8;
  return clamp(base+rnd(-8,8),0,100);
}
function computeFinancialHealth(savings, monthlyIncome){
  const savingsScore = savings<100000 ? (savings/100000)*40 : savings<3000000 ? 40+((savings-100000)/2900000)*35 : 75+Math.min(25,(savings-3000000)/200000);
  const incomeScore = monthlyIncome<40000 ? (monthlyIncome/40000)*40 : monthlyIncome<100000 ? 40+((monthlyIncome-40000)/60000)*35 : 75+Math.min(25,(monthlyIncome-100000)/20000);
  return clamp(Math.round(savingsScore*0.5+incomeScore*0.5),0,100);
}

function newRoll(carry, identity){
  // 第一步：家庭結構
  const familyStructure = weightedPick([
    ["雙親同住",55],["單親－離異",15],["單親－喪親",8],["隔代教養",12],["一方服刑中",10]
  ]);
  const familyRuptureApplied = ["單親－離異","單親－喪親","一方服刑中"].includes(familyStructure);

  const turnCount = 0;
  const characters = [];
  let isPoliticianChild = false;
  const presentParentStyles = [];

  function addNormalParent(relationLabel){
    const occ = pick(PARENT_OCCUPATIONS);
    if(occ.label==="政治人物") isPoliticianChild = true;
    const style = pick(PARENTING_STYLES);
    presentParentStyles.push(style.label);
    const aff = clamp(rnd(style.affinityRange[0],style.affinityRange[1]) + rnd(-8,8), 0, 100);
    characters.push({
      name: relationLabel==="父親" ? "爸爸" : "媽媽",
      relation: relationLabel,
      traits: style.parentTrait + "；" + occ.trait,
      affinity: aff, summary:"", lastTurn:turnCount, active:true, isChild:false
    });
  }

  // 第二步：家長職業（在addNormalParent裡一併骰）+ 建立角色卡（依家庭結構決定有誰）
  if(familyStructure==="雙親同住"){
    addNormalParent("父親"); addNormalParent("母親");
  } else if(familyStructure==="單親－離異" || familyStructure==="單親－喪親"){
    addNormalParent(pick(["父親","母親"]));
  } else if(familyStructure==="隔代教養"){
    const gp = pick([["阿公","爺爺"],["阿嬤","奶奶"]]);
    presentParentStyles.push("隔代教養");
    characters.push({
      name: gp[0], relation: gp[1],
      traits:"疼愛藏在生活提醒裡，用詞偏舊式，很少直接過問交友或行程",
      affinity: rnd(55,75), summary:"", lastTurn:turnCount, active:true, isChild:false
    });
  } else if(familyStructure==="一方服刑中"){
    const incarcerated = pick(["父親","母親"]);
    addNormalParent(incarcerated==="父親" ? "母親" : "父親");
    presentParentStyles.push("服刑家長");
    characters.push({
      name: incarcerated==="父親" ? "爸爸" : "媽媽",
      relation: incarcerated+"（服刑中）",
      traits:"透過書信或有限探視保持聯繫，內容報喜不報憂，關係停留在某個時間點",
      affinity: rnd(30,50), summary:"", lastTurn:turnCount, active:true, isChild:false
    });
  }

  // 第三步：家境（若鎖定政治世家則跳過獨立骰）—— 財富改真實金額制
  let economicTier, network, allowance, savings;
  if(isPoliticianChild){
    economicTier="富裕"; network=rnd(65,85); allowance=rnd(6000,10000); savings=rnd(4000,9000);
  } else {
    const r = rollEconomicTier();
    economicTier=r.tier; network=r.network; allowance=r.allowance; savings=r.savings;
  }

  const wisdom = rnd(30,70); // 智慧（原天資，隱藏，終身固定）
  const logicAbility = clamp(Math.round(wisdom*0.3 + rnd(-10,10)), 0, 100); // 邏輯能力（隱藏，可成長）
  const talent = clamp(Math.round(wisdom*0.6 + rnd(-5,5)), 0, 100); // 才識（可見，取代原「學識」）
  const health = rnd(45,90);
  const looks = rnd(20,90); // 顏值（隱藏子項，純隨機，天花板低）
  const luckHidden = +(0.85 + Math.random()*0.3).toFixed(2);
  const lifeExpectancy = rnd(70,88);

  // 第五步：依附風格（兩軸，弱相關於教養風格）
  const biasStyle = presentParentStyles.length ? pick(presentParentStyles) : null;
  let { anxiety, avoidance } = rollAttachmentBaseline(biasStyle);
  if(familyRuptureApplied){
    anxiety = clamp(anxiety+rnd(10,20),0,100);
    avoidance = clamp(avoidance+rnd(10,20),0,100);
  }

  // 第六步：同儕位置
  let peerPosition = rollPeerPosition();
  let peerPositionSpecial = null;

  // 第七步：關鍵事件（家庭斷裂若已由結構觸發，事件池排除）
  const keyEventType = rollKeyEvent(familyRuptureApplied);
  if(keyEventType){
    const tmp = { anxiety, avoidance, peerPosition, peerPositionSpecial };
    applyKeyEvent(keyEventType, tmp);
    anxiety=tmp.anxiety; avoidance=tmp.avoidance; peerPosition=tmp.peerPosition; peerPositionSpecial=tmp.peerPositionSpecial;
  }

  const expression = rollSocialStart(biasStyle, peerPosition); // 表達力起點（不跟智慧掛勾）
  const temperament = rollSocialStart(biasStyle, peerPosition); // 氣質起點（後天為主，會成長）
  const appearance = clamp(Math.round(looks*0.5+temperament*0.5),0,100);
  const personalityStyle = pick(PERSONALITY_STYLES);
  const conscientiousness = { selfDiscipline:50, prudence:50, achievement:50, responsibility:50, teamSolo:50 };

  // 手足（獨立骰，不受以上影響）
  const sibRoll = rnd(1,100);
  const sibCount = sibRoll<=40 ? 0 : sibRoll<=80 ? 1 : 2;
  for(let i=0;i<sibCount;i++){
    characters.push({
      name: pick(SIBLING_NAMES), relation: pick(SIBLING_RELATIONS),
      traits: pick(SIBLING_TRAITS), affinity: rnd(45,75),
      summary:"", lastTurn:turnCount, active:true, isChild:false
    });
  }

  return {
    version:4, phase:"setup",
    name: identity?.name || carry?.name || "無名氏",
    gender: identity?.gender || carry?.gender || "男",
    age:15, lifeExpectancy, luckHidden,
    family: economicTier, familyStructure, isPoliticianChild,
    collegeLocation: null,
    timeState: { stageMode:"highschool", segmentIndex:0, yearInStage:1, careerYear:1, careerHalf:0 },
    anxiety, avoidance, peerPosition, peerPositionSpecial,
    keyEvent: keyEventType ? { type:keyEventType, revealed:false } : null,
    wisdom, logicAbility, looks, temperament, appearance, personalityStyle, conscientiousness,
    stats:{ health:clamp(health+(carry?.health||0),0,100),
            knowledge:clamp(talent+(carry?.knowledge||0),0,100),
            network:clamp(network+(carry?.network||0),0,100),
            expression:clamp(expression+(carry?.expression||0),0,100) },
    savings: savings + (carry?.savingsCarry||0),
    monthlyIncome: allowance,
    monthlyExpenses: [],
    occupationCategory: null,
    housing: null,
    fertilityJourney: null,
    lowHealthStreak: 0,
    riskyLifestyle: false,
    deathForeshadowed: false,
    happiness:50,
    actionPoints:20, maxActionPoints:20,
    turnCount,
    characters,
    chronicle: carry?.chronicleCarry ? [carry.chronicleCarry] : [],
    log:[],
    choices:[],
    reincarnations: carry?.reincarnations || 0,
    undosLeft:3,
    snapshot:null,
    ending:null
  };
}

const SEGMENT_LABELS = ["上學期・開學初","上學期・期中","上學期・期末","寒假","下學期・開學初","下學期・期中","下學期・期末","暑假"];
function computeTimeLabel(s){
  const mode = s.timeState.stageMode;
  if(mode==="highschool"){
    const yr = ["高一","高二","高三"][clamp(s.timeState.yearInStage,1,3)-1];
    return yr+"・"+SEGMENT_LABELS[s.timeState.segmentIndex];
  }
  if(mode==="college"){
    const yrIdx = clamp(s.timeState.yearInStage,1,4)-1;
    const yr = ["大一","大二","大三","大四"][yrIdx];
    let label = yr+"・"+SEGMENT_LABELS[s.timeState.segmentIndex];
    if(yrIdx===3 && s.timeState.segmentIndex>=4) label += "（畢業倒數）";
    return label;
  }
  if(mode==="career" && s.age<=29){
    return `入職第${s.timeState.careerYear}年・${s.timeState.careerHalf===0?"上半年":"下半年"}`;
  }
  return `${s.age}歲`;
}
function detectTimeSkipIntent(actionText){
  return /跳過|直接|快轉|之後|畢業後|下學期|寒假|暑假|一段時間後|過了/.test(actionText||"");
}
function advanceStructuredTime(actionText){
  const s = state;
  const mode = s.timeState.stageMode;
  const skip = detectTimeSkipIntent(actionText);
  if(mode==="highschool" || mode==="college"){
    const fromLabel = computeTimeLabel(s);
    const jump = skip ? rnd(2,4) : 1;
    let idx = s.timeState.segmentIndex + jump;
    let yearsToAdd = 0;
    while(idx>=8){ idx-=8; yearsToAdd++; }
    s.timeState.segmentIndex = idx;
    if(yearsToAdd>0){
      s.age += yearsToAdd;
      s.timeState.yearInStage += yearsToAdd;
      if(mode==="highschool" && s.timeState.yearInStage>3){
        s.timeState.stageMode="college"; s.timeState.yearInStage=1;
      } else if(mode==="college" && s.timeState.yearInStage>4){
        s.timeState.stageMode="career"; s.timeState.careerYear=1; s.timeState.careerHalf=0;
      }
    }
    return { bigJump: jump>1, fromLabel, toLabel: computeTimeLabel(s), monthsCrossed: Math.round(jump*1.5) };
  }
  if(mode==="career" && s.age<=29){
    const fromLabel = computeTimeLabel(s);
    const jump = skip ? 2 : 1;
    let half = s.timeState.careerHalf + jump;
    let yearsToAdd = 0;
    while(half>=2){ half-=2; yearsToAdd++; }
    s.timeState.careerHalf = half;
    if(yearsToAdd>0){ s.age += yearsToAdd; s.timeState.careerYear += yearsToAdd; }
    return { bigJump: jump>1, fromLabel, toLabel: computeTimeLabel(s), monthsCrossed: jump*6 };
  }
  return { bigJump:false, fromLabel:null, toLabel:null, monthsCrossed:0 };
}

function activeCharacters(){
  return state.characters.filter(c=>c.active);
}
function demoteStaleCharacters(){
  const THRESHOLD=12;
  state.characters.forEach(c=>{
    if(c.active && (state.turnCount - c.lastTurn) > THRESHOLD) c.active=false;
  });
}

- 【依附風格 attachment_axes：焦慮軸 anxiety、迴避軸 avoidance，各0-100】：這是貫穿全程的敘事語氣濾鏡，不是某個時間點要「揭露」的資訊——玩家每一句內心話、每一次反應的預設方式都被這兩軸底色染過，但永遠不要用「焦慮」「迴避」「依附」這類詞彙直接講給玩家聽，只能透過語氣、選擇的猶豫程度、對親密/衝突情境的反應方式去呈現。數值越低代表這個軸越健康／越不明顯。
- 【同儕位置 peer_position：獨行俠／邊緣觀察者／小圈子黏著者／核心人氣圈／照顧者型】：這條適合在遊戲很早期（turn數很小、還在高中階段）透過「進教室」「分組」這類社交情境自然帶出，之後才視情況再提；一樣不要直接講出分類名稱本身，要用行為描寫（誰主動找誰說話、你習慣坐哪裡、下課都在做什麼）去呈現。
- 【人格魅力風格 personality_style】：這是玩家的人設風格標籤（陽光開朗/溫柔婉約/天真爛漫/高冷神秘/幹練俐落/幽默風趣），與性別脫鉤，任何性別都可以是任何風格，用行為/說話方式自然呈現，不要直接說出標籤名稱。
- 【做事態度光譜 conscientiousness：自律/審慎/成就傾向/責任感/團隊vs單打獨鬥，各0-100】：這是行為模式的慣性，不是情緒濾鏡，主要影響選項的傾向性描述，不強求每次都伴隨強烈情緒；開局都是中性50分，完全靠學生時期起的具體選擇（準時交作業、多想想再決定、力求更好、對承諾的實踐、找人合作或自己扛）慢慢累積偏向。可以透過 conscientiousness_shift 回傳小幅位移（-3到+3，多數回合是0）。
- 【家庭結構 family_structure】：決定了通訊錄裡實際有誰（雙親／單親／隔代／服刑一方），active_characters 裡每個家人角色卡的 relation 跟 traits 已經反映了這個結構，你只需要順著這些角色卡的設定去寫互動，語氣要符合各自的關係質地（例如服刑家長的互動應該透過書信/有限探視，不是日常對話；隔代教養的語氣要有世代感）。
- 【關鍵事件 key_event】：如果 key_event 不是 null 且 already_revealed 是 false，找一個貼合當下情境（例如社交場合、壓力情境、感情衝突）的時機，透過一段簡短插敘/回憶帶出這個事件的「一角」，不解釋完整前因後果，讓玩家自己拼湊；一旦你在某回合這樣帶出過，把 revealed_key_event 設為 true（之後不用每次強調，偶爾呼應即可）。如果 key_event 是 null，完全不用管這件事。
- 【政治世家隱藏設定 is_politician_child_hidden_flag】：如果為 true，可以偶爾（不用每次，稀疏一點）讓某個配角對玩家的姓氏或背景表現出一閃而過的反常反應（愣一下、換話題、態度突然過度客氣），完全不要說出原因，讓玩家自己拼湊；如果為 false，完全不要做這件事。
- 【attachment_shift 與 peer_position_shift】：請根據玩家這回合行動/選擇的性質，回傳小幅度的位移（-5到+5之間，多數回合應該是0或很小的個位數，只有真正戲劇性的情節才給較大位移）。這是長期累積才會讓人真正改變的機制，不要每回合都給非零數值，也不要暴衝。
- 使用 player_name 稱呼玩家本人（旁白內文可直接用「你」，但其他角色對話中應該會叫玩家的名字），並依 gender 使用正確的代名詞。
- major_event_summary：只有在發生「值得長期記住的重大事件」時才填寫（10-20字精簡摘要），否則設為 null。這會被存進「人生大事記」長期提供給你當背景記憶，所以要精簡扼要。
- choices：給3到4個簡短（不超過12個字）、彼此方向不同的具體行動選項。

function computeAccidentRiskHint(s){
  if(s.age<19) return "未滿19歲，規則上絕對不會觸發";
  let risk = 0;
  if(s.stats.health<30) risk+=2; else if(s.stats.health<50) risk+=1;
  if(s.riskyLifestyle) risk+=2;
  if(risk>=3) return "高";
  if(risk>=1) return "低到中";
  return "極低";
}

const WORKER_URL = "https://life-game.smile80275.workers.dev/";

async function callAI(actionText, forceEnding, timeCtx){
  let res;
  try{
    res = await fetch(WORKER_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1400,
        system: buildSystemPrompt(),
        messages: [{ role:"user", content: buildUserMessage(actionText, forceEnding, timeCtx) }]
      })
    });
  }catch(networkErr){
    throw new Error("網路請求失敗："+networkErr.message);
  }

  let text;
  try{ text = await res.text(); }
  catch(readErr){ throw new Error("讀取回應內容失敗："+readErr.message); }

  if(!text || text.trim().length===0){
    const ct = res.headers.get("content-type");
    throw new Error("收到空白回應（HTTP "+res.status+" "+res.statusText+"，content-type: "+ct+"，長度: "+text.length+"）");
  }

  let data;
  try{ data = JSON.parse(text); }
  catch(parseErr){ throw new Error("回應不是合法JSON（HTTP "+res.status+"）內容前200字：「"+text.slice(0,200)+"」"); }

  if(!res.ok){
    throw new Error("API錯誤 "+res.status+"："+(data?.error?.message||JSON.stringify(data)));
  }
  if(data.error){
    throw new Error("API錯誤："+data.error.message);
  }
  const textBlock = (data.content||[]).find(b=>b.type==="text");
  if(!textBlock){
    throw new Error("回應裡沒有文字內容："+JSON.stringify(data).slice(0,200));
  }
  let raw = textBlock.text.trim();
  raw = raw.replace(/^```json\s*/i,"").replace(/^```\s*/,"").replace(/```\s*$/,"");
  try{
    return JSON.parse(raw);
  }catch(jsonErr){
    throw new Error("JSON解析失敗："+jsonErr.message+" ｜ 原始內容前200字："+raw.slice(0,200));
  }
}

function weightedPick(pairs){
  const total = pairs.reduce((s,p)=>s+p[1],0);
  let r = Math.random()*total;
  for(const [val,w] of pairs){ if(r<w) return val; r-=w; }
  return pairs[0][0];
}
function pickAgeAdvance(age){
  if(age<=18) return weightedPick([[0,7],[1,3]]);
  if(age<=29) return weightedPick([[0,4],[1,6]]);
  if(age<=45) return weightedPick([[1,5],[2,5]]);
  return weightedPick([[2,5],[3,3],[4,2]]);
}

  if(/累|病|睡|健康|運動|休息|養生/.test(t)) return "health";
  return null;
}

  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]]; }
  return a;

function snapshotForUndo(){
  state.snapshot = JSON.parse(JSON.stringify({
    age:state.age, stats:state.stats, happiness:state.happiness,
    actionPoints:state.actionPoints, turnCount:state.turnCount,
    characters:state.characters, chronicle:state.chronicle,
    log:state.log, choices:state.choices,
    anxiety:state.anxiety, avoidance:state.avoidance,
    peerPosition:state.peerPosition, peerPositionSpecial:state.peerPositionSpecial,
    keyEvent:state.keyEvent, timeState:state.timeState, collegeLocation:state.collegeLocation
  }));
}
function applySnapshot(){
  if(!state.snapshot) return;
  Object.assign(state, JSON.parse(JSON.stringify(state.snapshot)));
}
function restoreUndo(){
  if(!state.snapshot) return;
  applySnapshot();
  state.undosLeft -= 1;
  state.snapshot = null;
  saveGame(); render();
}

async function takeTurn(actionText, cost){
  if(state.phase!=="playing") return;
  if(state.actionPoints < cost){ renderPaywall(); return; }
  snapshotForUndo();
  state.actionPoints -= cost;
  state.turnCount += 1;

  const turnStartAge = state.age;
  let timeCtx = { structured:false, label:null, jump:null, monthsCrossed:0 };
  if(turnStartAge <= 29){
    const adv = advanceStructuredTime(actionText);
    timeCtx = { structured:true, label: adv.toLabel, jump: adv.bigJump ? {from:adv.fromLabel, to:adv.toLabel} : null, monthsCrossed: adv.monthsCrossed||0 };
  }
  render(true);

  const forceEnding = state.age >= state.lifeExpectancy;
  try{
    const result = USE_MOCK ? await mockCallAI(actionText, forceEnding, timeCtx) : await callAI(actionText, forceEnding, timeCtx);
    applyResult(result, timeCtx);
  }catch(e){
    console.error(e);
    applySnapshot();
    state.log.push({age:state.age, timeLabel:null, text:"（旁白剛剛恍神了一下，這回合沒講清楚——原因："+e.message+"）"});
  }
  saveGame();
  render();
}

function applyResult(r, timeCtx){
  const s = state;
  const structured = !!(timeCtx && timeCtx.structured);
  const ageAtEvent = s.age; // 非結構化時間下的年齡（尚未套用 age_advance 之前）
  if(!structured){
    s.age = clamp(s.age + (r.age_advance||0), s.age, 130);
  }
  // structured=true 時，s.age 在呼叫AI之前就已經由 advanceStructuredTime() 算好了，這裡不再套用 r.age_advance
  const d = r.stat_deltas||{};
  s.stats.health = clamp(s.stats.health + (d.health||0), 0, 100);
  const wisdomMult = 0.5 + (s.wisdom/200);
  const logicBonus = 1 + (s.logicAbility/400);
  const knowledgeDelta = (d.knowledge||0) * wisdomMult * logicBonus;
  s.stats.knowledge = clamp(s.stats.knowledge + knowledgeDelta, 0, 100);
  s.stats.network = clamp(s.stats.network + (d.network||0), 0, 100);
  s.stats.expression = clamp(s.stats.expression + (d.expression||0), 0, 100);
  s.happiness += (r.happiness_delta||0);

  // 氣質被動成長（呼應才識/表達力提升、財務狀況、隨時間累積），外表=顏值+氣質
  let tempGrowth = 0;
  if(knowledgeDelta>3) tempGrowth+=1;
  if((d.expression||0)>3) tempGrowth+=1;
  s.temperament = clamp(s.temperament+tempGrowth,0,100);
  s.appearance = clamp(Math.round(s.looks*0.5+s.temperament*0.5),0,100);

  // 健康連續偏低追蹤（呼應3.5.1過勞/憂鬱觸發門檻，僅供AI參考，不強制觸發）
  s.lowHealthStreak = s.stats.health<30 ? s.lowHealthStreak+1 : 0;

  const as = r.attachment_shift||{};
  s.anxiety = clamp(s.anxiety + (as.anxiety||0), 0, 100);
  s.avoidance = clamp(s.avoidance + (as.avoidance||0), 0, 100);
  s.peerPosition = clamp(s.peerPosition + (r.peer_position_shift||0), 0, 100);

  const cs = r.conscientiousness_shift||{};
  ["selfDiscipline","prudence","achievement","responsibility","teamSolo"].forEach(k=>{
    s.conscientiousness[k] = clamp(s.conscientiousness[k]+(cs[k]||0),0,100);
  });

  if(r.revealed_key_event && s.keyEvent) s.keyEvent.revealed = true;
  if(r.college_location_choice && !s.collegeLocation) s.collegeLocation = r.college_location_choice;
  if(r.foreshadow_death) s.deathForeshadowed = true;

  // 財富真實金額制：先用「跨過的月份數」結算舊的月收支，再套用這回合新的職業/支出/一次性交易
  const monthsCrossed = structured ? (timeCtx.monthsCrossed||0) : Math.round((r.age_advance||0)*12);
  if(monthsCrossed>0){
    const totalExpenses = s.monthlyExpenses.reduce((sum,e)=>sum+e.amount,0);
    const net = Math.round((s.monthlyIncome - totalExpenses) * monthsCrossed);
    s.savings += net;
    s.lastSettlement = { months: monthsCrossed, net, income:s.monthlyIncome, expenses:totalExpenses };
  } else {
    s.lastSettlement = null;
  }

  if(r.job_change && r.job_change.occupation_category){
    s.occupationCategory = r.job_change.occupation_category;
    if(typeof r.job_change.monthly_salary === "number") s.monthlyIncome = r.job_change.monthly_salary;
    const riskyCats = ["勞力/服務業","長期不在身邊","軍公教警消","自由接案"];
    s.riskyLifestyle = riskyCats.includes(s.occupationCategory);
  }
  (r.expense_change||[]).forEach(ec=>{
    if(!ec.label) return;
    if(ec.action==="end"){
      s.monthlyExpenses = s.monthlyExpenses.filter(e=>e.label!==ec.label);
    } else {
      const existing = s.monthlyExpenses.find(e=>e.label===ec.label);
      if(existing) existing.amount = ec.monthly_amount ?? existing.amount;
      else s.monthlyExpenses.push({ label:ec.label, amount: ec.monthly_amount||0 });
    }
  });
  (r.one_time_transaction||[]).forEach(tx=>{
    if(typeof tx.amount === "number") s.savings += tx.amount;
  });
  if(r.housing_choice && r.housing_choice.type){
    s.housing = { type:r.housing_choice.type, monthlyCost:r.housing_choice.monthly_amount||0 };
    s.monthlyExpenses = s.monthlyExpenses.filter(e=>e.label!=="房租" && e.label!=="房貸");
    if(r.housing_choice.monthly_amount>0){
      s.monthlyExpenses.push({ label: r.housing_choice.type==="own" ? "房貸" : "房租", amount:r.housing_choice.monthly_amount });
    }
  }

  (r.new_characters||[]).forEach(nc=>{
    if(!nc.name) return;
    const exists = s.characters.find(c=>c.name===nc.name);
    if(exists){ exists.active=true; exists.lastTurn=s.turnCount; return; }
    s.characters.push({
      name:nc.name, relation:nc.relation||"", traits:nc.traits||"",
      affinity: clamp(nc.initial_affinity ?? 50,0,100),
      summary:"", lastTurn:s.turnCount, active:true, isChild:!!nc.is_child
    });
  });
  (r.character_updates||[]).forEach(cu=>{
    const c = s.characters.find(x=>x.name===cu.name);
    if(!c) return;
    c.affinity = clamp(c.affinity + (cu.affinity_delta||0),0,100);
    if(cu.summary_add){ c.summary = (c.summary? c.summary+"；":"") + cu.summary_add; }
    c.lastTurn = s.turnCount; c.active = true;
  });
  demoteStaleCharacters();

  const tagAge = structured ? s.age : ageAtEvent;
  const tagLabel = structured ? timeCtx.label : null;

  if(r.major_event_summary){
    s.chronicle.push(`（${tagLabel || (tagAge+"歲")}）${r.major_event_summary}`);
    if(s.chronicle.length>10) s.chronicle.shift();
  }

  s.log.push({age:tagAge, timeLabel:tagLabel, text:r.narrative, settlement:s.lastSettlement});
  if(s.log.length>60) s.log.shift();

  s.choices = r.choices || [];

  if(r.is_ending){
    s.phase = "ending";
    s.ending = { title:r.ending_title||"平凡一生", summary:r.ending_summary||"", successionAvailable: !!r.succession_available };
  }
}

function startLife(){
  state.phase = "playing";
  render(true);
  takeTurn("（人生正式開始：15歲的你，站在高中入學前的暑假尾聲。）", 0);
}

function reincarnate(){
  const bonusStat = pick(["health","knowledge","network","expression","savings"]);
  const carry = { reincarnations:(state.reincarnations||0)+1,
    chronicleCarry: `前世為「${state.ending?.title||"一生"}」，帶著一絲餘蔭轉生。`,
    name: state.name, gender: state.gender };
  if(bonusStat==="savings") carry.savingsCarry = 5000; else carry[bonusStat] = 8;
  state = newRoll(carry, null);
  saveGame();
  render();
}

function economicTierForSavingsAmount(savings){
  if(savings<200000) return "清寒";
  if(savings<3000000) return "小康";
  return "富裕";
}
function rollEconomicTierForced(tier){
  if(tier==="清寒") return { tier, network:rnd(15,35), allowance:rnd(300,800), savings:rnd(200,1000) };
  if(tier==="小康") return { tier, network:rnd(30,55), allowance:rnd(1500,3000), savings:rnd(1000,3000) };
  return { tier:"富裕", network:rnd(50,75), allowance:rnd(5000,9000), savings:rnd(3000,8000) };
}
function deriveParentTraitFromAffinity(aff, summary){
  let tone;
  if(aff>=70) tone = "跟你感情很好，願意溝通、給空間、支持你的決定";
  else if(aff>=45) tone = "感情普通，日常互動平淡但不算疏離";
  else tone = "感情有些疏遠，報喜不報憂、情感表達少";
  return summary ? tone+"；過去點滴："+summary : tone;
}
function eligibleChildren(){
  return state.characters.filter(c=>c.isChild);
}
function succeedAsChild(childName){
  const prev = state;
  const child = prev.characters.find(c=>c.name===childName && c.isChild);
  if(!child) return;
  const spouse = prev.characters.find(c=>/配偶|伴侶|先生|太太|老公|老婆/.test(c.relation||""));
  const otherKids = prev.characters.filter(c=>c.isChild && c.name!==childName);

  const deceasedRelation = prev.gender==="男" ? "父親" : "母親";
  const characters = [];
  characters.push({
    name: prev.name, relation: deceasedRelation,
    traits: deriveParentTraitFromAffinity(child.affinity, child.summary),
    affinity: child.affinity, summary: child.summary||"", lastTurn:0, active:true, isChild:false
  });
  let familyStructure;
  if(spouse){
    characters.push({
      name: spouse.name, relation: deceasedRelation==="父親" ? "母親" : "父親",
      traits: spouse.traits||"忙碌但關心家裡", affinity: spouse.affinity, summary: spouse.summary||"",
      lastTurn:0, active:true, isChild:false
    });
    familyStructure = "雙親同住";
  } else {
    familyStructure = "單親－喪親";
  }
  otherKids.forEach(k=>{
    characters.push({
      name:k.name, relation: pick(SIBLING_RELATIONS),
      traits: (k.traits||"")+"（同樣是上一代留下的孩子）", affinity: clamp(k.affinity+rnd(-10,10),0,100),
      summary:k.summary||"", lastTurn:0, active:true, isChild:false
    });
  });

  const econ = rollEconomicTierForced(economicTierForSavingsAmount(prev.savings));
  const wisdom = rnd(30,70);
  const logicAbility = clamp(Math.round(wisdom*0.3+rnd(-10,10)),0,100);
  const talent = clamp(Math.round(wisdom*0.6+rnd(-5,5)),0,100);
  const health = rnd(45,90);
  const looks = rnd(20,90);
  const luckHidden = +(0.85+Math.random()*0.3).toFixed(2);
  const lifeExpectancy = rnd(70,88);
  const attach = rollAttachmentBaseline(null);
  const peerPosition = rollPeerPosition();
  const expression = rollSocialStart(null, peerPosition);
  const temperament = rollSocialStart(null, peerPosition);
  const appearance = clamp(Math.round(looks*0.5+temperament*0.5),0,100);
  const personalityStyle = pick(PERSONALITY_STYLES);
  const childGender = child.relation==="女兒" ? "女" : child.relation==="兒子" ? "男" : pick(["男","女"]);

  state = {
    version:4, phase:"setup",
    name: child.name, gender: childGender,
    age:15, lifeExpectancy, luckHidden,
    family: econ.tier, familyStructure, isPoliticianChild:false,
    collegeLocation:null,
    timeState:{ stageMode:"highschool", segmentIndex:0, yearInStage:1, careerYear:1, careerHalf:0 },
    anxiety:attach.anxiety, avoidance:attach.avoidance, peerPosition, peerPositionSpecial:null,
    keyEvent:null,
    wisdom, logicAbility, looks, temperament, appearance, personalityStyle,
    conscientiousness:{ selfDiscipline:50, prudence:50, achievement:50, responsibility:50, teamSolo:50 },
    stats:{ health, knowledge:talent, network:econ.network, expression },
    savings: econ.savings, monthlyIncome: econ.allowance, monthlyExpenses:[],
    occupationCategory:null, housing:null, fertilityJourney:null,
    lowHealthStreak:0, riskyLifestyle:false, deathForeshadowed:false,
    happiness:50, actionPoints:20, maxActionPoints:20, turnCount:0,
    characters,
    chronicle: [`（傳承）延續上一世「${prev.ending?.title||"一生"}」的血脈，成為${prev.name}的${child.relation}。`],
    log:[], choices:[], reincarnations:(prev.reincarnations||0)+1,
    undosLeft:3, snapshot:null, ending:null
  };
  saveGame();
  render();
}

function refillDemo(){
  state.actionPoints = state.maxActionPoints;
  document.getElementById("paywall-modal")?.remove();
  saveGame(); render();
}

function hardReset(){
  state = null;
  window.storage.delete(STORAGE_KEY, false).catch(()=>{});
  render();
}

// ---------- RENDER ----------
function render(loadingTurn){
  const app = document.getElementById("app");
  if(!state){ app.innerHTML = renderSetupIntro(); bindSetupIntro(); return; }
  if(state.phase==="identity"){ app.innerHTML = renderIdentityForm(); bindIdentityForm(); return; }
  if(state.phase==="setup"){ app.innerHTML = renderSetupRoll(); bindSetupRoll(); return; }
  if(state.phase==="ending"){ app.innerHTML = renderEnding(); bindEnding(); return; }
  app.innerHTML = renderPlaying(loadingTurn);
  bindPlaying();
  const j = document.querySelector(".journal");
  if(j) j.scrollTop = j.scrollHeight;
}

  return String(str).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

}

function renderEnding(){
  const s = state;
  const kids = eligibleChildren();
  const canSucceed = s.ending.successionAvailable && kids.length>0;
  return `
  <div class="center-screen">
    <div class="stamp" style="margin:0 auto 14px;"><b>${s.age}</b>歲</div>
    <div class="end-title">${escapeHtml(s.ending.title)}</div>
    <p style="font-size:14.5px;">${escapeHtml(s.ending.summary)}</p>
    <div class="roll-grid">
      <div class="roll-item"><div class="k">存款</div><div class="v" style="font-size:15px;">NT$${s.savings.toLocaleString()}</div></div>
      <div class="roll-item"><div class="k">健康</div><div class="v">${s.stats.health}</div></div>
      <div class="roll-item"><div class="k">才識</div><div class="v">${s.stats.knowledge}</div></div>
      <div class="roll-item"><div class="k">人脈</div><div class="v">${s.stats.network}</div></div>
      <div class="roll-item"><div class="k">福緣</div><div class="v">${s.luckHidden}</div></div>
      <div class="roll-item"><div class="k">羈絆</div><div class="v">${s.characters.length}</div></div>
    </div>
    ${canSucceed ? `
    <div class="roll-item" style="text-align:left;margin-bottom:14px;">
      <div class="k">延續下一世——選一位孩子接續</div>
      ${kids.map(k=>`<button class="choice-btn" data-child="${escapeHtml(k.name)}" style="padding-left:8px;">${escapeHtml(k.name)}（${escapeHtml(k.relation)}）</button>`).join("")}
    </div>` : ``}
    <button class="primary-btn" id="btn-reincarnate">服下轉世丹，重新投胎</button>
    <button class="ghost-btn" id="btn-reset-end">就此闔卷</button>
  </div>`;
}
function bindEnding(){
  document.getElementById("btn-reincarnate").onclick = reincarnate;
  document.getElementById("btn-reset-end").onclick = hardReset;
  document.querySelectorAll(".choice-btn[data-child]").forEach(btn=>{
    btn.onclick = ()=> succeedAsChild(btn.dataset.child);
  });
}

loadGame();
</script>
</body>
</html>
