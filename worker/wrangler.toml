# 一、1.2.9.14（2026-09-24新增）：改用wrangler部署(簡轉繁需要OpenCC，線上編輯器貼不進去)，步驟見README.md
name = "life-game"            # 對應 https://life-game.smile80275.workers.dev/
main = "worker.js"
compatibility_date = "2025-06-01"
keep_vars = true              # 保留Cloudflare後台既有的變數設定

# 2026-10-09：打開Workers Logs(後台Worker頁面的Logs分頁)，AI呼叫失敗時的狀態碼與錯誤訊息會寫在這裡。
# 寫在設定檔裡，部署時才不會把後台打開的開關蓋掉
[observability]
enabled = true

# 跨裝置存檔用的KV(程式碼裡的env.SAVES)。⚠️第一次部署前要把id換成實際值：
#   npx wrangler kv namespace list   → 找到目前綁定在這個Worker上的那個namespace(例如life-game-saves)，複製它的id
# 不填或填錯，部署後存檔/讀檔/行動點功能會壞掉
[[kv_namespaces]]
binding = "SAVES"
id = "37cd1995c1d14cc983237952adb5b667"

# ANTHROPIC_API_KEY不寫在這裡，用 npx wrangler secret put ANTHROPIC_API_KEY 設定

# 十、10.8（2026-09-29）：封測期間暫停雲端存檔。"false"時Worker完全不碰KV(存檔類路徑回503、AI代理不檢查行動點、不記成本遙測)。
# 重新打開＝改成"true"並重新部署，同時把index.html的CLOUD_SAVE_DEFAULT改成true；打開前要先完成QA手冊34.12的KV用量修正並回報每回合寫入次數
[vars]
CLOUD_SAVE_ENABLED = "false"

# 十、10.8（2026-09-29）：雲端存檔關閉期間的頻率限制，用Cloudflare內建Rate Limiting(不經KV)：同一IP每60秒最多30次請求。
# 一回合最多呼叫AI 5次(含重新生成)，30次足夠正常遊玩。namespace_id是自訂的整數，同帳號內不要跟別的Worker重複
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# 十、10.9.3.3（2026-09-30，第一批）：全站當天AI用量計數，用Durable Object(SQLite)存，不是KV，不增加每回合KV寫入。
# 可調設定值只放Cloudflare後台Variables：DAILY_SPEND_CAP(預設500；第一批叫DAILY_SPEND_CAP_TWD，舊名稱後台若還留著仍認得)、DAILY_GIFT_CAP(預設20)、
# DAILY_VERIFY_EMAIL_CAP(預設80)、AI_CALL_COST_ESTIMATE(預設1)、ADMIN_NOTIFY_EMAIL；寄信金鑰RESEND_API_KEY是secret。
# ⚠️不要寫進這個檔案：keep_vars=true才不會被下次部署蓋掉後台改過的值。查看：GET /usage-today(同USAGE_ADMIN_TOKEN)。
# 2026-09-30第二批起這個計數器也負責「碰到上限擋人」與管理通知信(gate.js)；完整設定步驟見repo根目錄「設定說明_帳號與寄信.md」
[[durable_objects.bindings]]
name = "USAGE_COUNTER"
class_name = "UsageCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter"]

# 十、10.2／10.9.2（2026-09-30，第二批）：帳號系統用Durable Object(SQLite)存——信箱、驗證碼、登入狀態、共用錢包、啟程禮份數與排隊、寄信次數。
# 不是KV，所以不增加KV寫入，雲端存檔關閉時也能用。新增的類別要用新的migration(tag v2)，不能改上面已經部署過的v1。
# 寄信金鑰RESEND_API_KEY(secret)與DAILY_SPEND_CAP等設定值只放Cloudflare後台，⚠️不要寫進這個檔案(keep_vars=true才不會被下次部署蓋掉)
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountStore"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AccountStore"]

# 十、10.13.3（2026-10-03補充二）：每日排程清理孤兒封存包(寫入超過STAGE_PACK_ORPHAN_DAYS天、這把金鑰仍沒有主存檔)。UTC 19:00＝台灣03:00。
# 可調設定值只放Cloudflare後台Variables(不寫進這個檔案)：STAGE_PACK_RATE_PER_HOUR(預設60，同一來源位址每小時封存包寫入上限)、STAGE_PACK_ORPHAN_DAYS(預設7)。
# 每次執行後，清理數量寫進Worker執行紀錄(「孤兒封存包清理：檢查N個，刪除M個」)
[triggers]
crons = ["0 19 * * *", "0 * * * *"]

# 十、10.15（2026-10-04封測名額與候補）：上面第二個排程「0 * * * *」＝每小時整點，負責寄候補通知信(分配當天台灣時間中午12:00起，失敗每小時重試最多3次)與檢查點通知信。
# 名額與候補隊伍的分配不靠排程(台灣時間每天第一次有人碰到就會做)，排程只是確保信準時寄出。
# 兩個可調數字只放Cloudflare後台Variables(⚠️不要寫進這個檔案)：DAILY_NEW_PLAYER_CAP(每日新玩家名額，預設5，0＝暫停發放)、BETA_PLAYER_CHECKPOINT(累計入場檢查點，預設50)
